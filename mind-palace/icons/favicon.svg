<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#2D2B26" />
      <stop offset="65%" stop-color="#1D1C19" />
      <stop offset="100%" stop-color="#141311" />
    </radialGradient>
    <linearGradient id="goldMain" gradientUnits="userSpaceOnUse" x1="100" y1="115" x2="412" y2="395">
      <stop offset="0%" stop-color="#F3DDB2" />
      <stop offset="52%" stop-color="#D4AE6E" />
      <stop offset="100%" stop-color="#A87C3D" />
    </linearGradient>
    <linearGradient id="goldSoft" gradientUnits="userSpaceOnUse" x1="46" y1="46" x2="466" y2="466">
      <stop offset="0%" stop-color="#E8CCA0" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#B98A46" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <!-- Opaque deep-ink backdrop (iOS applies its own squircle mask) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle architectural hairline frame inside iOS safe zone -->
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="url(#goldSoft)" stroke-width="2" />

  <!-- Minimalist Palace Pediment + Twin-Arch Colonnade (subtle M silhouette) -->
  <g fill="none" stroke="url(#goldMain)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Classical Pediment Roof -->
    <path d="M 118 206 L 256 126 L 394 206" stroke-width="11" />
    <path d="M 164 206 L 256 152 L 348 206" stroke-width="3.5" stroke-opacity="0.45" />
    <!-- Keystone warm-ivory dot -->
    <circle cx="256" cy="180" r="6" fill="#F3DDB2" stroke="none" />

    <!-- Architrave Beam -->
    <line x1="122" y1="224" x2="390" y2="224" stroke-width="7.5" stroke-opacity="0.82" />

    <!-- Twin Inner Arches (01 认知 · 02 成果) -->
    <path d="M 164 346 L 164 282 A 46 46 0 0 1 256 282 L 256 346" stroke-width="9.5" />
    <path d="M 256 346 L 256 282 A 46 46 0 0 1 348 282 L 348 346" stroke-width="9.5" />

    <!-- Stepped Plinth Base -->
    <line x1="126" y1="354" x2="386" y2="354" stroke-width="9.5" />
    <line x1="106" y1="378" x2="406" y2="378" stroke-width="10.5" stroke-opacity="0.88" />
  </g>
</svg>
