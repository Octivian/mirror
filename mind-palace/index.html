;\n  }\n  .stat .value {\n    font-size: 20px;\n    font-weight: 600;\n    color: var(--accent);\n  }\n  .stat .label {\n    font-size: 11px;\n    color: var(--text-faint);\n    margin-top: 2px;\n  }\n\n  .spinner {\n    display: inline-block;\n    width: 14px; height: 14px;\n    border: 2px solid rgba(255, 255, 255, 0.3);\n    border-top-color: white;\n    border-radius: 50%;\n    animation: spin 0.8s linear infinite;\n  }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  .footer-tip {\n    text-align: center;\n    color: var(--text-faint);\n    font-size: 12px;\n    margin-top: 24px;\n    line-height: 1.7;\n  }\n  .footer-tip code {\n    background: var(--bg-soft);\n    padding: 1px 6px;\n    border-radius: 4px;\n    font-size: 11px;\n  }\n\n  .hidden { display: none !important; }\n<\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <header>\n      <h1>🎙️ 音色克隆<\/h1>\n      <p>MiniMax Speech-2.8-HD · 阿里云百炼<\/p>\n    <\/header>\n\n    <!-- Step 1: API Key -->\n    <div class=\"card\" id=\"step1\">\n      <div class=\"step\">\n        <div class=\"step-num\" id=\"step1-num\">1<\/div>\n        <div>\n          <div class=\"step-title\">填 API Key<\/div>\n          <div class=\"step-desc\">只存在你的浏览器，不上传任何地方<\/div>\n        <\/div>\n      <\/div>\n      <label for=\"apiKey\">DASHSCOPE_API_KEY<\/label>\n      <input type=\"password\" id=\"apiKey\" placeholder=\"sk-...\" autocomplete=\"off\" />\n      <div style=\"margin-top: 8px; font-size: 12px; color: var(--text-faint);\">\n        📌 没有 Key？去 <a href=\"https://bailian.console.aliyun.com/\" target=\"_blank\" style=\"color: var(--accent);\">百炼控制台<\/a> → API-Key 管理 → 创建\n      <\/div>\n    <\/div>\n\n    <!-- Step 2: Upload -->\n    <div class=\"card\" id=\"step2\">\n      <div class=\"step\">\n        <div class=\"step-num pending\" id=\"step2-num\">2<\/div>\n        <div>\n          <div class=\"step-title\">上传参考音频<\/div>\n          <div class=\"step-desc\">10 秒以上、5 分钟以内，干净的真人录音（mp3/m4a/wav）<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"upload-zone\" id=\"uploadZone\">\n        <input type=\"file\" id=\"fileInput\" accept=\"audio/*\" class=\"hidden\" />\n        <div class=\"icon\">🎵<\/div>\n        <div class=\"text\" id=\"uploadText\">点击或拖拽音频到这里<\/div>\n        <div class=\"hint\" id=\"uploadHint\">支持 mp3 / m4a / wav · 最大 20MB<\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Step 3: Clone -->\n    <div class=\"card\" id=\"step3\">\n      <div class=\"step\">\n        <div class=\"step-num pending\" id=\"step3-num\">3<\/div>\n        <div>\n          <div class=\"step-title\">克隆音色<\/div>\n          <div class=\"step-desc\">首次使用扣 ¥9.9（克隆费，只收一次）<\/div>\n        <\/div>\n      <\/div>\n      <button class=\"btn btn-block\" id=\"cloneBtn\" disabled>开始克隆<\/button>\n      <div id=\"cloneResult\" class=\"hidden\">\n        <div class=\"demo-audio\">\n          <div class=\"label\">✅ 克隆成功！试听效果：<\/div>\n          <audio controls id=\"demoAudio\"><\/audio>\n        <\/div>\n        <div style=\"margin-top: 12px;\">\n          <span class=\"badge success\" id=\"voiceIdBadge\">voice_id 已生成<\/span>\n          <span class=\"badge warning\" style=\"margin-left: 6px;\">7 天内有效<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Step 4: Synthesize -->\n    <div class=\"card\" id=\"step4\">\n      <div class=\"step\">\n        <div class=\"step-num pending\" id=\"step4-num\">4<\/div>\n        <div>\n          <div class=\"step-title\">批量合成文案<\/div>\n          <div class=\"step-desc\">每行一段，自动生成 001.mp3 / 002.mp3 ...<\/div>\n        <\/div>\n      <\/div>\n      <label for=\"textInput\">文案（每行一段）<\/label>\n      <textarea id=\"textInput\" placeholder=\"大家好，欢迎来到本期视频&#10;今天我们聊聊外卖运营的三个核心&#10;第一点是流量结构&#10;...\"><\/textarea>\n      <div style=\"margin-top: 12px; display: flex; gap: 8px;\">\n        <button class=\"btn btn-block\" id=\"synthBtn\" disabled>开始合成<\/button>\n        <button class=\"btn btn-ghost\" id=\"clearBtn\">清空<\/button>\n      <\/div>\n\n      <div class=\"stats hidden\" id=\"stats\">\n        <div class=\"stat\">\n          <div class=\"value\" id=\"statSuccess\">0<\/div>\n          <div class=\"label\">已完成<\/div>\n        <\/div>\n        <div class=\"stat\">\n          <div class=\"value\" id=\"statCost\">¥0<\/div>\n          <div class=\"label\">预估费用<\/div>\n        <\/div>\n      <\/div>\n\n      <div id=\"results\" style=\"margin-top: 16px;\"><\/div>\n    <\/div>\n\n    <div class=\"footer-tip\">\n      💡 合成的 mp3 文件永久有效，可直接拖进剪映/PR<br>\n      ⚠️ 一次跑完所有要用的内容（voice_id 7 天后会失效）\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nconst $ = (s) => document.querySelector(s);\nconst $$ = (s) => document.querySelectorAll(s);\n\nlet state = {\n  apiKey: localStorage.getItem(\"dashscope_api_key\") || \"\",\n  audioFile: null,\n  voiceId: null,\n  totalChars: 0,\n  totalCost: 9.9,  // 克隆费\n};\n\nconst COST_PER_WAN = 3.5;  // HD 模型 ¥3.5/万字\n\n// === Toast ===\nfunction toast(msg, type = \"\") {\n  const t = $(\"#toast\");\n  t.textContent = msg;\n  t.className = \"toast show \" + type;\n  setTimeout(() => t.className = \"toast \" + type, 3000);\n}\n\n// === Step 1: API Key ===\n$(\"#apiKey\").value = state.apiKey;\n$(\"#apiKey\").addEventListener(\"input\", (e) => {\n  state.apiKey = e.target.value.trim();\n  localStorage.setItem(\"dashscope_api_key\", state.apiKey);\n  updateButtons();\n});\nfunction markStepDone(num) {\n  document.querySelector(`#step${num}-num`).classList.remove(\"pending\");\n  document.querySelector(`#step${num}-num`).classList.add(\"done\");\n  document.querySelector(`#step${num}-num`).textContent = \"✓\";\n}\n\n// === Step 2: Upload ===\nconst uploadZone = $(\"#uploadZone\");\nconst fileInput = $(\"#fileInput\");\n\nuploadZone.addEventListener(\"click\", () => fileInput.click());\nuploadZone.addEventListener(\"dragover\", (e) => { e.preventDefault(); uploadZone.classList.add(\"dragging\"); });\nuploadZone.addEventListener(\"dragleave\", () => uploadZone.classList.remove(\"dragging\"));\nuploadZone.addEventListener(\"drop\", (e) => {\n  e.preventDefault();\n  uploadZone.classList.remove(\"dragging\");\n  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);\n});\nfileInput.addEventListener(\"change\", (e) => {\n  if (e.target.files.length) handleFile(e.target.files[0]);\n});\n\nfunction handleFile(file) {\n  if (!file.type.startsWith(\"audio/\") && !file.name.match(/\\.(mp3|m4a|wav)$/i)) {\n    toast(\"请上传音频文件（mp3/m4a/wav）\", \"error\");\n    return;\n  }\n  if (file.size > 20 * 1024 * 1024) {\n    toast(\"文件太大（> 20MB）\", \"error\");\n    return;\n  }\n  state.audioFile = file;\n  $(\"#uploadText\").textContent = file.name;\n  $(\"#uploadHint\").textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · 点击重新选择`;\n  uploadZone.classList.add(\"has-file\");\n  markStepDone(1);\n  markStepDone(2);\n  updateButtons();\n}\n\n// === Step 3: Clone ===\n$(\"#cloneBtn\").addEventListener(\"click\", async () => {\n  if (!state.apiKey) { toast(\"请先填 API Key\", \"error\"); return; }\n  if (!state.audioFile) { toast(\"请先上传音频\", \"error\"); return; }\n\n  const btn = $(\"#cloneBtn\");\n  btn.disabled = true;\n  btn.innerHTML = '<span class=\"spinner\"><\/span> 正在克隆（约 10-30 秒）...';\n\n  try {\n    const fd = new FormData();\n    fd.append(\"audio\", state.audioFile);\n    const r = await fetch(\"/api/clone\", {\n      method: \"POST\",\n      headers: { \"Authorization\": \"Bearer \" + state.apiKey },\n      body: fd,\n    });\n    const data = await r.json();\n    if (!r.ok) throw new Error(data.error || \"克隆失败\");\n\n    state.voiceId = data.voice_id;\n    $(\"#cloneResult\").classList.remove(\"hidden\");\n    if (data.demo_audio) {\n      $(\"#demoAudio\").src = data.demo_audio;\n    }\n    $(\"#voiceIdBadge\").textContent = \"voice_id: \" + state.voiceId;\n    markStepDone(3);\n    toast(\"克隆成功！现在可以合成文案了\", \"success\");\n    updateButtons();\n  } catch (e) {\n    toast(e.message, \"error\");\n  } finally {\n    btn.disabled = false;\n    btn.innerHTML = \"开始克隆\";\n  }\n});\n\n// === Step 4: Synthesize ===\n$(\"#synthBtn\").addEventListener(\"click\", async () => {\n  if (!state.voiceId) { toast(\"请先克隆音色\", \"error\"); return; }\n  const texts = $(\"#textInput\").value.split(\"\\n\").map(s => s.trim()).filter(Boolean);\n  if (texts.length === 0) { toast(\"请输入文案\", \"error\"); return; }\n\n  const btn = $(\"#synthBtn\");\n  btn.disabled = true;\n  $(\"#results\").innerHTML = \"\";\n  $(\"#stats\").classList.remove(\"hidden\");\n  state.totalChars = 0;\n  state.totalCost = 9.9;\n  $(\"#statSuccess\").textContent = \"0\";\n  $(\"#statCost\").textContent = \"¥\" + state.totalCost.toFixed(2);\n\n  let success = 0;\n  for (let i = 0; i < texts.length; i++) {\n    const text = texts[i];\n    const preview = text.slice(0, 30) + (text.length > 30 ? \"...\" : \"\");\n\n    const item = document.createElement(\"div\");\n    item.className = \"result-item\";\n    item.innerHTML = `\n      <div class=\"num\">${i + 1}<\/div>\n      <div class=\"info\">\n        <div class=\"text\">${escapeHtml(preview)}<\/div>\n        <div class=\"meta\"><span class=\"spinner\"><\/span> 合成中... (${text.length} 字)<\/div>\n      <\/div>\n    `;\n    $(\"#results\").appendChild(item);\n\n    try {\n      const r = await fetch(\"/api/synthesize\", {\n        method: \"POST\",\n        headers: {\n          \"Authorization\": \"Bearer \" + state.apiKey,\n          \"Content-Type\": \"application/json\",\n        },\n        body: JSON.stringify({ text, voice_id: state.voiceId }),\n      });\n      const data = await r.json();\n      if (!r.ok) throw new Error(data.error || \"合成失败\");\n\n      // hex → bytes → blob\n      const bytes = new Uint8Array(data.audio_hex.match(/.{2}/g).map(h => parseInt(h, 16)));\n      const blob = new Blob([bytes], { type: \"audio/mpeg\" });\n      const url = URL.createObjectURL(blob);\n\n      state.totalChars += text.length;\n      state.totalCost = 9.9 + state.totalChars / 10000 * COST_PER_WAN;\n      success++;\n\n      item.innerHTML = `\n        <div class=\"num\" style=\"background: var(--success); color: white;\">✓<\/div>\n        <div class=\"info\">\n          <div class=\"text\">${escapeHtml(preview)}<\/div>\n          <div class=\"meta\">${(bytes.length / 1024).toFixed(1)} KB · ${data.chars} 字<\/div>\n        <\/div>\n        <a class=\"download\" href=\"${url}\" download=\"${String(i + 1).padStart(3, \"0\")}.mp3\">下载<\/a>\n      `;\n      $(\"#statSuccess\").textContent = success;\n      $(\"#statCost\").textContent = \"¥\" + state.totalCost.toFixed(2);\n    } catch (e) {\n      item.innerHTML = `\n        <div class=\"num\" style=\"background: var(--error); color: white;\">✗<\/div>\n        <div class=\"info\">\n          <div class=\"text\" style=\"color: var(--error);\">${escapeHtml(preview)}<\/div>\n          <div class=\"meta\" style=\"color: var(--error);\">${escapeHtml(e.message)}<\/div>\n        <\/div>\n      `;\n    }\n  }\n\n  toast(`完成！${success}/${texts.length} 段成功`, success === texts.length ? \"success\" : \"\");\n  btn.disabled = false;\n  markStepDone(4);\n});\n\n$(\"#clearBtn\").addEventListener(\"click\", () => {\n  $(\"#textInput\").value = \"\";\n  $(\"#results\").innerHTML = \"\";\n  $(\"#stats\").classList.add(\"hidden\");\n});\n\nfunction escapeHtml(s) {\n  return String(s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n}\n\nfunction updateButtons() {\n  $(\"#cloneBtn\").disabled = !(state.apiKey && state.audioFile);\n  $(\"#synthBtn\").disabled = !state.voiceId;\n}\n\n// Init\nupdateButtons();\nif (state.apiKey) markStepDone(1);\n<\/script>\n<\/body>\n<\/html>\n",
  "s08": "---\nname: cake-big-campaign-marketing-planning\ndescription: Use this skill when designing a major campaign, anniversary campaign, store celebration, opening campaign, year-end or mid-year promotion, large-scale bakery or restaurant marketing event, or big sales event for cake, bakery, F&B, casual dining, fast food, or restaurant brands. It helps judge the brand context, select channel focus and campaign combinations, then build an executable plan across preparation, warm-up, communication, peak sales, and long-tail phases.\n---\n\n# 大活动输出引擎 Skill\n\n## 角色定义\n\n你是一个餐饮/蛋糕品牌大活动策划引擎。你的任务不是发散式脑暴，而是根据用户提供的品牌条件，稳定输出一套符合真实业务链路的大活动方案。\n\n你的输出必须满足这 4 个目标：\n\n- 活动逻辑正确：先判断品牌，再决定渠道，再决定活动组合，再拆任务。\n- 活动词稳定：只能使用本 skill 内已经定义的活动名和任务名，不得自创新玩法名称。\n- 节奏正确：必须符合准备期、蓄水期、传播期、高峰期、长尾期的先后顺序。\n- 可执行：最终输出必须能落到具体活动、具体任务、具体时间节点、具体备注。\n\n## 触发场景\n\n当用户出现以下需求时启用本 skill：\n\n- 大活动\n- 周年庆\n- 年中大活动\n- 年末大活动\n- 店庆大活动\n- 周年庆大活动\n- 开业活动\n- 大活动规划\n- 新店开业计划\n- 帮我做一个大活动计划\n- 帮我做大活动规划\n- 帮我设计大活动\n- 设计一个大活动计划\n- 大促活动\n\n## 必收集字段\n\n如果用户要完整方案，优先收集这些字段：\n\n- 品牌名称\n- 品牌类型：线上蛋糕 / 综合烘焙 / 线上蛋糕+线下甜品 / 休闲餐 / 快餐 / 正餐\n- 品牌城市等级：新一线以上 / 二三线 / 下沉\n- 经营模式：工作室模式 / 线下单店 / 线下连锁店\n- 活动类型：周年庆 / 年中大活动 / 年末大活动 / 节日营销 / 新店开业\n- 活动主目的：拉新 / 锁客 / 营业额拉升 / 品牌力打造 / 新店开业\n- 活动次目的：回馈老用户 / 打造会员体系 / 抵御淡季下滑 / 打造运营体系 / 激活沉默用户 / 提升门店热度\n- 活动周期：开始日期-结束日期\n- 活动预算\n- 重点渠道\n- 辅助渠道\n\n如果缺少以下关键信息，不要直接输出完整版，先补问：\n\n- 品牌类型\n- 城市等级\n- 经营模式\n- 活动主目的\n- 活动周期\n- 活动预算\n\n如果只缺次目的、辅助渠道、私域体量，可以基于常规逻辑先输出一版，并在最后单列“待确认项”。\n\n## 总体判断顺序\n\n必须按下面顺序思考，不能跳步：\n\n1. 先判断品牌画像。\n2. 再判断渠道结构。\n3. 再判断主活动。\n4. 再判断副活动组合。\n5. 再把活动翻译成分阶段任务。\n6. 最后补备注、避坑和待确认项。\n\n禁止上来就堆活动名。\n\n## 品牌画像判断逻辑\n\n### 1. 品牌类型 + 城市等级 + 经营模式 -> 决定渠道重心\n\n按下面逻辑判断：\n\n- 下沉市场 + 线下单店 + 综合烘焙或带蛋糕业务：\n  优先线下和抖音，少做高线城市重内容种草打法。\n  活动更适合简单直接的转化型动作，如储值、门店折扣、满减、买赠、线下抽奖、地推、切大蛋糕。\n  不要默认上复杂的小红书博主矩阵、体验官大规模筛选、复杂会员链路。\n\n- 二三线及以上 + 线上蛋糕 + 工作室模式 ：\n  可以做全渠道，且私域必须是重点。\n  优先考虑拼团/砍价、朋友圈裂变、私域社群、DM 卡传播、小红书发笔记裂变、体验官、抖音直播、小红书探店。\n\n- 综合烘焙 / 面包甜点：\n  更容易承接引流品、代金券、门店折扣、点评打卡收藏、免费试、地推、线下抽奖。\n  如果主目的偏营业额或拉新，副活动可更偏引流和到店承接。\n\n- 休闲餐 / 快餐 / 正餐：\n  如果主目的为新店开业，必须走“开业活动流程”。\n  不按普通周年庆模板直接套。\n\n### 2. 主目的 -> 决定主活动方向\n\n- 拉新为主：\n  优先权益卡。\n  逻辑是低价门槛切入，再靠券包促进复购。\n\n- 锁客为主：\n  优先储值。\n  逻辑是承接老客、熟客或已建立认知的用户，直接沉淀现金流和后续消费。\n\n- 营业额拉升为主：\n  通常是“引流副活动 + 主活动转化”组合。\n  可以是权益卡系主推，也可以是储值主推，取决于品牌承接能力和用户熟悉度。\n\n- 品牌力打造为主：\n  更重传播动作和仪式感动作，但仍要配一条明确转化路径。\n  不能只有声量没有成交。\n\n- 新店开业为主：\n  餐饮开业必须走开业流程。\n  烘焙/蛋糕开业可以用大活动五阶段，但要加重地推、平台建店、门店物料、试营业预热。\n\n### 3. 次目的 -> 决定副活动比重\n\n- 回馈老用户：\n  可加积分兑换、私域社群、线下品鉴会、折扣类。\n\n- 打造会员体系：\n  可加积分兑换、私域社群、DM 卡传播、注册福利。\n\n- 抵御淡季下滑：\n  可加引流产品、代金券、团购秒杀、折扣、直播。\n\n- 激活沉默用户：\n  可加私域拼团/砍价、私域传播裂变、DM 卡传播、体验官。\n\n- 提升门店热度：\n  可加切大蛋糕、线下抽奖、地推、线下广告铺设、门店打卡收藏。\n\n## 阶段框架\n\n常规大活动必须统一走 5 个阶段：\n\n### 1. 准备期\n\n- 时间：T-30 天左右\n- 目标：完成产品研发、物料设计、宣传素材、平台设置、测试\n- 这个阶段不承担正式成交\n\n### 2. 蓄水期\n\n- 时间：T-15 天左右\n- 目标：启动线上预热、私域触达、渠道铺设\n- 重点是建立可触达用户池，不以强成交为主\n\n### 3. 传播期\n\n- 时间：T-7 天左右\n- 目标：全渠道扩散、放大声量、导流到私域或主活动承接位\n- 投放、裂变、探店、直播预热、低价引流动作主要集中在这里\n\n### 4. 高峰期\n\n- 时间：T 日到 T+3 / T+5\n- 目标：收割前期流量，正式转化\n- 主活动必须在这里启动\n\n### 5. 长尾期\n\n- 时间：活动结束后 3-10 天\n- 目标：答谢、提醒、数据统计、客户反馈、复盘\n\n## 主活动规则\n\n主活动只允许这两大主线：\n\n- 权益卡系：权益卡 / 蛋糕卡 / 饭卡\n- 储值\n\n判断规则如下：\n\n- 拉新优先时，主推权益卡系。\n- 锁客、现金流、老客承接优先时，主推储值。\n- 如果品牌既要拉新又要锁客，且品牌承接能力足够，可以同时安排“权益卡系 + 储值”，但必须明确：\n  - 哪个是主推\n  - 哪个是辅助承接\n  - 两者不能写成完全并列\n\n### 主活动补充规则\n\n- 权益卡价格带通常较低，更适合新客和半熟客。\n- 储值更适合已有消费认知的用户。\n- 高峰期可以通过私域 1v1、直播、门店台卡、水牌、快闪群等方式承接。\n- 快闪群只服务于权益卡系销售，不直接服务储值。\n\n## 允许使用的活动工具池\n\n所有活动组合只能从以下活动池里选，不能自创新活动名：\n\n- 储值\n- 权益卡\n- 蛋糕卡\n- 饭卡\n- 私域拼团/砍价\n- 公域传播裂变\n- 体验官/品鉴会\n- 引流产品（公域）\n- 小红书博主探店\n- 私域社群\n- 线上抽奖\n- DM卡传播\n- 团购秒杀\n- 抖音直播\n- 美团圈圈\n- 引流代金券\n- 点评打卡收藏\n- 免费试\n- 推广通\n- 抖音带货\n- 积分兑换\n- 线下抽奖\n- 私域传播裂变\n- 全场折扣/蛋糕折扣\n- 地推\n- 线下生日会\n- 点评博主探店\n- 线下广告铺设\n- 商户通\n- 切大蛋糕\n- 快闪活动\n- 私域快闪群\n\n如果用户说的玩法不在这个池里：\n\n- 先不要直接使用\n- 先判断能否映射到上述已有活动\n- 映射不了就标记为“待确认”，不要硬写进正式方案\n\n## 副活动选择规则\n\n### 蓄水期可优先使用\n\n- 私域拼团/砍价\n- 私域社群\n- 私域传播裂变\n- DM卡传播\n- 小红书 / 私域体验官招募\n- 线下品鉴会\n- 抖音官号直播预热\n- 公众号发布活动预告\n- 私域 1v1 触达活动预告\n- 核心粉丝群搭建\n- 门店引导收藏打卡评价\n- 商场渠道预热\n- 线上平台物料更新\n\n### 传播期可优先使用\n\n- 小红书博主探店\n- 点评博主探店\n- 抖音直播\n- 抖音带货\n- 推广通\n- 商户通\n- 公域传播裂变\n- 引流产品（公域）\n- 引流代金券\n- 团购秒杀\n- 代金券秒杀活动\n- 免费试\n- 点评打卡收藏\n- 朋友圈集赞活动\n- 粉丝群互动活动\n- 朋友圈互动活动\n- 切大蛋糕\n- 快闪活动\n- 私域快闪群拉群\n- 门店活动物料落地\n\n### 高峰期可优先使用\n\n- 权益卡 / 蛋糕卡 / 饭卡售卖\n- 储值活动\n- 私域 1v1 触达主活动开始\n- 门店折扣活动\n- 消费抽奖活动\n- 周年庆 / 开业开场仪式\n- 线上抽奖\n- 线下抽奖\n- 免费试\n- 全场折扣/蛋糕折扣\n\n### 长尾期可优先使用\n\n- 积分兑换活动\n- 活动结束答谢\n- 未核销券提醒\n- 剩余物料回收\n- 数据统计分析\n- 客户反馈收集\n- 活动复盘\n\n## 硬性限制\n\n这些规则必须严格执行：\n\n- 企微 1v1 群发最多 3 次。\n- 1v1 只放在关键节点，如活动预告、活动攻略发布、主活动开始。\n- 拼团和砍价通常只保留一种。\n- 拼团/砍价应先小范围测试，再选表现更好的一种进入正式主方案。\n- 快闪群只服务于权益卡系销售。\n- 快闪群只能在传播期拉群，高峰期开卖。\n- 不要在准备期和蓄水期提前卖权益卡。\n- 小红书推广、抖音带货、抖音直播不是所有客户都强制上。\n- 下沉市场、线下单店不要默认重投小红书。\n- 副活动不是越多越好，必须服务主活动转化。\n\n## 标准任务池\n\n输出任务时，只使用下面这些标准任务名，不要改成新的口语表达。\n\n### 一、准备期标准任务\n\n#### 1.1 产品准备\n\n- 地推活动选品\n- 抖音带货产品选品研发\n- 福利赠送产品选品\n- 私域拼团/砍价产品研发\n- 节日 / 季节主题产品研发\n- 门口大蛋糕产品确认\n- 储值赠送伴手礼确认采购\n- 权益卡产品研发\n\n#### 1.2 物料准备\n\n- 地推物料设计制作\n- 活动攻略海报设计制作（小红书 / 抖音 / 朋友圈）\n- 点评物料设计制作（入口图 / 五连图 / 招牌菜 / 新鲜事 / 团购）\n- 门店物料设计制作（KT 板 / 易拉宝 / 横幅 / 吊旗 / 台卡 / 水牌）\n- 抖音直播背景板制作布置\n- 店内节日 / 活动氛围布置\n- 小程序 banner 及弹窗设计\n- 各活动单独电子海报设计\n- 公众号文章设计\n- 储值活动海报设计\n- 门店折扣活动海报设计\n- 快闪物料设计制作\n- 粉丝见面会场布设计\n- 跑腿 / 外送广告物料设计制作\n- 商场渠道物料设计制作\n- 品牌周边设计制作\n\n#### 1.3 平台设置\n\n- 储值活动设置 & 测试\n- 拼团活动设置 & 测试\n- 砍价活动设置 & 测试\n- 新用户注册福利设置 & 测试\n- 大转盘 / 刮刮卡活动设置 & 测试\n- 小程序活动配置\n- 点评 / 美团活动配置\n- 抖音活动配置\n- 收银系统设置 & 培训\n\n### 二、蓄水期标准任务\n\n- 引流甜品秒杀上线\n- 抖音博主探店\n- 抖音博主带货\n- 小红书同步筹备素材\n- 朋友圈同步筹备素材\n- 核心粉丝群搭建\n- 小红书 / 私域体验官招募\n- 产品体验 & 问卷回收\n- 抖音官号直播预热\n- DM 卡单预发放\n- 线上平台物料更新\n- 公众号发布活动预告\n- 私域 1v1 触达活动预告\n- 小红书官方号互动送产品\n- 线下品鉴会（核心粉丝）\n- 门店引导收藏打卡评价\n- 商场渠道预热\n\n### 三、传播期标准任务\n\n- 小红书博主探店\n- 小红书博主发布（同步点评）\n- 抖音官号直播\n- 预热互动活动\n- 小红书带话题发笔记送甜品\n- 朋友圈集赞活动\n- 粉丝群互动活动\n- 朋友圈互动活动\n- 私域裂变拼团活动\n- 私域砍价 0 元购活动\n- 代金券秒杀活动\n- 外送订单 DM 卡单展示\n- 跑腿广告展示\n- 公众号发布活动攻略\n- 官方抖音号发布活动攻略\n- 私域 1v1 活动攻略\n- 门店活动物料落地\n- 快闪活动\n- 商场渠道活动同步\n- 免费试活动报名\n- 门口大蛋糕制作 & 分发\n- 私域快闪群拉群（非必要）\n\n### 四、高峰期标准任务\n\n- 蛋糕卡 / 权益卡售卖\n- 储值活动\n- 私域 1v1 触达主活动开始\n- 门店折扣活动\n- 消费抽奖活动\n- 周年庆 / 开业开场仪式\n\n### 五、长尾期标准任务\n\n- 积分兑换活动\n- 活动结束答谢\n- 剩余物料回收\n- 数据统计分析\n- 客户反馈收集\n- 活动复盘\n- 未核销券提醒\n\n## 任务卡规则\n\n输出备注时，优先使用这些稳定规则：\n\n### 产品规则\n\n- 引流甜品常用价格带：9.9 / 19.9 / 29.9，毛利不低于 50%\n- 拼团产品常用价格带：19.9 / 29.9 / 39.9，毛利不低于 50%\n- 权益卡常用价格带：29.9-69.9，通常包含 5-10 倍券包\n- 权益卡主产品成本约等于权益卡定价的 0.8 倍\n- 产品研发流程：定概念 -> 打样 -> 调整 -> 内测 -> SOP -> 成本卡 -> 定价\n- 毛利率建议不低于 60%\n\n### 物料规则\n\n- 组合活动至少要有 1 张活动攻略长图海报 + 每个活动单独小海报\n- 小红书海报不能出现营销文案和二维码\n- 朋友圈海报必须露出二维码\n- 点评物料必须按平台格式要求\n- DM 卡必须 3 人交叉核对时间、地址、电话、二维码\n- DM 卡建议预留 10% 损耗\n- 不得出现“最终解释权归本店所有”\n\n### 私域规则\n\n- 企微 1v1：活动期间最多 3 次\n- 朋友圈：每天 10-12 条以内\n- 粉丝群：每天 1-2 条活动信息，避免刷屏\n- 1v1 常用发送时间：上午 10 点或下午 3 点\n\n### 小红书规则\n\n- 周年庆通常可做 30 人探店：5 个头部 + 10 个中部 + 15 个尾部\n- 新店开业通常可做 30-50 人探店\n- 节日活动通常可做 20 人左右探店\n- 需要尽量同步大众点评内容\n- 提前 1 周锁定档期\n\n### 抖音规则\n\n- 新店开业可做 15 人左右：5 带货 + 10 曝光\n- 周年庆可做 10 人左右：3 带货 + 7 曝光\n- 带货博主需要专属佣金机制\n\n### 储值规则\n\n- 档位最多 3 档\n- 总赠送价值不超过储值额的 20%\n- 建议用代金券做赠送金\n- 常见档位逻辑：\n  - 入门档：1.5-2 倍客单价，约 92 折\n  - 主力档：3-5 倍客单价，约 85-88 折\n  - 高端档：6-8 倍客单价，约 8-83 折\n\n### 互动裂变规则\n\n- 朋友圈集赞：常见规则为集 88 赞送甜品，限前 100 名\n- 私域拼团：常见为 2 人团\n- 砍价活动：常见为邀请 5-10 人砍价得甜品或代金券\n- 活动规则必须简单\n\n### 快闪群规则\n\n- 提前准备炸群预案\n- 需要提前安排群内节奏和每个节点文案\n- 不要把抢购类高情绪玩法直接放进快闪群\n- 不要写“100%中奖”\n\n### 合规规则\n\n- 不要使用“最终解释权归本店所有”\n- 不要虚假宣传\n- 不要使用极限词\n- 宣传内容要可落地、可核销、可兑现\n\n## 开业活动流程\n\n当品牌类型为休闲餐 / 快餐 / 正餐，且主目的为新店开业时，使用这个流程，不使用普通周年庆逻辑。\n\n### 第一阶段：开业准备及营销方案制定\n\n- 督导与工程部沟通围挡时间\n- 确定商圈广告资源位置、尺寸、内容要求\n- 制定新店营销计划\n- 与门店负责人沟通预算、渠道、推广计划、团购活动\n- 确定开业执行计划表和任务流程表\n\n### 第二阶段：开业准备及营销方案执行\n\n- 设计线下物料\n- 对接商场广告资源和公众号资源\n- 完成美团 / 抖音 / 高德 / 开店宝等建店\n- 完成线上物料设计\n- 对接 PR、筛号、确认探店博主数量\n- 配置企业微信\n- 配置点评 / 美团 / 抖音活动\n- 完成企业微信和收银核销培训\n- 设置平台推广通\n\n### 第三阶段：试营业与正式开业执行\n\n- 线下物料进店\n- 试营业和开业线上物料更换\n- 推广通开启\n- 企微 1v1 通知开业活动\n- 朋友圈转发开业活动\n- 商场或门店周边地推加企微\n- 门店引导客户加企业微信\n- 线上活动同步开启\n- 门店折扣活动执行\n- 小红书 / 抖音博主探店与发布\n\n### 第四阶段：开业后复盘\n\n- 推广数据复盘\n- 私域数据复盘\n- 平台代金券核销复盘\n- 营业额复盘\n\n## 输出格式\n\n默认输出 excel，在输出前先确认是否可点击下载，excel格式如下，不要变：\n\n\n### excel格式\n\n每个活动单独一行，字段固定为：\n\n- 阶段\n- 活动名\n- 开始时间：yyyy/mm/dd\n- 结束时间：yyyy/mm/dd\n- 责任人：默认空\n- 备注\n\n表格默认第一行为品牌名称+活动主题名称，填色淡橙色，如“连锁品牌 B年中大活动计划”\n第二行字段名，默认字体加粗，单元格填色淡灰色\n\n### 文字输出\n\n200字以内说明：\n\n- 活动创建逻辑\n- 主活动和渠道侧重选择原因\n\n\n## 禁止事项\n\n- 禁止写“参考某个表”“根据附件”“根据历史 Excel”\n- 禁止引用任何 bot 看不到的外部文件\n- 禁止自创活动名\n- 禁止自创任务名\n- 禁止把所有客户都套成统一模板\n- 禁止忽略主活动和副活动的先后关系\n- 禁止只列活动，不写原因\n- 禁止只列任务，不写活动逻辑\n- 禁止把快闪群提前到高峰期前售卖\n- 禁止把 1v1 群发写成超过 3 次\n- 禁止把复杂高线城市打法直接塞给下沉市场\n\n## 输出前自检\n\n输出前必须自检：\n\n- 表格是否可点击下载\n- 表格格式是否正确\n- 是否先判断了品牌，再判断渠道，再判断主活动，再判断副活动，再拆任务\n- 主活动是否只落在“权益卡 / 储值”内\n- 活动名是否全部来自本 skill 的活动池\n- 任务名是否全部来自本 skill 的标准任务池\n- 节奏是否符合五阶段\n- 1v1 是否不超过 3 次\n- 备注是否包含关键避坑信息\n- 如果是餐饮新店开业，是否改走开业流程\n\n只要有一项不满足，就不要输出最终版，先修正。\n",
  "s09": "---\nname: cake-brand-diagnosis\ndescription: 诊断蛋糕品牌的城市市场、经营规模、本地相对位置、渠道真实发展水平与可选经营指标，输出可供策略模块使用的品牌画像和九宫格定位。\n---\n\n# 蛋糕品牌经营诊断\n\n你只负责诊断，不生成月度任务。诊断目标是回答：品牌在什么样的市场中、相对于当地竞争处于哪个阶段、渠道能力是真实的还是自评偏差。\n\n## 输入\n\n优先复用对话中已知数据。缺少时，按 3 个题组收集：\n\n### 题组 A：城市\n\n- 让用户自由填写城市，不给默认城市。\n- 将城市归为高线、中线或下沉市场。\n- 分类不只看行政级别，还要看市场空间、消费密度、本地生活渠道重要性和内容投放成本。\n- 无法确定时给出“暂定中线，低信心”等明确信心度，不把城市判定伪装成确定事实。\n\n### 题组 B：规模与当地位置\n\n- 品牌月营业额：`10 万以内 / 10-30 万 / 30-50 万 / 50-100 万 / 100 万以上`。\n- 经营形态：`非连锁 / 小型连锁（2-3 店）/ 连锁（4 店及以上）`。\n- 门店数：记录实际值，用于履约、组织与装置布景估算。\n- 当地同类位置：让用户在与自己相同的连锁/非连锁类型中自评 `前 30% / 31%-50% / 51%-80% / 后 20%`。\n\n绝对营业额不能覆盖本地相对位置。例如中线城市的单店品牌，即使月营业额不超过 30 万，若已处于当地精品蛋糕品牌前 30%，应优先视为成长阶段而不是“建立成交”。\n\n### 题组 C：渠道\n\n1. 自评：基础缺失 / 单渠道较强 / 多渠道齐全。\n2. 营业额占比估算：自有小程序、美团外卖、闪购外卖、美团团购、抖音团购、其他渠道。合计应接近 100%。\n3. 校正规则：\n   - 上述数字渠道合计低于 20%，或没有任一渠道超过 5%：基础缺失。\n   - 至少 3 个数字渠道各占 5% 以上，且最大单渠道不高于 60%：多渠道齐全。\n   - 其他情况：单渠道较强。\n4. 显示自评与数据判定是否一致，数据优先。\n\n## 非必填经营指标\n\n可收集毛利率、人力成本率、食材成本率、净利率。它们只生成“需核查”的经营信号，不用单一通用阈值做强结论；应结合品牌价格带、自制比例、门店数和口径复核。\n\n## 九宫格阶段判定\n\n横轴不是营业额分档，而是经营阶段：\n\n- **0-1 起步**：仍在验证产品、渠道和稳定交付。\n- **1-10 成长**：已有可重复成交链路，需要建立本地心智、复购和效率。\n- **10-100 资产化**：需把产品、会员、供应链和组织能力沉淀为可复制资产。\n\n判定时的证据优先级：\n\n`local_percentile + operation_and_store_count > revenue_band > channel_stage`\n\n可使用以下默认校正：\n\n- 连锁，或月营业额 100 万以上且当地前 50%：倾向资产化。\n- 当地前 30%：至少判为成长，除非有明确证据表明成交链路尚未成立。\n- 小型连锁、月营业额 30 万以上或当地前 50%：倾向成长。\n- 其他情况默认起步，但要显示信心度和冲突证据。\n\n## 输出契约\n\n输出一个结构化诊断：\n\n```yaml\nbrand_profile:\n  city: \"\"\n  market: high|mid|low\n  market_confidence: high|medium|low\n  revenue_band: \"\"\n  operation: single|small_chain|chain\n  store_count: 0\n  local_percentile: top30|top50|top80|tail\n  channel_self_rating: missing|single|complete\n  channel_calculated: missing|single|complete\n  channel_evidence: []\n  financial_signals: []\ngrid_position:\n  market: high|mid|low\n  stage: start|grow|asset\n  evidence: []\n  counterevidence: []\n  confidence: high|medium|low\n```\n\n不要输出月度任务，不要询问计划月份，不要用财务指标单点覆盖本地竞争位置。\n",
  "s10": "---\nname: cake-business-planning\ndescription: 蛋糕品牌经营规划主入口。用于从品牌诊断、九宫格定位、策略主线、六引擎取舍进入月度经营计划，或单独处理其中一步。适用于定制蛋糕、口味蛋糕与门店甜品为主的蛋糕品牌；不用于通用餐饮或复合业态规划。\n---\n\n# 蛋糕经营规划\n\n你是这组技能的主入口。你负责识别当前任务、复用对话中已知信息、调用正确的专项模块，并把中间结果组织成一条可执行的经营逻辑。\n\n这不是“活动模板生成器”。必须先理解品牌处境，再决定做什么、不做什么，最后才排任务。\n\n## 技能组\n\n| 用户当前要解决的问题 | 使用模块 |\n|---|---|\n| 品牌处于什么位置，为什么不是另一格 | `$cake-brand-diagnosis` |\n| 九宫格定位对应什么经营主线，六引擎怎么取舍 | `$cake-strategy-engine-mapping` |\n| 全年四季如何轮换拉新、复购、大活动、会员和内部建设 | `$cake-seasonal-roadmap` |\n| 某月有哪些刚性项目，节日、上新和履约怎么错开 | `$cake-calendar-project-planning` |\n| 一个上新或节日项目该调用哪些渠道动作 | `$cake-channel-growth-planning` |\n| 已经确认逻辑，需要生成完整月度任务和日期 | `$cake-monthly-marketing-planning` |\n| 已有计划，需要变成文档、H5 或甘特图 Excel | `$cake-plan-rendering` |\n| 用户要一次完成从诊断到计划 | 由本主入口按下述端到端流程组织全部模块 |\n\n现有 `$cake-big-campaign-marketing-planning` 是条件扩展，只在用户已确认周年庆、开业、年中/年末大活动等真实项目时使用。不得因为月份是 6、11 或 12 月就自动创建大活动，也不得默认储值、权益卡或品牌大播。\n\n调用该扩展时，本技能组已确认的新规则优先于扩展中的旧默认值：储值/权益卡只能根据用户的经营策略和活动目的单独判断；渠道与产品的匹配遵守 `$cake-channel-growth-planning`；月度总表不输出责任人；大活动任务并入当月 30-50 项弹性容量，不另行堆一份孤立任务表。\n\n### 模块加载协议\n\n用户只要某一步时，只执行对应叶子技能。用户要端到端计划时，定位本 `SKILL.md` 所在的技能根目录，并在执行每个阶段前完整读取对应兄弟技能的 `SKILL.md`。不依赖对另一模块规则的记忆性转述。\n\n路由不要让用户重新描述信息。上一模块的结构化输出是下一模块的直接输入；只有缺失信息会改变项目取舍、上架日或履约方式时，才暂停并追问。\n\n## 端到端流程\n\n### 1. 复用已知信息\n\n先完整读取当前对话和用户提供的表格。已经明确的品牌、城市、规模、渠道、项目、日期和约束不重复询问。\n\n不要询问用户难以准确回答的“本月目标”“会员基础好不好”“经营质量高不高”。用可核对数据代替自我评价。\n\n### 2. 收集最少必要信息\n\n如果是完整规划，将诊断信息组织为 3 个可回答的题组，而不是十几个开放问题：\n\n1. **城市**：用户自由填写，后台归类高线/中线/下沉市场。不预填城市，不要在诊断页问计划月份。\n2. **规模与本地位置**：月营业额、非连锁/小型连锁/连锁、门店数，以及在当地同类经营形态中的前 30% / 31%-50% / 51%-80% / 后 20%。\n3. **渠道**：先自评基础缺失/单渠道较强/多渠道齐全，再填自有小程序、美团外卖、闪购外卖、美团团购、抖音团购和其他渠道的营业额占比估算，用数据校正自评。\n\n毛利率、人力成本率、食材成本率、净利率为非必填。它们只用于触发经营警报和内部优化，不直接决定九宫格。\n\n产品结构默认为蛋糕品牌的已知约束：定制蛋糕不作为常规营销主推；口味蛋糕是月度主推；下午茶甜品是线下空间的附属产品，通常使用与口味蛋糕同口味的切块，承接低成本尝试和打卡；低于 49.9 元的甜品盒子、裸蛋糕等可作流量品。暂不向用户询问复合业态产品问题。\n\n### 3. 先出诊断，再出计划\n\n完整规划按下列顺序执行：\n\n`brand_profile -> grid_position -> strategy_line -> engine_priorities -> [seasonal_roadmap] -> calendar_projects -> channel_actions -> monthly_tasks -> delivery`\n\n`seasonal_roadmap` 在用户要全年/四季规划时必选；单月计划可省略，或只读取已有的当季主题。\n\n每一步都要产出可供下一步消费的结构化结果。用户只要最终计划时，不必展开全部中间推理，但必须保留“为什么做/不做”的可追溯逻辑。\n\n### 4. 在产生月计划前做一次特殊项确认\n\n只问：“本月是否有非常规上新的经营策略或运营动作重点？”\n\n例如新店、周年庆、产能异常、利润专项、渠道新开、会员体系测试。没有特殊项时不自行创建。储值不是常规月度动作。\n\n### 5. 计划周期\n\n诊断阶段不询问计划月份。进入引擎结果后，默认生成次月计划；用户可改为当月或下下月。不提供季度、半年度或年度快速选项，除非用户另行提出长周期规划。\n\n## 共享约束\n\n- 九宫格是项目取舍依据，不能直接占用一条“本月核心”。\n- 六引擎用于分配经营注意力，不是要求六个板块每月都有任务。\n- 拉新是目的，不是计划中的独立板块。计划应呈现“小红书 - 动作”“抖音 - 动作”“私域 - 动作”。\n- 每个策略词必须向下对应具体任务、日期、验收指标和数据来源。无法映射的抽象词不输出。\n- 用户自定义动作允许加入，但要映射到项目、渠道、阶段、验收指标之一，不为它创造空泛新板块。\n- 月度完整任务以 30-50 项为弹性目标，不做服务端硬拦截；超出时应先合并低价值拆分、删除弱关联动作或降低粒度。\n- 任务不输出“责任人”字段。\n- 经营逻辑与展示层分离；用户要求先讨论逻辑时，不修改 H5、不渲染 Excel。\n\n## 主入口输出\n\n如果用户要完整规划，最终交付应包含：\n\n1. 品牌画像与诊断信心度。\n2. 九宫格定位及主策略。\n3. 六引擎的主攻/重点建设/基础维持/暂缓。\n4. 当月刚性项目、可选项目和不做项目。\n5. 3-5 项“本月核心”及 DDL。\n6. 完整任务清单与甘特图可用字段。\n\n当信息不足以生成完整计划时，只追问会改变项目取舍或日期的信息；其他缺口用显式假设处理。\n",
  "s11": "---\nname: cake-calendar-project-planning\ndescription: 为蛋糕品牌判断某月的节日、时令上新、大活动、跨月准备和履约冲突，输出当月项目组合、时间锚点与 3-5 项本月核心。\n---\n\n# 蛋糕经营日历与项目取舍\n\n你只负责判断“这个月该有哪些项目，项目什么时候发生”。不为每个项目自动堆满所有渠道动作。\n\n## 项目类型\n\n1. **日常口味上新**：口味蛋糕 + 同口味切块，可配低于 49.9 元的流量品。\n2. **节日项目**：先判断购买周期和消费心智，再确定前置时间、产品和投放。\n3. **大活动项目**：周年庆、开业、年中/年末、品牌大播等经用户确认的项目。不由月份自动触发。\n4. **特殊经营项目**：新店、渠道新开、利润异常、产能或交付问题、会员体系测试等。只在真实存在时加入。\n5. **跨月准备**：为下月长周期节日、国庆、大活动或口味上新预留研发、物料、博主档期、库存和排班。\n\n## 节日二维分类\n\n节日不能只分“重点/非重点”。每个节日同时判断购买周期和消费心智。\n\n### 购买周期\n\n| 类型 | 节日 | 默认经营方式 |\n|---|---|---|\n| 长周期消化型 | 中秋、春节 | 提前 20-30 天上线，持续触达、订单跟进、库存与产能管理，不追求节日单日爆量 |\n| 短周期爆发型 | 情人节、妇女节、母亲节、父亲节、520、儿童节、七夕 | 产品与物料提前准备，公开转化、私域触达与履约监控集中在节前 3 天至节日当天 |\n| 轻节点型 | 教师节等 | 轻量产品或赠礼机制 + 一次触达 + 履约跟进，不默认重投放 |\n\n### 消费心智\n\n| 类型 | 典型项目 | 必要校正 |\n|---|---|---|\n| 刚需送礼型 | 中秋礼盒、春节礼盒 | 不默认小红书博主种草；不让抖音达人带正价礼盒；重点是预售、存量用户、企业客户、订单跟进和交付 |\n| 体验种草型 | 月度口味蛋糕、切块、新店 | 适合小红书体验官、付费博主、置换博主和聚光；流量品可配抖音达人 |\n| 强符号打卡型 | 万圣节、圣诞节、情人节等 | 有线下空间时，必须评估打卡装置、配套甜品/饮品/套餐、内容传播、核销和数据记录 |\n\n同一节日可同时具备两种属性。例如情人节是短周期爆发型，也可以是强符号打卡型。\n\n## 投放节奏\n\n- 长周期消化型的中秋、春节：保留日常点金或本地推优化即可，不做节日加码。\n- 短周期且具庆祝性质的节日：默认触发节前 3 天每天增加 60 元点金预算，节日当天点金预算拉高至 300 元；本地推在节日期间翻倍。执行前仍要检查平台可用性、门店履约能力和预算口径。\n- 不把“节日月”等同于“所有项目和渠道都加码”。\n\n## 履约与日期规则\n\n1. **上新错开**：节日上新与日常口味上新的对外上架日至少间隔 7 天。不只看上架日，还要检查生产、库存、配送、门店排班和客服的峰值是否重叠。\n2. **不把前置动作挤进当月**：中秋、春节和大活动要跨月倒排；月计划可包含跨月前置行。\n3. **实际日期推算**：农历节日、母亲节、父亲节等按当年日历推算，不固定写死日期。\n4. **肃穆日期避让**：九一八、清明、5 月 12 日、南京大屠杀死难者国家公祭日等日期，不安排娱乐化上新、抽奖、庆祝性发布、博主探店或广告起量。内部准备可继续。\n5. **大型节假日冲突**：10 月 1 日等大型节假日首日，不安排与该节日无关的日常上新，原因是履约压力和用户注意力占用，不是肃穆日期。\n6. **打卡装置**：线下打卡项目必须单列“装置设计制作”和“装置进场布景”；进场布景按门店数和复杂度独立预留 3-5 天，再做培训、内容发布和正式执行。\n\n## 本月核心选择\n\n“本月核心”默认 3-5 项，不强求 5 项。判断顺序：\n\n1. 月历决定错过就失效的刚性项目。\n2. 九宫格决定项目取舍，但不直接成为核心任务。\n3. 真实经营问题或特殊项目决定是否增加一条专项。\n4. 每周平播、基础会员触达、月末复盘等常规动作保留在完整清单，不强行进核心。\n5. 按执行容量收敛：淡月通常 3 项；一个节日 + 一个月度上新通常 4 项；多节日或大项目月最多 5 项。\n\n本月核心应概括一条完整项目主线，不是把任务名原样搬上去。例如“中秋销售 SOP 制定与过程管理”、“中秋礼盒上线及触达”、“9 月口味蛋糕及切块上线及触达”。\n\n## 输出契约\n\n```yaml\ncalendar_projects:\n  required: []\n  optional: []\n  deferred: []\n  cross_month_preparation: []\n  sensitive_dates: []\n  capacity_conflicts: []\nmonthly_core:\n  - title: \"\"\n    ddl: YYYY-MM-DD\n    reason: \"\"\n```\n\n每个项目必须有一个上架/开始锚点，且说明与其他项目的间隔与履约关系。\n",
  "s12": "---\nname: cake-channel-growth-planning\ndescription: 将蛋糕品牌的口味上新、节日产品、流量品、门店打卡或大活动匹配到小红书、抖音团购、美团点评、外卖和私域的可执行动作，并规定产品、力度和验收指标。\n---\n\n# 蛋糕品牌渠道增长武器库\n\n拉新是目的，不是任务板块。你的任务是把每个上新或节日项目转成“在哪个渠道，用什么产品，做什么动作，如何验收”。\n\n不得输出“多渠道转化”“价格纪律检查”“公私域联动”等无法直接执行和验收的词。如果确实有三件事，就拆成三条任务。\n\n## 渠道心智\n\n| 渠道 | 用户心智 | 优先承接 |\n|---|---|---|\n| 小红书 | 审美、口味、体验、打卡和本地生活决策 | 口味蛋糕、同口味切块、门店场景、正价新品种草 |\n| 抖音团购 | 短平快、低门槛、强视觉刺激和即时成交 | 49.9 元以下流量品、低价套餐、代金券；外部达人不带正价蛋糕和礼盒 |\n| 美团点评 | 本地搜索、到店决策、核销和口碑 | 收藏打卡、团购套餐、流量品、授权内容同步、真实评价运营 |\n| 外卖 | 即时需求、搜索转化和履约 | 菜单结构、钩子产品、点金、评分与交付 |\n| 私域 | 已有信任、存量激活、复购和社交裂变 | 1v1、朋友圈互动、拼团、砍价、限量券、生日和庆祝需求 |\n\n## 小红书武器库\n\n### 1. 自有账号体验官招募\n\n- 奖励为大蛋糕。\n- 日常上新 5-10 人，大活动 20-30 人。\n- 招募笔记内嵌私信引导加企微流程。\n- 置顶评论可加“参与评论即可领取小甜品”，用于增加私域转化量。\n- 验收：报名、符合条件人数、加企微、到店/领取、发布、内容回收和赠送成本。\n\n### 2. 自有账号抽奖\n\n- 不送蛋糕，送实物奖品。\n- 用户需要互动，或参与话题发布笔记。\n- 适合话题扩散，不要与体验官招募合并成一件事。\n\n### 3. 自有账号杀糕大会邀请\n\n适合强视觉、可线下集中体验的新品或节点。单列报名、场地、产品、拍摄、私域承接和发布验收。\n\n### 4. 外部付费博主探店\n\n- 日常上新 3-10 人，大活动 10-30 人，按当月推广强度取舍。\n- 主要服务口味、审美、体验和门店心智。\n- 中秋、春节刚需礼盒默认不使用；只有新品类教育、强视觉创新或新市场认知建设时例外。\n- 验收：筛号、档期、brief、探店、发布、费用、收藏/私信/加企微/成交。\n\n### 5. 外部置换博主探店\n\n不支付推广费，赠送蛋糕换笔记。必须与付费博主分开立项、分开统计；验收赠送成本、发布率和后续成交。\n\n### 6. 自有账号笔记投聚光\n\n每月的活动笔记和上新海报笔记原则上都投。记录曝光、点击、私信、加企微和成交，不只看点赞。\n\n## 抖音团购武器库\n\n1. **品牌大播**：只在已确认的大活动、年中、年末或周年庆节点使用。\n2. **日常平播**：建议每周一场，每场 1-2 小时。属于常规动作，不必进入本月核心。\n3. **流量品促销引流**：售价低于 49.9 元，如小甜品、甜品盒子、裸蛋糕。\n4. **套餐/代金券促销引流**：折扣低于 8.5 折，必须同时检查毛利、核销和连带。\n5. **外部付费达人探店带货**：每次 3-5 人，只带流量品；正价口味蛋糕、中秋礼盒和春节礼盒不作为外部达人带货品。\n6. **本地推**：短周期庆祝性节日期间可翻倍；中秋、春节不做节日加码。\n\n抖音验收优先看：直播时长与成交、团购销售与核销、达人实际带货、广告花费与成交，不把播放量当作唯一结果。\n\n## 美团点评团购武器库\n\n只有线下店时才使用到店动作。\n\n1. **用户收藏打卡有礼**：设置明确礼品、库存、核销和统计；不与评价激励混用。\n2. **评价维护**：围绕真实顾客的体验、回复、低分原因和门店改进。不做虚假评价、虚假补单或评价诱导。\n3. **推广通**：节日或开业前使用，必须绑定具体产品、套餐或打卡项目。\n4. **小红书付费博主笔记同步**：取得授权后免费同步，不重复购买同一内容。\n5. **流量品促销引流**：售价低于 49.9 元。\n6. **套餐/代金券促销引流**：折扣低于 8.5 折，同时检查毛利和核销能力。\n\n## 外卖武器库（美团外卖/闪购外卖）\n\n1. **门店健康度诊断**：检查是否存在平台踩雷指标。按季度或出现异常时执行，不每月重复。\n2. **点金广告**：日常做关键词和预算调优。短周期庆祝性节日前 3 天每天增加 60 元、节日当天拉高至 300 元；中秋、春节不做节日加码。\n3. **外卖评分运营**：通过真实订单的产品、包装、时效、售后和客诉改善评分。不执行虚假外部补单。\n4. **菜单结构调整**：增加钩子产品，并检查流量品、利润品、正价蛋糕的层级和连带。\n\n## 私域武器库\n\n“个微群发”和“企微群发”统一写为 **1v1 群发**，不区分工具。\n\n1. **朋友圈转发海报送产品**：用于上新预热、存量激活和社交扩散。\n2. **朋友圈蛋糕征名**：适合口味蛋糕上新，不给刚需礼盒硬套。\n3. **朋友圈点赞送产品**：设置简单参与门槛、限量和核销边界。\n4. **邀好友拼团秒杀**：折扣低于 7 折，售价通常不高于 49.9 元。\n5. **邀好友砍价 0 元秒杀**：邀请 5-10 位好友砍价成功可 0 元得，产品价值通常为 50-120 元。\n6. **限量抢购半价/买一送一券/试吃券**：活动期间可每天定时定量释放额度，并按人群做 1v1 差异化触达。这是活动库存节奏，不是对用户名单逐日滚动运营。\n\n全量营销型 1v1 群发默认每月不超过 3 次。生日服务、售后和“上月新客一转二”等特定人群批次可单独处理，但必须做受众去重和频次控制，不能用“定向”规避打扰。\n\n## 选择规则\n\n1. 先明确项目和产品，再选渠道；不先选渠道再硬塞产品。\n2. 每个上新至少判断一次私域存量激活或裂变，从 1v1、转发有礼、点赞、征名、拼团、砍价、限量券中选 1-2 个，不全部使用。\n3. 体验官和本地博主是两件事，付费博主和置换博主也是两件事，分开立项和验收。\n4. 中秋、春节靠长周期消化，不套短期爆发的博主、达人、点金和本地推加码。\n5. 渠道动作必须与上架日倒排，不允许“月内完成”这种无锚点排期。\n\n### 渠道缺失机会\n\n某渠道营业额占比为 0 时，先判断是“未开通”、“已开通但无成交”还是“品牌当前不适合”。只在城市渠道机会、产品承接和履约能力同时成立时，把“开通一个可成交渠道”纳入经营计划。不一次性补齐所有渠道。\n\n渠道开通不能只写“开外卖”或“开团购”，应包含：资质与建店、产品/菜单结构、物料、价格与核销、测试订单或测试核销、首月基线数据。\n\n## 输出契约\n\n```yaml\nchannel_actions:\n  - project: \"\"\n    channel: xiaohongshu|douyin|dianping|delivery|private\n    action: \"\"\n    product: \"\"\n    start: YYYY-MM-DD\n    end: YYYY-MM-DD\n    trigger_or_reason: \"\"\n    acceptance: []\n```\n\n一条动作只表达一件事。验收指标要优先使用可数数据，并能向上追溯到具体上新项目。\n",
  "s13": "---\nname: cake-monthly-marketing-planning\ndescription: 将已确认的蛋糕品牌诊断、九宫格策略、六引擎、月度项目和渠道动作整合为可执行的 30-50 项月度经营工作计划。保留该名称作为原蛋糕月计划技能的兼容入口。\n---\n\n# 蛋糕品牌月度经营计划\n\n你是月度任务整合器，不是品牌诊断器，也不是渠道玩法随机生成器。\n\n你要把已经确认的：\n\n`brand_profile + strategy + engines + calendar_projects + channel_actions`\n\n整合成一份对当月真实日期、履约能力和执行容量负责的经营工作计划。\n\n如果用户直接调用本技能，但对话中没有上游结果，先执行 `$cake-business-planning` 的最少必要诊断与策略流程，不再使用本技能旧版的“节日/时令/大活动三选一”模板。\n\n## 计划边界\n\n- 输出的是完整经营工作计划，不是只有营销发布的活动表。\n- 项目、渠道、会员、数据、履约和特殊内部经营动作都可进入，但后两者要有真实触发条件。\n- 用户的自定义任务可以加入，需映射到具体项目、渠道、会员阶段、交付环节或经营问题。\n- 不输出“责任人”字段。\n- 完整任务以 30-50 项为弹性目标，不做硬拦截。\n\n## 生成顺序\n\n### 1. 确认计划月份和真实日历\n\n默认输出次月；用户可选当月或下下月。节日、周末、农历节日、节前准备和跨月动作按当年日历推算。\n\n### 2. 确定“本月核心”\n\n数量为 3-5 项，不强求 5 项。使用下列顺序：\n\n1. 错过日期就失效的节日、时令上新、大项目和跨月准备。\n2. 九宫格主策略对项目做取舍，但不把“区域首选”等定位名称当作核心任务。\n3. 真实存在的渠道缺失、利润异常、产能不足、新店或会员体系测试。\n4. 每周平播、基础会员触达、月末复盘等保留在完整清单，不强行进核心。\n5. 按当月执行容量收敛。\n\n核心任务是对一条项目主线的概括，不是搬运下方任务名。合格表达例如：\n\n- 中秋销售 SOP、持续跟进、过程监督与激励。\n- 中秋礼盒上线及存量用户触达。\n- 教师节上新及触达。\n- 9 月口味蛋糕及切块上线及触达。\n\n### 3. 先建项目链，再放渠道动作\n\n每个上新项目至少检查：\n\n`product_definition -> sampling_and_cost -> SOP_and_capacity -> materials_and_listing -> private_activation -> public_channel_actions -> launch -> fulfillment -> data_and_review`\n\n不是每个项目都要使用所有环节。刚需礼盒可以没有博主和达人，但不能没有预售、订单跟进、库存、产能和复盘。\n\n渠道动作必须绑定具体项目和产品。计划板块写为“小红书”“抖音”“美团点评”“外卖”“私域”，不单列“拉新获客”。\n\n#### 上新项目基础任务库\n\n按项目需要选择，不要每次全部使用：\n\n- **产品**：概念与主推场景、首轮打样、调整与内测、成本卡、定价、SOP、最大产能与交付边界。\n- **产品组合**：口味蛋糕、同口味切块和可选流量品的角色、价格和连带关系。\n- **物料**：产品拍摄、主海报、私域 1v1 素材、朋友圈素材、门店海报/台卡，以及当月实际使用渠道的小程序、小红书、抖音、美团点评和外卖规格物料。\n- **平台与上架**：只更新当前在营或本月确认新开的渠道；完成商品信息、价格、库存、套餐/券、核销和测试订单。\n- **门店与交付**：原料和包装库存、生产排程、配送测试、门店陈列、推荐话术、SOP 培训和异常处理。\n- **数据**：产品销售、渠道费用、新增与首购、核销、毛利、损耗、缺货、延误和客诉，以及产品/渠道去留结论。\n\n物料和上架范围必须跟随已确认的渠道组合，不能因为任务库里有某渠道，就在每个品牌的每次上新里强行加入。\n\n### 4. 校验履约和上新节奏\n\n- 节日上新与日常口味上新对外上架至少间隔 7 天。\n- 不在九一八、清明、5 月 12 日、南京大屠杀死难者国家公祭日等日期安排娱乐化发布、抽奖、探店或起量。\n- 10 月 1 日等重大节假日首日不安排无关日常上新。\n- 中秋、春节前 20-30 天上线，允许准备任务跨月。\n- 排期后检查同一周的打样、拍摄、上架、博主接待、生产、配送和客服峰值。\n\n### 5. 会员与首购转复购\n\n会员运营是默认模块，但任务复杂度随节奏变化：\n\n- 淡季/轻月：可只做 1 次短信或定向触达 + 结果记录。\n- 旺季/大活动月：可做多次分人群触达，但要避免与上新群发重复打扰。\n- 上月新客一转二：每月一次整理名单、按来源和首购产品分类、统一触达、记录结果。不按每位新客的 7 日/30 日节点逐日滚动。\n- 其他非活动型用户运营任务也以每月一个批次为默认。\n- 订单、库存、产能、履约和客诉属于活动过程监控，可按日执行。\n\n### 6. 大活动和长周期项目的过程管理\n\n只要项目跨越多周、存在订单和产能压力，就不能只写“上线”和“复盘”。例如中秋 SOP 至少覆盖：\n\n1. 货盘、定价、交付边界和销售话术。\n2. 企业客户/重点客户名单和订单台账。\n3. 销售目标、实际进度、库存、最大产能和交付风险的持续看板。\n4. 过程监督、团队激励和差额纠偏。\n5. 截单、生产排程、异常处理和利润/履约复盘。\n\n不输出“获客成本与首购复购效率联动”这类抽象任务。如果需要判断渠道效率，就明确写“分渠道统计费用、新增、首购、一转二、收入和赠送成本”。\n\n### 7. 线下打卡项目\n\n有线下打卡项目时，至少分开：\n\n1. 打卡规则、礼品与核销机制。\n2. 配套甜品/饮品/套餐定盘。\n3. 打卡装置设计制作。\n4. 打卡装置进场布景，独立 3-5 天。\n5. 门店话术与现场培训。\n6. 内容发布、正式执行、核销和数据记录。\n\n## 任务粒度\n\n一条任务必须能由一个执行单元完成，有一个主要产物和一组验收口径。\n\n应拆分：\n\n- “核销与价格检查”是两件事。\n- “体验官与博主推广”是两件事。\n- “付费博主与置换博主”是两件事。\n- “打卡装置设计制作与进场布景”是两件事。\n\n可合并：\n\n- 同一产品的打样、成本卡、定价和 SOP，当它们由同一小组在同一周完成时可写为一条。\n- 上月新客的名单整理、一次统一触达和结果记录可写为一个月度批次任务。\n\n## 输出格式\n\n### 逻辑讨论版\n\n1. 本月核心 3-5 项，每项带 DDL。\n2. 当月项目取舍及原因。\n3. 完整任务表：`编号 / 项目或渠道 / 任务 / 开始 / 结束 / 验收口径与备注`。\n\n### 正式交付数据\n\n```yaml\nplan:\n  brand: \"\"\n  year: 0\n  month: 0\n  monthly_core:\n    - title: \"\"\n      ddl: YYYY-MM-DD\n  tasks:\n    - id: 1\n      project: \"\"\n      channel_or_module: \"\"\n      task: \"\"\n      start: YYYY-MM-DD\n      end: YYYY-MM-DD\n      duration_days: 0\n      acceptance: \"\"\n      notes: \"\"\n```\n\n不包含责任人。不得用正式计划代替用户要求的逻辑讨论；用户说“先别渲染”时，只交付讨论版。\n\n## 输出前自检\n\n- 本月核心是否为 3-5 项，且是项目主线而非任务搬运。\n- 九宫格是否只影响取舍，没有单独占一条核心。\n- 拉新是否按小红书、抖音、美团点评、外卖、私域呈现，且已绑定上新项目。\n- 每个策略词是否都有向下任务和验收指标。\n- 中秋/春节是否提前 20-30 天，且没有默认博主、达人、点金或本地推节日加码。\n- 抖音外部达人是否只带低价流量品。\n- 每个上新是否有私域存量激活或裂变判断。\n- 节日与日常上新是否间隔至少 7 天，并避开敏感日期和履约冲突。\n- 上月新客一转二是否只有一个月度批次，无 7/30 日逐日滚动残留。\n- 打卡项目是否有独立 3-5 天的装置进场布景。\n- 任务是否以 30-50 项为弹性目标，并且没有责任人字段。\n\n有一项不满足时，先修正，不直接输出最终版。\n",
  "s14": "---\nname: cake-plan-rendering\ndescription: 将已确认的蛋糕品牌经营诊断和月度计划渲染为手机 H5、文档式页面和甘特图 Excel，并校验展示层没有改变业务逻辑。\n---\n\n# 蛋糕经营计划展示与下载\n\n你只负责展示和交付文件，不改写上游的诊断、策略、项目取舍、任务数和日期。\n\n用户说“先讨论逻辑”“不要渲染”“先不改 H5”时，立即停止展示层修改，只处理逻辑文档。\n\n## H5 流程\n\n固定为：\n\n`diagnosis -> strategy_grid -> engines -> plan`\n\n所有页面只保留一个主标题，不加副标题或用可见文字解释页面用法。\n\n### 诊断页\n\n- 只有一个主标题，不加副标题。\n- 不显示计划月份选择。\n- 城市为空白自由输入，不预填徐州或其他城市。\n- 不自行增加用户未确认的标签、选项或自评题。\n- 必填信息：城市；月营业额；经营形态与门店数；当地同类位置；渠道自评与各渠道营业额占比。\n- 月营业额选项只用：`10 万以内 / 10-30 万 / 30-50 万 / 50-100 万 / 100 万以上`。\n- 渠道占比只用：自有小程序、美团外卖、闪购外卖、美团团购、抖音团购、其他渠道。\n- 毛利率、人力成本率、食材成本率、净利率为非必填。\n\n### 九宫格页\n\n- 展示高线/中线/下沉 × 起步/成长/资产化九宫格。\n- 诊断结果高亮。\n- 每格可点按查看主策略、做多什么和做少什么，但点按不改变真实诊断结果。\n\n### 六引擎页\n\n- 页面上方直接展示六套引擎，不放产品四宫格原图。\n- 当期主攻和重点建设引擎高亮，暂缓引擎标灰。\n- 高亮引擎可点按，点按后用标签展示可下钻的核心任务，不用一句抽象口号。\n- 不使用副标题。\n- 主操作默认为“生成次月计划”。右侧“其他”小按钮只提供“当月计划”和“下下月计划”。不提供季度或半年度选项。\n\n### 计划页\n\n- 用文档式展示，不用卡片堆叠。\n- 顶部高亮“本月核心” 3-5 项及 DDL。数量由当月节奏决定，不固定为 5。\n- 本月核心是项目主线概括，不是从任务清单直接搬运任务名。\n- 下方用待办清单展示每项任务。\n- 不放“这不是一句定位口号”等解释性副标题。\n\n## Excel 甘特图\n\n导出字段：\n\n1. 编号\n2. 项目\n3. 渠道或模块\n4. 任务\n5. 开始日期\n6. 结束日期\n7. 历时\n8. 验收口径\n9. 备注\n10. 当月日期轴与甘特色块\n\n不包含责任人。开始日期、结束日期和历时必须一致；跨月前置任务需显示实际日期，不得挤到月初。\n\n任务总数以 30-50 项为弹性目标。前端或服务端不得因超过 40 项硬拦截；任务数的收敛在规划阶段完成。\n\n## 验证\n\n渲染后必须检查：\n\n- 手机和桌面端主要流程可用，文字不溢出或重叠。\n- 诊断页没有计划月份和预填城市。\n- 九宫格点按可用，诊断结果不被意外改写。\n- 六引擎高亮、标灰与任务标签一致。\n- 次月、当月、下下月三个入口输出正确年月。\n- H5 与 Excel 的本月核心、任务数、日期和验收口径一致。\n- Excel 可正常打开，甘特图色块与日期一致。\n\n展示层发现逻辑错误时，回到上游计划修正，不在前端用特判隐藏错误。\n",
  "s15": "---\nname: cake-seasonal-roadmap\ndescription: 为蛋糕品牌设计全年四季经营节奏，在拉新、首购转复购、大活动、会员长期运营和内部体系优化之间分配主题、资源与跨月准备，再为单月计划提供上层约束。\n---\n\n# 蛋糕品牌全年四季经营路线图\n\n你负责解决“全年为什么在这个季度重点做这件事”，不把全年规划写成 12 份重复的月度任务清单。\n\n必须先有 `$cake-brand-diagnosis` 的品牌画像和 `$cake-strategy-engine-mapping` 的主策略/六引擎优先级。\n\n## 全年规划的五条线\n\n1. **产品线**：口味蛋糕、同口味切块、流量品、长周期礼盒与强符号打卡产品何时出现。\n2. **拉新线**：每季使用哪些上新或节点作为流量载体，用哪些渠道获客；拉新不独立于产品节奏。\n3. **复购与会员线**：每月对上月新客做一次一转二；淡季做基础触达，旺季和大活动期做分层承接，季末看会员收入和复购。\n4. **大活动线**：周年庆、开业、年中/年末或品牌大播只占预先确认的年度槽位。不因月份自动创建，不要求每个品牌每年都有同样数量。\n5. **内部系统线**：每季最多优先处理 1 个关键能力，如产品毛利、外卖菜单、产能与履约、会员分层或多店协同。不在每月重复列出全套内部优化。\n\n## 四季基准（不是固定模板）\n\n| 季节 | 常规市场信号 | 默认规划重点 |\n|---|---|---|\n| 春季 | 情人节、妇女节、春日口味、母亲节/520 前置 | 用新口味和情感节点拉新，同时给 5 月多节日预留研发和产能 |\n| 夏季 | 母亲节、520、儿童节、父亲节、夏季水果、七夕前置 | 短周期节日与低门槛切块/流量品组合；周年庆只在真实存在时安排 |\n| 秋季 | 七夕、教师节、中秋、秋季口味、万圣节 | 中秋 20-30 天长周期消化，日常上新与节日履约错开；有线下空间时用强符号打卡承接万圣节 |\n| 冬季 | 圣诞、元旦、春节礼盒、情人节前置 | 圣诞可做打卡和产品体验；春节走长周期礼盒和交付；年末大活动只在品牌明确选择时使用 |\n\n不同年份的农历节日会改变季节和月份归属，必须用当年日历重排。\n\n## 根据品牌阶段调整\n\n### 起步品牌\n\n- 全年重点是产品、一条可成交渠道和稳定交付。\n- 大活动、复杂会员分层和多渠道重投应后置。\n- 可以用日常口味上新和 1-2 个最适合品牌的短周期节日验证。\n\n### 成长品牌\n\n- 全年重点是本地心智、优势渠道放大、月度一转二和会员基础。\n- 拉新必须绑定上新，季末用渠道质量决定下季投放。\n- 可根据实际资源安排一个年度大项目，但不为了“完整”硬做。\n\n### 资产化品牌\n\n- 全年重点是会员价值、组织和多店协同、产品标准化与品牌资产。\n- 拉新保持稳定，大项目必须有资产沉淀目标，如会员、企业客户、内容资产或可复制 SOP。\n- 内部体系优化要按季度主题推进，不在销售高峰同时上线多个组织项目。\n\n## 节奏守则\n\n- 每个季度至少明确：1 个产品/市场主题、1 个拉新载体、1 个复购/会员主题、最多 1 个内部能力主题。\n- 大活动必须预留前置月和恢复期，不得与长周期礼盒履约或多节日月重叠。\n- 不为了月月有亮点而月月造节或重促。\n- 口味蛋糕是默认月度主推，但在多节日、大活动或履约风险过高时，可合并、延后或降低推广强度，不能为满足模板挤压交付。\n- 长周期项目、下月节日和博主/物料档期必须允许跨月。\n\n## 输出契约\n\n```yaml\nseasonal_roadmap:\n  annual_strategy: \"\"\n  annual_do_less: []\n  major_campaign_slots: []\n  seasons:\n    - season: spring|summer|autumn|winter\n      product_theme: \"\"\n      acquisition_carriers: []\n      repeat_and_membership: []\n      engine_priorities: []\n      internal_capability: \"\"\n      key_projects: []\n      cross_month_preparation: []\n      capacity_risks: []\n  quarterly_reviews:\n    - metrics: []\n      decision_for_next_quarter: \"\"\n```\n\n年度路线图要表达取舍与先后，不输出数百条年度待办。用户要落到某月时，再交给 `$cake-calendar-project-planning` 和 `$cake-monthly-marketing-planning`。\n",
  "h5/jiuge-business-planner/index": "# 九宫格经营诊断\n\n面向蛋糕品牌经营者的月度经营规划 H5。产品从品牌诊断开始，经由经营九宫格和六套经营引擎完成策略取舍，最终生成带日期、验收口径和甘特图的月度经营工作计划。\n\n## 当前流程\n\n```text\n经营诊断 -> 九宫格定位 -> 六引擎取舍 -> 月度计划 -> 甘特图 Excel\n```\n\n## 本地运行\n\n```bash\nnode server.mjs\n```\n\n普通入口：\n\n```text\nhttp://127.0.0.1:8000/\n```\n\n虚构案例演示入口：\n\n```text\nhttp://127.0.0.1:8000/?demo=1\n```\n\n默认端口为 `8000`，可通过 `CAKE_PLANNER_PORT` 修改。\n\n## 运行依赖说明\n\n前端页面使用原生 HTML、CSS 和 JavaScript。甘特图 Excel 由随站点托管的 ExcelJS 在浏览器内生成，不依赖后端接口，可直接部署到 GitHub Pages 等静态托管平台。\n\n`server.mjs` 保留为本地静态服务入口；页面导出不再调用其中的 `/api/export`。\n\n## 演示资料\n\n- `README_DEMO.md`：演示包说明。\n- `DEMO_VIDEO_SCRIPT.md`：真实产品录屏脚本。\n- `demo-assets/`：虚构案例生成的甘特图及预览。\n- `DESIGN.md`：当前视觉规则。\n\n仓库不包含网页抓取缓存、Playwright 测试过程文件及真实客户案例输出。\n",
  "s17": "---\nname: deconstructed-photo-style\ndescription: 将用户提供的照片制作成“原照片区域 + 抽象记忆面板 + 诗意英文标题”的极简编辑作品。用户要求解构照片、照片抽象重构、摄影与抽象面板拼接、从照片提炼空间关系，或明确提到“解构照片图片风格”时使用。必须以用户照片为唯一视觉来源；不用于普通滤镜、照片矢量化、自由扩图、独立抽象画或无参考图的海报生成。\n---\n\n# 解构照片图片风格\n\n把用户上传的照片转化为一张完整的竖向编辑作品：上方或主要区域忠实保留摄影原片，下方使用中性象牙色抽象面板重构照片的空间记忆，并配一个原创、克制的英文标题。\n\n## 开始前\n\n1. 确认当前任务提供了可访问的照片。没有照片时，只追问用户上传照片，不凭空生成。\n2. 完整读取 [references/style-spec.md](references/style-spec.md)，它是本风格的视觉规范。\n3. 检查照片方向、宽高比、主体密度、视觉重心、重要颜色和可接受的轻微裁切范围。\n4. 若用户只要求提示词，输出一份适配其照片的完整生成提示词，不调用图片工具；否则制作最终图片。\n\n## 核心方法\n\n始终采用：\n\n`DECONSTRUCT -> SELECTIVE PRESERVATION -> ABSTRACT / DISTILL -> RECONSTRUCT`\n\n在内部完成以下判断，不向用户展示冗长分析：\n\n- 提取照片最重要的 3-6 个空间事实。\n- 区分主体质量、结构轴、运动方向、重复节奏、间距、遮挡、层级、明暗、色彩角色与留白。\n- 删除纹理、透视细节、背景杂讯和低信息装饰。\n- 选用一个主要标记家族，最多两个辅助标记家族。\n- 保留照片独有的关系和最低必要辨识度，不复刻物体表面。\n\n## 制作流程\n\n### 1. 保护原片\n\n- 把用户照片作为唯一内容来源。\n- 摄影区域必须直接使用原始像素，只允许克制的等比缩放或为拼接比例进行轻微裁切。\n- 不让生成模型重绘、修饰、扩展或替换摄影区域。\n\n### 2. 生成抽象面板\n\n- 从原照片提取有限色彩和结构关系，生成独立的抽象面板。\n- 面板背景使用均匀、连续的中性象牙色，默认 `#F3F0E8`，不得使用渐变、阴影、纹理或噪点。\n- 只生成来源可追溯的抽象标记，不添加照片中不存在的物体、象征、颜色或装饰。\n- 保持大量留白和轻微自然不规则，避免规则化信息图、通用图标和矢量描摹感。\n- 调用可用的图片生成/编辑能力时，只让其生成面板，不生成或重绘整张原照片。\n\n### 3. 命名与排版\n\n- 根据照片真实主体关系、光线、时间、方向或运动，在内部确定一个 2-5 个英文单词的原创标题。\n- 只有副标题能增加新语义时才加入 3-7 个英文单词的副标题。\n- 标题使用优雅、克制的衬线字体，颜色取自照片中的深色角色，不默认纯黑。\n- 标题只放在抽象面板内，根据重心选择左下对齐或底部居中。\n- 使用可控的本地排版方式渲染标题，避免生成模型产生错字、重复文字或额外字符。\n\n### 4. 精确合成\n\n- 用本地图片合成工具把原照片、抽象面板和标题组合成单张竖向成品。\n- 根据照片方向和视觉重心自适应确定照片/面板比例，遵循参考规范而非机械五五分。\n- 照片与面板直接平面衔接，不加相框、撕纸、胶带、阴影、立体卡片或样机效果。\n- 保持原图宽高关系，优先完整呈现主体，不为固定画布比例激进裁切。\n\n## 验收\n\n交付前逐项检查：\n\n- 摄影区域与输入照片内容一致，没有被生成模型改写。\n- 抽象面板中的每个主要标记都能对应照片事实。\n- 第一眼是极简抽象构成，第二眼才联想到这张特定照片。\n- 面板背景完全均匀，无渐变、阴影、噪点、纸纹或接缝。\n- 标题准确、只出现一次，且没有其他文字、数字、日期、Logo 或水印。\n- 配色全部来自照片，强调色数量克制。\n- 留白、比例、对齐和边距稳定，没有元素拥挤或贴边。\n- 最终只交付一张完成作品；除非用户要求，不附候选标题或分析说明。\n\n发现摄影区域被重绘、标题错误、面板出现虚构元素或背景不均匀时，不交付该版本；回到对应步骤修正后重新验收。\n",
  "s18": "---\nname: graphic-design\ndescription: 平面设计风格的统一入口与选择路由。用户提出海报、封面、编辑图片、视觉创作、图片风格化等设计需求但没有明确风格时使用；也可在用户输入 /graphic-design、$graphic-design、平面设计、设计分区或要求比较多种平面风格时使用。先帮助用户在高级杂志海报、解构照片、单色印刷三类风格中选择；用户选不出来时，先确认是否基于同一主题和素材按各风格各生成一张进行对比，不得未经确认直接批量生成。\n---\n\n# 平面设计\n\n把这个 Skill 当作平面设计风格分区和路由入口。它不替代具体风格 Skill，也不重写各风格的生成规则。\n\n## 风格目录\n\n| 选项 | 调用 Skill | 适合的需求 | 核心视觉 |\n|---|---|---|---|\n| A. 高级杂志海报 | `$advanced-poster-maker` | 极简海报、杂志感、Zine、诗意封面 | 大留白、纸张质感、小型视觉锚点、克制高饱和色 |\n| B. 解构照片图片风格 | `$deconstructed-photo-style` | 已有照片的艺术重构、摄影与抽象图形拼接 | 原照片区域、抽象记忆面板、诗意英文标题 |\n| C. Mono Color 单色印刷 | `$mono-color` | 单色或双色海报、孔版印刷、网点照片、编辑视觉 | 一至两种印刷色、机械网点、留白、强字体关系 |\n\n`$imagegen` 是这些风格常用的图片生成引擎，不作为独立风格选项。公众号排版、Figma、PPT 等相邻工具不放入本分区，除非用户明确要求扩展目录。\n\n## 路由流程\n\n1. 先判断用户是否已明确说出风格名称、选项或清晰视觉特征。\n2. 已明确时，直接调用对应 Skill，不重复询问。\n3. 未明确时，用一句话给出 A、B、C 三个选项，并结合用户素材指出各自最明显的差异，再询问用户选择哪一个。\n4. 用户表示选不出来、都可以、想看看差异时，询问：是否要保持同一主题、文案、尺寸和原始素材，让三种风格各生成一张进行对比。\n5. 只有用户确认后才能进行多风格生成。图片生成通常有额外时间和 API 成本，不要默认批量出图。\n6. 用户确认对比后，分别调用三个具体 Skill，并保持变量一致：主题、文案、尺寸、主体素材、信息层级和交付格式相同，只改变风格系统。\n\n## 简短询问模板\n\n当需求模糊时优先使用：\n\n> 这次想用哪种平面风格：A 高级杂志海报、B 解构照片图片风格、还是 C Mono Color 单色印刷？如果你选不出来，我可以先跟你确认是否按同一内容各出一张做对比。\n\n如果用户提供了照片，补充指出 B 更强调保留并解构原照片，C 更强调把照片转成网点印刷，A 更强调大留白和编辑感。\n\n## 对比交付\n\n多风格对比时按 A、B、C 排列，每张图标明风格名。先展示图片，再用不超过三行说明构图、颜色与适用场景差异。不要在生成前把用户已经给出的主题、文案、尺寸或素材再问一遍。\n\n## 边界\n\n- 用户指定某一风格时，以该具体 Skill 的要求为准。\n- 不混合三套风格，除非用户明确要求融合。\n- 不把模糊的“做一张图”直接解释成三张图。\n- 不因用户没有选择就停住；先给出最短、最容易理解的选择问题。\n",
  "s19": "---\nname: gzh-design\ndescription: 微信公众号文章排版引擎，将 Markdown 转换为可直接粘贴到公众号编辑器的 HTML。主题风格从 references/theme-index.md 注册的自定义主题库中选取，自动章节编号、关键词下划线标记、引言卡片、目录导航、代码块、图片/GIF、作者签名。支持 Markdown / Word(.docx) / PDF / 纯文本输入（非 Markdown 先自动归一化），也支持\"一键自动排版\"（自动推断结构+选主题），还支持根据用户描述/参考图生成自定义主题组件库并保存本地复用。触发场景：(1) 用户提到\"公众号排版\"\"公众号文章\"\"微信排版\"\"gzh\"，(2) 用户想把文章（md/docx/pdf/纯文本）转成公众号 HTML，(3) 用户说\"自动排版\"\"一键排版\"公众号内容，(4) 用户想为公众号排版\"生成新主题/自定义风格/按这张图做一套组件库\"。不用于生成普通网页/落地页/PPT（用前端或 PPT 类 skill）。\n---\n\n# 公众号文章排版 Skill\n\n把一篇 Markdown 文章转换为可直接复制粘贴进微信公众号编辑器、且粘贴后样式不丢失的 HTML。\n\n核心资产是 `references/` 下的**主题组件库**（每套一个主题：设计变量 + 各组件完整 HTML + 模板骨架 + 映射规则）外加 1 套**通用增量库**（代码块 / 图片·GIF / 小标签标题，所有主题共用）。主题清单以 `references/theme-index.md` 为单一来源。本 SKILL.md 只负责流程与决策，**具体 HTML 代码一律从组件库取，不要凭记忆手写**。\n\n## 工作流\n\n### 0. 输入与格式归一化\n\n用户可能给：Markdown 文本或 `.md` 路径（直接进第 1 步）、`.docx`、`.pdf`、`.txt`/无标记纯文本、网页富文本。**非 Markdown 输入必须先读 [references/format-normalize.md](references/format-normalize.md) 按其规则转成 Markdown 草稿并做结构确认**（docx 用 `scripts/extract_docx.py`，PDF 用 Read 分页读取+清噪，纯文本按标题启发式推断结构）。什么都没给时，向用户索要。\n\n用户说「直接排 / 自动排 / 一键 / 不用问」时进**全自动模式**：跳过结构确认与选主题提问，自动推断结构、按题材自选主题、排版校验，交付时附决策说明（章节结构、自拟标题、选题理由）。\n\n### 1. 选主题（自动推荐制）\n\n读 [references/theme-index.md](references/theme-index.md)（主题信息的单一来源）。**据文章题材主动推荐最契合的主题**，再让用户一步确认——推荐但不擅自定死：\n\n- **用户已在请求里指定主题** → 直接用，不问。\n- **题材有明确契合** → 单问确认：「建议用 XX（理由），确认还是换一套？」选项给推荐项 + 1~2 个备选 + \"看全部\"。题材→主题契合参考 theme-index\"适用场景\"列：\n  - 教程 / 测评 / 清单 / 工具盘点 / 知识整理 / 方法论拆解（信息密度高）→ 摸鱼绿\n  - 深度分析 / 观点 / 力量感话题 → 红白色系\n  - 设计 / 科技评论 / 专业观点 / 高端品牌 → 石墨极简风\n  - 禅意 / 极简生活 / 深度随笔 → 留白禅意风\n  - 工具对比 / 创意评测（票据视觉隐喻）→ 摸鱼票据风\n  - 内刊手记 / 深度评测 / 案例复盘 → 橄榄手记\n- **无明显倾向** → 默认首选 theme-index 第一行（摸鱼绿）作为推荐项放第一位，用 AskUserQuestion 让用户在几套里选（主题多于 4 套时先按气质分组问，再问该组下主题）。\n- **全自动模式**（用户明说「直接排 / 一键 / 不用问」）→ 不提问，自动选题材最契合主题或默认第一行，交付时说明选择理由。\n- **用户对现有主题都不满意 / 想要新风格** → 走「自定义主题生成」流程（见下节），生成并登记后再回到本步选用。\n- **theme-index 为空** → 停止排版，告知用户需要先添加主题风格（可走「自定义主题生成」）。\n\n用户定下主题后，才进入该主题内部的组件匹配（第 3、4 步：判定文章类型 → 按该主题的配方表选组件组合）。\n\n### 2. 读组件库（两份）\n\n(1) 据 theme-index 中该主题的\"组件库文件\"列，Read 该主题专属组件库 `references/theme-{标识}.md`（含引言卡、章节标题、正文标记、签名等主题专属组件）。\n(2) **同时 Read 通用增量库** `references/common-components.md`——代码块、图片/GIF、小标签标题这三类所有主题共用，套用当前主题主色即可。\n\n后续生成完全依据这两份组件库，HTML 一律从中取、不要手写。\n\n### 3. 解析 Markdown 结构\n\n| 元素 | 识别规则 |\n|------|---------|\n| 文章标题 | `# 标题` 或 frontmatter `title` |\n| 开头引言 | 文章最开头的 `> 引用` 块 |\n| 章节标题 | `## 标题` |\n| 子章节 | `### 标题` |\n| 加粗 / 高亮 / 下划线 | `**文字**` / `==文字==` / `<u>文字<\/u>` 或 `++文字++` |\n| 引用段落 | 非开头的 `> 文字` |\n| 图片 / GIF | `![说明](URL)`、`![](xxx.gif)`（GIF 与图片同样处理） |\n| 代码 / 命令 / Prompt | ` ``` 围栏代码块 ``` `、行内 `` `code` `` |\n| 分割线 / 列表 | `---`、`***` / `- 项` 或 `1. 项` |\n| 表格 | `\\|` 分隔的 Markdown 表格（常来自 docx 转换）→ 优先用主题库的表格/卡片组件（主题库映射规则为准） |\n\n**解析完结构后，判定文章类型**（取主导类型，可复合）：教程/操作指南、盘点/工具清单、观点/深度分析、访谈/人物特稿、数据复盘/报告、生活/情感随笔、案例实战。判定依据：步骤和命令多→教程；并列条目多→盘点；引语和人物叙事多→访谈；数字和对比多→数据；论证推演多→观点。\n\n### 4. 按配方选组件组合 → 装配 HTML\n\n**先查所选主题库的「文章类型 → 组件组合配方」表**，按文章类型确定本篇的核心组件组合与点缀组件——不要拿到组件库就逐段随机选组件，配方保证同类文章的排版气质稳定。配方之外的元素再按主题库映射规则表补充。\n\n然后依主题库的**\"完整文章模板骨架\"章节**装配，把每个 Markdown 元素替换为对应组件：\n\n- **骨架顺序以主题库为准**，不同主题骨架可能不同，不要套用其它主题的骨架。\n- **行内标记按语义到所选组件库里找对应组件**（组件编号各库不统一，一律以语义为准、不要套固定编号）：`**加粗**`→主色加粗；`==高亮==`→渐变背景高亮；`<u>文字<\/u>` 或 `++文字++`→下划线；`~~文字~~`→荧光笔（底部半高亮）；`>引用`→引用高亮块。\n- 来自**通用增量库**的组件：` ``` 代码块 ``` `→ 1a 深色 / 1b 浅色代码块，行内 `` `code` ``→ 1c；`![说明](url)`→ 2a 图片（有说明才加说明组件）、`.gif`→ 2b GIF；需要突出的**小标题/强调**→ 3a 左竖条小标题或 3b 药丸标签，金句→ 3d、提示旁注→ 3e。**优先级：先查主题库映射规则表**——该主题有等价语义组件（如自己的金句/提示块）就用主题库版本保持气质一致；主题库没有对应组件时才用通用库 3x 并按其换色规则换成主题色。\n- **一篇文章只用所选主题的那一套组件**，不跨主题混用。\n- **强调与小标题用\"小标签/左竖条\"，不要用虚线框**：要突出一个小标题或一段内容时，用左竖条小标题（3a）、药丸标签（3b）、左竖条金句/提示块（3d/3e）；**不要用四周虚线框（`dashed` border）套一个标题**，那样笨重抢戏。\n\n### 5. 校验合规（强制）\n\n把生成的 HTML 写入目标文件后，**必须运行校验脚本**，ERROR 清零才算完成：\n\n```bash\n# 用脚本所在 skill 的绝对路径调用，HTML 参数也用其实际路径（两者目录通常不同）\n<SKILL_ROOT>/scripts/validate_gzh_html.py <生成的.html 的实际路径>\n```\n\n它确定性地检查平台禁用项和 `<span leaf>` 包裹。报 ERROR 就回到第 4 步修；**半角标点 WARNING 同样要修复到 0 再交付**（这是实际使用中最高频的返工点）。\n\n### 6. 输出\n\n**产物格式：纯 `<section>…<\/section>` 正文片段，从全局容器开始，不要包 `<!DOCTYPE>`/`<html>`/`<head>`/`<body>`**——公众号编辑器只接受正文片段，多余的文档外壳会被丢弃或干扰粘贴。\n\n1. **干净正文文件**：HTML 保存到当前工作目录，文件名 `{原文件名}_排版_{主题中文名}({英文标识}).html`（英文标识 = theme-index 组件库文件名去掉 `theme-` 前缀与 `.md` 后缀）。这份用于校验和手动粘贴兜底。\n2. **带「复制」按钮的预览页**（让用户一键复制，免去手动全选）：\n   ```bash\n   <SKILL_ROOT>/scripts/wrap_preview.py <上面的干净正文.html>\n   ```\n   产出 `{...}_预览.html`——浏览器打开后右上角有「复制到公众号」按钮，点一下即把渲染后的富文本复制到剪贴板（等价 Ctrl+A/Ctrl+C），再到公众号编辑器 Ctrl/⌘+V 粘贴。按钮和脚本只在预览外壳里、**不在被复制的 section 内**，所以粘到公众号的仍是干净合规正文。\n3. 告知用户：**打开 `{...}_预览.html` → 点右上角「复制」→ 公众号编辑器粘贴**；并给出干净正文文件路径作为兜底。附校验脚本结论（已通过 / 剩余 warning）。\n\n## 生成时的智能处理（这些是本 skill 的特色，必须做）\n\n1. **章节自动编号**：按 `##` 出现顺序分配 `01/02/03…`；末章若为结语/总结类，用主题库指定的结语编号变体（如 `∞`），主题库未指定时沿用数字编号。\n2. **英文标签**：据中文章节标题生成英文标签（实测→TEST、教程→TUTORIAL、总结→SUMMARY、思考→THOUGHTS…），主题库有对应槽位时使用。\n3. **正文关键词下划线（核心特色）**：对**每个正文段落**主动找出 1–3 个最重要的短语，用该主题的下划线 CSS（见 theme-index）标记。优先标核心观点、结论、关键数据、专有名词；短语 4–15 字；整段无要点可不标。即使原文没有任何加粗也要主动加下划线——它是出现频率最高的基础标记。\n4. **引言关键词高亮**：识别开头金句里的核心词，用高亮组件标记。\n5. **目录提取**：从所有 `##` 取前 3 个作为导读/目录要点（主题库有目录组件时）。\n6. **开头引言卡署名**：按文章的**作者或主题**而定——文章有署名就写\"—— 作者名\"，没有明确作者就用与主题相关的简短落款或直接省略。**不要固定写\"甲木\"**（尾部签名区同样用 `{{作者名}}` 占位，见第 7 条）。\n7. **尾部作者签名区（作者自填，仅末尾一处）**：**默认不写死任何人名**，用占位署名让用户替换成自己的。\n   - 第一句（作者介绍）：`我是 {{作者名}}，{{一句话简介，如：热衷于分享 AI 观察与干货}}`——用户在请求/偏好里给了署名或简介就直接填入；没给就**保留 `{{作者名}}` / `{{简介}}` 占位**，并在交付时提示用户替换成自己的署名。\n   - 第二句（互动引导，通用可保留原样）：`如果你觉得今天这篇有收获，欢迎**点赞、在看、转发**三连，我们下篇见`\n   - **原文末尾已有作者签名段**（如\"我是 XXX…\"）→ 直接沿用原文的署名，不替换成占位。\n8. **列表转换**：按主题库映射规则处理；无专属列表组件时转为带缩进的正文段落。\n9. **中文全角标点**：正文标点一律用全角（，。！？：；\"\"''（）—— …），不要用半角 `, . ! ? :` 和英文直引号 `\" '`。**生成 HTML 时就直接写弯引号\"\"''，不要先写直引号再事后替换**——原文里的直引号在转写时当场转换。**例外**：代码块、行内代码、英文专名/URL/代码标识符内部保持原样。\n\n## 视觉层级（3 层递进，所有主题通用）\n\n| 层级 | 作用 | 频率 | 手段 |\n|------|------|------|------|\n| 锚点层 | 最强锚点：产品名/步骤/CTA/核心金句 | 全文 ≤ 5 处 | 主色加粗、深色底白字引用 |\n| 标记层 | 正文关键词，每段 1–3 处 | 高频 | 下划线标记 |\n| 容器层 | 引用块、概念标签、长句强调 | 按需 | 浅底引用、荧光笔、徽章 |\n\n## 平台红线（核心，完整检查交给校验脚本）\n\n- **禁止**：`<style>`/`<script>`/`<div>`、`class`/`id` 属性、`position:fixed/absolute/sticky`、`float`、`@media`/`@keyframes`、`display:grid`、CSS 变量、外部字体/CSS。\n- **必须**：样式全部内联 `style`；所有文字节点用 `<span leaf=\"\">文字<\/span>` 包裹（否则粘贴后样式丢失）。\n- **可用**：`display:flex`（有限）、`linear-gradient`、`border-radius`、`box-shadow`、`<section>/<p>/<span>/<strong>/<img>/<h3>`。\n\n## Gotchas（真实排版踩过的坑）\n\n- **漏 `<span leaf>` 包裹**是最常见致命错——粘贴到公众号后样式整片丢失。靠第 5 步校验脚本兜底，别跳过。\n- **下划线：逐段落实、每段 1–3 个短语**。不要整段划线（失去焦点），也不要有的段标有的段漏；列表项里的关键描述同样要标。\n- **章节编号错乱**：严格按 `##` 顺序，不要跳号；结语编号变体只用于末章，中间章节不能用。\n- **签名区有且仅有末尾一个**：用固定文案，不在中间或多处出现；原文末尾若已有作者签名/\"点赞在看转发三连\"类段落，识别并**并入**这唯一的签名区/CTA 卡片，不要保留原文段又再生成一个。\n- **图片说明硬造**：只有 `![说明](url)` 里真有说明文字才生成说明组件；`![](url)` 空 alt 不要编造说明。\n- **图片自适应、不铺满**：`<img>` 一律 `max-width:100%;height:auto;display:block;margin:0 auto`——按图片自身尺寸显示、居中，大图缩到容器宽、小图保持原尺寸。**不用 `width:100%`**（会把小图也拉伸变糊）；只有表格 / 封面卡 / 流程图这类布局元素才用 `width:100%`。\n- **跨主题混用组件**：一篇文章只用所选主题 + 通用库的组件，不从其它主题借组件。\n- **锚点层滥用**：最强强调全文 ≤ 5 处，到处加粗等于没有重点。\n- **原文内容遗漏**：每个段落、每张图都要转换，不得漏；不要自行增删原文实质内容。\n- **占位图残留**：签名区/CTA 组件里若带名片图占位（如 `<img src=\"...名片或引导图URL\">`），没有真实图片 URL 时整行删掉，不要把占位符留在产物里。\n- **目录是精选不是全量**：前言导读/目录组件展示**精选的 3 个核心看点**，不是完整章节列表；章节多于 3 个时挑最重要的 3 个，不要硬塞或误导读者以为只有 3 章。\n- **不用虚线框**：突出标题/强调用小标签或左竖条（通用库 3a–3e），不要用 `border:…dashed` 四周虚线框包标题。**例外**：主题库明确定义的虚线组件（如摸鱼绿的 quote-box 引用框、oneliner-card 亮点卡）是该主题的风格特征，按主题库用法正常使用。\n- **标点别混半角**：正文出现半角逗号句号、英文直引号 `\"` `'` 都要改成全角；但代码块/行内代码内的半角符号保持原样，不要\"全角化\"代码。\n- **代码/Prompt 必须用代码块**：文章里的代码、命令、提示词用通用库代码块组件（1a/1b），不要塞进普通段落或引用块，否则缩进和等宽会丢失。\n- **代码块要紧凑、忌大空白**：用通用库 1a/1b 的\"每行一个 `<p style=\\\"margin:0\\\">`\"写法，**绝不用 `white-space:pre`**——它会把 HTML 源码里 span 前的缩进和行间换行原样渲染成大左缩进 + 空行；缩进只用全角空格 `　`，行距靠 `line-height:1.6`。\n- **待补素材居中**：`【插入…】`、待录屏 / GIF / 视频 / 成果图等占位，用通用库 **2c 居中素材占位板块**（浅底柔虚线框 + 居中图标与说明），不要用左对齐的提示块。\n\n## 自定义主题生成（第二条工作流）\n\n用户想要内置主题之外的新风格（说「生成一套新主题 / 自定义风格 / 按这张参考图做一套组件库」，或对现有主题都不满意）时，**读 [references/theme-generator.md](references/theme-generator.md) 并严格按其流程执行**：\n\n1. **收集偏好**：主题描述必填（或参考图），名称/ID/五色/字体/三类 TAG/圆角/阴影可空则自动补全；一次问全，不逐字段追问。\n2. **生成区块库 HTML**：用 theme-generator.md 末尾的【生成提示词】原样执行，产出 45~75 个 Block 的完整区块库，保存到 `assets/theme-previews/{theme-id}.html`——全部区块在同一页面连续排布，用户浏览器打开**整页一次浏览**确认风格，不逐块展示确认。\n3. **转换 + 登记**：用户确认风格后，转换为标准 `references/theme-{标识}.md`（**必须补 `<span leaf=\"\">` 包裹、去掉预览用 id、补齐五章节**，规则详见 theme-generator.md 第三步），登记 theme-index.md，跑 `component_lint.py` 到 0 ERROR。\n4. 交付后该主题即成为常驻可选主题，后续排版与内置主题完全同权。\n\n生成阶段以提示词规则为准；转换进主题库阶段以本文件「平台红线」和「添加新主题的规范」为准（两者冲突时后者优先，因为主题库直接决定排版产物）。\n\n## 添加新主题的规范\n\n新主题以 `references/theme-{英文标识}.md` 命名，内容必须包含：\n\n1. **设计变量速查表**（主色/浅底/深字/标题色/正文色/分割线色等）\n2. **各组件完整 HTML**（内联样式 + `<span leaf=\"\">` 包裹，遵守上面\"平台红线\"）\n3. **完整文章模板骨架**（组件装配顺序；若有目录/导航组件，明确其相对封面/引言的位置）\n4. **文章类型 → 组件组合配方表**（每种文章类型的核心组件组合 + 点缀组件，配方是排版气质稳定的关键）\n5. **Markdown → 组件映射规则表**\n\n添加后在 `references/theme-index.md` 登记一行（主题名 / 主色 / 适用场景 / 组件库文件 / 正文下划线 CSS），并跑 `python3 scripts/component_lint.py .` 确认组件库无反模式（0 ERROR）。\n\n> 触发与主题选择的回归用例见 `references/eval-cases.md`（维护时用于回归核对，不影响单次生成）。\n",
  "s20": "---\nname: ljg-roundtable\ndescription: >-\n  Structured roundtable discussion framework with a truth-seeking moderator\n  who invites representative figures for dialectical debate on any topic.\n  Use when user says \"圆桌讨论\", \"圆桌\", \"roundtable\", \"辩论\",\n  or wants to explore a topic through multi-perspective structured debate.\n---\n\n## Usage\n\n<example>\nUser: 圆桌讨论 人工智能是否拥有真正的创造力？\nAssistant: [Launches roundtable with moderator and representative figures]\n<\/example>\n\n<example>\nUser: 圆桌 自由意志是否存在？\nAssistant: [Launches roundtable discussion on free will]\n<\/example>\n\n## Instructions\n\n为了执行本项技能，请严格按照以下步骤操作：\n\n1. **读取参考资料**\n   读取本 `SKILL.md` 同级的 `references/original-prompt.org` 了解原始框架设计意图。\n   （不要写死 `~/.claude/skills/...` 这类绝对路径——本技能以软链方式安装，绝对路径会失效。）\n\n2. **解析议题**\n   从用户输入中提取核心议题。如果用户只说\"圆桌讨论\"未给议题，询问议题。\n\n3. **选人：提议代表人物**\n   根据议题，选择 3-5 位**真实历史/当代人物**作为代表，覆盖尽可能多的立场维度。每位人物需要：\n   - 姓名（真实人物，非虚构）\n   - MBTI 人格类型\n   - 核心立场（一句话）\n   - 选择理由（为什么此人对此议题有独特视角）\n\n   选人原则：\n   - 立场必须形成**张力网络**（非简单正反方）\n   - 优先选择在该领域有**经典著作或知名言论**的人物\n   - 至少包含一位\"意外视角\"——来自议题本身领域之外的人\n\n4. **开场：统一定义**\n   以主持人身份开场，展示参会人物列表，然后提出**定义性问题**：\n   > 「在深入探讨之前，我们应当如何定义 [议题核心概念]？它的核心要素是什么？」\n\n   每位参会者依次发言，格式为：\n   ```\n   【人物名】【行动标签】：发言内容\n\n   **简言之**：一句话总结\n   ```\n\n   行动标签包括：`陈述`、`质疑`、`补充`、`反驳`、`修正`、`综合`\n\n5. **对话循环**\n   每轮执行以下流程：\n\n   **5a. 动态发言轮**\n   - 不是每人固定说一次——根据讨论动态决定谁该发言\n   - 每人发言必须是对**前面发言的回应**（质疑/补充/反驳），不许自说自话\n   - 每段发言末尾必须有 `**简言之**：` 一句话压缩\n\n   **5b. 主持人综述**\n   发言结束后，主持人做三件事：\n   - 提炼本轮**核心争议点**（不是面面俱到，而是找到最深的裂缝）\n   - 生成**ASCII 思考框架图**（拓扑图/矩阵/光谱/树形——选最贴合本轮结构的形式）\n   - 提出**下一层引导问题**（从核心争议中生长出来的更深问题）\n\n   ASCII 图的设计原则：\n   - 高度概括本轮讨论的**结构**，不是复述内容\n   - 标出正/负反馈环、因果链、张力维度\n   - 形式不固定：可以是 2x2 矩阵、光谱轴、因果环路、层级树——哪种最见骨用哪种\n\n   **5c. 用户指令**\n   综述后展示指令菜单：\n   ```\n   【主持】：(指令: 可 / 止 / 深入此节 / 引入新人物)\n   ```\n\n   指令含义：\n   - `可`：接受下一层问题，继续推进\n   - `止`：结束讨论，进入总结\n   - `深入此节`：不推进新问题，继续围绕当前争议点深挖\n   - `引入新人物`：用户指定一位新人物加入（主持人介绍并请其就当前话题表态）\n\n6. **结束：生成知识网络**\n   用户发出 `止` 指令后：\n   - 主持人做**全局总结**\n   - 生成**完整知识网络** ASCII 图：标出所有关键概念、立场、争议点及其关系\n   - 列出**未解决的开放问题**（讨论中暴露但未穷尽的方向）\n\n7. **写入 org 文件**\n   将讨论全貌整合为 org-mode 格式并写入文件：\n   1. 运行 `date +%Y%m%dT%H%M%S` 获取时间戳\n   2. 写入 `~/Documents/notes/{timestamp}--圆桌-{议题关键词}__roundtable.org`\n   3. org 文件结构：\n      ```org\n      #+title: 圆桌：{议题}\n      #+date: [{日期}]\n      #+filetags: :roundtable:\n      * 议题与参会者\n      * 各轮讨论记录\n      ** 第 N 轮：{引导问题}\n      *** 发言记录\n      *** 核心争议\n      *** ASCII 框架图\n      * 知识网络（全局）\n      * 开放问题\n      ```\n   4. 向用户报告文件路径\n\n### 主持人行为准则\n\n- **理性之锚**：冷静客观，不偏向任何一方\n- **挖深不铺广**：每轮只追一条最深的裂缝，不面面俱到\n- **求真 > 和谐**：鼓励尖锐但有建设性的交锋，拒绝表面共识\n- **元认知**：在综述中暴露讨论的**结构**（假设、前提、推理链），不只复述内容\n\n### 参会者行为准则\n\n- 必须**忠于其真实思想体系**发言，不是泛泛而谈\n- 引用/化用其**经典著作或知名观点**\n- 发言有锋芒：质疑要见骨，补充要推进，不说正确的废话\n- 每段结尾 `**简言之**` 一句话压到极致\n",
  "s21": "---\nname: order-heatmap\ndescription: \"订单地址热力图生成技能。当用户提供包含订单地址的Excel或CSV文件、城市名称和高德地图API Key时，自动批量地理编码所有订单地址，生成行政区分布统计和交互式热力图散点图HTML。触发场景：订单分布分析、客户地址可视化、配送区域分析、门店辐射范围评估、用户地理分布热力图等。关键词：订单热力图、地址分布、地理编码、高德API、散点图。\"\nagent_created: true\n---\n\n# 订单热力图生成\n\n## 概述\n\n本技能通过高德地图API对Excel中的订单地址进行批量地理编码，生成行政区分布统计和交互式热力图。\n\n## 触发条件\n\n当满足以下任一条件时使用本技能：\n- 用户提供订单/客户地址数据（Excel/CSV），要求分析地理分布\n- 用户要求生成订单热力图、地址分布图、配送区域可视化\n- 用户提到\"热力图\"+\"地址/订单\"+\"高德API\"\n- 用户需要评估门店辐射范围或用户分布\n\n## 前置条件\n\n用户需要提供三项核心输入：\n\n| 输入 | 说明 | 示例 |\n|------|------|------|\n| 订单数据文件 | Excel(.xlsx)或CSV，含地址列 | `/path/to/orders.xlsx` |\n| 城市名称或adcode | 限定地理编码搜索范围 | `宁波市` 或 `330200` |\n| 高德Web API Key | 在 https://lbs.amap.com 申请 | `ab101e65...` |\n\n可选输入：\n- 门店/中心点坐标（经纬度）— 用于计算订单距离分布\n- 门店名称 — 用于地图标注\n- 地图中心点和缩放级别 — 默认自动计算\n- 显示模式 — 热力图 / 散点图 / 两者（默认）\n\n## 工作流程\n\n### 第1步：确认输入\n\n向用户确认以下信息（若未全部提供）：\n1. 文件路径 — 确认Excel/CSV文件位置\n2. 城市名称 — 限定搜索范围，提高编码准确率\n3. 高德API Key — 若用户未提供，引导至 https://lbs.amap.com 申请（免费）\n4. （可选）门店位置 — 经纬度或地址，用于距离分析\n5. （可选）工作表名/地址列 — 若表格结构特殊，需用户指定\n\n### 第2步：批量地理编码\n\n运行 `scripts/geocode_batch.py` 脚本：\n\n```bash\npython3 scripts/geocode_batch.py \\\n  --excel <文件路径> \\\n  --city <城市名或adcode> \\\n  --api-key <高德Key> \\\n  --output /tmp/geocode_results.json\n```\n\n脚本功能：\n- 自动检测工作表和地址列（支持表头匹配\"地址\"关键词，或按数据特征识别）\n- 支持 `--sheet`、`--address-col`、`--start-row` 手动指定\n- 200ms间隔限速（约5 QPS），符合高德免费配额\n- 支持断点续传（中断后重新运行自动恢复）\n- 输出JSON数组：每条含 address, lng, lat, district, city, province\n\n注意事项：\n- 大量地址（1000+）时运行时间较长，约5条/秒\n- 高德API免费版每日配额5000次，足够处理大多数场景\n- 部分地址可能编码失败（地址不完整、新楼盘等），脚本会记录失败原因\n\n### 第3步：数据质量检查\n\n编码完成后，检查结果质量：\n- 成功率 — 低于90%时提示用户检查地址格式\n- 异常行政区 — 检查是否有地址被错误归类到其他区/县\n  - 常见误判：地标名与区名冲突、新开发区域未收录\n  - 修正方式：手动修改JSON中对应记录的district和坐标\n- 距离异常 — 若提供了门店坐标，检查是否有距离异常远的点\n\n### 第4步：生成热力图\n\n运行 `scripts/generate_heatmap.py` 脚本：\n\n```bash\npython3 scripts/generate_heatmap.py \\\n  --input /tmp/geocode_results.json \\\n  --output <输出HTML路径> \\\n  --city <城市名> \\\n  --mode both\n```\n\n可选参数：\n- `--store-lat` / `--store-lng` — 门店坐标，启用距离分析\n- `--store-name` — 门店名称\n- `--center-lat` / `--center-lng` — 地图中心（默认自动计算质心）\n- `--zoom` — 缩放级别（默认12）\n- `--mode` — `heatmap`(纯热力图) / `scatter`(纯散点图) / `both`(默认，可切换)\n\n输出特性：\n- 自包含HTML，使用Leaflet + leaflet.heat（无需额外API Key）\n- 地图瓦片：CARTO Light风格，适配浅色主题\n- 侧边栏：区域分布统计条形图 + 距离分析\n- 交互：图层切换、缩放、点击标记\n- 按行政区着色，支持热力图和散点图双模式切换\n\n### 第5步：结果交付\n\n将生成的HTML文件通过 present_files 呈现给用户。\n若发现编码异常，在交付时一并说明修正情况。\n\n## 脚本依赖\n\n两个脚本均需要Python 3.8+，依赖：\n- `openpyxl` — 读取Excel\n- `requests` — 调用高德API\n\n安装命令：\n```bash\npip install openpyxl requests\n```\n\n## 高德API Key说明\n\n- 申请地址：https://lbs.amap.com → 控制台 → 应用管理 → 创建新应用\n- 选择\"Web服务\"类型（非iOS/Android SDK）\n- 免费配额：每日5000次地理编码调用\n- Key格式：32位十六进制字符串\n",
  "s22": "---\nname: product-sales-diagnosis\ndescription: 商品销量诊断——商品维度的销量走势与下架决策。输入商品明细表（线上商城/微盟/美团/抖音等电商或门店导出的商品行级数据，CSV 或 Excel），按自然周生成每个商品的销量走势，按「连续2周无销量即判已下架」加「销量跌幅 × 近一周销售贡献占比」分层给出 可以下架 / 需消耗原料准备下架 / 主力品下滑预警 的判定，含长青款保护（每周都在售且占比达标则只降级观察），并单列「销量明星」「新品」「长青款」三个分区，输出一份可直接发给客户或内部讨论的单文件 HTML 看板（含周销量走势缩略图、点击放大折线、全字段排序三角图标、分区筛选、点标签看证据、CSV 导出）。当用户提到「盘商品」「商品销量趋势」「哪些 SKU 该下架」「商品结构诊断」「动销分析」「滞销品清理」「销量明星」「新品表现」「长青款」「商品周报」「货盘精简」，或给出商品明细表要求做商品层面分析时使用。\nagent_created: true\n---\n\n# 商品销量诊断（product-sales-diagnosis）\n\n把一张商品行级明细表，变成一份能直接拿去开会讨论的「哪些 SKU 该下架」看板。\n\n> **本机运行环境（2026-11-10 安装时补，仅环境适配，不改任何判定规则）**：\n> `diagnose.py` 依赖 pandas / numpy / openpyxl。WorkBuddy 默认的 `python3`（3.13）没有这些库，\n> 本机 `/usr/bin/python3`（3.9.6）已装齐（pandas 2.3.3 / numpy 2.0.2 / openpyxl 3.1.5）。\n> 下方命令一律用 `/usr/bin/python3`，不要直接写 `python3`，否则会报 ModuleNotFoundError。\n\n## 何时用\n\n命中任一即用：\n\n- 用户给出商品明细 / 订单明细，问「哪些商品卖不动了」「哪些该下架」「商品结构怎么样」\n- 要求做商品维度的周趋势、动销分析、滞销品清理、货盘精简\n- 月报/季报里需要「商品结构」章节的支撑数据\n- 用户说「盘一下商品」「商品销量趋势」「SKU 诊断」\n\n不适用：只看整体大盘（用经营复盘类技能）；只想手工对比几个商品。\n\n## 输入要求\n\n**必需**：一张商品行级明细表，每行 = 一个订单里的一件商品，至少包含：\n\n| 字段 | 说明 |\n|---|---|\n| 商品名称 | 同名不同空格会被自动归一 |\n| 数量 | 件数 |\n| 金额 | 该行成交金额 |\n| 时间 | 付款时间 / 下单时间 / 日期，三者有其一 |\n\n**时间字段的两种来源**：\n\n1. 商品表自带日期列 → 一个文件就够\n2. 商品表没有日期列（如部分线上商城导出）→ 再给订单表（含订单号 + 付款时间），脚本按订单号关联\n\n**可选字段**：分类（用于分类汇总与节令识别）、单价、订单商品状态（剔退款）、付款方式（用于统计渠道构成）。\n\n**数据跨度**：至少 **2 个月（≥56 天）**。不足时脚本会跑但强提示「判定仅供参考」——规则本身要求 2 个月，短窗口的趋势不可信。\n\n## 🔴 销量口径：全渠道动销（默认，不要改）\n\n**统计这个商品在所有渠道卖出的总件数**：小程序/门店直接购买、储值卡支付、外卖（外部支付）、抖音券与美团券核销、活动兑换与赠品。\n\n**为什么不能按支付方式过滤**：下架决策问的是「这款产品还有没有人买」。同一款蛋糕，通过美团外卖卖出去和顾客到店买，后厨一样要做、原料一样要消耗。如果只统计自有支付，会把大批商品的销量低估一半以上——曾经出过这个错，一款全渠道卖 103 件的蛋糕只被算成 44 件，导致被误判下架。\n\n`--exclude-pay` 默认**为空**（不剔除）。只有明确要看单一渠道时才填，且报告里会标注「非全渠道口径」。\n\n## 执行流程\n\n### 第 1 步：确认字段与口径（先问，别猜）\n\n读到文件后先探测字段，把结果告诉用户并让其确认：\n\n- 找到了哪些列、映射到哪个角色（名称/数量/金额/时间/分类/状态/付款方式）\n- 时间取自哪里（商品表自带 or 订单表关联）\n- **不要问是否剔除支付方式**——默认就是全渠道，这是对的\n- 窗口天数（默认 60）、基准期天数（默认 28）、门槛件数（默认 8）\n\n字段识别不了时用 `--col-*` 显式指定，**不要猜列**——猜错会静默算错。\n\n### 第 2 步：跑计算\n\n```bash\n/usr/bin/python3 scripts/diagnose.py \\\n  --goods  <商品明细1.csv> [<商品明细2.csv> ...] \\\n  --order  <订单表1.csv>   [<订单表2.csv> ...]   \\\n  --out    ./out \\\n  --client \"客户名\"\n```\n\n**不要加 `--exclude-pay`**（默认全渠道）。\n\n多个月份分文件时并列传多个，脚本按列交集纵向拼接。\n\n常用参数：\n\n| 参数 | 默认 | 作用 |\n|---|---|---|\n| `--days` | 60 | 分析窗口天数 |\n| `--baseline-days` | 28 | 基准期天数（从上架日或窗口起点算） |\n| `--recent-days` | 7 | 近一期天数 |\n| `--min-base-qty` | 8 | 基准期最少件数，低于此判「数据不足」 |\n| `--offline-weeks` | 2 | 连续多少个自然周无销量即判「已下架」 |\n| `--star-share` | 5 | 销量明星：近一周占比高于此值（%） |\n| `--drop-cut` | 30 | 可下架 / 准备下架（跌幅路径）的最低跌幅（%） |\n| `--drop-risk` | 20 | 主力品下滑预警的最低跌幅（%） |\n| `--tiny-share` | 1.0 | 单周金额贡献门槛（%）。近 2 周每周都低于此值 + 排名都在下四分位 → 准备下架（不看跌幅） |\n| `--lq` | 0.25 | 下四分位界限（0—1），分位 ≤ 此值算垫底 |\n| `--top-pct` | 0.30 | 前段界限（0—1），分位 ≥ 1-此值算前段 |\n| `--evergreen-share` | 1 | 长青款：每周有成交且全窗口销售占比高于此值（%） |\n| `--evergreen-cap` | 关 | 关闭长青款标签 |\n| `--evergreen-downgrade` | 关 | 长青款命中下架阈值时强制降级为观察（旧行为） |\n| `--new-days` | 30 | 新品：首次成交距窗口末不超过此天数 |\n| `--judge-season` | 关 | 已废弃，保留仅为兼容旧脚本（季节款现在默认参与判定） |\n| `--keep-non-sale` | 关 | 保留运费/补差价等非售卖行 |\n| `--sheet` | 第1个 | Excel 工作表名 |\n| `--col-name` `--col-qty` `--col-amt` `--col-date` `--col-cat` `--col-price` `--col-status` `--col-pay` `--col-order` | 自动 | 覆盖列映射 |\n\n### 第 3 步：出报告\n\n```bash\n/usr/bin/python3 scripts/build_report.py --json ./out/诊断数据.json\n```\n\n默认产出**单文件 HTML**（ECharts 已内联，双击即开，可直接发给别人）。\n加 `--no-single` 输出轻量版（同目录需带 `echarts.min.js`）。\n\n### 第 4 步：交付前自检\n\n用 playwright 或直接开浏览器确认：\n\n- [ ] KPI 数字与 `诊断数据.json` 一致（含「销量明星」「新品」两个计数）\n- [ ] 重点清单每档只列 TOP5，超出部分有「另有 N 个未列出」提示\n- [ ] 三档清单里的商品，跌幅与「近 N 周排名」确实满足阈值（抽 1—2 个手算核对）\n- [ ] 抽一个商品手算某周排名：当周有成交商品中销售额排第几 / 当周参评商品数\n- [ ] 「可以下架」的商品近 3 周排名都落在当周后四分位（名次 ÷ 当周参评数 ≥ 75%）\n- [ ] 「准备下架」的商品分两种，逐个核对它是**哪条路**进来的：跌幅 ≥30%，**或者**近 2 周每周 `周占比` 都 < 1%。量小路径的商品跌幅可能是 0 甚至为正，这不是 bug\n- [ ] 量小路径的证据卡**不显示销量跌幅**（该商品可能根本没跌），只显示「近 2 周单周金额贡献」+ 排名；占比保留 2 位小数（0.11% vs 0.14% 用 1 位会看不出差别）\n- [ ] 明细表「近3周排名」显示的是**绝对名次 + 分母**（如 `8/113`），不是百分位；分母取自 `元信息.周池大小`，与 `商品.周名次` 同序对齐\n- [ ] **帕累托图**：柱子按销售额降序、曲线累计到 100%、80% 虚线与竖线位置正确；KPI「80% 销售额来自 N 个商品」与图里曲线穿过 80% 的位置一致\n- [ ] 帕累托 **x 轴只放商品序号**（不放商品名，名字长必糊），序号按图宽自动稀疏（`maxLabels = 图宽/26`，`interval = idx % step === 0`）；商品名只出现在 tooltip\n- [ ] 帕累托的横轴只统计**当前在售 + 有动销**的商品：零销（金额=0）不进 x 轴；`已下架` 与 `节令商品·可归档` 整条剔除（不是算作零销），否则停产商品会把长尾拉长、稀释集中度结论。页面上要写明剔除了多少个、剔除金额多少\n- [ ] 连续两周零销量的商品没有出现在「可以下架」或「观察」里\n- [ ] 长青款没有出现在「可以下架 / 需消耗原料」里（应已降为观察）\n- [ ] 点判定 tag 弹出的是**精简证据卡**：每档 1—3 行「指标 + 数值 + 是否触达阈值」，不是一长串数字\n- [ ] 证据卡底部有渠道构成条\n- [ ] 表头每列右侧有排序双三角，点击后当前列高亮且对应方向三角点亮\n- [ ] 明细表下方有「字段口径」说明，写清「窗口」是哪段日期\n- [ ] 点周销量小图能弹出放大折线，hover 能看到「销量 / 销售金额 / 金额占比」\n- [ ] 节令商品没有出现在下架建议里\n- [ ] 数据跨度 <56 天时，页面顶部有红色警示；截止日距今 >3 天时提示「近 7 天」不是最近 7 天\n\n## 判定规则（核心，改动需谨慎）\n\n按顺序命中即止：\n\n| # | 条件 | 结论 | 动作 |\n|---|---|---|---|\n| 0 | 商品名/分类含**具体节日**关键词 | **节令商品·可归档** | 节日短期产品，不参与下架判定；节后统一归档 |\n| 1 | 连续 **≥2 个自然周（≥14 天）无任何销量** | **已下架** | 视为已下架，**不再进入**下架/观察判定；确认链接是否已下、还挂着就去清 |\n| 2 | 跌幅 **≥ 30%** 且 **近 3 周排名都在下四分位** | **可以下架** | 跌了三周还一直在垫底区，已不是生意的一部分；直接下架 |\n| 3 | **近 2 周排名都在下四分位**，且满足二者之一：<br>① 跌幅 **≥ 30%**<br>② 近 2 周**每周**的单周金额贡献都 **< 1%**（该商品当周销售额 ÷ 当周全店销售额） | **需消耗原料·准备下架** | 已在垫底区但不满三周；不再补货，清完库存后下架。**②这条路不看跌幅**——量已经小到可忽略，涨跌都该清 |\n| 4 | 跌幅 **> 20%** 且 **近 2 周排名都在前 30%** | **主力品下滑预警** | 还是主力但在退潮，不能砍；同步推新品承接 |\n| 5 | 跌幅 ≥ 15%（未命中上面任一条） | 观察 | 再等一周，避免误判波动 |\n\n### 🔴 规则 3 为什么有两条路（2026-11-06 Mirror 追加）\n\n只看跌幅会漏掉一类该清的货：**体量本来就极小、每周都垫底，但因为基数太低，跌幅压根算不出来**。卖 3 件变 2 件是 −33%，卖 1 件变 1 件是 **0%**——两者都该清，但后者永远进不了跌幅门槛。\n\n所以第二条路只问两个问题：**「你是不是每周都在垫底区」+「你到底占多少」**。占比 < 1% 意味着全店每 100 块里它连 1 块都不到，这种商品占着菜单位、原料 SKU 和出品人力，但产出几乎为零。**这条路刻意不设跌幅**——平稳甚至微涨也照判（零售品牌 A本期就有一个 +2.9% 的进了名单）。\n\n两条路要分开讲，因为处理节奏不同：\n- **跌幅路径**：原来是主力、现在掉下来 → 值得问一句「为什么掉了」，可能是口味、季节、竞品或断货\n- **量小路径**：一直就这么小 → 不用问原因，它就是不该继续占位\n\n实现上判 `判定依据` 字段区分哪种触发，证据卡按实际触发的那条展示（跌幅路径显示跌幅，量小路径只显示周金额贡献），不要一律讲跌幅。\n\n### 🔴 「排名分位」怎么算（2026-11-06 改为排名制）\n\n**每周**把**当周有成交的商品**按销售额从高到低排名，算这个商品落在第几百分位：\n- **分位越低 = 卖得越差**\n- **≤ 25% = 下四分位**（垫底那四分之一）\n- **≥ 70% = 前 30%**\n- 当周零成交 → 记为 0（视为最差）\n\n**为什么必须只在「当周有成交」的商品里排名**：零售品牌 A 407 个商品，每周只有 110—160 个有成交，剩下 250—300 个当周零销。若按全部 407 个排名，下四分位会被零销商品占满 —— 只要卖出任何金额就进不了下四分位，规则失效。只在有成交的商品中排名，比的才是「同期谁卖得比你好」。\n\n**为什么用排名而不是固定金额线**：各周有成交的商品数不同（零售品牌 A 96—159 个），¥100/周 在 96 个商品的周是中等偏上，在 159 个商品的周可能是垫底。绝对金额线会随周漂移。\n\n**规则 2 天然包含规则 3**（近 3 周都在垫底 ⇒ 近 2 周当然也在），所以**先判 3 周、再判 2 周**，两者不重叠。\n\n### 长青款（只是标签，不再强制降级）\n\n窗口内**每周都有成交** + 全窗口销售额占全店 **> 1%** → 标「长青款」。\n\n换成排名规则后，**长期卖得好的商品天然进不了下四分位**，所以不会再被误判下架；如果它真在退潮（仍在前 30% 但跌幅超 20%），会落到「主力品下滑预警」——比降级成「观察」更有用，因为它直接告诉你该准备接棒了。\n\n**历史背景**：2026-11-06 之前用的是「跌幅 + 近一周销售占比」两点对比，零售品牌 A「招牌口味·芭乐布蕾爆浆蛋糕」（¥15,013，407 个商品中排第 6，9/9 周连续在售）因 -59.3% + 占比 1.68% 被判「可以下架」，客户指出它是长青品只是近期波动（芭乐过季）。当时临时加了「长青款强制降级为观察」；改成排名制后该保护已非必要，默认只作标签。如需旧行为加 `--evergreen-downgrade`。\n\n参数：`--evergreen-share`（默认 1）、`--evergreen-cap`（关闭标签）、`--evergreen-downgrade`（恢复强制降级）。\n\n**节令只指具体节日**：中秋 / 月饼 / 情人节 / 万圣节 / 圣诞 / 元旦 / 跨年 / 春节 / 年货 / 元宵 / 端午 / 粽子 / 七夕 / 母亲节 / 父亲节 / 教师节 / 国庆 / 重阳 / 腊八 / 儿童节 / 清明 / 平安夜 / 除夕 等。**全部归入同一个「节令商品·可归档」，不再细分「不判定 / 已到期」。**\n\n**季节描述不算节令，照常参与判定**：`秋冬限定` / `季节限定` / `时令` / `夏日` / `秋季` 这类只描述季节、不含具体节日的，**按普通商品判定**——它们是当季主推，卖不动恰恰是最该提醒的。IP 联名（`汪汪限定` / `TAGI 限定`）同样照常判定。\n\n**规则 0、1 优先**：命中节令或连续两周零成交的商品，即使跌幅 −100%，也**不会**出现在「可以下架」或「观察」里。\n\n**两个「分区标签」不参与判定，只做结构观察**（与判定并列显示，可同时命中）：\n\n| 分区 | 定义 | 用途 |\n|---|---|---|\n| **销量明星** | 近一周销售额贡献占比 **> 5%** | 当前撑量的主力；下架决策时优先保 |\n| **新品** | 首次成交距窗口末 **≤ 30 天**且仍在售（节令商品不重复计入） | 看新品接棒：上得快不快、有没有量 |\n| **长青款** | 每周都有成交 + 全窗口销售占比 **> 1%** | 见上方保护规则；命中时判定自动降级为观察 |\n\n**跌幅定义**：从商品上架日（或窗口起点）起 `baseline_days` 天为基准期，与最近 `recent_days` 天比较，**均按日均**（消除周天数不一致）。\n`跌幅 = (近一期日均 − 基准期日均) ÷ 基准期日均`。\n\n**近一周销售贡献占比** = 该商品最近 7 天销售额 ÷ 全店同期销售额。\n\n## 在售状态怎么判断\n\n源表通常没有「上架/下架」字段，用**连续无成交周数**代理：\n\n- 连续 **≥ 2 个自然周（≥14 天）零销量**（或整个窗口零成交）→ **已下架**\n- 否则 → **在售**\n\n回到在售状态需要重新出单。`下架原因` 字段会写明是「连续 N 周无销量」还是「整个窗口无成交」，报告表格的「距末售」列会直接显示这句话。\n\n## 已知必踩的坑\n\n1. **「商品数量」对定制/虚拟商品可能是金额错位**：某些店铺的「来图定制」行会写成 `单价=1、数量=订单金额`。不剔会让该品类件数虚高上百倍。脚本默认剔 `来图定制|运费|补差价|蜡烛|刀叉|餐具|收藏福利`，并按 99.9 分位截断异常数量。\n2. **同名商品因首尾空格被拆成两行**：聚合前必须 `strip` + 压缩连续空白，否则趋势被劈开。\n3. **首末周天数不足 7 天**：一律用日均比较，绝不直接比绝对件数。\n4. **pandas 的 NaN 在 `if` 里是真值**：混合字典建 DataFrame 时缺失键会填 NaN，布尔列必须显式 `.fillna(False).astype(bool)`，否则整表误判。\n5. **低基数商品会淹没结论**：基准期只卖 3—5 件的商品，跌幅再大也是噪声。用 `--min-base-qty` 抬门槛，报告里也能按基准期件数筛。\n6. **渠道口径先对齐**：客户若在团购平台（抖音券/美团券）也有同款，但那部分商品行与门店 SKU 不完全对应，先问清是否剔除，否则「销量暴跌」可能只是渠道迁移。\n\n## 交付物\n\n| 文件 | 用途 |\n|---|---|\n| `诊断数据.json` | 中间数据，可二次分析或导入 BI |\n| `<客户>_商品销量诊断_<截止日>.html` | 主交付物，单文件 |\n| CSV（页面内按钮） | 当前筛选结果导出，供 Excel 继续处理 |\n\n## 报告怎么读给客户听\n\n不要只念数字。建议顺序：\n\n1. **先给结论数量**：可以下架 N 个、准备下架 M 个、主力品下滑预警 K 个，可释放月销售额 ¥X\n2. **点 2—3 个具体商品**：名称 + 跌幅 + 近一周占比 + 月缺口，说明「为什么砍它」\n3. **单独说已下架链接**：连续两周零成交的有多少个，问客户「是下架了还是断货」——链接还挂着就是白占流量\n4. **先夸再提结构问题**：先说销量明星是哪几个、新品接棒得怎么样，再说长尾占比过高（如 70% 的商品月销不足 8 件）——这不是下架几个 SKU 能解决的，是货盘结构问题\n5. **节令商品一句话带过**：中秋月饼这类跌幅 -90% 不是产品问题，不用展开\n\n边界情形与规则推导见 `references/rules.md`。\n",
  "s23": "# 桌面技能路由表\n\n> 生成：2026-09-16 ｜ 更新：2026-09-17 ｜ 唯一基准：`~/MindPalace/skills/` ｜ 共 54 个技能（+ 若干参考资料）\n>\n> 安装方式：本目录是唯一唯一基准，Agent 目录只放**绝对路径软链**，不复制。\n> 改唯一基准即全局生效。当前入口：`~/.workbuddy/skills/`（WorkBuddy）、`~/.agents/skills/`（多端兼容）。\n\n## 参考资料（不是技能，不安装）\n\n| 提到什么 | 看哪份 | 说明 |\n|---|---|---|\n| **标杆项目、模仿标杆项目、参考标杆项目、照着这个模式做** | `course-business-model-structure-copy/标杆项目运营模式拆解.md`（配图在同目录 `assets/`，8 张） | 标杆项目 9.9 元引流课 → 7 天复盘营 → 年会员+选课券 → 高阶私董会 的完整拆解。2026-09-17 起停用安装，降级为资料。**正文 100% 是标杆项目这一个案例，不是通用工具**；拆别的课只能用它的 11 节骨架 |\n| 九宫格经营诊断产品方案评估 | `九宫格经营诊断_产品与推广方案评估包.md` | 交给外部顾问评估用的方案包 |\n| Mirror 写作画像原始记录 | `写作与表达偏好画像.md` | `writing-profile` 画像的上游来源 |\n| 课程结构仿写原稿 | `分享&课程结构仿写.md` | 与上一份标杆项目拆解内容相同，是没加 frontmatter 的原稿 |\n| 蛋糕月度分析原稿 | `蛋糕月度经营分析策划.md` | 已是 `cake-business-planning` 的前身，内容重复 |\n| 客户提案原稿 | `客户提案SKILL.md` | 已是 `customer-full-case-marketing-proposal` 的前身，内容重复 |\n| 解构照片风格原稿 | `解构照片风格.md` | 已是 `deconstructed-photo-style` 的上游规范 |\n| 九格 H5 工具源码 | `cake-package-蛋糕经营技能组/jiuge-business-planner/` | 前端+Node 服务，不是技能，无 SKILL.md |\n\n## 总门禁（Mirror 2026-09-16 定的规矩）\n\n**任务落到下列任一领域，先问一句「这次要用 X 技能吗？」再动手，不静默调用。**\n\n| 领域 | 触发词 | 技能 | 调用前要问的 |\n|---|---|---|---|\n| 设计 / 视觉出图 | 海报、封面、编辑图片、单色、双色、解构照片、Zine、杂志感 | `graphic-design`（路由）→ `advanced-poster-maker` / `deconstructed-photo-style` / `mono-color` | 用哪一套风格？要不要同素材各出一张对比？ |\n| 蛋糕经营分析 | 蛋糕、烘焙、月度计划、九宫格、上新、节日、渠道、大活动 | `cake-business-planning`（主入口）→ 8 个子技能 + `cake-big-campaign-marketing-planning` | 要端到端还是只跑其中一步？目标月份？ |\n| 写作 | 写文章、随笔、评论、小说、改稿、润色 | `writing-profile` | 要不要套用 Mirror 写作画像？ |\n| 公众号 | 公众号排版、微信排版、gzh、md 转公众号 HTML | `gzh-design`、`dbs-wechat-html` | 用哪套主题？还是直接自动排？ |\n| 内容日常 | 今天的选题、每日选题、候选选题、发布登记、回收数据 | `alic-daily-topics` | 只在 Mirror 明确要选题/登记时触发 |\n| 商业分析 / 咨询 | 商业机会、竞品、定位、定价、业务诊断、多视角评审 | `money`（工作/客户/正式咨询）／ `dbs`（个人内容与个人判断） | 用哪一侧？范围是单项还是全案？ |\n| 内容诊断 / 传播 | 没流量、没戳中、完播率低、开头留不住、标题、逐字稿 | `dbs-resonate` / `dbs-spread` / `dbs-hook` / `dbs-script-flow` / `dbs-xhs-title` / `dbs-content` / `dbs-ai-check` | 要诊断还是改写？ |\n| 结构化讨论 | 圆桌讨论、圆桌、辩论 | `ljg-roundtable` | 议题是什么？（会往 `~/Documents/notes/` 写 org 文件） |\n| 客户提案 | 客户提案、全案营销方案、提案会 | `customer-full-case-marketing-proposal` | 资料齐不齐？出 PPT 还是文稿？ |\n| 商品销量诊断 | 盘商品、哪些 SKU 该下架、商品销量趋势、动销分析、滞销品、货盘精简、商品周报 | `product-sales-diagnosis` | 数据跨度够不够 2 个月？字段映射先确认；默认全渠道，别按支付方式过滤 |\n\n## 按需调用，不默认触发\n\n这些要么要自备凭证、要么会写家目录、要么门槛高，**必须问过再用**。\n\n| 技能 | 为什么单列 |\n|---|---|\n| `dbs-video-extract` | 要 TikHub + 轻抖**付费**凭证；会读 macOS 钥匙串、写 `~/.config/dbs/API_Keys.md` |\n| `dbs-install-skill` | 会写 `~/.claude`、`~/.workbuddy`、`~/.hermes` 等多个 Agent 目录；本机已有自己的软链流程，不默认用 |\n| `dbs-update` | 联网拉官方 dbskill 并**覆盖**唯一基准，改前必须确认 |\n| `dbs-save` / `dbs-decision` / `dbs-report` / `dbs-restore` | 默认写 `~/.dbs/`（可能含收入、客户、商业秘密） |\n| `dbs-skill-maker` / `dbs-agent-migration` | 会动项目结构和文件 |\n| `dbs-content-system` / `dbs-knowledge` / `dbs-learning` | 会新建目录、复制素材、落盘成体系 |\n| `install-skill-pack` | 装/更新技能包；本身要求先做安全审计 |\n| `order-heatmap` | 要自备高德 Web API Key；依赖 `openpyxl`、`requests` |\n| `dbs-content-risk-check` | 发布前合规检查，涉及红线判断，逐句过 |\n\n## 不启用的场景\n\n- `graphic-design` 系列**不用于**密集促销海报、电商主图、常规商业活动物料（除用户明确要极简编辑风格）。\n- `cake-*` **不用于**通用餐饮或复合业态规划；`cake-big-campaign-marketing-planning` 只在已确认真实大项目时用，不因月份是 6/11/12 月就自动起。\n- `gzh-design` **不用于**普通网页、落地页、PPT。\n- `writing-profile` **不用于**日常邮件、短消息、技术文档、代码、事实性回答。\n- `money` 与 `dbs` 有边界：工作项目/客户交付/正式咨询用 `money`；个人内容创作、观点表达、个人商业判断用 `dbs`。\n- `deconstructed-photo-style` 必须以用户照片为唯一视觉来源，无照片时只追问、不凭空生成。\n\n## 唯一基准路径与更新方式\n\n**2026-11-10 新增**：`product-sales-diagnosis`（商品销量诊断），唯一基准 `product-sales-diagnosis/`，来源为资料库「商品销量诊断」文件夹内的技能代码页。运行须用 `/usr/bin/python3`（3.9.6，已装 pandas / numpy / openpyxl），默认 `python3` 3.13 无依赖。更新以资料库页面为准，重新下载覆盖唯一基准即可，不要改软链。无凭证、无外联、无家目录写入；不列入门禁清单。\n\n| 包 | 唯一基准 | 装了几个 |\n|---|---|---|\n| dbskill 个人商业与内容工具箱 | `dbskill-个人商业与内容工具箱/skills/` | 33（含主入口 `dbs`） |\n| 蛋糕经营技能组 | `cake-package-蛋糕经营技能组/` | 9（8 个子技能 + 大活动扩展） |\n| 设计视觉 | `设计视觉/`（`advanced-poster-maker`、`mono-color`） | 2 |\n| 单技能 | `writing-profile/`、`money-商业咨询诊断/`、`gzh-design-skill-公众号排版/gzh-design-skill/`、`ljg-roundtable-李继刚圆桌会议/ljg-roundtable/`、`alic-daily-topics-作者每日选题/`、`deconstructed-photo-style/`、`graphic-design/`、`customer-full-case-marketing-proposal/`、`order-heatmap-订单热力图/`、`install-skill-pack-技能包安装/` | 10 |\n| 参考资料（非技能） | `course-business-model-structure-copy/`（标杆项目拆解，已停用安装）、`九宫格经营诊断_产品与推广方案评估包.md`、`写作与表达偏好画像.md`、`分享&课程结构仿写.md`、`解构照片风格.md`、`蛋糕月度经营分析策划.md`、`客户提案SKILL.md`、`cake-package-蛋糕经营技能组/jiuge-business-planner/`（H5 工具源码，无 SKILL.md） | 不安装 |\n\n合计已装 **54** 个技能（dbskill 33 + 蛋糕 9 + 设计视觉 2 + 单技能 10）。\n\n> **给未来的自己**：技能安装扫描一律用 `find <唯一基准> -name SKILL.md`。已停用的技能包要把 `SKILL.md` 改名，否则会被再次抓走——`course-business-model-structure-copy` 就是这么降级成 `标杆项目运营模式拆解.md` 的。\n\n更新流程：改桌面唯一基准 → 软链自动生效，不用重装。新增技能后在 `~/.workbuddy/skills/` 与 `~/.agents/skills/` 各建一次绝对路径软链：\n\n```bash\nln -sfn \"~/MindPalace/skills/<唯一基准目录>\" ~/.workbuddy/skills/<技能name>\n```\n\n多技能包（dbskill、cake-package、gzh-design、ljg-roundtable）必须**整包留在桌面，只链子目录**——子技能靠 `Path(__file__).resolve()` 往上找包根，整包挪走路径就断。\n\n## 已知缺口（2026-09-16 审计，09-17 更新）\n\n1. `course-business-model-structure-copy` 的 8 张配图**已于 2026-09-17 补齐**，同一天该技能**停用安装**、降级为参考资料（`SKILL.md` 已改名）。\n   图源：`~/Documents/work/outputs/data-training-course-site-deploy/yitang-report/assets/`（8 个文件全）。\n   另一份 `~/Desktop/独立项目/标杆项目运营模式拆解报告/assets/` 内容相同但**缺 `05_unlock_page.png`**，别从那拷。\n   顺带全量扫描了所有技能的相对引用（`references/` `scripts/` `assets/` `templates/` 等），除占位符外无其他断引用。\n2. **标杆项目拆解这份内容现在桌面存了 3 份**：`course-business-model-structure-copy/标杆项目运营模式拆解.md`、`分享&课程结构仿写.md`、`course-business-model-structure-copy-独立安装包.zip`。内容是同一份。要合并得先定哪份为准——没动。\n3. `~/.codex/skills/` 有 96 项，其中 `money`、`dbs-spread` 等是**内容与桌面不一致的实体副本**（不是软链）。桌面已在 2026-09-16 同步到 codex 的 `money` 新版；其余副本仍可能与桌面漂移，建议后续统一。\n4. 技能许可证：\n   - `dbskill` = **CC BY-NC 4.0**，非商用。个人用没问题；**对外当自有方法论卖、或用于客户收费交付，都不在授权范围内**。\n   - `gzh-design` = **AGPL-3.0**，修改后分发要开源。\n   - `mono-color` = 代码 MIT，但 `examples/` 里的示例图和作品**不在 MIT 范围内**，不能当自有素材用。\n   - `advanced-poster-maker` = MIT。\n5. `.backup-2026-09-16/` 是本次安装前的备份（money 旧版、大活动裸 md、ljg-roundtable 原文件）。\n",
  "s24": "---\nname: advanced-poster-maker\ndescription: Create quiet, high-end zine and editorial poster prompts plus matching generated bitmap images. Use when the user asks for 高级海报制作、高级感海报、极简海报、杂志感海报、Zine 海报、日系或韩系编辑海报, or provides a theme, sentence, object, mood, article idea, photo, or content brief and wants large negative space, aged paper texture, experimental typography, and restrained color accents. Do not use for dense promotional, e-commerce, or conventional commercial campaign posters unless the user explicitly wants this sparse editorial style.\n---\n\n# 高级海报制作（Minimal Zine Poster）\n\nTurn the user's content into both:\n\n1. a final image-generation prompt, and\n2. a generated raster image made from that prompt.\n\n## Mode Policy\n\nUse **Standard Mode** for all generation. Use the Standard Mode Prompt Compiler in this `SKILL.md` to convert the user's content into a compact, imageable, high-fidelity prompt. If the user asks for higher quality, strengthen the prompt using the rules below.\n\n## Standard Mode Prompt Compiler\n\nDefault generation should compile only the parts that become pixels in the final image prompt.\n\n### Visual Rules Used by the Prompt Compiler\n\nUse these rule groups as prompt material:\n\n- **风格总述:** use only the visual identity and anti-identity: poetic minimal paper poster, huge negative space, old paper, tiny anchor, sparse type, one clear high-chroma anchor, zine/editorial mood.\n- **核心视觉规则:** use the concrete renderable rules for canvas, composition, background, image anchor, typography, color, texture, lighting, and mood.\n- **稳定共性:** use as non-negotiable must-haves: vertical 3:5 paper canvas, small cluster, scanned-paper view, old print defects, serif/typewriter text, and a saturated color anchor visible at thumbnail size.\n- **可替换变量:** use as slot choices: object, photo/cutout/silhouette/block type, accent color, text line, date/weather, position, paper tone.\n- **反向约束:** use as negative prompt material.\n- **Prompt 结构模板:** use its field order, not its sample wording.\n\nDo not use these as default prompt material:\n\n- source path, sample count, README/metadata notes, or analysis scope\n- long explanatory prose about why the style works\n- sample-specific signatures, dates, captions, objects, or text\n- example prompts as text to imitate line by line\n- checklist phrasing unless it becomes a concrete visual constraint\n\n### First-Principles Prompt Fields\n\nEvery Standard Mode prompt must answer these rendering questions in this order:\n\n1. **Canvas:** What is the output frame and base surface?\n   - tall vertical 3:5 phone-poster; full-frame aged paper; no border, no mockup.\n\n2. **Attention Geometry:** Where does the eye go and how much is empty?\n   - 70%-90% plain paper; one visual cluster occupying about 8%-25%; placed center, upper-middle, lower-middle, lower-left, or upper-right; no edge-hugging.\n\n3. **Image Anchor:** What is the one imageable subject?\n   - convert the user's theme into one object, fragment, photo crop, specimen, cutout, silhouette, old printed illustration, texture window, or small conceptual relation.\n\n4. **Anchor Treatment:** What material process makes the anchor belong to paper?\n   - grayscale photos and paper fragments may use low contrast, photocopy softness, torn edge, softened edge, halftone, scanline, risograph grain, xerox wear, ink bleed, or slight misregistration. Do not apply low saturation or low contrast to the chosen color anchor.\n\n5. **Typography System:** How does text behave visually?\n   - small serif/typewriter/monospaced type; one short readable phrase; optional tiny date/location/weather and signature; semi-legible microtext or fragmented letters; text can drift, press against the image edge, blur, or misregister.\n\n6. **Color Logic:** What is the restrained accent strategy?\n   - paper tones plus gray/black support one unmistakably high-chroma anchor. Prefer cobalt or ultramarine; rotate through cyan, violet, magenta-pink, lemon yellow, pear green, orange, or tomato red. The color may be the subject, a flat silhouette, an irregular cutout, a substantial block, a partial-color photo region, or bold fragmented type. It must not be reduced automatically to a tiny dot or hairline.\n\n7. **Reproduction Texture:** What print/scanning process defines the whole image?\n   - flat orthographic scanned-paper appearance; matte absorbent paper; diffuse light; low-to-medium contrast; no hard shadow; no 3D depth.\n\n8. **Emotional Temperature:** What should the viewer feel before identifying the object?\n   - quiet, poetic, nostalgic, sparse, diary-like, archival, distant, memory-like, Japanese/Korean indie zine or minimal editorial.\n\n9. **Hard Avoids:** What must not appear?\n   - full-bleed scene, commercial headline, product ad, logo/CTA, glossy mockup, clean UI white, cinematic lighting, 3D, neon, cute cartoon, fashion editorial drama, dense scrapbook, too many colors, long clean text.\n\n### Standard Color Engine\n\nThis section defines the color strategy for Standard Mode.\n\n- Default to one visibly saturated, opaque chromatic ink anchor. Use wording such as `fully saturated cobalt-blue risograph ink`, `opaque ultramarine cutout`, `vivid pear-green flat silhouette`, or `clean tomato-red printed block`.\n- Keep the paper, grayscale photo, microtext, and secondary marks subdued. Preserve saturation in the color anchor even when adding grain, halftone, ink bleed, or misregistration.\n- The high-chroma area should occupy roughly 0.8%-2.5% of the whole canvas or 15%-35% of the small visual cluster. It must remain visible when the image is viewed as a thumbnail.\n- Color can carry the subject itself. Prefer a colored tree, fruit, shell, flower, geometric cutout, window, poster fragment, or image panel over a gray object with one colored registration tick.\n- For a single image, use a substantial color anchor by default. For batches, at least 60% of images must use a colored subject, cutout, or block; the remaining images may use dots, hairlines, or colored type for rhythm.\n- Do not use `near-monochrome`, `no strong accent`, `pale accent`, `muted accent`, `faded accent`, or `pastel accent` unless the user explicitly requests monochrome, muted, or pastel output.\n- Do not describe the entire image as low saturation. Apply `low contrast` and `muted grayscale` only to paper, photos, and secondary ink.\n- Use only one main high-chroma hue per image. A tiny secondary hue is allowed only when it supports the subject and does not make the poster commercially colorful.\n\n### Standard Prompt Shape\n\nWrite the final Standard Mode prompt as four compact paragraphs:\n\n1. canvas + paper + negative space + cluster size/location\n2. subject metaphor + anchor type + anchor treatment\n3. typography + accent strategy + print defects\n4. flat scan mood + avoid-list\n\nIn paragraph 3, state the exact high-chroma hue, its material form, and its approximate visual share. This structure is more important than reciting every rule. Prefer a concrete, imageable prompt over a long style essay.\n\n## Variation Engine\n\nBefore writing the prompt, choose one option from each axis. Randomness must change visual grammar, not only position. If recent outputs used the same layout or anchor, choose a different one.\n\n### Layout Family\n\n- **center-fragment:** tiny central image or object with surrounding air\n- **lower-left-float:** small anchor in the lower-left quadrant, lots of empty top space\n- **upper-right-block:** small color/photo block in the upper-right with loose text drift\n- **dual-panel:** two small overlapping or adjacent panels with a narrow gap\n- **irregular-cutout:** torn or organic paper shape carrying image or type\n- **type-led:** typography is the main visual anchor, image secondary or absent\n- **dot-orbit:** dots, letters, or hairline create an orbit around a small subject\n- **single-specimen:** one isolated object or mark with almost no support graphics
