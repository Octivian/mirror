26-09-18 11:47：Mirror 拍板 U1、U2（改题）、S2、S5，并新增 S1、S3、S4、S6。\n- 2026-09-18 10:37：首轮重估给出 6 条，其中 U 系列的核销、定制、抽奖三条被 Mirror 判定为小问题。\n\n---\n\n## 四、纪律\n\n1. 延续对话先读本文件。\n2. 不擅自新增、删除、降级、改标题。要动，先在回复里说明。\n3. 该他补的细节写进「还缺什么」，不许我自己编。\n",
  "s48": "# 区域品牌 D｜判断句素材与数据锚点\n\n> 整理：2026-09-18\n> 用途：内容写作时直接取用的句子与数字。**所有数字均已回原始文件核对。**\n> 对外口径：客户名写作「某蛋糕品牌」，不出现城市、门店名、可反推的时间+营收组合。\n\n---\n\n## 一、判断句（可直接用作开场或落点）\n\n以下前五句来自 Mirror 本人的叙述（已去掉英文与口语碎词），后四句是我根据材料整理的说法，可用可不用。\n\n1. 押注的地方没长出来，没押的地方起来了。\n2. 蛋糕的爆发和我有关系。「没用」说的是前面那将近一年。\n3. 我建议关店，合作停止半年之后，客户才关的。\n4. 现在客户关了两家店、留下两家，老店重新翻新，重心转向甜品和蛋糕——而我已经不知道内部数据了。\n5. 咨询顾问的宿命是：你永远不知道自己的建议最后怎么样了。\n6. 我做了两年，几十个动作都是对的，账面没有转正。真正动账的，是关掉两家店。\n7. 我算过的那张表，两年后变成了现实。\n8. 小店的结构性亏损，靠点状运营动作救不回来。真正动账的只有三刀：砍品类、砍门店、换产品结构。这三刀都要老板点头，都要有人先难受。\n9. 面包线的占比从来没有动过——21% 到 20%，掉了 1 个百分点。而它的销量，半年里少了一半。\n\n---\n\n## 二、数据锚点（已核）\n\n### 1. 面包线：押注失败，数据成立\n\n**品类贡献占比（2025 上半年 vs 2024 上半年）**\n出处：`周月会留存/7月/区域品牌 D半年复盘会-7月.pptx` p17\n\n| 品类 | 2025 上半年 | 2024 上半年 |\n|---|---|---|\n| 鲜奶小蛋糕 | 27% | 28% |\n| **现烤面包** | **20%** | **21%** |\n| 烧仙草&冰冰饭 | 15% | 13% |\n| **大蛋糕** | **12%** | **9%** |\n| 鲜奶茶果茶 | 7% | 10% |\n| 简餐小食 | 7% | 8% |\n| 特色雪花冰 | 7% | 6% |\n\n**同比（2025 上半年 vs 2024 上半年）**\n出处：同上 p18\n\n- 现烤面包：实收 **-30%**、销量 **-46%**、单价 +23%\n- 鲜奶小蛋糕：实收 -28%、销量 -43%、单价 +15%\n- 大蛋糕：实收 **+10%**、销量 +9%、单价 -15%\n- 整体实收同比：**-14%**\n\n**面包日均实收的持续下滑**（月会口径）\n出处：`7月/区域品牌 D8月月会.pptx` p9、`9月/区域品牌 D9.5月会.pptx` p9、`10月/区域品牌 D10.24周会.pdf` p8\n\n- 6 月 78,156（÷30 ≈ 2,605/天）\n- 7 月 78,266（÷31 ≈ 2,525/天）\n- 8 月 76,568（÷31 ≈ 2,470/天）\n- 10/13–10/19 单周 13,531（≈ 1,933/天）\n\n**进场基线**\n出处：`24-11月/区域品牌 D提案-终版.pptx` p10、p53\n2024 年 3–7 月 vs 2023 年同期：现烤面包 销量 +56%、应收 +57%、实收 +42%，金额占比 21%。\n\n> **结论：面包线从进场到现在，占比 21% → 20%，实收同比 -30%（差于整体的 -14%），销量腰斩靠提价收住跌幅。「面包能力长出来就开新店」这条路在数据上从未成立。**\n\n### 2. 亏损与结局\n\n- 进场时（2024 年 1–9 月）：实收 742.2w、同比 **-23.56%**、净利润 **-281,094**（占比 -3.79%）。2023 年同期为 +136,234（1.40%）。出处：`10月/区域品牌 D年度复盘-终版.pdf` p4\n- 合作期末（2024.12–2025.9）：流水 876.8w（-16%）、实收 676.4w（-14%）、毛利 401.7w（-11%）、净利润 **-81,556，亏损收窄 75%**。出处：同上 p13\n- 门店 FLR（房租+人力+食材）：**一店 76%、二店 90%、三店 105%、四店 106%**，结论「除一店外均无利润空间」。出处：同上 p49\n- 后续（Mirror 叙述，非材料）：关掉三店与四店，保留一店与二店，重心转向甜品与蛋糕，一店翻新。\n\n> **关店判断的验证：算出来 105% 和 106% 的两家，最后真的被关掉了。**\n\n### 3. 引流动作低效（点状动作的实证）\n\n- 满 150-20、满 200-30 券各发 282 张，**核销 0%**；禧甜卡 160-30 券 2000 张，**核销 1 张（0.1%）**。出处：`2月/区域品牌 D2月季度会.pdf` p23、`4月/区域品牌 D4月月会.pptx` p21\n- 抖音：4 月月会写「流量、转化和新客占比均更优，之后继续重点开发」；5 月月会抖音**核销金额环比 -74%**、访问 -70%。出处：`4月/区域品牌 D4月月会.pptx`、`5月/区域品牌 D5月月会.pptx`\n- 报损：1 月合计 67,035 元、占实收 12%；四店 20%、二店 15%、三店 11%、黄岩 8%，报损 TOP 是自家热销品。出处：`2月/区域品牌 D2月季度会.pdf` p32\n\n---\n\n## 三、还没定的事（写之前必须解决）\n\n1. **同比窗口**：材料里至少三种（提案基线 2024 年 3–7 月 / 半年复盘 2025 上半年 / 周会的周环比年同比）。**全文只用一个窗口。**\n2. **10 月爆款与前面一年的关系**：如果前面一年的动作是「接得住 10 月爆款」的前提（研发进程、上新 SOP、博主资源、私域承接），那「点状动作无用」要改；如果接得住也无关，那才是真的无用。**这个答案决定整篇的立意。**\n3. **蛋糕爆发的归属**：Mirror 说 2025 年 10 月全网爆款「奶皮子烤布蕾蛋糕」，他让客户抓紧研发上线并找小红书博主推广。**但半年复盘（截至 6 月）显示大蛋糕实收已经 +10%、占比 9%→12%**——蛋糕在爆款之前就已经在涨。叙述时不要把两段合并成一段。\n",
  "s49": "2024勒布立方订单数据.xlsx （147.5 MB · 2025-02-24）\nIM FINE日常数据.xlsx （210.5 KB · 2025-02-24）\n【烘焙项目G1】2024年月维度数据-全.xlsx （3.9 MB · 2025-03-16）\n九街于记&仟仟多乐2024年营业额数据.xlsx （4.1 MB · 2025-01-22）\n九街于记数据趋势图.xlsx （1.8 MB · 2024-01-05）\n富贵面包数据趋势图.xlsx （2.8 MB · 2025-02-24）\n思蔻数据趋势图.xlsx （1.3 MB · 2025-02-24）\n甜品项目G322-24年明细.xlsx （49.5 MB · 2025-03-16）\n春夏甜品数据趋势图.xlsx （969.3 KB · 2025-03-16）\n汉娜日常数据.xlsx （466.0 KB · 2025-02-24）\n泰熙家门店信息表.xlsx （87.8 KB · 2025-05-19）\n熙心手作日常数据 .xlsx （111.1 KB · 2025-02-24）\n甜小姐数据趋势图.xlsx （1.1 MB · 2025-02-24）\n路易贝果数据趋势图.xlsx （1.6 MB · 2025-02-24）",
  "s50": "# MacPetMVP\n\n一个 macOS 桌面电子宠物 MVP，参考老式桌宠的悬浮形态：\n\n- Dock 常驻的原生 macOS App\n- 透明无边框悬浮窗口\n- 支持同时出现多只宠物\n- 右键菜单触发 10 个左右动作\n- 点击摸头、拖拽有简单互动\n- 默认加载 宠物 平面素材包\n- 预留自定义宠物素材包导入\n\n## 运行\n\n```bash\ncd ~/MindPalace/workspace/MacPetMVP\nswift run\n```\n\n## 打包成 `.app`\n\n```bash\ncd ~/MindPalace/workspace/MacPetMVP\n./scripts/build-app.sh\nopen MacPetMVP.app\n```\n\n## 自定义宠物素材包格式\n\n选择一个文件夹，里面放 `manifest.json` 和透明背景图片帧：\n\n```json\n{\n  \"name\": \"My Cat\",\n  \"actions\": {\n    \"idle\": [\"idle_01.png\", \"idle_02.png\"],\n    \"petHead\": [\"pet_head_01.png\", \"pet_head_02.png\"],\n    \"walkTop\": [\"walk_01.png\", \"walk_02.png\"],\n    \"yawn\": [\"yawn_01.png\"],\n    \"stretch\": [\"stretch_01.png\"],\n    \"sleep\": [\"sleep_01.png\"],\n    \"lookAround\": [\"look_01.png\"],\n    \"pawScreen\": [\"paw_01.png\"],\n    \"jump\": [\"jump_01.png\"],\n    \"sit\": [\"sit_01.png\"],\n    \"dragged\": [\"dragged_01.png\"]\n  }\n}\n```\n\n动作名固定为：\n\n`idle`, `petHead`, `walkTop`, `yawn`, `stretch`, `sleep`, `lookAround`, `pawScreen`, `jump`, `sit`, `dragged`\n",
  "h5/data-training-course-site/index": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>运营中台｜餐饮经营工具台<\/title>\n    <style>\n        @import url(\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap\");\n\n        :root {\n            --bg: #f5f2ea;\n            --bg-soft: #ece7de;\n            --panel: rgba(255, 255, 255, 0.78);\n            --panel-strong: rgba(255, 255, 255, 0.94);\n            --text: #151515;\n            --muted: #676052;\n            --line: rgba(21, 21, 21, 0.08);\n            --brand: #ff6a1f;\n            --brand-deep: #cc4a0b;\n            --olive: #8aa16a;\n            --ink: #101114;\n            --shadow: 0 28px 80px rgba(24, 18, 8, 0.08);\n            --radius-xl: 32px;\n            --radius-lg: 24px;\n            --radius-md: 18px;\n        }\n\n        * {\n            box-sizing: border-box;\n        }\n\n        html,\n        body {\n            margin: 0;\n            min-height: 100%;\n        }\n\n        body {\n            font-family: \"Manrope\", sans-serif;\n            color: var(--text);\n            background:\n                radial-gradient(circle at top left, rgba(255, 181, 139, 0.22), transparent 28%),\n                radial-gradient(circle at top right, rgba(138, 161, 106, 0.16), transparent 22%),\n                linear-gradient(180deg, #faf7f1 0%, #f2ede4 100%);\n        }\n\n        body::before {\n            content: \"\";\n            position: fixed;\n            inset: 0;\n            pointer-events: none;\n            opacity: 0.28;\n            background-image:\n                linear-gradient(rgba(16, 17, 20, 0.035) 1px, transparent 1px),\n                linear-gradient(90deg, rgba(16, 17, 20, 0.035) 1px, transparent 1px);\n            background-size: 28px 28px;\n            mask-image: radial-gradient(circle at center, black 36%, transparent 84%);\n        }\n\n        a {\n            color: inherit;\n            text-decoration: none;\n        }\n\n        .page {\n            width: min(1440px, calc(100% - 28px));\n            margin: 0 auto;\n            padding: 18px 0 40px;\n        }\n\n        .shell,\n        .panel,\n        .tool-card,\n        .flow-card,\n        .future-card,\n        .metric-card,\n        .modal-card {\n            border-radius: var(--radius-xl);\n            background: var(--panel);\n            backdrop-filter: blur(18px);\n            border: 1px solid rgba(255, 255, 255, 0.82);\n            box-shadow: var(--shadow);\n        }\n\n        .topbar {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            gap: 16px;\n            padding: 16px 18px;\n        }\n\n        .brand {\n            display: flex;\n            align-items: center;\n            gap: 14px;\n        }\n\n        .brand-mark {\n            display: grid;\n            gap: 8px;\n        }\n\n        .brand-mark span {\n            display: block;\n            height: 7px;\n            border-radius: 999px;\n            background: linear-gradient(90deg, var(--brand), #ffb15c);\n            box-shadow: 0 10px 22px rgba(255, 106, 31, 0.18);\n        }\n\n        .brand-mark span:first-child {\n            width: 44px;\n        }\n\n        .brand-mark span:last-child {\n            width: 26px;\n        }\n\n        .brand-copy small,\n        .eyebrow,\n        .pill,\n        .status {\n            display: inline-flex;\n            align-items: center;\n            padding: 7px 11px;\n            border-radius: 999px;\n            font-size: 11px;\n            font-weight: 800;\n            letter-spacing: 0.12em;\n            text-transform: uppercase;\n        }\n\n        .brand-copy small {\n            background: rgba(16, 17, 20, 0.06);\n            color: var(--muted);\n        }\n\n        .brand-copy h1 {\n            margin: 10px 0 0;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: 24px;\n            letter-spacing: -0.05em;\n        }\n\n        .nav {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            flex-wrap: wrap;\n        }\n\n        .nav-link,\n        .button {\n            height: 44px;\n            padding: 0 16px;\n            border-radius: 999px;\n            border: 1px solid rgba(16, 17, 20, 0.08);\n            background: rgba(255, 255, 255, 0.76);\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            cursor: pointer;\n            font: inherit;\n            color: var(--text);\n        }\n\n        .button.primary {\n            color: #fff;\n            border-color: transparent;\n            background: linear-gradient(135deg, var(--brand) 0%, #ff9348 100%);\n            box-shadow: 0 18px 36px rgba(255, 106, 31, 0.22);\n        }\n\n        .hero {\n            margin-top: 18px;\n            display: grid;\n            grid-template-columns: minmax(0, 1.28fr) minmax(340px, 0.86fr);\n            gap: 14px;\n            padding: 18px;\n        }\n\n        .hero-lead {\n            min-height: 560px;\n            padding: 30px;\n            border-radius: 30px;\n            background:\n                radial-gradient(circle at top right, rgba(255, 255, 255, 0.14), transparent 32%),\n                linear-gradient(135deg, #111113 0%, #2d241b 36%, #8a4a1f 72%, #ff6a1f 100%);\n            color: #fff;\n            position: relative;\n            overflow: hidden;\n        }\n\n        .hero-lead::after {\n            content: \"\";\n            position: absolute;\n            width: 360px;\n            height: 360px;\n            right: -100px;\n            bottom: -120px;\n            border-radius: 50%;\n            background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 70%);\n            pointer-events: none;\n        }\n\n        .eyebrow {\n            background: rgba(255, 255, 255, 0.12);\n        }\n\n        .hero-lead h2 {\n            margin: 18px 0 14px;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: clamp(42px, 5vw, 78px);\n            line-height: 0.95;\n            letter-spacing: -0.07em;\n            max-width: 10ch;\n        }\n\n        .hero-lead p {\n            max-width: 58ch;\n            margin: 0;\n            color: rgba(255, 255, 255, 0.78);\n            line-height: 1.75;\n            font-size: 15px;\n        }\n\n        .hero-actions {\n            display: flex;\n            gap: 12px;\n            flex-wrap: wrap;\n            margin-top: 24px;\n        }\n\n        .hero-actions .button,\n        .hero-actions a.button {\n            border: 0;\n        }\n\n        .button.ghost {\n            background: rgba(255, 255, 255, 0.12);\n            color: #fff;\n        }\n\n        .hero-note {\n            margin-top: 28px;\n            display: grid;\n            grid-template-columns: repeat(3, minmax(0, 1fr));\n            gap: 10px;\n        }\n\n        .metric-card {\n            padding: 18px;\n            background: rgba(255, 255, 255, 0.08);\n            border: 1px solid rgba(255, 255, 255, 0.12);\n            box-shadow: none;\n        }\n\n        .metric-card small {\n            display: block;\n            font-size: 11px;\n            font-weight: 800;\n            letter-spacing: 0.12em;\n            text-transform: uppercase;\n            color: rgba(255, 255, 255, 0.62);\n        }\n\n        .metric-card strong {\n            display: block;\n            margin-top: 10px;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: 28px;\n            letter-spacing: -0.05em;\n        }\n\n        .metric-card span {\n            display: block;\n            margin-top: 8px;\n            font-size: 12px;\n            line-height: 1.6;\n            color: rgba(255, 255, 255, 0.72);\n        }\n\n        .hero-side {\n            display: grid;\n            gap: 14px;\n        }\n\n        .panel {\n            padding: 22px;\n        }\n\n        .panel h3,\n        .section-head h3 {\n            margin: 0;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: 28px;\n            letter-spacing: -0.05em;\n        }\n\n        .panel p,\n        .section-head p,\n        .tool-card p,\n        .flow-card p,\n        .future-card p,\n        .demo-strip p {\n            margin: 10px 0 0;\n            color: var(--muted);\n            line-height: 1.7;\n            font-size: 14px;\n        }\n\n        .platform-grid,\n        .tools-grid,\n        .future-grid,\n        .flow-grid {\n            display: grid;\n            gap: 14px;\n            margin-top: 18px;\n        }\n\n        .platform-grid {\n            grid-template-columns: repeat(2, minmax(0, 1fr));\n        }\n\n        .platform-tile {\n            padding: 18px;\n            border-radius: 24px;\n            background: rgba(16, 17, 20, 0.04);\n            border: 1px solid rgba(16, 17, 20, 0.06);\n        }\n\n        .platform-tile strong {\n            display: block;\n            font-size: 18px;\n        }\n\n        .status {\n            background: rgba(255, 106, 31, 0.1);\n            color: var(--brand-deep);\n            margin-top: 14px;\n        }\n\n        .demo-strip {\n            padding: 20px;\n            border-radius: 26px;\n            background:\n                radial-gradient(circle at top right, rgba(255, 177, 92, 0.18), transparent 36%),\n                rgba(255, 255, 255, 0.94);\n            border: 1px solid rgba(16, 17, 20, 0.06);\n        }\n\n        .demo-strip-head {\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n            gap: 12px;\n        }\n\n        .demo-count {\n            display: inline-flex;\n            align-items: center;\n            gap: 8px;\n            padding: 10px 12px;\n            border-radius: 999px;\n            background: rgba(16, 17, 20, 0.05);\n            font-size: 13px;\n            font-weight: 700;\n        }\n\n        .section {\n            margin-top: 22px;\n            padding: 22px;\n        }\n\n        .section-head {\n            display: flex;\n            justify-content: space-between;\n            gap: 18px;\n            align-items: end;\n        }\n\n        .section-head-copy {\n            max-width: 58ch;\n        }\n\n        .tools-grid {\n            grid-template-columns: repeat(2, minmax(0, 1fr));\n        }\n\n        .tool-card,\n        .flow-card,\n        .future-card {\n            padding: 22px;\n            background: var(--panel-strong);\n        }\n\n        .tool-card {\n            min-height: 320px;\n            display: grid;\n            align-content: space-between;\n        }\n\n        .tool-card-top {\n            display: grid;\n            gap: 14px;\n        }\n\n        .tool-card h4,\n        .flow-card h4,\n        .future-card h4 {\n            margin: 0;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: 28px;\n            line-height: 1;\n            letter-spacing: -0.05em;\n        }\n\n        .pill {\n            background: rgba(16, 17, 20, 0.06);\n            color: var(--muted);\n        }\n\n        .tool-meta {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 10px;\n        }\n\n        .tool-meta span {\n            display: inline-flex;\n            align-items: center;\n            padding: 9px 11px;\n            border-radius: 999px;\n            background: rgba(255, 106, 31, 0.08);\n            color: var(--brand-deep);\n            font-size: 12px;\n            font-weight: 700;\n        }\n\n        .tool-actions {\n            display: flex;\n            gap: 10px;\n            flex-wrap: wrap;\n            margin-top: 20px;\n        }\n\n        .tool-actions .button {\n            flex: 1 1 180px;\n        }\n\n        .future-grid {\n            grid-template-columns: repeat(4, minmax(0, 1fr));\n        }\n\n        .future-card {\n            min-height: 210px;\n            display: grid;\n            align-content: start;\n            gap: 10px;\n        }\n\n        .future-card strong {\n            font-size: 16px;\n        }\n\n        .flow-grid {\n            grid-template-columns: repeat(3, minmax(0, 1fr));\n        }\n\n        .flow-card small {\n            display: inline-flex;\n            padding: 7px 10px;\n            border-radius: 999px;\n            background: rgba(255, 106, 31, 0.08);\n            color: var(--brand-deep);\n            font-size: 11px;\n            font-weight: 800;\n            letter-spacing: 0.12em;\n            text-transform: uppercase;\n        }\n\n        .flow-card h4 {\n            margin-top: 16px;\n        }\n\n        .footer {\n            margin-top: 22px;\n            padding: 22px;\n            display: flex;\n            justify-content: space-between;\n            gap: 14px;\n            align-items: center;\n            color: var(--muted);\n            font-size: 13px;\n        }\n\n        .modal {\n            position: fixed;\n            inset: 0;\n            display: none;\n            align-items: center;\n            justify-content: center;\n            padding: 18px;\n            background: rgba(16, 17, 20, 0.34);\n            backdrop-filter: blur(10px);\n            z-index: 50;\n        }\n\n        .modal.show {\n            display: flex;\n        }\n\n        .modal-card {\n            width: min(560px, 100%);\n            padding: 24px;\n            background: rgba(255, 255, 255, 0.96);\n        }\n\n        .modal-head {\n            display: flex;\n            justify-content: space-between;\n            gap: 12px;\n            align-items: start;\n        }\n\n        .modal-head h4 {\n            margin: 0;\n            font-family: \"Space Grotesk\", sans-serif;\n            font-size: 30px;\n            letter-spacing: -0.05em;\n        }\n\n        .modal-close {\n            width: 42px;\n            height: 42px;\n            border-radius: 999px;\n            border: 1px solid rgba(16, 17, 20, 0.08);\n            background: rgba(16, 17, 20, 0.04);\n            cursor: pointer;\n        }\n\n        .modal-grid {\n            display: grid;\n            gap: 12px;\n            margin-top: 18px;\n        }\n\n        label {\n            display: grid;\n            gap: 8px;\n            font-size: 12px;\n            font-weight: 700;\n            color: var(--muted);\n        }\n\n        input,\n        textarea {\n            width: 100%;\n            border: 1px solid rgba(16, 17, 20, 0.08);\n            background: #fff;\n            border-radius: 16px;\n            padding: 12px 14px;\n            font: inherit;\n            color: var(--text);\n        }\n\n        textarea {\n            min-height: 90px;\n            resize: vertical;\n        }\n\n        .modal-foot {\n            display: flex;\n            justify-content: space-between;\n            gap: 12px;\n            margin-top: 18px;\n            align-items: center;\n        }\n\n        .modal-message {\n            color: var(--brand-deep);\n            font-size: 13px;\n            font-weight: 700;\n        }\n\n        @media (max-width: 1120px) {\n            .hero,\n            .platform-grid,\n            .tools-grid,\n            .future-grid,\n            .flow-grid,\n            .hero-note {\n                grid-template-columns: 1fr;\n            }\n        }\n\n        @media (max-width: 760px) {\n            .page {\n                width: min(100%, calc(100% - 14px));\n                padding-top: 14px;\n            }\n\n            .topbar,\n            .hero,\n            .section,\n            .footer {\n                padding: 14px;\n                border-radius: 24px;\n            }\n\n            .hero-lead,\n            .panel,\n            .tool-card,\n            .flow-card,\n            .future-card {\n                border-radius: 24px;\n            }\n\n            .hero-lead {\n                min-height: auto;\n                padding: 22px;\n            }\n\n            .hero-lead h2 {\n                font-size: 42px;\n            }\n\n            .footer,\n            .section-head,\n            .demo-strip-head {\n                flex-direction: column;\n                align-items: flex-start;\n            }\n        }\n    <\/style>\n<\/head>\n<body>\n    <div class=\"page\">\n        <header class=\"shell topbar\">\n            <div class=\"brand\">\n                <div class=\"brand-mark\" aria-hidden=\"true\">\n                    <span><\/span>\n                    <span><\/span>\n                <\/div>\n                <div class=\"brand-copy\">\n                    <small>Restaurant Intelligence Tools<\/small>\n                    <h1>运营中台 · 餐饮经营工具台<\/h1>\n                <\/div>\n            <\/div>\n            <nav class=\"nav\">\n                <a class=\"nav-link\" href=\"#tools\">工具矩阵<\/a>\n                <a class=\"nav-link\" href=\"#platform\">平台框架<\/a>\n                <a class=\"nav-link\" href=\"#roadmap\">未来扩展<\/a>\n                <button class=\"button\" id=\"trialButton\" type=\"button\">申请试用<\/button>\n                <button class=\"button primary\" id=\"demoButton\" type=\"button\">体验 Demo<\/button>\n            <\/nav>\n        <\/header>\n\n        <section class=\"shell hero\">\n            <div class=\"hero-lead\">\n                <div class=\"eyebrow\">for 餐饮行业从业者<\/div>\n                <h2>把经验工具，做成可复用的经营系统。<\/h2>\n                <p>这里不是展示单个网页，而是为餐饮团队搭一个能持续扩展的工具底盘。当前已上线新店诊断器与全渠道营销策划引擎，后续可以继续增加选址、利润、活动复盘、运营动作库等模块，并逐步接上账号体系、试用权限、模板沉淀和数据留存。<\/p>\n                <div class=\"hero-actions\">\n                    <a class=\"button primary\" href=\"#tools\">查看当前工具<\/a>\n                    <button class=\"button ghost\" id=\"demoHeroButton\" type=\"button\">先跑 Demo<\/button>\n                <\/div>\n                <div class=\"hero-note\">\n                    <article class=\"metric-card\">\n                        <small>Current Modules<\/small>\n                        <strong>2<\/strong>\n                        <span>新店诊断器、全渠道营销策划引擎。<\/span>\n                    <\/article>\n                    <article class=\"metric-card\">\n                        <small>Access Pattern<\/small>\n                        <strong>Demo + Trial<\/strong>\n                        <span>先体验，再申请团队试用，后续可切正式账号。<\/span>\n                    <\/article>\n                    <article class=\"metric-card\">\n                        <small>Future Shape<\/small>\n                        <strong>Modular SaaS<\/strong>\n                        <span>工具、模板、诊断逻辑和历史输出逐步沉淀到一个入口。<\/span>\n                    <\/article>\n                <\/div>\n            <\/div>\n\n            <div class=\"hero-side\">\n                <article class=\"panel\" id=\"platform\">\n                    <h3>平台框架<\/h3>\n                    <p>先把入口、权限和工具壳做对，后面新增模块时才不会重新推翻结构。<\/p>\n                    <div class=\"platform-grid\">\n                        <div class=\"platform-tile\">\n                            <strong>01 登录与试用<\/strong>\n                            <p>支持账号注册、申请试用、Demo 次数限制与访客体验入口。<\/p>\n                            <div class=\"status\">当前先用前端 Demo 框架占位<\/div>\n                        <\/div>\n                        <div class=\"platform-tile\">\n                            <strong>02 工具工作台<\/strong>\n                            <p>每个工具独立成页，但统一挂在同一个首页、品牌和用户入口下。<\/p>\n                            <div class=\"status\">已具备框架<\/div>\n                        <\/div>\n                        <div class=\"platform-tile\">\n                            <strong>03 模板与知识层<\/strong>\n                            <p>以后可以挂标准模板、行业建议值、任务库、案例库与 Skill 输出。<\/p>\n                            <div class=\"status\">后续扩展位<\/div>\n                        <\/div>\n                        <div class=\"platform-tile\">\n                            <strong>04 数据留存<\/strong>\n                            <p>将用户输入、诊断结果、活动方案和复盘记录沉淀成账号资产。<\/p>\n                            <div class=\"status\">后续接表单或数据库<\/div>\n                        <\/div>\n                    <\/div>\n                <\/article>\n\n                <article class=\"demo-strip\">\n                    <div class=\"demo-strip-head\">\n                        <div>\n                            <h3>Demo Access<\/h3>\n                            <p>先给潜在用户一个轻量体验，再引导申请试用账号。<\/p>\n                        <\/div>\n                        <div class=\"demo-count\" id=\"demoCount\">剩余 Demo 次数：3 / 3<\/div>\n                    <\/div>\n                <\/article>\n            <\/div>\n        <\/section>\n\n        <section class=\"shell section\" id=\"tools\">\n            <div class=\"section-head\">\n                <div class=\"section-head-copy\">\n                    <h3>当前工具矩阵<\/h3>\n                    <p>首页只负责承接和分发，真正的工具逻辑放在独立页面里。这样以后新增模块，只需要继续往这里加卡片，不用改整体骨架。<\/p>\n                <\/div>\n                <div class=\"pill\">Current: 2 Tools<\/div>\n            <\/div>\n\n            <div class=\"tools-grid\">\n                <article class=\"tool-card\">\n                    <div class=\"tool-card-top\">\n                        <span class=\"pill\">Diagnose<\/span>\n                        <h4>新店诊断器<\/h4>\n                        <p>根据面积、桌位、租金、商圈、堂食/外送结构和必要经营假设，快速判断收入够不够、成本扛不扛得住、回本快不快。<\/p>\n                        <div class=\"tool-meta\">\n                            <span>线上 / 线下模式<\/span>\n                            <span>堂食 / 外送拆分<\/span>\n                            <span>70/80 商圈校验<\/span>\n                        <\/div>\n                    <\/div>\n                    <div class=\"tool-actions\">\n                        <a class=\"button primary\" href=\"./store-diagnostic/\">进入工具<\/a>\n                        <button class=\"button\" type=\"button\" data-demo-link=\"./store-diagnostic/\">Demo 体验<\/button>\n                    <\/div>\n                <\/article>\n\n                <article class=\"tool-card\">\n                    <div class=\"tool-card-top\">\n                        <span class=\"pill\">Plan<\/span>\n                        <h4>全渠道营销策划引擎<\/h4>\n                        <p>围绕品牌画像、活动目标和渠道资源，输出大活动的阶段节奏、主活动选择、辅助动作和任务清单。<\/p>\n                        <div class=\"tool-meta\">\n                            <span>活动策略生成<\/span>\n                            <span>阶段看板<\/span>\n                            <span>任务导出<\/span>\n                        <\/div>\n                    <\/div>\n                    <div class=\"tool-actions\">\n                        <a class=\"button primary\" href=\"./campaign-planner/\">进入工具<\/a>\n                        <button class=\"button\" type=\"button\" data-demo-link=\"./campaign-planner/\">Demo 体验<\/button>\n                    <\/div>\n                <\/article>\n            <\/div>\n        <\/section>\n\n        <section class=\"shell section\">\n            <div class=\"section-head\">\n                <div class=\"section-head-copy\">\n                    <h3>进入方式<\/h3>\n                    <p>先用一个清晰的 SaaS 路径承接用户，再逐步补后台能力。现在先把前台体验和流转逻辑搭起来。<\/p>\n                <\/div>\n            <\/div>\n\n            <div class=\"flow-grid\">\n                <article class=\"flow-card\">\n                    <small>Step 01<\/small>\n                    <h4>访客先看工具价值<\/h4>\n                    <p>首页负责说清楚：这套产品解决谁的问题、当前有哪些模块、未来会如何扩展。<\/p>\n                <\/article>\n                <article class=\"flow-card\">\n                    <small>Step 02<\/small>\n                    <h4>轻量 Demo 先跑一遍<\/h4>\n                    <p>不强迫立刻注册，先给少量 Demo 次数，让用户对输出形式和逻辑建立认知。<\/p>\n                <\/article>\n                <article class=\"flow-card\">\n                    <small>Step 03<\/small>\n                    <h4>试用账号承接留资<\/h4>\n                    <p>确认有兴趣的用户，再引导申请试用账号，后续逐步接团队空间、历史记录和更多模块。<\/p>\n                <\/article>\n            <\/div>\n        <\/section>\n\n        <section class=\"shell section\" id=\"roadmap\">\n            <div class=\"section-head\">\n                <div class=\"section-head-copy\">\n                    <h3>未来扩展位<\/h3>\n                    <p>你现在还不确定未来所有工具长什么样，所以首页不应该写死固定结构，而要保留标准卡位，持续挂新模块。<\/p>\n                <\/div>\n                <div class=\"pill\">Expandable Shelf<\/div>\n            <\/div>\n\n            <div class=\"future-grid\">\n                <article class=\"future-card\">\n                    <span class=\"pill\">Coming Slot<\/span>\n                    <h4>选址评估器<\/h4>\n                    <p>把商圈、竞品、坪效和租金模型做成标准判断页。<\/p>\n                <\/article>\n                <article class=\"future-card\">\n                    <span class=\"pill\">Coming Slot<\/span>\n                    <h4>活动复盘台<\/h4>\n                    <p>把活动执行结果、预算和复盘结论收回平台，变成经验资产。<\/p>\n                <\/article>\n                <article class=\"future-card\">\n                    <span class=\"pill\">Coming Slot<\/span>\n                    <h4>利润监控器<\/h4>\n                    <p>按毛利、人效、租金率和外送费率持续看健康度。<\/p>\n                <\/article>\n                <article class=\"future-card\">\n                    <span class=\"pill\">Flexible<\/span>\n                    <h4>留给未来工具<\/h4>\n                    <p>当前不预设功能，只保留统一入口、统一样式和统一用户流转。<\/p>\n                <\/article>\n            <\/div>\n        <\/section>\n\n        <footer class=\"shell footer\">\n            <div>运营中台 · 餐饮经营工具台<\/div>\n            <div>当前入口：<a href=\"./store-diagnostic/\">新店诊断器<\/a> / <a href=\"./campaign-planner/\">全渠道营销策划引擎<\/a><\/div>\n        <\/footer>\n    <\/div>\n\n    <div class=\"modal\" id=\"trialModal\" aria-hidden=\"true\">\n        <div class=\"modal-card\">\n            <div class=\"modal-head\">\n                <div>\n                    <h4>申请试用<\/h4>\n                    <p>先留基础信息，后续可以接企微、邮箱或表单系统。<\/p>\n                <\/div>\n                <button class=\"modal-close\" type=\"button\" data-close-modal>×<\/button>\n            <\/div>\n            <div class=\"modal-grid\">\n                <label>姓名\n                    <input id=\"trialName\" type=\"text\" placeholder=\"例如：张三\">\n                <\/label>\n                <label>公司 / 品牌\n                    <input id=\"trialCompany\" type=\"text\" placeholder=\"例如：某某烘焙\">\n                <\/label>\n                <label>联系方式\n                    <input id=\"trialContact\" type=\"text\" placeholder=\"手机号 / 企微 / 邮箱\">\n                <\/label>\n                <label>当前最想先用的工具\n                    <input id=\"trialNeed\" type=\"text\" placeholder=\"例如：新店诊断、周年庆策划\">\n                <\/label>\n                <label>补充说明\n                    <textarea id=\"trialNote\" placeholder=\"例如：门店类型、团队规模、是否希望接入企业微信\"><\/textarea>\n                <\/label>\n            <\/div>\n            <div class=\"modal-foot\">\n                <div class=\"modal-message\" id=\"trialMessage\">提交后当前只做本地确认展示。<\/div>\n                <button class=\"button primary\" id=\"submitTrial\" type=\"button\">提交试用申请<\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <div class=\"modal\" id=\"demoModal\" aria-hidden=\"true\">\n        <div class=\"modal-card\">\n            <div class=\"modal-head\">\n                <div>\n                    <h4>体验 Demo<\/h4>\n                    <p>先给少量体验次数，让用户在不注册的情况下感受工具输出。<\/p>\n                <\/div>\n                <button class=\"modal-close\" type=\"button\" data-close-modal>×<\/button>\n            <\/div>\n            <div class=\"modal-grid\">\n                <div class=\"platform-tile\">\n                    <strong>当前可体验<\/strong>\n                    <p>新店诊断器、全渠道营销策划引擎。<\/p>\n                    <div class=\"status\" id=\"demoStatus\">剩余 Demo 次数：3 / 3<\/div>\n                <\/div>\n                <div class=\"tool-actions\">\n                    <button class=\"button primary\" type=\"button\" data-demo-link=\"./store-diagnostic/\">进入新店诊断器<\/button>\n                    <button class=\"button\" type=\"button\" data-demo-link=\"./campaign-planner/\">进入营销策划引擎<\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        const DEMO_LIMIT = 3;\n        const demoKey = \"emo_brain_demo_count\";\n\n        function getDemoUsed() {\n            return Number(localStorage.getItem(demoKey) || 0);\n        }\n\n        function getDemoLeft() {\n            return Math.max(0, DEMO_LIMIT - getDemoUsed());\n        }\n\n        function updateDemoUI() {\n            const left = getDemoLeft();\n            const text = `剩余 Demo 次数：${left} / ${DEMO_LIMIT}`;\n            document.getElementById(\"demoCount\").textContent = text;\n            document.getElementById(\"demoStatus\").textContent = text;\n        }\n\n        function openModal(id) {\n            document.getElementById(id).classList.add(\"show\");\n        }\n\n        function closeModal(button) {\n            button.closest(\".modal\").classList.remove(\"show\");\n        }\n\n        function consumeDemoAndGo(url) {\n            const used = getDemoUsed();\n            if (used >= DEMO_LIMIT) {\n                document.getElementById(\"demoStatus\").textContent = \"Demo 次数已用完，可先申请试用。\";\n                openModal(\"demoModal\");\n                return;\n            }\n\n            localStorage.setItem(demoKey, String(used + 1));\n            updateDemoUI();\n            window.location.href = url;\n        }\n\n        document.getElementById(\"trialButton\").addEventListener(\"click\", () => openModal(\"trialModal\"));\n        document.getElementById(\"demoButton\").addEventListener(\"click\", () => openModal(\"demoModal\"));\n        document.getElementById(\"demoHeroButton\").addEventListener(\"click\", () => openModal(\"demoModal\"));\n\n        document.querySelectorAll(\"[data-close-modal]\").forEach(button => {\n            button.addEventListener(\"click\", () => closeModal(button));\n        });\n\n        document.querySelectorAll(\".modal\").forEach(modal => {\n            modal.addEventListener(\"click\", event => {\n                if (event.target === modal) {\n                    modal.classList.remove(\"show\");\n                }\n            });\n        });\n\n        document.getElementById(\"submitTrial\").addEventListener(\"click\", () => {\n            const name = document.getElementById(\"trialName\").value.trim();\n            const company = document.getElementById(\"trialCompany\").value.trim();\n            const contact = document.getElementById(\"trialContact\").value.trim();\n            const message = document.getElementById(\"trialMessage\");\n\n            if (!name || !company || !contact) {\n                message.textContent = \"请至少补齐姓名、公司 / 品牌和联系方式。\";\n                return;\n            }\n\n            message.textContent = `已记录 ${company} 的试用申请草稿。后续可接入正式表单或企微收集。`;\n        });\n\n        document.querySelectorAll(\"[data-demo-link]\").forEach(button => {\n            button.addEventListener(\"click\", () => consumeDemoAndGo(button.dataset.demoLink));\n        });\n\n        updateDemoUI();\n    <\/script>\n<\/body>\n<\/html>\n",
  "s52": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n  <title>标杆项目运营模式与商业模式拆解<\/title>\n  <style>\n    :root {\n      --paper: #fffaf2;\n      --ink: #1d1d1f;\n      --muted: #6b6258;\n      --line: #ead9c0;\n      --accent: #f3a000;\n      --accent-dark: #b25a00;\n      --red: #d93434;\n    }\n    * { box-sizing: border-box; }\n    body {\n      margin: 0;\n      color: var(--ink);\n      background: #eee7dc;\n      font-family: -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", sans-serif;\n      line-height: 1.75;\n      letter-spacing: 0;\n    }\n    main {\n      max-width: 1060px;\n      margin: 36px auto;\n      padding: 56px 66px;\n      background: var(--paper);\n      box-shadow: 0 18px 60px rgba(67, 42, 15, 0.13);\n      border: 1px solid rgba(180, 126, 45, 0.18);\n    }\n    h1, h2, h3 {\n      line-height: 1.25;\n      margin: 0;\n      letter-spacing: 0;\n    }\n    h1 {\n      font-size: 42px;\n      padding-bottom: 18px;\n      border-bottom: 4px solid var(--accent);\n      margin-bottom: 22px;\n    }\n    h2 {\n      font-size: 27px;\n      margin-top: 42px;\n      padding-top: 20px;\n      border-top: 1px solid var(--line);\n    }\n    h3 {\n      font-size: 21px;\n      margin-top: 28px;\n    }\n    p { margin: 13px 0; }\n    strong { color: #111; }\n    a { color: var(--accent-dark); }\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      margin: 18px 0 24px;\n      background: #fffdf9;\n      border: 1px solid var(--line);\n      font-size: 14.5px;\n    }\n    th, td {\n      border: 1px solid var(--line);\n      padding: 10px 12px;\n      vertical-align: top;\n    }\n    th {\n      background: #fff0cc;\n      text-align: left;\n      font-weight: 700;\n    }\n    blockquote {\n      margin: 18px 0 24px;\n      padding: 14px 18px;\n      background: #fff;\n      border-left: 5px solid var(--accent);\n      color: #2a2724;\n    }\n    figure {\n      margin: 26px 0 34px;\n      padding: 14px;\n      background: #fffdf9;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      page-break-inside: avoid;\n      break-inside: avoid;\n    }\n    figure img {\n      display: block;\n      max-width: 100%;\n      height: auto;\n      margin: 0 auto;\n      border-radius: 7px;\n    }\n    figure img[src*=\"course_catalog\"],\n    figure img[src*=\"final_live_private_reminder\"] {\n      max-height: 860px;\n      width: auto;\n    }\n    figcaption {\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 13.5px;\n      line-height: 1.55;\n      text-align: center;\n    }\n    code {\n      padding: 2px 5px;\n      border-radius: 4px;\n      background: #fff0cc;\n      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n    ul, ol { padding-left: 1.4em; }\n    li { margin: 5px 0; }\n    hr {\n      border: 0;\n      border-top: 1px solid var(--line);\n      margin: 32px 0;\n    }\n    @page {\n      size: A4;\n      margin: 14mm 13mm;\n    }\n    @media print {\n      body { background: #fff; }\n      main {\n        max-width: none;\n        margin: 0;\n        padding: 0;\n        background: #fff;\n        box-shadow: none;\n        border: 0;\n      }\n      h1 { font-size: 30px; }\n      h2 {\n        font-size: 21px;\n        margin-top: 30px;\n        page-break-after: avoid;\n      }\n      h3 {\n        font-size: 17px;\n        page-break-after: avoid;\n      }\n      p, li, td, th { font-size: 12.2px; }\n      table { font-size: 11.4px; page-break-inside: avoid; }\n      figure {\n        padding: 9px;\n        border-radius: 6px;\n        margin: 18px 0 22px;\n      }\n      figure img[src*=\"content_method\"],\n      figure img[src*=\"business_model_map\"],\n      figure img[src*=\"pricing_design\"] {\n        width: 100%;\n        max-height: 176mm;\n      }\n      figure img[src*=\"course_catalog\"],\n      figure img[src*=\"final_live_private_reminder\"] {\n        max-height: 238mm;\n      }\n      figcaption { font-size: 10.4px; }\n    }\n  <\/style>\n<\/head>\n<body>\n  <main>\n    <h1>标杆项目运营模式与商业模式拆解<\/h1>\n<p>生成日期：2026-05-09<br>分析对象：标杆项目 9.9 元引流课、7 天复盘营、会员价格体系与课后运营动作<br>资料来源：标杆项目官网、用户参课记录、课程内容拆解图、群运营截图、会员定价截图信息、复盘营课表与解锁页截图<\/p>\n<h2>1. 一句话结论<\/h2>\n<p>标杆项目这套模式的核心不是“低价课强卖正价课”，而是“重交付钩子课驱动的会员制生意”：先用 9.9 元低价课程筛出愿意学习的创业者/业务负责人，再用 7 天高密度交付、作业解锁、转介绍、班主任触达和群体氛围建立信任，最后用相对轻的会员转化承接长期学习需求。<\/p>\n<p>最值得拆的是它的反常识之处：前端钩子课程很重，后端成交动作反而不重。用户在第一阶段已经获得了明显超预期的体验，因此最终转化不必依赖强追单，而是依赖好感、信任、持续学习焦虑和会员权益的价值感。<\/p>\n<figure>\n  <img src=\"assets/08_business_model_map.svg\" alt=\"标杆项目运营模式雏型\" />\n  <figcaption>图 1：标杆项目运营模式雏型。前端重交付，后端轻转化，最终用会员制和高阶产品承接 LTV。<\/figcaption>\n<\/figure>\n\n<h2>2. 观察到的完整用户路径<\/h2>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>用户动作<\/th>\n<th>标杆项目动作<\/th>\n<th>关键目的<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>获客<\/td>\n<td>在公众号尾部广告位看到 9.9 元引流课<\/td>\n<td>用低价直播课承接外部流量<\/td>\n<td>降低尝试门槛，筛出有创业/管理/业务提升需求的人<\/td>\n<\/tr>\n<tr>\n<td>课前<\/td>\n<td>入群、等待直播<\/td>\n<td>群发提醒、AI 外呼、私聊确认“参加”<\/td>\n<td>提升到课率，并让用户做公开/私下承诺<\/td>\n<\/tr>\n<tr>\n<td>第 1 天直播<\/td>\n<td>21:00-23:00 听首场直播<\/td>\n<td>2 小时以上直播，交付完整方法论、案例、工具包、回放<\/td>\n<td>让用户获得第一次“超值感”<\/td>\n<\/tr>\n<tr>\n<td>第 2 天复盘<\/td>\n<td>看回放/文稿/专题课，进入 H5 学习页<\/td>\n<td>群内发复盘入口，说明作业和解锁规则<\/td>\n<td>把单场课变成训练营<\/td>\n<\/tr>\n<tr>\n<td>第 3-5 天<\/td>\n<td>写作业、看录播、参与讨论<\/td>\n<td>高频催交、排名、小组竞争、群内反馈<\/td>\n<td>拉高参与度，制造完成感和同伴压力<\/td>\n<\/tr>\n<tr>\n<td>第 7 天毕业直播<\/td>\n<td>参加最后一场直播<\/td>\n<td>先讲课，再颁奖，最后讲会员价格和赠课<\/td>\n<td>轻销售完成付费承接<\/td>\n<\/tr>\n<tr>\n<td>课后<\/td>\n<td>选择是否购买会员<\/td>\n<td>当天付款赠课，但没有强追单<\/td>\n<td>维持好感，避免破坏前端信任资产<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>3. 内容设计：用泛化模型服务创业者<\/h2>\n<p>标杆项目的引流课不是“碎片知识拼盘”，而是把内容包装成创业者可复用的底层模型。它的内容有三个特点：<\/p>\n<ol>\n<li>方法论密度高：以科学决策、商业分析、复盘、时间管理、AI 场景等模型为核心，用户即便不买会员，也会觉得 9.9 元超值。<\/li>\n<li>泛化程度高：内容不绑定某个狭窄行业，而是服务创业者、业务负责人、管理者共同面对的问题，例如决策、调研、转化率、商业模式、团队执行。<\/li>\n<li>可产品化：每节内容都被命名为一个“重新理解/AI 必修”的模块，既像课程目录，也像能力地图，天然适合会员制长期售卖。<\/li>\n<\/ol>\n<figure>\n  <img src=\"assets/01_content_method.png\" alt=\"怎样做好一节线上课内容拆解图\" />\n  <figcaption>图 2：用户前期整理的线上课内容方法论。它本身也解释了标杆项目的底层逻辑：好课 = 认知升级 × 行动引导 × 产品承接。<\/figcaption>\n<\/figure>\n\n<figure>\n  <img src=\"assets/02_pdf_content_sample.png\" alt=\"标杆项目模型课程 PDF 内容样本\" />\n  <figcaption>图 3：PDF 课程内容样本。标杆项目的内容表达偏“商业分析/方法模型/案例推演”，适合创业者建立操作框架。<\/figcaption>\n<\/figure>\n\n<h2>4. 钩子课程设计：重到像一个小型正价营<\/h2>\n<p>这套 9.9 元引流课的钩子非常重：<\/p>\n<table>\n<thead>\n<tr>\n<th>钩子组件<\/th>\n<th>具体设计<\/th>\n<th>对转化的作用<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>低价门槛<\/td>\n<td>9.9 元进入 7 天营<\/td>\n<td>筛出愿意付费且愿意学习的人，避免纯免费流量<\/td>\n<\/tr>\n<tr>\n<td>首尾直播<\/td>\n<td>2 场 21:00-23:00 直播，每场约 2 小时<\/td>\n<td>首场建立信任，尾场完成价值峰值和会员承接<\/td>\n<\/tr>\n<tr>\n<td>录播赠课<\/td>\n<td>最高 10 节，每节多在 2 小时以上<\/td>\n<td>制造“投入远高于价格”的感知<\/td>\n<\/tr>\n<tr>\n<td>作业解锁<\/td>\n<td>完成作业解锁下一节课<\/td>\n<td>把学习从被动观看变成主动行动<\/td>\n<\/tr>\n<tr>\n<td>转介绍解锁<\/td>\n<td>邀请朋友/转发海报可获得奖励课<\/td>\n<td>用课程权益做低成本裂变<\/td>\n<\/tr>\n<tr>\n<td>班主任运营<\/td>\n<td>群公告、私聊、提醒、排名、复盘入口<\/td>\n<td>保证完成率和触达频次<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>这不是普通引流课，而是“付费筛选 + 训练营体验 + 会员预演”。用户在 7 天里已经体验了直播、回放、作业、录播、班主任、课程目录和社群氛围，因此最后销售会员时，不是在卖一个陌生产品，而是在邀请用户延长一个已经体验过的学习系统。<\/p>\n<figure>\n  <img src=\"assets/05_unlock_page.png\" alt=\"复盘营解锁页\" />\n  <figcaption>图 4：复盘营 H5 解锁页。规则强调 3 次选课机会、作业解锁、截止时间和毕业直播，明显是在训练用户进入“会员式学习节奏”。<\/figcaption>\n<\/figure>\n\n<figure>\n  <img src=\"assets/06_course_catalog.jpg\" alt=\"标杆项目复盘营课表\" />\n  <figcaption>图 5：复盘营课表。课程覆盖业务、成长、创业、AI、转化率等模块，形成一张创业者能力地图。<\/figcaption>\n<\/figure>\n\n<h2>5. 运营设计：高频触达但低压销售<\/h2>\n<p>运营动作的核心是“让用户持续参与”，不是“让用户立刻付款”。目前观察到的动作包括：<\/p>\n<ol>\n<li>课前提醒：前一天群发、当天 AI 外呼、直播前半小时群发，强调席位、直播入口和课程价值。<\/li>\n<li>私聊承诺：用“回复我【参加】”让用户做一个小承诺，后续提醒就不显得突兀。<\/li>\n<li>课中暖场：班主任提前 10 分钟暖场，cue 后续流程，引导用户关注完整训练营。<\/li>\n<li>课后复盘：当晚发学习链接，告诉用户回放、文稿、专题课、作业都在 H5 里。<\/li>\n<li>作业催交：第 3-5 天持续提醒，配合班级排名、荣誉感和“多选一节课”激励。<\/li>\n<li>群内氛围：让用户看到别人也在写作业、也在遇到问题、也在完成任务。<\/li>\n<li>最后一场提醒：强调“没有回放和文稿”，提高最后直播到课率。<\/li>\n<\/ol>\n<p>用户收到的私聊话术如下：<\/p>\n<blockquote>\n<p>明晚 9 点，最后 1 节直播课啦。<br>这节课，Truman 亲授自己近十年在练的基本功，以及屡试不爽的底层模型。<br>不管你在创业，带团队，还是在做具体的业务，都值得你学习。<br>一定来听直播，Truman 带你现场练习，切身感受模型的力量。<br>没有回放和文稿啦。<br>回复我【参加】，明晚提醒你上课。<\/p>\n<\/blockquote>\n<p>这段话的设计很完整：先提醒时间，再抬高老师和内容价值，再扩大适用人群，最后用“无回放”制造到课理由，用“回复参加”建立承诺。<\/p>\n<figure>\n  <img src=\"assets/03_final_live_private_reminder.jpg\" alt=\"最后直播私聊提醒截图\" />\n  <figcaption>图 6：最后直播前的提醒截图。重点不是销售，而是提高最后一场直播到课率。<\/figcaption>\n<\/figure>\n\n<figure>\n  <img src=\"assets/04_group_interaction.png\" alt=\"群内作业互动截图\" />\n  <figcaption>图 7：群内作业互动截图。用户之间的讨论会反向证明课程有参与度，并降低“只有我在学”的孤立感。<\/figcaption>\n<\/figure>\n\n<h2>6. 转化设计：销售动作轻，但价值铺垫重<\/h2>\n<p>最后一场直播的转化方式是：先讲课约 1 小时，再颁奖约 40 分钟，最后讲会员价格；当天付款可赠课。这个节奏说明标杆项目没有把最后直播做成纯销售场，而是把销售嵌在“毕业感”和“价值峰值”之后。<\/p>\n<p>已知会员价格设计如下：<\/p>\n<table>\n<thead>\n<tr>\n<th>档位<\/th>\n<th align=\"right\">价格<\/th>\n<th>核心权益<\/th>\n<th>设计意义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>入门版<\/td>\n<td align=\"right\">1980 元<\/td>\n<td>一年会员学籍 + 10 张年度选课券<\/td>\n<td>低门槛承接，适合刚建立信任的人<\/td>\n<\/tr>\n<tr>\n<td>标准版<\/td>\n<td align=\"right\">3380 元<\/td>\n<td>一年会员学籍 + 20 张年度选课券<\/td>\n<td>主推档，兼顾客单价和接受度<\/td>\n<\/tr>\n<tr>\n<td>学霸版<\/td>\n<td align=\"right\">5580 元<\/td>\n<td>一年会员学籍 + 40 张年度选课券<\/td>\n<td>高价值锚点，提高整体价格带<\/td>\n<\/tr>\n<tr>\n<td>MBA 会员<\/td>\n<td align=\"right\">未完整听到<\/td>\n<td>80 张年券 + 3 天 2 夜集训营 + S 级私董会 + 专属私房课<\/td>\n<td>高阶产品入口，用于后续深度经营<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure>\n  <img src=\"assets/07_pricing_design.svg\" alt=\"会员价格设计复原图\" />\n  <figcaption>图 8：会员价格设计复原。定价不是按单课销售，而是按“会员学籍 + 年度选课券”销售学习权。<\/figcaption>\n<\/figure>\n\n<p>这个价格结构有三个关键点：<\/p>\n<ol>\n<li>从卖单课转为卖年度学习权：用户买的不是一门课，而是一年内继续学习的资格和选课券。<\/li>\n<li>用选课券放大价值感：10/20/40 张券把价格从“贵不贵”转移到“能学多少”。<\/li>\n<li>预留高阶产品空间：MBA、集训营、私董会、咨询能够继续承接高 LTV 用户。<\/li>\n<\/ol>\n<h2>7. 为什么“轻追单”仍然可能有效<\/h2>\n<p>标杆项目的转化动作不重，甚至没有明显追单，但用户好感度高。这种模式成立的前提是：前端课程本身已经完成了大量销售工作。<\/p>\n<table>\n<thead>\n<tr>\n<th>前端动作<\/th>\n<th>隐含销售作用<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>2 小时高密度直播<\/td>\n<td>证明老师有真东西<\/td>\n<\/tr>\n<tr>\n<td>7 天陪跑<\/td>\n<td>证明组织有服务能力<\/td>\n<\/tr>\n<tr>\n<td>作业解锁<\/td>\n<td>证明课程能促成行动<\/td>\n<\/tr>\n<tr>\n<td>群内讨论<\/td>\n<td>证明不是单向灌输<\/td>\n<\/tr>\n<tr>\n<td>课表展示<\/td>\n<td>证明后续产品有系统性<\/td>\n<\/tr>\n<tr>\n<td>颁奖/排名<\/td>\n<td>证明用户可以获得正反馈<\/td>\n<\/tr>\n<tr>\n<td>赠课/选课券<\/td>\n<td>证明买会员后不是单点消费<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>所以最后一场直播不需要强硬追单，因为用户已经在前 7 天里完成了“认知被打开、行为被带动、产品被体验、信任被积累”的全过程。<\/p>\n<h2>8. 商业模式设计雏型<\/h2>\n<p>如果把标杆项目抽象成一个可复用的商业模式，它不是“课程售卖模型”，而是“创业者能力会员模型”。<\/p>\n<h3>8.1 目标用户<\/h3>\n<p>核心用户是创业者、业务负责人、管理者、自由职业者和正在转型的人。他们的共同特点是：<\/p>\n<ol>\n<li>愿意为认知、模型、方法论付费。<\/li>\n<li>面临复杂问题，但缺少结构化工具。<\/li>\n<li>对“能马上用于业务”的内容敏感。<\/li>\n<li>不一定追求学历证书，更重视实战、案例、同伴和持续陪跑。<\/li>\n<\/ol>\n<h3>8.2 产品阶梯<\/h3>\n<table>\n<thead>\n<tr>\n<th>层级<\/th>\n<th>产品形态<\/th>\n<th>价格/价值<\/th>\n<th>主要任务<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>流量入口<\/td>\n<td>公众号广告、内容投放、转介绍海报<\/td>\n<td>外部流量成本<\/td>\n<td>找到有创业/业务焦虑的人<\/td>\n<\/tr>\n<tr>\n<td>低价筛选<\/td>\n<td>9.9 元直播训练营<\/td>\n<td>低价付费<\/td>\n<td>筛选愿意行动的人，过滤纯白嫖<\/td>\n<\/tr>\n<tr>\n<td>信任交付<\/td>\n<td>7 天营、2 场直播、录播赠课、作业解锁<\/td>\n<td>超预期体验<\/td>\n<td>建立信任和完成感<\/td>\n<\/tr>\n<tr>\n<td>主力变现<\/td>\n<td>年会员 + 选课券<\/td>\n<td>1980/3380/5580<\/td>\n<td>把单次学习变成年度学习关系<\/td>\n<\/tr>\n<tr>\n<td>高阶变现<\/td>\n<td>集训营、私董会、咨询、MBA 会员<\/td>\n<td>高客单价<\/td>\n<td>承接高意愿、高支付能力用户<\/td>\n<\/tr>\n<tr>\n<td>复利增长<\/td>\n<td>作业案例、口碑、转介绍、续费<\/td>\n<td>降 CAC、提 LTV<\/td>\n<td>形成内容和社群资产<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>8.3 核心能力<\/h3>\n<p>这套模型真正的壁垒不只是“课程多”，而是四个能力叠加：<\/p>\n<ol>\n<li>内容产品化能力：把复杂商业问题拆成模型、工具、案例和作业。<\/li>\n<li>训练营运营能力：让用户在 7 天内持续参与，而不是听完就走。<\/li>\n<li>社群信任构建能力：用群氛围、作业、排名和班主任触达制造现场感。<\/li>\n<li>会员承接能力：用年度选课券承接长期学习，而不是一次性卖课。<\/li>\n<\/ol>\n<h3>8.4 收入结构推断<\/h3>\n<table>\n<thead>\n<tr>\n<th>收入来源<\/th>\n<th>可能作用<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>9.9 元引流课<\/td>\n<td>不是利润中心，主要用于筛选与回收一部分流量成本<\/td>\n<\/tr>\n<tr>\n<td>年会员<\/td>\n<td>主力现金流，依靠课程库和选课券放大价值感<\/td>\n<\/tr>\n<tr>\n<td>高阶会员/私董会/集训营<\/td>\n<td>高毛利与高 LTV 来源<\/td>\n<\/tr>\n<tr>\n<td>咨询/企业服务<\/td>\n<td>从个人创业者延伸到团队或组织需求<\/td>\n<\/tr>\n<tr>\n<td>续费<\/td>\n<td>内容库和学习习惯形成后，续费比新获客更划算<\/td>\n<\/tr>\n<tr>\n<td>转介绍<\/td>\n<td>通过奖励课降低获客成本<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>9. 可复用的设计原则<\/h2>\n<ol>\n<li>钩子课不能只给“信息”，要给“体验”：直播、工具、作业、反馈、解锁和同伴感都要出现。<\/li>\n<li>低价课要收费：9.9 元的意义不在收入，而在筛掉低意愿用户。<\/li>\n<li>转化前先让用户行动：写过作业的人，比只听课的人更容易继续购买。<\/li>\n<li>赠课要绑定行为：赠课不是白送，而是用来换作业、转介绍和完课。<\/li>\n<li>销售不必重，但承接要清楚：用户要知道下一步可以买什么、为什么买、买了如何继续学。<\/li>\n<li>会员制要卖“学习权”和“成长路径”：选课券比单课更适合承接泛化方法论内容。<\/li>\n<li>社群运营要制造“大家都在推进”的证据：排名、作业截图、讨论和班主任反馈都在降低用户退出概率。<\/li>\n<\/ol>\n<h2>10. 风险与短板<\/h2>\n<table>\n<thead>\n<tr>\n<th>风险<\/th>\n<th>表现<\/th>\n<th>可能影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>前端交付过重<\/td>\n<td>7 天 + 2 场直播 + 最高 10 节赠课 + 高频运营<\/td>\n<td>如果转化率不够，成本压力会很大<\/td>\n<\/tr>\n<tr>\n<td>内容泛化<\/td>\n<td>方法论和思维框架适用面广，但不够垂直<\/td>\n<td>对明确结果导向用户，付费理由可能不够强<\/td>\n<\/tr>\n<tr>\n<td>会员差异不清<\/td>\n<td>用户没有明显听到 1980/3380/5580 的差异解释<\/td>\n<td>可能导致用户只选低档或延迟决策<\/td>\n<\/tr>\n<tr>\n<td>依赖老师 IP<\/td>\n<td>Truman 亲授是主要信任来源<\/td>\n<td>扩张时需要更多讲师复制方法论和信任<\/td>\n<\/tr>\n<tr>\n<td>轻追单依赖好感<\/td>\n<td>不强追单保护体验，但会放弃一部分犹豫订单<\/td>\n<td>需要更强的课后内容触达和续养机制补足<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>11. 最终雏型：可直接参考的商业设计<\/h2>\n<p>标杆项目可被抽象为下面这个模型：<\/p>\n<blockquote>\n<p>公众号/内容广告获客 → 9.9 元低价筛选 → 7 天重交付训练营 → 作业与转介绍解锁 → 轻销售年会员 → 选课券持续学习 → 高阶集训营/私董会/咨询 → 作业案例与口碑反哺获客。<\/p>\n<\/blockquote>\n<p>如果要借鉴，不建议只学“9.9 引流课”或“群里催作业”。真正值得学的是它的三层设计：<\/p>\n<ol>\n<li>内容层：用模型和案例让创业者觉得“这能解决我的复杂问题”。<\/li>\n<li>运营层：用作业、解锁、群氛围和私聊承诺把用户带入行动。<\/li>\n<li>转化层：用年度会员和选课券承接长期学习，用高阶产品承接高价值用户。<\/li>\n<\/ol>\n<p>这套模式的本质是：用一次高质量的低价交付，换取用户对长期学习关系的信任。<\/p>\n\n  <\/main>\n<\/body>\n<\/html>",

  "s54": "# 零售品牌 A项目上下文\n\n> 用途：作为零售品牌 A后续月度计划、活动策划、产品策略、渠道策略、直播货盘和复盘分析的默认前提。\n> 最近更新：2026-07-30\n\n## 一、信息管理规则\n\n- 区分“已确认事实、数据结论、阶段性判断、待验证假设”。\n- 所有新增数据记录日期、时间范围、渠道范围和统计口径。\n- 出现冲突时，优先采用日期更新、口径更完整、可追溯的数据。\n- 不将线上商城、小程序、抖音等单渠道数据外推为全渠道数据。\n- 已失效的信息不直接删除，转入变更记录，避免重复使用旧结论。\n\n## 二、已确认事实\n\n### 1. 品牌与发展阶段\n\n- 品牌：零售品牌 A，徐州本地蛋糕、甜品和下午茶品牌。\n- 约2019年从双人私房工作室起步，老板本人制作蛋糕。\n- 2021-2024年经营较小规模线下店，兼顾下午茶打卡和生日蛋糕。\n- 2024年搬到现址，加强下午茶和门店打卡场景。\n- 2024年末开始重点经营抖音，通过直播和低价小四寸蛋糕拉高销量。\n- 2025年下半年逐步发现抖音购买习惯、核销表现和低价低利润问题，随后减少大规模直播。\n- 2026年4月暂停周年庆，5月开始重装楼下堂食店。\n\n### 2. 流量与渠道资产\n\n- 老板小红书账号约2万粉丝，微信好友约4万。\n- 老板愿意出镜，有个人IP基础；内容质量较好，但互动和成交承接偏弱。\n- 美团、抖音、外卖和小程序均已开通，平台基础建设总体具备。\n- 历史信息显示抖音人气榜第4、点评热门榜第5；排名具有时效性，使用前需重新核验。\n- 小程序曾存在不能直接添加客服微信、甜品SKU显示售罄等承接问题。\n\n### 3. 团队与经营基础\n\n- 团队年轻、积极性和主动性较好。\n- 内部标准化基础较弱，特别是新品研发、报单、出单和运营协同流程。\n\n## 三、数据结论\n\n### 0. 中秋月饼销售基准\n\n- 2025年中秋月饼销售营业额约40万元。\n- 2026年中秋目标必须实现同比增长，但具体目标仍需结合去年渠道/SKU结构、今年客群规模、礼盒毛利和后厨产能测算。\n- 9月对零售品牌 A不是普通时令上新月，而是年度月饼销售大月；月饼礼盒应成为9月唯一经营主线，避免秋季蛋糕甜品同期分散资源。\n\n### 1. 抖音近12个月分析\n\n- 2026年1-5月抖音成交金额约从23.1万元降至8.4万元。\n- 同期成交人数约从2471人降至938人。\n- 成交客单大体保持在89-98元，主要问题是购买人数下降，而不是客单价崩塌。\n- 奶皮子四寸、草莓5选1、油画玫珑等爆品先后衰退，新爆品没有连续接档。\n- 2026年小四寸/四寸尝鲜类长期占据较高成交份额，限制利润和高客单承接。\n- 六寸蛋糕成交从2026年1月约6万元降至5月约1.87万元，生日场景承接减弱。\n\n### 2. 数据口径\n\n- “前三个月实收占比”表为综合口径，可用于目标拆解。\n- 其他不少经营数据主要来自线上商城或小程序，不能直接代表全渠道。\n- 后续所有分析必须先确认时间范围、成交/实收口径、渠道范围、退款及核销口径。\n\n## 四、阶段性战略判断\n\n### 1. 核心命题\n\n- 零售品牌 A不是缺流量，而是缺少把流量稳定转化为产品资产、客户资产和利润的能力。\n- 长期目标是成为徐州蛋糕市场的领先者和常青树，而不是依赖短期平台爆品。\n- 长期品牌规划的工作主张：品牌竞争不只是更早感知消费者变化，而是从变化中识别值得长期回应的意图，并持续把它变成可感知、可购买、可复购的产品与体验。\n- 零售品牌 A的长期课题应由“获得更多曝光”转向“在某个需求发生时，消费者为什么更愿意先选零售品牌 A”。渠道补齐、用户触达和上新提速都应同时承担需求验证与品牌资产沉淀任务。\n- 当前候选需求方向包括“重要时刻的可靠且有审美的蛋糕选择”和“一至两人日常犒赏、不过量但有仪式感的小规格蛋糕”，尚需通过用户、交易和复购数据验证，不直接作为最终品牌定位。\n\n### 2. 产品\n\n- 当前产品视觉和热门款跟进能力较好，用户评价基础不错。\n- 主要问题是追逐热门款较多、稳定招牌不清晰，产品资产沉淀不足。\n- 小四寸夹在甜品与标准生日蛋糕之间，挤压四寸需求，但没有形成高销量甜品带动。\n- 暂定方向：逐步弱化直至取消小四寸；堂食主推切块、2/3寸甜品和下午茶；线上主推4/6寸蛋糕。\n- 六寸蛋糕承担生日场景、品牌展示和利润；低门槛产品主要承担尝鲜、到店和拉新。\n\n### 3. 渠道与价格\n\n- 团购、外卖、抖音与小程序之间曾存在价格倒挂风险。\n- 抖音负责尝鲜、到店、限量和季节性拉新；小程序负责生日、正价、完整规格、定制服务和复购。\n- 不长期在抖音低价销售小程序同款同规格产品。\n- 直播货盘应包含引流款、流量款、承接款、利润款和复购承接，不能只靠低价小四寸冲量。\n\n### 4. 研发与运营\n\n- 后厨研发缺少稳定流程，曾导致母亲节、520定版晚、打样匆忙、产品吸引力不足和宣发节奏失配。\n- 新品应执行：概念与目标人群 -> 打样 -> 调整 -> 内测 -> SOP -> 成本卡 -> 定价 -> 物料与渠道上架。\n- 老板需要主导“卖什么、卖给谁、怎么卖”，项目团队负责把判断变成流程和执行排期。\n\n### 5. 内容与私域\n\n- 内容不应只提供观看热闹，需要增加用户互动、福利承接、商品路径和复购触达。\n- 约4万微信好友是重要客户资产，但激活动作需要有节奏，避免无序群发和过度促销。\n- 小程序应强化下单认知、客服入口、生日场景和复购承接。\n\n## 五、外部市场判断\n\n- 徐州GDP、人均收入和品牌入驻情况显示消费空间较好，同时具备一定旅游和流动客群。\n- 核心商圈集中，且与门店距离较近，具备流量覆盖和到达优势。\n- 本地蛋糕品牌整体仍处于相对初级阶段，竞争尚未高度成熟，产品力可作为首要提升能力。\n- 小红书“徐州蛋糕”关键词下，本地品牌系统投放较少，存在内容占位机会。\n\n## 六、执行优先级\n\n1. 建立新品研发与上新流程。\n2. 梳理产品结构，建立稳定招牌和4/6寸价格带。\n3. 修正渠道价格倒挂，明确各渠道分工。\n4. 优化小程序、客服与私域复购承接。\n5. 用月度上新、节日活动和直播持续验证，而不是一次性大改。\n6. 报单设备、出单动线和产品附加价值属于重要但不紧急事项，在前四项稳定后推进。\n\n## 七、提案表达偏好\n\n- 面向老板的正式提案优先使用经营语言，不在主讲页堆砌SWOT、4P等框架名称。\n- 叙事顺序：回到调研现场 -> 说明已经具备的优势 -> 击中关键经营问题 -> 给出少量优先动作 -> 说明首月如何落地。\n- 结论需要证据支持，但避免把单渠道数据描述成全渠道事实。\n- 结构化版本可用于内部审核；老板提案版本强调听得懂、被击中、知道马上做什么。\n- 面向老板提出目标、产品规格、奖金和部门动作时，保持咨询顾问角色：提供制定方法、参考系数、演算示例和决策边界，不替老板直接确定真实目标或奖金金额。\n- 销售目标不机械平均分给前厅、客服和后厨：前厅与客服承担销售/线索目标，后厨承担产能、准时交付、损耗和客诉目标；三个部门共同参与阶梯奖金池。\n\n## 八、待持续补充\n\n- 全渠道月度实收、订单量、客单价、退款和核销数据。\n- 产品成本、毛利、日产能和损耗。\n- 各渠道成交、获客成本和复购贡献。\n- 堂食店开业后的客流、桌均、翻台、甜品和饮品连带率。\n- 私域有效用户、触达、下单和复购数据。\n- 新品测试、活动、直播和博主投放复盘。\n\n## 八点一、待验证的产品结构假设\n\n### 小规格日常消费与六寸生日消费的矛盾\n\n- 当前假设：用户的部分蛋糕消费可能由六寸生日场景转向四寸/三寸日常解馋场景，但现有数据尚不足以确认这是自然需求迁移。\n- 已有证据只能确认：低价小四寸曾是抖音的重要成交触发器，停止后抖音购买人数和成交明显下降；同时六寸蛋糕也缺少稳定承接。\n- 需要区分三种原因：真实场景迁移、平台低价心智训练、爆品及推广供给变化。\n- 不能把四寸简单定义为“更便宜的六寸”。若同口味、同造型、同服务只缩小尺寸，会直接分流六寸并降低绝对毛利。\n- 后续验证指标：各尺寸新老客结构、同一用户尺寸迁移、30/60日复购、四寸对六寸的蚕食率、单笔绝对毛利、单位工时毛利、每100访客总毛利。\n- 暂定策略方向：少量保留有利润的标准四寸日常蛋糕；六寸继续承接生日和庆祝；三寸仅用于限量测试，不全面铺设；抖音可恢复有数量和时段限制的四寸成交入口，但不恢复过去无利润的低价小四寸。\n\n## 九、更新日志\n\n### 2026-07-30｜录入《零售品牌 A 开业复盘&工作沟通会-0710》\n\n**资料来源**\n\n- 文件：`~/MindPalace/workspace/零售品牌 A/零售品牌 A 开业复盘&工作沟通会-0710.pptx`\n- 资料形成时间：2026-07-10\n- 统计数据主要覆盖2026年6月，部分投放数据更新至7月5日或7月6日。\n\n**开业活动目标与执行情况**\n\n- 原定目标：全渠道拉新1000人、权益卡销售500张，并建立/优化上新、接单引导、后厨分单、门店后厨协同SOP及培训机制。\n- 活动为首次高密度、全渠道协同的大活动，团队协作和临场解决问题能力较好。\n- 产品研发和物料准备出现延期；父亲节蛋糕、线下产品研发及部分线下动作被压缩或延后。\n- 小红书体验官、私域裂变活动数量减少；抖音平播和大场直播取消；核销加企微、日常9.9权益卡等动作延后。\n- 活动估算投入14,586元，主要包括砍价产品、大转盘奖池、周边、table cake、体验官、点评免费试、小红书博主及聚光投放。\n\n**6月经营数据**\n\n- 6月实收270,226元，环比5月增长28%，同比2025年6月增长18%；综合折扣约83折。\n- 商城实收171,651元，环比增长79%，同比增长33%，成为主要成交渠道。\n- 抖音核销金额66,307元，环比下降26%，同比下降23%。\n- 美团核销金额7,775元，环比基本持平，同比下降47%。\n- 外卖实收24,493元，环比增长34%。\n- 试营业当天实收约3.6万元，为当时全年单日峰值。\n- 口径：商城按企微、支付宝及储值支付统计；外部渠道按后台核销金额统计。商城剔除了周总为订货人的订单，外部渠道未剔除。\n\n**客户与复购数据**\n\n- 6月消费会员2554人，其中复购会员806人，复购率31.56%；5月复购率16.81%，4月为24.68%。\n- 6月新增客户4461人，同比增长157%；新增会员1541人，同比增长51%。\n- 会员注册转化率34.5%，高于29%的历史值，但低于40%的期待值。\n- 截至6月30日，企微新增好友1102人，完成拉新目标110%以上；个微数据缺失。\n\n**渠道流量与转化**\n\n- 小程序访客14,072人，同比增长180%；新访客10,455人，同比增长233%，新访客占比74%。\n- 小程序访问到支付转化率16.8%，低于2025年6月的30.3%。流量增长明显，但转化效率下降。\n- 抖音访客46,582人，同比增长50%；成交人数1691人，同比下降11%；访问成交转化率4.96%，去年同期为5.72%。\n- 抖音首购人数578人，同比下降34%；核销人数636人，同比下降39%，核销人数占比38%，去年同期为54%。\n- 美团点评访客7532人，同比下降1.3%；成交人数249人，同比下降46%；访问成交转化率3.3%，去年同期为6.0%。\n- 美团核销人数83人，同比下降71%；核销人数占比33%，去年同期为62%。\n- 6月小红书私信进线333人，环比5月增长175%；企微留资187人，留资转化率53%。\n\n**活动数据**\n\n- 39.9元代339元权益卡售出998张，实收39,820.2元，完成500张目标的200%；新客405人、老客593人，新老客占比约4:6。\n- 权益卡配套代金券截至统计期促成16单，实收2327元。权益卡的后续核销、带动消费和复购仍需持续追踪。\n- 大转盘参与1690人，其中新客1102人，占65%；奖券带来19单、实收1921元。\n- 0元砍价参与312人、帮砍950人、成交165单，平均每位参与者带来约3名帮砍好友。\n- 25.9元代50元券售出517张，仅核销28张，整体核销率5%；抖音核销率3%，美团核销率24%。该活动拉新表面数据可观，但真实到店和兑现效率偏低。\n- 小程序订阅与短信触达成功5343人，带来303次访问、52人支付、支付金额4060.3元，整体推送支付转化率1.0%；其中短信为1.9%，小程序订阅为0.1%。\n\n**小红书投放数据**\n\n- 6月合作15位博主，投入3800元；截至7月5日获得77,693次阅读、2795次互动，单篇平均阅读5180、互动186，CPE为1.36元。\n- 同步大众点评内容获得4794次阅读，单篇平均320次。\n- 截至7月6日，产生1篇互动超过300的笔记、6篇点赞过百的笔记。\n- 当前数据能证明注意力购买效率，但尚不能直接证明到店成交和长期复购，需要后续建立渠道归因。\n\n**复盘确认的四类问题**\n\n1. 研发决策过度纠结内部技术感受，用户对造型、拍照、口味新颖度、食材品质和夹心丰富度的视角不足。\n2. 赠送活动不能只看即时ROI，应作为注意力采购，但必须先测试转化水平并建立年度预算约束。\n3. 砍价产品交付、现场抽奖等卡点说明物料、人力、活动和交付流程测试不足。\n4. 成本核算方式不够稳定，尚未按不同产品角色区分价格带和毛利要求。\n\n**预算与定价规则**\n\n- 年度营销预算建议控制在营业额的3%-5%，大活动预算约占年度营销预算的30%。\n- 主推4寸产品建议价格带118-128元，含包装毛利建议65%-70%，可通过增加合理成本提升产品价值。\n- 其他产品毛利可按角色在60%-75%之间浮动。\n- 成本卡必须标准化；常规非季节产品建议每半年更新一次成本。\n- 复盘中的普洱荔枝样例：4寸成本28.824元、定价108元、毛利约73%；6寸成本48.644元、定价188元、毛利约74%。\n\n**Q3既定方向**\n\n- 7月：夏季蛋糕研发与上新2.0、9.9甜品卡测试、财报数据梳理1.0、专场大播、会员诊断及储值测试调整、七夕和秋季1.0蛋糕研发、中秋礼盒准备。\n- 8月：七夕蛋糕上新、秋季蛋糕甜品1.0上新、线下品鉴会/杀糕会、中秋礼盒确认、财报数据梳理2.0、SKU结构初步优化。\n- 9月：秋季蛋糕甜品2.0上新、中秋礼盒售卖推广、财报数据梳理3.0、用户体验升级方案规划、线下季度复盘。\n- 七夕产品计划研发期为7月20日至8月10日，约8月14日上线；2026年七夕为8月19日。\n- 8月夏季口味建议包括杏子、蜜瓜、葡萄、芒果/杨枝甘露；9月秋季口味建议包括无花果、石榴、山楂及中秋造型款。\n\n**对后续策略的约束**\n\n- 开业活动验证了零售品牌 A能够获得大量流量，但小程序、抖音、美团均出现“访问增长或稳定、成交/核销效率下降”的问题，后续不能只追求曝光和售券数量。\n- 权益卡、大转盘、代金券、砍价和博主投放必须继续追踪核销、带动消费、复购和渠道归因。\n- 8月及后续活动必须提前完成研发定版和全链路测试，避免再次压缩宣发、直播和交付动作。\n- 当前阶段优先完善成本卡、研发倒排、渠道转化和核销承接，再扩大活动投入。\n\n### 2026-07-30\n\n- 汇总“零售品牌 A提案”历史任务和当前“零售品牌 A”任务中的品牌、产品、渠道、抖音及提案表达共识。\n- 建立项目上下文及后续更新规则。\n",

  "s57": "# 个人专栏｜发布与数据台账\n\n## 统计口径\n\n- 每条内容记录主题、最终正文、平台链接和发布时间。\n- 数据分别在发布满 24 小时、3 天、5 天时回收。\n- X 浏览量记录主帖浏览，并补充 thread 各帖浏览；评论排除作者续写 thread 产生的回复。\n- 即刻若网页端不展示浏览量，如实记录为“网页端不可见”，不使用其他指标替代。\n- ~~正式台账为飞书多维表格：https://acnc0ynqqklj.feishu.cn/base/TeCsbWAsWa9D3RsqRm7ckuJpnPj?table=tbl0gIw6hti8Zbsx&view=vewk39z4vv~~ —— **2026-09-18 起停用，不再读写。**\n- ~~本文件仅作为本地备份；新增发布和到期指标均先写入飞书多维表格。~~ —— **2026-09-18 起本文件是唯一台账**，新增发布和到期指标只写这里。（2026-09-23 补注）\n\n---\n\n## 2026-09-03｜低价引流，为什么越卖越亏？\n\n### 发布信息\n\n- X 发布时间：2026-09-03 15:35 起\n- X 主帖：https://x.com/Jingling_Mirror/status/2095415274707267943\n- 即刻发布时间：2026-09-03 约 15:44\n- 即刻主页：https://web.okjike.com/u/b85ca66f-1c5a-4369-9dbf-a94a88f43c74\n\n### 最终正文\n\n关于低价+引流，最容易给人一种“生意起来了”的幻觉。\n\n订单变多、门店变忙、平台排名往上走。可活动一停，一切回到原点。\n\n拿烘焙举例，为了拉动生日蛋糕，在平台做 19.9 的引流促销，如果顾客核销完就再也不来，那更像一次补贴，不是拉新。\n\n低价流量品短、快、直观，适合让陌生顾客先做一次低门槛决定。\n\n但门店要提前想清楚：顾客为什么会顺便买正价产品？之后凭什么再来？这是要提前设计好承接路径的。\n\n所以判断一个低价引流的套路能不能持续用，我至少会看三件事：\n\n1. 带来的是否真是新客；\n2. 有没有进入私域或留下再次触达的入口；\n3. 活动后有没有足够强的钩子让顾客购买正价产品。\n\n三件事都没有，只看销量没有意义。\n\n### 初始观察\n\n- 统计时间：发布后约 20 分钟\n- X：主帖浏览 7；thread 各帖浏览 7 / 4 / 5 / 4；点赞 0；外部评论 0。\n- 即刻：点赞 0；评论 0；网页端暂未显示浏览量。\n\n### 数据检查点\n\n- 24 小时：待更新\n- 3 天：待更新\n- 5 天：待更新\n\n---\n\n## 2026-09-04｜增长不能在营业额掉了时候才想起来\n\n### 发布信息\n\n- X 发布时间：2026-09-04 18:44 起（线程于 18:51 完成）\n- X 主帖：https://x.com/Jingling_Mirror/status/2095825400521953698\n- 即刻发布时间：2026-09-04 约 18:53\n- 即刻动态：https://web.okjike.com/u/b85ca66f-1c5a-4369-9dbf-a94a88f43c74/post/6a9aa2fa756bbb6658b4c966\n\n### 最终正文\n\n营销碎碎念 02\n\n我发现很多老板很容易把「增长」理解成“营业额不行了，要想点办法”。\n\n其实数字掉下来只是最后被看见的那一下，真正的问题可能发生在更早以前。\n\n现在的经营环境下，还能取得增长的老板，真的要记住，营业额好的时候抓紧复盘。顾客正在用订单告诉你，什么产品有吸引力，什么内容让人停下来，什么渠道带来的人更愿意买。\n\n等这波生意过去，很多线索也一起消失了。\n\n所以我现在看增长，就像是看一个故事的起承转合：这一波为什么起来，过程中怎么承接，结束后留下了什么，下一波从哪里接上。\n\n目前自己打磨了一套九宫格经营诊断的方法，也是想帮自己判断这件事。\n\n通过九宫格的矩阵，让品牌找到自己的站位，能快速决定下一阶段该把力气放在哪里，而不是每次营业额下滑，都重新开一场没有答案的会。\n\n### 数据检查点\n\n- 24 小时：待更新\n- 3 天：待更新\n- 5 天：待更新\n\n### 当前观察（2026-09-07）\n\n- X：主帖 14 次观看；thread 各帖 14 / 5 / 10 / 9 次观看；点赞 0；外部评论 0。\n- 即刻：点赞 0；评论 0；网页端不显示浏览量。\n- 说明：当前观察不回填 24 小时或 3 天字段；3 天节点为 2026-09-07 18:44（X）及约 18:53（即刻）。\n\n---\n\n## 2026-09-23｜我建议关店，客户半年后才关\n\n### 发布信息\n\n- X 发布时间：2026-09-23 18:43 起，4 条 thread，18:44 完成\n- X 主帖：https://x.com/Jingling_Mirror/status/2102710521871167647\n- 第 2 条：https://x.com/Jingling_Mirror/status/2102710677739880699\n- 第 3 条：https://x.com/Jingling_Mirror/status/2102710837144334806\n- 第 4 条：https://x.com/Jingling_Mirror/status/2102710969986371665\n- 即刻：Mirror 手动发布，未经我手，待他确认后补登记\n- 备注：原定 3 条。第 3 条计权 364 超出单条 280 上限（三条合计 844 计权 > 三条容量 840），按句号拆为两条，共 4 条。**正文未改一字**，只去掉「很抱歉，」后一个多余空格。\n\n### 最终正文\n\n**1/4**\n\n承认失败可能是某些时刻的成功。我接手过一个品牌，主理人很勤奋，但市场很凶残。在早年间建立过先发优势的主理人，认为他的成功可以持续复制，只要他守住自己的经营本心。奈何时也运也。先发有优势，后发只能被全方位围剿。他努力过，无果，找我来救命。\n\n**2/4**\n\n我看了又看，三个字，关店吧。主理人很不爽，我花了这么多钱找你做手术，你直接不治了？于是半年，我使尽浑身解数，调了又调，最后亏损收窄 45%，但还是亏。很抱歉，这个钱实在收不了了。又半年后，我看到财务表上最难看的几家纷纷关了，就像我一年前建议的那样。\n\n**3/4**\n\n除了惋惜，其实给我上了一课。《思考，快与慢》这本书说，我们都有两个系统，系统一感性，系统二理性，大部分人的人生都是系统一主导着。这件事里，我在用系统二，老板在用系统一，但怪他判断不清吗？当然不怪。\n\n**4/4**\n\n在账上，关店是一个数字；在他那里，是一堆并肩作战的人和那些努力不停的日夜。所以怎么解决，其实我也没有解法，可能就是要痛到一定阈值才可以吧。这就是碳基生物的可叹和可爱啊。\n\n### 初始观察\n\n- 统计时间：2026-09-23 18:46（发布后约 3 分钟）\n- X：主帖浏览 7；点赞与外部评论当时未刷出。续帖浏览在 thread 视图里不展示，待 24 小时节点补。\n- 即刻：未发布（他手动）。\n\n### 数据检查点\n\n- 24 小时：待更新（节点 2026-09-24 18:43）\n- 3 天：待更新（节点 2026-09-26）\n- 5 天：待更新（节点 2026-09-28）\n\n### 欠账\n\n- 本台账缺 **2026-09-18（U2 先有势，X thread 5 条，主帖 https://x.com/Jingling_Mirror/status/2100937640682082336）** 与 **2026-09-20（S3 越努力越葬送自己的故事）** 两次发布的条目，正文与即刻信息待补。\n\n---\n\n## 2026-09-24｜又是一年中秋节（礼盒在塌，自己吃的那一半在涨）\n\n### 发布信息\n\n- X 发布时间：2026-09-24 16:27 起，4 条 thread，16:30 完成（北京时间；各条 UTC 08:27:42 / 08:28:24 / 08:29:01 / 08:29:59）\n- X 主帖：https://x.com/Jingling_Mirror/status/2103038652708540452\n- 第 2 条：https://x.com/Jingling_Mirror/status/2103038832279162946\n- 第 3 条：https://x.com/Jingling_Mirror/status/2103038988022116746\n- 第 4 条：https://x.com/Jingling_Mirror/status/2103039230247395772\n- 即刻：Mirror 手动发布，未经我手，待他确认后补登记\n- 备注：全文 905 计权，单条上限 280、3 条容量 840 装不下 → 拆 4 条，按段落切、不在句中切（208 / 165 / 264 / 264）。发布前核对他原稿，他授权把「华尔道夫的 499 的月饼」改成「万豪的 499 的月饼」，其余正文未改一字。四条发出后逐条回 permalink 核对，条数、顺序、正文一致。\n\n### 最终正文\n\n**1/4**\n\n又是一年中秋节。\n盒马的现烤柜台上多了一排以前不常看到的口味：低糖黄庄风味、上海萝卜丝、西南椒盐云腿。都是各地的老手艺，过去只在本乡本土卖，今年被搬上了连锁渠道的货架；鲜肉月饼和鲜花月饼也没停，换了更好的食材。\n\n**2/4**\n\n另一边在塌。老牌经销商的月饼销售额同比掉了 45%，礼盒销量掉了 49%；千元以上的礼盒，销量掉了 76%。五星级酒店礼盒在某鱼上三折甩卖，万豪的 499 的月饼现在 99 也能买到了。\n\n**3/4**\n\n还有我自己观察了下，蛋黄酥这个品种颇有鸠占鹊巢之势，已经成为今年月饼季各家精品烘焙的主推产品之一。背后信号极为清晰——送礼少了，自己吃（包含家人分享）多了。这从很多品牌低糖、低 GI 的卖点也能验证，虽说我一向是不信月饼能低GI，但是总之也是契合了全民饮食健康化的趋势吧。\n\n**4/4**\n\n如此说来，再过几年的年夜饭套餐里是不是要出现藜麦饺子、能量碗了😂对品牌方来说，我之前提的顺势而为就非常重要了。能做现烤就现烤，能出低糖就低糖，地方食材可以揉进蛋黄酥或其他酥饼的内馅里，包装不用太浮夸，但是还是要好看，这样下来配合及格的渠道推广，100 多不会愁卖不动。\n\n### 数据检查点\n\n- 24 小时：待更新（节点 2026-09-25 16:27）\n- 3 天：待更新（节点 2026-09-27）\n- 5 天：待更新（节点 2026-09-29）\n\n### 欠账补充（2026-09-24 从主页读到，正文与即刻信息仍待补）\n\n- 2026-09-20（S3 越努力越葬送自己的故事）：thread 主帖 https://x.com/Jingling_Mirror/status/2101622161333174344 ，第 2 条 https://x.com/Jingling_Mirror/status/2101622857734447572\n- 2026-09-18（U2 先有势）：主帖已见上方欠账；主页另见续帖 https://x.com/Jingling_Mirror/status/2100937947965280429\n",
  "s58": "# 2026-09-18\n\n## 修正 9-17 的职业判断（Mirror 以 INTJ 方式逐条追问后触发）\n\n她挑出三处不自洽，我认错并修正：\n\n1. **变量混淆（我的错）**：上一轮用「把喜欢的东西变成工作，工作还是工作」反对去街舞/宠物行业打工，但同一条论据会否掉「用投资做内容」。真变量是**雇佣 vs 拥有**（结构），不是兴趣（领域）。已出四象限图归纳。\n2. **「门店经营是投资的弹药」是硬凑（我的错）**：她做价值投资（基本面/行业/长期持有），门店经营属执行层，两者连接很弱。且餐饮是烂商业模式、她服务的多为 1-10 阶段小品牌，从中提炼投资洞察可能有害。已收回。她投资内容的唯一基准是 10 年自身实战 + 阅读 + 对行业公司的判断。\n3. **漏评估就给方向**：财经内容极卷、平台对投资内容合规极严（不能荐股/暗示收益）、个人 10 年经验是不可验证的个人经历。上一轮这些一个字没提。\n\n## 修正后的结论\n\n- 去街舞/宠物**打工**依然不解决（结构未变）；**自媒体**落在「拥有」象限，性质不同——它解决「有没有自己的东西」，不解决「赚不赚钱」，这是两笔账。\n- 「用兴趣做内容」的判断标准不是「是不是兴趣」，而是**「是否为一件你不为任何目的也持续琢磨的事」**。按此筛：投资 ✅ / 写作 ✅（是形式不是题材）/ 猫 ⚠️ / 运动 ❌（她是消费者）。\n- 漏掉的一条：她档案里写的写作关注点「AI 时代的在场感、道德困境和人的选择」，既非投资也非经营分析。上一轮完全没提。可能是最该试的。\n- 所以不是二选一，是**三选一**：投资 / 经营分析 / 她真实在想的那些议题。\n- 「非兴趣 × 拥有」（私活、产品、股权）没进首选，理由是它解决结构不解决燃料，而她现在缺的是燃料。\n\n## 协作偏好（已写入 USER.md）\n\n自述 INTJ：逻辑强、在意细节，会逐条追问逻辑自洽性。论据必须与结论对齐，不能用修辞硬凑；含糊的「看情况」她不要，要明确判断 + 可验证下一步。\n\n## 方向收敛（2026-09-18 当天）\n\n**投资 pass**（她决定，未问原因）。剩下两个方向，性质不同：\n\n- **经营分析 = 能力向**（有真东西，但自述没劲）\n- **第三议题 = 动力向**（个人概括不出来，只有一串词：AI 时代的在场感、道德困境、人的选择）\n\n所以这次要测的不是「哪个方向好」，而是**能力和动力是不是同一个方向**。若最后证明不是，那才是真问题。\n\n### 第三议题的定位方式（我的提议）\n\n不先概括主题，改用**写法**定义容器：每篇写「一个你真见过的人 + 这个人做的一个选择 + 当时是什么把她框住了」。能装 前序项目 教练、美团销售、客户老板、个人。\n\n与经营分析的分界：经营分析写「生意怎么运转」，第三议题写「人在里面怎么选」。\n\n### 已出的题（4 道，待她挑）\n\n经营分析：① 为什么我给的经营建议客户常常不执行 ② 一份门店周报里老板真正会看的只有三个数\n第三议题：① 我在舞蹈品牌自学 SQL 想推动消课，最后推动它的是现金奖励 ② 给客户搭了 AI 工作流之后，我自己的判断是变多了还是变少了\n\n### 判读规则（先定好再测）\n\n指标：写时阻力（顺／卡）× 写完想不想继续（想／不想）\n- 顺 + 想 → 就是它\n- 卡 + 想 → 题材对，还不熟，继续写会顺\n- 顺 + 不想 → 能力在这，动力不在这 → 能当工作，当不了火焰\n- 卡 + 不想 → 排除\n\n### 状态\n\n尚未收到她写的任何一条。下一步是等待交稿，或她把题换掉。\n",
  "s59": "# 2026-09-24 工作日志\n\n## 每日选题（automation-1789470426679，11:00 正常触发）\n\n- 交付 5 条候选，覆盖 A–E 五个视角，仅选题层，未发布、未登记、未回收数据、未建交付文件。\n  1. S6「咨询顾问的宿命是：你永远不知道自己的建议最后怎么样了」｜A｜池内·已确认（今日解锁）\n  2. 「顾客开始翻盒子背面了」｜C｜新增（盒马芝士季＋低糖月饼）\n  3. 「一块蛋糕旁边，还躺着一小盒蘸料」｜B｜新增（盒马巴斯克摆盘）\n  4. 「早上七点，奶茶店的柜台在热可颂」｜E｜新增（古茗装烤箱卖早餐）\n  5. 「面包大王，给超市的自有品牌代工了」｜D｜新增（桃李）\n- 推荐：候选 1（S6，向内）＋候选 4（古茗，向外）。\n- **为什么出了 4 条新题**：池子里今天只有 S6 一条能干净地动——S5 已于 09-23 发布，S6 前两轮都因「等 S5 定稿」压着，现在解锁；乙1–乙5 在 09-22、09-23 两天已全部交付，乙组本轮已空；甲组其余各有卡点（S1 待按反差结构重写、S3 已于 09-20 发布、S4 与 S5 落点重合、S7 待定）。新题都标了「新增、未入池」。\n- 未列入的池内条目与理由：S1（值得单独一轮重写）、S4（落点与昨天 S5 重合，且与 S1 同论点；建议放几天或把落点挪到「几十个动作里哪些只是做给老板看的」，改标题要她点头）、S3（已发布）、S7（待定＋角度 09-15 占过）、乙组（交完）、U1（初稿在她手上）、U2（已发布）。\n- 中秋角度今天没硬凑：备货/包材、买礼盒的人≠吃礼盒的人、爆单挤掉主力品，三条都已用过。\n- 读台账核对状态：台账未动，状态与描述索引表一致。**但描述快照已滞后两处**：S3 已发布（表里「已定稿」）、S5 已定稿并发布（表里「已确认」）。是否同步进任务描述，等待发话。\n\n## 本轮查证到的外部事实（可复用）\n\n- **桃李面包（603866）**：2025 营收 54.48 亿（-10.5%）、归母净利 2.84 亿（-45.63%，连续第五年下滑）；2026Q1 营收 11.69 亿（-2.64%）、净利 -38.32%；2026-09-24 总市值约 66 亿、年初至今 -18%。区域：东北 -8.89%、华东 -15.7%、华北 -11.76%、华南 -19.68%（唯一正增长华中 +16.85%，占比 4.4%）。销售费用 4.79 亿仅降 0.62%，与收入下滑脱钩。**代工事实**（界面新闻，多家转载）：沃尔玛「沃集鲜」黄油厚切吐司／4.0 纯牛奶吐司、永辉「YH 全麦吐司」、山姆沈阳店贝果/草莓蛋糕/瑞士卷均由桃李代工；代工订单有地域局限。对照样本：恩喜村（绑山姆）销售额 2018 年 1 亿 → 2022 年近 20 亿，2024 年亿滋收购 72.35% 股权。\n- **古茗早餐**：全国 1.3 万余家门店计划陆续加装烤箱；两广上千家门店试点，单店日均烘焙 25 份以上、日均流水增量 200 元以上，约七成与饮品搭配售出；单品定价两版口径（媒体 4.9–9.9 / 8.9–9.9），套餐 13–20 元；超 90% 门店配咖啡机、咖啡销售占比 20–25%，目标早餐时段单店流水 1500 元。来源：开源证券 2026 中报点评＋行业媒体（品牌披露口径）。\n- **盒马**：芝士季主打「干净配方正从加分项变为基础门槛」，与内蒙古乳企共创新鲜原制奶酪、把「奶嚼口拌炒米」做成蛋糕（劳动报 2026-09-12）；低糖月饼销量同比近 +70%，为增长最快月饼品类（中华工商网 2026-09-21）；巴斯克开始「摆盘」，蓝纹乳酪 23.9 元／开心果 19.9 元一片，配奶油蘸料与小装饰（自媒体门店测评 2026-09-05，单点样本，引用需标边界）。\n- 行业口径（搜狐「什么面包正在赚钱」）：2026 年商超烘焙市场规模预计增至 648 亿元、占零售烘焙 42%；51.4% 消费者优先选商超/会员店买烘焙。属媒体转述，引用要标。\n\n## 每日选题（同日 11:12 第二次触发，系统重复触发）\n\n- **判断**：11:00 那轮已在 11:07 写完 memory，5 分钟后系统又触发一次。无法确认上一轮回复是否送达 Mirror，因此**不重复上面那 5 条**，改为交一批补位候选，并在回复开头用一句话说明，告诉她如果只看到这一条，说一声我补发 11:00 那批。\n- 交付 4 条，覆盖 B/C/D/E，仅选题层，未发布、未登记、未回收数据、未建文件。\n  1. S1「小店的结构性亏损，靠点状运营动作救不回来」｜E｜池内·已确认待起草（给反差结构重写版，用「券」作 C 端入口；台账标题未改，备选标题要 Mirror 点头）\n  2. 「排队三小时的那家店，现在是一个服装店」｜C｜新增（虎头局/墨茉 + 行业关店口径）\n  3. 「有没有小一点的」｜B｜新增（份量与家庭结构错配）\n  4. 「『现烤』是卖点，也是账单上最贵的那一项」｜D｜新增（报损成本结构 + 晚间折扣 vs 宁可销毁）\n- 推荐：候选 4（成本端·有市场锚点）＋候选 3（需求端·代入最快）。候选 1 定位是「解锁台账卡住那条」，不是新题。\n- **本轮特意不出 A**：今天 11:00 那轮 A 已用过（S6）。\n- 未列入的池内条目：S2（扩张/输血，与候选 1 的「结构性」线近）、S3（已发布）、S4（与 S1 同论点两面，台账定往后排）、S5（已发布）、S6（11:00 用过）、S7（待定缺「谁拍的板」）、乙组（交完）、U1（初稿在 Mirror 手上）、U2（已发布）。\n\n## 本轮新增的可复用外部事实（第二轮检索）\n\n- **行业关店/存活**：窄门餐眼截至 2026-07-13 近一年净减 81,700 家（新开 3,334）；另一口径（截至 2026-05）净关 8.8 万家、闭店率约 25%、门店平均存活 32 个月、两年内关店率 57%。**两个口径不一致，引用必须标来源与时点。** 老牌撤退：面包新语国内门店从 400+ 收缩至 100 多家、退出北京；85度C 母公司 2025-10 宣布全年关店超 40 家。\n- **网红退潮样本**：虎头局 2024-01 被申请破产清算并立案（截至 2026-08 无新进展公开）；墨茉点心局累计开店 96 家、关闭超三分之二，2025 年全年仅新开 2 家，2026 年无公开动向；公开归因为「单店模型尚未验证即高速复制」。泸溪河：2023 开 93 → 2024 开 216 → 2025 回落 170 → 2026 截至 6 月底仅新增 34；2024-06 开放加盟，一年半净增不足 100 家。\n- **短保损耗**：鲜制面包门店整体损耗普遍 8%–15%，预包装 1%–3%，数据化排产的商超烘焙可压到 5% 以内（行业媒体/调研转述，标边界）；另有行业标准口径「中央工厂生产损耗 3%–5%、门店现烤报损 4%–7%、整体损耗占营收 ≤4.5%」。有品牌**宁可销毁也不晚间打折**，理由两条：怕培养只等折扣的顾客、怕反复摆放的食安风险；社区店走「晚间折扣/剩食盲盒」（惜食魔法袋），把纯损耗转成边际收益。鲜制面包「生命线」最短 4 小时。\n- **成本结构**：原材料约占 40%（刘岩，媒体引述）；现烤需完整后厨+烘焙师，一线商圈人力可占销售额 20%+。冷冻面团价格仅为现做的 30%–58%，2025 冷冻烘焙约 250 亿元、渗透率 32%，行业合理损耗对比：用冷冻面团门店损耗可从 20% 降到 ≤5%（媒体口径，慎用）。\n- **消费侧**：早餐场景占烘焙消费 67.9%，咸味烘焙 2026 同比增速超 30%；74% 消费者会看营养标签、71% 愿为清洁标签付溢价；功能性烘焙 2025 约 240 亿元、同比 +62%。\n\n## 方法留档\n\n- 去重靠「台账真文件 + 09-21/09-22/09-23 本工作区日志 + 09-15/16/17 三份候选文件（Grep 关键词）」；发布台账备份 `~/Documents/work/outputs/content-ledger/` 已补到 09-23，但只对去重有参考价值，今天未依赖它。\n- **重复触发的处理定式**（本次新立）：先读 automation memory 看当天是否已有完成记录 → 若有，不重复同一批，改交补位候选，并在回复开头一句话说明 + 给出「要补发就说一声」的出口。\n- 选题池快照机制的老问题：描述里的表是静态的，S3/S5 的发布状态两天内就过期一次。要么每次执行后同步，要么把状态栏改成「以台账为准，不再在描述里记状态」——等待定。\n\n## 11:19 Mirror 选定「候选 2」，要求放大月饼特点 + 「又是一年中秋节」开场\n\n- **她指的候选 2 = 11:00 那批的第 2 条「顾客开始翻盒子背面了」（盒马低糖月饼那条）**，不是 11:12 那批的候选 2（虎头局那家店）。判断依据：只有这条带月饼，「把月饼的特点放大」才接得上。回复开头已先点明是这一条，避免两批编号撞车。\n- 出正文首稿（约 500 字，2 分钟档），交付在对话里，未建文件、未发布、未登记、台账未动。\n- 结构：指定开场「又是一年中秋节」→ 变化写在盒子背面那行小字（盒马把豆沙/莲蓉/五仁三款经典散装全改低糖，低糖系列同比近 +70%）→ 先动的是散装、礼盒还排后面 → 放大月饼的季节性（一年只卖这几周，没人敢拿这一波做实验，能上架的「新配置」必是别处验证过的）→ 减糖现在是及格线 → 配料表在月饼上本就不是可选项（GB/T 19855-2023 的含量门槛与命名规则、冬瓜蓉＋香精、广式五仁那五种仁）→ 标准管下限、渠道抬下限，两边抬完只剩「谁的货真、谁的原料别人拿不到」→ 落点：顾客翻来翻去是在找「能说服自己多花几十块的理由」。\n- 本轮新核的硬事实（可复用）：**GB/T 19855-2023《月饼质量通则》**（2023-09-07 发布、2024-04-01 实施，替代 2015 版）：莲子/枣蓉 ≥60%（100% 才是纯莲蓉）、果仁 ≥20%、咸蛋黄 ≥8%、畜禽肉 ≥5%、水产 ≥10%、食用花卉 ≥10%；水果及其制品（折算）≥25% 才可称「XX 水果月饼」、≥10% 称「XX 水果味月饼」、<10% 或只用香精的不得用「水果／水果味」命名；广式五仁必须正好是核桃仁/杏仁/橄榄仁/瓜子仁/芝麻仁五种（换一种只能叫果仁月饼，超五种叫六仁/七仁/果仁月饼）；**有添加量要求的馅料必须在标签上标示添加量**。辅证：水果味月饼常用冬瓜蓉＋香精打底（科普中国）；「无糖」≤0.5g/100g、「低糖」≤5g/100g（GB 28050-2011）；低糖 ≠ 无糖，饼皮仍是面粉/淀粉。\n- 待她定的：① 标题（主选原题「顾客开始翻盒子背面了」，另给两个备选）；② 是否把这条**新增**条目登记进选题台账（台账里没有它，按纪律不擅自加）；③ 要不要 300 字短版。\n- 发布按约定：等待说「可以发布」再动 X（@Jingling_Mirror），即刻她手动发。\n\n## 14:29 她改方向重写：不说国标，走地方特色 + 蛋黄酥 + 低糖低GI + 酒店包装冗余\n\n**个人要求（原话要点）**：不说国标（消费者不关心）；先确认盒马「鲜花饼／黄庄月饼」是否真实，再从**地方特色**切入（盒马以前卖过鲜肉月饼，现在进一步拓宽）；她观察到**蛋黄酥卖得比传统月饼好**；再加**低糖低 GI 的风向**、**对比传统酒店的包装冗余**。内容多，先试短版，不行写长文。\n\n**核实结果（全部为真，且都找到大陆口径来源）**\n- 盒马地方特色：**低糖鲜花饼、低糖黄庄风味月饼确实存在**（红网 09-24、广州日报大洋网 09-22、中华工商网 09-21、观点网 09-24 均报）；另有低糖全麦坚果月饼。地方特色款：黄庄风味、上海萝卜丝、西南椒盐云腿在部分城市上架，并开发贵州／石家庄／云南风味。**鲜肉月饼仍在售且今年升级**（官方新品文案：换高汤＋黑猪肉）。低糖鲜花饼用当季鲜玫瑰替代糖渍玫瑰。\n- **礼盒在塌**（中新经纬 09-22，快消品网监测）：2026 中秋前夕主要门店月饼**销售额同比 -45.17%、销量 -40.67%、礼盒销量 -49.04%**；500 元以上礼盒常规渠道占比跌破 2%；**千元以上礼盒销量 -76%**。五星酒店月饼二手平台三折甩卖：深圳 JW 万豪 298–498 → 最低 99；成都 W 258 → 149；广州丽思卡尔顿 388 → 110、428 → 228；北京康莱德 368–498 → 168–258。2025 年全国月饼规模 282.4 亿元（-5.9%）、产量 51.8 万吨（近十年首次负增长）。专家（庄帅）判断高价礼盒退潮是**不可逆的长期趋势**。\n- **自己吃在涨**：艾媒调研——购买原因「和家人分享」55.9%、「自己吃」50.4%、「送礼」42.5%（多选，自己吃首超送礼）。勤策消费数据：2026 月饼规模约 290 亿元、同比 **+2.7%**（与 2025 年 282.4 亿口径可衔接）。\n- **蛋黄酥**（大陆口径）：世纪联华庆春店——知味观「味悠在」蛋黄酥礼盒同比 **+1600%**，店家自述去年备货不足（单店口径，不能当行业数据）；知味观月饼礼盒 +62.9%、美心 +25.5%、美心双黄白莲蓉 +185%。杭州临平某新消费品牌酥点礼盒开售约 10 天破亿、单日产能峰值 300 万枚、全网蛋黄酥累计超 7 亿枚，今年主推低糖／低 GI（品牌宣传口径）。月饼季从约一个月缩短到 15–20 天，节前一周占整个月饼季销量四成，店家解释「大部分顾客买回去自己吃，好吃、新鲜更重要」。\n- **不要混用的**：蛋黄酥「销售占比已高于传统月饼」这个说法我只找到**中国台湾**的百货／糕饼公会口径，与大陆市场不是一回事，**未写进正文**；「酒店月饼都是代工厂贴牌」是自媒体常见说法，**未写进正文**。\n- 上一轮用的 GB/T 19855-2   "s60": "# 2026-10-21 工作日志\n\n## 每日选题（automation-1789470426679）\n\n- 台账核对：与任务描述索引表一致（U1 已起草／U2、S5 已确认…），**未改动**。池内 9 条＋乙 5 条在 09-22 至 10-20 已全部交过，本轮 5 条全为新增、未入池。\n- 视角全覆盖 A/B/C/D/E，只出选题，未发布、未登记、未回收数据、未建交付文件，无客户素材故无脱敏动作。\n- 推荐：候选 2（价签 vs 面团，B）＋候选 5（整店打包，A）。\n\n## 本轮核到的外部事实（摘要）\n\n- 上海五角场（截至 2026-06 上海烘焙店最多的街道）：街角烘焙 4:30 开工、8 点开柜七成品类、11 点前后全品类；早 8–10 点占全天销量超 1/3。焙野：工作日 17:30–20:00 占全天 70%–80%，周末 14:00–21:30、客流 +50%。来源：中国食品报 2026-10-08。\n- 意大利卡利亚里 Panetteria Agnese（营业超 60 年）10-05 起涨价约 10%，柜台贴公开告示致歉；祐禾北京门店点评留「面包越做越小」。\n- 祐禾（UH）：杭州湖滨银泰 in77 开业转发领 30 元无门槛券、队伍从 B2 排到地铁口；广州正佳单店月销曾破百万，同城加密到七八家后单店 50–60 万；截至 2026-09 在营 127 家、近一年关 18 家、净增 13 家；北京剩 11 家。\n- 储值：长沙手感麦夫会员余额估算近 800 万无法消费；祐禾 2026-03-23 声明无条件承接实付余额（赠送除外）；祐禾闭店通知写明余额可全国门店消费、退卡指定门店办理。行业门店平均存活 32 个月、57% 撑不到两周年（第三方监测，截至 2026-05 近一年）。\n- 二手设备：无锡 2026-10-16 整店转 2.3 万（2017 新麦烤箱带蒸汽、2022 层炉、惠联打面机/醒发箱等）；西安回收商 2026-10 报价区间：层炉/烤箱 800–3500、和面机 500–2000、醒发箱 600–2500、冷藏台 400–1800、风幕柜 800–4000；整店打包溢价更小。\n- 未采用：超长蛋挞下架（8 天 70 万份、1300 万流水、10-09 热搜）、料理面包品类观察、10.1 万家闭店盘点——均在历史占位或属资料型。\n",
  "s61": "# WRITE 工作区长期约定\n\n> **Mirror 是女性，一律用「她」。**（2026-09-24 本人纠正）本文件与所有工作区日志、技能、回复都按这个来。\n\n## 技能路由（2026-09-16 由 Mirror 指定）\n\n本工作区默认挂两个技能包，规则如下。\n\n### 1. writing-profile —— 默认启用\n\n- 唯一基准：`~/MindPalace/skills/writing-profile/`；已软链至 `~/.workbuddy/skills/writing-profile`。\n- 本工作区内**跳过技能自带的逐次确认**。Mirror 已在此长期授权，写作、改稿、选题、评论类任务直接按 `references/profile.md` 画像协作，不再问「这次要调用 Mirror 写作画像吗」。\n- 画像与当前要求冲突时，服从当前要求；只有 Mirror 明确说这是长期变化，才回头改画像文件。\n- 边界：画像不等于必须文学化。白话、评论、口述整理按清楚自然写，非叙事任务不套小说规则。\n- **每次她定稿后，做一次「我的稿 vs 个人终稿」对比提炼**（2026-09-24 她要求，固定动作）：写文件做字符级对比（字数/计权/段数/句数 + 逐句 diff），提炼追加进 `profile.md` 的「九·补·X」，并在回复里汇报。已归档：09-23 关店篇（九·补）、09-24 月饼篇（九·补·二）。\n\n### 2. dbskill —— 分两档门槛\n\n- 唯一基准：`~/MindPalace/skills/dbskill/`（v2.18.40，33 个 skill）；已逐个软链至 `~/.workbuddy/skills/dbs-*`。\n- 许可证 CC BY-NC 4.0：个人使用可以，商用需作者授权。对外交付物里别把 dbs 内容当自有方法论卖。\n\n#### 2a. 内容档 —— 「个人专栏」日常流程可直接调用（2026-09-16 Mirror 放宽）\n\n选题、写稿、改稿、发布这条线上默认可用，不必等商业话题：\n\n| 环节 | 技能 |\n| --- | --- |\n| 选题做成内容 | `dbs-content`、`dbs-hook`（开头）、`dbs-xhs-title`（标题公式） |\n| 传播与共鸣 | `dbs-resonate`、`dbs-spread`、`dbs-script-flow`（逐字稿流失点） |\n| 质检与发布 | `dbs-ai-check`（AI 痕迹）、`dbs-content-risk-check`（发布前风险）、`dbs-wechat-html` |\n| 素材与资产 | `dbs-content-system`、`dbs-video-extract`（需自备 TikHub / 轻抖 Key） |\n\n共 11 个。`dbs-benchmark` 两档通用：找内容账号对标走这里，找商业对标也走这里，同一轮只出一次结论。\n\n分工边界：`writing-profile` 管怎么说（文风与画像），上表技能管结构、传播和发布风险，`alic-daily-topics` 管台账与流程。三者不互相替代，也不重复出结论。\n明确不启用：闲聊、与技术无关的纯事实查询、日常事务。\n\n#### 2b. 商业档 —— 仅商业判断类话题启用\n\n商业模式、定价与客户、经营诊断、概念澄清、目标拆解、决策复盘才启用：`dbs`、`dbs-diagnosis`、`dbs-deconstruct`、`dbs-goal`、`dbs-good-question`、`dbs-jtbd`、`dbs-action`、`dbs-decision`、`dbs-save`、`dbs-restore`、`dbs-report`、`dbs-knowledge`、`dbs-learning`、`dbs-chatroom` / `dbs-chatroom-austrian`、`dbs-theory-grounding`、`dbs-standard-answer`。\n主入口 `/dbs` 只做路由，不做诊断。按「1 个主 Skill + 最多 2 个辅助 Skill」编排，输出一段可直接发送的提示词，本轮不执行下游业务流程。\n按需调用、不默认触发：`dbs-install-skill`（会写 `~/.agents/skills` 等 Agent 目录）、`dbs-update`、`dbs-skill-maker`、`dbs-agent-migration`。\n本地数据在 `~/.dbs/`（已有 2026-08-25 存档，勿删）。\n\n## 桌面技能约定（沿用 `Desktop/skills/AGENTS.md`）\n\n- 桌面目录是唯一唯一基准，技能包放 `Desktop/skills/<name>/`。\n- 安装=软链，不复制：`ln -sfn <唯一基准> ~/.workbuddy/skills/<name>`。改唯一基准即生效。\n- 更新落在桌面包上，改完两个路径都要验。\n\n## 个人专栏 · 人设与选题（2026-09-21 定）\n\n### 人设\n\n- **「烘焙店主小白」人设已弃用**（2026-09-17 撤回，09-21 Mirror 明确「不用了」）。按 2026-09-09 已确认方向写：有商业 sense、懂经营分析、有个人判断和活人感的专家形象，顾问视角，**不是虚构开店的人**。\n- `alic-daily-topics` skill 第二节整段仍是那份已撤回的人设，skill 自己标着「不要按此出题」。唯一基准 `~/MindPalace/skills/alic-daily-topics-作者每日选题/`。**待 Mirror 发话再清。**\n\n### 选题三条唯一基准（都不在本工作区）\n\n| 用途 | 路径 |\n|---|---|\n| 唯一选题清单 | `~/MindPalace/memory/notes.md |\n| 判断句与数据锚点 | 同目录 `2026-09-18_区域品牌 D_判断句与数据锚点.md`（**已发现一处口径串档未改**：整体实收 -14% 标成半年复盘出处，实际出自年度复盘） |\n| 历史候选（避重必读） | 同目录 `2026-09-15/16/17_选题候选.md` |\n| 区域品牌 D原始材料 | `~/Desktop/工作/区域品牌 D/`（PDF 用 `pdftotext -layout`；pptx 解 zip 抽 `ppt/slides/*.xml` 的 `<a:t>`，`unzip -p \\| strings` 抽不到中文） |\n\n### 任务描述（automation-1789470426679）\n\n- 选题池已写进描述（甲组 = 台账 8 条，乙组 = 09-17 的 5 条通用判断）。**描述是快照，台账动了要同步。**\n- Mirror 定过一条原则：**硬约束（脱敏之外的）不要放进选题规则**。个人字段契约 + 视角覆盖 + 写作标准保持原样，不要自作主张加「边界」「去重依据」这类新字段。\n- 描述里唯一保留的硬约束是脱敏：客户名写「某蛋糕品牌」，不出现城市、门店名、可反推的时间＋营收组合。\n- **2026-09-23 她授权加了两条**：① 六、脱敏节内加「越脱敏越好」＋「对外文案的客户数字不与台账核一致性」；② 新开「七、发布约定」——发布默认 X（@Jingling_Mirror），触发词是她明确说「可以发布」；即刻她手动发。**发布约定没有塞进一~五的选题规则里**，按她「脱敏之外的硬约束不进选题规则」的原则另立一节。\n- 描述里的选题池是快照，**当前已滞后**：S3（09-20 发布）、S5（09-23 定稿并发布）两条表里状态没同步，09-24 的月饼篇是池外新增。同步与否等待发话。\n\n### 选题标准（2026-09-21 连打回三轮后定，别再犯）\n\n1. **C 端共鸣优先。** 选题要从大众有体感的现象切入，专家解读放后面。写店主视角的经营内部问题（排产、人力、账期、节假日历）她连着否了两轮，原话「不接地气」。\n2. **锚在当下真实市场动作上。** 先去看别人今年实际在卖什么、怎么卖（山姆/盒马/年轻烘焙品牌的具体商品和价格），再从中提炼判断。拿通用消费现象或标准条款当素材，会被判成「资料型」。\n3. **判断必须落在商业模式上，不是「因为量大」这种常识。** 例：「山姆月饼便宜」→ 不是规模优势，是盈利模型换了（靠会员费不靠单盒毛利）。\n4. 引用媒体转述的数据要标边界；品牌自家新品属性是官方宣传口径。\n\n### 已用过的选题（避重）\n\n09-15 四条、09-16 五条、09-17 五条、台账 U1/U2/S1–S7、09-21 交付的两批、09-24 交付的两批 + 月饼篇（已发布）。中秋角度里**已被占掉**的：备货/包材起订量/节后库存、买礼盒的人≠吃礼盒的人、月饼爆单挤掉主力品、月饼礼盒与自吃迁移（09-24 已发）。\n\n## 对外内容与发布（2026-09-23 Mirror 定，长期有效）\n\n1. **对外文案只按脱敏标准过，不核台账数据一致性。** 她原话：「我本身就是要脱敏，你不应该在意数据对的上这件事，越脱敏越好。」→ 客户数字写进对外稿就是故事口径，不再拿它跟台账／复盘原始数字对账；数字、时间线、标题跟内部材料对不上，**不要提**。仍然不许编的是外部世界的事实（行业数据、别人的案例）。\n2. **脱敏方向是「越狠越好」**，不是「刚好不可识别」：店数、年份、百分比能省则省；她终版里连「五家店／十年」都去掉了。\n3. **发布默认 X（@Jingling_Mirror）。** 触发词是她明确说「可以发布」；在此之前一个字不动、不碰浏览器。即刻个人手动发，不经我手；小红书没定。\n4. 发布用个人原文，不改词。只有排版层面的问题（分段、多余空格）可以先问一句。\n5. **核事实是我的活，不是正文的活。** 不确定的外部事实要在发布前核出来、单独告诉她（她会自己决定改不改），但**不要把免责句、口径说明写进正文**——正文里带括号解释的数据，个人处理是连数据一起删。\n",
  "s62": "# 回溯 recall｜长期记忆（本工作区只放周期性复盘）\n\n> 周度复盘已做成自动化任务 `automation-1790219072602`（Mirror 命名为「回溯」）：每周一 09:00（Asia/Shanghai），cwd 指向本工作区，**已开启「推送到 WorkBuddy 微信小程序」**（`push_to_wechat = 1`，2026-09-24 11:17 由 Mirror 在界面设定）。\n> 2026-09-24 本工作区由 `WorkBuddy/复盘` 改名/重建为 `WorkBuddy/回溯 recall`，产物与记忆已一并迁入，旧目录已删。\n\n## 周度复盘的执行口径\n\n- **统计窗口**：以运行日（周一）为基准，覆盖「前 8 天的周日 00:00」至「前 3 天的周五 23:59」。例：9/21 周一运行 → 9/13 00:00–9/18 23:59；9/28 运行 → 9/20 00:00–9/25 23:59。\n- **落盘**：`outputs/YYYY-MM-DD_YYYY-MM-DD_周度复盘.md`（起始日_结束日）。首期：`2026-09-13_0918_周度复盘.md`（9/18 生成）。\n- **五段结构**：核心命题／关键产出／结论与认识变化／待续事项／月度复盘索引（3–8 关键词 + 一句话，本月内滚动累积）。\n- **关键产出合并规则**：按项目或独立交付物归并，同一项目内的规则、调整、测试、验证、打包写成一条；3–6 条，宁缺毋滥；判断标准是「值不值得在月底再看一次」。\n\n## 取数方法（2026-09-24 实测有效，别重新摸索）\n\n- **任务清单在 sqlite，不在文件里**：`~/.workbuddy/workbuddy.db` 的 `sessions` 表，字段 `title`/`custom_title`/`created_at`/`last_activity_at`/`cwd`/`is_background_automation`，时间戳为毫秒。看标题即可筛窗口。\n- **现成摘要＝各工作区 memory**：`~/MindPalace/memory/notes.md 与 `MEMORY.md`（工作、WRITE、技能、设计、PERSONAL 及时间戳目录）。读懂这些基本就够写完整份复盘。\n- 会话 jsonl 结构：`role`/`type` 平铺在顶层，`content` 是 `[{type:'input_text'|'output_text', text}]` 数组，`<system-reminder>` 块要剥掉才是真实提问。\n- 会话内任务清单：`~/.workbuddy/tasks/<sessionId>/*.json`。产物索引：`~/.workbuddy/artifact-index/`。\n\n## 微信推送（已解决，留档）\n\n自动化结果推到微信 ＝ 任务编辑弹窗的开关 **「推送到 WorkBuddy 微信小程序」**（DB 字段 `automations.push_to_wechat`）。\n\n- `automation_update` 工具**不接受**该字段（传 `pushToWeChat` / `push_to_wechat` 均被静默忽略），只能由 Mirror 在界面打开。下次遇到同类需求直接让本人点，别浪费轮次试。\n- 应用惯常在目标时间前几分钟起跑（每周一 9:00 的任务 `next_run_at` 显示 08:50），是正常行为，不是配错时区。\n- 首期实跑时间：2026-09-28（周一）——届时核对微信端能否收到，这是推送开关的唯一验证点。\n",
  "s63": "# 周度复盘｜2026-11-01（周日）00:00 — 11-06（周五）23:59\n\n口径 Asia/Shanghai。窗口内 5 个会话，实质 3 个（消费品牌 C月会、品牌营销方案总结、情报平台）；11/5 的资料库整理无会话记录，靠文件 mtime 补入。\n\n## 1. 本周的核心命题\n\n- **下滑要找到位置，不是找到原因。** 两份 10 月月会都在做同一件事：把 -X% 拆到渠道、门店、单品、漏斗的某一格，指出哪一段断了。\n- **会员从「做活动」转向「定规则」。** 券不再测了，改成五客群五种券型 + 画布常态化；权益卡、积分、储值三件套同时排进 11–12 月。\n- **把「看别家在做什么」变成系统。** 从一次性页面，到有数据层、能抓取、有审核链路的情报台。\n- **记忆要有入口层。** 长文档是证据，导览卡才是回忆。\n\n## 2. 本周关键产出\n\n1. **消费品牌 C 10 月会员运营月会 v2（11/3，12 页）** —— 实收 34.9w（环比 +11.9%、同比 +21.6%）、订单 2,596（+25.2%）、客单 63.53（-10.4%）、折扣率 90.15%（再降 3.15pp）；会员 1.75w、消费会员 1,569（+30.1%）、储值会员 116（+6.4%）。五客群券型定调（61–90 天 88 折、91–180 天满 50-8、181–360 天 8 折）；新人礼 A 组定版（核销 24.2%、ROI 9.68）；分层触达 6,492 人（召回 1.2%、ROI 8.41）；企微 +1,021。附 11 月 31 项计划四条线。docx／pdf／预览／build 脚本四件套。\n2. **零售品牌 A 11 月月会（11/3，13 页）** —— 全渠道 30.1w，日均环比 -21.6%、同比 -36.9%；四渠道只有美团外卖正增长（+30.2%，占比 9.1%→15.1%）；抖音核销同比 -64.1%，占比 53.1%→30.2%。10 月计划完成率 90%（27/30）。11 月主线：草莓上新 + 双 11 88 元权益卡（价值 299）+ 积分季。\n3. **消费与零售垂类情报台（11/6）** —— 由 11/4 的单页原型（13 条品牌动作、划选收藏、信源抽屉）重构成三层：index.html（70KB 自包含）+ build.py（缺 id／非法分类／假日期硬校验）+ fetch.py（抓取产出待审草稿）+ data/ 四张 json；三页签 情报流 25 条／品牌档案 12 个／信源地图 6 层。附 5 个品牌核查，两处加盟站门店数与品牌方口径打架，标为不采信。\n4. **我的工作资料库（11/5）** —— 单页 HTML「先回忆，再继续」：7 张项目卡 + 当前主线 + 思路亮点 + 分区浏览 + 证据边界；同配 4 个项目导览 md，打包 5.9KB 导入包。\n\n## 3. 重要结论与取舍\n\n- **消费品牌 C的增长是「人来了」不是「花多了」。** 订单 +25.2%、客单 -10.4%，折扣率再降 3.15pp；瓶颈不在注册（76.5% 到店顾客已是会员），在 100 人到店 → 6.8 人当月消费 → 0.5 人储值这一段。\n- **零售品牌 A的失血不在流量，在渠道搬家。** 线上商城下单转化 48.19%→30.34%（-17.85pp），约一半来自去年 1,948 笔抖音券在线上商城内支付、今年只剩 837 笔（46%→29%）。不换口径会误判成页面变差。\n- **头部集中是效率不是风险。** 零售品牌 A TOP10 占比 45.4%（去年 29.7%），其中一半是四款秋季新品——接棒成功，但接的是「小体量多款」不是单一爆款，所以 11 月草莓只给 1–2 款定 1.5–2 万的目标。\n- **活动驱动不是常态能力。** 企微加人 W43 366 人里 162 来自体验官招募，活动一停就掉回日均 30；要变成日常动作只能靠门店开口的激励。\n- **平台化的关键不是页面而是数据层。** 公众号、小红书、抖音、点评都没有合规批量接口，「持续更新」的正确形态是每周跑一次检索任务（媒体自动跑、公众号靠检索补），不是部署爬虫。\n- **触达买的是长尾，不是利润。** 召回率 1.2%、单均核销带动 157 元——对 60 天不消费的人是唤起，不能拿它算高频贡献。\n\n## 4. 尚未完成 / 下周继续\n\n**消费品牌 C** —— 11 月 31 项计划责任人列仍空（连续第二周同类问题）；4 项数据未补齐（10 月新增顾客数、2025-10-31 时点会员绝对值、2025-09 月末会员数、计划负责人）；储值转化率 -1.64pp 仍无方案（消费会员 +363，储值只 +7）；11/8 触达画布配置、11/16 积分上线需回收。\n\n**零售品牌 A** —— 双 11 88 元权益卡、草莓上新、积分季落地；12 月活动（积分抽奖、储值、甜蜜故事征集）待定稿。\n\n**情报台** —— 三个待定：是否建每周一自动更新任务、7 条媒体来源缺原文链接、跟踪名单 5+7 是否扩。\n\n**资料库** —— 导入包目前只有 zip，是否真的导入待确认；「个人决策对话」仍标待补全。\n\n**内容线** —— 台账仍停 9-24，本周零发布（连续第三周）。\n\n> 11/7–11/8 在窗口外：已做零售品牌 A 39.9 元旧权益卡真实效果复盘，下期入账。\n\n## 5. 月度复盘索引\n\n**本周新增**\n`转化率下滑先查渠道搬家` · `券型随流失时长反转` · `活动驱动不是常态能力` · `平台化先拆数据层` · `导览卡做回忆层` · `接棒靠多款不靠爆款`\n\n**本周一句话**\n两条业务线都在给「下滑」找位置——零售品牌 A的失血在抖音占比和券订单搬家，消费品牌 C的增长在订单不在客单；而个人那摊事，这周从「做页面」推进到了「建数据层」。\n",
  "s64": "# 设计工作区 · 长期约定\n\n## 工作方式\n\n- **先读资料再画。** 客户资料在 `~/MindPalace/workspace/<客户名>/`，里面有品牌、产品、渠道、经营数据。海报/物料的文字一律取自有据可查的来源，不编造产品名、日期、促销承诺。\n- 品牌 Logo / VI 素材零售品牌 A目录下不存在，涉及品牌标只能用文字标或占位，需向客户索取。\n- 交付物默认导出 PNG 到本工作区 `outputs/`，命名格式：`<客户><物料名>_<尺寸>_<版本>.png`。\n\n## 海报规范（Ardot canvas）\n\n- 字号硬底线 **28px**，任何一个文字节点都不得低于此值；溢出时砍内容，不缩字号。\n- 字体最多 2 款。中文优先：标题 Noto Serif SC，正文/信息 Noto Sans SC（画布已确认可用）。\n- 色彩最多 3 个角色。高级极简方向固定用：底 `#F4F0E8` / 墨 `#1A1A1A` / 金 `#C49A4A`（金色全幅最多 3 处）。\n- 竖版海报默认 1080×1440，四周留白 88px。\n- 一个视觉焦点，其余全部退让；负空间 ≥ 30%。\n\n## 概念可视化（对话内联图）\n\n- 概念解释类需求走 Visualizer 的 diagram 模块，**不走海报技能**——海报技能出的是静态美术图，装不下概念之间的依赖关系。\n- **分组 ≠ 关系。** Mirror 会直接说「看不到关系，依旧是罗列」。一张概念图至少要表达下面一种关系，否则就是失败的列表：**包含**（谁在谁里面）、**依赖**（谁产出谁、谁被谁用）、**角色差异**（这是零件／架构／流程／形态／规律／能力）。\n- 有效骨架：按「回答哪个问题」分层，层标题写明该层概念扮演的角色，层间用箭头接因果。**不要按主题分两栏了事。**\n- 她列的清单是素材不是规格——重叠项合并，跨抽象层级的项拆开另立一层。这条见 `~/.workbuddy/SOUL.md`。\n- Visualizer 硬限：颜色 ≤2 ramps／图、同层横向 ≤4 盒、字号 ≥11px。层内差异靠位置和虚实表达，不要靠加第三种色相。\n- SVG 不自动换行，中文按 12px 宽按「1 字 = 1 单位宽」估算，超宽就得手动断行。\n\n## 已知环境问题\n\n- Ardot 的 `G()` AI 生图不稳定，可能出现 fill 有 imageHash 但实际仍是 Image Placeholder 的情况。用 `download_source_media` + md5 比对确认；**不要重试 G()**，改走矢量方案。\n- `curl` 下载 Ardot 返回的截图/导出链接，加 `-sS -L --retry 2`。\n"
};
