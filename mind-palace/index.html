    "text": "> 起因：零售品牌 A Q3 复盘 08／09 两页把「线上商城营业收入」当全渠道实收，7 月同比写成 **+135.4%**（全渠道实为 +50.8%），8 月方向写反（+19.6% vs 实际 −15.7%）。被质疑三轮，前两轮我回答的都是「数据是准的」。\n# 数据口径与交付规范\n5. **客单价必须与实收同源，且区间必须一致。** 复盘口径实收 ÷ 月会口径订单量，会得到客户从未见过的数；天数不一致时误差可达 11%（9 月 30 天的金额 ÷ 27 天的订单 = 131 元，偏高）。→ **正确做法是先跟负责人对齐**：① 请客户补整月订单量；② 保留月报客单价并注明来源。**不要用\"金额÷券均价\"反推订单量。**\n3. **禁止用自己做的表验证自己做的另一份表。** 同源 ≠ 正确。L1 的错误一旦封装进去，之后所有引用它的地方都会**一致地错**——错误被一致性掩盖，越核越\"准\"。\n**被问「数据准不准」时的正确动作**：先反问一句「你要核的是**数字对不对**，还是**口径对不对**？」——本次三轮都栽在没问这句。\n## 4.5 正确回答「准不准」的标准句式\n3. **反推分母，逐行验证**。用表内数字倒推它用的分母（`日均 = 金额 ÷ 天数`），要能**逐行精确复现**才成立。能复现 → 不是算错，是口径不同。\n2. **禁止同级互核。** L1 核 L1、L2 核 L2，一致只能证明**转录没错**，不能证明**口径对**。",

    "text": "这就是我的底层操作系统，可以概括成四个词：定点共情、风险预算、资源排序、行动边界。\n我的共情不会平均撒给所有客户，而会优先放在那个具体问题最痛、又真的愿意行动的客户身上。资源也不会铺满所有渠道，只会投向最可能改变结果的地方。更重要的是，我不能为了证明自己是个好人，就接下超出交付能力的项目。最后做不出来，对客户和我都不负责任。\n先看见一个具体生命正在受什么苦；马上在心里算，我能不能长期承担；接着在有限的钱、时间和精力里做排序；最后允许自己牵挂，但守住行动边界。\n说得再直接一点：我先看见情绪，再启动风控。\n感受是真的，闸门也是真的。\n与我更匹配的，是咨询、经营规划、项目评估、产品策划、资源配置这类工作：事情有具体对象，判断有成本约束，交付有结果，也有边界。\n第五，筛选环境时，不只看收入高不高、平台大不大，也看它会不会长期要求我关闭感受，或者要求我无限承担。前者让我枯萎，后者把我掏空。\n## 我对一只猫的选择，暴露了我的底层操作系统",

    if (pb !== -1) return 1;
    return b[1] - a[1];
  });
}
rebuildGraph();

let toastTimer = null;
function showToast(msg, duration = 2400){
  const el = $('appToast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  if (duration > 0) toastTimer = setTimeout(() => el.classList.remove('on'), duration);
}

function hasNativeBridge(){
  return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.palace);
}
function nativeCall(payload){
  if (hasNativeBridge()) {
    window.webkit.messageHandlers.palace.postMessage(payload);
    return true;
  }
  return false;
}
function persistItems(toastMsg, runSync = false){
  rebuildGraph();
  try { localStorage.setItem('MIND_PALACE_DEMO_ITEMS_V2', JSON.stringify(ITEMS)); } catch(e) {}
  if (nativeCall({ action:'save', items:ITEMS, run_sync:runSync })) {
    showToast(toastMsg || '✓ 已保存并同步写入本地文件');
  } else {
    showToast((toastMsg || '✓ 已保存') + '（已缓存；在 思维宫殿.app 中打开可直写磁盘）');
  }
}
window.onPalaceNativeResult = function(res){
  if (res && res.ok) showToast(res.msg || '✓ 已写回本地 思维宫殿.html');
  else if (res && res.error) showToast('⚠ 保存提示：' + res.error, 4000);
};
window.onPalaceSyncDone = function(res){
  if (res && res.ok) {
    try { localStorage.removeItem('MIND_PALACE_DEMO_ITEMS_V2'); } catch(e) {}
    showToast('✓ 情报台与思维宫殿已同步完成，正在刷新视图…', 1500);
    setTimeout(() => window.location.reload(), 600);
  } else {
    showToast('⚠ 同步出错：' + (res && res.error ? res.error : '未知错误'), 4000);
  }
};

const matchFilter = i => {
  if (state.tagFilter && !(i.tags || []).includes(state.tagFilter)) return false;
  if (state.quickSearch) {
    const q = state.quickSearch.trim().toLowerCase();
    if (q && ![i.title, i.line, i.body, (i.tags || []).join(' '), i.step || ''].join(' ').toLowerCase().includes(q)) return false;
  }
  return true;
};
const itemsIn = id => ITEMS.filter(i => i.room === id && matchFilter(i));
const copyText = (text, btn) => {
  const done = () => { if(btn){ const old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = old, 1800); } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  else fallback(text, done);
};

const srcBadge = i => !i.path ? '约定 / 待补'
  : SOURCE_KIND[i.path] === '线上' ? '线上链接 ↗'
  : SOURCE_KIND[i.path] === 'h5' ? '交互 H5 ↗'
  : '有源文件 ↗';

const cardHtml = (i, hl) => {
  const rel = REL[i.id] || [];
  const todo = (i.next && i.next.length)
    ? `<span class="todo">${i.next.slice(0,2).map(n => `<span>☐ ${esc(n)}</span>`).join('')}${i.next.length > 2 ? `<span>… 共 ${i.next.length} 项</span>` : ''}</span>` : '';
  const tagRow = (i.tags && i.tags.length)
    ? `<span class="card-tags">${i.tags.map(t => `<span class="card-tag ${state.tagFilter === t ? 'on' : ''}" data-card-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</span>` : '';
  return `
    <button class="obj ${i.kind} ${(hl || (state.hlCat && i.cat === state.hlCat)) ? 'highlight' : ''}" data-item="${i.id}" data-rel="${rel.join(' ')}">
      <span class="kind">${KIND_LABEL[i.kind] || '物件'}${i.step ? `<span class="pipe-badge">${esc(i.step)}</span>` : ''}</span>
      <h4>${esc(i.title)}</h4>
      <p>${esc(i.line)}</p>
      ${todo}
      ${tagRow}
      <span class="foot"><span>${esc(i.updated)}</span><span>${rel.length ? `↔ ${rel.length} · ` : ''}${srcBadge(i)}${ZIPS[i.id] ? ' · zip' : ''}</span></span>
    </button>`;
};

const groupBlock = (c, g, note) => {
  const head = `<div class="cat-head"><h3 class="serif">${c.label}</h3><span>${g.length} 件${note || ''}</span>${c.hint ? `<em>${esc(c.hint)}</em>` : ''}</div>`;
  if (c.layout === 'pipeline') {
    const main = g.filter(i => i.ord).sort((a, b) => a.ord - b.ord);
    const side = g.filter(i => !i.ord);
    return head
      + (main.length ? `<div class="track">${main.map((i, k) => (k ? '<span class="arrow">→</span>' : '') + cardHtml(i)).join('')}</div>` : '')
      + (side.length ? `<div class="track-side"><span class="side-label">支线 / 专项</span><div class="shelf">${side.map(i => cardHtml(i)).join('')}</div></div>` : '');
  }
  return head + `<div class="shelf">${g.map(i => cardHtml(i)).join('')}</div>`;
};

const staleOf = i => {
  const d = (i.updated.match(/20\d\d-\d\d-\d\d/) || [])[0];
  return !!(d && i.path && SOURCE_MTIME[i.path] && SOURCE_MTIME[i.path] > d);
};

function renderFloorplan(){
  const nextN = ITEMS.filter(i => (i.next || []).length && !i.excluded).length;
  const cur = state.view === 'foyer' ? 'foyer' : (state.focusNext ? 'next' : state.room);
  const btn = (id, label) => `<button data-fp="${id}" class="${cur === id ? 'on' : ''}">${label}</button>`;
  $('floorplan').innerHTML = btn('foyer', '⌂ 门厅')
    + ROOMS.filter(r => r.id !== 'foyer').map(r => btn(r.id, `${r.symbol} ${r.name}`)).join('')
    + btn('next', `→ 待办 ${nextN}`);
}

function renderClearBtn(){
  const hasFilter = !!(state.tagFilter || state.quickSearch.trim());
  return hasFilter ? `<button class="filter-clear" id="clearFilterBtn">清除筛选${state.tagFilter ? `（#${esc(state.tagFilter)}）` : ''} ×</button>` : '';
}

function renderFilterBar(scopeRoom){
  const pool = scopeRoom ? ITEMS.filter(i => i.room === scopeRoom && !i.excluded) : ITEMS.filter(i => !i.excluded);
  const tagCounts = {};
  pool.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
  const tagsList = ALL_TAGS.filter(([t]) => tagCounts[t]).map(([t]) => [t, tagCounts[t]]);
  const visibleTags = state.showAllTags ? tagsList : tagsList.slice(0, 16);
  return `<div class="filter-wrap" id="filterWrap">
    <div class="filter-top">
      <input id="quickSearchInput" autocomplete="off" value="${esc(state.quickSearch)}" placeholder="输入关键词或标签联想筛选（如：写作画像 / 交付流水线 / 客户判断 / 口径）…">
      <span id="clearBtnSlot">${renderClearBtn()}</span>
      <div class="suggest-pop" id="suggestPop"></div>
    </div>
    <div class="tag-bar">
      <span class="tag-bar-label">标签直接选：</span>
      <button class="tag-pill ${!state.tagFilter ? 'on' : ''}" data-pick-tag="">全部<em>${pool.length}</em></button>
      ${visibleTags.map(([t, cnt]) => `<button class="tag-pill ${state.tagFilter === t ? 'on' : ''}" data-pick-tag="${esc(t)}">#${esc(t)}<em>${cnt}</em></button>`).join('')}
      ${tagsList.length > 16 ? `<button class="tag-more-btn" id="toggleMoreTagsBtn">${state.showAllTags ? '收起标签 ▴' : `展开全部 ${tagsList.length} 个标签 ▾`}</button>` : ''}
    </div>
  </div>`;
}

function updateSuggestPop(container, scopeRoom){
  const pop = container.querySelector('#suggestPop');
  const inp = container.querySelector('#quickSearchInput');
  if (!pop || !inp) return;
  const q = inp.value.trim().toLowerCase();
  const pool = scopeRoom ? ITEMS.filter(i => i.room === scopeRoom && !i.excluded) : ITEMS.filter(i => !i.excluded);
  const tagCounts = {};
  pool.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
  const matchTags = ALL_TAGS.filter(([t]) => tagCounts[t] && (!q || t.toLowerCase().includes(q))).slice(0, 18);
  const matchItems = q ? pool.filter(i => [i.title, i.line, (i.tags || []).join(' ')].join(' ').toLowerCase().includes(q)).slice(0, 6) : [];
  if (!matchTags.length && !matchItems.length) { pop.classList.remove('on'); return; }
  pop.innerHTML = `
    <div class="suggest-sec"><span>${q ? `匹配「${esc(inp.value.trim())}」的标签（点击直接筛选）` : '常用标签联想（点击直接筛选）'}</span><span>ESC 关闭</span></div>
    <div class="suggest-tags">${matchTags.map(([t]) => `<button class="tag-pill ${state.tagFilter === t ? 'on' : ''}" data-pick-tag="${esc(t)}">#${esc(t)}<em>${tagCounts[t]}</em></button>`).join('') || '<span style="font-size:12px;color:var(--muted)">无匹配标签</span>'}</div>
    ${matchItems.length ? `<div class="suggest-sec" style="margin-top:8px"><span>匹配的卡片（点击直接打开）</span></div><div class="suggest-items">${matchItems.map(i => `<button class="suggest-item" data-suggest-item="${i.id}"><span>${esc(i.title)}</span><small>${roomName(i.room)}</small></button>`).join('')}</div>` : ''}
  `;
  pop.classList.add('on');
  pop.querySelectorAll('[data-pick-tag]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const t = b.dataset.pickTag;
    state.tagFilter = state.tagFilter === t ? '' : t;
    pop.classList.remove('on');
    state.view === 'room' ? renderRoom() : renderFoyer();
  }));
  pop.querySelectorAll('[data-suggest-item]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.remove('on');
    openDetail(b.dataset.suggestItem);
  }));
}

function bindDynamicCards(rootEl, rerenderFn){
  if (!rootEl) return;
  rootEl.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => { state.focusNext = false; state.hlCat = ''; showRoom(b.dataset.room); }));
  rootEl.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const s = STEPS.find(x => x.no === b.dataset.step);
    state.focusNext = !!s.focus;
    state.hlCat = s.hlCat || '';
    showRoom(s.room);
  }));
  rootEl.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', () => openDetail(b.dataset.item)));
  rootEl.querySelectorAll('[data-card-tag]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const t = b.dataset.cardTag;
    state.tagFilter = state.tagFilter === t ? '' : t;
    rerenderFn();
  }));
}

function bindClearBtn(container, rerenderFn){
  const clr = container.querySelector('#clearFilterBtn');
  if (clr) clr.addEventListener('click', () => { state.tagFilter = ''; state.quickSearch = ''; rerenderFn(); });
}

function bindFilterBar(container, rerenderFn, dynamicUpdateFn, scopeRoom){
  const inp = container.querySelector('#quickSearchInput');
  if (inp) {
    let composing = false;
    inp.addEventListener('focus', () => updateSuggestPop(container, scopeRoom));
    inp.addEventListener('compositionstart', () => { composing = true; });
    inp.addEventListener('compositionend', e => {
      composing = false;
      state.quickSearch = e.target.value;
      dynamicUpdateFn();
      updateSuggestPop(container, scopeRoom);
    });
    inp.addEventListener('input', e => {
      if (composing || e.isComposing) return;
      state.quickSearch = e.target.value;
      dynamicUpdateFn();
      updateSuggestPop(container, scopeRoom);
    });
  }
  bindClearBtn(container, rerenderFn);
  const moreBtn = container.querySelector('#toggleMoreTagsBtn');
  if (moreBtn) moreBtn.addEventListener('click', () => { state.showAllTags = !state.showAllTags; rerenderFn(); });
  container.querySelectorAll('.tag-bar [data-pick-tag]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.pickTag;
    state.tagFilter = (t && state.tagFilter !== t) ? t : '';
    rerenderFn();
  }));
}

function buildFoyerDynamicHtml(){
  const returnMode = state.mode === 'return';
  const hasActiveFilter = !!(state.tagFilter || state.quickSearch.trim());
  const doors = ROOMS.filter(r => r.id !== 'foyer').map(r => `
    <button class="door" data-room="${r.id}">
      <span class="symbol serif">${r.symbol}</span>
      <h4>${r.name}</h4>
      <p>${esc(r.desc)}</p>
      <span class="count">${r.no} · ${ITEMS.filter(i => i.room === r.id).length} 件东西 · ${(groupsOf(r.id) || []).length} 组</span>
      <span class="enter">推门进去 →</span>
    </button>`).join('');
  const panoShelf = r => {
    const items = itemsIn(r.id);
    if (!items.length) return '';
    const cats = groupsOf(r.id);
    if (!cats) return `<div class="shelf">${items.map(i => cardHtml(i)).join('')}</div>`;
    return cats.map(c => { const g = items.filter(i => (i.cat || '') === c.id); return g.length ? groupBlock(c, g) : ''; }).join('');
  };
  const pano = ROOMS.filter(r => r.id !== 'foyer').map(r => {
    const items = itemsIn(r.id);
    if (!items.length) return '';
    return `
    <section class="pano" id="pano-${r.id}">
      <div class="pano-head">
        <span class="pano-no serif">${r.no}</span>
        <div><h3 class="serif">${r.name}</h3><p>${esc(r.desc)}</p></div>
        <span class="pano-count">${r.no} · ${items.length} 件</span>
      </div>
      ${panoShelf(r)}
    </section>`;
  }).join('');
  const kept = ITEMS.filter(i => !i.excluded).length;
  const matchedTotal = ITEMS.filter(i => !i.excluded && matchFilter(i)).length;
  const scraps = ITEMS.length - kept;
  return `
    ${(returnMode && !hasActiveFilter) ? `<div class="foyer" style="padding-top:0"><div class="steps" style="margin-top:10px">
      ${STEPS.map(s => `<button class="step" data-step="${s.no}">
        <span class="no serif">${s.no}</span><strong>${s.label}</strong><small>${s.sub}</small>
      </button>`).join('')}
    </div></div>` : ''}
    ${(returnMode && !hasActiveFilter)
      ? `<div class="floor-head"><h3 class="serif">一层平面</h3><span>点击下方四扇门进入房间，或直接点上方标签筛选卡片</span></div>
         <div class="floor">${doors}</div>`
      : `<div class="pano-top"><h3 class="serif">${hasActiveFilter ? `筛选结果（共 ${matchedTotal} 张匹配卡片）` : '卡片全景'}</h3><span>${hasActiveFilter ? '点击卡片打开概括与直达链接 · 点「清除筛选」回到门厅' : `${ROOMS.length - 1} 个分区 · ${kept} 件 · 悬停看关联，点卡片展开`}</span></div>
         ${pano || '<p class="empty-note">当前筛选条件下没有匹配卡片。</p>'}
         ${!hasActiveFilter ? `<p class="pano-foot">另有 ${scraps} 条一次性碎片不进上下文，只在「门边的卡片目录」里备查。</p>` : ''}`}`;
}

function updateFoyerDynamic(){
  const fv = $('foyerView');
  const dyn = fv.querySelector('#foyerDynamic');
  const slot = fv.querySelector('#clearBtnSlot');
  if (slot) { slot.innerHTML = renderClearBtn(); bindClearBtn(fv, renderFoyer); }
  if (dyn) { dyn.innerHTML = buildFoyerDynamicHtml(); bindDynamicCards(dyn, renderFoyer); }
}

function renderFoyer(){

      <div class="updater-body">

          <li><strong>里程碑闭环（大件定稿当场问）</strong>：单次大任务收尾时（如客户月度复盘定稿、新造好一个 Skill/H5 工具、核心口径核定），在回复末尾顺带问一句「是否收拢进宫殿？」。</li>

  $('foyerView').innerHTML = `

      <h2 class="serif">先回忆，再继续。</h2>
      <p class="intro">四间房：<b>01 工作</b>（客户判断 / 口径标准 / 固定机制）、<b>02 写作</b>（写作画像 / 选题与代表作 / 视觉排版）、<b>03 工具</b>（Agent 诊断技能 / 情报检索 / 10 步全周期交付流水线 / 独立工具）、<b>04 我自己</b>（个人风格 / 事业思考 / 经历与自留地）。点开任一卡片：只看 <b>500 字以内核心概括</b> 与 <b>直达跳转链接 / 本地路径</b>。</p>

  const fv = $('foyerView');
  bindFilterBar(fv, renderFoyer, updateFoyerDynamic, null);

}

function buildRoomDynamicHtml(){
  const list = state.focusNext ? ITEMS.filter(i => (i.next || []).length && !i.excluded && matchFilter(i)) : itemsIn(state.room);
  const cats = groupsOf(state.room);
  const grouped = (!state.focusNext && cats)
    ? cats.map(c => {
        const g = list.filter(i => (i.cat || '') === c.id);
        return g.length ? groupBlock(c, g, state.hlCat === c.id ? ' · 当前动线重点' : '') : '';
      }).join('')
    : `<div class="shelf">${list.map(i => cardHtml(i, state.focusNext)).join('') || '<p class="empty-note">当前筛选条件下没有匹配卡片。</p>'}</div>`;
  return grouped || '<p class="empty-note">当前筛选条件下没有匹配卡片。</p>';
}

function updateRoomDynamic(){
  const rv = $('roomView');
  const dyn = rv.querySelector('#roomDynamic');
  const slot = rv.querySelector('#clearBtnSlot');
  if (slot) { slot.innerHTML = renderClearBtn(); bindClearBtn(rv, renderRoom); }
  if (dyn) { dyn.innerHTML = buildRoomDynamicHtml(); bindDynamicCards(dyn, renderRoom); }
}

function renderRoom(){
  const r = state.focusNext
    ? { no:'动线 03', symbol:'→', name:'接下来做什么（跨房间收拢）', desc:'只列还没闭环的下一步，跨房间收拢，不用重翻历史。' }
    : (ROOMS.find(x => x.id === state.room) || ROOMS[0]);
  const list = state.focusNext ? ITEMS.filter(i => (i.next || []).length && !i.excluded && matchFilter(i)) : itemsIn(r.id);
  $('roomView').innerHTML = `
    <div class="crumb">你从 <button id="backFoyer">门厅</button> 来 · ${state.focusNext ? '三步动线的第 03 步' : '第 ' + r.no + ' 间'}</div>
    <div class="room-head">
      <span class="no serif">${state.focusNext ? r.no : '房间 ' + r.no} / ${r.symbol}</span>
      <h2 class="serif">${r.name}</h2>
      <p>${esc(r.desc)}</p>
      ${state.focusNext ? `<p style="margin-top:14px;color:var(--accent)">全部 ${list.length} 项未闭环的下一步从各房间收拢到这里。</p>` : ''}
      ${renderFilterBar(state.focusNext ? null : state.room)}
    </div>
    <div id="roomDynamic">${buildRoomDynamicHtml()}</div>`;
  const rv = $('roomView');
  bindFilterBar(rv, renderRoom, updateRoomDynamic, state.focusNext ? null : state.room);
  $('backFoyer').addEventListener('click', () => { state.focusNext = false; state.hlCat = ''; showView('foyer'); });
  bindDynamicCards(rv.querySelector('#roomDynamic'), renderRoom);
  renderFloorplan();
}

function showView(v){
  state.view = v;
  $('foyerView').classList.toggle('on', v === 'foyer');
  $('roomView').classList.toggle('on', v === 'room');
  if(v === 'foyer') renderFoyer();
  renderFloorplan();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function showRoom(id){
  state.room = id;
  renderRoom();
  showView('room');

/* 轻量 Markdown 排版：标题 / 列表 / 表格 / 引用 / 代码 / 粗体 */
function mdInline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
function mdRender(src){
  const L = String(src).replace(/\r/g, '').split('\n');
  const out = []; let list = false, code = false, tbl = [];
  const endList = () => { if (list) { out.push('</ul>'); list = false; } };
  const endTbl = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|?[\s:|-]+\|?$/.test(r));
    out.push('<table>' + rows.map((r, k) => '<tr>' + r.replace(/^\||\|$/g, '').split('|').map(c => k === 0 ? `<th>${mdInline(c.trim())}</th>` : `<td>${mdInline(c.trim())}</td>`).join('') + '</tr>').join('') + '</table>');
    tbl = [];
  };
  for (const ln of L) {
    if (/^\s*```/.test(ln)) { endList(); endTbl(); out.push(code ? '</pre>' : '<pre>'); code = !code; continue; }
    if (code) { out.push(esc(ln) + '\n'); continue; }
    if (/^\s*\|/.test(ln)) { endList(); tbl.push(ln.trim()); continue; }
    endTbl();
    if (!ln.trim()) { endList(); continue; }
    let m;
    if ((m = ln.match(/^(#{1,6})\s+(.*)/))) { endList(); out.push(m[1].length === 1 ? `<h3>${mdInline(m[2])}</h3>` : m[1].length === 2 ? `<h4>${mdInline(m[2])}</h4>` : `<p class="md-h">${mdInline(m[2])}</p>`); continue; }
    if ((m = ln.match(/^\s*(?:[-*+]|\d+[.)、])\s+(.*)/))) { if (!list) { out.push('<ul>'); list = true; } out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    if (/^\s*>/.test(ln)) { endList(); out.push(`<blockquote>${mdInline(ln.replace(/^\s*>\s?/, ''))}</blockquote>`); continue; }
    if (/^\s*-{3,}\s*$/.test(ln)) { endList(); out.push('<hr>'); continue; }
    endList(); out.push(`<p>${mdInline(ln)}</p>`);
  }
  endList(); endTbl(); if (code) out.push('</pre>');
  return out.join('');
}

/* 格式化 500 字以内的核心概括：如果含 ① ② ③ 则自动分条展示 */
function formatSummaryBody(bodyText){
  if (!bodyText) return '';
  if (/[①②③④⑤]/.test(bodyText)) {
    const parts = bodyText.split(/(?=[①②③④⑤⑥⑦⑧])/).map(s => s.trim()).filter(Boolean);
    if (parts.length > 1) {
      const intro = !/^[①②③④⑤⑥⑦⑧]/.test(parts[0]) ? `<p class="summary-p" style="margin-bottom:8px">${esc(parts.shift())}</p>` : '';
      return intro + `<ul class="summary-points">${parts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
    }
  }
  return `<p class="summary-p">${esc(bodyText)}</p>`;
}

/* App 内置预览器：不跳出外部浏览器，直接在 App 内部预览所有 H5 与文档 */
let currentPreviewUrl = '', currentPreviewPath = '';
function openInAppPreview(url, title, rawPath){
  if (!url) return;
  if (url.startsWith('http://') || url.startsWith('https://')) {
    if (!nativeCall({ action:'open_url', url })) window.open(url, '_blank');
    return;
  }
  currentPreviewUrl = url;
  currentPreviewPath = rawPath || '';
  $('previewTitle').textContent = title || '文档 / H5 预览';
  $('previewSub').textContent = rawPath || url;
  const revBtn = $('previewReveal');
  if (revBtn) revBtn.style.display = (rawPath && !rawPath.startsWith('http')) ? 'inline-block' : 'none';
  $('previewFrame').src = url;
  $('previewModal').classList.add('on');
}
function closeInAppPreview(){
  const pm = $('previewModal');
  if (!pm) return;
  pm.classList.remove('on');
  $('previewFrame').src = 'about:blank';
}

    if (!i.next.length) delete i.next;
    i.updated = new Date().toISOString().slice(0, 10);
    persistItems(`✓ 已完成待办：${removed.slice(0, 18)}…`);
    state.view === 'room' ? renderRoom() : renderFoyer();

  const addTodo = () => {

  const addBtn = $('addTodoBtn');

  if (todoInp) {
    let comp = false;
    todoInp.addEventListener('compositionstart', () => { comp = true; });

  /* 内置预览、访达定位、打开源文件 */

/* 卡片新增 / 编辑抽屉 */
function openEditor(id){
  const existing = id ? ITEMS.find(x => x.id === id) : null;
  const defRoom = existing ? existing.room : (state.view === 'room' && state.room !== 'foyer' ? state.room : 'work');
  const defGroups = groupsOf(defRoom) || [{ id:'client', label:'默认分组' }];
  const defCat = existing ? existing.cat : defGroups[0].id;
  const defKind = existing ? existing.kind : 'card';

  const roomOpts = ROOMS.filter(r => r.id !== 'foyer').map(r => `<option value="${r.id}" ${r.id === defRoom ? 'selected' : ''}>${r.no} ${r.name}</option>`).join('');
  const catOpts = (rm, sel) => (groupsOf(rm) || []).map(g => `<option value="${g.id}" ${g.id === sel ? 'selected' : ''}>${g.label}</option>`).join('');
  const kindOpts = Object.entries(KIND_LABEL).map(([k, v]) => `<option value="${k}" ${k === defKind ? 'selected' : ''}>${v}</option>`).join('');

  $('detail').innerHTML = `
    <div class="detail-top-actions">
      <button class="close" id="edClose">取消 ×</button>
    </div>
    <div class="kind">${existing ? `编辑卡片 · ${existing.id}` : '新增宫殿卡片'}</div>
    <h2 class="serif" style="margin-bottom:6px">${existing ? esc(existing.title) : '新建卡片'}</h2>
    <div class="editor-form">
      <div class="ed-field">
        <label>卡片标题</label>
        <input id="edTitle" value="${esc(existing ? existing.title : '')}" placeholder="例如：零售品牌 A｜11月草莓季上新与双11复盘">
      </div>
      <div class="ed-grid2">
        <div class="ed-field">
          <label>所属房间</label>
          <select id="edRoom">${roomOpts}</select>
        </div>
        <div class="ed-field">
          <label>所属分组</label>
          <select id="edCat">${catOpts(defRoom, defCat)}</select>
        </div>
        <div class="ed-field">
          <label>器物形态</label>
          <select id="edKind">${kindOpts}</select>
        </div>
      </div>
      <div class="ed-field">
        <label><span>标签（用空格或逗号分隔）</span><span>将外显在首页与卡片上</span></label>
        <input id="edTags" value="${esc(existing && existing.tags ? existing.tags.join(' ') : '')}" placeholder="例如：客户判断 零售品牌 A 在跑">
      </div>
      <div class="ed-field">
        <label>一句话核心结论</label>
        <textarea id="edLine" rows="2" placeholder="用一句话写清最核心的判断或用途…">${esc(existing ? existing.line : '')}</textarea>
      </div>
      <div class="ed-field">
        <label><span>主要内容概括（建议 500 字以内，可用 ① ② ③ 分条）</span><span id="edWordCnt">0 / 500 字</span></label>
        <textarea id="edBody" rows="5" placeholder="① 核心要点一；② 核心要点二；③ 核心要点三…">${esc(existing && existing.body ? existing.body : '')}</textarea>
      </div>
      <div class="ed-field">
        <label>待办 / 下一步（每行一条，无待办可留空）</label>
        <textarea id="edNext" rows="3" placeholder="每行写一条未闭环的待办事项…">${esc(existing && existing.next ? existing.next.join('\n') : '')}</textarea>
      </div>
      <div class="ed-field">
        <label>本地文件唯一基准路径（或线上网址）</label>
        <input id="edPath" value="${esc(existing && existing.path ? existing.path : '')}" placeholder="~/MindPalace/vault/...">
      </div>
      <div class="ed-field">
        <label>附加线上发布链接（可选）</label>
        <input id="edOnline" value="${esc(existing && existing.online ? existing.online : '')}" placeholder="https://...">
      </div>
      <div class="ed-actions">
        <div>
          <button class="ed-save" id="edSaveBtn">保存并写回本地 ✓</button>
          <button class="ed-cancel" id="edCancelBtn" style="margin-left:8px">取消</button>
        </div>
        ${existing ? `<button class="ed-del" id="edDelBtn">删除此卡片</button>` : ''}
      </div>
    </div>`;

  const D = $('detail');
  D.classList.add('on');
  $('mask').classList.add('on');
  D.scrollTop = 0;

  const rmSel = $('edRoom'), catSel = $('edCat');
  rmSel.addEventListener('change', () => { catSel.innerHTML = catOpts(rmSel.value, ''); });

  const lnInp = $('edLine'), bdInp = $('edBody'), cntEl = $('edWordCnt');
  const updCnt = () => {
    const n = (lnInp.value || '').length + (bdInp.value || '').length;
    cntEl.textContent = `${n} / 500 字`;
    cntEl.style.color = n > 500 ? '#B91C1C' : 'var(--muted)';
  };
  lnInp.addEventListener('input', updCnt);
  bdInp.addEventListener('input', updCnt);
  updCnt();

  const cancel = () => { if (existing) openDetail(existing.id); else closeDetail(); };
  $('edClose').addEventListener('click', cancel);
  $('edCancelBtn').addEventListener('click', cancel);

  if (existing && $('edDelBtn')) {
    $('edDelBtn').addEventListener('click', () => {
      const idx = ITEMS.findIndex(x => x.id === existing.id);
      if (idx !== -1) ITEMS.splice(idx, 1);
      closeDetail();
      persistItems(`✓ 已删除卡片「${existing.title.slice(0, 14)}」`);

    if (!title || !line) { showToast('⚠ 请填写卡片标题与一句话核心结论'); return; }
    const tags = $('edTags').value.split(/[\s,，#]+/).map(s => s.trim()).filter(Boolean);
    const nextArr = $('edNext').value.split('\n').map(s => s.trim()).filter(Boolean);
    const today = new Date().toISOString().slice(0, 10);
    const pathVal = $('edPath').value.trim();
    const onlineVal = $('edOnline').value.trim();

    if (existing) {
      existing.title = title;
      existing.room = rmSel.value;
      existing.cat = catSel.value;
      existing.kind = $('edKind').value;
      existing.tags = tags;
      existing.line = line;
      existing.body = $('edBody').value.trim();
      if (nextArr.length) existing.next = nextArr; else delete existing.next;
      existing.path = pathVal;
      if (onlineVal) existing.online = onlineVal; else delete existing.online;
      existing.updated = today;
      persistItems('✓ 已保存卡片修改并写回本地', false);
      state.view === 'room' ? renderRoom() : renderFoyer();
      openDetail(existing.id);
    } else {
      const prefix = { work:'w', writing:'a', tools:'u', self:'s' }[rmSel.value] || 'c';
      let num = ITEMS.length + 10;
      while (ITEMS.some(x => x.id === prefix + num)) num++;
      const newId = prefix + num;
      const newItem = {
        id: newId,
        room: rmSel.value,
        cat: catSel.value,
        kind: $('edKind').value,
        title,
        line,
        body: $('edBody').value.trim(),
        path: pathVal,
        updated: today,
        tags,
        also: [],
        nature: '阶段判断'
      };
      if (nextArr.length) newItem.next = nextArr;
      if (onlineVal) newItem.online = onlineVal;
      ITEMS.unshift(newItem);
      persistItems('✓ 已新增卡片并写回本地', false);
      state.view === 'room' ? renderRoom() : renderFoyer();
      openDetail(newId);
    }
  });
}

  if (!nativeCall({ action:'open_external', url:currentPreviewUrl })) window.open(currentPreviewUrl, '_blank');
});

/* 点击空白处收起搜索下拉联想框 */
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#filterWrap')) {
    document.querySelectorAll('.suggest-pop.on').forEach(p => p.classList.remove('on'));
  }
});

/* 悬停共振：停在一件东西上，和它双向关联的东西一起亮 */
function clearRes(v){ v._hov = null; v.classList.remove('resonating'); v.querySelectorAll('.resonate,.rel-source').forEach(n => n.classList.remove('resonate', 'rel-source')); }
['foyerView', 'roomView'].forEach(vid => {
  const v = $(vid);
  v.addEventListener('mouseover', e => {
    const o = e.target.closest('.obj');
    if (!o || o === v._hov) return;
    clearRes(v); v._hov = o;
    const ids = (o.dataset.rel || '').split(' ').filter(Boolean);
    if (!ids.length) return;
    const hits = ids.map(x => v.querySelector(`.obj[data-item="${x}"]`)).filter(Boolean);
    if (!hits.length) return;
    o.classList.add('rel-source'); v.classList.add('resonating');
    hits.forEach(n => n.classList.add('resonate'));
  });
  v.addEventListener('mouseout', e => { const t = e.relatedTarget; if (!t || !t.closest || !t.closest('.obj')) clearRes(v); });
});

function renderCatalog(){
  const q = state.query.trim().toLowerCase();
  const rows = ITEMS.filter(i => !q || [i.title,i.line,i.body,i.path,(i.tags||[]).join(' '),roomName(i.room)].join(' ').toLowerCase().includes(q));
  $('catalogBody').innerHTML = rows.map(i => `<tr>
    <td><button class="cat-title-btn" data-cat-item="${i.id}">${esc(i.title)}</button></td><td>${esc(i.line)}</td>
    <td>${roomName(i.room)}${i.cat ? ' · ' + CAT_LABEL[i.cat] : ''}</td><td>${i.nature}${i.excluded ? ' · 不进' : ' · 进'}</td>
    <td class="path">${i.path ? `<a class="src-link" href="${esc(mirrorUrl(i.path))}" target="_blank" rel="noopener">${SOURCE_KIND[i.path] === '线上' ? '打开线上页 ↗' : SOURCE_KIND[i.path] === 'h5' ? '打开 H5 ↗' : '打开全文 ↗'}</a><div class="srcdesc">${esc(SOURCE_DESC[i.path] || '')}</div>${SOURCE_KIND[i.path] !== '线上' ? `<div class="srcdesc mono">${esc(i.path)}</div>` : ''}` : ''}</td><td>${esc(i.updated)}${i.path && SOURCE_KIND[i.path] !== '线上' ? `<div class="mtime">源 ${esc(SOURCE_MTIME[i.path] || '—')}</div>` : ''}</td>
  </tr>`).join('');
  $('catalogBody').querySelectorAll('[data-cat-item]').forEach(b => b.addEventListener('click', () => { toggleCatalog(false); openDetail(b.dataset.catItem); }));
  const kept = ITEMS.filter(i => !i.excluded).length;
  $('catalogStat').textContent = `共 ${ITEMS.length} 条，当前显示 ${rows.length} 条 · 进上下文 ${kept} 条（分布在 ${ROOMS.length - 1} 间房）· 不进上下文 ${ITEMS.length - kept} 条 · 点击左侧名称直接打开卡片`;
}
function toggleCatalog(on){
  state.catalog = on;
  $('catalog').classList.toggle('on', on);
  if(on) renderCatalog();
}
function copyMd(){
  const head = '| 名称 | 一句话 | 分区 | 性质 | 进上下文 | 这份源是什么 | 唯一基准路径 | 只读镜像 | 更新时间 |\n|---|---|---|---|---|---|---|---|---|';
  const body = ITEMS.map(i => `| ${i.title} | ${i.line.replace(/\|/g,'／')} | ${roomName(i.room)}${i.cat ? ' · ' + (CAT_LABEL[i.cat] || '') : ''} | ${i.nature} | ${i.excluded ? '不进' : '进'} | ${(SOURCE_DESC[i.path] || '—').replace(/\|/g,'／')} | ${i.path || '—'} | ${mirrorUrl(i.path) || '—'} | ${i.updated} |`).join('\n');
  const text = `# 我的思维宫殿 · 卡片目录（给 AI 读的索引层）\n\n${head}\n${body}\n`;
  const done = () => { const b = $('copyMd'); b.textContent = '已复制 ✓'; setTimeout(() => b.textContent = '复制为 Markdown', 1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('复制失败，请手动选中表格内容'); }
  document.body.removeChild(ta);
}

$('floorplan').addEventListener('click', e => {
  const b = e.target.closest('[data-fp]');
  if (!b) return;
  const id = b.dataset.fp;
  closeDetail(); state.hlCat = '';
  if (id === 'foyer') { state.focusNext = false; showView('foyer'); }
  else if (id === 'next') { state.focusNext = true; state.room = 'work'; renderRoom(); showView('room'); }
  else if (state.mode === 'wander' && state.view === 'foyer') {
    const el = document.getElementById('pano-' + id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  else { state.focusNext = false; showRoom(id); }
});
document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  state.focusNext = false; state.hlCat = '';
  showView('foyer');
}));
$('catalogOpen').addEventListener('click', () => toggleCatalog(true));
$('catalogClose').addEventListener('click', () => toggleCatalog(false));
$('catalogQuery').addEventListener('input', e => { state.query = e.target.value; renderCatalog(); });
$('copyMd').addEventListener('click', copyMd);
$('mask').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('previewModal') && $('previewModal').classList.contains('on')) closeInAppPreview();
    else if(state.item) closeDetail();
    else if(state.catalog) toggleCatalog(false);
    else if(state.view === 'room') showView('foyer');
  }
});

$('footerNote').innerHTML = '6 个空间整合成 4 间房、13 组 · 顶栏平面图随时换房 · 书 / 卡片 / 便签 / 抽屉四种物件各有形态 · 悬停看双向关联，流水线按依赖顺序横排 · 抽屉上半是你的判断，下半是机器维护的证据档案袋 · 证据层由 更新宫殿.py 重算，判断层由你裁定';
renderFoyer();
