<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="palace-build" content="2026-11-26-v3-mobile1" />
<meta name="theme-color" content="#F7F4ED" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="思维宫殿" />
<link rel="manifest" href="./manifest.json?v=20261126" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=20261126" />
<link rel="icon" type="image/svg+xml" href="./icons/favicon.svg?v=20261126" />
<title>思维宫殿 · 个人知识库</title>
<style>
  :root {
    --paper: #F7F4ED;
    --paper-deep: #EFEAE0;
    --card: #FFFDF8;
    --ink: #2B2A26;
    --ink-2: #4A4841;
    --muted: #6E6A60;
    --gold: #B98A46;
    --accent: #A6632A;
    --accent-soft: #F1E5D4;
    --line: #DED7C8;
    --line-soft: #EAE4D8;
    --glow: #FBF5EA;
    --resonance: #FBF3E2;
    --diff-old-bg: #FBF1EE;
    --diff-old-ink: #8C3B2B;
    --diff-new-bg: #EEF6F0;
    --diff-new-ink: #28593A;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
    --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    --ease-arch: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-drawer: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  button {
    font-family: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  input, textarea {
    font-family: inherit;
    color: inherit;
  }
  .serif { font-family: var(--serif); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp 0.35s var(--ease-arch) both; }

  /* ================= ANTHROPIC-STYLE EDITORIAL VIDEO COVER ================= */
  .cover-overlay {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    transition: opacity 0.42s ease, visibility 0.42s ease;
  }
  .cover-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .cover-inner {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .cover-eyebrow {
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cover-head {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .cover-title {
    font-family: var(--serif);
    font-size: clamp(32px, 4.2vw, 44px);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin: 0;
    line-height: 1.15;
  }
  .cover-sub {
    max-width: 480px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
  }

  .cover-video-card {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 54vh;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    box-shadow: 0 22px 60px rgba(43, 42, 38, 0.08);
    cursor: pointer;
    transition: transform 0.38s var(--ease-arch), border-color 0.28s ease, box-shadow 0.38s ease;
  }
  .cover-video-card:hover {
    transform: scale(1.01);
    border-color: var(--gold);
    box-shadow: 0 28px 72px rgba(185, 138, 70, 0.16);
  }
  .cover-video-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-enter-pill {
    position: absolute;
    right: 22px;
    bottom: 22px;
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(255, 253, 248, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.03em;
    box-shadow: 0 6px 20px rgba(43, 42, 38, 0.1);
    transition: all 0.25s ease;
  }
  .cover-video-card:hover .cover-enter-pill {
    background: var(--ink);
    border-color: var(--ink);
    color: #FFFDF8;
  }
  .cover-foot-tip {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12px;
    color: #938E82;
  }

  /* ================= INNER PALACE SHELL ================= */
  .palace-shell {
    transition: opacity 0.42s ease;
  }
  .palace-shell.behind-cover {
    opacity: 0;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(247, 244, 237, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner {
    max-width: 1140px;
    margin: 0 auto;
    padding: 13px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-home {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
    transition: color 0.16s;
  }
  .brand-home:hover { color: var(--accent); }
  .crumb-sep { color: var(--line); font-size: 13px; }
  .crumb-cur { font-size: 13px; color: var(--muted); font-weight: 500; }

  .top-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .top-pill {
    height: 31px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .top-pill:hover {
    border-color: var(--gold);
    color: var(--ink);
    background: var(--glow);
  }
  .top-pill.subtle {
    border-color: transparent;
    background: transparent;
    color: var(--muted);
  }
  .top-pill.subtle:hover {
    background: var(--card);
    border-color: var(--line);
    color: var(--ink);
  }
  .top-pill.active-gold {
    border-color: rgba(185, 138, 70, 0.45);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .top-pill.sync-pill {
    border-color: rgba(185, 138, 70, 0.42);
    background: var(--glow);
    color: var(--accent);
  }
  .top-pill.sync-pill:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .top-pill.sync-pill.syncing {
    opacity: 0.72;
    cursor: wait;
  }
  .sync-icon {
    display: inline-block;
    line-height: 1;
  }
  .top-pill.sync-pill.syncing .sync-icon {
    animation: palace-spin 0.9s linear infinite;
  }
  @keyframes palace-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .kbd-chip {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .todo-dot {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0 6px;
    border-radius: 999px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 28px 90px;
  }

  /* ================= LAYER 1: FOYER (01 认知 / 02 成果 + 从属规则入口) ================= */
  .foyer {
    min-height: calc(100vh - 200px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 0 40px;
  }
  .foyer-eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--gold);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .foyer-title {
    font-family: var(--serif);
    font-size: clamp(36px, 4.8vw, 52px);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin: 0 0 14px;
    line-height: 1.2;
  }
  .foyer-sub {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 44px;
    max-width: 560px;
    line-height: 1.75;
  }

  /* 2-Column Spacious Architectural Pair */
  .colonnade {
    width: 100%;
    max-width: 820px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(43, 42, 38, 0.035);
    text-align: left;
  }
  .col-bay {
    position: relative;
    padding: 34px 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
    background: var(--card);
    text-align: left;
    transition: background 0.25s ease;
  }
  .col-bay + .col-bay {
    border-left: 1px solid var(--line);
  }
  .col-bay::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .col-bay:hover { background: var(--glow); }
  .col-bay:hover::before { opacity: 1; }
  .bay-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bay-num {
    font-family: var(--serif);
    font-size: 24px;
    color: var(--gold);
    line-height: 1;
  }
  .bay-count {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--line-soft);
    background: var(--paper);
    padding: 2px 9px;
    border-radius: 999px;
  }
  .bay-name {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    color: var(--ink);
    margin: 12px 0 4px;
    letter-spacing: 0.02em;
  }
  .bay-tag {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .bay-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.75;
    margin: 0;
  }
  .bay-foot {
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: color 0.2s;
  }
  .col-bay:hover .bay-foot { color: var(--accent); }

  /* Subordinate Rules Link (demoted, quiet hairline link) */
  .subordinate-rules {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
    width: min(520px, 90vw);
    display: flex;
    justify-content: center;
  }
  .rules-link {
    font-size: 12.5px;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
  }
  .rules-link:hover {
    color: var(--accent);
    background: var(--card);
  }

  /* ================= LAYER 2: ROOM VIEW ================= */
  .room-head {
    padding-bottom: 24px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 14px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: var(--card);
    transition: all 0.18s ease;
  }
  .back-link:hover {
    color: var(--accent);
    border-color: var(--gold);
  }
  .room-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .room-title {
    font-family: var(--serif);
    font-size: clamp(28px, 3.6vw, 36px);
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .room-title span {
    color: var(--gold);
    margin-right: 10px;
  }
  .room-desc {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--muted);
    max-width: 720px;
  }

  .sub-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .sub-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sub-pill {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 12.5px;
    transition: all 0.18s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sub-pill:hover { border-color: var(--gold); color: var(--ink); }
  .sub-pill.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #FFFDF8;
  }
  .sub-pill.flagship:not(.active) {
    border-color: rgba(185, 138, 70, 0.42);
    color: var(--accent);
    background: var(--glow);
  }

  .group-section { margin-bottom: 42px; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .group-title {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    margin: 0;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-star { color: var(--gold); font-size: 14px; }
  .group-sub { font-size: 12px; color: var(--muted); }

  /* 4-Step Clean Bakery Workflow (NO scrollbar, crisp 4-column architectural row) */
  .bakery-flow {
    display: grid;
    grid-template-columns: 1fr 22px 1fr 22px 1fr 22px 1fr;
    align-items: stretch;
    gap: 0;
  }
  .flow-node {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 16px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    transition: all 0.2s ease;
  }
  .flow-node::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .flow-node:hover {
    background: var(--glow);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .flow-node:hover::before { opacity: 1; }
  .flow-ord {
    font-family: var(--serif);
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.06em;
  }
  .flow-name {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin: 4px 0 6px;
  }
  .flow-line {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
  }
  .flow-foot {
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
    font-size: 11px;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .flow-foot span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .flow-foot span:last-child {
    white-space: nowrap;
    flex-shrink: 0;
  }
  .flow-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--gold);
    opacity: 0.85;
  }

  /* Pure Ivory Paper Cards + Hover Resonance */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .paper-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px 18px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
    transition: border-color 0.22s ease, background 0.22s ease, opacity 0.22s ease, transform 0.22s ease;
  }
  .paper-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .paper-card:hover {
    background: var(--glow);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .paper-card:hover::before { opacity: 1; }
  .paper-card.resonating {
    background: var(--resonance);
    border-color: var(--gold);
    box-shadow: 0 4px 18px rgba(185, 138, 70, 0.12);
  }
  .paper-card.resonating::before { opacity: 1; }
  .paper-card.dimmed { opacity: 0.48; }

  .card-head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-title {
    font-family: var(--serif);
    font-size: 16.5px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.45;
    margin: 0;
  }
  .nature-seal {
    flex-shrink: 0;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--paper);
    white-space: nowrap;
  }
  .nature-seal.h5 {
    border-color: rgba(185, 138, 70, 0.45);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .card-line {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
    margin: 8px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
    font-size: 11.5px;
    color: var(--muted);
  }
  .card-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .card-tag-pill {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .card-tag-pill:hover {
    border-color: var(--gold);
    color: var(--accent);
    background: var(--glow);
  }
  .card-tag-pill.active {
    border-color: var(--gold);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }
  .tag-filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(185, 138, 70, 0.55);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.16s ease;
  }
  .tag-filter-chip:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #FFFDF8;
  }
  .todo-flag { color: var(--accent); font-weight: 500; white-space: nowrap; flex-shrink: 0; }

  .privacy-seal {
    margin-top: 14px;
    padding: 20px 24px;
    background: var(--card);
    border: 1px dashed var(--gold);
    border-radius: 10px;
    display: flex;

    font-size: 15px;
    font-weight: 500;
  }
  .privacy-seal p { margin: 0; font-size: 12.5px; color: var(--muted); }

  /* ================= LAYER 3: DETAIL & TODO DRAWER ================= */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(43, 42, 38, 0.24);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .mask.on { opacity: 1; pointer-events: auto; }

  .detail {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: min(580px, 94vw);
    background: var(--card);
    border-left: 1px solid var(--line);
    z-index: 70;
    transform: translateX(102%);
    transition: transform 0.32s var(--ease-drawer);
    overflow-y: auto;
    padding: 32px 32px 56px;
    box-shadow: -16px 0 48px rgba(43, 42, 38, 0.08);

  .detail-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .detail-meta {
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: var(--gold);
  }
  .detail-close {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);

  }
  .detail-close:hover { color: var(--accent); border-color: var(--accent); }
  .detail h2 {

  .detail-sec-title {
    font-size: 12px;
    font-weight: 600;

    align-items: center;
    justify-content: space-between;

  .detail-sec-title span {
    font-weight: 400;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0;
  }
  .detail-quote {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.85;
    padding: 16px 20px;
    background: var(--accent-soft);
    border-left: 2px solid var(--gold);
    border-radius: 0 8px 8px 0;
    margin: 0 0 18px;
    color: var(--ink);
  }
  .detail-points {
    margin: 0 0 18px;
    padding-left: 18px;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink-2);
  }
  .detail-points li { margin-bottom: 6px; }

  .diff-card {
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    margin: 18px 0;
    background: var(--paper);
  }
  .diff-card-head {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .diff-col-old {
    padding: 12px 14px;
    background: var(--diff-old-bg);
    border-right: 1px solid var(--line-soft);
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--diff-old-ink);
  }
  .diff-col-new {
    padding: 12px 14px;
    background: var(--diff-new-bg);
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--diff-new-ink);
  }
  .diff-tag {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
    opacity: 0.85;
  }
  .diff-col-old p {
    margin: 0;
    text-decoration: line-through;
    text-decoration-color: rgba(140, 59, 43, 0.45);
  }
  .diff-col-new p { margin: 0; }

  .todo-box {
    margin: 20px 0 0;
    padding: 14px 16px;
    border-radius: 8px;
    background: var(--glow);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
  }
  .todo-box-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .todo-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 7px;
    margin-bottom: 7px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .todo-row.completing { opacity: 0; transform: translateX(8px); }
  .todo-row.completing .todo-txt {
    text-decoration: line-through;
    color: var(--muted);
  }
  .todo-chk {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--gold);
    background: var(--card);
    color: transparent;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.15s;
  }
  .todo-chk:hover { background: var(--accent-soft); color: var(--accent); }
  .todo-row.completing .todo-chk {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFDF8;
  }
  .todo-txt { font-size: 13px; line-height: 1.5; color: var(--ink); }
  .todo-src-btn {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--accent);
    display: inline-block;
  }
  .todo-src-btn:hover { text-decoration: underline; }
  .todo-add-bar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .todo-add-bar input {
    flex: 1;
    height: 33px;
    padding: 0 11px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 12.5px;
    outline: none;
  }
  .todo-add-bar input:focus { border-color: var(--gold); }
  .todo-add-bar button {
    height: 33px;
    padding: 0 12px;
    border-radius: 7px;
    background: var(--ink);
    color: #FFFDF8;
    font-size: 12px;
  }

  .detail-divider { height: 1px; background: var(--line-soft); margin: 24px 0; }
  .archive-box {
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 15px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .archive-path {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-2);
    background: var(--card);
    border: 1px solid var(--line-soft);
    padding: 9px 12px;
    border-radius: 7px;
    word-break: break-all;
  }
  .archive-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-paper {
    height: 32px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.16s;
  }
  .btn-paper:hover { border-color: var(--gold); color: var(--accent); }
  .btn-paper.gold {
    background: var(--accent-soft);
    border-color: rgba(185, 138, 70, 0.5);
    color: var(--accent);
    font-weight: 500;
  }
  .btn-paper.gold:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #FFFDF8;
  }

  .rel-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rel-chip {
    text-align: left;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-size: 12.5px;
    color: var(--ink);
    transition: all 0.16s;
  }
  .rel-chip:hover {
    border-color: var(--gold);
    background: var(--glow);
    color: var(--accent);
  }
  .rel-chip small {
    display: block;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 2px;
  }

  /* Inline Card Editor Form */
  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .edit-field label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .edit-input, .edit-textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.65;
    outline: none;
    transition: border-color 0.16s, background 0.16s;
  }
  .edit-input:focus, .edit-textarea:focus {
    border-color: var(--gold);
    background: var(--card);
  }
  .edit-textarea {
    min-height: 82px;
    resize: vertical;
  }
  .edit-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line-soft);
  }
  .btn-save {
    height: 34px;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #FFFDF8;
    font-size: 12.5px;
    font-weight: 500;
    transition: opacity 0.16s;
  }
  .btn-save:hover { opacity: 0.88; }

  /* Card Drawer Bottom Move & Delete Controls */
  .drawer-card-manage {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 12px;
  }
  .drawer-manage-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-move {
    height: 34px;
    padding: 0 15px;
    border-radius: 999px;
    border: 1px solid rgba(43, 122, 84, 0.38);
    background: rgba(43, 122, 84, 0.08);
    color: #2B7A54;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.16s;
  }
  .btn-move:hover, .btn-move.active {
    background: #2B7A54;
    border-color: #2B7A54;
    color: #FFFDF8;
  }
  .btn-danger {
    height: 34px;
    padding: 0 15px;
    border-radius: 999px;
    border: 1px solid rgba(184, 59, 50, 0.36);
    background: rgba(184, 59, 50, 0.07);
    color: #B83B32;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.16s;
  }
  .btn-danger:hover, .btn-danger.solid {
    background: #B83B32;
    border-color: #B83B32;
    color: #FFFDF8;
  }
  .btn-danger.solid:hover { opacity: 0.9; }
  .move-picker[hidden], .delete-confirm[hidden] { display: none; }
  .move-picker {
    background: var(--paper);
    border: 1px solid rgba(43, 122, 84, 0.28);
    border-radius: 9px;
    padding: 13px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .move-picker-title {
    font-size: 12px;
    font-weight: 600;
    color: #2B7A54;
  }
  .move-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .move-group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .move-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .move-opt {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    font-size: 12px;
    transition: all 0.15s;
  }
  .move-opt:hover {
    border-color: #2B7A54;
    color: #2B7A54;
    background: rgba(43, 122, 84, 0.07);
  }
  .move-opt.current {
    border-color: rgba(43, 122, 84, 0.5);
    background: rgba(43, 122, 84, 0.12);
    color: #2B7A54;
    font-weight: 600;
  }
  .delete-confirm {
    background: rgba(184, 59, 50, 0.06);
    border: 1px solid rgba(184, 59, 50, 0.3);
    border-radius: 9px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: #8F2B24;
  }
  .delete-confirm-btns {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
  }

  /* ================= WARM PAPER ⌘K COMMAND PALETTE ================= */
  .cmd-mask {
    position: fixed;
    inset: 0;
    background: rgba(43, 42, 38, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 90;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 13vh 16px 24px;
  }
  .cmd-mask.open { display: flex; }
  .cmd-box {
    width: min(600px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(43, 42, 38, 0.16);
    overflow: hidden;
  }
  .cmd-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper);
  }
  .cmd-head input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14.5px;
  }
  .cmd-results { max-height: 380px; overflow-y: auto; padding: 8px; }
  .cmd-row {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    transition: background 0.12s;
  }
  .cmd-row:hover, .cmd-row.selected { background: var(--glow); }
  .cmd-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cmd-row-title {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cmd-row-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  /* ================= IN-APP FULLSCREEN H5 PREVIEW MODAL ================= */
  .preview-modal {
    position: fixed;
    inset: 0;
    z-index: 95;
    background: rgba(43, 42, 38, 0.48);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .preview-modal.open { display: flex; }
  .preview-shell {
    width: 100%;
    height: 100%;
    max-width: 1320px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 28px 72px rgba(43, 42, 38, 0.24);
  }
  .preview-bar {
    padding: 11px 18px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .preview-frame { flex: 1; width: 100%; border: none; background: #FFFFFF; }

  .toast {
    position: fixed;
    right: 26px;
    bottom: 26px;
    z-index: 100;
    background: var(--ink);
    color: #FFFDF8;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(185, 138, 70, 0.45);
    font-size: 12.5px;
    box-shadow: 0 12px 32px rgba(43, 42, 38, 0.2);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: all 0.22s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ================= MOBILE TABBAR & MORE SHEET (HIDDEN ON DESKTOP) ================= */
  .mobile-only-pill { display: none; }
  .mobile-tabbar { display: none; }
  .mobile-more-mask {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 88;
    background: rgba(43, 42, 38, 0.34);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    align-items: flex-end;
    justify-content: center;
  }
  .mobile-more-mask.open { display: flex; }
  .mobile-more-sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 36px rgba(43, 42, 38, 0.14);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mobile-more-handle {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
    margin: 0 auto 6px;
  }
  .mobile-more-item {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--line-soft);
    background: var(--paper);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
  }
  .mobile-more-item:active { background: var(--accent-soft); border-color: var(--gold); }
  .mobile-more-item .more-sub { font-size: 12px; color: var(--muted); font-weight: 400; }
  .mobile-more-cancel {
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }

  @media (max-width: 920px) {
    .bakery-flow { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .flow-arrow { display: none; }
  }
  @media (max-width: 780px) {
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea { font-size: 16px; }

    /* Compact Single-Row iOS Topbar with Notch/Dynamic Island Safe Area */
    .topbar {
      padding-top: env(safe-area-inset-top);
      background: rgba(247, 244, 237, 0.94);
    }
    .topbar-inner {
      padding: 10px 14px;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .brand-left {
      min-width: 0;
      gap: 7px;
      flex: 1;
    }
    .brand-home {
      font-size: 16.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .crumb-cur {
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-pills {
      gap: 6px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .desktop-only-pill { display: none !important; }
    .mobile-only-pill { display: inline-flex; }
    .top-pill {
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }
    .top-pill .kbd-chip { display: none; }
    #openCmdBtn span:not(.kbd-chip) { display: none; }
    #openCmdBtn { width: 32px; padding: 0; justify-content: center; }
    #mobileMoreBtn { width: 32px; padding: 0; justify-content: center; font-size: 15px; letter-spacing: 1px; }

    /* Content Shell + Bottom Tabbar Clearance */
    .wrap {
      padding: 18px 16px calc(92px + env(safe-area-inset-bottom));
    }

    /* Cover Overlay on Mobile Portrait */
    .cover-overlay {
      padding: calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
    }
    .cover-head { gap: 10px; margin-bottom: 16px; }
    .cover-title { font-size: 30px; }
    .cover-sub { font-size: 13.5px; }
    .cover-video-card { border-radius: 14px; }
    .cover-enter-pill { right: 12px; bottom: 12px; padding: 7px 14px; font-size: 12.5px; }
    .cover-foot-tip { flex-direction: column; align-items: flex-start; gap: 4px; font-size: 11.5px; }

    /* Foyer Compact Single-Screen Hierarchy */
    .foyer {
      min-height: auto;
      padding: 8px 0 12px;
      justify-content: flex-start;
    }
    .foyer-eyebrow { margin-bottom: 8px; font-size: 10px; }
    .foyer-title { font-size: 30px; margin-bottom: 8px; }
    .foyer-sub { font-size: 13.5px; margin-bottom: 22px; }
    .colonnade, .card-grid, .diff-grid, .bakery-flow { grid-template-columns: 1fr; }
    .col-bay { padding: 22px 20px 18px; gap: 14px; }
    .col-bay + .col-bay { border-left: 0; border-top: 1px solid var(--line); }
    .bay-name { font-size: 22px; margin: 8px 0 4px; }
    .bay-desc { font-size: 13px; }
    .subordinate-rules { margin-top: 18px; padding-top: 14px; width: 100%; }

    /* Room View & Horizontal Sub-Pills Strip */
    .room-head { padding-bottom: 16px; margin-bottom: 16px; }
    .back-link { margin-bottom: 10px; }

/* Local Demo Persistence (restores card edits & todo updates cleanly) */
const STORAGE_KEY = 'mind_palace_v3_main_edits';
function saveEditsToStorage() {
  try {
    const cardPatches = {};
    CARDS.forEach(c => {
      cardPatches[c.id] = {
        room: c.room,
        sub: c.sub,
        deleted: Boolean(c.deleted),
        demoTitle: c.demoTitle,
        stdTitle: c.stdTitle,
        demoLine: c.demoLine,
        stdLine: c.stdLine,
        bullets: c.bullets,
        tags: c.tags,
        demoPath: c.demoPath,
        stdPath: c.stdPath
      };
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cardPatches, todos: appTodos }));
  } catch (e) {}
}

function loadEditsFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.cardPatches) {
      CARDS.forEach(c => {
        const p = saved.cardPatches[c.id];
        if (!p) return;
        if (p.room && ROOMS[p.room]) c.room = p.room;
        if (p.sub) c.sub = p.sub;
        if (p.deleted) c.deleted = true;
        if (p.demoTitle) c.demoTitle = p.demoTitle;
        if (p.stdTitle) c.stdTitle = p.stdTitle;
        if (p.demoLine) c.demoLine = p.demoLine;
        if (p.stdLine) c.stdLine = p.stdLine;
        if (Array.isArray(p.bullets)) c.bullets = p.bullets;
        if (Array.isArray(p.tags)) c.tags = p.tags;
        if (p.demoPath) c.demoPath = p.demoPath;
        if (p.stdPath) c.stdPath = p.stdPath;
      });
    }
    if (saved && Array.isArray(saved.todos)) {
      appTodos.length = 0;
      saved.todos.forEach(t => appTodos.push(t));
    }
  } catch (e) {}
}
loadEditsFromStorage();

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function getTitle(c) { return state.demoMode ? c.demoTitle : (c.stdTitle || c.demoTitle); }
function getLine(c) { return state.demoMode ? c.demoLine : (c.stdLine || c.demoLine); }
function getPath(item) { return state.demoMode ? item.demoPath : (item.stdPath || item.demoPath); }
function visibleCardsInRoom(roomNo) {
  return CARDS.filter(c => !c.deleted && c.room === roomNo && (!state.demoMode || !c.sensitive));
}
function openTodos() {
  const vis = new Set(CARDS.filter(c => !c.deleted && (!state.demoMode || !c.sensitive)).map(c => c.id));
  return appTodos.filter(t => !t.done && (vis.has(t.cardId) || t.cardId === 'custom'));
}
function updateTodoBadge() {
  const n = openTodos().length;
  const el = $('topTodoCount');
  if (el) el.textContent = String(n);
  const mel = $('mobileTodoCount');
  if (mel) {
    mel.textContent = String(n);
    mel.classList.toggle('zero', n === 0);
  }
}
function updateMobileTabActive() {
  const bar = $('mobileTabbar');
  if (!bar) return;
  let activeKey = 'foyer';
  if (state.drawerMode === 'todos') activeKey = 'todos';
  else if (state.view === 'room' && (state.room === '01' || state.room === '02')) activeKey = state.room;
  else if (state.view === 'room') activeKey = '';
  bar.querySelectorAll('.m-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mtab === activeKey);
  });
}

let toastTimer = null;
function showToast(msg, durationMs) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), durationMs || 2500);
}

function copyText(txt, okMsg) {
  const done = () => showToast(okMsg || '已复制到剪贴板');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, cb) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  if (cb) cb();
}

function buildAiContextText(subset, label) {
  const lines = [
    `# 思维宫殿 · ${label || '全局索引'}`,
    `> 视角：${state.demoMode ? '演示脱敏模式' : '工作区全量'} ｜ 更新：2026-11-22`,
    ''
  ];
  subset.forEach(c => {
    const rm = ROOMS[c.room];
    lines.push(`## [${rm.no} ${rm.name} · ${c.seal}] ${getTitle(c)}`);
    lines.push(`- **核心判断**：${getLine(c)}`);
    (c.bullets || []).forEach(b => lines.push(`- ${b}`));
    lines.push(`- **源路径**：\`${getPath(c)}\``);
    lines.push('');
  });
  return lines.join('\n');
}

      <div class="move-picker" id="moveCardPicker" hidden>
        <div class="move-picker-title">选择要移动到的上级类目</div>
        ${renderMovePickerGroups(c)}
      </div>
      <div class="delete-confirm" id="deleteCardConfirm" hidden>
        <span>确认删除「${esc(getTitle(c))}」？</span>
        <div class="delete-confirm-btns">
          <button type="button" class="btn-paper" id="cancelDeleteCardBtn">取消</button>
          <button type="button" class="btn-danger solid" id="confirmDeleteCardBtn">确认删除</button>
        </div>
      </div>
    </div>
  `;

  showDrawer();

  const moveBtn = $('moveCardBtn');
  const delBtn = $('deleteCardBtn');
  const movePicker = $('moveCardPicker');
  const delConfirm = $('deleteCardConfirm');

  if (moveBtn && movePicker) {
    moveBtn.addEventListener('click', () => {
      const opening = movePicker.hidden;
      movePicker.hidden = !opening;
      if (delConfirm) delConfirm.hidden = true;
      moveBtn.classList.toggle('active', opening);
      if (opening) movePicker.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  $('detailDrawer').querySelectorAll('[data-move-room][data-move-sub]').forEach(opt => {
    opt.addEventListener('click', () => {
      const targetRoom = opt.dataset.moveRoom;
      const targetSub = opt.dataset.moveSub;
      if (c.room === targetRoom && c.sub === targetSub) {
        showToast('当前已在该类目下');
        if (movePicker) movePicker.hidden = true;
        if (moveBtn) moveBtn.classList.remove('active');
        return;
      }
      c.room = targetRoom;
      c.sub = targetSub;
      saveEditsToStorage();
      renderMain();
      openCardDrawer(c.id);
      const rm = ROOMS[targetRoom];
      const subTarget = rm.subs.find(s => s.id === targetSub);
      const rmName = rm.no === '附录' ? rm.name : `${rm.no} ${rm.name}`;
      showToast(`已移动至「${rmName} · ${subTarget ? subTarget.label : targetSub}」`);
    });
  });

  if (delBtn && delConfirm) {
    delBtn.addEventListener('click', () => {
      const opening = delConfirm.hidden;
      delConfirm.hidden = !opening;
      if (movePicker) movePicker.hidden = true;
      if (moveBtn) moveBtn.classList.remove('active');
      if (opening) delConfirm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  const cancelDelBtn = $('cancelDeleteCardBtn');
  if (cancelDelBtn && delConfirm) {
    cancelDelBtn.addEventListener('click', () => {
      delConfirm.hidden = true;
    });
  }

  const confirmDelBtn = $('confirmDeleteCardBtn');
  if (confirmDelBtn) {
    confirmDelBtn.addEventListener('click', () => {
      c.deleted = true;
      saveEditsToStorage();
      updateTodoBadge();
      closeDrawer();
      renderMain();
      showToast(`已删除卡片「${getTitle(c)}」`);
    });
  }
}

function openCardEditor(cardId) {
  const c = CARDS.find(x => x.id === cardId);
  if (!c) return;
  state.drawerMode = 'edit';
  state.drawerId = cardId;

  const r = ROOMS[c.room];
  const subObj = r.subs.find(s => s.id === c.sub);
  const openCardTodos = appTodos.filter(t => t.cardId === c.id && !t.done);

  $('detailDrawer').innerHTML = `
    <div class="detail-top">
      <span class="detail-meta">${r.no} ${r.name}${subObj ? ' · ' + subObj.label : ''} · 编辑卡片</span>
      <button class="detail-close" id="closeDrawerBtn">关闭 ×</button>
    </div>

    <h2 style="margin-bottom:6px;">编辑：${esc(getTitle(c))}</h2>
    <p style="margin:0 0 16px;font-size:12.5px;color:var(--muted);">修改会自动保存在本地浏览器（localStorage），刷新页面不丢失。</p>

    <div class="edit-form">
      <div class="edit-field">
        <label for="editTitle">卡片标题</label>
        <input class="edit-input" id="editTitle" type="text" value="${esc(getTitle(c))}" />
      </div>
      <div class="edit-field">
        <label for="editTags">标签（空格或逗号分隔）</label>
        <input class="edit-input" id="editTags" type="text" value="${esc((c.tags || []).join(' '))}" placeholder="例如：AI 工具 规则" />
      </div>
      <div class="edit-field">
        <label for="editLine">核心判断（一句话概括）</label>
        <textarea class="edit-textarea" id="editLine" rows="2">${esc(getLine(c))}</textarea>
      </div>
      <div class="edit-field">
        <label for="editBullets">要点拆解（每行一条）</label>
        <textarea class="edit-textarea" id="editBullets" rows="3">${esc((c.bullets || []).join('\n'))}</textarea>
      </div>
      <div class="edit-field">
        <label for="editTodos">未完成待办（每行一条）</label>
        <textarea class="edit-textarea" id="editTodos" rows="2">${esc(openCardTodos.map(t => t.text).join('\n'))}</textarea>
      </div>
      <div class="edit-field">
        <label for="editPath">${state.demoMode ? '演示安全路径' : '本地真源路径'}</label>
        <input class="edit-input" id="editPath" type="text" value="${esc(getPath(c))}" />
      </div>
      <div class="edit-actions">
        <button type="button" class="btn-paper" id="cancelCardEditBtn">取消</button>
        <button type="button" class="btn-save" id="saveCardEditBtn">保存修改</button>
      </div>
    </div>
  `;

  showDrawer();

  $('cancelCardEditBtn').addEventListener('click', () => openCardDrawer(cardId));
  $('saveCardEditBtn').addEventListener('click', () => {
    const nextTitle = $('editTitle').value.trim();
    const nextLine = $('editLine').value.trim();
    const nextPath = $('editPath').value.trim();

    if (nextTitle) {
      if (state.demoMode) c.demoTitle = nextTitle;
      else c.stdTitle = nextTitle;
    }
    if (nextLine) {
      if (state.demoMode) c.demoLine = nextLine;
      else c.stdLine = nextLine;
    }
    if (nextPath) {
      if (state.demoMode) c.demoPath = nextPath;
      else c.stdPath = nextPath;
    }

    const parsedTags = $('editTags').value
      .split(/[,，\s]+/)
      .map(s => s.replace(/^#+/, '').trim())
      .filter(Boolean);
    c.tags = [...new Set(parsedTags)];

    c.bullets = $('editBullets').value
      .split('\n')
      .map(s => s.replace(/^\s*[-•*]\s*/, '').trim())
      .filter(Boolean);

    const todoLines = $('editTodos').value
      .split('\n')
      .map(s => s.trim())
      .filter(Boolean);
    const existingOpen = appTodos.filter(t => t.cardId === cardId && !t.done);
    const usedIds = new Set();
    const syncedOpen = todoLines.map((txt, idx) => {
      const matched = existingOpen.find(t => t.text === txt && !usedIds.has(t.id));
      if (matched) {
        usedIds.add(matched.id);
        return matched;
      }
      return { id: 'td-' + Date.now() + '-' + idx, cardId, text: txt, done: false };
    });
    const otherAndDone = appTodos.filter(t => !(t.cardId === cardId && !t.done));
    appTodos.length = 0;
    syncedOpen.forEach(t => appTodos.push(t));
    otherAndDone.forEach(t => appTodos.push(t));

    saveEditsToStorage();
    updateTodoBadge();
    renderMain();
    openCardDrawer(cardId);
    showToast('已保存卡片更新');
  });
}

function showDrawer() {
  $('drawerMask').classList.add('on');
  $('detailDrawer').classList.add('on');
  $('detailDrawer').setAttribute('aria-hidden', 'false');

  $('closeDrawerBtn').addEventListener('click', closeDrawer);
  const eCard = $('editCardBtn');
  if (eCard) eCard.addEventListener('click', () => openCardEditor(state.drawerId));

  const D = $('detailDrawer');
  D.querySelectorAll('[data-done-todo]').forEach(btn => {
    btn.addEventListener('click', () => completeTodo(btn.dataset.doneTodo));
  });
  D.querySelectorAll('[data-launch-h5]').forEach(btn => {
    btn.addEventListener('click', () => openH5Preview(btn.dataset.launchH5, btn.dataset.h5Title));
  });
  D.querySelectorAll('[data-open-rel]').forEach(btn => {
    btn.addEventListener('click', () => openCardDrawer(btn.dataset.openRel));
  });

  const cPath = $('drawerCopyPathBtn');
  if (cPath) cPath.addEventListener('click', () => {
    const item = state.drawerMode === 'card'
      ? CARDS.find(x => x.id === state.drawerId)
      : BAKERY_STEPS.find(x => x.id === state.drawerId);
    if (item) copyText(getPath(item), '已复制源路径');
  });

  const cAi = $('drawerCopyAiBtn');
  if (cAi) cAi.addEventListener('click', () => {
    const c = CARDS.find(x => x.id === state.drawerId);
    if (c) copyText(buildAiContextText([c], getTitle(c)), '已复制本卡 AI 上下文');
  });

  const cStepAi = $('drawerCopyStepAiBtn');
  if (cStepAi) cStepAi.addEventListener('click', () => {
    const s = BAKERY_STEPS.find(x => x.id === state.drawerId);
    if (s) copyText(`# 烘焙流程 [${s.ord}] ${s.name}\n- Skill：${s.skill}\n- 核心说明：${s.line}\n- 源路径：${getPath(s)}`, '已复制环节规范给 AI');
  });

  bindDrawerTodoInput('drawerTodoInput', 'drawerTodoAddBtn', () => state.drawerId);
  bindDrawerTodoInput('globalTodoInput', 'globalTodoAddBtn', () => 'custom');
}

function bindDrawerTodoInput(inpId, btnId, getCardIdFn) {
  const inp = $(inpId);
  const btn = $(btnId);
  if (!inp || !btn) return;
  const submit = () => {
    const val = inp.value.trim();
    if (!val) return;
    appTodos.unshift({ id: 'td-' + Date.now(), cardId: getCardIdFn(), text: val, done: false });
    saveEditsToStorage();
    showToast('已新增待办并保存');
    updateTodoBadge();
    renderMain();
    if (state.drawerMode === 'todos') openTodoDrawer();
    else if (state.drawerMode === 'card') openCardDrawer(state.drawerId);
  };
  btn.addEventListener('click', submit);
  inp.addEventListener('compositionstart', () => { state.todoComposing = true; });
  inp.addEventListener('compositionend', () => { state.todoComposing = false; });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !state.todoComposing && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
}

function completeTodo(todoId) {
  const todo = appTodos.find(t => t.id === todoId);
  if (!todo || todo.done) return;
  const row = document.querySelector(`[data-todo-row="${todoId}"]`);
  if (row) row.classList.add('completing');
  setTimeout(() => {
    todo.done = true;
    saveEditsToStorage();
    showToast('已完成待办并保存');
    updateTodoBadge();
    renderMain();
    if (state.drawerMode === 'todos') openTodoDrawer();
    else if (state.drawerMode === 'card') openCardDrawer(state.drawerId);
  }, 200);
}

function closeDrawer() {
  $('drawerMask').classList.remove('on');
  $('detailDrawer').classList.remove('on');
  $('detailDrawer').setAttribute('aria-hidden', 'true');
  state.drawerMode = null;
  state.drawerId = null;
  updateMobileTabActive();
}

/* ---------- H5 Full-Screen Preview ---------- */
function resolveLiveUrl(url) {
  if (!state.h5CacheBust || !url) return url;
  const sep = url.includes('?') ? '&' : '?';
  return `${url}${sep}v=${state.h5CacheBust}`;
}
function openH5Preview(url, title) {
  const liveUrl = resolveLiveUrl(url);
  $('previewTitle').textContent = title || 'AI 项目预览';
  $('previewSub').textContent = url;
  $('previewExtLink').href = liveUrl;
  $('previewFrame').src = liveUrl;
  $('previewModal').classList.add('open');
}
function closeH5Preview() {
  $('previewModal').classList.remove('open');
  $('previewFrame').src = 'about:blank';
}

/* ---------- ⌘K Warm Command Palette ---------- */
function getCmdResults(q) {
  const query = (q || '').trim().toLowerCase();
  const visible = CARDS.filter(c => !c.deleted && (!state.demoMode || !c.sensitive));
  const quick = [
    { kind: '门厅', title: '回到门厅（开场视频）', sub: 'Anthropic 风格序言', run: () => replayCover() },
    { kind: 'AI 项目', title: '运行行业垂类情报台', sub: '近 60 天自动刷新', run: () => { if (state.coverOpen) enterFromCover('02', 'ai-projects'); else openRoom('02', 'ai-projects'); openH5Preview('sources/h5/情报平台/index.html', '行业垂类情报台'); } },
    { kind: 'AI 项目', title: '运行九格经营规划器', sub: '互动推演 + Excel 导出', run: () => { if (state.coverOpen) enterFromCover('02', 'ai-projects'); else openRoom('02', 'ai-projects'); openH5Preview('sources/h5/jiuge-business-planner/index.html', '九格经营规划器'); } },
    { kind: '附录', title: '打开底层规则（口径 / 机制 / 红线）', sub: '从属参考附录', run: () => { if (state.coverOpen) enterFromCover('rules', 'all'); else openRoom('rules', 'all'); } },
    { kind: '导出', title: '复制全库摘要给新 AI 对话', sub: 'Markdown 复制', run: () => copyText(buildAiContextText(visible, '全库索引'), '已复制全库摘要，可直接粘贴给新 AI 对话') }
  ];
  const cardItems = visible.map(c => ({
    kind: `${ROOMS[c.room].name}`,
    title: getTitle(c),
    sub: c.seal,
    qText: `${getTitle(c)} ${getLine(c)} ${c.seal} ${(c.tags || []).join(' ')} ${ROOMS[c.room].name}`.toLowerCase(),
    run: () => {
      if (state.coverOpen) enterFromCover(c.room, c.sub);
      else openRoom(c.room, c.sub);
      openCardDrawer(c.id);
    }
  }));
  const stepItems = BAKERY_STEPS.map(s => ({
    kind: `烘焙 ${s.ord}`,
    title: s.name,
    sub: s.skill,
    qText: `${s.ord} ${s.name} ${s.skill} ${s.line}`.toLowerCase(),
    run: () => {
      if (state.coverOpen) enterFromCover('02', 'bakery');
      else openRoom('02', 'bakery');
      openStepDrawer(s.id);
    }
  }));
  if (!query) return [...quick, ...cardItems.slice(0, 5)];
  return [
    ...quick.filter(x => (x.title + x.sub).toLowerCase().includes(query)),
    ...cardItems.filter(x => x.qText.includes(query)),
    ...stepItems.filter(x => x.qText.includes(query))
  ].slice(0, 12);
}

function renderCmdResults() {
  const res = getCmdResults(state.cmdQuery);
  if (state.cmdIndex >= res.length) state.cmdIndex = Math.max(0, res.length - 1);
  if (!res.length) {
    $('cmdResults').innerHTML = `<div style="padding:22px;text-align:center;color:var(--muted);font-size:13px">未找到匹配结果，试试输入「情报」「九格」「海报」或「口径」</div>`;
    return;
  }
  $('cmdResults').innerHTML = res.map((r, i) => `
    <button class="cmd-row ${i === state.cmdIndex ? 'selected' : ''}" data-cmd-idx="${i}">
      <span class="cmd-row-left">
        <span class="nature-seal">${esc(r.kind)}</span>
        <span class="cmd-row-title">${esc(r.title)}</span>
      </span>
      <span class="cmd-row-sub">${esc(r.sub)}</span>
    </button>
  `).join('');
  $('cmdResults').querySelectorAll('[data-cmd-idx]').forEach(b => {
    b.addEventListener('click', () => {
      const target = res[parseInt(b.dataset.cmdIdx, 10)];
      if (target) { closeCmd(); target.run(); }
    });
  });
}

function openCmd() {
  state.cmdOpen = true;
  state.cmdQuery = '';
  state.cmdIndex = 0;
  $('cmdMask').classList.add('open');
  $('cmdInput').value = '';
  renderCmdResults();
  setTimeout(() => $('cmdInput').focus(), 20);
}
function closeCmd() {
  state.cmdOpen = false;
  $('cmdMask').classList.remove('open');
}

function toggleDemoMode() {
  state.demoMode = !state.demoMode;
  const btn = $('demoToggleBtn');
  btn.classList.toggle('active-gold', state.demoMode);
  $('demoToggleText').textContent = state.demoMode ? '演示脱敏 · 开' : '演示脱敏 · 关';
  const mdt = $('mobileDemoText');
  if (mdt) mdt.textContent = state.demoMode ? '开' : '关';
  showToast(state.demoMode ? '已开启演示脱敏模式' : '已切换为完整工作区示例视图');
  updateTodoBadge();
  renderMain();
  if (state.drawerMode === 'card') {
    const c = CARDS.find(x => x.id === state.drawerId);

    else openCardDrawer(c.id);
  } else if (state.drawerMode === 'todos') {
    openTodoDrawer();
  }
}

/* ---------- Bind Main Events ---------- */
function bindMainEvents() {
  const m = $('appMain');

  m.querySelectorAll('[data-enter-room]').forEach(b => {
    b.addEventListener('click', () => openRoom(b.dataset.enterRoom, 'all'));
  });

  const rulesFoot = $('openRulesFooterBtn');
  if (rulesFoot) rulesFoot.addEventListener('click', () => openRoom('rules', 'all'));

  const back = $('backFoyerBtn');
  if (back) back.addEventListener('click', goFoyer);

  m.querySelectorAll('[data-sub-filter]').forEach(b => {
    b.addEventListener('click', () => {
      state.subFilter = b.dataset.subFilter;
      renderMain();
    });
  });

  const copyRoom = $('copyRoomAiBtn');
  if (copyRoom) copyRoom.addEventListener('click', () => {
    const cards = visibleCardsInRoom(state.room);
    copyText(buildAiContextText(cards, ROOMS[state.room].name), `已复制「${ROOMS[state.room].name}」上下文给 AI`);
  });

  const unlockBtn = $('unlockFromRoomBtn');
  if (unlockBtn) unlockBtn.addEventListener('click', toggleDemoMode);

  m.querySelectorAll('[data-open-step]').forEach(b => {
    b.addEventListener('click', () => openStepDrawer(b.dataset.openStep));
  });

  m.querySelectorAll('[data-filter-tag]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const tag = b.dataset.filterTag;
      state.tagFilter = state.tagFilter === tag ? '' : tag;
      renderMain();
    });
  });

  const clearTagBtn = $('clearTagFilterBtn');
  if (clearTagBtn) {
    clearTagBtn.addEventListener('click', () => {
      state.tagFilter = '';
      renderMain();
    });
  }

  const clearEmptyTagBtn = $('clearEmptyTagBtn');
  if (clearEmptyTagBtn) {
    clearEmptyTagBtn.addEventListener('click', () => {
      state.tagFilter = '';
      renderMain();
    });
  }

  const allCards = [...m.querySelectorAll('.paper-card')];
  allCards.forEach(cardEl => {
    const id = cardEl.dataset.cardId;
    cardEl.addEventListener('click', () => openCardDrawer(id));
    cardEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCardDrawer(id); }
    });
    cardEl.addEventListener('mouseenter', () => {
      const relSet = new Set((cardEl.dataset.rel || '').split(',').filter(Boolean));
      if (!relSet.size) return;
      allCards.forEach(other => {
        const oid = other.dataset.cardId;
        if (oid === id) return;
        if (relSet.has(oid)) other.classList.add('resonating');
        else other.classList.add('dimmed');
      });
    });
    cardEl.addEventListener('mouseleave', () => {
      allCards.forEach(other => other.classList.remove('resonating', 'dimmed'));
    });
  });
}

async function syncOnlinePalace() {
  const btn = $('syncAppBtn');
  if (!btn || btn.disabled) return;

  // Desktop macOS WebKit native bridge
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.palace) {
    try {
      btn.disabled = true;
      btn.classList.add('syncing');
      window.webkit.messageHandlers.palace.postMessage({ action: 'sync' });
      showToast('↻ 正在刷新近 60 天情报并同步本地思维宫殿…', 15000);
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('syncing');
      }, 1500);
      return;
    } catch (e) {
      btn.disabled = false;
      btn.classList.remove('syncing');
    }
  }

  const txtEl = btn.querySelector('.sync-txt');
  btn.disabled = true;
  btn.classList.add('syncing');
  if (txtEl) txtEl.textContent = '同步中…';

  const ts = Date.now();
  const localBuildMeta = document.querySelector('meta[name="palace-build"]')?.getAttribute('content') || '';

  const fetchWithTimeout = (url, ms) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { cache: 'no-store', signal: ctrl.signal }).finally(() => clearTimeout(timer));
  };

  try {
    const intelPath = encodeURI('./sources/h5/情报平台/index.html') + '?t=' + ts;
    const indexPath = './index.html?t=' + ts;
    const ghApi = 'https://api.github.com/repos/Octivian/mirror/commits/main';

    const [intelRes, indexRes, ghRes] = await Promise.allSettled([
      fetchWithTimeout(intelPath, 6000),
      fetchWithTimeout(indexPath, 6000),
      fetchWithTimeout(ghApi, 4000),
    ]);

    let intelOk = false;
    let intelWindow = '';
    if (intelRes.status === 'fulfilled' && intelRes.value.ok) {
      intelOk = true;
      const intelHtml = await intelRes.value.text();
      const mWin = intelHtml.match(/"window_range"\s*:\s*"([^"]+)"/);
      const mUpd = intelHtml.match(/"feed_updated"\s*:\s*"([^"]+)"/);
      if (mWin) intelWindow = mWin[1];
      else if (mUpd) intelWindow = mUpd[1].slice(0, 10);
    }

    let indexOk = false;
    let hasRemoteUpdate = false;
    if (indexRes.status === 'fulfilled' && indexRes.value.ok) {
      const etag = indexRes.value.headers.get('etag') || indexRes.value.headers.get('last-modified') || '';
      const remoteHtml = await indexRes.value.text();
      const mBuild = remoteHtml.match(/<meta\s+name=["']palace-build["']\s+content=["']([^"']+)["']/i);
      if (mBuild) {
        indexOk = true;
        const remoteBuild = mBuild[1];
        const remoteSig = `${remoteBuild}|${etag}|${remoteHtml.length}`;
        if (localBuildMeta && remoteBuild !== localBuildMeta) {
          hasRemoteUpdate = true;
        } else if (state.lastSiteSig && remoteSig !== state.lastSiteSig) {
          hasRemoteUpdate = true;
        }
        state.lastSiteSig = remoteSig;
      }
    }

    let ghDate = '';
    if (ghRes.status === 'fulfilled' && ghRes.value.ok) {
      try {
        const ghJson = await ghRes.value.json();
        const iso = ghJson?.commit?.committer?.date || ghJson?.commit?.author?.date || '';
        if (iso) ghDate = iso.slice(0, 10);
      } catch (e) {}
    }

    if (!intelOk && !indexOk) {
      showToast('当前处于离线或本地预览模式，已保留本地缓存数据', 3200);
      return;
    }

    state.h5CacheBust = ts;
    const nowTime = new Date().toTimeString().slice(0, 5);
    btn.title = `上次联网同步：${nowTime}${intelWindow ? '｜情报窗 ' + intelWindow : ''}`;

    if (hasRemoteUpdate) {
      showToast('↻ 检测到云端主站有新版本，正在拉取最新页面…', 2500);
      setTimeout(() => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('v', String(Date.now()));
        window.location.replace(nextUrl.toString());
      }, 650);
      return;
    }

    const parts = ['✓ 已联网同步'];
    if (intelWindow) parts.push(`情报窗 ${intelWindow}`);
    parts.push(ghDate ? `云端最近更新 ${ghDate}` : '云端已是最新');
    showToast(parts.join(' · '), 3800);
  } catch (err) {
    showToast('当前处于离线或本地预览模式，已保留本地缓存数据', 3200);
  } finally {
    btn.disabled = false;
    btn.classList.remove('syncing');
    if (txtEl) txtEl.textContent = '刷新同步';
  }
}

const cmdInp = $('cmdInput');
cmdInp.addEventListener('compositionstart', () => { state.cmdComposing = true; });
cmdInp.addEventListener('compositionend', () => {
  state.cmdComposing = false;
  state.cmdQuery = cmdInp.value;
  state.cmdIndex = 0;
  renderCmdResults();
});
cmdInp.addEventListener('input', () => {
  if (state.cmdComposing) return;
  state.cmdQuery = cmdInp.value;
  state.cmdIndex = 0;
  renderCmdResults();
});
cmdInp.addEventListener('keydown', e => {
  const res = getCmdResults(state.cmdQuery);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (res.length) state.cmdIndex = (state.cmdIndex + 1) % res.length;
    renderCmdResults();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (res.length) state.cmdIndex = (state.cmdIndex - 1 + res.length) % res.length;
    renderCmdResults();
  } else if (e.key === 'Enter' && !state.cmdComposing && !e.isComposing) {
    e.preventDefault();
    const target = res[state.cmdIndex];
    if (target) { closeCmd(); target.run(); }
  }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (state.cmdOpen) closeCmd();
    else openCmd();
  } else if (e.key === 'Escape') {
    if ($('previewModal').classList.contains('open')) closeH5Preview();
    else if (state.cmdOpen) closeCmd();
    else if (state.drawerMode) closeDrawer();
  }
});

  $('mobileTabbar').querySelectorAll('.m-tab').forEach(btn => {

      }

  });
}
