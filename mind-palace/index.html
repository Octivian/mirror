\n\n### Image Anchor\n\n- tiny faded photo\n- torn-paper clipping\n- flat silhouette\n- solid color block\n- old printed illustration\n- object specimen\n- translucent geometric overlay\n- abstract texture window\n\n### Typography Mode\n\n- fragmented floating letters\n- short phrase pressed against image edge\n- archive microtext with date/weather\n- diagonal scattered words\n- low-contrast gray ghost text\n- headline-as-object with rough letterpress\n- text inside a color block or cutout\n- almost textless, only a tiny caption\n\n### Texture Mode\n\n- xerox softness\n- risograph grain\n- letterpress ink bleed\n- halftone degradation\n- film grain photo\n- scan noise and paper fibers\n- aged paper mottling\n- soft motion blur on selected text\n\n### Mood Mode\n\n- quiet\n- summer\n- solitude\n- childhood\n- seaside\n- afternoon\n- night\n- memory\n- slight surrealism\n\n## Workflow\n\n1. Determine mode.\n   - Use Standard Mode.\n\n2. Parse the user's content.\n   - Identify the core subject, mood, exact text if supplied, possible visual metaphor, and any reference image role.\n   - For an article or complex idea, extract one central imageable idea rather than summarizing the whole argument.\n   - If no image text is supplied, invent one short poetic English or Chinese phrase.\n\n3. Select a variation recipe.\n   - In Standard Mode, pick layout, image anchor, typography, texture, and mood from the Variation Engine, then choose color through the Standard Color Engine. Do not select `near-monochrome` unless the user explicitly asks for it.\n   - Do not default to \"tiny photo + blue dots + microtext\" unless it truly fits.\n   - If the recipe becomes too dense, simplify typography or color treatment first.\n\n4. Write the final image prompt.\n   - In Standard Mode, use the Standard Mode Prompt Compiler to compile the user's content into the four-paragraph prompt shape: canvas, anchor, typography/accent/print, flat-scan mood and avoid-list.\n   - Specify exact in-image text only when useful. Keep it short because image models distort long text.\n   - Make the prompt decisive: say where the anchor sits, how large it is, how text behaves, what accent appears, and how the print/scan texture looks.\n\n5. Generate the image.\n   - Use the built-in image generation capability by default.\n   - Do not stop after prompt-only unless the user explicitly asks for prompt-only.\n   - If the result obviously violates the selected mode or recipe, tighten the prompt and regenerate once.\n   - In Standard Mode, inspect the result at thumbnail scale. If the high-chroma anchor is absent, washed out, or reduced to an imperceptible mark, regenerate once with stronger color wording and a larger colored area.\n\n6. Return the image and prompt.\n\n## Negative Constraints\n\nAlways avoid:\n\n- full-bleed subject or scene\n- commercial poster headline hierarchy\n- product ad layout, logo lockup, CTA, or brand campaign feeling\n- clean digital UI background\n- glossy paper mockup or heavy paper shadow\n- 3D rendering, cinematic lighting, hard shadows, depth of field, neon, cyberpunk\n- cute cartoon, kawaii illustration, anime poster, fashion editorial drama\n- too many objects, stickers, colors, captions, or decorative textures\n- high-resolution stock-photo realism\n- long, clean, perfectly readable text blocks\n\n## Output Format\n\n````markdown\n**生成图**\n\n![Minimal Zine Poster v0.1 style poster](absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[final prompt used for image generation]\n```\n\n**说明**\n\n- Mode: Standard\n- Recipe: [layout / anchor / typography / accent / texture / mood]\n- [one short note about the content interpretation]\n````\n\nIf generated images render directly without a file path, show the image normally and still include the final prompt.\n\n## Quality Gate\n\nBefore finalizing, check:\n\n- Did the run use the Standard Mode Prompt Compiler?\n- Did the run choose a variation recipe across layout, anchor, typography, accent, texture, and mood?\n- Is the structure materially different from recent visible outputs?\n- Does the image remain a sparse vertical paper poster?\n- Does 70%-90% of the poster read as paper?\n- Is the subject cluster roughly 8%-25% of the canvas?\n- Is there one clear visual metaphor rather than a whole illustrated scene?\n- Does the anchor have old-photo, clipping, print, scan, or paper-specimen treatment?\n- Are typography and microtext part of the composition?\n- Is there only one restrained accent strategy?\n- In Standard Mode, is the high-chroma anchor clearly visible at thumbnail size?\n- In Standard Mode, does saturated color occupy about 0.8%-2.5% of the canvas or 15%-35% of the visual cluster?\n- In Standard Mode, did the prompt avoid weakening the color anchor with `pale`, `muted`, `faded`, `pastel`, `low saturation`, or `near-monochrome` wording?\n- Did the prompt avoid full-bleed, commercial, 3D, neon, cinematic, cartoon, cute, brand, and generic template aesthetics?\n- Did you actually generate the image?\n\n## Example Requests\n\n- \"用 $advanced-poster-maker 做一张关于雨天的高级感海报\"\n- \"用 $advanced-poster-maker 标准模式，做一张关于旧书的杂志感海报\"\n- \"用这张照片做一张同风格 poster\"\n\nSource: [LiamGvchi/gc-minimal-zine-poster](https://github.com/LiamGvchi/gc-minimal-zine-poster), pinned from commit `4cb0396ad4e834019f753b37e1c4f415f5e02026` under the bundled MIT license.\n",
  "s25": "---\nname: mono-color\ndescription: Generate original one-ink or controlled two-ink editorial images from any theme, sentence, article idea, object, or reference photo. Always use this skill when the user asks for 单色海报、双色印刷、单色调视觉、蓝色/绿色孔版印刷、risograph、网点照片、复古或当代编辑排版、zine poster, monochrome editorial poster, duotone print, or asks to use the mono-color style. It uses an adaptive white, gray, or pale-beige substrate, no more than two printing inks, active negative space, terse human language, and strong serif/grotesk/mono typography without making retro styling the default or copying a source composition, wording, logo, or artwork. Produce both the final generation prompt and the generated raster image unless the user explicitly asks for prompt only.\n---\n\n# Monocolor Editorial Print\n\nTurn any user theme or image into an original printed editorial artifact with one stable visual language:\n\n> adaptive neutral substrate + one or two inks + reproduced image + typographic tension + concise human voice\n\nDo not imitate any one reference. Recombine the system below into a new composition every time.\n\n## Default Deliverable\n\nCreate:\n\n1. one final image-generation prompt;\n2. one generated raster image;\n3. a short recipe note naming palette, layout family, type pairing, and print process.\n\nSave generated files to the user-specified directory. When no directory is specified, save them in a clearly named subdirectory under the current working directory. Do not create or write to Claude-specific directories. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available.\n\n## Input Reading\n\nExtract four things before composing:\n\n- **Subject:** the one person, object, scene, or idea that must remain recognizable.\n- **Intent:** poetic observation, announcement, field note, personal statement, cultural poster, or specimen page.\n- **Words:** preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image.\n- **Image role:** hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image.\n- **Representation:** faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment.\n\nFor a complex topic, choose one concrete visual metaphor. Do not illustrate every point.\n\nWhen the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details.\n\n### Recipe Manifest\n\nBefore writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details.\n\nUse the machine-readable catalogs in `design-system/` as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins.\n\n```yaml\nsubject: <one recognizable subject>\nintent: <one intent from Input Reading>\nexact_text: <user text, generated 2-8 word phrase, or none>\ntext_language: <language of supplied text, otherwise English>\nrepresentation: <faithful reproduction or abstract symbol extraction>\nratio: <explicit ratio or 3:4>\ncarrier: <one carrier ID from design-system/carriers.json or none>\nsubstrate: <one substrate ID and exact hex from design-system/colors.json>\nmode: <pure one-ink, chromatic + black, complementary duotone, or overprint duotone>\npalette: <one palette ID from design-system/colors.json>\ninks: <the palette's named ink or approved pair with exact hex values>\nplate_roles: <one explicit role per ink plate>\nlayout: <one composition ID from design-system/compositions.json>\nempty_paper: <explicit percentage>\nvisual_tension: <relaxed, balanced, or assertive from design-system/rhythm.json>\nfocal_event: <one strong visual event from design-system/rhythm.json>\nrelease_zone: <one deliberately quiet region that gives the focal event room>\nunresolved_edge: <one optional edge behavior from design-system/rhythm.json or none>\nimage_treatment: <one mechanical reproduction process>\ntype_hierarchy: <one role ID from design-system/typography.json>\ndisruption: <one deliberate disruption>\nimperfection_seed: <stable hash derived from the resolved recipe>\nimperfections: <0-2 restrained effect IDs for contemporary work, or 2-3 for tactile/vintage work>\n```\n\nUse these defaults whenever the user has not made the choice:\n\n- ratio: `3:4`;\n- representation: `faithful reproduction`, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;\n- text language: English for all invented display text, labels, and microcopy;\n- substrate: select from Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8` according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;\n- mode and ink: controlled two-ink by default. Use Cobalt + Terracotta `#2148B8` + `#C65F38` for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;\n- empty paper: `35%`;\n- visual tension: `relaxed` for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; `balanced` for ordinary events and editorial information; `assertive` only when the user requests a forceful declaration or the phrase itself is the subject;\n- focal event: choose exactly one strong visual event and make all other devices support or release it;\n- release zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;\n- unresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;\n- image treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;\n- type hierarchy: resolve the role from `design-system/typography.json`. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;\n- disruption: one off-center image crop; use one oversized word instead when there is no image.\n- imperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries.\n\nExplicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary.\n\nResolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases.\n\n## Visual DNA\n\n### 1. Color System\n\nDefault to controlled two-ink. Give the dominant and accent plates separate content roles before composing; never use the second ink merely to decorate the page. Switch to pure one-ink when the user explicitly requests one ink, monochrome, or one named ink without a second color. The paper substrate does not count as an ink.\n\n- **Substrate:** choose Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8`. White suits crisp cultural, social, event, and colorful image-led work; cool gray suits architecture, technology, charcoal-led systems, and restrained branding; pale beige suits tactile, food, travel, intimate, archival, or explicitly nostalgic subjects.\n- **Contemporary default:** the substrate is clean and neutral, not yellowed. Halftone and plate logic describe reproduction, not an era. Do not add fading, sepia, antique props, distressed borders, or aged-paper staining unless the user asks for retro, vintage, archival aging, or historical mood.\n- **Plate limit:** use two assigned printing plates by default and never more than two ink plates; explicit one-ink requests use one plate.\n- **Ink density:** darker coverage may appear near-black and sparse halftones may appear pale. These are density changes, not extra inks.\n- **Paper exposure:** keep the paper visible. Never tint the whole page into a digital monochrome wash.\n\n#### One-Ink Palette\n\n- **Cobalt / Ultramarine:** `#2148B8`, the default for technology, knowledge, cities, music, and cultural subjects.\n- **Royal Blue:** `#2058D4`, a brighter branch for youth culture, fashion, movement, and energetic editorial pages.\n- **Botanical Green:** `#008A4B`, for botanical, ecological, archival, and explicitly green subjects.\n- **Mint Green:** `#5EB783`, for observation journals, soft natural subjects, and quiet editorial photography.\n- **Terracotta Orange:** `#C65F38`, for classical art, food, travel, summer, and tactile objects.\n- **Signal Red:** `#C83232`, for declarations, music, events, and civic or public-culture subjects.\n- **Aubergine:** `#63365F`, for literature, cinema, night, and intimate cultural subjects.\n- **Charcoal:** `#30343A`, for architecture, photography, research, and restrained publications.\n\n#### Two-Ink Recipes\n\nUse a known pair rather than improvising arbitrary colors:\n\n- **Powder Blue + Signal Red:** `#9EB8D3` + `#C83232` for guides, announcements, and information-heavy editorial pages.\n- **Cobalt + Terracotta:** `#2148B8` + `#C65F38` for travel, summer, food, and lifestyle subjects.\n- **Botanical Green + Oxblood:** `#008A4B` + `#8F3434` for plants, natural wine, bookstores, and archives.\n- **Charcoal + Signal Red:** `#30343A` + `#C83232` for architecture, exhibitions, reports, and conceptual work.\n- **Electric Blue + Carbon:** `#173AE3` + `#242321` for high-contrast cultural events and image-led editorial pages.\n- **Mint Green + Charcoal:** `#5EB783` + `#302D2E` for journals, essays, observations, and long-form reading.\n- **Ultramarine + Safety Orange:** `#263E99` + `#E55D2B` for movement, objects, youth culture, and active urban subjects.\n- **Cyan + Brick Red:** `#159DDA` + `#B64032` for repeated products, exhibitions, and playful information systems.\n- **Tangerine + Slate Blue:** `#E46C2D` + `#4773A5` for markets, festivals, illustrated notices, and large typographic compositions.\n\n#### Print Modes\n\n1. **Pure one-ink:** one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color.\n2. **Chromatic ink + black:** the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects.\n3. **Complementary duotone:** one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair.\n4. **Overprint duotone:** two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink.\n\nAssign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded.\n\n### 2. Space and Grid\n\n- Use a flat, front-facing paper canvas with no mockup, frame, desk, or cast shadow.\n- Default to a `3:4` vertical poster. Respect a user-specified ratio.\n- Keep 25%-55% of the canvas as visibly empty paper.\n- Use generous outer margins: 5%-9% of page width.\n- Align most elements to one invisible left edge or a simple 2-3 column editorial grid.\n- Create one deliberate disruption: a floating word, off-center image, oversized title, circular mark, or tiny annotation.\n- Never center every element. Never distribute objects evenly like a template.\n\nNegative space is active pacing, not leftover room.\n\n#### Visual Tension and Uneven Energy\n\nRead `design-system/rhythm.json` whenever the user asks for relaxed, loose, effortless, casual, quiet, breezy, or understated work, or when the default intent maps to `relaxed`. Treat relaxation as a compositional decision, not a soft-focus mood.\n\nRelaxation is uneven energy, not low energy. For `relaxed` work, choose exactly one strong focal event: oversized type, an extreme crop, one giant object or detail, a concentrated overprint collision, or one abnormal scale relationship. Let it feel decisive. Then release the rest of the page with open paper, pale screening, sparse support type, or one quiet alignment. Do not make every element tasteful, small, or equally calm.\n\n- Keep 25%-55% visibly empty paper, choosing the amount from the focal event rather than a fixed relaxed quota.\n- Allow display type to become large when it is the focal event; when the image or object is the focal event, type must support rather than compete.\n- Use one dominant collision or scale event. Secondary elements may be energetic only when they extend that same event rather than start a second one.\n- Avoid the safe split of headline on one side and a complete photograph on the other. The focal event must cross, crop, interrupt, or materially reorganize the page.\n- An unresolved edge is optional. Use an image fade, inferable cropped word, broken alignment, or open contour only when it strengthens the focal event; never add one as a decorative compliance mark.\n- At thumbnail size, the focal event must be immediately identifiable and the release zone must remain visibly quieter.\n\n### Reference-Derived Composition Grammar\n\nThe reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves:\n\n1. **One object dominates.** Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page.\n2. **Type collides with the object.** Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image.\n3. **Paper cuts through the image.** Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin.\n4. **One manual gesture interrupts the system.** Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration.\n\nChoose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration.\n\n### 3. Image Treatment\n\nConvert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image:\n\n- crisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;\n- visible dots at close range, recognizable subject at thumbnail scale;\n- clipped highlights where paper shows through and dense shadows where ink pools;\n- optional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;\n- medium contrast; avoid glossy photographic depth.\n\nWhen no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identifying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them.\n\n#### Abstract Looseness\n\nWhen `representation` is `abstract symbol extraction`, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the whole photograph:\n\n1. Name 2-4 **identity anchors** that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail.\n2. Convert the anchors into **one dominant mass**, **one structural contour**, and **one repeated rhythm**. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description.\n3. Let paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo.\n4. Keep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries.\n5. Stop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption.\n\nFor complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page.\n\n#### Controlled Chance\n\nKeep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from `design-system/imperfections.json` with the resolved recipe's stable seed.\n\n- Let uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation.\n- Apply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text.\n- Keep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets.\n- In one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color.\n- Do not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition.\n\nUse one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the **overprint collage** family; it must still read as two printing plates rather than scrapbook decoration.\n\n### 4. Typography\n\nTypography is a responsive cast, not a fixed house font. Read `design-system/typography.json` and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment.\n\nBuild each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy.\n\nChoose at most one typographic behavior per image:\n\n- natural lowercase sentence breaks for intimate language;\n- wide or interlocked capitals for music, movement, and contemporary culture;\n- compressed stacked lines for public events;\n- tabular numerals and unequal ruled blocks for programs or schedules;\n- one 90-degree rotation or vertical title for a bold cover;\n- one circled handwritten aside for an invitation or personal note;\n- oversized cropped letterforms when the words are the dominant object.\n\nDo not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign.\n\nRules:\n\n- Use one dramatic scale jump: largest text is 5-12 times the microcopy size.\n- Prefer lowercase for intimate statements and uppercase for public declarations.\n- Keep display copy to 2-8 words and all other copy sparse.\n- Default all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked.\n- Use exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts.\n- No gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing.\n- Oversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event.\n- In `relaxed` work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional.\n- Do not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution.\n\n### 5. Communication Tone\n\nWrite like an independent cultural poster, field journal, or community print notice:\n\n- terse, observant, romantic, and free-spirited without becoming sentimental;\n- human and specific rather than inspirational;\n- quiet confidence, dry wit, or factual clarity;\n- no sales language, CTA, hype, productivity slogans, or brand manifesto voice.\n\nFor summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default.\n\nIf text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs.\n\nFor romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness.\n\n## Composition Decision Flow\n\nChoose the layout from the content, not at random. Walk this list from top to bottom and use the first matching rule unless the user explicitly requests a layout:\n\n1. Is the content an event, method, schedule, or factual announcement?\n   - Yes: choose **ruled information poster**.\n2. Is the subject botanical, collected, or taxonomic?\n   - Yes: choose **archival plate** and consider botanical green.\n3. Is one ordinary object explicitly requested as a repeated rhythm?\n   - Yes: choose **object field**.\n4. Does the concept explicitly depend on two images, colors, or type layers physically crossing?\n   - Yes: choose **overprint collage** and use overprint duotone.\n5. Is there one supplied portrait or scene photograph?\n   - Yes, and representation is faithful reproduction: choose **image field**.\n   - Yes, and representation is abstract symbol extraction: choose **editorial cover** by default; choose **overprint collage** only when two extracted layers must physically cross.\n6. Are there 1-3 supplied isolated objects intended for labels or comparison?\n   - Yes: choose **specimen annotation**.\n7. Is the user's phrase itself the main visual subject?\n   - Yes: choose **type-led declaration**.\n8. Is the content reflective, dated, or essay-like with a primary photograph and readable text?\n   - Yes: choose **editorial journal**.\n9. Otherwise choose **editorial cover**.\n\n### Layout Families\n\n- **Image field:** large screened image crossing at least one page edge; headline overlaps or locks tightly to it; compact footer.\n- **Specimen annotation:** 1-3 isolated cutouts with numbered labels, one oversized phrase, and asymmetric empty space.\n- **Type-led declaration:** headline controls the page; a smaller screened image interrupts or grounds it.\n- **Ruled information poster:** one dominant screened object or scene is crossed by a headline; thin one-ink rules form one metadata band and the date remains subordinate.\n- **Archival plate:** title, one rectangular image plate, and a disciplined multi-column caption block.\n- **Editorial cover:** title near one edge, one dominant image zone, sparse issue-like microcopy, no fake masthead brand.\n- **Object field:** one recognizable object repeated at varied scale, crop, or angle to form a printed rhythm; keep one open zone for title and facts.\n- **Overprint collage:** two ink plates carry separate object, image, geometric, or typographic layers and cross in selected zones; use overlap deliberately, not everywhere.\n- **Editorial journal:** one primary screened photograph, a strong title or date, and 2-3 disciplined text columns with enough size and contrast for real reading.\n\n## Prompt Compiler\n\nWrite the final prompt in five compact paragraphs, in this order:\n\n1. **Canvas and ink:** ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page.\n2. **Original composition:** chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture.\n3. **Subject:** what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene.\n4. **Typography and words:** hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed.\n5. **Material and avoids:** dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude.\n\nDescribe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”\n\n## Originality Firewall\n\nThe reference is evidence for a visual grammar, never a layout to trace.\n\nBefore generation, change at least four of these from any supplied reference:\n\n- subject and crop;\n- layout family;\n- headline wording;\n- headline location;\n- image shape or count;\n- grid structure;\n- type pairing;\n- metadata treatment;\n- ratio;\n- disruption device.\n\nNever reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact.\n\n## Hard Avoids\n\nAlways exclude:\n\n- more than two printing inks, unassigned accent colors, gradients, rainbow accents, neon, or full-color photography;\n- clean vector-flat digital poster aesthetics;\n- beige lifestyle minimalism or monochrome color wash;\n- glossy mockups, 3D depth, cinematic lighting, lens blur, hard shadows;\n- centered template symmetry, card grids, UI panels, stickers, decorative blobs;\n- scrapbook collage, uncontrolled overlap, grunge overload, or torn-paper styling;\n- automatic vintage styling, yellowed paper, sepia aging, distressed borders, nostalgic props, or retro type merely because the image uses halftone or limited inks;\n- long paragraphs, marketing copy, CTA buttons, logos, URLs, QR codes;\n- exact imitation of a supplied poster or recognizable artist signature.\n\n## Generation and Inspection\n\n1. Generate the image with the compiled prompt.\n2. Inspect it at full size and thumbnail size.\n3. Regenerate once when any of these fail:\n   - a one-ink composition shows a second ink, or a two-ink composition shows a third printing ink;\n   - a two-ink composition lacks clear plate roles or uses the accent across more than 30% without a subject-driven reason;\n   - the page reads as digitally color-graded rather than physically printed;\n   - empty paper falls outside 25%-55%;\n   - the subject is unrecognizable;\n   - typography lacks a clear 5x or greater scale jump;\n   - long text is garbled or invented branding appears;\n   - the composition closely follows a supplied reference.\n   - a relaxed result has no immediately identifiable focal event or distributes equal emphasis across the whole page;\n   - a theme-only person becomes a complete stock-photo figure or the page falls into a safe headline-left/photo-right split;\n   - the release zone is filled with decorative microcopy, gestures, or secondary focal points.\n4. If exact text renders incorrectly after one retry, generate a text-light base image and state that typography should be overlaid in a layout tool. Do not pretend distorted text is correct.\n\n## Output Format\n\n````markdown\n**生成图**\n\n![Monocolor editorial print](absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[prompt used for generation]\n```\n\n**本次配方**\n\n- Mode: [pure one-ink / chromatic + black / complementary duotone / overprint duotone]\n- Ink: [exact one- or two-ink palette and hex values]\n- Layout: [layout family]\n- Type: [editorial voice + utility voice]\n- Process: [halftone/risograph/cyanotype/photocopy treatment]\n- Originality: [one sentence naming the major structural departures from references]\n````\n\n## Final Quality Gate\n\n- Is there one intentionally selected white, gray, or pale-beige substrate and no more than two printing inks?\n- Does the result read as contemporary editorial by default, with vintage or aged styling present only when requested?\n- If there are two inks, does each plate have a clear role and does the accent remain controlled?\n- Does 25%-55% of the page remain visibly empty?\n- Is the image reproduced through dots or mechanical print texture rather than a color filter?\n- Does one object occupy 45%-80% of the page, except for a justified information-heavy layout?\n- Does the headline visibly cross, cover, split around, or lock tightly to the dominant object?\n- Does exposed paper form a visible shape inside the image through highlights, gaps, fade-outs, or knockouts?\n- Is there exactly one manual gesture family rather than several decorative doodle styles?\n- Does the type hierarchy use a 5x-12x scale jump and no more than three type voices?\n- Does the page have exactly one immediately identifiable focal event?\n- Is there one visibly quieter release zone rather than evenly distributed emptiness?\n- For relaxed work, is energy concentrated in the focal event rather than reduced everywhere?\n- If no source image was supplied, does the figure feel observed in an ordinary in-between moment rather than posed as an advertisement?\n- If type is page-filling, is it the selected focal event while the remaining devices retreat?\n- Is the language terse, specific, and non-commercial?\n- Is the user's supplied subject preserved?\n- Are at least four structural features different from every supplied reference?\n- Did the run generate an image unless prompt-only was requested?\n\n## Example Triggers\n\n- “用 mono-color 做一张关于夏天散步的海报。”\n- “把这张咖啡照片变成蓝色网点编辑封面。”\n- “做一个绿色植物主题的孔版印刷 poster。”\n- “沿用之前那套单色、留白、复古印刷的视觉。”\n- “Make this portrait into a one-ink editorial zine cover.”\n- “用蓝橙双色叠印做一张城市骑行活动视觉。”\n- “把这个产品做成重复物件构图的双色孔版印刷封面。”\n- “用绿色照片和黑色正文做一页观察日志。”\n",

  "s28": "# 运营中台两年半成长脉络与历任主责项目方法论汇编（2024.06 – 2026.10）\n\n> 汇编自：`个人记录迁移` 内 7 份个人复盘（2024.08 入职满月 → 2026 年中）、《2025工作记录.pdf》、《2026年1-10月工作记录.docx》及《2026-09-18_区域品牌 D_判断句与数据锚点.md》。\n> 用途：补齐初版宫殿在「历史操盘遗产」与「两年半能力演进三阶段」上的断层。\n\n---\n\n## 一、 两年半能力演进三阶段（2024.06.24 入职至今）\n\n| 阶段 | 时间窗口 | 核心关键词 | 代表项目与角色 | 关键方法论沉淀 |\n| :--- | :--- | :--- | :--- | :--- |\n| **Stage 1｜扎根与转主责** | 2024.06.24 – 2024.12 | **建认知 → 辅执行 → 转主责** | 4 个底层拆解、甜品项目G3（七夕+周年庆翻倍）、烘焙项目G1+烘焙项目G2（宁波/无锡三店开业串联）、接手区域品牌 D | 1. **方案成功公式** = 方案能力 × 客户态度 × 落地执行<br>2. **多店开业前置检核表**：物料/动线/收银/培训必须按节点锁死，不能假设客户团队会自动对齐<br>3. 从北京回西安「落地生根」，完成从执行辅助到独立主责顾问的角色转换 |\n| **Stage 2｜深度×效度×高度** | 2025.01 – 2025.12 | **外科手术止损 × 线上起盘 × 知识输出** | 主责**区域品牌 D**、主责**长沙新锐品牌 E**、辅助泰熙家/烘焙项目G1新旧模型、内部 7 次方法分享 + 3 次外部线下课 | 1. **老化品牌三刀论**：小店结构性亏损靠点状运营救不回来，真正动账只有「砍品类、砍门店、换产品结构」<br>2. **财务底盘先行**：清洗客户损益表、建立门店 **FLR（房租+人力+食材）** 生死线看板<br>3. **线上蛋糕增量路径**：公域筛号种草 + 美团/小程序承接 + 私域沉淀 |\n| **Stage 3｜破界×内化×共建** | 2026.01 – 2026.10 | **跨行业验证 × 体系内化 × AI 工程化** | 主责**某跨界餐练项目F**、主责**零售品牌 A**、主责**连锁品牌 B**收官、推进**消费品牌 C**会员体系、共建**运营中台运营中台 & 22 个 Skill** | 1. **跨行业迁移边界**：底层诊断方法可迁移，但行业地形（如健身房预售期节奏、教练销售管理）不可跳过<br>2. **客户跃迁认知**：客户「能自主完成日常工作」≠「能主动完成 1-10 到 10-100 的阶段跃迁」<br>3. **方法工程化**：把个人脑中的诊断、排期、筛号、复盘全部写成可复用的 Skill 与 Coze 工具台 |\n\n---\n\n## 二、 历任核心操盘项目遗产（已核实数据锚点与核心判断）\n\n### 1. 区域品牌 D（台州 · 烘焙甜品老品牌收缩止损样本）\n- **进场基本面**：2024 年 1–9 月实收 742.2 万（同比 −23.56%），净利润 −28.1 万（净利率 −3.79%）；1 月报损高达 6.7 万元（占实收 12%，四店店报损率达 20%）。\n- **核心诊断（FLR 门店生死线）**：测算各店 FLR（房租+人力+食材占实收比）——**一店店 76%、二店店 90%、三店店 105%、四店店 106%**，明确给出「除一店外均无利润空间，必须关停高亏门店、砍掉高报损现烤面包线」的外科手术建议。\n- **品类押注复盘**：\n  - 客户执念押注的「现烤面包线」占比从 21% 变为 20%，2025 上半年实收同比 **−30%**、销量腰斩（**−46%**），日均实收从 6 月 2,605 元一路跌至 10 月 1,933 元，「靠面包能力长出来开新店」在数据上证伪。\n  - 反而是非主押的**大蛋糕**（2025 上半年实收 **+10%**，占比 9%→12%，10 月叠加奶皮子烤布蕾爆款）与**甜水模型**（9.9 元甜水卡复购率 **75%**，带动甜水贡献 29% 营收）跑出了真实增量。\n- **经营结果与后验**：合作期末（2024.12–2025.09）实收 676.4 万，净利润 −8.16 万，**亏损大幅收窄 75%**。合作停止半年后，客户最终按当初算出的那张表关掉了 FLR 105%/106% 的三店与四店两家店，翻新老店聚焦甜品与蛋糕。\n\n### 2. 长沙新锐品牌 E（线上蛋糕快速起盘样本）\n- **核心命题**：新锐烘焙品牌如何快速跑通线上蛋糕增量与口碑闭环。\n- **关键动作与成果**：打通「小红书/抖音内容种草 → 美团/大众点评榜单与评价体系维护 → 微信私域承接」全链路，实现线上蛋糕品类快速增长，沉淀出标准化的线上评价运营与私域社群 SOP。\n\n### 3. 某跨界餐练项目F（跨行业「餐+练」破界样本 · 2026 上半年）\n- **核心命题**：脱离熟悉的烘焙舒适区，操盘西安本土健身品牌两家门店开业与「健身餐 + 训练」融合模式验证。\n- **关键结果**：跑通两店开业全流程，验证「餐+练」连带模式（实现 **63% 消餐转化率**）。\n- **核心复盘认知**：\n  1. **方法可迁移，地形不可跳**：用户分层、漏斗拆解、活动节奏可以跨行业复用，但健身行业的特殊地形（重线下地推预售、重教练团队狼性销售管理）不能用纯线上零售思维替代。\n  2. **顾问边界**：当客户内部销售执行链条掉链子时，外部顾问需要在方案阶段就做「内部承接力压力测试」。\n\n### 4. 甜品项目G3 / 烘焙项目G1 / 烘焙项目G2（节日大促与多店连开样本 · 2024 下半年）\n- **甜品项目G3**：操盘七夕与周年庆双节点，实现活动期业绩翻倍。\n- **烘焙项目G1（杭万店）+ 烘焙项目G2（宁波/无锡店）**：高频串联三店开业方案与现场/远程督导，沉淀出《新店开业前置检核表》与「方案成功 = 能力 + 态度 + 执行」铁三角认知。\n\n---\n\n## 三、 附：区域品牌 D判断句与数据锚点原稿（2026-09-18 核定版）\n\n# 区域品牌 D｜判断句素材与数据锚点\n\n> 整理：2026-09-18\n> 用途：内容写作时直接取用的句子与数字。**所有数字均已回原始文件核对。**\n> 对外口径：客户名写作「某蛋糕品牌」，不出现城市、门店名、可反推的时间+营收组合。\n\n---\n\n## 一、判断句（可直接用作开场或落点）\n\n以下前五句来自 Mirror 本人的叙述（已去掉英文与口语碎词），后四句是我根据材料整理的说法，可用可不用。\n\n1. 押注的地方没长出来，没押的地方起来了。\n2. 蛋糕的爆发和我有关系。「没用」说的是前面那将近一年。\n3. 我建议关店，合作停止半年之后，客户才关的。\n4. 现在客户关了两家店、留下两家，老店重新翻新，重心转向甜品和蛋糕——而我已经不知道内部数据了。\n5. 咨询顾问的宿命是：你永远不知道自己的建议最后怎么样了。\n6. 我做了两年，几十个动作都是对的，账面没有转正。真正动账的，是关掉两家店。\n7. 我算过的那张表，两年后变成了现实。\n8. 小店的结构性亏损，靠点状运营动作救不回来。真正动账的只有三刀：砍品类、砍门店、换产品结构。这三刀都要老板点头，都要有人先难受。\n9. 面包线的占比从来没有动过——21% 到 20%，掉了 1 个百分点。而它的销量，半年里少了一半。\n\n---\n\n## 二、数据锚点（已核）\n\n### 1. 面包线：押注失败，数据成立\n\n**品类贡献占比（2025 上半年 vs 2024 上半年）**\n出处：`周月会留存/7月/区域品牌 D半年复盘会-7月.pptx` p17\n\n| 品类 | 2025 上半年 | 2024 上半年 |\n|---|---|---|\n| 鲜奶小蛋糕 | 27% | 28% |\n| **现烤面包** | **20%** | **21%** |\n| 烧仙草&冰冰饭 | 15% | 13% |\n| **大蛋糕** | **12%** | **9%** |\n| 鲜奶茶果茶 | 7% | 10% |\n| 简餐小食 | 7% | 8% |\n| 特色雪花冰 | 7% | 6% |\n\n**同比（2025 上半年 vs 2024 上半年）**\n出处：同上 p18\n\n- 现烤面包：实收 **-30%**、销量 **-46%**、单价 +23%\n- 鲜奶小蛋糕：实收 -28%、销量 -43%、单价 +15%\n- 大蛋糕：实收 **+10%**、销量 +9%、单价 -15%\n- 整体实收同比：**-14%**\n\n**面包日均实收的持续下滑**（月会口径）\n出处：`7月/区域品牌 D8月月会.pptx` p9、`9月/区域品牌 D9.5月会.pptx` p9、`10月/区域品牌 D10.24周会.pdf` p8\n\n- 6 月 78,156（÷30 ≈ 2,605/天）\n- 7 月 78,266（÷31 ≈ 2,525/天）\n- 8 月 76,568（÷31 ≈ 2,470/天）\n- 10/13–10/19 单周 13,531（≈ 1,933/天）\n\n**进场基线**\n出处：`24-11月/区域品牌 D提案-终版.pptx` p10、p53\n2024 年 3–7 月 vs 2023 年同期：现烤面包 销量 +56%、应收 +57%、实收 +42%，金额占比 21%。\n\n> **结论：面包线从进场到现在，占比 21% → 20%，实收同比 -30%（差于整体的 -14%），销量腰斩靠提价收住跌幅。「面包能力长出来就开新店」这条路在数据上从未成立。**\n\n### 2. 亏损与结局\n\n- 进场时（2024 年 1–9 月）：实收 742.2w、同比 **-23.56%**、净利润 **-281,094**（占比 -3.79%）。2023 年同期为 +136,234（1.40%）。出处：`10月/区域品牌 D年度复盘-终版.pdf` p4\n- 合作期末（2024.12–2025.9）：流水 876.8w（-16%）、实收 676.4w（-14%）、毛利 401.7w（-11%）、净利润 **-81,556，亏损收窄 75%**。出处：同上 p13\n- 门店 FLR（房租+人力+食材）：**一店 76%、二店 90%、三店 105%、四店 106%**，结论「除一店外均无利润空间」。出处：同上 p49\n- 后续（Mirror 叙述，非材料）：关掉三店与四店，保留一店与二店，重心转向甜品与蛋糕，一店翻新。\n\n> **关店判断的验证：算出来 105% 和 106% 的两家，最后真的被关掉了。**\n\n### 3. 引流动作低效（点状动作的实证）\n\n- 满 150-20、满 200-30 券各发 282 张，**核销 0%**；禧甜卡 160-30 券 2000 张，**核销 1 张（0.1%）**。出处：`2月/区域品牌 D2月季度会.pdf` p23、`4月/区域品牌 D4月月会.pptx` p21\n- 抖音：4 月月会写「流量、转化和新客占比均更优，之后继续重点开发」；5 月月会抖音**核销金额环比 -74%**、访问 -70%。出处：`4月/区域品牌 D4月月会.pptx`、`5月/区域品牌 D5月月会.pptx`\n- 报损：1 月合计 67,035 元、占实收 12%；四店 20%、二店 15%、三店 11%、黄岩 8%，报损 TOP 是自家热销品。出处：`2月/区域品牌 D2月季度会.pdf` p32\n\n---\n\n## 三、还没定的事（写之前必须解决）\n\n1. **同比窗口**：材料里至少三种（提案基线 2024 年 3–7 月 / 半年复盘 2025 上半年 / 周会的周环比年同比）。**全文只用一个窗口。**\n2. **10 月爆款与前面一年的关系**：如果前面一年的动作是「接得住 10 月爆款」的前提（研发进程、上新 SOP、博主资源、私域承接），那「点状动作无用」要改；如果接得住也无关，那才是真的无用。**这个答案决定整篇的立意。**\n3. **蛋糕爆发的归属**：Mirror 说 2025 年 10 月全网爆款「奶皮子烤布蕾蛋糕」，他让客户抓紧研发上线并找小红书博主推广。**但半年复盘（截至 6 月）显示大蛋糕实收已经 +10%、占比 9%→12%**——蛋糕在爆款之前就已经在涨。叙述时不要把两段合并成一段。\n\n\n---\n\n## 四、 附：2026 年 1–10 月工作记录全文提取\n\n2026年1-10月工作记录\n2026/10\n1. 零售品牌 A项目\n外卖培训完成：指导门店优化外卖运营流程，提升线上运营效率\n复盘数据修正：修正之前外卖重复计入问题，确保数据口径统一\n季度复盘报告输出：含数据分析和后续策略建议，完成初稿\n新品上架跟进：香蕉巧克力蛋糕上线，完成上架流程及推广素材准备\n10月工作计划制定，明确各阶段重点任务\n2. 消费品牌 C（某城新客户）项目\n方案修改与内部对齐，持续调整中\n会员方案策划与输出，完成初版方案\n3. 连锁品牌 B项目\n日常辅助跟进，含数据监控与运营支持\n2026/09\n1. 零售品牌 A项目\n体验官招募通知完毕，完成体验官活动执行与跟进\n季度复盘数据整理，思路整理与大纲初稿完成\n月饼季收尾工作完成，含月饼礼袋拼团及抖音带货收尾\n秋季上新及推广执行完成\n10月工作计划制定\n精细化触达测试执行\n2. 消费品牌 C（某城新客户）项目\n与心怡对齐数据方向思路，完成现有问题初步诊断\n调研前准备工作完成\n3. 连锁品牌 B项目\n日常辅助跟进，含数据监控与运营支持\n2026/08\n1. 零售品牌 A项目\n教师节产品上线确认，礼袋拍摄安排（9月2日完成）\n月报制作完毕，含上月数据汇总与分析\n9月口味蛋糕研发建议：建议裱花组前置口味蛋糕研发，除秋 上的成功。这和经验有关，和思考的模型有关，也和工作态度（是否细心、有责任心）有关。\n对自己来说，最大的挑战在于缺乏经验和对思考模型的运用。经验可以逐步积累，主要是思考的方式需要及时调整，从历史的“下意识思考”到按照模型框架去展开思考。\n   2）做好复盘。工作中遇到的问题，不管是主观原因还是客观原因，都可以回溯思考一下产生问题的根因是什么，比如一个流程中的卡点可能不是这个事情本身，有可能是计划环节的疏漏，有可能是表达方式的问题让对方不理解，也有可能是对方并不认同执行力不足。尤其在现阶段，出现“坑点”概率更高，那就更值得做好记录和整理。\n3）保持好奇心。在初期阶段自己的整体状态是信息不断输入，但人惯性懒惰，可能随着熟悉而忽视持续学习。需要提醒自己保持信息输入的状态，把好的工作习惯保持下来，向外关注新的信息，向内多看现象然后追问求解，尽可能做到，知其然而知其所以然。\n2、问题to张师傅\n1）对于自己在过去一个多月的表现的评估，哪些好，哪些不足？\n2）具体的期望，比如带项目的时间预期是多久，可能欠缺的关键能力是什么？\n\n### 复盘档案：2024年10月30日个人复盘.docx\n\n2024年10月29日个人复盘\n看过去：主要参与项目回顾（8-10月）\n1、甜品项目G3七夕大活动+周年庆大活动\nS情境/背景：\n①7月25日-8月10日七夕活动。客户自身基础能力不足+时间仓促+我需要从0到1了解流程并完成执行的三重因素下，整个跟进过程中突发问题较多（客户不清楚+我不清楚），整体感知比较忙乱。\n②10月1日-10月27日周年大活动。客户能力和经验均有明显提升，我的角色从部分的执行者变为辅助检核者，\n2）T任务+A行动\n主要动作包括——\n①计划事项是否执行&是否标准的检核\n②过程数据的部分关注\n③执行中问题答疑、落地纠偏\n④部分线上内容直接代客户配置并培训方法\n⑤活动结束的数据分析&结论输出\n3）R结果\n①客户：两次活动均带来80%以上业绩增长（周年庆直接翻倍）以及客户感知层面的认可（配合度、任务完成度）。\n②个人：随着执行的细节问题大幅减少，增加全局视角，更关注活动为什么设计，对应的目的，关注具体活动的数据对比&是否符合预期（举个例子：砍价对比路易贝果&对比自身拼团、储值看新客占比&老客消费分层分析）\n2、烘焙项目G1杭万店开业\nS情境/背景：\n①首个开业大活动的协同跟进；\n②老店新开，且为较大体量的连锁餐类客户；\n③由于前期一直负责数据录入和周会ppt，数据侧对品牌有一定认知。\n2）T任务+A行动：\n主要动作包括——\n①计划事项是否执行&是否标准的检核\n②主动制作数据播报，并对开业期间数据持续播报关注\n③执行中问题答疑、落地纠偏和部分问题的主动前置发现\n④部分线上内容直接代客户配置\n⑤活动结束的完整复盘\n3）R结果\n①客户：开业目的实现（复盘已体现，不赘述）。\n②个人：\n了解开业大活动的整体节奏，并学习郭师傅思路对【活动节奏】和【攻守兼备】有了认知，大活动不是各种小活动的堆叠，而是有逻辑地咬合；\n对活动中不同动作、不同阶段对应要关注的事项有认知，并在烘焙项目G2开业中能应用起来，从而能有更多主动性动作（例如宣发的提前沟通确认、物料的准备、开放折扣前需做好门店的培训、客户的执行能力等等）；\n对客户进行了复盘，多了一些独立表达的经验。\n3、烘焙项目G2宁波&无锡店开业\nS情境/背景：\n①和烘焙项目G1杭万开业无缝衔接，流程熟悉度较高；\n②双店齐开，且和日光周年庆大活动同步进行，三个活动叠加事项150+。\n2）T任务+A行动：\n主要动作包括——\n①用check list，主动确定事项的检核节点&检核标准\n②主动制作数据播报，并对开业期间数据持续播报关注\n③执行中问题答疑、落地纠偏和大部分问题的主动前置发现\n④部分线上内容直接代客户配置\n3）R结果\n①客户：截至目前效果看，宁乔的热门榜排名第一且周内日均应收3.3w，热度好；无乔距试营业还有6天，预售券、会员代金券已经达到3000+，热度预估也不错；除了企微加人滞后，其他事项均ok。\n②个人：\n由于检核的前置性，落地纠偏的动作变少，主动性调整和思考变多，“手忙脚乱”变成“忙中有序”；\n对数据有更多真实场景还原的思考和认识。（比如代金券核销前两天集中在39.9/47面额，是由于到店更多是周边用户，线上散客还没有开始转化；收藏率高打卡率只有20%的原因是非到店收藏，实际反应的还是门店打卡引导不到位）。\n4、小结\n在杭万的复盘中，我总结了方案的成功=能力+态度+执行的公式，对应到上述的3个品牌5场活动，能力随着活动的复用可以显而易见的快速增长，态度基本保持了一致的责任心+细心，执行力随着对业务的熟悉，从不知到知，由完成项目经理指示逐渐过度到主动进行、提供个人思考。\n看现在：项目经理能力拆解&对标\n个人强项：结构化思维、学习（创新）能力、数据能力\n个人弱项：沟通技巧、资源调动、活动设计\n看未来：对新客户的思考\n写在前面：这一part更多是想看自己在未正式开始做提案整理、直觉性思考的情况下，思考方向是否ok。\n看到了什么：\n城市的分散度看上去和苏州有点像（甚至更分散），核心城区（椒江、路桥、黄岩）面积占比仅10%左右，发达程度粗看应该是椒江>路桥>黄岩，城市，且城市中心被大山隔开\n5家店均在台州，椒江区（新区）1家，黄岩区4家，其中黄岩老店10年历史，椒江四店店3年、二店店3年、官河快闪店2年、三店店今年初开；\n——可能影响是营销传播性、人员流动性较弱；\n——10年老牌，类似于御品轩、米琪、莉莉蛋糕的角色，有群众基础，但认知不新潮；\n——拓店集中在2021年，速度相对比较快，但是集中在黄岩，社区型为主；\n经营类目多，蛋糕、面包甜点、冰品、炸物小吃、饮品均有；\n近几个月从研发到营销有意识做动作（四拼盒子、迪拜巧克力），但是仅有皮毛，看不到逻辑和效果；\n产品结构没有重点，新品集中在面包甜点类，但是评价看雪花冰和提拉米苏是高点单品，但雪冰季节性太强，提拉米苏口碑下滑；\n产品价格较高；\n门店装修风格落后，使用率低，前厅空旷还有儿童游乐区；\n\n### 复盘档案：2024个人年终复盘-Mirror.docx\n\n题 目：\n《运营中台2024个人年终复盘》\n姓 名：\nMirror\n时 间：\n2024年12月30日\n2024年终复盘\n引言\n2024年对我而言是一个重要的人生切分点，从北京回到西安，实现了过去7年间都在持续的一个期许——落地可以生“根”。这个”根”，是不用时常辗转颠沛的生活状态，更是可以在一条充分认可的道路上，有动力、有信心持续前进的职业状态。\n自6月24日加入公司至今已有189天，这是有挑战也很有收获的189天。从餐饮行业的纯小白到能给客户出策略、出方案的咨询顾问，这其中沉淀了上千个数据字段、近百个会议、几十个各类文档和难以计数的内外部沟通。\n即使已经工作多年，但在踏入新的领域和落地全新事项的时候内心也会发怵。但是好在，在我们这个集体中，每个困惑都有回应，因为大家保持着共享、开放和互助，我才能在短短半年中实现角色的过渡和个人的成长。\n工作回顾\n第一阶段：建立认知（6-7月）\n1、系统认知\n（1）对外：客户的类型、体量、产品、业务数据、交付物内容；\n（2）对内：工作板块、分工、例行流程。\n2、内容认知\n在7月，我主动做了几个拆解和总结，把每天大量的点状信息输入进行收敛，从而更好理解业务——\n①对业务增长的拆解\n②对营业额影响维度的拆解(营业额公式)；\n③对活动适用场景和目的拆解；\n④对几个蛋糕客户同指标拉齐对比的拆解。\n这些拆解虽然落地层面不足，但类似底层的框架，基本不受业务变化影响，在投身于具体事务一段时间后再回过头来看这些框架，会发现温故而知新，对于整体策略的思考有梳理的作用。\n第二阶段：辅助执行（8-10月）\n1、甜品项目G3七夕+周年大活动——\n（1）过程小结：\n第一个辅助跟进落地的客户，同时也是刚接入的新客户。首次七夕活动，时间较仓促还赶上帅哥出差，整体节奏忙乱，中间问题频发（主要是细节标准不够清晰和较多突发状况），但好在结果ok，带来80%业绩增长；二次周年庆细节问题大幅减少，客户可以自行完成大部分执行动作，除了线下市集有部分突发问题，基本可以按节奏平稳落地，最终实现了活动期间营业额翻倍的成果。\n（2）回顾思考：\n从0-1的执行落地必然面临大量问题，执行中尽可能深入到最细枝末节处，才能对问题是否真实/如何解决有更好的判断能力；一旦执行顺畅，要把精力放到全局视角，关注活动为什么设计，对应的目的。\n2、烘焙项目G1杭万店开业+烘焙项目G2宁波&无锡开业\n过程小结：\n三店开业基本串联（乔开业还和甜品项目G3周年重合），有更多的跨部门人员沟通+多任务并行的处理，因此在执行前做好了check list和数据跟进表——①多任务并发时不易遗漏、更好判断优先级；②问题、数据、物料当下可线上记录，便于追溯，快速沟通调整。\n结果端虽有关键问题难解决（例如热门榜品类、地推滞后），但整体三次开业均有较好的线下势能和线上流量表现，且整体节奏和计划一致。\n（2）回顾思考：\n当事务性工作重叠在一起，理清楚任务优先级很重要，用好工具可以有效提升效率。\n此外就是认知层面，按照杭万复盘总结的公式——方案的成功=能力+态度+执行，执行能力随着活动的复用可以快速增长，态度上保持充分责任心+细心是不出错的前提，执行力不仅是“指哪打哪”，更是主动思考和了解所有的调整背后逻辑，不管是计划到执行落地到复盘，以终为始更重要。\n第三阶段：角色转换（11月至今）\n1、主要负责客户：区域品牌 D\n过程小结：\n区域品牌 D11月19日完成提案，作为我主责的客户，其核心问题是现有品牌供需的错配，且在黄岩市场和折扣体系内难以调整，因此解决这一问题需要双线并行——既要提升现有门店经营效率，通过上新拉升营收来稳住大盘，还要帮客户梳理出规范的工作流程，让本人可以投身于新品牌的打造。\n截至12月底，区域品牌 D业务侧已完成3次上新，营业额环比增长11.6%；内部做了上新、下架标准的梳理和私域的优化，但过程中暴露的上新重点不清晰的问题，对实际结果产生了影响，因此在上周和客户的月复盘中对这一问题进行了重点复盘，结果还待观察。\n回顾思考：\n当个人角色从辅助跟进转变到主导负责，心态的调整相对容易，但落地层面并不简单——项目经理要提前想清楚、想细致要做什么、为什么要这么做，但实际落地的第一个挑战是尽管清楚框架了、看到模范案例了，但具体动作还需要一步步摸索。由于每个客户都具有特殊性，因此动作和发展路径不可照搬，每一个小决策做出前都需要先了解清楚具体步骤、能否落地、是否适用、有没有参考标准；\n第二个挑战则是沟通层面，对客户问题要解答到什么程度、怎么透过客户提出的问题看背后需求、怎么把握强硬和尊重的平衡等等。以上挑战虽然都有出现，但也并未形成持续的阻碍，但是于我而言修炼进阶还是任重而道远。\n辅助负责用户：品牌项目\n过程小结：\n完成二乔的开业后直到区域品牌 D提案的近一个月内对品牌项目的动态明显缺乏了关注，比如中间的冬季上新和抖音大播都是看到群消息才知道有这样的动作，直到12月随着年度复盘工作才又拾起关注度，从数据侧看到了今年烘焙项目G2和烘焙项目G1的变化，又跟着郭师傅从业务侧系统性回顾了这一年烘焙项目G2和烘焙项目G1的动作和问题。\n回顾思考：\n品牌项目的复盘中，张师傅和郭师傅持续的讨论到最后对问题症结下判断的过程值得学习，当客户的业务持续扩张，组织、品牌、财务等等都可能会有结构性变化，哪些变化方向是对的、哪些变化是有风险的要想清楚、看清楚，有风险的变化体现了什么结果要给客户讲清楚。\n另外就是，过程缺失过的关注度后面虽有及时补上，但是整体的主动性和细致度还是不如区域品牌 D，需要在心态上拉齐重视度。\n整体总结\n半年时间我个人的关键目标是完成项目经理基础能力积累，目前来看基本已达成。这些能力中，核心是——\n·建立60%左右餐饮行业认知\n·形成流畅的方案输出能力（含复盘、提案和日常工作计划）\n·初步达成PDCA任务闭环处理能力。\n经验总结\n亮点\n学习能力：\n信息输入+信息加工+信息输出是我惯用的一个学习路径，简单来说就是多听多看，但同时保持辩证思考，有问题当下问，来实现大量有效信息的输入（有效指真正理解可吸收），然后把有效信息归纳整理，形成一些输出（比如日常讨论、脑图、计划），再通过有经验同学的反馈来验证这个输出是否合理，继而完全内化成为自己可用的知识。\n数据分析与决策支持：\n有赖于过去的工作经历，基本形成了比较熟练的数据分析与决策的思路：\n判断问题-进行假设-确定相关指标-整理数据-分析-验证-形成结论-落地动作\n但餐饮行业和互联网很大的不同在于，线下的场景复杂度和难以量化性，因此我在做一些数据工作时也会提醒自己，不要陷入路径依赖，具体问题具体分析。\n梳理和总结能力\n核心在于自上而下思考，先清楚笼统的大背景和大目标，再把每一个动作或事件都和大目标形成关联关系（如果没有关联性那这个动作就是无效的），关系形成了框架，最后填充具体信息。\n暗点\n对客户的主导能力\n由于和客户沟通中缺乏更强硬的主导，表现到结果层面就是按客户的想法做了过多的上新和产品变更，这其实背后还是基本功不足，专业经验不过硬，才难以形成大概率正确的判断，因此才表现为缺乏运筹帷幄、主导对方的自信。\n协同分工的能力\n我个人的习惯是独立处理工作任务，但项目经理的角色需要有统筹协调的能力，比如私域和投放需要盼盼思阳协助，但除了私域投放，数据问题可以和青凤交流，基础信息收集处理可以交给小雪小付，活动计划可以直接参考大家的成熟经验，这些都是目前还没有带到工作习惯中的。\n同时，当客户的组织较复杂（如烘焙项目G1）也需要有协同分工，不同的任务有不同的负责人，找准落地关键角色大大提升效率，自己需要有更主动的意识多接触不同角色负责人。\n师徒带教能力\n作为师傅，短暂地发挥过作用，但随着带客户之后对小雪的关注就基本没有，这个也是自己没有认真思考如何帮小雪进步或解决问题的体现，之后工作中可以保持定期交流，多一些关心~\n挑战与调整\n挑战——精力管理是核心挑战。\n  所有具体的困难都有解决方案（比如动作的跟进、客户的共识、方案的制定、策略的调整等等），但背后核心还是有足够的时间和足够的心理空间去向内思考、向外看案例，因此，做好精力管理是前提。\n调整\n艾森豪威尔矩阵：对已有的明确任务，在本子上划分紧急&重要的四象限，周维度划分大任务，日维度划分小任务，完成一个划掉一个；\n收集所有碎片想法：对不明确的任务，比如临时的发现、想法都记录下来，不只停留在脑子里，不然早晚要忘记；\n3、整理和分类：按任务的类型分为行动项目、待办事项和长期目标等,找出20%最重要的任务，这些任务通常会带来80%的成果，集中精力先完成这些任务；\n4、定期回顾：每周回顾任务进展，进行必要的调整。\n5、参考番茄工作法：把工作切割为1小时（原方法是25min），每一小时做一个任务的切换或者休息片刻，让大脑能高效思考而不至于“只缘身在此山中”。\n2025年规划\n（一）关键目标\n具备项目经理完整的必要能力，可承接负责4个客户。\n（二）关键结果\n1、专业知识&能力提升：对客户经营大部分策略问题可以形成独立的（大概率）正确判断；\n2、客户沟通技能技巧提升：能通过日常沟通洞察客户核心诉求或当下核心问题；\n3、精力管理提升：日常工作可以有条理完成，有学习思考时间，有帮助小雪提升时间，有充足留给爱好的时间；\n4、保持系统性问题的记录和梳理：比如但不限于对于区域品牌 D能抽象出从老店到新店整个调整过程的路径和关键节点，未来对于同类型客户有直接的参照作用。\n余华说：“和高人聊、从书上学、在事上练”，是最重要的学习方式，三者相辅相成。\n想要实现以上关键结果的方式方法其实已经非常明确，但知易行难，希望我的2025可以做到这三点，让关键结果达成率100%。\n说起来可能有些中二，但确实希望自己可以持续保持对这个世界的好奇心，无限探索，无限进步。\n\n### 复盘档案：运营中台2024个人年终复盘-1227.docx\n\n题 目：\n《运营中台2024个人年终复盘》\n姓 名：\nMirror\n时 间：\n2024年12月30日\n2024年终复盘\n引言\n如果把人生要划分成不同片段，那2024年对我而言一定是一个重要的切片，从北京回到西安，实现了过去7年间持续的期待，期待落地可以生“根”。这个”根”，是不用时常辗转颠沛的生活状态，更是可以在一条充分认可的道路上，有动力、有信心持续前进的职业状态。\n自6月24日加入公司至今已有189天，这是有挑战也很有收获的189天。从餐饮行业的纯小白到能给客户出策略、出方案的咨询顾问，这其中沉淀了上千个数据字段的处理、近百个从旁听到参与到主讲的会议、几十个方案/复盘/计划的理解学习和难以计数的内外部沟通。\n即使已经工作多年，在踏入新的领域和落地全新事项的时候，尤其是背负了巨大信任和期待的时候，内心总也时常发怵。但是好在，在我们这个集体中，每个疑问都有回应，每个犹豫都有安慰，因为大家保持着共享、开放和互助，我才能在短短半年中实现角色的过渡和个人的成长。\n工作回顾\n第一阶段：建立认知（6-7月）\n1、系统认知\n（1）对外：客户的类型、体量、产品、业务数据、交付物内容；\n（2）对内：工作板块、分工、例行流程。\n2、内容认知\n（1）基于日常的基础动作，持续思考、提出问题、进行拆分和归类，用历史工作中沉淀的方法和习惯——穿透基础数据看规律，通过规律看机会，从而能对业务内容有更具象的认知。\n（2）在7月，我做了几个拆解和总结的内容——\n①对业务增长的拆解（产品、营销、财务结构）\n②对营业额影响维度的拆解(营业额公式)；\n③对活动适用场景和目的拆解；\n④对几个蛋糕客户同指标拉齐对比的拆解。\n基于以上几个动作，可以有效把每天大量的点状信息输入进行收敛，从而更好理解业务。\n同时，这些拆解虽然落地层面不足，但类似底层的框架，基本不受业务变化影响，在投身于具体事务一段时间后再回过头来看这些框架，会发现温故而知新，对于整体策略的思考有梳理的作用。\n第二阶段：辅助执行（8-10月）\n1、甜品项目G3七夕+周年大活动——\n（1）过程小结：\n第一个辅助跟进落地的客户，同时也是刚接入的新客户。首次七夕活动，时间较仓促还赶上帅哥出差，整体节奏忙乱，中间问题频发（主要是细节标准不够清晰和较多突发状况），但好在结果ok，带来80%业绩增长；二次周年庆细节问题大幅减少，客户可以自行完成大部分执行动作，除了线下市集有部分突发问题，基本可以按节奏平稳落地，最终实现了活动期间营业额翻倍的成果。\n（2）回顾思考：\n从0-1的执行落地必然面临大量问题，执行中尽可能深入到最细枝末节处，才能对问题是否真实/如何解决有更好的判断能力；一旦执行顺畅，要把精力放到全局视角，关注活动为什么设计，对应的目的，关注具体活动的数据对比&是否符合预期。\n2、烘焙项目G1杭万店开业+烘焙项目G2宁波&无锡开业\n过程小结：\n三店开业基本串联（乔开业还和甜品项目G3周年重合），有更多的跨部门人员沟通+多任务并行的处理，因此在执行前做好了check list和数据跟进表——①多任务并发时不易遗漏、更好判断优先级；②问题、数据、物料当下可线上记录，便于追溯，快速沟通调整。\n结果端虽有关键问题难解决（例如热门榜品类、地推滞后），但整体三次开业均有较好的线下势能和线上流量表现，且整体节奏和计划一致。\n（2）回顾思考：\n当事务性工作重叠在一起，理清楚任务优先级很重要，用好工具可以有效提升效率。\n此外就是认知层面，按照杭万复盘总结的公式——方案的成功=能力+态度+执行，执行能力随着活动的复用可以快速增长，态度上保持充分责任心+细心是不出错的前提，执行力不仅是“指哪打哪”，更是主动思考和了解所有的调整背后逻辑，不管是计划到执行落地到复盘，以终为始更重要。\n第三阶段：角色转换（11月至今）\n1、主要负责客户：区域品牌 D\n过程小结：\n区域品牌 D11月19日完成提案，作为我主责的客户，其核心问题是现有品牌供需的错配，且在黄岩市场和折扣体系内难以调整，因此解决这一问题需要双线并行——既要提升现有门店经营效率，通过上新拉升营收来稳住大盘，还要帮客户梳理出规范的工作流程，让本人可以投身于新品牌的打造。\n截至12月底，区域品牌 D业务侧已完成3次上新，营业额环比增长11.6%；内部做了上新、下架标准的梳理和私域的优化，过程中暴露的上新重点不清晰的问题，对实际结果产生了影响，因此在上周和客户的月复盘中对这一问题重点强调，对客户自身的工作习惯开始显现调整作用。\n回顾思考：\n当个人角色从辅助跟进转变到主导负责，心态的调整相对容易，但落地层面并不简单——项目经理要提前想清楚、想细致要做什么、为什么要这么做，但实际落地的第一个挑战是具体动作还需要一步步摸索，由于每个客户都具有特殊性，因此动作和发展路径不可照搬，在确定要做某个动作前都需要了解清楚具体步骤、能否落地、是否适用、有没有案例；第二个挑战则是沟通层面，对客户问题要解答到什么程度、怎么透过客户提出的问题看背后需求、怎么把握强硬和尊重的平衡等等，这些都是沟通中曾面临的问题，也是我还在持续提升的方向。\n整体总结\n半年时间我个人的关键目标是快速完成项目经理基础能力积累，目前来看基本已达成。这些能力中，核心是对业务的进一步认知、和多任务处理能力的提升。\n经验总结\n亮点\n学习能力：\n信息输入+信息加工+信息输出是我惯用的学习方式，简单来说就是多听多看，但同时保持辩证思考，有问题当下问，来实现大量有效信息的输入（有效指真正理解可吸收），然后把有效信息归纳整理，形成一些输出（比如日常讨论、脑图、计划），再通过有经验同学的反馈来验证这个输出是否合理，继而完全内化成为自己可用的知识。\n数据分析与决策支持：\n有赖于过去的工作经历，基本形成了比较熟练的数据分析与决策的思路——判断问题-问题假设-确定指标-数据下载、清洗-分析验证-形成结论-落地动作，但餐饮行业不同与线上互联网，\n客户沟通与现场演讲\n系统性思维\n自驱力学习 拆解\n自驱力\n知识库助于公司数据资产留存\n工作复盘的创新性&适应性\n暗点\n专业知识局限\n客户沟通\n问题的解答\n由客户主导到主导客户\n师徒带教\n挑战与调整\n挑战\n调整\n时间管理的挑战\n项目管理能力（PDCA）的挑战\n艾森豪威尔矩阵\n收集所有任务：把所有待办事项、想法和任务记录下来，不必保留在脑海中。\n整理和分类：按任务的类型进行整理，分为行动项目、待办事项和长期目标等。\n定义行动步骤：为每个任务指定具体的行动步骤，确保每个任务都是可执行的。\n设定优先级：每天、每周对任务进行整理和优先级排序，集中精力完成最重要的任务。\n定期回顾：每周回顾任务进展，进行必要的调整。\n帕累托法则\n任务管理：找出20%最重要的任务，这些任务通常会带来80%的成果，集中精力完成这些任务。\n时间分配：花80%的时间做最有价值的工作，而将剩下的时间用于低效的任务或休息。\n番茄工作法\n把工作切割为25min——25分钟到1小时\n由于和客户沟通中缺乏更强硬的主导，表现到结果层面就是按客户的想法做了过多的上新和产品变更——这又反映出基本功的重要性，只有夯实了基本功，才会有运筹帷幄主导的自信。\n余华说：“和高人聊、从书上学、在事上练”，是最重要的学习方式，三者相辅相成，在我看来就是有问题及时问、保持行业专业书籍阅读和多尝试（或从已有的案例中看效果）。\n2025年规划\nOKR\n关键目标\n完整具备项目经理必要能力，可独立负责3个客户\n关键结果\n持续拓展专业知识&能力\n提升客户沟通技能技巧\n加强时间管理与任务优先级管理\n保持系统性问题的记录和梳理\n\n### 复盘档案：2025半年复盘-Mirror.docx\n\n题 目：\n《运营中台2025个人半年复盘》\n姓 名：\nMirror\n时 间：\n2025年7月22日\n一、引言\n2025年的上半年，是我从一名“见习”项目经理逐步迈向成熟的过程。如果说去年下半年是完成“落地生根”的物理迁移与角色初探，那么这半年，则是在这片土壤中向下深扎、向上生长、向外拓宽的过程。\n回顾了一下半年的工作历程，我发现呈现出了三个鲜明的维度：\n·深度：负责台州区域品牌 D已有8个多月的时间，和客户的配合、对客户市场的了解再到对业务的挖掘，无一不在从生疏到熟悉到小有洞察。\n·效度：负责长沙连锁品牌 B3个多月，在一个生命力旺盛的市场中陪伴一个快速成长的品牌，运用公司成熟的武器快速打响营销攻坚战，并取得了显著的增长结果。\n·高度：作为项目助理，辅助郭师傅跟进全国连锁大客户泰熙家和烘焙项目G1意面，得以在更高维度观察和学习成熟的商业体系和品牌发展变化。\n这一“深”、一“效”、一“高”的立体实践，让我对工作方法、经验吸收和业务认知都有了新的成长。\n这180多天，不仅有看到增长或策略奏效的喜悦，更有面对客户下滑亏损时的自我质疑，很庆幸，在团队开放、互助的氛围中，我能够直面挑战，将困惑转化为成长的养分。\n二、工作回顾\n上半年我的工作核心围绕主导项目区域品牌 D和连锁品牌 B与辅助项目烘焙项目G1和泰熙家展开，它们分别代表了不同的挑战和成长曲线。\n第一部分：区域品牌 D——“历史总是螺旋上升”\n作为第一个客户，服务区域品牌 D的过程总是带着压力——客户仍在亏损这一事实，无时无刻不盘旋在内心。因此，回望区域品牌 D的上半年更显得周折，但如马哲所说，历史的发展并非线性，而总是螺旋式上升，区域品牌 D的变革已经开始。\n数据结果回顾\n上半年累计订单9w7051笔，累计应收461w4505元，累计实收367w7588，折扣率7.9折；\n上半年同比2024年同期，销量同比下滑38.8%，单价同比提升21.2%，实收同比下滑25.8%；\n2025年上半年同比去年，冰激凌销量同比下滑80%、饮品、简餐销量同比下滑60%、而最核心的西点和面包销量也同比下滑超过40%；\n微信加人总计4875人，新增会员共计7717人，美团+抖音双平台日均访问同比增长119%；日均为门店引流到店新客25人，同比增长140%。\n以上这些数据在说明，虽然在拉新渠道上有了翻倍增长，但内部几乎产生了全产品线的下滑——供给基本没有改变，而市场的需求已不同当年。\n（二）过程回顾\n1、挑战：首次产品调整失利\n年初，我们延续了2024年底的思路，一方面通过产品上新来稳住营业额，另一方面和客户同步了对面包整体升级的方案。2至3月，客户密集打样开发多款新品，并在3月底的大活动中集中上线。\n然而，尽管付出了看似巨大的努力，这些新品销量在活动后仍持续走低，难以拉动复购，核心原因是在老板不生产、核心生产人员有问题的情况下，面包后厨体系整体混乱无序、食品安全底线都受到挑战，产品的质量不过关，即使再多次上新也只是昙花一现。\n拉升：大活动甜品节\n3月底-4月初的甜品节大活动，是在面包调整+门店动线调整+聚焦老板精力的背景目的下开展的，整体活动取得了较好的短期业绩拉动作用——\n03/17-04/06期间应收环比上月增长42%，实收环比增长40%；应收同比去年同期增长11%，实收同比增长17%；\n主活动权益卡共计售出2732张，在后续3个月期限的数据追踪中，80%的权益卡购买用户消费次数对比12-3月有增长，52%的用户消费次数和金额均有所增长，复购拉动效果明显。\n同时，借由本次大活动，傅总对门店的前厅动线还进行了改造，用面包柜+平冷柜的陈列大大增加空间使用率和产品曝光效率。\n但是，即使甜品节数据看似喜人，对整个品牌的影响仍远远不足，短期业绩拉动无法撼动整体的亏损，甚至客户也提出了活动力度过大的质疑。\n3、转变：回归生意本质\n转折点是6月的线下课会面和面包主管换人，傅总自己的决心发生了巨大转变开始认真抓面包升级，我也将工作重心从“执行”转向“诊断”。通过对财务结构、产品、用户和门店体验地图的全面复盘，结合看到产品的优化已有成效，对于区域品牌 D下半年的主线已基本清晰。\n在面向客户的复盘中，我给到了一个小结——回归生意的本质，即聚焦门店、贴近用户、持续提供好的产品和服务。\n对比2月的季度会，这次见面后有了更多的信心和执行的坚定。\n（三）思考：\n区域品牌 D的经历让我懂得了，当战术努力无法逆转战略颓势时，必须有否定自我、破而后立的决心。\n区域品牌 D变革已经开始，但是否能行稳致远，还需要下半年我陪伴客户持续发力和落地监督，期待下半年能描绘出漂亮的新的增长曲线。\n第二部分：连锁品牌 B——“天下武功，唯快不破”\n如果说区域品牌 D是“慢火慢炖”的修炼，那么3月份开始合作的连锁品牌 B则像“大火快炒”的能力检验。连锁品牌 B让我认识到，在竞争不充分的市场中开足马力前进，市场就会给快速反馈。\n数据回顾\n2025年4-6月累计订单7695笔，累计应收175w6034元，累计实收173w9780，折扣率9.8折；\n2025年4-6月同比2024年同期，销量同比增长94%，应收同比提升81%，实收同比提升83%；\n6月周年庆大活动；\n6月实收超65万元，同比增长79%，在淡季中创造了旺季的业绩；\n权益卡售出623张，完成目标的78%，为下半年储备了高价值用户；\n活动期间新增客户近万人，新增会员1601人，同比去年增长296%；\n储值用户580人，同比去年增长210%，储值金额35w5590元，同比去年增长84%。\n生产效率大幅提升，从定制为主已经逆转为口味蛋糕占比52%，10+个SKU贡献了80%的销售额。\n过程回顾\n1、理流程、跑上新：快但不细\n3月31日提案后，4月上半月用2周时间快速搞定了内部培训、私域流程梳理、美团和抖音建店、开店宝后台配置和霸王餐报名等工作，下半月就直接开始了新品上新和首次小红书推广。\n虽然初次上新结果很好（口味蛋糕环比提升71%，出现3000赞爆文），但是现在回看过程端，在没有稳步按照上新流程一步步走的情况下，叠加了拼团活动、1V1和投放事务后，客户内部可能就已经开始有一定的混乱问题，而这一问题却直到2个月后才有了显现。\n2、旺季+周年庆：增长幸福和压力并存\n5月和6月对连锁品牌 B来说可以说是快马加鞭，三大节和周年庆让两个月的工作相当密集。当然在快速奔跑后，增长也是非常明确，上述的数据就不用再次赘述。\n大活动结束，客户提出了暂停一个月的想法，希望可以调整梳理内部的秩序。虽然从我们内部视角看，整体节奏并不属于客户中很快的，但带入到客户视角，中间的每个环节可能都是赶着进度狂奔，对于需要有秩序感和掌控感的老板来讲，需要按下暂停键。\n（三）思考：\n连锁品牌 B的增长验证了我们的方法武器的奏效，以及在相对顺风的市场中要快速占领优先身位的重要性。\n而同时，连锁品牌 B的暂停也让我意识到，在内部体系秩序并未建立的成长期客户身上，节奏同频也是尤为重要。我和连锁品牌 B在未来还需要更高频、深入的沟通，甚至更多的见面，提升双方的信任度，让工作节奏不管慢还是快，都能在一致、舒服的情况下展开。\n第三部分：辅助泰熙家&烘焙项目G1——在更高维度获得体系化认知\n除了主导负责的客户，上半年我还作为项目助理，辅助郭师傅跟进泰熙家和烘焙项目G1意面这两个全国性连锁品牌。这个角色给了我一个宝贵的机会得以跳出具体执行，去观察和理解一个成熟的商业机器是如何运转的。\n（一）工作回顾：用数据提供决策支持\n我的工作主要包括制作经营复盘数据、跟进开业等大活动执行、专题数据分析和结论输出以及参与每周周会和输出会议纪要，整体更多围绕着数据分析板块，为郭师傅提供决策支持。\n其中，比较记忆深刻的是烘焙项目G1“意粉节”的复盘——\n通过数据分析，清晰地证明了“意粉卡”的推出有效带动了用户的复购率提升，而这一数据对于后续进一步推“次卡”时也能起到借鉴。到目前烘焙项目G1上新动作中还在延续次卡的模式加入直播货盘中。\n这也再次验证，即使在成熟的体系中，精细化的数据分析依然能够发现机会，并能将单点的成功，固化为可复制的策略。\n（二）学习与收获：理解“标准化”的力量\n在辅助跟进这两个大型连锁品牌的过程中，我最大的收获是对“标准化”的力量和含义进一步加深理解：\n1、产品和分工标准化：核心在于拥有一套经过市场验证、毛利合理、供应链稳定的“菜单”，每次上新迭代都是多部门（开发、供应链、营运、企划、品牌）的协同作用，层层机制下，保证了品质的稳定和运营的高效。（当然，也必然存在着极致追求效率和标准的前提下对独特性、创意的损失）\n2、流程标准化：这一点在开新店时尤为明显——从门店选址、装修、员工培训、营销策划到后厨管理，每一个环节都有详尽的SOP（虽然我也只见到部分），这确保了无论门店开在哪里，消费者都能获得基本一致的体验，也极大地降低了管理成本和扩张风险。\n这些学习，为我思考成长期客户的未来路径提供了宝贵的参照系，虽然不一定走向扩张之路，但是中间很多流程环节都可以对应；而又让我意识到小品牌需要平衡发展，即既要对外保持有特点、有温度，又要对内逐步注入“标准化”的基因。\n三、经验总结\n回顾上半年的成长，我看到了自己在2024年底规划上的进化与延伸，也发现了新的挑战。\n（一）项目经理能力的深化与体系化\n1、业务策略能力： 微观-中观-宏观视角的逐渐补足，能深挖客户内部数据找问题、找机会，也能“眼观六路、耳听八方”看其他客户、看烘焙领域，还能从外部看宏观的餐饮乃至消费市场，虽然这些信息的整合目前仍相对无序，但已经在逐步形成内化的策略判断依据。\n2、跟进及协调能力： 上半年经历2场主客户大活动、2场辅助大活动，历经大活动，基本可以成倍提升落地跟进能力和协调沟通能力，尤其是连锁品牌 B的周年庆，通过社群快闪的高密度工作，不仅让客户练兵，也是对我自身的磨练。\n数据驱动的复盘能力： 上半年首次完成了完整的客户的半年复盘和大活动复盘，以数据为基础，增加更多维度的探索验证，从发现问题、分析原因到提出解决方案，形成相对完整的PDCA闭环。\n精力管理能力： 在上半年已经基本完成多任务并行的工作流打磨，目前已基本形成较稳定的工作流程，让自己在精力管理中基本顺畅。\n（二）在更高维度上看到新的不足\n对客户的主导能力（修炼中）： \n如何更早、更坚决地基于专业判断影响客户，是我需要持续修炼的课题。自己的两个客户中，区域品牌 D的合作时间更长，而客户配合度也更高，在此基础上依然在Q1中没能持续、坚决地让客户在产品端发力，由此浪费了数月的时间。此刻复盘这一过程，会觉得面包主管的问题可能并不是绝对阻力，在外部顾问的角色中我仍可以抓工作的重心，给到傅总发现问题、决心解决问题的契机。\n接下来提升这一能力我计划从两方面改善——\n客户月计划、月复盘、季度复盘、半年复盘常看常梳理（至少每月一次），时刻回顾主线任务；\n主导能力底层还是建立在正确的判断和数据增长之上，继续增大经验值和知识储备，往前再看一步。\n对客户的信任感建立能力（需打造）：\n带连锁品牌 B的过程，最大反映出的问题在于我不擅长拉近与客户的距离，并建立信任感。抛去客户的沟通习惯不谈，我在主观方面的沟通会太过“务实”，而缺乏对工作内容本身之外的沟通。\n对此我的提升思路——\n可能做不到一个经常性社交的状态，但可以保持在周会、日常中多询问客户内部、自身是否在一个觉得ok的节奏中、是否有问题等，保持真诚、多一些互相交流，而不是单向输出。\n3、对中长期战略的意识（待加强）： \n既能着眼于现在又能放眼于未来，这是近半年来的工作实践中我认为在下半年务必要提升的——如果脱离了长期思考仅做短期策略，动作会像浮萍一样，看似挤满了池塘但很难开花结果。\n长期战略意识建立，需要保持持续地信息输入-加工-内化这样的过程。\n目前难点就在于加工有用信息-内化的思路还未探索出好的路径。\n四、2025年下半年规划\n（一）关键目标（O）：\n1、深度调整区域品牌 D门店模型，实现财务“扭亏为盈”；\n2、保持连锁品牌 B增长势头，实现长沙线上蛋糕头部领先；\n3、承接负责3-4客户。\n（二）关键结果（KR）：\n1、区域品牌 D：\n· KR1: 完成“面包重启升级”并验证市场可持续复购，使面包品类在Q4实现同比增长；\n· KR2: 推动一店店盈利模型优化，通过调整储值方案和菜单，实现利润率的正增长；\n· KR3：关闭或整改亏损门店（二店、椒江、三店），具体措施待定。\n2、连锁品牌 B：\n· KR1: 初步建立会员运营方法，通过精细化的复购/促活活动进行用户触达，目标4-6月新用户下半年复购率可达到30%以上；\n· KR2：下半年实收同比增长≥70%。\n3、个人能力与团队贡献：\n将区域品牌 D“面包重启”和“盈利模型”调整的全过程（验证后），梳理成一套可复用的方法论，在公司内部进行分享。\n正如我在2024年底所期许的，“和高人聊、从书上学、在事上练”，这三点在上半年给了我内在的燃料。下半年，我将带着新的思考前进，不仅追求目标的达成，更追求自我与公司同步成长的不断突破。\n\n### 复盘档案：2025年终复盘-Mirror.docx\n\n题 目：\n《运营中台2025个人全年复盘》\n姓 名：\nMirror\n时 间：\n2026年2月5日\n引言\n2025年，宏观视角看世界在加剧冲突、不确定性和逆全球化成为主流叙事；中观视角看虽然经济发展疲软，但社会大众似乎展现出了更多对自我的感受，开始催生除了更多关于情绪、悦己、体验的消费行为和产品形态。\n微观看我自己，在这一年里，主要负责的两个客户在这一年中有各自的变化、发展和离开，也看到了同样的方法论应用在不同市场、模式和团队下截然不同的走向，这些经历就像是望庐山瀑布，身在其中时看不到全貌，但是当抽身回看时就发现其中的起承转合值得反复体会和思考。\n在2025年，我也在持续琢磨自己的工作流程、思考广度和深度，在过去持续为碎片化感到无力的情况下，一点点做出改变。\n如果要用一句话总结这一年，我认为是：“这是我看见了短板也发挥了长板、有遗憾但也有收获的一年。”\n年度项目整体回顾\n2025 年，我主要参与并推进以下几个项目：\n- 主责客户：区域品牌 D、新锐品牌 E、跨界项目F\n- 辅助客户：连锁品牌 B、烘焙项目G1（旧模型/新模型）、泰熙家\n这些项目在品牌阶段、市场环境、组织成熟度上存在明显差异，对应的工作重点也各不相同；在多项目并行的状态下，我的工作重点逐步从“完成动作”转向“判断优先级、明确阶段目标、沉淀可复用方法”。\n二、项目复盘拆解\n（一）区域品牌 D\n项目周期： 2024年10月 - 2025年10月\n项目定性： 在店型过时&市场收缩背景下的变革尝试和能力锻造，协助客户进行战略收缩转型决策。\n1、 核心交付成果\n区域品牌 D是一个典型的“品牌老化”案例。面对外部市场无下限卷价格，以及内部能力（面包）较弱的情况下，合作期间的主要策略方向不是大开大合的流量推手，而是诊断后多点调整的“外科医生”，并在过程中帮客户持续强化最重要的战略诊断。\n最终复盘数据看，区域品牌 D财务上虽然未能扭亏为盈，但也在2025年实现了亏损同比收窄75%的结果。\n关键过程动作：\n从财务模型拆解到战略方向校准：\n深度分析财报、经营报表，指出了FLR占比高达89%的成本结构性问题，并通过进一步拆解到门店的人效和坪效，判断当前模型下，运营性优化能带来的改善空间已接近饱和，坐实了当前四店模式必须收缩，并进行大调改的结论。\n（2）从数据分析到运营优化动作：\n不单看销售数据，日常盯订货报表和报损报表，看到了生产和需求不匹配的问题，本质是后厨体系的混乱无序，这也是区域品牌 D内部除成本结构外的另一大核心短板。通过给客户搭建【产品线结构】和【价格带梳理】以及新品排名的周会高频复盘，给客户在框架层面提供秩序建立的依据。\n（3）围绕运营中台火箭体系的活动及SOP深化：\n- 日常上新的标准动作（线上线下触达和门店体验流程设计）；\n- 拉新与复购工具的阶段性验证（如甜水卡、权益卡等）；\n- 外卖与线上渠道的基础优化（菜单结构、活动组合、套餐呈现）；\n- 节点性活动（周年庆、节日活动）的策划与数据复盘；\n- 产品端测试与方向调整建议（蛋糕、面包结构的重新梳理以及门店动线和陈列调整）。\n阶段内的动作在局部指标上取得了明确反馈，例如：\n- 甜水卡在销售周期内实现75%复购率；\n- 甜品节大活动取得了全年营业额和客流增长峰值；\n- 月月上新的体系和动作逐步标准化，并在目前仍被客户沿用；\n- 初步验证了小红书投放和官方账号运营效果。 \n3、合作暂停的思考\n区域品牌 D的项目让我长期处在“有限条件下做判断”的状态中，这种状态身处其中时是相当不舒服的，一方面客户给予了高度的信任，但落地上又总有难以突破的限制，另一方面在市场中难以持续拿到显著的正反馈，只有在不同阶段反复调整、反复验证。\n但现在回过头来看，反而觉得区域品牌 D的挑战是一种对我能力和心力的极大磨练，这当中既有阶段性验证带来的确定性，也有面对无法通过单点努力解决的问题时的推倒再来。合作的结束，并不抹去这段过程中形成的判断与经验，它们同样成为我后续工作的重要参照。\n（二）连锁品牌 B\n项目周期： 2025年3月 - 2025年11月\n项目定性： 阶段性高标准履约，完成确定性增长和从0到1的运营体系搭建。\n核心交付成果：\n①营收爆发和流量增长： \n陪跑期间，蛋糕板块日均销量同比增长94%，实收业绩同比增长76%（增量达142.6w），下单人数同比增长102%。\n②产品结构优化：\n口味蛋糕占比由22%提升到63%，加大释放后厨产能，从而拉高增长上限。\n③运营体系建立：\n内部生产接单循环和外部投放拉新循环都建立了初步体系，即便项目结束，这套SOP依然能维持品牌的良好运转。\n关键过程动作：\n项目过程中，围绕以下几项核心动作展开：\n- 开荒点评、外卖、抖音渠道，从0-1建立红书投放流程，全面打通流量入口\n- 通过月月上新推广动作+全年应季风味排期，将品牌推广重点聚焦口味蛋糕，解决了一开始连锁品牌 B合作最想解决的问题——过度依赖定制；\n- 跑通上新节奏与推广链路，推广渠道上加入公域协同，放大内容与流量效率；\n- 大活动拉升全年新客规模，并塑造团队执行能力。\n \n3、合作终止的思考\n在高速推进后，客户选择阶段性停止，不考虑客户自身的规划，我个人而言更多地看到了在顺风市场中我们底层方法论的有效性，以及让自己开始调整思路，从初入公司看到和听到的“我们是强乙方”到“不同客户需要不同的沟通方法”，对陪跑过程中“节奏同频”的重要性更加重视。\n总体而言，这是一次有力的交付和证明，在长沙线上蛋糕市场标准化的打法可以快速战胜非标的小品牌，也对勒布在长沙发展有了积极的前置信号。\n（三）跨界项目F健身房\n项目周期： 2026年1月起\n项目现阶段目标：内部视角看积累我们客户类型中非餐业态的经验，外部视角看挖掘客户渠道机会，完成高效获客目标。\n新项目，新类型，过去的既有方法论很难套用，但底层逻辑基本共通。对于我来说还带有部分街舞行业可参考的经验，因此虽然是一个关于走出舒适圈的极大挑战，但我仍然保有信心。\n整个提案的方向——\n- 以开业大活动为主线串联起整个内部运营体系和外部渠道搭建的框架；\n- 抓住3-5月关键窗口期完成快速的用户线索积累；\n- 保持门店盈利，初步验证模型可行性和调整方向。\n今年的预期目标——\n- 跑出客户内部稳定的推广节奏和渠道运营方式；\n- 建立起公域到私域的闭环循环，并放大私域转介绍比重（尽量不依赖持续拉新）；\n- 进一步验证商业模型上餐带健身的设计是否可行，如不行，探索出有效的稳定增长链路。\n（四） 辅助项目\n2025年我辅助跟进的项目分别是韩餐连锁泰熙家（1-9月）、西餐连锁烘焙项目G1（1-8月&12月至今）、华南某城蛋糕客户连锁品牌 B（8月至今）\n连锁品牌 B\n成果： 协助品牌实现了60%+的业绩增长，建立或完善了内部运营体系。\n核心动作：\n 连锁品牌 B处于本地市场的流量红利期。我的工作重点在于确保项目经理郭师傅的工作计划执行落地并卡住细节和标准。主要包括小红书的投放、公域到私域的衔接优化和过程数据的监控。\n    过程中的难点主要在于客户执行和反馈的速度都会偏慢，因此需要多次仔细核查有无推进/卡点。整体而言客户配合度还是较高，在中后期也顺利完成了一次中型活动和年底的爆发，并取得了蛋糕客户中前列的增长速度。\n烘焙项目G1（新模型）\n背景：原店型在高线市场竞争力逐渐减弱（漂亮饭红利期衰退），客户希望下沉打开新增长突破口，需要配合迭代新的门店模型。\n核心动作： \n我的工作集中在信息的收集和辅助判断，主要包括：收集下沉市场的城市数据、品牌模型、完成新店投入财务测算和参考品牌开店历程梳理、参与现场调研和信息验证。\n泰熙家\n整体以辅助郭师傅完成客户会议交付内容为主，重点的几个单点内容包含：\n·年初的saas功能设计对齐（未落地）\n·双高SKU数据清单\n·东北拌饭品牌的梳理\n·拌饭节权益卡数据跟进\n连锁品牌 B的跟进过程更符合深度陪跑的状态，在其中更多需要发挥主动和一定判断力，在项目经理的既定计划框架下完善细节和处理客户问题以及对节奏的把控。这里会有一个心得，如果客户本身的节奏是慢的，那在不影响活动节奏的情况下可以稍微放慢，但如果伴随着重要节点（如节日、活动）就应该转变成督促的视角，推着客户往前走。\n烘焙项目G1年底新模型的跟进比之前多了很多why的思考，不只是完成数据、信息收集类工作，同时去思考项目经理梳理论点过程和逻辑，这过程中看到了对品牌发展历程的底层剖析、对现有市场状况的逻辑判断和结合客户自身能力的战略选择，这是我对于全国连锁型大客户和全国大市场的认知提升的极大收获。\n三、能力模型与方法沉淀\n这一年，我最大的收获可以说是将工作中原本零散的、点状的经验或想法，内化一部分为了可复用、可迁移的能力或方法，并在团队内进行分享，在一定程度上帮大家形成了可持续的效率优化工具。\n1. 沟通技巧：短板远不及补齐，但略有拔高\n对【人】在整个合作周期的作用认识度在变深，从执行事情到评估对应人是否愿意执行、能不能执行的方式在转变，因此开始评估人的特点、根据对方的特点适当调整自己的态度和沟通方式，目前觉得没有太大障碍。但通过长线沟通策略去改变对方，依然是难点。\n2. 做事方式：从“做正确的事”到加上“正确地做事”\n在去年乃至到上半年，我在工作中有出现流程上的问题（如区域品牌 D的前几个月都没有正常开周会），而我在不理解交付的节点的重要性时，只觉得结果上该跟进、该做的动作都和客户沟通了，而后期逐渐明白了我们是需要明确的交付节点和交付物的，因此调整到不管对内对外都要保证程序正确，也就是不光做自己认为正确的事，也要正确地做事。\n3. 数据思维：从记录结果到支持判断\n通过持续的数据跟进与复盘，我将数据层面的长板拉长，从“结果呈现”转化为“业务诊断”，不断试图在不同经手客户的数据中挖掘、下钻，以找到业务机会或问题薄弱点，这对理清策略思路有至关重要的作用。\n4. 结构化能力：信息外化成方法\n在项目推进过程中，我将面包结构&价格带梳理、在线计划表、客户大活动复盘归档、AB测试、小红书群sop等内容整理为可复用模板，在团队内部进行分享7次。\n此外，还在外部线下课分享3次，为线下课项目组贡献了一些绵薄之力。\n最后，在建设内部知识库、更新信息、大活动复盘归档并整理武器分类上也在持续发力，用个人的思考和工作习惯外化成显性的、简单明了的可视化报表，尽可能在大家信息不共通的问题上通过工具层面更好解决。\n  \n四、2026 年工作展望\n客户层面\n做好健身房跨界项目F的交付，以开业大活动为形式塑造出持续的高效获客渠道，并打造出客户团队执行组织力。对内，在不确定中探索出确定，能归纳总结出适用于这一行业甚至可复用到别的行业的方法（论）；\n更高标准跟进辅助客户，尤其是烘焙项目G1和连锁品牌 B都处在各自重要发展阶段，用不同方法和逻辑去观察、跟进和总结复盘；\n有机会的情况下新增1个主要负责客户。\n 能力层面\n在数据分析与项目判断上形成更清晰的个人标签；\n从思考转化到工具的结果继续增强，可复用的能整理尽整理。\n团队贡献\n持续输出结构化复盘与方法分享。\n当前的重点进行中项目是【客户财报的清洗与看板搭建】，旨在把复杂不统一的财报字段简化清晰，提炼出大家共性关注的应收/实收/毛利/净利，以及FLR占比，再进行可视化，对未来横向比较判断和纵向（时间周期）异动发现提供支撑。\n个人效率层面，在分享前更在意这是个“对我有效”的方法，还是“大家大概率都能用”的方法，如果觉得有普适性，也非常愿意分享给大家。\n结语\n感谢团队的大家一年以来的配合和鼎力协助，我们常说客户的成功是客户的，那么在团队内部，我认为我们的每一个成就/成果是大家共同的。大家在不那么有活力的市场中创造出内部活力，在浮躁和趋同中试图去伪存真，我相信在以终为始，坚持做正确的事情这个文化内核中，很多日常看似发散的发现、验证、推广终把小的水花最终造成大浪。\n祝我们都可以保持健康、保持活力、保持好奇心。我继续发挥J人特性，做那个“把信息变成方法”的人。\n\n### 复盘档案：2026年中复盘-Mirror.docx\n\n题 目：\n《运营中台2026个人年中复盘》\n姓 名：\nMirror\n时 间：\n2026年7月30日\n2026年中复盘\n一、引言\n回看这半年，大致可以归纳为三条线：\n第一条是破界。跨界项目F 是公司在健身行业的一次尝试，也是我第一次在缺少成熟行业经验的情况下，参与一个新业态从开业到基础运营体系搭建的全过程。\n第二条是内化。零售品牌 A不是一次从零开始的摸索，而是我辅助连锁品牌 B一年、跟进连锁品牌 B半年之后，将蛋糕客户的实践经验重新理解、整合并落到一个新客户身上的过程。\n第三条是共建。AI、客户 BI、知识库、培训和分享，让我的工作不再只围绕“做好自己的客户”，而是开始参与公司新能力的搭建，相比客户结果本身，这种与组织共同成长的感觉，是我上半年很重要的一部分收获，让我对“公司正在往哪里走”有了更具体的体感，也产生了很强的荣誉感。\n二、工作回顾\n第一部分：跨界项目F——挑战有余，沉淀未满\n跨界项目F 是一家健身房，不属于公司长期深耕的烘焙蛋糕业务。接下这个项目，本身就是公司拓宽业务边界的一次尝试。\n1 月至 4 月的合作中，我们围绕绿地店和大庆路店两家门店，完成了开业筹备、渠道基建和拉新到消餐链路的打通，也逐步搭建了地推、体验官、会员积分、社群运营、门店接待、续卡跟进和餐品转化等基础流程。\n从结果看，截至 3 月 23 日，两店累计拉新 829 人、续卡 222 人。其中，绿地店累计拉新 650 人、续卡 200 人，续卡率 30%；大庆路店累计拉新 179 人、续卡 22 人，续卡率 12%。\n在“餐+练”模式的验证上，累计 928 位办卡用户中，有 583 人发生了消餐行为，办卡到消餐转化率达到 63%；最近 7 日日均消餐 89.3 份、73.6 人。用户调研中，73.2%的用户将“练完有塑身餐吃”作为选择场馆的首要原因，78.6%的用户认可这一模式解决了健身后不知道吃什么的问题。\n渠道端也出现了明确反馈。抖音和小红书投放内容累计获得超过 72.7 万次浏览和 4100 余次互动，单次互动成本为 0.58 元，探店和基础内容运营均验证了引流可行性。\n这些数据说明，“持续流量灌入—用户到店—形成消餐习惯”的前半段逻辑已经得到初步验证。但项目更深层的目标，是验证餐品能否形成长期复购和利润，进而支撑“以餐带练、以练养餐”的完整商业闭环。合作期内，我们走到了模式验证的中段，还没有走到盈利模型被充分验证的阶段。\n最终合作停止，一方面是客户对我们以餐饮营销为主的打法认可度有限，另一方面是客户自身面临现金流压力。这并不影响我把 跨界项目F 看作一次有价值的破圈实践：三个月内完成两店开业和基础运营体系搭建，也确实为一个新行业客户带来了流量、用户和模式验证。\n但从个人收获看，这个项目“挑战有余，沉淀未满”。\n我们能够把成熟的活动、渠道和用户运营方法迁移到健身行业，却缺少对健身行业销售链路、服务交付、教练体系和续费逻辑的长期积累。方法可以迁移，但行业经验无法被完全跳过。这种“水土不服”并不代表过去的方法无效，而是提醒我：跨行业咨询不能只带着已有的武器进入，还必须重新理解当地的地形。\n第二部分：零售品牌 A——经验开始变成方法\n5 月提案后，零售品牌 A成为我上半年最重要的新客户。\n零售品牌 A仍处于本地市场存在红利、产品和品牌具备增长空间的阶段。与 跨界项目F 不同，它位于公司熟悉的蛋糕烘焙行业，也让我第一次比较完整地把过去一年多积累的经验重新组合起来。\n6 月，我们以开业大活动为抓手，把工作重点落在三项经营能力上：产品研发与结构能力、渠道秩序化运营能力和流程管理能力。平台负责带来新客，小程序和私域负责沉淀复购；节日和新品不再只靠临场发挥，而是通过研发项目表和活动计划倒排。\n截至 6 月底，零售品牌 A 6 月实收 270,226 元，环比 5 月增长 28%，同比去年增长 18%；其中商城实收环比增长 79%、同比增长 33%。权益卡累计售出 998 张，目标完成率 200%；企微新增好友 1102 人，目标完成率超过 110%。\n用户资产也出现了明显增长。6 月新增客户 4461 人，同比增长 157%；新增会员 1541 人，同比增长 51%；复购率从 5 月的 16.81%提升至 31.56%。小程序访客达到 1.4 万人，同比增长 180%，其中新访客同比增长 233%。\n这些结果让我感受到，零售品牌 A不是一个孤立项目，而是此前多个客户经验的一次汇合 ——\n连锁品牌 B让我看到，本地好产品叠加渠道推广，可以怎样抓住市场红利；连锁品牌 B让我验证了成长期蛋糕品牌如何通过快速上新、全渠道拉新和大活动实现增长；零售品牌 A则进一步促使我把这些经验从“曾经做过”变成“为什么有效、适用于谁、如何稳定复用”。\n我的视角也开始从眼前的一场活动，向 1-10 阶段蛋糕品牌的共性问题延伸：产品结构如何从丰富走向有序，平台流量如何沉淀为自有用户，研发和活动如何建立稳定节奏，以及老板的策略意图如何通过组织真正落地。\n目前零售品牌 A的合作状态和客户认可度都较好，但未来最大的挑战也已经显现：策略可以先行，组织能力却未必能同步。\n开业过程中，产品研发节奏偏慢，父亲节和甜品研发周期被压缩；直播取消、部分活动缩减，现场测试和协同机制也仍有提升空间。这些问题说明，增长可以通过一场活动被拉起来，但要把增长延续下去，必须补足组织分工、流程管理和执行节奏。\n零售品牌 A下一阶段的重点，不只是继续出策略，还有围绕提案主题，帮助客户逐步建立把策略稳定落地的能力。\n第三部分：连锁品牌 B——当客户开始自己跑起来\n连锁品牌 B仍然是我辅助跟进的客户，但今年的跟进体感明显变轻了。\n它带着 2025 年全年实收同比增长 16%、第四季度实收同比增长 41.8%的基础进入今年。更重要的变化不只在数据，而在于客户自身能力的成长。\n现在，日常研发和产品上新已经能够由客户自主完成，我的角色更多是在关键节点提醒、检查计划完整性和查漏补缺。相比早期需要一步步推动执行，客户已经逐渐形成自己的判断和工作节奏。\n但在年中大活动的跟进中，我也看到了连锁品牌 B仍然存在的惯性。日常上新可以按照熟悉的节奏推进，一旦面对任务密度更高、协同要求更强的大活动，整体速度就较难提起来，仍然需要外部力量提前介入和持续推动。\n这也提醒我，客户“能自主完成日常工作”和“能主动完成阶段跃迁”是两种不同的能力。前者依赖熟练度，后者往往意味着打破惯性、重新分配资源和接受更高强度的协同。\n未来，我希望继续以辅助者的身份陪伴连锁品牌 B，但不只见证它把当前模式做得更熟练，也希望有机会看到它从 10 走向 100 的过程。\n三、内部工作：从个人效率到团队能力\n1. AI 与工具产品\nAI 是公司今年的重要项目，我主要参与了 SaaS 工具的需求分析、方案讨论、系统测试和问题反馈，也独立完成了知识库的迁移和一部分新内容的整理和迭代。\n围绕真实业务场景，上半年还持续探索了大活动策划、单店模型诊断等工具方向，参与梳理输入字段、判断逻辑、结果结构和使用流程，并通过网页原型和实际案例不断测试。\n这段过程中，我对 AI 工具的理解也发生了变化。\n一个好工具不是把所有历史资料一次性喂给模型，也不是追求一次生成一份看起来完整的答案，而是要把人的专业判断拆成模型可以理解的输入、步骤、规则和检查标准。真正困难的部分，往往不是让 AI“写出来”，而是我们自己能否把业务逻辑讲清楚。\n2. 数据与知识基建\n上半年，我持续参与公司知识库、客户财报 BI 和经营数据 BI 的建设、更新和问题反馈。\n知识库逐渐从“有很多资料，但不容易找到”，变成团队查找模板、流程、案例和方法时的常用入口。围绕项目交付、客户档案、方法模板、行业案例、内部工具和 Bot 问答，我重新梳理了信息结构，也补充了索引和使用路径。\n客户 BI 则逐渐成为公司数据录入自动化的一环。对我来说，这类工作看起来不像客户项目那样有明确的高光节点，但它们会持续减少团队的重复劳动，让数据更容易被查询、比较和用于判断。\n去年，我更多是把信息变成方法；今年，我开始尝试把方法放进团队可以反复使用的系统里。（这也是我去年年底复盘的重要命题）\n3. 培训与分享\n上半年完成了两次数据板块培训：一次是面向项目助理的初阶数据分析，一次是面向项目经理的单店盈利模型分析。\n单店模型培训是在外部窄门课程的基础上，重新结合蛋糕烘焙业态进行整理，把泛餐饮知识转化为“收入够不够、成本扛不扛得住、回本快不快”的三步判断法，并补充堂食、外送、生日蛋糕和综合烘焙等不同门店模型。\n内部分享共完成 5 次：\n2 月 28 日：客户财报整理\n4 月 30 日：AI 发展极简史——从 Chatbot 到 Agent\n5 月 29 日：新鲜零食店怎么突然火起来了\n6 月 12 日：字节跳动如何做增长\n6 月 26 日：运营中台·团队知识库\n这些分享仍然带有很明显的个人特点：理性脑为主，工具和方法较多，也会因为商业上的好奇去深挖一个行业或案例。\n它们能提供信息和框架，但表达维度还不够丰富。下半年，我希望在理性脑之外，带入更多感性脑，让分享不仅回答“这件事是怎么运转的”，也能回答“这件事为什么值得在意”。\n四、经验总结\n1. 从信息加工走向方法产品化\n过去，我习惯的信息处理路径是输入、加工、输出：先大量收集信息，再归纳成框架，最后通过方案、复盘或分享完成表达。\n今年，这条路径继续向前走了一步：从输出一份内容，变成尝试搭建一套可以被复用的工具、模板和知识系统。\n我开始更关注一个方法需要哪些输入、经过哪些判断、输出什么结果，以及如何检验结果是否可靠。\n2. 策略正确不等于结果自然发生\n零售品牌 A和连锁品牌 B共同提醒我：客户听懂了策略、认可了方向，只是开始。\n研发能否按时、部门是否协同、负责人是否明确、测试是否提前、节奏能否被持续推动，都会决定策略最后是停留在 PPT 里，还是进入真实经营。\n项目经理的价值不仅是提出正确答案，也包括识别客户组织能否承接答案，并根据承载能力调整路径和节奏。\n3. 团队贡献成为新的价值来源\n上半年让我很有获得感的部分，并不只来自客户增长，也来自知识库、BI、培训、分享和 AI 工具逐渐被团队使用。\n这些工作把个人经验转化为公共资产，也让我从“完成自己的交付”向“参与组织能力建设”走了一步。\n这可能不会像一场大活动一样迅速出现漂亮数字，但当团队查资料更快、数据处理更省力、同事能直接使用工具解决问题时，它会形成更持久的价值。\n五、2026 年下半年规划\n（一）关键目标\n1.推动零售品牌 A从阶段性增长走向能力建设，让策略能够被组织稳定承接；\n2.继续辅助连锁品牌 B，在关键活动和阶段变化中帮助客户突破惯性；\n3.持续辅助内部 AI SaaS工具的推广，以及从原型和测试阶段进入真实使用阶段的持续迭代；\n4.持续完善数据与知识库基建，保持工具的迭代。\n（二）关键结果\n1. 零售品牌 A\n●持续跟踪营业额、渠道结构、复购率、会员增长和产品贡献，以上过程数据能和结果数据增长有明确的逻辑关联，下半年营业额同比增幅能达到15%+，年底大活动月能达到同比增幅30%+；\n●围绕提案中的三项能力，建立起能初步稳定、持续运转的上新流程、渠道运营流程，并在年底前逐步通过旺季上新&大活动逐步帮客户建立出内部更好运转的人员分工和激励机制（借假修真）；\n持续思考品牌声量的打造问题，扩大徐州的本地声量，逐步打造零售品牌 A在徐州蛋糕市场领先地位。\n2. 连锁品牌 B\n●继续保持辅助和查漏补缺的角色，不替代客户已经具备的自主能力,而在客户缺乏的总结、深度分析角度提供支持；\n●围绕连锁品牌 B从 1-10 向 10-100 过渡的过程，记录产品、组织和渠道变化，能输出有阶段性视角的复盘观点。\n3. AI 与数据基建\n●持续跟进 SaaS 系统测试与反馈，推动高频问题形成明确的修复和验收清单，协助完成不少于三轮重点功能迭代；\n●继续优化客户财报、经营数据 BI和知识库更新维护，让新增内容能够被查到、被团队复用。\n4. 培训与分享\n●下半年至少完成4次内部分享。\n六、结语\n上半年，有新客户来了又走，有新客户开始增长，也有老客户变得更成熟；有熟悉业务里的方法复用，也有陌生行业中的边界碰撞；还有一些过去只存在于想法里的工具，开始慢慢长出可以被使用的形态。\n外界的主流叙事依然是AI 和经济下行，这两者杂糅在一起时，嘈杂声愈加嘈杂。\n但与其使劲辨别噪音和信号，不如先往前走，在真实问题中摸索，在一次次使用、测试和修正中建立判断。\n令我感到有信心的是，我看到我们这个组织也在这样做。我们未必一开始就知道正确答案，但愿意尝试，愿意反馈，也愿意把新东西放进真实业务里检验。\n四面八方都是前方。\n下半年，更轻快地前行。",
  "s29": "# 连锁品牌 B · 客户档案\n\n> 维护人：Mirror（Mirror）｜建档：2026-10-16｜最近更新：2026-10-16\n> 归档目录：`D:\\工作\\连锁品牌 B\\`\n> 信息源：桌面 `客户文件夹\\连锁品牌 B\\` 下的提案 / 复盘 / 月会文档（详见第九章「已归档源数据」）。\n> 本档案随项目推进持续补充。**每条数据标注来源，改动前先确认。**\n\n---\n\n## 一、客户基本盘\n\n| 项目 | 内容 | 来源 |\n|---|---|---|\n| 品牌全称 | 连锁品牌 B | 全部文档 |\n| 所在城市 | 华南某重点城市（配送范围＝同城配送圈） | 25年复盘&26年规划 P67 |\n| 品牌定位 | 生日蛋糕为核心，兼节日蛋糕、四季蛋糕、造型蛋糕、下午茶甜品 | 25年复盘&26年规划 P57–P58 |\n| 经营模式 | 直营门店 + 联营门店；「4 厨房 + 9 门店」的中央生产+多店分发结构 | 提案8.26 P50 |\n| **在营门店（现状）** | **8 家**（直营 4 + 联营 4） | 经营月会 2026-09 |\n| 　├ 直营 4 家 | 直营一店、二店、三店、四店 | 年度沟通会 P40；月会 2026-09 |\n| 　└ 联营 4 家 | 联营一店、二店、三店、四店 | 月会 2026-09 |\n| **门店沿革（期间有开关店）** | 提案期（2025-08）走访 **7 家** → 2025-10「新店开业·九店同庆」（9 店）→ 截至 2026-09 在营 **8 家**；合作期内有开有关，长安店已不在 2026-09 门店表中 | 提案8.26 P33–P34、P105；月会 2026-08 / 2026-09 |\n| 合作关系 | 运营中台 × 连锁品牌 B = **品牌增长咨询**（产品/价格/渠道/推广 4P 重构 + 落地陪跑） | 提案8.26 P2、P62 |\n| 项目阶段 | 首期合作 2025-08 → 2026-07 已收官（完成率 96.6%），进入下一阶段（2026-08 起） | 年度沟通会 P2、P34、P84 |\n\n**战略标签（Mirror 判断，待与客户对齐）**：单城多店、中央厨房 + 卫星门店、以小程序私域为主阵地的蛋糕品牌；从「网红下午茶」向「口味蛋糕」心智迁移。\n\n---\n\n## 二、合作关系与服务范围\n\n| 项目 | 内容 | 来源 |\n|---|---|---|\n| 服务方 | 运营中台（所有交付文档出品方） | 提案8.26 P2 等 |\n| 首期周期 | 2025-08 – 2026-07（12 个月） | 年度沟通会 P2、P35 |\n| 计划表机制 | 13 个计划表、共推进 **380 项**工作；完成 367 项、进行中 6 项、待开始 7 项 | 年度沟通会 P34、P73 |\n| 首期完成率 | **96.6%**；含进行中事项推进率 98.2% | 年度沟通会 P34 |\n| 服务内容 | 品牌增长飞轮、三级火箭活动体系、产品/价格体系搭建、公私域营销体系、会员体系、渠道运营、产品展示、活动执行 | 年度沟通会 P63–P64、P84、P86–P92 |\n| 能力沉淀 | 基础运营流程搭建（12 个月）、体系搭建（12 个月）、单店模型打磨（11 个月） | 年度沟通会 P84 |\n| 客户方 | 门店端 + 研发 / 品牌 / 营运 / 采购 / 会员 多岗位协同（未留具体对接人姓名） | 年度沟通会 P84 |\n\n**方法论（运营中台自有模型）**\n- **增长飞轮**：流量思维探路 → 数据思维优化 → 最小单元试错 → 用户思维中心永不变｜年度沟通会 P63\n- **三级火箭活动体系**：Ⅰ级高频触达（会员周/群互动/平台互动）→ Ⅱ级新品上新（建议月月上新）→ Ⅲ级特殊节点（2.14 / 5.20 / 七夕 / 圣诞 / 快闪）｜提案8.26 P91；Q1季度会 P10\n- **1261 产品结构**：招牌 10%（认知）+ 流量 20%（传播&竞争）+ 基石 60%（利润&体验）+ 新品 10%（迭代）｜提案8.26 P65；年度沟通会 P76\n\n---\n\n## 三、渠道结构\n\n| 渠道 | 定位 / 状态 | 来源 |\n|---|---|---|\n| 线上商城（小程序商城） | 私域主阵地；2026-09 占比 **47.78%**，已成第一大渠道 | 月会 2026-09 |\n| 美团外卖 | 第一大公域外卖；2026-09 占比 33.00% | 月会 2026-09 |\n| 淘宝闪购（原饿了么） | 2026-09 占比 10.73%，同比 **+363.81%**，增速最快 | 月会 2026-09 |\n| 美团团购 | 2026-09 占比 5.39%，环比 +26.35% | 月会 2026-09 |\n| 抖音（团购核销 + 直播） | 2026-09 占比 3.11%；单场大播成交最高约 23.17 万（截至 2026-08-02 累计口径见第五章） | 月会 2026-09；年度沟通会 P58 |\n| 小红书 | 种草阵地；博主投放 + 裂变。截至 2025-12-16，20 位博主产生 11 万+ 浏览 | 年度沟通会 P49、P50 |\n| 大众点评 | 有博主笔记引流（截至 2025-12-16 超 1.97 万浏览），未见团购套餐运营 | 年度沟通会 P49 |\n| 门店堂食 | 线上商城口径下的「门店」渠道，非独立堂食统计 | 年度沟通会 P40 |\n\n**配送口径**（三份文档一致）：可配送范围＝同城配送圈；满 168 元全市免费配送；满 38 元 + 6 元送 5 公里；超出部分自提无配送费｜25年复盘&26年规划 P67；Q1季度会 P12、P44\n\n---\n\n## 四、商品与产品结构\n\n### 4.1 SKU 与集中度变化\n\n| 口径 | 2025-07 | 2026-07 | 变化 |\n|---|---|---|---|\n| 在售 SKU | **106 个** | **53 个** | −53 |\n| TOP20 贡献营业额 | 56% | **72%** | +16pp |\n| 80% 营业额所需 SKU | 42 个 | **25 个** | −17 |\n\n来源：提案8.26 P48（231 款为提案时点的在售口径，与年度沟通会 106 款口径不同，见第八章）；年度沟通会 P54、P55\n\n### 4.2 规格结构（2026-07）\n\n| 规格 | 上架率 | 销量占比趋势 | 均价趋势 |\n|---|---|---|---|\n| 4 寸 | **56%** | 2025-01 至今持续提升 | 基本持平 |\n| 5 寸 | **88%** | 基本持平 | 持续提升 |\n| 6 寸及以上 | — | 持续下降 | 基本持平 |\n\n来源：年度沟通会 P79、P80、P81\n> 合作前（2025 年 1–7 月）**无 4 寸上架**；2025 年 8–12 月 4 寸上架率不足 20%。\n\n### 4.3 爆品演变\n\n| 时点 | TOP1 | TOP5 |\n|---|---|---|\n| 2025-07 | 满桃心意 16,110.49 | 缤纷酸奶 10,219.74、藻蓝蛋白蓝莓酸奶 10,076.91、榴莲冻芝士 9,422.82、焙茶小确杏 8,923.33 |\n| 2026-07 | 桃见茉莉 42,093.70 | 山竹榴莲烤布蕾 28,402.61、杨枝芒芒2.0 20,463.79、榴莲脆皮梦龙 17,371.88、桃语云间 17,209.60 |\n| 2026-08（线上商城） | 桃见茉莉 25,505.01（占商城实收 5.95%） | 山竹榴莲烤布蕾 20,066.13、蜜桃瀑布 18,939.89 |\n| 2026-09（线上商城） | 秋野拾栗 32,418.13（占商城实收 8.54%） | 杨枝芒芒2.0 19,066.63、紫雾葡萄2.0 16,413.02 |\n\n来源：年度沟通会 P54、P55；月会 2026-08、2026-09\n\n### 4.4 上新机制\n\n**标准流程**：概念落地 → 测试准备 → 打样算成本 → 检查工艺 → 物料准备 → 门店上新 → 定版 → 二次调整 → 体验官体验 & 门店静默 → 数据跟踪｜提案8.26 P92；年度沟通会 P67\n> 节日款不计入常规上新流程。\n\n**上新节奏**：2025 年 9–12 月共上新 **26 款**（秋季栗子季、秋季、热点、冬季草莓季、冬季车厘子）｜25年复盘&26年规划 P34\n\n**Q4（2025-09～12）上架后 30 天销量 TOP5**：海盐焦糖坚果 205（10/12）、雪山草莓3.0 187（11/28）、烤布蕾奶皮子 181（9/26）、满满莓好2.0 172（11/28）、草莓巧克力布蕾 166（11/28）｜同 P34\n\n### 4.5 产品问题（截至提案期）\n\n- SKU 数过多、结构混乱，**影响整体产能**｜提案8.26 P48\n- 50% 营业额需 24 款产品支撑、80% 需 59 款支撑（帕累托，2025 年 1–7 月实收口径）｜提案8.26 P48\n- 4 寸上架率至 2026-07 仍不足 60%，**低门槛产品供给不足**｜年度沟通会 P79\n\n---\n\n## 五、关键经营数据\n\n### 5.1 首期合作年度对比（全渠道 · 2025/8–2026/7 vs 2024/8–2025/7）\n\n| 指标 | 2025/8–2026/7 | 2024/8–2025/7 | 年同比 |\n|---|---:|---:|---:|\n| 订单 | 98,233 | 83,938 | +17% |\n| 应收 | ￥12,547,362 | ￥8,808,060 | +42% |\n| 实收 | **￥10,252,992** | ￥7,533,445 | **+36%** |\n| 单均 | ￥104 | ￥90 | +￥14 |\n| 折扣率 | 82% | 86% | −4pp |\n| 月均实收 | ￥854,416 | ￥627,787 | +36% |\n\n来源：年度沟通会 P38｜口径：全部门店的线上商城 + 外卖 + 团购合计\n\n### 5.2 分渠道年度（合作后 vs 合作前）\n\n| 渠道 | 合作后实收 | 合作前实收 | 占比（后 / 前） | 占比变化 |\n|---|---:|---:|---|---:|\n| 商城（线上商城） | ￥4,694,774 | ￥3,455,511 | 46% / 46% | 0pp |\n| 外卖（美团+闪购） | ￥4,589,890 | ￥3,024,985 | 45% / 40% | **+5pp** |\n| 抖音团购 | ￥412,756 | ￥342,157 | 4% / 5% | −1pp |\n| 美团团购 | ￥555,573 | ￥710,792 | 5% / 9% | **−4pp** |\n\n来源：年度沟通会 P44｜**关键结论：合作后外卖占比提升的 5pp，全部来自美团团购（−4pp）与抖音团购（−1pp）的转移。**\n\n### 5.3 最新月度（2026-08 / 2026-09）\n\n**全渠道总览**\n\n| 指标 | 2026-08（8/1–8/30） | 2026-09（9/1–9/27，27 天） |\n|---|---:|---:|\n| 全渠道实收 | ￥925,130.92 | **￥794,614.72** |\n| 环比 | 日均 −5.5%（vs 7 月） | −3.10%（vs 8/1–8/27） |\n| 同比 | 日均 **+86.5%**（vs 去年 8 月） | **+47.56%**（vs 去年 9/1–9/27） |\n| 订单 | 7,520 单 | 6,065 单 |\n\n来源：月会 2026-08、月会 2026-09\n\n**分渠道（2026-09）**\n\n| 渠道 | 9 月实收 | 8 月实收 | 环比 | 去年 9 月 | 同比 | 9 月占比 |\n|---|---:|---:|---:|---:|---:|---:|\n| 线上商城 | 379,683.71 | 378,240.40 | +0.38% | 265,725.87 | +42.89% | 47.78% |\n| 美团外卖 | 262,208.48 | 292,162.53 | −10.25% | 239,178.82 | +9.63% | 33.00% |\n| 淘宝闪购 | 85,230.53 | 83,431.09 | +2.16% | 18,376.12 | **+363.81%** | 10.73% |\n| 抖音核销 | 24,691.60 | 32,304.40 | −23.57% | 15,216.30 | +62.27% | 3.11% |\n| 美团团购 | 42,800.40 | 33,873.70 | **+26.35%** | 0.00 | — | 5.39% |\n| **合计** | **794,614.72** | 820,012.12 | −3.10% | 538,497.11 | +47.56% | 100.00% |\n\n来源：月会 2026-09｜口径：三周期天数一致（均 27 天），直接对比不做日均折算\n\n**分门店（2026-09，仅环比；线上商城+美团外卖+淘宝闪购口径）**\n\n| 类型 | 门店 | 9 月实收 | 8 月同期 | 环比 |\n|---|---|---:|---:|---:|\n| 直营 | 东城店 | 110,650.01 | 105,729.65 | +4.65% |\n| 直营 | 南
