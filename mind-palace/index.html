  "s42": "# 我喂了一只流浪猫，才慢慢看懂自己适合过什么生活\n\n楼下的奶牛猫流浪猫，已经两天没出现了。\n\n我知道流浪猫的寿命不会太长，也早就给自己做过心理准备：也许哪一天下楼，它就不在了。可这个念头真的冒出来时，我还是会难过得想哭。\n\n奇怪的是，我又没有把它带回家。\n\n家里已经养了两只猫，我知道再增加一个生命，不只是多放一碗粮。它可能生病，可能和原来的猫相处不好，可能在未来几年里持续占据我的时间、钱和精力。我现在的生活，也没有宽裕到可以再承担一份没有上限的责任。\n\n所以我没有带它回家，只是给它起了名字，长期喂它，留意它有没有受伤，也提前接受它可能突然消失。\n\n这件事曾经让我怀疑自己：我会为它难过，却不肯为它负责到底，这算不算一种伪善？\n\n后来我才发现，问题不在于我够不够善良。流浪猫只是让我看见了自己一直以来的运行方式。\n\n## 我对一只猫的选择，暴露了我的底层操作系统\n\n我一开始以为，自己的共情是对所有动物的怜惜。\n\n可回头看，并不是。\n\n我不会因为“流浪动物很可怜”就平均地心疼每一只动物。我和流浪猫建立了具体的记忆：它每天大概什么时候出现，它喜欢待在哪里，它比刚来时瘦了还是胖了。因为它有了名字，成了一个能被认出的个体，我的感情才真正落下去。\n\n我的共情是定点的，不是铺开的。\n\n后来院子里出现了一只更小的弃养猫，我的注意力又很自然地偏过去。等新的狸花猫和黑猫出现，它们看起来更能保护自己，流浪猫重新变成了那个更弱、更需要照看的个体，我又开始把注意力放回它身上。\n\n这也不是我格外偏心。我的情绪和精力本来就有限，会自动去找“此刻最弱、最需要被托一把”的那个对象。它不一定是所有生命里最惨的，只是我在当下真实看见、并且还能承受去关心的那一个。\n\n还有一次，我遛自己的猫小猫。它乱跑时，我脑子里突然闪过一个念头：抓不回来就算了。\n\n这个念头只存在了一瞬间。\n\n下一秒，我就想到它可能会挨饿、受冻、受伤，心疼得受不了。那不是我不爱它，只是长期照顾一个生命，偶尔也会让人想从责任里喘口气。人脑子里闪过的念头，和别人看见的行为，有时完全是两回事。\n\n把这几件事放在一起，我发现自己反复做的是同一个动作：\n\n先看见一个具体生命正在受什么苦；马上在心里算，我能不能长期承担；接着在有限的钱、时间和精力里做排序；最后允许自己牵挂，但守住行动边界。\n\n这就是我的底层操作系统，可以概括成四个词：定点共情、风险预算、资源排序、行动边界。\n\n我不是对所有苦难平均心软，也不会让心软替自己签下一张承担不起的账单。\n\n但我也不是冷漠。我的情绪是真的，预演失去时流的眼泪也是真的。我只是把“我心里有多难受”和“我行动上愿意承担多少”分成了两件事。\n\n说得再直接一点：我先看见情绪，再启动风控。\n\n## 这不是善良或不善良，而是我如何做选择\n\n很多人会把这种行为理解成理智压过感情。可我自己知道，感受从来没有关掉。\n\n我会提前想流浪猫有一天可能消失，会在小猫乱跑时瞬间想到它走失后的生活。提前预演最坏结果，不是因为我盼着坏事发生，而是我希望坏事真出现时，自己还能做出选择，不会完全被冲垮。\n\n代价是，我要比事情真正发生更早地经历一遍焦虑。\n\n所以我身上经常同时存在两个部分：一个接收器对具体的人和动物开着，能敏锐地感到对方哪里疼；一个闸门握在自己手里，负责算成本、承受力和后果。\n\n感受是真的，闸门也是真的。\n\n这也解释了我为什么很难接受两种极端。完全只看数字、不承认人的感受，会让我觉得世界太硬；持续接收苦难、没有边界、要求无限付出，又会很快把我掏空。\n\n我需要的事情，既要能理解人，也要允许我算账；既要能产生真实帮助，也要允许我说“到这里为止”。\n\n## 把视线从猫移到工作，很多选择一下就对上了\n\n我做商家咨询和经营规划时，经常要听客户讲自己的委屈、焦虑和愿望。\n\n有些客户会让我很自然地想帮，可我不能因为心疼，就答应一个根本落不了地的方案。品牌真正需要的，也不只是一个人陪它喊苦，而是有人听懂它为什么难，再评估产品、渠道、现金流、团队和执行能力，决定哪些事现在做，哪些先不做。\n\n这和照顾流浪猫是同一套逻辑。\n\n我的共情不会平均撒给所有客户，而会优先放在那个具体问题最痛、又真的愿意行动的客户身上。资源也不会铺满所有渠道，只会投向最可能改变结果的地方。更重要的是，我不能为了证明自己是个好人，就接下超出交付能力的项目。最后做不出来，对客户和我都不负责任。\n\n想明白这层以后，我对自己适合什么工作的判断也变清楚了。\n\n它未必是某个固定行业，但大概率需要三种空间：\n\n能接触真实的人，理解他们的处境；能分析成本、风险和资源，不靠情绪拍脑袋；能明确服务边界，不把无限负责当成职业美德。\n\n如果一份工作只剩数字、流程和效率，我可能会做得不错，但不会真正有生命力。反过来，如果一份工作要求我持续承接别人的痛苦，却没有拒绝、收费和退出的边界，我很快会被消耗。\n\n与我更匹配的，是咨询、经营规划、项目评估、产品策划、资源配置这类工作：事情有具体对象，判断有成本约束，交付有结果，也有边界。\n\n当然，底层操作系统不能直接替人指定职业。同一套底色，可以进企业，可以做独立服务，也可以做内容或产品。真正要决定的，不是“什么职业名字最适合我”，而是“什么环境能让我的优势变成结果，又不让我长期支付最贵的代价”。\n\n## 生活也是一样，温柔不等于无限接管\n\n这套逻辑不只出现在猫和工作里。\n\n面对家人、朋友、金钱和未来的计划，我也会先想：这件事我能不能持续做，最坏的情况是什么，我愿意拿出多少资源。\n\n以前我会觉得这种反应太冷静，好像连关心都要经过计算。现在我知道，计算并不取消感情，它只是保证感情不会把自己和对方一起拖进更糟的局面。\n\n对流浪猫，我能稳定投喂、观察健康、接受它作为流浪猫的不确定命运，但不强行承担一个超出当前生活的收养责任。\n\n对工作，我可以认真理解客户，但不能靠无限加班和无限售后证明自己有责任感。\n\n对关系和生活，我可以牵挂、投入、提前准备，但不能把所有风险都提前消灭，也不能因为害怕失去就控制一切。\n\n这不是“只管自己”。真正的长期善良，需要先承认资源和能力的上限。没有边界的付出，短期像牺牲，长期往往变成怨气、失约，或者对真正需要帮助的人二次伤害。\n\n我更适合小而稳定的持续投入，而不是声势很大的全面拯救。\n\n## 我最后给自己选的，不是一个人格标签\n\n看清自己以后，我没有因此认定“我天生就是什么样的人”，也没有把现在的一切都解释成性格。\n\n我只是给自己定了几条更具体的择路标准。\n\n第一，继续做能理解人、也必须做经营判断的事。只靠共情，不够；只靠计算，也不是我。\n\n第二，把能力慢慢做成可以重复交付的产品，而不是靠无限响应客户来证明价值。这样既能保持稳定，也能保留判断和边界。\n\n第三，优先服务那些具体问题清楚、执行意愿真实的客户。我帮助的是能把事情往前推的人，不是替所有焦虑的人兜底。\n\n第四，在工作之外，保留少量稳定的善意。照顾流浪猫、做一点点确定能持续的帮助，比要求自己拯救所有流浪动物更适合我。\n\n第五，筛选环境时，不只看收入高不高、平台大不大，也看它会不会长期要求我关闭感受，或者要求我无限承担。前者让我枯萎，后者把我掏空。\n\n这份结论不能保证我以后不纠结，但它能解释我在纠结什么。\n\n我不是舍不得稳定，也不是不敢追求更大的发展。我要的是在风险可承受的前提下，让能力持续增长；不是不想做一个善良的人，而是不愿意把善良理解成没有边界地牺牲。\n\n## 你也可以从一件小事里，看出自己该往哪儿走\n\n如果你也总觉得对现状不满意，又说不清自己适合什么，不一定要先做一份职业测评。\n\n先找三到五件你真的做过、并且付出过代价的选择。不是“我理想中会怎么做”，而是当时到底发生了什么。\n\n写下当时的情境，你最怕失去什么，最后保住了什么，又付出了什么代价。\n\n然后不要急着给自己贴性格标签，去找反复出现的动作。\n\n你最容易注意到谁？你遇到冲突时先保护什么？什么代价你付了一次还愿意再付？什么回报再高，你也不愿交换？什么环境会让你的恢复时间明显变长？\n\n把这些答案放在一起，你会得到一句比“我内向”“我理性”“我共情能力强”更有用的话：我愿意长期用什么，换取什么；我不能交换什么；我该在什么环境里积累。\n\n接着，不要立刻辞职、转行或重做人生规划。先用九十天做一个小实验，看三件事：你在这个环境里有没有产出，有没有真实反馈，长期消耗能不能恢复。\n\n适合你的路，未必让你天天开心。它更可能让你在辛苦之后，知道自己为什么值得。你会愿意继续练，也能守住不想交换的东西。\n\n我对流浪猫的感情，没有把我变成所有流浪动物的救助者。它只是让我更准确地知道：我可以牵挂一个具体生命，也可以承认自己只能承担一部分责任。\n\n看清这一点以后，我要选的就不是“怎样成为一个更完美的人”，而是“把有限的能力和善意，放到哪些真的能持续的地方”。\n\n这可能才是一个人从自我识别，走向职业和生活选择的开始。",
  "h5/情报平台/index": "# 消费与零售 垂类情报台\n\n一个自包含的静态情报站 + 一条可运行的抓取链。双击 `index.html` 就能看，不依赖网络、不依赖任何 CDN。\n\n## 目录\n\n```\n情报平台/\n├── index.html      ← 成品。数据已内嵌，可直接打开/发送/托管\n├── template.html   ← 页面骨架（不含数据），改样式改这里\n├── build.py        ← 把 data/*.json 注入模板，生成 index.html\n├── fetch.py        ← 抓可自动化的信源，产出待审草稿\n└── data/\n    ├── feed.json     ← 情报流（主数据，人工/AI 维护）\n    ├── brands.json   ← 品牌档案\n    ├── sources.json  ← 信源分层 + 可抓取性矩阵\n    └── draft.json    ← fetch.py 的产物（待审，不直接上线）\n```\n\n## 三条命令\n\n```bash\npython3 build.py      # 改完 data/ 里的 json 后，重新生成 index.html（带硬校验）\npython3 fetch.py      # 抓红餐网等媒体，写 data/draft.json\npython3 fetch.py --show   # 只看抓到什么，不落盘\n```\n\n`build.py` 会拦下这几类错误：缺 id、id 重复、category 不在枚举里、\n**有 date 但 date_precision 写成 unknown 以外的值却没有日期**、count 与实际条数不符。\n校验不过就不生成页面，避免把错数据发出去。\n\n## 更新一次情报的完整流程\n\n1. `python3 fetch.py` → 看 `data/draft.json`，媒体侧的新文章在这里\n2. 公众号侧靠检索补：搜「品牌名 + 上新/首店/联名」，命中的 `mp.weixin.qq.com` 正文取回来\n3. 把可用的条目并入 `data/feed.json`，补齐 `brand_id / category / module / detail / source`\n4. `python3 build.py` → 新页面生成\n5. `count` 字段跟着条数一起改，否则 build 会报错\n\n## 能力边界（重要，别对外承诺做不到的事）\n\n| 信源 | 能否自动 | 说明 |\n|---|---|---|\n| 行业媒体（红餐网等） | ✅ 可全自动 | `fetch.py` 已跑通，按品类词过滤后只留相关条目 |\n| 品牌公众号 | ⚠️ 需检索命中 | 微信无公开接口；靠搜索命中 `mp.weixin.qq.com` 后取正文，链接带签名有时效 |\n| 商场/地方公众号 | ⚠️ 需检索命中 | 首店信息的第一落点，同样走搜索 |\n| 小红书 / 抖音 / 大众点评 | ❌ 无接口 | 三家均无公开 API，Cookie 抓取违反协议且极易失效。只标账号，不承诺采集 |\n| 企查查 / 窄门餐眼 | ❌ 需人工 | 付费或无接口，用于核验经营主体与门店数 |\n\n**公众号这块的实话**：微信没有给第三方留任何合规的批量读取口子。任何声称能稳定全量抓公众号的方案，\n用的都是灰产接口或者随时会死的 Sogou 代理。目前唯一能长期跑的办法是\"检索命中 → 取正文 → 人工判相关性\"，\n也就是让 AI 每周跑一次检索任务，而不是部署一个爬虫。\n\n## 数据诚实约定\n\n- 日期四级：精确到日 / 只知月 / 只知季节 / 原文未标。**不可考的一律显示「日期待核」，不补推测值。**\n- 品牌自述数据（战报 GMV 等）标「品牌口径」，不当第三方数据用。\n- 加盟招商站的门店数不采信（茶聚场被标 547 家、实际 6 家；可露朵被标 319 家、品牌方口径 14 家）。\n- `confidence: medium` 的条目会在卡片上显示「置信中」。\n\n## 已知待办\n\n- `data/feed.json` 里有 7 条媒体来源没抓到具体原文 URL，页面上显示为不可点。补链接即可。\n- `brands.json` 里公众号的 `biz` 参数全部留空——用品牌名猜 biz 会抓错号，需逐个核对后填。\n- 一见岚的三款新品只有「九月 / 初秋」这类相对时间，年份待核。\n",
  "s44": "---\nname: customer-full-case-marketing-proposal\ndescription: Use this skill when creating or rewriting a client-facing full-case marketing proposal for a local consumer brand, retail store, F&B, bakery, lifestyle business, or similar owner-led business. It helps turn scattered research, sales data, field notes, market observations, and founder goals into a clear, persuasive, evidence-led proposal that a non-marketing business owner can understand and act on. It is especially useful for 1-2 hour pitch meetings, growth consulting proposals, brand/traffic/channel/product diagnosis decks, and marketing retainer proposals.\n---\n\n# 客户全案营销方案提案 Skill\n\n## 目标\n\n把客户资料、经营数据、现场调研、老板目标和团队判断，整理成一份能在 1-2 小时提案会上讲清楚的全案营销方案。\n\n最终提案必须让不懂数据和营销的老板做到三件事：\n\n- 听懂：知道现在发生了什么，不被术语绕晕。\n- 被击中：觉得你讲的是 TA 的真实问题，不是套模板。\n- 能行动：知道接下来先做什么，为什么先做这些。\n\n## 适用场景\n\n适用于本地消费品牌、烘焙甜品、餐饮、零售、生活方式门店、老板 IP 驱动型品牌、平台流量型商家、私域/复购待提升商家。\n\n不适用于纯广告创意案、纯视觉品牌手册、纯投放账户优化报告、只有执行排期但没有经营诊断的项目。\n\n## 输入资料清单\n\n优先收集以下资料。资料不完整时也可以工作，但要把待验证假设显式标出。\n\n- 客户现有提案或历史版本：用于理解原始思路、已有内容和不能丢的部分。\n- 参考提案：用于判断叙事深度、证据组织、页面节奏和表达颗粒度。\n- 经营数据：销售额、实收、应收、渠道占比、SKU、客单、核销、复购、活动数据。\n- 平台数据：抖音/小红书/美团/点评/外卖/小程序/私域等。\n- 现场调研：门店照片、竞品照片、产品测试、用户路径、服务流程、后厨/交付流程。\n- 老板访谈：目标、焦虑、期待、资源、历史阶段、团队能力、已踩过的坑。\n- 团队判断：SWOT、4P、用户路径、增长卡点、落地动作初稿。\n\n如果用户从零提出“帮我做一份客户提案”，先让用户按以下格式补充上文。不要一上来直接做 PPT。\n\n```text\n我要给【客户名】做一份【目的】提案，提案对象是【谁】，会议时长【多久】。\n客户目前做【业务】，发展历程是【简述】，现在目标是【目标】，老板最焦虑【问题】。\n我已有资料包括【PPT/Excel/照片/调研/访谈/截图】。\n数据口径说明：【哪些是全渠道，哪些不是】。\n我初步判断是：【你的判断】。\n我希望提案风格：【结构化/打动老板/高级咨询感/落地执行型】。\n必须保留：【内容】。\n可以改动：【内容】。\n最终需要输出：【PPT/Word/演讲稿/素材清单/测算】。\n```\n\n如果资料缺失，不要空泛带过。必须在提案原文留出占位，并标注需要用户补充的素材类型：\n\n- `[待补充：近12个月月度实收数据，用于判断增长趋势]`\n- `[待补充：小程序下单路径截图，用于确认客服承接问题]`\n- `[待补充：竞品门店照片3-5张，用于对比产品陈列和价格带]`\n- `[待补充：近3个月各渠道成交/核销/客单数据，用于测算渠道优化收益]`\n\n## 核心原则\n\n### 1. 先讲事实，再给判断\n\n不要一开场就丢一句大结论或口号。先用少量事实收敛出直观感受，再给阶段判断。\n\n推荐顺序：\n\n1. 客户现状事实：增长趋势、流量势能、平台表现、客户资产、产品基础。\n2. 关键矛盾：为什么现在不是简单多发内容、多做活动。\n3. 阶段判断：客户正处在哪个经营阶段。\n4. 主张表达：用一句老板能记住的话收束。\n\n差的表达：\n\n> 你们必须从网红流量升级成招牌心智。\n\n更好的表达：\n\n> 零售品牌 A不是没有流量，而是要让顾客下一次想买蛋糕时，先想到你、买得到你、还愿意再回来。\n\n### 2. 结论要接地气，不要过度制造紧迫感\n\n如果数据仍在增长，不要把问题讲成“马上危险”。应把问题定义为“要成为头部和常青树，必须补齐的能力”。\n\n判断客户阶段时区分：\n\n- 红利仍在：表达为“有基础、有窗口、有机会坐稳”。\n- 红利衰退：表达为“流量效率下降，需要修复增长系统”。\n- 已经承压：表达为“先止血，再重建增长动作”。\n\n### 3. 诊断逻辑必须从“看到什么”推到“卡在哪里”\n\n不要把待验证假设孤立成一页。假设应该成为论点的一部分。\n\n推荐表达链路：\n\n1. 先提出增长问题：离目标还有哪些卡点？\n2. 再给证据：数据、现场、竞品、访谈分别看到了什么。\n3. 然后确认卡点：根据事实动态归因，可能是产品、渠道、价格、内容、私域、流程、交付、组织、选址、供应链、会员、品牌心智等。\n4. 最后给解法：每个卡点对应一个可落地动作。\n\n如果存在未验证内容，写成：\n\n- 已确认：来自数据/现场/访谈的事实。\n- 待验证：现场需要继续观察的问题。\n- 对动作的影响：验证后会决定是否执行或调整哪个动作。\n\n卡点不允许固定套用“产品、渠道、流程”。必须先列出候选卡点，再根据证据强度和增长影响筛选 3-5 个主卡点。\n\n### 4. 给老板讲经营语言，给内部保留方法论\n\n面对老板时，不要直接堆 SWOT、4P、AARRR、漏斗等术语。可以用这些框架做后台分析，但前台页面要翻译成经营语言。\n\n后台分析：\n\n- SWOT：优势、劣势、机会、威胁。\n- 4P：产品、价格、渠道、推广。\n- 用户路径：看见、比较、下单、咨询、复购。\n\n前台表达：\n\n- 产品要被记住。\n- 渠道要接得住。\n- 流程要供得稳。\n- 客户池要被叫醒。\n- 价格体系要有秩序。\n\n当必须展示框架时，先解释它回答什么问题，再展示内容。不要突然出现缩写。\n\n### 5. 外部市场是辅助论点，内部卡点才是行动主线\n\n对本地门店型客户，市场分析不要喧宾夺主。外部市场通常回答“有没有机会”，内部诊断回答“为什么没完全吃到机会”。\n\n外部市场可看：\n\n- 城市消费空间：GDP、人均收入、旅游属性、客群流动。\n- 商圈结构：核心商圈集中度、门店可达性、竞品覆盖。\n- 本地品牌成熟度：强品牌入驻、同城投放、产品/陈列/内容水平。\n\n内部卡点优先看：\n\n- 产品结构：主推、价格带、场景、SKU、招牌感。\n- 渠道结构：平台、小程序、私域、外卖、团购之间是否打架。\n- 价格秩序：是否存在价格倒挂、低价平台训练用户。\n- 内容转化：是否只是看热闹，是否能引导下单。\n- 流程能力：研发、打样、定版、拍摄、上架、客服、出单是否有 SOP。\n- 客户资产：私域人数、标签、激活节奏、复购触达。\n\n### 6. 数据必须写清口径，不能过度外推\n\n提案中的每个数字都要知道来源和口径。\n\n尤其注意：\n\n- 小程序数据不能直接代表全渠道。\n- 线上商城/商城数据不能直接代表门店全部经营。\n- 应收、实收、核销、成交金额不要混用。\n- 平台销量不等于品牌利润。\n- 爆品成交不等于招牌心智。\n\n表达方式：\n\n- “该数据用于观察趋势，不作为全渠道收入结论。”\n- “该表为小程序、抖音团购核销、美团团购核销、美团外卖合计。”\n- “其他渠道数据缺失，需后续补齐后再做目标拆解。”\n\n### 7. 现场照片要服务观点，不要做素材堆砌\n\n每一页照片都必须回答一个问题：\n\n- 这张图证明什么？\n- 它和本页结论有什么关系？\n- 老板看完能意识到什么？\n\n常用照片证据页：\n\n- 商圈证据：证明流量可达性和消费场景。\n- 竞品证据：证明市场成熟度、产品呈现、价格带、陈列水平。\n- 产品测试：证明产品力、切面、口味、包装、招牌感差异。\n- 后厨/团队：证明流程、协同、效率、标准化问题。\n- 小程序/平台截图：证明转化路径、客服入口、价格倒挂、SKU缺口。\n\n不要把照片做成无解释的图库。照片页建议配一句结论和一句启发。\n\n### 8. 结构要能支撑 1-2 小时提案\n\n提案不是平均讲每一页，而是“主讲页 + 证据页 + 备查页”。\n\n1 小时建议：\n\n- 主讲 25-30 页。\n- 每页 1 个观点。\n- 产品测试、竞品照片、数据细节作为快速翻页证据。\n\n2 小时建议：\n\n- 主讲 35-45 页。\n- 可展开现场证据、产品测试、渠道拆解和落地节奏。\n\n### 9. 解法要有增长可预期性\n\n方案不能只写“建议做什么”，还要尽量回答“做完大概能带来多少增量”。即使客户不会做复杂测算，也通常有历史经营数据，可以用保守测算建立方向感。\n\n每个核心解法至少给出一种测算：\n\n- 增收：多卖多少单、提高多少客单、提升多少复购。\n- 提效：节省多少人工、减少多少返工、提前多少天上架。\n- 结构优化：高毛利产品占比提升、低价渠道占比下降、价格倒挂修正。\n- 风险控制：减少节点翻车、减少低价训练、减少爆品依赖。\n\n测算必须写清：\n\n- 使用了哪些历史数据。\n- 哪些是假设。\n- 保守/基准/乐观三个情景。\n- 还需要用户补充哪些数据才能算得更准。\n\n## 推荐提案结构\n\n### 版本 A：结构化诊断版\n\n适合内部过审、客户追问、需要显得逻辑完整的场合。\n\n1. 封面\n2. 目录\n3. 调研回顾：资料、现场、数据、访谈\n4. 品牌发展历程：客户从哪里来，走到什么阶段\n5. 经营现状：增长趋势、渠道结构、产品结构、平台势能\n6. 外部市场：城市、商圈、竞品、机会窗口\n7. 现场证据：商圈、竞品、产品测试、流程观察\n8. SWOT 诊断：内部优势/短板，外部机会/威胁\n9. 关键卡点确认：根据证据动态确认 3-5 个增长卡点\n10. 策略总览：每个卡点对应动作\n11. 重点策略：围绕已确认卡点设计对应动作\n12. 落地节奏：首月样板、30/60/90 天\n13. 附录：数据口径、照片归档、待验证清单\n\n### 版本 B：老板打动版\n\n适合正式提案主讲，尤其面对不懂数据和营销的老板。\n\n1. 封面\n2. 目录\n3. 开场判断：用一句经营语言讲清现状\n4. 三个事实：为什么说客户有基础、有窗口、有机会\n5. 阶段判断：不是危险，而是进入稳定经营期\n6. 目标背景：目标意味着要补哪些能力\n7. 外部机会：市场给了窗口\n8. 卡点总览：红利能否沉淀，卡在几件具体的事\n9. 卡点一：按客户真实情况命名，不固定套用产品/渠道/流程\n10. 卡点二：按证据强度和增长影响排序\n11. 卡点三：继续围绕真实卡点展开，必要时增加卡点四/五\n12. 重要但不紧急：看见但不首阶段解决的问题\n13. 诊断收束：把卡点收束成 2-4 项经营能力\n14. 专项一：针对第一主卡点的解法和收益测算\n15. 专项二：针对第二主卡点的解法和收益测算\n16. 专项三：针对第三主卡点的解法和收益测算\n17. 先改哪几件事：按收益、难度、紧急度排序\n18. 样板动作：选一个最容易验证的动作跑通\n19. 增长预期：保守/基准/乐观三种测算\n20. 启动样板：第一个月先跑通一次\n21. 30/60/90 天节奏\n22. 结束页：让老板记住下一步\n\n## 逐页素材清单规则\n\n生成提案时，每一页都要先写清素材需求。若素材缺失，必须在页面正文或备注中留出占位。\n\n每页素材清单格式：\n\n- 页面目的：事实 / 判断 / 证据 / 转译 / 动作 / 测算。\n- 已有素材：可直接使用的数据、表格、照片、截图、访谈语句。\n- 需要补充：用户需要提供的数据图、数据表、照片、截图或访谈信息。\n- 缺失时处理：用占位文案、待验证标记或保守假设替代。\n\n常见页面和素材要求：\n\n| 页面类型 | 必备素材 | 可选素材 | 缺失时占位写法 |\n|---|---|---|---|\n| 开场事实收敛页 | 3-5 个关键事实数据，如营收、粉丝、客户池、平台排名、渠道占比 | 品牌历史节点、老板访谈金句 | `[待补充：平台排名截图/粉丝截图，用于证明已有势能]` |\n| 阶段判断页 | 历史经营数据、品牌发展时间线、关键经营动作 | 重要节点照片、搬店/装修/活动记录 | `[待补充：品牌发展节点，用于确认当前阶段判断]` |\n| 目标拆解页 | 目标值、历史月均实收、旺淡季数据、客单价、订单数 | 毛利率、渠道费用、核销率 | `[待补充：近12个月实收、订单数、客单价，用于测算目标缺口]` |\n| 渠道结构页 | 各渠道成交/核销/实收/客单/订单数 | 渠道费用率、退款率、平台活动记录 | `[待补充：近3个月各渠道成交和核销数据，用于判断价格与承接问题]` |\n| 产品结构页 | SKU销量、收入、毛利、Top SKU、价格带 | 产品照片、用户评价、上下架时间 | `[待补充：SKU销售明细，用于判断主推和下架产品]` |\n| 内容转化页 | 内容发布频次、播放/互动/私信/成交线索 | 爆文截图、评论截图、直播数据 | `[待补充：近30天内容互动和咨询数据，用于判断看热闹还是能转化]` |\n| 私域/会员页 | 私域人数、标签、触达、复购、生日数据 | 社群截图、短信/企微模板、优惠券核销 | `[待补充：客户池人数和近3次激活结果，用于估算复购提升空间]` |\n| 现场证据页 | 门店、竞品、产品、动线、服务流程照片 | 用户路径记录、价格牌、菜单、收银截图 | `[待补充：现场照片3-5张，用于支撑该页判断]` |\n| 卡点确认页 | 每个卡点至少 2 类证据：数据/现场/访谈/截图 | 用户评论、竞品对照 | `[待补充：证据素材，用于确认该卡点是否成立]` |\n| 解法策略页 | 卡点证据、动作清单、负责人/周期 | 参考案例、过往活动结果 | `[待补充：历史活动结果，用于预估该动作收益]` |\n| 收益测算页 | 历史订单数、客单、转化率、复购率、毛利率或渠道费用 | 人力成本、报废率、退款率 | `[待补充：缺失数据；当前先用历史月均值做保守测算]` |\n| 落地节奏页 | 首月关键节点、可用资源、团队分工 | 节日节点、上新计划、拍摄排期 | `[待补充：团队可投入人力和节点日期，用于细化排期]` |\n\n## 页面写法规则\n\n每一页只承担一个任务：\n\n- 事实页：告诉老板“我们看到了什么”。\n- 判断页：告诉老板“这说明什么”。\n- 证据页：用图、数据、现场照片支撑判断。\n- 转译页：把咨询框架变成老板能听懂的话。\n- 动作页：告诉老板“回去先干什么”。\n\n每页文案建议：\n\n- 标题：一句话说结论，不写空泛名词。\n- 副标题：说明这页为什么重要。\n- 主体：最多 3-4 个点。\n- 页脚：写数据口径或来源。\n\n避免：\n\n- 一页同时讲多个结论。\n- 表格过多，且每格都是段落。\n- 术语没有铺垫。\n- 一上来就口号化。\n- 只讲问题，不讲证据来源。\n- 只给动作，不说明为什么先做。\n\n## 诊断维度\n\n诊断维度不是固定模板。先用以下维度扫一遍，再筛出最影响增长目标的 3-5 个主卡点。\n\n### 品牌阶段\n\n分析客户从哪里来、靠什么增长、现在卡在哪里。\n\n常见阶段：\n\n- 手艺/产品起步期。\n- 线下门店验证期。\n- 平台流量放量期。\n- 稳定经营建设期。\n- 品牌心智沉淀期。\n\n### 产品结构\n\n看：\n\n- 哪类产品贡献收入。\n- 哪些 SKU 是流量款，哪些可能成为招牌款。\n- 是否存在产品互相挤占。\n- 堂食、外带、线上、生日、下午茶等场景是否分清。\n- 新品是否有立项、打样、定版、复盘流程。\n\n输出：\n\n- 主推产品线。\n- 招牌候选池。\n- 下架/弱化产品。\n- 堂食与线上分线。\n- 新品研发流程。\n\n### 价格与利润\n\n看：\n\n- 不同渠道是否存在价格倒挂。\n- 低价品是否带来销量但损伤利润。\n- 高毛利产品是否有足够曝光和推荐。\n- 优惠券、满减、团购是否改变用户价格锚点。\n\n输出：\n\n- 价格秩序建议。\n- 渠道价格边界。\n- 高毛利产品主推策略。\n- 低价引流品退出或重定价计划。\n\n### 渠道结构\n\n看：\n\n- 平台各自承担什么角色。\n- 是否价格倒挂。\n- 平台低价是否训练用户心智。\n- 小程序/商城是否具备下单认知。\n- 私域是否有激活节奏。\n\n输出：\n\n- 渠道角色表：拉新、成交、留资、复购。\n- 价格秩序建议。\n- 客服承接路径。\n- 私域激活节奏。\n\n### 内容与老板 IP\n\n看：\n\n- 内容是否只有曝光，没有转化。\n- 老板出镜是否能帮助用户做选择。\n- 是否有互动、试吃、投票、抽奖、共创。\n- 内容话术是否和客服、小程序、产品主推一致。\n\n输出：\n\n- 内容主题。\n- 老板 IP 角色。\n- 互动机制。\n- 节点内容排期。\n\n### 流程与交付\n\n看：\n\n- 节日产品是否提前立项。\n- 打样、定版、拍摄、上架、客服培训是否倒排。\n- 报单和出单是否影响效率。\n- 团队协同是否依赖老板临场推动。\n\n输出：\n\n- 节点项目表。\n- 新品研发 SOP。\n- 客服推荐话术。\n- 异常处理规则。\n- 重要但不紧急事项清单。\n\n### 组织与团队能力\n\n看：\n\n- 老板是否是唯一决策和推动者。\n- 店长、客服、后厨、内容之间是否有明确分工。\n- 是否存在“知道问题但没人负责”的情况。\n- 是否有周复盘、项目表、活动复盘机制。\n\n输出：\n\n- 角色分工。\n- 会议节奏。\n- 复盘模板。\n- 关键动作责任人。\n\n### 会员与复购\n\n看：\n\n- 是否知道哪些客户买过、多久没买、买什么。\n- 是否有生日、节日、新品、沉睡客激活。\n- 是否有复购率、复购周期、客单变化。\n- 私域是否只是人数资产，没有触达资产。\n\n输出：\n\n- 客户分层。\n- 激活场景。\n- 复购触达节奏。\n- 会员权益和召回动作。\n\n## 卡点诊断动态选择法\n\n不要预设卡点。按以下流程动态生成：\n\n1. 列出候选卡点：从产品、价格、渠道、内容、私域、流程、交付、组织、选址、供应链、会员、品牌心智中列出所有可能问题。\n2. 给每个卡点标证据：数据证据、现场证据、访谈证据、平台截图、竞品对照。\n3. 给每个卡点评分：增长影响、客户感知、解决难度、紧急度、证据强度。\n4. 选出主卡点：优先选择“影响大、证据强、可在 30-90 天内启动”的 3-5 个。\n5. 转成老板语言：不要写“私域体系不完善”，要写“4万好友没有被叫醒”；不要写“产品矩阵不清晰”，要写“顾客不知道零售品牌 A最值得买什么”。\n\n卡点命名模板：\n\n- 顾客看见了，但没有形成购买理由。\n- 平台带来了人，但没有沉淀到自有阵地。\n- 产品卖得动，但没有沉淀成招牌。\n- 活动能冲量，但团队无法稳定复制。\n- 客户池很大，但没有被分层叫醒。\n- 价格能成交，但正在训练用户只买低价。\n- 门店有流量，但动线/服务/陈列没有把流量转成客单。\n\n## 增长收益测算逻辑\n\n测算不是为了精确预测，而是为了让老板理解“为什么这件事值得先做”。当客户没有完整数据时，先用历史数据做保守估算，并标注假设。\n\n### 基础模型\n\n月收入可以拆为：\n\n`月收入 = 订单数 × 客单价`\n\n也可以拆为：\n\n`月收入 = 新客订单 × 新客客单 + 老客订单 × 老客客单`\n\n如果有渠道数据：\n\n`月收入 = Σ（渠道订单数 × 渠道客单价 × 核销率）`\n\n如果有流量数据：\n\n`月收入 = 曝光/访问 × 转化率 × 客单价`\n\n如果有复购数据：\n\n`月收入 = 客户数 × 购买频次 × 客单价`\n\n### 目标缺口测算\n\n用于回答“离目标差多少”。\n\n所需数据：\n\n- 年度目标。\n- 过去 12 个月实收。\n- 近 3 个月月均实收。\n- 旺季/月度波动。\n\n计算：\n\n- 年度缺口 = 年度目标 - 过去 12 个月实收。\n- 月均缺口 = 年度缺口 / 12。\n- 若按近 3 个月趋势：目标月均 - 近 3 个月月均实收。\n\n输出话术：\n\n> 如果目标是 X 万，而过去 12 个月实收为 Y 万，则不是每月多做一点内容就够，而是需要每月稳定补出约 Z 万增量。\n\n### 客单提升测算\n\n用于产品结构、套餐、加购、价格体系优化。\n\n所需数据：\n\n- 当前月订单数。\n- 当前客单价。\n- 目标客单提升幅度，建议用 3%、5%、8% 三档。\n\n计算：\n\n- 月增收 = 当前月订单数 × 当前客单价 × 客单提升幅度。\n\n如果没有订单数：\n\n- 订单数 ≈ 月实收 / 当前客单价。\n\n示例：\n\n> 近 3 个月月均实收 20 万，客单 100 元，则月订单约 2000 单。若通过产品组合让客单提升 5 元，月增收约 1 万。\n\n### 复购提升测算\n\n用于私域、会员、短信/企微激活。\n\n所需数据：\n\n- 可触达客户数。\n- 历史激活转化率；没有则用 0.5%、1%、2% 三档。\n- 复购客单价。\n- 触达频次。\n\n计算：\n\n- 单次激活增收 = 可触达客户数 × 激活转化率 × 复购客单价。\n- 月增收 = 单次激活增收 × 月触达次数。\n\n输出话术：\n\n> 如果有 4 万可触达客户，即使只有 1% 被一次活动叫醒，按 100 元客单，也约等于 4 万元成交机会。\n\n### 渠道价格倒挂修正测算\n\n用于团购、外卖、小程序价格体系。\n\n所需数据：\n\n- 各渠道订单数。\n- 各渠道客单价。\n- 各渠道毛利率或平台费用率。\n- 价格调整幅度。\n\n计算：\n\n- 单均改善 = 调整后实收/毛利 - 调整前实收/毛利。\n- 月改善 = 受影响订单数 × 单均改善。\n\n如果没有毛利：\n\n- 先用实收差额做保守测算，并标注“未扣除成本和平台费用”。\n\n输出话术：\n\n> 这不是简单涨价，而是避免长期训练用户只去最低价渠道购买。\n\n### 产品结构优化测算\n\n用于主推品、招牌品、高毛利品、小规格产品退出。\n\n所需数据：\n\n- Top SKU 销售额、销量、毛利率。\n- 低价/低毛利产品销量。\n- 替代产品客单或毛利。\n\n计算：\n\n- 结构增收 = 被迁移订单数 × 新旧产品客单差。\n- 毛利改善 = 被迁移订单数 × 新旧产品毛利差。\n\n如果没有毛利：\n\n- 用价格带差额估算增收，用“毛利待补充”标注。\n\n### 转化率提升测算\n\n用于小程序路径、客服入口、详情页、内容导购。\n\n所需数据：\n\n- 访问量/咨询量。\n- 当前下单量。\n- 当前转化率。\n- 客单价。\n\n计算：\n\n- 当前转化率 = 下单量 / 访问量或咨询量。\n- 增量订单 = 访问量 × 转化率提升百分点。\n- 月增收 = 增量订单 × 客单价。\n\n如果没有访问量：\n\n- 用咨询量或客服接待量替代。\n\n### 流程提效测算\n\n用于研发流程、报单效率、出单动线、节日项目管理。\n\n所需数据：\n\n- 每次活动返工次数。\n- 延迟上架天数。\n- 人均工时成本。\n- 节点销售周期。\n- 因延迟造成的少卖天数。\n\n计算：\n\n- 人效节省 = 节省工时 × 人均小时成本。\n- 节点增收 = 提前上架天数 × 日均预售额。\n- 风险降低 = 历史异常损失 × 预计减少比例。\n\n如果没有工时成本：\n\n- 用“提前上架天数 × 历史节点日均销售额”先估。\n\n### 三档情景\n\n每个收益测算都建议给三档：\n\n- 保守：只改善 20%-30% 的问题，适合承诺。\n- 基准：改善 40%-60% 的问题，适合主讲。\n- 乐观：改善 70% 以上，作为上限想象。\n\n不要把乐观情景当承诺。提案中建议表达为：\n\n> 这不是保证结果，而是说明该动作的增长杠杆在哪里。\n\n### 缺数据时的处理\n\n如果用户缺少数据，不要停止输出。使用以下规则：\n\n- 有历史月实收：可以估目标缺口。\n- 有客单：可以估订单数。\n- 有客户池人数：可以估私域激活潜力。\n- 有渠道占比：可以估渠道结构优化空间。\n- 有 Top SKU：可以估产品结构调整方向。\n- 有活动销售额：可以估节点项目管理收益。\n\n同时必须在页面标注：\n\n`[测算假设：因缺少订单数/毛利率/转化率，当前使用历史月均实收和客单价做保守估算；需用户补充数据后更新]`\n\n## SWOT 使用方式\n\nSWOT 可以用于内部分析，但不要默认直接呈现在老板主讲页。\n\n推荐映射：\n\n- S：内部已有基础，如势能、客户池、内容能力、产品基础、团队积极性。\n- W：内部短板，如产品结构、渠道秩序、流程标准化、私域激活。\n- O：外部机会，如市场空间、商圈可达性、竞品成熟度低。\n- T：外部风险，如平台低价、强品牌入驻、流量窗口期、用户期待提高。\n\n在老板版中翻译成：\n\n- 有势能。\n- 不成系统。\n- 有窗口。\n- 会被训练。\n\n## 4P 使用方式\n\n4P 可以用于策略校验，但不要生硬展示英文。\n\n翻译成：\n\n- 产品：卖什么，卖给谁，在哪个场景卖。\n- 价格：不同渠道价格是否有秩序。\n- 渠道：平台、小程序、私域各自承担什么任务。\n- 推广：内容、活动、老板 IP 如何带来选择理由。\n\n推荐顺序：\n\n1. 先改产品。\n2. 再改价格。\n3. 再改渠道承接。\n4. 最后放大内容和活动。\n\n## 输出要求\n\n每次生成提案前，先输出一版“提案骨架”，包括：\n\n- 一句话阶段判断。\n- 三个事实支撑。\n- 3-5 个增长卡点。\n- 每个卡点的证据来源。\n- 每个卡点对应的解法。\n- 每个解法的潜在收益测算逻辑。\n- 哪些是已确认，哪些是待验证。\n- 每页需要的素材清单：数据图/数据表/照片/截图/访谈。\n- 需要用户补充的素材占位。\n- 1 小时主讲路径。\n- 2 小时展开路径。\n\n生成最终提案时，至少包含：\n\n- 清晰目录。\n- 事实收敛页。\n- 阶段判断页。\n- 卡点诊断页。\n- 现场/数据证据页。\n- 解法总览页。\n- 重点策略页。\n- 增长收益测算页。\n- 首月动作页。\n- 30/60/90 天节奏页。\n- 数据口径说明或附录。\n\n## 质量检查清单\n\n交付前逐项检查：\n\n- 老板是否能在前 5 页听懂“现在到底怎么了”？\n- 结论是否建立在事实之后，而不是空降口号？\n- 是否避免了不必要的术语？\n- 每个卡点是否有数据、现场、访谈或平台证据？\n- 外部市场是否只是辅助，而没有抢走内部动作主线？\n- 数据口径是否清楚，是否避免过度外推？\n- 是否把“待验证假设”嵌入诊断逻辑，而不是孤立摆放？\n- 卡点是否根据具体客户动态生成，而不是固定套用产品/渠道/流程？\n- 每页是否写清需要的数据图、数据表、照片、截图或访谈素材？\n- 缺失素材是否在原文留出占位并标注素材类型？\n- 每个核心解法是否有潜在收益测算或至少有测算逻辑？\n- 测算是否写清历史数据、假设和缺失数据？\n- 是否告诉客户第一个月先做什么？\n- 是否区分“重要且紧急”和“重要但不紧急”？\n- 是否有一条老板能记住的结束语？\n\n## 常用表达模板\n\n阶段判断：\n\n> 现在不是没有流量，而是要把已经有的流量，变成可重复的购买理由和复购路径。\n\n目标解释：\n\n> 这个目标不是多发几条内容就能完成，它要求产品、渠道和流程一起变稳。\n\n卡点总览：\n\n> 红利能不能沉淀，卡在三件事：产品能不能被记住，渠道能不能接得住，流程能不能供得稳。\n\n产品策略：\n\n> 先把堂食和线上分开讲清楚：堂食承担尝鲜和拍照，线上承担生日和正式购买。\n\n渠道策略：\n\n> 平台负责带来新客，小程序负责正式成交，私域负责复购召回。\n\n流程策略：\n\n> 节日生意不是临场发挥，而是项目管理。\n\n结束语：\n\n> 下一步不是让更多人看见你，而是让看见过你的人，知道为什么买你、在哪里买你、什么时候再回来。\n",
  "s45": "---\nname: douyin-talent-screening\ndisplay_name: 抖音达人筛号专家\ndescription: 抖音生活服务（抖音来客）达人投放筛号与综合排名。输入一批达人昵称 + 主页链接，在已登录的抖音来客「达人带货—达人广场」按抖音号精确搜索（短链先解析出抖音号，避免昵称重名认错人），采集官方 5 项指标（视频带货力 / 平均种草销售额 / 稿均播放量 / 稿均千次GMV / 30日核销率），按 30/25/20/15/10 递减权重算综合分与单人综合排名，产出 3 分页 HTML 结论页（整合结论 / 总览 / 逐人指标明细）+ 1 个 CSV。当用户提到「抖音筛号」「达人广场」「找抖音达人」「筛号」「达人排名」「视频带货力」「平均种草销售额」「稿均千次GMV」「30日核销率」「抖音达人排名」「该投哪个抖音达人」或一次性给出多个抖音昵称与主页链接要求做表格/排名时使用。不适用于小红书筛号（走 xhs-influencer-screening）、单条抖音笔记数据采集、或巨量星图电商达人（口径不同）。\nagent_created: true\nversion: 1.2.0\ntags: 抖音,抖音来客,达人广场,达人筛选,本地生活,投放,评分,CDP\n---\n\n# 抖音达人筛号专家\n\n把「一批达人昵称 + 主页链接」变成一份可复核、能直接拿去定投放名单的综合排名。核心不是抓数据，是**让每个分数都能追到页面上的原始数字，且不编造任何缺失值**。\n\n## 何时用\n\n命中任一即用：\n\n- 一次性给出多个抖音达人昵称 / 主页链接，要求「排个名」「做个表」「给个结论」「该投谁」\n- 明确要看视频带货力、平均种草销售额、稿均播放量、稿均千次GMV、30日核销率\n- 提到「抖音来客」「达人广场」找达人、看带货数据\n- 复用本技能的权重规则，换一批达人重跑\n\n不适用：\n\n- 小红书达人筛号 → `xhs-influencer-screening`\n- 巨量星图电商达人（直播/短视频带货口径与本地生活不同）→ 不要混用本技能的指标定义\n- 只采一两条笔记详情 → 另行处理\n- 只要一份原始数据、不要评分结论 → 只跑第 0–1 步，跳过 02/03\n\n## 开工前必须先讲的三件事（触发后第一轮就说，别闷头跑）\n\n技能被唤起后，**第一轮回复必须先明确告知用户下面三点**，然后才开始动手。原因是三条都不可替代：缺登录拿不到数据，缺链接可能认错人，缺说明用户不知道要做什么。\n\n### 1️⃣ 必须先登录抖音来客（硬门槛，不可绕过）\n\n- 引用原文说明：达人广场是商家后台，**未登录访问只会跳到抖音来客官网介绍页**，拿不到任何达人数据。\n- 权限要求：必须是**有「达人带货 — 达人广场」入口的商家账号或代运营账号**。\n- 操作步骤给全（别只说\"去登录\"）：\n  1. 完全关闭平时用的浏览器；\n  2. 用带调试端口的命令重启（GeminiBrowser / Chrome 两条命令都给）；\n  3. 在窗口里打开达人广场，确认能看到达人列表（有「视频带货力」「30日核销率」等列）；\n  4. 访问 `http://127.0.0.1:9222/json/version` 验证端口通了。\n- 提示常见坑：页面报「协作者关系不存在」是 URL 里 groupid 过期，从工作台首页点左侧「达人广场」菜单进入。\n\n### 2️⃣ 必须给出：昵称 + 主页链接（最优）或抖音号\n\n- **要什么**：每行一位达人，五列出「昵称 | 主页链接 | 标注粉丝 | 标注等级 | 报价」，后三列可省。\n- **为什么链接是必须的**：抖音昵称重名极严重（实测搜「小师妹」返回 1000 条），只有链接能解析出**抖音号**，按抖音号搜才精确返回 1 条。没链接只能靠昵称猜，可能认错人。\n- **没有链接的降级方案**：给抖音号（主页「抖音号：xxx」）也能精确搜；只有昵称也能跑，但必须标「重名待核对」，报告里警示。\n- 用户只丢过来一张表格（粉丝/等级/价格/链接混在一起）时，**自动整理成五列并回读确认**，不要让他自己排版。\n\n### 3️⃣ 说明会交付什么、大概怎么算\n\n- 交付：3 分页 HTML（整合结论 / 总览 / 逐人指标明细）+ 1 个 CSV。\n- 口径一句话：按「视频带货力 > 平均种草销售额 > 稿均播放量 > 稿均千次曝光GMV > 30日核销率」递减加权 30/25/20/15/10。\n- 提前打预防针：分数是**批内相对**、粉丝数不进评分、平台显示 `<100` 按缺失处理。\n\n> 三点讲完即可开始跑，**不要等用户逐一确认**。若用户已经登录好、也已经给了清单，第一轮讲过要点后直接进入第 0.5 步。\n\n## 三条必须先讲清的前提\n\n1. **达人广场是登录后的商家后台，采集必须连已登录的浏览器。** 未登录访问 `life.douyin.com` 只会跳到抖音来客官网介绍页。采集方式为 **API 直采（2026-11-11 实测确认）**：在已登录的达人广场页面上下文里直接 POST `talent_square/talent/search` 接口（关键词字段为 body 顶层 `keyword`，无独立签名，cookie 自动携带）。**不要走页面 UI 搜索** —— 实测搜索框输入（无论原生 setter、insertText 还是真实回车）都无法把关键词带进请求，「查询」按钮只应用筛选条件。01_collect 每次启动会先 reload 一次页面自动发现 searchUrl（适配当前账号的 root_life_account_id）。\n2. **「视频带货力」是等级，不是金额。** 官方为 Lv0–Lv8（9 级 3 阶段，2025 年 4 月改版），接口字段为纯数字 `item_level`，按自然月评定、每月 6 日评出、展示至次月 5 日。评分时先线性映射成 0–100，绝不与金额项混算。Lv0 代表「暂不符合 Lv1–Lv8 要求或存在严重违规」，必须进风险提示。\n3. **身份必须靠抖音号锁定，不能靠昵称。** 昵称搜索是模糊匹配：实测搜「小师妹」返回 **1000 条**，第一页全是同名大号；而搜**抖音号精确返回 1 条**。因此流程固定为「短链 → 解析出抖音号（第 0.5 步）→ 按抖音号搜索」。匹配优先级：sec_uid > 抖音号 > 链接昵称精确 > 清单昵称精确 > 昵称模糊（标待核对）。有抖音号却在广场查不到 = 该达人未入驻广场，**不拿同名账号顶替**。\n4. **清单里同一账号被贴到多行是常见错误。** 第 0.5 步会做 sec_uid / 抖音号查重，重复的自动剔除并写入 `excluded.json`，不参与排名，报告顶部提示补正。\n\n## 前置条件\n\n1. **已登录抖音来客的浏览器 + CDP 调试端口 9222**，两种方式任选：\n   - **GeminiBrowser（Mirror 的日常浏览器，已实测）**：结束 GeminiBrowser 进程后，用其原有数据目录与 profile 重启并带调试端口（标签页可恢复）：\n     ```\n     \"D:\\Program Files\\GeminiBrowser\\GeminiBrowser.exe\" --remote-debugging-port=9222 --profile-directory=\"Profile 3\" --restore-last-session \"https://life.douyin.com/...\"\n     ```\n     注意：优雅关闭可能被「确认关闭」弹窗拦截且无法自动确认，必要时结束主进程后重启（登录态存于磁盘不会丢）。数据目录：`C:\\Users\\admin\\AppData\\Local\\GeminiBrowser\\User Data`。\n   - **专用调试 Chrome**：固定 `--user-data-dir` 启动，首次手动登录抖音来客（须为有「达人带货—达人广场」权限的商家/代运营账号），登录态留在 profile 长期复用。\n   - 无论哪种：达人广场 URL 若带旧 groupid 会报「协作者关系不存在」，用当前账号的 groupid 或从工作台首页点「达人广场」菜单进入。\n2. **Node.js >= 22**：脚本用内置 `WebSocket` 与 `fetch`，Node 18 会报 `WebSocket is not defined`。\n3. **一个空工作目录**：所有脚本按**当前工作目录**读写相对路径文件，输出也落在该目录。\n4. **合规确认**：采集第三方平台数据前确认符合平台协议与当地法规；本技能只提供技术实现，不构成合规保证。\n\n## 输入\n\n| 文件 | 来源 | 说明 |\n|---|---|---|\n| `talents.txt` | 用户给的名单 | 每行 `昵称 \\| 主页链接 \\| 标注粉丝 \\| 标注等级 \\| 报价`，后三列可省（省了就当备注），见 `assets/talents.example.txt` |\n| `config.json` | 复制 `assets/config.example.json` | 权重、归一方式、等级线、等待时长、广场 URL |\n| `field_map.json` | 复制 `assets/field_map.example.json` | 5 个指标的中文别名、接口 key、**确认后的精确 jsonPaths** |\n\n**执行前必做**：把用户给的原始标注（昵称、粉丝数、等级）与清单逐条列出确认。备注里的用户标注与广场实测不符时，**两列都保留并标注，不抹平**。\n\n## 执行流程\n\n按顺序在**同一个工作目录**运行：\n\n```bash\nSK=<本技能目录>\ncp $SK/assets/config.example.json config.json\ncp $SK/assets/field_map.example.json field_map.json\n# 把用户给的清单写进 talents.txt\n\nnode $SK/scripts/00_resolve_links.mjs # -> links_resolved.json（短链→sec_uid + 真实昵称/抖音号/粉丝）\nnode $SK/scripts/00_probe.mjs      # -> probe/（平台改版时才需要：核对接口字段与页面文案）\n# 人工核对 probe/field_candidates.txt，必要时把确认的 path 填进 field_map.json 的 jsonPaths\n\nnode $SK/scripts/01_collect.mjs    # -> talents_data.json（5 项原始指标）\nnode $SK/scripts/02_score.mjs      # -> score_data.json（归一 + 加权 + 排名）\nnode $SK/scripts/03_render.mjs     # -> 抖音达人筛号_综合结论.html + 抖音达人筛号_综合总览.csv\n```\n\n补采 / 断点续跑：\n```bash\nnode $SK/scripts/01_collect.mjs --only 3,7              # 只补指定 idx，合并写回\nnode $SK/scripts/01_collect.mjs --no-reload             # 跳过启动 reload，直接用 field_map 的 searchUrl\nMAX_PAGES=3 node $SK/scripts/01_collect.mjs             # 控制昵称模糊搜索的翻页上限（默认 3 页 / 30 条）\n```\n\n### 第 0.5 步｜短链解析与身份指纹（清单带链接时必做）\n\n- 短链 `v.douyin.com/xxx` 用 HTTP 302 逐跳解析到 `sec_uid`（最多 6 跳，兼容 `sec_uid=` 与 `/user/MS4w…` 两种写法）。\n- 再用浏览器渲染分享页（新开标签、用完即关，不干扰达人广场），从页面文本取**真实昵称 / 抖音号 / 粉丝数**。\n- 检测两类数据错误并写入 `links_resolved.json`：`dupOf`（同一账号贴到多行）、清单名与链接真实昵称不一致（多为错字或贴错链接）。\n- 抖音号是后续精确搜索的钥匙；解析不到时回退昵称匹配并在报告标注风险。\n\n### 第 0 步｜探查（平台改版或换账号时跑；字段已确认时可跳过）\n\n- 连调试浏览器里 `life.douyin.com` 的标签页，检测登录态与安全验证页。\n- 捕获页面**实际发出的 JSON 响应**，输出 `probe/responses.json`（含接口 URL 清单）、`probe/page_text.txt`（页面可见文本）、`probe/field_candidates.txt`（5 个指标的候选值）。\n- 用途：确认 5 个指标的字段路径与单位（元 / 万元 / %）、页面文案是否改版。若指标取不到，按候选清单更新 `field_map.json` 的 `aliases` / `jsonKeys` / `jsonPaths`，**不改脚本**。\n- 2026-11-11 已确认的字段映射固化在 `assets/field_map.example.json`，正常情况下直接复制使用。\n\n### 第 1 步｜API 直采（按抖音号精确搜索）\n\n- 启动时先 reload 一次达人广场，从网络捕获里**自动发现** search 接口 URL（适配当前登录账号的 root_life_account_id；`--no-reload` 可跳过，改用 field_map 的静态值）。\n- 对每位达人：在页面上下文 POST `talent_square/talent/search`，body = 基础筛选 + 顶层 `keyword: 抖音号`（无抖音号才退回昵称，并按 `MAX_PAGES` 翻页）。关键词字段名从前端 chunk 源码确认，勿凭猜测改。\n- 从响应 `talent_list` 匹配：**sec_uid > 抖音号 > 链接昵称精确 > 清单昵称精确 > 昵称模糊（标待核对）**；候选存入 `allMatches`。\n- 有抖音号但广场无记录 → 记为失败并说明「未入驻广场，不拿同名账号顶替」，**绝不静默替换成同名达人**。\n- 按 `field_map.json` 的 `jsonPaths`（相对匹配到的达人对象）取 5 项指标，附带粉丝数（精确值）、抖音号、城市、主页链接、稿均销售额、完播率等展示字段。\n- `—` / `暂无` / `达人未授权` / **`<100`（平台隐藏精确值的下界标记）**一律按缺失处理，**不填 0、不取边界值、不估算**。「1.2万」「¥3,456」「78.5%」统一换算成数字。\n- 接口 HTTP 401/403 或页面出现登录失效 / 安全验证 / 访问频繁立即整体停止，**不做短时重试**；采集间隔随机抖动（默认 1.2–2.4 秒）。\n- 支持 `--only 3,7` 断点续跑，按 idx 合并写回。\n\n### 第 2 步｜综合评分\n\n默认递减权重（完整推导见 `references/scoring.md`）：\n\n| 指标 | 权重 | 归一方式 |\n|---|---|---|\n| 视频带货力 | 30 | 等级 Lv0–Lv8 线性映射 0–100 |\n| 平均种草销售额 | 25 | log1p + 本批 min-max |\n| 稿均播放量 | 20 | log1p + 本批 min-max |\n| 稿均千次GMV | 15 | log1p + 本批 min-max |\n| 30日核销率 | 10 | 本批线性 min-max（比率本身有界） |\n\n- **金额/播放量必须用对数归一**：本池量级跨度大，线性归一会让头部一人拿满、其余趋近 0。\n- 全批同值的维度无区分度，统一按 50 分计，并在风险列标注。\n- **min-max 会让某项的全批最低者得 0 分**；多项同时垫底时综合分接近 0。这是批内相对归一的数学结果，不是采集失败，**不为好看拉伸分数**，改在结论页写明，并用「数据完整度」列区分。\n- **缺失指标不参与计分，剩余权重按比例重分配**，综合分仍是 0–100 加权平均；报告必须给出「有效权重覆盖率 / 数据完整度」列，不得让缺 3 项的人与满项的人看起来可比。\n- 综合分同分时，按 `tieBreakOrder`（即用户给的优先级顺序）逐级比较原始值定名次。\n- 等级线 S ≥75 / A 60–75 / B 45–60 / C <45，可在 `config.json` 调整。\n- 分数是**批内相对**，不可跨批次、跨城市、跨品类比较，须写进口径说明。\n- **报价只做参考分析，不进评分**：`投产参考 = 稿均种草销售额 ÷ 单条报价`（纯除法，只在该达人两项都有值时计算），用于「按报价看性价比」分榜；不含坑位费/佣金/核销折损，须标注。\n- **粉丝数不进评分**：用户标注的粉丝（抖音主页）与广场展示值常有出入（实测最大差 73%），两列并列保留、不择优，并说明不影响排名。\n\n### 第 3 步｜出结论页\n\n固定 3 个分页，不多不少：\n\n1. **整合结论**：一句话主推 + 综合排名（逐人数据论据与风险）+ Top3 评分卡 + 分用途选人（要 GMV 规模 / 要到店核销确定性，两者常不同）+ 关键数据发现 + 权重与归一算法表 + 口径与限制\n2. **总览**：全部达人的 5 项原始值 + 归一值 + 综合分 + 等级，**带可点击的主页链接**，带搜索与表头排序\n3. **逐人指标明细**：每位达人的「原始值 → 归一值 → 权重 → 加权得分」全链路，含取值来源、页面上下文/接口路径、缺失与口径冲突标记、页面文本片段\n\n同时输出 1 个带 BOM 的 CSV（综合总览）。\n\n**结论页必须给出「原因 + 数据论据」**：每个排名都要有一句能追到具体等级、金额、播放量、比率、本池位次的论据；必须并列给出双用途名单，不能只丢一张总分表。\n\n## 铁律\n\n1. **不编造数据**：接口字段、单位、指标值一律以实际页面/响应为准；未验证的接口不得写死进脚本；缺失留空，任何数字要能追到源字段与页面上下文。\n2. **不抹平差异**：用户标注与实测不符、页面值与接口值冲突、单位歧义、身份待核对，一律原样列出并标注。\n3. **风控优先**：出现登录失效、安全验证页、访问频繁、限流或连续异常，立即暂停并报告，不短时重试；宁可漏一批，不搞进风控。用户明确要求「本次放宽」时仅对本次任务临时放宽，不改长期规则。\n4. **合规**：采集第三方平台数据前确认符合平台协议与当地法规；本技能只提供技术实现，不构成合规保证。\n5. **技术细节见** `references/field-notes.md`（指标口径、CDP 采集坑位、字段映射方法、风控信号）；评分推导与调参见 `references/scoring.md`。\n\n## 交付前自检\n\n- [ ] 浏览器已登录达人广场（01_collect 的 reload 自动发现 searchUrl 成功即视为通过）\n- [ ] 全部达人均采到 5/5 项；失败清单已复核（昵称笔误 / 无结果 / 权限）\n- [ ] 每位达人都按抖音号/ses_uid 精确命中；无抖音号或查无记录的已单列说明（未拿同名顶替）\n- [ ] 短链查重结果已检查，重复行已剔除并提示补正（excluded.json）\n- [ ] 标注粉丝 vs 广场粉丝的偏差已并列展示，未择优未抹平\n- [ ] 缺失项原样显示平台原文（如「<100」），未取边界值也未填 0\n- [ ] 缺失项留空、未补 0；「<100」未被当成数值；有效权重覆盖率与数据完整度已写进报告\n- [ ] HTML 恰好 3 个分页，链接可点，无 `undefined` / `NaN`\n- [ ] 结论页有权重表、口径与限制、双用途选人、逐人数据论据\n- [ ] CSV 行数与总览表一致，BOM 存在，Excel 可直接打开\n\n## 版本\n\nv1.2.0（2026-11-11）：真实 22 人名单实战后升级 —— 新增第 0.5 步短链解析（sec_uid + 真实昵称/抖音号），采集改为**按抖音号精确搜索**（昵称模糊搜索「小师妹」返回 1000 条会认错人）；新增短链查重剔除、标注粉丝 vs 广场粉丝对照、报价投产参考、`<100` 原文保留、昵称模糊时翻页。21 位真实达人回归：全部 sec_uid/抖音号精确命中。\nv1.1.0（2026-11-11）：首次真实环境全链路验证后重写采集层 —— 从「CDP 拦响应 + 页面文本兜底 + UI 搜索」改为 **API 直采**（页面上下文 POST search 接口，keyword 字段从前端 chunk 源码确认；UI 搜索框实测无法携带关键词）。新增：searchUrl 启动时自动发现、sec_uid 身份匹配、allMatches 重名候选、`<100` 下界标记按缺失处理、数字等级解析。5 位真实达人回归：5/5 指标齐全，排名与页面展示一致。\nv1.0.0（2026-11-11）：按 Mirror 给定的五项官方指标与优先级顺序创建。\n",
  "s46": "---\nname: writing-profile\ndescription: Personal writing collaboration workflow based on the user's Mirror writing and expression profile. Use when the user explicitly mentions Mirror writing or $writing-profile, or asks to plan, draft, rewrite, continue, polish, or critique substantial prose such as an article, novel, essay, reflection, commentary, or narrative. For implicit writing requests, first ask whether to activate the 写作画像 and apply it only after confirmation. Do not trigger for routine emails, short messages, technical documentation, code, or factual answers unless explicitly invoked.\n---\n\n# Mirror 写作\n\n## 启用确认\n\n1. 用户显式提到 `$writing-profile`、“Mirror 写作”或“调用写作画像”时，直接启用，不再确认。\n2. 技能因普通文章、小说、随笔、评论或叙事写作请求而隐式触发时，先只问一句：`这次要调用 Mirror 写作画像吗？`\n3. 等待用户回答。不要在确认前套用画像，也不要一边询问一边开始按画像改写。\n4. 用户确认后，在执行写作任务前完整读取 `references/profile.md`。\n5. 用户拒绝后，按当前请求正常协作，不引用画像，也不在同一任务中重复询问。\n6. 同一篇内容的连续讨论只确认一次；用户切换到新的独立写作项目时再询问。\n\n## 协作原则\n\n- 先识别本次任务属于小说、叙事性随笔、白话文章、观点评论、口述整理、提纲还是其他形式。\n- 以用户当前请求为最高优先级。画像是参考，不是必须复现的风格模板。\n- 不默认小说化、文学化、增加意象或制造留白。写白话内容时优先清楚、自然、准确。\n- 只在小说或叙事任务中参考画像里的沉浸、视角、意象、反转和结尾偏好。\n- 保留用户原有的判断、犹豫和矛盾，不擅自替用户简化成立场口号。\n- 区分整理、建议、提纲、试写和完整成稿。用户只要求记录或提炼时，不直接扩写全文。\n- 使用真实事件时先核实；不能核实时明确不确定性，不把传闻写成事实。\n\n## 跨文体中文表达\n\n将以下规则用于白话文章、评论、随笔和叙事性文字。用户当前指定的文体与表达方式优先；诗歌、人物对白和有意为之的实验性句法不机械套用这些规则。\n\n- 优先让人物、主语和动作出现，再补时间、原因和条件。\n- 拆解过长定语和连续多个“的”，避免读到句尾才知道谁在做什么。\n- 让句子顺着前一句刚出现的人、物、动作或结果继续推进；对象可能混淆时，重新写明名字或称呼。\n- 让长短句、段落长度和停顿随内容变化，避免整齐得像模板。\n- 减少“因此”“同时”“此外”“然而”等机械连接词，让语序和事理承担衔接；确实表达因果、并列或转折时正常保留。\n- 把“进行了优化”“实现了提升”等名词化表达还原成具体动作、结果和承担者，说明改了什么、快了多少、谁少做了什么。\n- 允许必要的词语重复，不为了躲重复频繁更换同义词。\n- 以自然白话为基础；成语、古意和文学化语言只在当前文体、人物与语境承得住时使用。\n- 动作和细节已经传达情绪时，减少紧随其后的解释，不替读者重复说明已经能够感受到的内容。\n\n## 避免机械修辞\n\n- 检查“不是……而是……”“看似……实则……”等翻案结构是否先虚设一个读者并没有的误解，只为制造深刻感或给后文抬价。属于这种情况时，直接写判断和依据；文章确实呈现了认识变化、真实对照或必要辨析时保留。\n- 检查三项以上同构排比是否只在制造整齐和气势。机械排比应压缩或改变句式；具有真实内容、人物声音、情绪节奏或文体作用的排比不受数量限制。\n- 非虚构稿检查是否用“仓库”“浪潮”“温度”“死亡”“钥匙”等借喻包装抽象概念。比喻没有增加理解、只负责显得深刻时删掉；描述真实事物、形成稳定意象或确实帮助理解时保留。\n- 不因直接引语包含上述句式或表达就擅自改写。准确保留能够核实的原话；确需压缩或转述时，明确写成转述，不能伪装成逐字引语。\n\n## 小说与叙事规则\n\n仅在小说、故事、叙事性随笔、剧本或其他以人物和场景推进的任务中应用。\n\n- 让每个主要人物都有眼下想完成的事情、实际阻碍和行动可能留下的后果。\n- 通过选择、行动、退让、撒谎和重复犯错呈现性格，减少直接贴标签。\n- 让每场戏结束时至少改变信息、关系、计划、风险、理解或情绪中的一项；没有变化的场景应压缩、合并或删除。\n- 让对白承担试探、遮掩、说服、拖延、靠近或推开等具体作用，不让人物轮流替作者解释主题。\n- 让细节跟随当前视角，只写人物当时能够感知、误解和知道的内容。\n- 等人物真正碰到设定时再解释；保持既有规则一致，不能临时增加新规则救场。\n- 让场景与概述交替。关键选择、关系变化和不可撤回的动作放慢，重复过程和时间流逝快速带过。\n- 让结尾落在动作、关系的新位置、旧物的新含义或已经无法撤回的后果上；留白不能省掉人物的核心选择。\n\n## 执行流程\n\n1. 明确本次表达目的、读者、文体和交付形态；能够从上下文判断时不要重复提问。\n2. 从用户材料中提取必须保留的观点、事实、情节、语气和具体细节。\n3. 选择与本次任务匹配的画像部分，不机械套用历史题材或过去作品的意象。\n4. 完成用户要求的实际工作，不停留在风格分析或写作建议。\n5. 交付前检查：\n   - 核心意思是否准确，主线是否清楚；\n   - 是否出现空话、套话、过度解释或替用户下结论；\n   - 语言是否自然，句子主干、衔接与节奏是否清楚，是否保留用户本人的声音；\n   - 叙事作品的人物目标、场景变化、对白作用、细节、视角、设定和结尾是否真正服务内容；\n   - 当前请求是否覆盖了画像中的任何默认倾向。\n\n## 维护画像\n\n- 不因一次临时要求自动修改画像。\n- 用户明确表示某项偏好已经改变、要求记住新偏好或要求更新技能时，修改 `references/profile.md`。\n- 更新时区分跨文体倾向、叙事阶段性偏好和单篇项目要求，避免把个别作品固化成长期标签。\n- 画像与新请求冲突时，服从新请求，并在用户确认这是长期变化后再更新画像。\n",
  "s47": "# 第二职业曲线与个人定位深度推演汇编（2026-09-15 ~ 09-18）\n\n> 汇编自 Codex 与 WorkBuddy 深度推演原稿（含个人职业画像与决策约束、第二职业曲线设计、赛道与交叉点、副业冷启动建议、渠道与内容定位、区域品牌 D判断句与数据锚点、选题台账等）。\n\n\n---\n\n## 篇目：2026-09-15_副业冷启动建议.md\n\n# 副业冷启动：判断与四周实验\n\n> 日期：2026-09-15\n> 输入：个人职业画像与决策约束、九宫格经营诊断产品与推广方案评估包（2026-09-02）、蛋糕经营规划技能组（8 模块正式版）\n> 约束前提：在职、匿名、不裸辞、现金流底线 8000/月、可投入时间以周末和晚上为主\n\n---\n\n## 一句话结论\n\n值得做，但**不要把九宫格经营诊断当副业的起点去卖**。先用一次性专业服务验证「有没有人愿意为你的判断付钱」；九宫格经营诊断在这个阶段的角色是压低你自己的交付时间，不是产品本身要变现。\n\n---\n\n## 一、你手上真实有什么\n\n- **一套跑通过的方法论**，而且已经产品化：诊断 → 九宫格定位 → 六引擎取舍 → 四季路线 → 经营日历 → 渠道动作 → 30–50 项月计划 → H5 / 甘特图 Excel，8 个模块，有真实门店的 8、9、10 月计划做过逐项校准。\n- **一个已经在跑的内容账号**（个人专栏，X + 即刻），方向 9 月 9 日已定：泛生意观察，不绑蛋糕、不绑工具。\n- **稀缺能力**：把分散、定义不清的经营信息，变成取舍和可执行动作。这一条比九宫格经营诊断本身值钱。\n- **在职身份带来的真实项目样本**：门店周会、财报、用户反馈。\n\n## 二、你缺的不是产品，是三样东西\n\n1. 一份可公开的案例（一份就够）。\n2. 一次真实付费证据。\n3. 一次完整交付的真实耗时。你现在不知道它是 2 小时还是 8 小时，也就没法判断这门生意值不值。\n\n产品已经领先于验证了。所以接下来所有动作，都应该指向这三样。\n\n## 三、必须先解决的一件事：合规\n\n这条要排在所有动作前面，不是附注。\n\n- 先翻劳动合同里的竞业限制、兼职、利益冲突条款。拿不准就找个人看一遍，别自己猜。\n- 硬边界：不接公司现有客户、不接同类同城的竞品、不用公司资料和渠道、只用自己时间。\n- 对外一律匿名，客户信息脱敏后再综合化，不做可反向识别的精确时间 + 城市 + 营收组合。\n- 收款主体和方式先想清楚再收第一笔钱。\n\n---\n\n## 四、我对九宫格经营诊断定位的重判\n\n原方案想验证的是「用户用了第一份免费计划后，愿不愿意为第二个月付 99 元」。\n\n这个假设同时压了三个变量：需求真不真、定价合不合理、工具能不能被客户自己用起来。三个一起动，失败时你说不清是哪一条错了。\n\n**改成一次性交付：**\n\n- 卖的东西：一次经营诊断 + 下月计划取舍。一次沟通 1–2 小时，工具生成计划，之后一次复盘。\n- 定价先按 800–1500 元/次测试。这是未验证的区间，它的作用只是把「觉得有意思」和「愿意掏钱」分开。\n- 为什么不做 99 元/月：一次性交付不产生持续服务义务，不占满你的周末；单价能筛掉白拿的人；而且验证的问题更干净——他愿不愿意为一个判断付钱。\n\n**九宫格经营诊断在这里的位置**：把一次交付从 8 小时压到 2 小时的工具。它是成本结构，不是商品。等手上有了两三份真实案例和付费记录，再谈把它做成订阅或自助产品。\n\n## 五、第一批客户不从内容来，从「人」来\n\n- X 和即刻上蛋糕店主密度低，这一条你自己在推广评估包里已经判断过了。小红书是不是真的高密度，也还没测过。\n- 你从 2017 年到现在，经历过头部平台、前序项目、现在的咨询公司，微信里必然躺着大量餐饮、烘焙的老板和同行。\n- 所以冷启动第一个动作不是发内容，是约 5–8 个人聊 20 分钟。问三个问题：你下个月的月计划是怎么定出来的？谁定的？定完执行了多少？\n- 这不是获客，是确认需求。而且现在正是窗口——中秋在 9 月 25 日，节前十天的店主最忙、最焦虑，也最愿意说真话。\n\n## 六、内容不当获客主力，当交付记录\n\n- 你已经定了每日选题节奏，副业线不需要另开账号，也不需要更勤。\n- 每完成一次真实交付，把过程脱敏成一条「我为什么这样取舍」：我让他砍掉了什么，他最后没做什么，为什么。\n- 这样内容和交付不脱钩，不用编案例，也正好符合你「不把账号做成工具号」的方向。\n\n---\n\n## 七、四周实验\n\n| 周次 | 动作 | 记录什么 |\n|---|---|---|\n| 第 1 周 | 合规自查；列出 20 个能聊的人，实际聊 5 个 | 他们现在用什么替代方案定月计划；谁在定；痛感在哪一环 |\n| 第 2 周 | 挑 1–2 个痛感最强的人，免费做一次完整诊断 + 下月计划，全程计时 | 你实际花了多久；哪一步他听不懂；哪几项任务他明确说不会做 |\n| 第 3 周 | 把第 2 周的过程脱敏成 2–3 条内容；同时向第 1 周聊过的人报一个一次性价格 | 有没有人付；不付的理由是价格、信任还是「我自己能做」 |\n| 第 4 周 | 判断并决定继续、调整还是停 | 用下面的失败解释框架定位问题 |\n\n**四周后要拿到的最小结果**：至少 1 笔真实付费，或至少 3 份说得出具体痛点的访谈记录，加上一次真实交付耗时。\n\n## 八、失败解释框架\n\n| 现象 | 说明问题出在 |\n|---|---|\n| 约不到人，或聊两句就结束 | 渠道不对 |\n| 愿意聊，但说不出月计划是怎么定的 | 需求不对 |\n| 承认有痛点，免费要、收费就退 | 价格或信任不对 |\n| 付了钱，但说计划不准、不能执行 | 产品不对 |\n| 计划准，但只用了一次 | 使用频率不对，需要换更高频的场景 |\n\n五种原因的应对方式完全不同，所以每一周都要把「是哪种」记下来，别只记「有没有成」。\n\n## 九、我明确反对的几件事\n\n1. **先做落地页、投流、账号矩阵**。店主密度和平台判断都没验证过，这是最贵的一步。\n2. **把 99 元订阅当作第一个验证点**。变量太杂，信号会失真。\n3. **在拿到第一笔付费前，把九宫格经营诊断对外当产品卖**。你自己也写了：没有可公开案例，匿名身份会削弱背书。产品先藏在交付里。\n4. **现在同时开第二条副业线**（比如宠物）。你的周末只够跑一条。\n5. **把「AI 博主」当职业身份切换**。它是内容副线，这一条你已经写在约束里了。\n\n## 十、一个顺带的判断\n\n九宫格经营诊断已经证明了一件事：你能把自己的经验做成能跑的工具。这意味着下一个真正可复用的资产不是又一个工具，而是**「诊断 + 取舍 + 交付」这套动作本身**。等手上有了案例和付费记录，再决定是继续做蛋糕垂直，还是把它移到别的消费品类。\n\n蛋糕不是天花板。但第一批客户，最好还是从一个你已经懂行的场景里来。\n\n\n---\n\n## 篇目：2026-09-15_破局_渠道与内容定位.md\n\n# 破局：你不需要 IP\n\n> 日期：2026-09-15\n> 起因：好友里烘焙从业者不多，且多位是公司客户；不认可 IP 路线（胜率低、周期长）；自认分享欲和表达欲不强\n\n---\n\n## 一、先拆掉一个错误前提\n\nIP 的机制是这条链：\n\n> 持续表达 → 积累关注 → 关注转成信任 → 信任转成付费\n\n它需要两个条件：稳定的表达欲，和足够长的时间窗口。你两个都没有，也不认可它的成本结构。所以这条路**不是你不适合，是它不适合你**——直接排除，别再纠结要不要做。\n\n替代机制只有两个，共同点是都不需要表达欲：\n\n- **被推荐**：靠人，不靠内容。\n- **被搜索**：靠挂一个具体交付物，不靠发内容。\n\n## 二、好友不多不是问题，是取样错了\n\n你现在的问题问法是「我的好友里有多少烘焙老板」。应该换成：\n\n> **谁手上有烘焙老板？**\n\n节点人物清单（这些人每天都在见店主，介绍你对他们自己的客户关系是加分，所以他们不收钱也愿意介绍）：\n\n- 原料、包材、设备供应商与经销商\n- 烘焙培训学校、老师、结业学员群\n- 代运营、外卖与团购代理、本地生活服务商\n- 给烘焙店做设计、摄影、装修、冷柜、咖啡机的\n- 平台的本地 BD\n\n跟 5 个这样的节点建立关系，比加 50 个店主好友有用得多。而且这些人不是公司客户，正好绕开合规风险——他们的价值是**转介绍通道**，不是客户本身。\n\n## 三、闲鱼 / 小红书「发咨询」，理解要换一个\n\n不是做内容，是**挂一个能被搜到的具体交付物**。\n\n- **关键词要具体到真的有人会搜**：蛋糕店经营诊断、蛋糕店月度计划、蛋糕店复购方案、烘焙店活动怎么排。\n- **描述写「你会拿到什么」**，不写「我懂经营」：一份诊断结论、一份下月计划、一次 40 分钟电话沟通，以及各自的交付时间。\n- **边界写清楚**：包含什么、不包含什么、多久交付、怎么沟通。这一条比什么都重要，能挡掉大部分白拿方案的人。\n- **定价先放 199–399**，做前 3 单，换案例和评价。这个价格不是定价策略，是让你把「觉得有意思」和「愿意掏钱」分开。\n- **平台分工**：闲鱼当冷启动试验田（有真实成交和评价体系，比内容号的「感觉」硬）；小红书只挂服务，不日更长文。\n- **已知风险**：闲鱼客单价低、专业服务氛围弱，来的人里会有想白拿的。前 3 单人工筛：先问门店在哪个城市、月营业额大概多少，不回答的不接。\n\n## 四、每天发内容这件事，重新定位\n\n内容不再负责「把人找来」，只负责两件事：\n\n1. **交付记录**：每做完一单，脱敏写一条「我为什么让他砍掉这些」。\n2. **作品集**：别人找到你之后，用来判断你靠不靠谱。\n\n这样表达欲的需求从「每天都要有观点」降到「有活了才写」。可持续性完全不一样，而且你原来定的账号方向一条都不用改——泛生意观察、不绑工具，交付记录天然就是这个调性。\n\n## 五、接下来四周\n\n| 周次 | 动作 | 看什么 |\n|---|---|---|\n| 第 1 周 | 列出「手上有蛋糕店主」的节点人物 30 个名字，挑 5 个非公司关联的约聊，不提服务，只问：你客户里做蛋糕的，最常找你抱怨什么？ | 能不能接触到人，信息量够不够 |\n| 第 2 周 | 挂一个具体服务到闲鱼（可同时挂小红书），价格 199–399 | 有没有人点、有没有人问 |\n| 第 3 周 | 来第一单就做，全程计时，交付完写一条脱敏内容 | 交付实际耗时、他明确说不会做的部分 |\n| 第 4 周 | 判断 | 有没有成交、成交的是不是目标人群、耗时能不能压缩 |\n\n四周最小结果：**1 笔真实成交，或 5 份有效访谈记录 + 一次真实交付耗时。**\n\n## 六、止损条件\n\n四周内 0 成交且 0 有效访谈，说明的不是你不努力，而是「蛋糕店主」这个人群在你可低成本触达的范围之外。\n\n那就**换人群，不要更努力**。可选方向：餐饮（非烘焙）小老板；你已经在里面、但绕开公司客户的品类；或者干脆换到 B 端内部视角，做品牌方的经营分析岗。先别同时开两条。\n\n## 七、长期更稳的一手\n\n**渠道分佣**：让节点人物卖你的诊断服务，你给分成。你不用获客，他们不用交付。\n\n这一步把「获客」整个外包出去了，比做 IP 稳得多，也更符合你的性格——你出判断，别人出流量。等有 2–3 份案例之后再谈这个，现在只铺垫关系，不签任何东西。\n\n## 八、一句话\n\n> 你的资产不必建立在「你说过什么」上，可以建立在「你交付过什么」上。\n\n不靠发内容、靠被推荐和被搜索的专业人士一直存在——医生、律师、会计师、老技师。他们不做 IP，他们只是每次交付都靠得住。\n\n\n---\n\n## 篇目：2026-09-15_第二职业曲线设计.md\n\n# 第二职业曲线：设计思路\n\n> 日期：2026-09-15\n> 前提：抛开九宫格经营诊断这一个具体工具，假设方法都在脑子里、工具可以持续做出来\n> 约束不变：在职、现金流底线 8000/月、不裸辞、可投入时间以晚上和周末为主\n\n---\n\n## 一、先分清三样东西\n\n这三样混在一起，是绝大多数副业做不长的原因。\n\n| | 是什么 | 会不会过时 | 能不能被复制 |\n|---|---|---|---|\n| **工具** | 九宫格经营诊断、月度计划生成器、周报工作流 | 会，而且很快 | 能，AI 时代更快 |\n| **能力** | 诊断 → 取舍 → 翻译成动作 → 验收 | 不会 | 难，因为负责的是「决定做什么」 |\n| **资产** | 案例库、方法论、受众信任、复盘数据、股权或分成 | 越久越值钱 | 不能 |\n\n**核心判断：工具是消耗品，能力是手艺，资产才是曲线。**\n\n所以第二曲线的定义不是「我能做多少工具」，而是「我能不能把能力沉淀成资产」。按这个标准筛，九宫格经营诊断是资产化的第一步尝试，不是终点。\n\n## 二、你真正稀缺的那一个能力\n\n你的档案里写了六条能力，但最稀缺的是这一条：\n\n> 在信息不全、目标不清、责任人模糊的时候，做出一个之后不后悔的取舍。\n\n这不是分析能力，是判断能力。分析可以外包给 AI，取舍不行——因为取舍要承担后果，而 AI 不承担任何东西。\n\n这句话决定了你第二曲线的天花板在哪里：**只要还有人在为「该做什么」付钱，你就还有位置。** 一旦你开始按「我能做多少工具」来定义自己，位置就会很快被压掉。\n\n## 三、选型标准（用它去筛每个机会）\n\n1. **不破现金流底线**：任何需要先离职或先投入半年积蓄的，直接排除。\n2. **反馈闭环短**：你从 360 和美团离开的原因就是反馈太长、判断力使不上。新方向必须能在 2–4 周内看到结果。\n3. **能力复利**：做的每一件事，要让下一件更值钱。做重复的活不叫复利。\n4. **退出成本低**：最坏情况下能干净退出，不欠人情、不背库存、不签长约。\n5. **场景有你真实的兴趣或经验**：不满足这条的，你撑不过 18 个月。\n\n前四条是防守，第五条决定你能走多远。\n\n## 四、三条候选曲线\n\n**曲线 1：垂直场景的经营诊断顾问（餐饮、烘焙、小消费）**\n- 优势：启动最快、现金流最快、案例最真，完全在你现有能力上延长。\n- 风险：按时间卖，天花板由你的周末决定；在职身份带来合规和匿名成本。\n- 定位：**第一曲线，不是第二曲线。** 它的作用是产出现金流和案例，别指望它带你走远。\n\n**曲线 2：把判断方式做成可运行的工作流系统**\n- 不卖单个工具，卖「一套能跑起来的经营工作流」：数据进来，异常出来，责任落到人，复盘留下记录。\n- 关键转变：从「我帮你做」到「你的团队能用」。这一跳会把客单价从按次拉到按年，从个人拉到组织。\n- 真正的壁垒不是规则库（会被抄），是**复盘数据**——做得越久，判断越准，后来的人越追不上。\n- 风险：需要案例、需要真实用户连续运行、需要交付能力；匿名身份在这个阶段会拖后腿。\n\n**曲线 3：内容 → 信任 → 资产的入口**\n- 内容本身不是生意。内容是把信任**存下来**的方式。\n- 你的账号如果哪天成了「小消费品牌到底能不能做」这个问题的固定回答者，后面什么都能接：服务、课程、社群、孵化、投资。\n- 必要条件：有一个**只能由你回答的问题**。不是「这个月该做什么活动」，那太工具了；是「这门生意值不值得做」。\n\n## 五、我更看好的一条：让判断变成可以持有的东西\n\n把三条曲线接起来看，终点不在服务，也不在工具，在**你用自己的判断去参与一门真实生意**。\n\n路径：\n\n1. 用一次性服务换案例和现金流（0–12 个月）。\n2. 用案例和内容换判断力的声誉（6–30 个月）。\n3. 用声誉和钱，去参与真实生意：参股、共建品牌、做小型消费孵化或早期投资（18 个月以后）。\n\n为什么是这条：\n\n- 服务按时间卖，上限是你有多少个周末。\n- 工具会被 AI 抹平，今天做出来，明年就是基础能力。\n- 只有**资本 + 判断**能突破时间上限，而且你已经有 10 年投资的底子，这一块不是从零开始。\n\n风险也清楚：参与真实生意需要钱和退出能力，你现金流紧、风险厌恶。所以这一步必须排在最后，而且要小额、可逆、可退。\n\n## 六、时间结构\n\n三条线是并行推进的，不是三选一。\n\n| 阶段 | 主要动作 | 阶段目标 |\n|---|---|---|\n| 0–6 个月 | 接一次性诊断与计划服务，全程计时 | 1 笔真实付费 + 1 份脱敏案例 |\n| 6–18 个月 | 内容做成判断的输出口；把交付沉淀成工作流；攒 3 份以上可复用案例 | 有人主动来找你，而不是你去找人 |\n| 18–36 个月 | 用声誉和资金参与真实生意；同时保留一条稳定的服务线兜底 | 出现第一笔非时间性收入 |\n\n**每 6 个月做一次加注或止损。** 三个判断标准：这半年有没有新增可复用案例、有没有新增真实付费、有没有人主动找你。三个都是零，就停下来重想，不要靠更努力来掩盖方向错了。\n\n## 七、要避开的坑\n\n1. **不要做工具博主。** 工具会被抹平，账号会被工具化，最后你成了工具的销售，不是判断的来源。\n2. **不要用「我还能做很多工具」当理由去接各种活。** 那是把能力兑换成劳力的最快路径，而且是不可逆的。\n3. **不要同时开三条线。** 你的周末只够跑一条主线加一条副线。\n4. **不要在没有案例时对外卖产品。** 匿名 + 无案例，信任建立不起来，会消耗掉你最贵的资产——时间。\n5. **不要用时间换钱超过 18 个月。** 超过这个点，路径依赖就会形成，越晚越难转。\n6. **不要把兴趣线（宠物、运动）现在开成第二条副业。** 兴趣线的价值是长期燃料，不是启动资金。等第二曲线有了现金流，它才有资格变成选项。\n\n## 八、如果只做一件事\n\n写下来一句话，贴在看得见的地方：\n\n> 我不卖工具，也不卖时间。我卖的是「在信息不全的时候，这门生意该不该做、先做什么」这个判断。\n\n这句话如果三年都没变，说明第二曲线是成立的。如果半年就变了三次，说明还在找方向，那就继续做服务、攒案例，别急着下注。\n\n\n---\n\n## 篇目：2026-09-15_赛道与交叉点.md\n\n# 赛道与交叉点：烘焙要不要留，兴趣能不能当路\n\n> 日期：2026-09-15\n> 起因：Mirror 表示真正喜欢的是街舞，另有宠物和少儿/青少年心理教育两条兴趣线；对长期继续做烘焙生意有抗拒；但认为积累已深，换赛道代价大。\n\n---\n\n## 一、先纠正一个事实：烘焙不是在下坡，是在出清\n\n你的感受方向是对的，但性质不是「需求没了」：\n\n- 窄门餐眼统计，2025 全年面包烘焙门店新开约 2.9 万家、关停 9.2 万家、**净减少 6.3 万家**，日均关停近 200 家。\n- 2025 年 5 月至 2026 年 4 月：新增 4385 家、关停 9.24 万家、净减少 8.8 万家，**闭店率约 25%**。\n- 门店平均存活 32 个月，超过一半撑不过两年（2024 年调研，后续可能更短）。\n- 同时，行业规模仍在增长，2025 年约 1105 亿元，增速约 5%。\n\n**门店在死，蛋糕还在变大。** 分流来自商超烘焙、茶饮、家庭烘焙和冷冻供应链，不是来自消费者不吃。\n\n这个区别很关键：如果需求消失，经验作废；如果只是供给出清，那幸存下来的店更需要效率，要死没死的店更需要有人告诉他该不该继续。**出清期，判断力的需求是上升的。**\n\n（口径提示：以上数据来自行业数据库和媒体转述，不同来源统计范围不一致，只作方向参考。）\n\n## 二、你的抗拒是信息，我不打算说服你\n\n先分清楚你抗拒的到底是哪一个：\n\n- 抗拒**烘焙这个品类**？\n- 还是抗拒**被锁死在烘焙**？\n\n这两个答案指向完全不同的做法。多数时候是后者——不是不喜欢这门生意，是不喜欢「我这辈子就这样了」的感觉。\n\n## 三、关键判断：你积累的不是烘焙知识，是看小生意的眼光\n\n- **换行业**：样本清零，代价大。\n- **换问题**：你回答的还是同一个问题——一门小生意为什么活、为什么死、人为什么肯掏钱。这不叫换赛道。\n\n烘焙知识会随行业贬值，看生意的眼光不会。所以你要换的是样本，不是问题。\n\n## 四、三样兴趣，各自能承载什么\n\n| | 能不能当饭碗 | 能不能当赛道 | 能不能当能力模块 |\n|---|---|---|---|\n| **街舞** | 不能。收入结构差，要变现基本等于自己开工作室，而你现在现金流不允许 | **能**。这是唯一一个你真心喜欢又真的懂行的行业 | 能 |\n| **宠物** | 不能，现在 | 长期可以。情感消费，付费决策高度心理化，和你已有的账号工作流能接 | 能 |\n| **少儿心理教育** | **不建议**。资质门槛、教培监管、行业薪资低，而且讲师和咨询都需要大量输出——和你说自己表达欲不强直接冲突 | 不建议 | **能，而且是最高价值的那一个** |\n\n## 五、有一个交叉点，几乎是照着你的履历长的\n\n把三样叠在一起看：\n\n> **少儿兴趣教育（街舞为主）的经营与续费诊断**\n\n为什么是这条，看行业事实：\n\n- **极度分散**：行业 CR5 合计市占率不足 12%，没有全国性巨头。最赚钱的是区域头部和只有一两家校区的中小机构。这意味着大量机构需要外部判断，而不是被连锁体系消化掉。\n- **校长画像高度一致**：多数是舞蹈教师出身，**擅长教学，不擅长运营管理**。师资留任难、招生压力大、利润薄。\n- **家长的决策权重**（一份覆盖 30 城、1247 家机构的调研）：师资专业 42% ＞ 课程科学安全 35% ＞ 舞台展演机会 28% ＞ 环境安全 22% ＞ **价格 18%** ＞ 考级证书 12%。\n\n  价格排第四，考级证书垫底。**这是一个信任驱动的市场，不是价格驱动的市场。**\n- **学员流失的前两位原因**：学业压力与时间冲突；课程机械重复、孩子丧失兴趣。两条都是心理问题，不是营销问题。\n- **行业三大痛点**：低价内卷、产品同质化、师资流失（老师离职带走学员）。\n- **经营指标已经很清楚**：满班率健康值 ≥80%、老生续费率 55–70%、转介绍占比 ≥30%、月消课率是生命线、预收款是负债不是利润、人力成本占营收 35–45%。\n\n把这几条和你对上：\n\n| 行业缺什么 | 你有什么 |\n|---|---|\n| 会经营的人（校长只会教） | 经营诊断、项目管理、策略拆解 |\n| 懂孩子和家长为什么走的人 | 心理学背景、家里有青春期的弟弟妹妹、乐于做心理洞察 |\n| 懂街舞这个行业本身的人 | 待过舞蹈品牌总部，自学 SQL 研究过学员消课和续费 |\n\n**三样各占一样，而且这三样同时具备的人非常少。** 这是你目前最像护城河的东西。\n\n风险也要说清楚：这个行业同样在卷，出生率下行、教培监管收紧、合规门槛（办学许可、场地消防、师资资质、预收费资金托管）都在提高。所以你的位置是**外部顾问**，不是办学方——不开店、不碰预收款、不做招生代理。\n\n## 六、落地顺序：不换赛道，只换样本\n\n| 阶段 | 做什么 | 验证什么 |\n|---|---|---|\n| 现在–6 个月 | 继续在烘焙/餐饮接一次性诊断服务，攒案例和付费证据；观察里加入「动机和心理」这一层 | 有人愿意付钱 |\n| 6–18 个月 | 用同一套交付方式，试 1–2 个街舞或少儿兴趣教育机构（非公司客户、非同城竞品） | **同一套经营判断，换一个行业还成立吗** |\n| 18 个月以后 | 如果成立，定位从「蛋糕店经营顾问」升级为「小生意经营判断者」，样本横跨品类 | 要不要重仓街舞这条线 |\n\n第二阶段那道题，比验证 PMF 重要得多。因为**跨品类可迁移的判断力，才是资产；只会做蛋糕的方法，只是工具。**\n\n## 七、心理这条线怎么放\n\n不要当职业，当**标签**。\n\n你的差异化从来不是「懂经营」——懂经营的人很多。是「懂经营，而且懂人」。加上青少年心理这个底色，你在所有「家长付费」的生意里都会格外可信。\n\n现在能做的：读、写、观察弟弟妹妹。不急变现，也别去考任何证。\n\n## 八、最后一句\n\n你现在的抗拒里，有一部分是沉没成本的焦虑——觉得换了就白干。但按上面的算法，你一点都不会白干：\n\n> 烘焙给你的是样本，街舞给你的是持续做下去的理由，心理给你的是别人学不走的视角。\n\n三样合起来才是你，缺一个都不完整。\n\n\n---\n\n## 篇目：2026-09-15_选题候选.md\n\n# 个人专栏｜2026-09-15 选题候选\n\n- 交付时间：2026-09-15 18:30（北京时间）\n- 目标：延续 2026-09-09 确认的方向——建立有商业 sense、懂经营分析、有个人判断和活人感的专家形象\n- 说明：只交候选，选定后再写阅读约 1–3 分钟的正文\n\n---\n\n## 前置检查\n\n- 本地备份台账最新记录止于 2026-09-04，9 月 8 日《营销碎碎念 03》未同步进备份文件。\n- 飞书正式台账本次未读取（当前会话没有飞书凭证），到期检查点状态未知，数据未刷新。\n- X 主页本次可读：可见 9 月 3 日、9 月 4 日、9 月 8 日和一条“约 21 分钟前”关于品牌护城河与购买理由的内容；9 月 9 日–9 月 14 日段没有可见帖子（页面仅展示部分帖子预览，不能排除还有更多）。\n- 即刻主页需要登录，本次未能读取。\n\n---\n\n## 候选 1｜中秋前十天，礼盒真正难的不是卖，是备多少\n\n**视角**：供应链、生产能力（D）＋真实经营现场（E）\n\n**核心判断**：节日礼盒首先是个生产计划问题。决定这一季赚不赚的，是节前压下去的库存能不能在节前卖掉；包材起订量、产能峰值和排班，都排在这个决定后面。\n\n**开场**：\n\n离中秋还有十天。订单开始动了，后厨在排加班班次，老板手上压着一张包材单——起订一千套，今年能卖掉多少？去年剩的盒子还在仓库里，没人愿意提。到这个节点再想活动和文案，其实已经晚了，这一季赚不赚，前面两个月就基本定下来了。\n\n**展开路线**：从中秋礼盒“预订制还是现货制”的选择讲起，落在三个提前决定上——包材起订量对应的真实销量、峰值产能要挤掉哪些日常订单、节后剩余库存怎么消化。最后回到老板最容易忽略的一点：节日生意的成本不在盒子上，在卖不完的那部分。可核实的锚点：2026 年中秋为 9 月 25 日（周五），放假 9 月 25 日至 27 日，不调休。\n\n**可展示的商业判断**：把节日旺季从氛围和创意，还原成产能、库存和现金的取舍。\n\n---\n\n## 候选 2｜买礼盒的人和吃礼盒的人，不是同一个人\n\n**视角**：消费者心理与购买理由（B）\n\n**核心判断**：礼赠消费里，掏钱的人买的是“送出去不出错”。自家最得意的产品带不动礼盒，常常是因为它回答的是好不好吃，而顾客在柜前问的是对方收到会不会觉得我花了心思。\n\n**开场**：\n\n顾客站在柜台前挑礼盒，问了三个问题：包装拿得出手吗，会不会太素，有没有袋子。店员推了自家最得意的那款，说过节这个味道最好卖。顾客点头，然后拿走了旁边那只看着更体面的。结账时补了一句：反正是送人。买的人和吃的人，从头到尾不是同一批。\n\n**展开路线**：把礼赠场景拆成两条决策链——买的人承担社交风险，收的人承担食用体验；讲清楚门店常见的错配，用自吃逻辑做礼盒选品和推荐话术；最后给出可观察的做法，比如在礼盒上直接写清楚送谁、什么场合、对方会在意什么。\n\n**可展示的商业判断**：区分买单的人和使用的人，用场景而不是口味解释礼赠型客单价。\n\n**边界提醒**：今天已有一条关于购买理由的内容，本篇切的是礼赠决策链，不是品牌护城河。若两条太近，可顺延一到两天。\n\n---\n\n## 候选 3｜很多开店的人，卖的不是生意，是自己做主\n\n**视角**：创业者动机与选择（A）\n\n**核心判断**：有些人要的是自主感，不是现金流。这两种动机在赚钱的时候看不出差别，第一次连续亏损的时候就分开了——自主感受到威胁，人会把亏损当成对自己的否定，然后做出更赌的决定。\n\n**开场**：\n\n有些开店的人，是从大公司出来的。前半年力气几乎都花在“我们这家店该是什么样子”上：装修改了两轮，产品定了又调，招牌字体来回换。第一个冬天营业额腰斩，他做的第一件事是再拿一笔钱把门头重做一遍。账上的窟窿没补，但他觉得自己重新有了方向。\n\n**展开路线**：区分三类动机——想自己做主、想被证明、真的喜欢做这件事，讲它们各自在哪个节点会失效（连续亏损、被同行比下去、日复一日的重复），最后落到一个能自检的问题：如果这门生意三年都不赚钱，我还想开吗。不劝退，也不鼓励。\n\n**可展示的商业判断**：把“创业”从勇气话题还原成动机结构，并指出不同动机会在哪个经营节点上翻车。\n\n---\n\n## 候选 4｜为了一个大单开的例外，最后是所有普通顾客买单\n\n**视角**：真实经营现场、组织与执行取舍（E）\n\n**核心判断**：破例改规格、插队排产、临时压价，看起来是在抓大客户；真实成本是当天所有日常订单的交付质量和员工对标准的信任。例外开得越随手，标准越只存在于手册上。\n\n**开场**：\n\n一个企业客户打电话来，要五十个蛋糕，后天早上要，规格还得按他们自己的想法改。老板当场答应，还压了价。后厨当天的排产全打乱，日常订单拖到晚上才做完，两个差评当天就来了。老板觉得这是抓大客户，员工学到的是另一件事：标准可以让路。\n\n**展开路线**：算一笔例外的成本账——插单占掉谁的产能、改规格带来多少返工、压价怎么变成下一次报价的上限；再讲怎么把“要不要破例”变成一条提前说清楚的规则：谁有权批、代价从哪里补、补不回来就不接。\n\n**可展示的商业判断**：用一次例外看清标准和产能的真实代价，判断抓大客户什么时候在消耗自己的长期能力。\n\n---\n\n## 推荐\n\n- **首选 1 和 2**：一供一需。候选 1 从产能、库存和现金看节日生意，候选 2 从买的人和用的人看礼赠决策。两条都不落在营销动作上，也不依赖工具输出，隔天连发不腻。\n- **如果今天想要更尖、更有冲突感的一条，选 4**。它现场感最强，落点是一次取舍，不是批评员工执行力。\n- 候选 3 适合放在没有节点的时候用，人物动机的代入感更强，但需要多一天准备开场素材。\n\n\n---\n\n## 篇目：2026-09-16_选题候选.md\n\n# 个人专栏｜2026-09-16 选题候选\n\n- 交付时间：2026-09-16 11:30（北京时间）\n- 本次范围：只交候选选题，不检查 X 主页 / 即刻主页 / 飞书台账，不回收数据，不发布，不登记\n- 去重依据：\n  - 本地台账备份最新记录止于 2026-09-04（`~/Documents/work/outputs/content-ledger/个人专栏_发布与数据台账.md`），9/8 之后的内容未同步进备份，飞书正式表本轮未读取，因此「近期已发布」只能按备份口径参考，可能存在遗漏。\n  - 9/15 已交付的 4 条候选：中秋礼盒备货（D/E）、礼赠决策链买的人≠吃的人（B）、开店动机是自主感不是现金流（A）、为一个大单破例的成本（E）。本次 5 条全部避开这 4 条。\n- 边界声明：文中出现的人物场景为典型现场还原，不是亲历案例；涉及外部事实的已标注核实来源，属推断的已标注边界。\n\n---\n\n## 候选 1｜开学第三周，第一门被砍掉的课\n\n**视角**：真实经营现场、组织与执行取舍（E）＋消费者决策（B）交叉\n\n**核心判断**：兴趣班的续费对手不是隔壁机构，是学校的作业量。秋季续费的胜负手在开学后第三到四周，家长第一次看到孩子完整的晚间时间表；课程排在周中晚上、请假规则又硬的机构，会主动把自己送进「砍一门」的排序里。\n\n**开场**：\n\n开学第三周。前台微信弹出一条退课消息，家长说得挺客气：孩子作业写不完，先停一段。机构刚发完秋季招生的成果海报，校长说这波稳了。这门课能不能续下去，取决于孩子晚上作业写到几点、课程排在周几晚上——秋季班开得好不好，只是前台看得见的那部分。\n\n**展开路线**：把「续费」从销售话术还原成排课结构和请假规则。三层：一是时间位置，周中晚课和周末课面对的是两个完全不同的替代品（作业 vs 别家机构）；二是补课与请假政策，规则越硬，家长越早止损；三是续费沟通的时点，等家长开口再谈已经晚了，第一次沟通应该放在开学第一周，让对方把时间表先摊开。可核实锚点：2026 年秋季学期全国多数地区 9 月 1 日开学（武汉市教育局、广州市教育局、韶关乐昌市教育局等通知口径一致），本周为开学后第三周。**边界**：退课比例没有公开可引用数据，不写具体数字，只做机制判断。\n\n**可展示的商业判断**：把续费率还原成时间结构和替代品竞争，而不是话术与优惠力度。\n\n---\n\n## 候选 2｜顾客说「太甜了」，问的通常是别的事\n\n**视角**：消费者心理与购买理由（B）\n\n**核心判断**：多数「太甜了」不是配方意见，是决策成本在说话——只买一个，选错了就亏。按字面减糖，改掉的是差异点，没解决顾虑。顾客缺的是选品信息：多大份、什么时候吃、配什么、能放多久。\n\n**开场**：\n\n柜台上，顾客尝了一口，说太甜了，问有没有不那么甜的。店员指了指低糖那款，她看了一眼价格，又拿起原来那款去结账。这类反馈老板每天都能收到，记下来，让后厨把糖减了两成。一个月后销量没什么变化，老客倒是问了一句：怎么没以前香了。\n\n**展开路线**：先把反馈分两类——口味意见和决策焦虑，两者在柜台前的说法长得几乎一样。再把「太甜」翻译成三个可验证的问题：是不是分量偏大、是不是缺小规格、是不是没有参照物可比。落到做法：改配方之前，先改呈现——把分量、场景、搭配写在顾客看得见的地方，让一次购买变成低风险决定。**边界**：没有门店反馈数据支撑，是常见现象的机制推断，不写比例。\n\n**可展示的商业判断**：分清「顾客说的」和「顾客做的」，不按字面改产品。\n\n---\n\n## 候选 3｜被隔壁抄了产品，先去查自己的损耗率\n\n**视角**：品牌、模仿、差异化和竞争力（C）\n\n**核心判断**：菜单、包装、装修都能抄，损耗率和排产效率抄不走。同款卖得比你便宜，账通常不出在定价上，出在后台。被模仿时真正该问的不是「要不要降价」，而是「我的成本结构还领先吗」——领先就守，不领先的话，降价只是把问题往后推。\n\n**开场**：\n\n对面开了家新店，招牌产品和自家几乎一样，价格低两块。老板第二天就去拍了照，回来开会讨论要不要跟着降。没人去问三件事：对面一天卖多少、报废多少、后厨站着几个人。三周后，对面开始缺货，自家货架没动过。\n\n**展开路线**：把「被模仿」拆成三层——表层是产品和文案，中层是人力配置、产能和损耗，底层是复购和熟客关系。模仿者一般被卡在中层，所以只剩价格一个武器。给一个自查顺序：先算自己的报废率和人均产出，再决定守价还是调结构，最后才轮到话术和活动。不写「要持续创新」这类口号，也不一律反对模仿——跟得快的店有时候确实能吃到窗口期，代价是永远没有定价权。\n\n**可展示的商业判断**：把差异化从「创意」还原成后台效率，判断一场价格战该不该接。\n\n---\n\n## 候选 4｜用现制的价格卖预制的东西，才是真问题\n\n**视角**：供应链、生产能力、同质化、AI 等商业变化（D）\n\n**核心判断**：顾客反对的不是预制，是被当成手工卖的预制。冷冻半成品把损耗和用工压下来，这是能力；把它包装成「每日现做」，短期赚差价，长期把自己和整个品类一起贬值。省下来的成本，要么让给顾客，要么换成品控，不该悄悄记进利润。\n\n**开场**：\n\n后厨新来的店员把冷冻面团推进烤箱，三分钟，出炉的可颂卖相不差。前台海报上写着「每日现烤」——这句话以前是实话，现在不是了，也没人改。老板不觉得有问题：反正顾客吃不出来。\n\n**展开路线**：分开讲两件事——用预制降本（正常经营选择）和用预制的成本卖现制的价（透支品类信任）。再讲「现烤」这三个字为什么是社区店少数还能自己定价的资产，一旦被戳破就收不回来。最后落两个可选动作：改标签、把省下的钱部分让给顾客，或者保留一部分真手工、把差价讲清楚。可核实锚点：2026 年国内冷冻烘焙渗透率大致在 15% 上下，已经是门店常规选项而非偷工减料的代名词；不同机构口径差异较大（有 250 亿、300–420 亿等不同说法），引用时只讲趋势，不写死规模数字。\n\n**可展示的商业判断**：把预制与现制之争从道德话题还原成定价合理性问题。\n\n---\n\n## 候选 5｜加盟前该看的不是能赚多少，是总部的钱从哪来\n\n**视角**：创业者动机与选择（A）\n\n**核心判断**：总部的主要收入如果来自加盟费、装修款、首批货款和设备差价，它和加盟商是否赚钱这件事，方向上并不一致。判断一个体系值不值得进，看它靠什么收费、哪些收入是持续的，而不是看招商会上的月流水。\n\n**开场**：\n\n招商会上，屏幕里的加盟店月流水很好看。台下有人问，总部收哪些钱：加盟费、保证金、首批货款，装修走指定供应商，设备从总部买，原料按体系价每月供应。再问一句加盟店每月有没有最低采购量，对方开始讲品牌赋能。\n\n**展开路线**：把加盟体系分成「靠开店赚钱」和「靠经营赚钱」两类，看它收入结构里一次性收入和持续性收入的比例。给三个必须落到纸面的条款：有没有最低采购量、有没有区域保护和续约条件、退出时设备和包材怎么处理。最后给一个动作：把这些条款带回家，按三年算一次账。不劝退，也不鼓励——模式本身不是问题，问题是你有没有看清对手方的利益在哪一头。\n\n**可展示的商业判断**：用收入结构判断合作方的利益是否和自己一致。\n\n---\n\n## 推荐\n\n- **首选候选 1**。它是唯一自带时间窗口的一条：本周正是开学后第三周，家长的退课决定就在这几天发生，写出来有现场，也顺带把你往少儿兴趣教育方向的观察记进作品集。角度上和昨天的礼盒、礼赠两条完全不重叠。\n- **次选候选 4**。五条里最尖、最有行业锚点的一条，冲突直接摆在「海报写着每日现烤」这个具体动作上，同行看了容易有反应。和候选 1 的差别在于：候选 1 讲的是需求端的时间结构，候选 4 讲的是供给端的定价正当性，一条温和一条带刺，隔天连发不腻。\n- 备选：如果想要冲突更强、更贴近开店人日常情绪的，用候选 3；候选 5 适合放在没有时间节点的时候用，但需要多花点时间核实具体加盟合同条款的常见形态。\n- 不承诺流量，也不承诺数据表现。\n\n\n---\n\n## 篇目：2026-09-17_选题候选.md\n\n# 个人专栏｜2026-09-17 选题候选\n\n- 交付时间：2026-09-17 10:55（北京时间）\n- 本次范围：只交候选选题。未检查 X 主页、即刻主页和飞书台账，未回收数据，未发布，未登记。\n- 去重依据与边界：\n  - 本地台账备份最新记录止于 2026-09-04（`~/Documents/work/outputs/content-ledger/个人专栏_发布与数据台账.md`），9/8 之后的内容未同步进备份，飞书正式表本轮未读，因此「近期已发布」只能按备份口径参考，可能存在遗漏。\n  - 避开 9/15 已交付的 4 条（中秋礼盒备货、礼赠决策链、开店自主感、大单破例）与 9/16 已交付的 5 条（兴趣班续费时间结构、顾客说太甜、被模仿查损耗率、预制卖现制价、加盟看总部收入结构）。\n  - 文中人物场景为典型现场还原，不是亲历案例；属推断的已标注边界，不写不可核实的具体数字。\n\n---\n\n## 候选 1｜招牌换成新的，老客在门口愣了一下\n\n**视角**：品牌、模仿、差异化和竞争力（C）\n\n**核心判断**：品牌升级改的是视觉，动的是顾客的记忆索引。门店的识别度靠的是顾客隔着三十米、不看门牌就能认出你，这件事和设计好不好看是两套标准。换 VI 之前该先算的一笔账：老客找店那两秒，值多少钱。\n\n**开场**：\n\n老张的店换了招牌。总部统一视觉，红底白字换成黑底金字，设计确实好看，路过的都说高级。第二天，一个买了三年的老客在门口停了两秒，往里看了一眼才进来，顺口说了句，我还以为你家搬走了。老张笑了笑，没接话，那周的客流也没什么变化。\n\n**展开路线**：分三层。第一层，改之前先问顾客到底靠什么记住你——颜色、招牌上的字、还是门口那个用了五年的旧灯箱。第二层，老客的认知追上新视觉需要时间，中间这段靠什么维持识别，是写在包装上的名字，还是店员的脸。第三层，统一视觉和本地适应之间的取舍：物料、包装、菜单可以一次全动，门头、招牌色、店名位置最好留一项到最后。不写「品牌要重视顾客认知」这种话。**边界**：不引用具体品牌的换标后销量数据，没有可核实的来源，此处是常见经营现象的机制推断。\n\n**可展示的商业判断**：把品牌升级从设计问题还原成顾客记忆与识别成本问题，判断哪些改动能一次做完、哪些要留到最后。\n\n---\n\n## 候选 2｜老客进门说「老样子」，这句话值多少钱\n\n**视角**：消费者心理与购买理由（B）\n\n**核心判断**：常客再来，买的不是最优解，是最省事的解——进门、报单、付钱，决策成本已经压到接近零。改配方、换包装、调位置，动的都是这条已经跑顺的路径。风险该按老客占比算，不该按新产品好不好算。\n\n**开场**：\n\n下午三点，熟客推门进来，不用看菜单，说了句老样子。店员手上的动作没停，那边已经在装袋了。这类顾客从不参与评价，不写点评，不在群里说话。所以老板做产品调整的时候，最容易忘掉的就是他们——等他们发现味道变了，通常已经过去半个月。\n\n**展开路线**：把顾客按决策成本分三层看：第一次来的在比较，犹豫型的在排除，常客在重复。同一个改动对三层的作用不一样，先分清这次改的是拉新效率还是老客的路径。落到一个具体动作：动手之前先看老客复购集中在哪几个品类，要动他们点得最多的那一个时，格外小心——要么小步改，要么给老客一个提前知道的理由。**边界**：没有门店复购数据支撑，属常见消费行为的机制判断，不写比例。\n\n**可展示的商业判断**：用决策成本区分拉新和留存，判断一次产品改动该冒多大风险。\n\n---\n\n## 候选 3｜门店里最先该交给 AI 的活，是顾客不在场的那部分\n\n**视角**：供应链、生产能力、同质化、AI 等商业变化（D）\n\n**核心判断**：门店里适合先上 AI 的环节有三个共同点——有历史数据、结果能回头验证、出错不直接冒犯顾客。订货量、排班、损耗预测、备货节奏都符合；顾客接待、投诉处理、现场判断不符合。谁先把 AI 摆到柜台上，谁先把风险放大。\n\n**开场**：\n\n订货这件事，老板每天早上凭手感勾一遍：上周卖得好，多备两箱；天气热，少做点。勾错了，晚上报废半箱。同一家店做了三年，账上躺着三年的日报表，没人翻过。隔壁那家开始让系统按历史销量和天气给建议，老板看了眼报表，说这不是我平时想的那个数。\n\n**展开路线**：先给一个判断标准——数据在不在、结果能不能回头验、错了谁承担；再拿门店里的活逐项对照，把订货、排班、损耗预测、备货放进「可以先上」，把接待、投诉、现场决策放进「先别急」。中间插一个容易被跳过的前提：AI 的输入是门店自己的历史数据，日报表记不记、记多细，决定了这件事的起点在哪；数据是烂的，工具只会把烂结果放大。**边界**：这是机制推断和常见行业做法的归纳，不是实测效果，不写「能省多少成本」。引用具体工具或平台时只引公开可查的功能说明。\n\n**可展示的商业判断**：用「有数据、可验证、容错高」三个条件判断一个环节该不该上工具，而不是按新鲜度判断。\n\n---\n\n## 候选 4｜三个人凑钱开店，第一份协议该谈散伙\n\n**视角**：创业者动机与选择（A）\n\n**核心判断**：合伙的动机通常是「一个人不敢」，于是找个人分担风险。风险是分了一半，决策权也分了一半，这件事赚钱的时候看不出来，第一次要往里追加钱的时候就会摊在桌上。开店前要落到纸面的不是股份比例，是分歧怎么裁。\n\n**开场**：\n\n开业前三个月，三个人凑的钱花得差不多。房租又要交了，一个人说再各拿五万，另一个人说先关掉止损，第三个人没说话——他管后厨，不出钱，但每天在店里十几个小时。谁说了算这个问题，从第一天就没写下来过，现在得用吵架的方式补。\n\n**展开路线**：把合伙拆成三个必须提前写清的条款——钱怎么追加、谁有最终决定权、出钱多的人和出工多的人怎么算。再给一个判断：合伙稳不稳，不取决于关系好不好，取决于分歧有没有裁决机制。最后落一个能马上做的动作：开店前写一页纸，「如果我们三个吵不出来怎么办」，比写股份比例有用。不劝人别合伙——一个人扛不动的生意，找人分担是合理的，代价是提前把丑话说完。\n\n**可展示的商业判断**：把合伙从信任和感情话题还原成决策权与退出条件的设计问题。\n\n---\n\n## 候选 5｜房东说要涨租，你手上的筹码比想象中少\n\n**视角**：真实经营现场、组织与执行取舍（E）\n\n**核心判断**：租金谈判里，定结果的是房东判断你走不走得起，跟你这家店做得好不好关系不大。装修投入、搬不走的设备、集中在附近的老客，这些沉没成本房东比你清楚。所以准备功夫不在谈的时候怎么讲价，在谈之前手里有没有一个真能执行的备选。\n\n**开场**：\n\n房东打电话来，说这一排都涨了，明年起每月加两千。老板在店里转了一圈，看了看刚做满两年的装修，看了看墙上那台搬起来很麻烦的烤箱，回头说行吧。他其实算过，搬到隔壁街丢掉的老客比这两千块贵。麻烦的是，这句话他没打算让房东知道。\n\n**展开路线**：把涨租拆成三层——房东的筹码（换租客要空置多久、重新招租花多少、这一排的行情），你的筹码（能不能搬、搬走损失多少、合同还剩多久），以及能提前做的事：合同期内的续租条款怎么签、周边同类铺位的行情留个记录、手上有没有一个真去看过的备选铺位。落到一个判断：如果算下来搬走更划算，那就先去看铺再谈价；手里没有备选的时候，谈的其实不是价格。**边界**：不同城市和业态的租金行情差异很大，不引用具体数字，只讲谈判筹码的结构。\n\n**可展示的商业判断**：把租约决策从「成本高低」还原成「谁的替代方案更差」，判断什么时候该接受涨租、什么时候该走。\n\n---\n\n## 推荐\n\n- **首选候选 2（老客的决策路径）**。最日常、代入感最强，谁都有一家常去的店。它和 9/16 那条「太甜」是同一视角的两个切面：那条讲顾客说的和做的不是一回事，这条讲老客为什么不说。\n- **次选候选 5（租金谈判）**。五条里钱最真、冲突最实，是唯一一个「明天就可能碰上」的场景，谈崩了直接影响现金流。\n- 角度差别：候选 2 在柜台上，处理的是需求端的决策成本；候选 5 在房东的客厅里，处理的是双方的替代方案谁更差。一条看顾客，一条看对手方，隔天连发不腻。\n- 备选：候选 3 有行业新鲜度，但必须把边界写死（不能写「省了多少成本」）；候选 4 人物冲突强，适合没有时间节点的时候用；候选 1 需要克制，容易写偏成设计评论。\n- 视角覆盖：A、B、C、D、E 五类全占，不连续堆营销动作、复盘或员工执行力。\n- 不承诺流量，也不承诺数据表现。\n\n\n---\n\n## 篇目：2026-09-18_区域品牌 D_判断句与数据锚点.md\n\n# 区域品牌 D｜判断句素材与数据锚点\n\n> 整理：2026-09-18\n> 用途：内容写作时直接取用的句子与数字。**所有数字均已回原始文件核对。**\n> 对外口径：客户名写作「某蛋糕品牌」，不出现城市、门店名、可反推的时间+营收组合。\n\n---\n\n## 一、判断句（可直接用作开场或落点）\n\n以下前五句来自 Mirror 本人的叙述（已去掉英文与口语碎词），后四句是我根据材料整理的说法，可用可不用。\n\n1. 押注的地方没长出来，没押的地方起来了。\n2. 蛋糕的爆发和我有关系。「没用」说的是前面那将近一年。\n3. 我建议关店，合作停止半年之后，客户才关的。\n4. 现在客户关了两家店、留下两家，老店重新翻新，重心转向甜品和蛋糕——而我已经不知道内部数据了。\n5. 咨询顾问的宿命是：你永远不知道自己的建议最后怎么样了。\n6. 我做了两年，几十个动作都是对的，账面没有转正。真正动账的，是关掉两家店。\n7. 我算过的那张表，两年后变成了现实。\n8. 小店的结构性亏损，靠点状运营动作救不回来。真正动账的只有三刀：砍品类、砍门店、换产品结构。这三刀都要老板点头，都要有人先难受。\n9. 面包线的占比从来没有动过——21% 到 20%，掉了 1 个百分点。而它的销量，半年里少了一半。\n\n---\n\n## 二、数据锚点（已核）\n\n### 1. 面包线：押注失败，数据成立\n\n**品类贡献占比（2025 上半年 vs 2024 上半年）**\n出处：`周月会留存/7月/区域品牌 D半年复盘会-7月.pptx` p17\n\n| 品类 | 2025 上半年 | 2024 上半年 |\n|---|---|---|\n| 鲜奶小蛋糕 | 27% | 28% |\n| **现烤面包** | **20%** | **21%** |\n| 烧仙草&冰冰饭 | 15% | 13% |\n| **大蛋糕** | **12%** | **9%** |\n| 鲜奶茶果茶 | 7% | 10% |\n| 简餐小食 | 7% | 8% |\n| 特色雪花冰 | 7% | 6% |\n\n**同比（2025 上半年 vs 2024 上半年）**\n出处：同上 p18\n\n- 现烤面包：实收 **-30%**、销量 **-46%**、单价 +23%\n- 鲜奶小蛋糕：实收 -28%、销量 -43%、单价 +15%\n- 大蛋糕：实收 **+10%**、销量 +9%、单价 -15%\n- 整体实收同比：**-14%**\n\n**面包日均实收的持续下滑**（月会口径）\n出处：`7月/区域品牌 D8月月会.pptx` p9、`9月/区域品牌 D9.5月会.pptx` p9、`10月/区域品牌 D10.24周会.pdf` p8\n\n- 6 月 78,156（÷30 ≈ 2,605/天）\n- 7 月 78,266（÷31 ≈ 2,525/天）\n- 8 月 76,568（÷31 ≈ 2,470/天）\n- 10/13–10/19 单周 13,531（≈ 1,933/天）\n\n**进场基线**\n出处：`24-11月/区域品牌 D提案-终版.pptx` p10、p53\n2024 年 3–7 月 vs 2023 年同期：现烤面包 销量 +56%、应收 +57%、实收 +42%，金额占比 21%。\n\n> **结论：面包线从进场到现在，占比 21% → 20%，实收同比 -30%（差于整体的 -14%），销量腰斩靠提价收住跌幅。「面包能力长出来就开新店」这条路在数据上从未成立。**\n\n### 2. 亏损与结局\n\n- 进场时（2024 年 1–9 月）：实收 742.2w、同比 **-23.56%**、净利润 **-281,094**（占比 -3.79%）。2023 年同期为 +136,234（1.40%）。出处：`10月/区域品牌 D年度复盘-终版.pdf` p4\n- 合作期末（2024.12–2025.9）：流水 876.8w（-16%）、实收 676.4w（-14%）、毛利 401.7w（-11%）、净利润 **-81,556，亏损收窄 75%**。出处：同上 p13\n- 门店 FLR（房租+人力+食材）：**一店 76%、二店 90%、三店 105%、四店 106%**，结论「除一店外均无利润空间」。出处：同上 p49\n- 后续（Mirror 叙述，非材料）：关掉三店与四店，保留一店与二店，重心转向甜品与蛋糕，一店翻新。\n\n> **关店判断的验证：算出来 105% 和 106% 的两家，最后真的被关掉了。**\n\n### 3. 引流动作低效（点状动作的实证）\n\n- 满 150-20、满 200-30 券各发 282 张，**核销 0%**；禧甜卡 160-30 券 2000 张，**核销 1 张（0.1%）**。出处：`2月/区域品牌 D2月季度会.pdf` p23、`4月/区域品牌 D4月月会.pptx` p21\n- 抖音：4 月月会写「流量、转化和新客占比均更优，之后继续重点开发」；5 月月会抖音**核销金额环比 -74%**、访问 -70%。出处：`4月/区域品牌 D4月月会.pptx`、`5月/区域品牌 D5月月会.pptx`\n- 报损：1 月合计 67,035 元、占实收 12%；四店 20%、二店 15%、三店 11%、黄岩 8%，报损 TOP 是自家热销品。出处：`2月/区域品牌 D2月季度会.pdf` p32\n\n---\n\n## 三、还没定的事（写之前必须解决）\n\n1. **同比窗口**：材料里至少三种（提案基线 2024 年 3–7 月 / 半年复盘 2025 上半年 / 周会的周环比年同比）。**全文只用一个窗口。**\n2. **10 月爆款与前面一年的关系**：如果前面一年的动作是「接得住 10 月爆款」的前提（研发进程、上新 SOP、博主资源、私域承接），那「点状动作无用」要改；如果接得住也无关，那才是真的无用。**这个答案决定整篇的立意。**\n3. **蛋糕爆发的归属**：Mirror 说 2025 年 10 月全网爆款「奶皮子烤布蕾蛋糕」，他让客户抓紧研发上线并找小红书博主推广。**但半年复盘（截至 6 月）显示大蛋糕实收已经 +10%、占比 9%→12%**——蛋糕在爆款之前就已经在涨。叙述时不要把两段合并成一段。\n\n\n---\n\n## 篇目：个人职业画像与决策约束_恢复版_2026-09-15.md\n\n# 个人职业画像与决策约束\n\n> 用于后续职业讨论的本地背景档案。事实与阶段性判断分开记录；结论可随经历和选择更新。\n\n## 基本背景\n\n- 一线策略与运营从业者。\n- 2017 年起在北京工作，经历融资服务 FA、互联网平台、头部平台销售运营、舞蹈品牌 前序项目 总部。\n- 深耕消费品牌增长与 AI 工作流工程化。\n- 兼顾生活稳定性与长期成长曲线。\n- 当前个人现金流底线：保持稳定现金流安全边际，优先做低成本可逆实验。\n\n## 关键职业经历\n\n### 互联网平台\n\n- 工作以外包管理和文书类事务为主。\n- 主要负面体验是内容乏味，个人判断和价值感不足。\n\n### 头部平台销售运营\n\n- 通过数据分析拆解集团策略，再以数据播报、沟通和激励推动销售团队落地。\n- 获得了较强的数据分析、策略翻译、跨团队沟通和一线执行推动能力。\n- 离开的主要原因是无法接受大厂内卷、失控感及述职环评式管理。\n\n### 前序项目 舞蹈品牌总部\n\n- 对行业和品牌有真实热爱，体验过热爱与工作结合的快乐。\n- 自学 SQL，持续研究学员消课和续费问题。\n- 挫败感来自数据洞察很难单独产生结果，真正推动消课的往往是老板策略与现金激励。\n\n### 餐饮营销咨询公司\n\n- 服务烘焙、餐饮及少量跨行业客户，承担项目管理、经营诊断、增长策略和客户沟通。\n- 参与 AI SaaS 需求分析、系统测试、客户 BI 迁移、知识库搭建、数据基建、内部培训和分享。\n- 能从复杂信息中识别边界、验收标准、依赖关系和执行风险，并将信息整理成框架、流程、工具或可视化样机。\n- 对 0-1、1-10 阶段消费品牌的渠道、流程、组织承载力和增长壁垒有持续观察。\n\n## 稳定能力\n\n- 结构化处理复杂、分散、定义不清的信息。\n- 用数据理解业务，但不把数据等同于业务结果。\n- 将策略翻译成一线可执行动作，并通过沟通推动落地。\n- 项目风险识别、范围界定、交付验收和流程设计。\n- 知识库、BI、AI 工具和工作流的需求梳理与应用落地。\n- 兼具理性分析、写作表达、内容审美和对人的感受力。\n\n## 持续兴趣\n\n- 猫和宠物：持续关注宠物信息，愿意长期投入；已有两只猫相关内容与账号工作流探索。\n- 投资：从国内基金到美股，持续超过 10 年。\n- 写作与阅读：有兴趣和耐心，正在探索个人风格；关注 AI 时代的在场感、道德困境和人的选择。\n- 运动：健身、滑雪、跳舞。\n\n## 职业偏好与排斥\n\n### 更需要\n\n- 清晰的自主权和对结果的真实影响。\n- 能看到用户、业务或作品反馈的短闭环。\n- 允许判断、创造和持续学习的工作。\n- 与宠物、运动、内容、消费或其他真实兴趣有连接的行业。\n- 能逐渐沉淀为个人资产，而非永久按时间出售的工作方式。\n\n### 明确排斥\n\n- 纯文书、纯协调或只做数据播报而无决策空间。\n- 过度内卷、强述职表演、环评驱动和失控式管理。\n- 仅靠组织权力、老板拍板或短期激励才能推动的伪闭环。\n- 单纯因为“初创”或“兴趣行业”就接受低质量管理和无边界劳动。\n\n## 当前决策特征\n\n- 风险厌恶、容易自我怀疑，面对不可逆选择时思考时间较长。\n- 并非缺乏行动力：在目标、边界和反馈明确时，能持续推进并做出成品。\n- 当前核心矛盾不是简单的“打工还是创业”，而是如何在不跌破现金流底线的前提下，获得更高自主权，并积累属于自己的长期资产。\n\n## 后续职业讨论默认约束\n\n- 不建议在没有验证收入或充足跑道时裸辞。\n- 不把“热爱”自动等同于适合开店、创业或全职从事。\n- 新机会需同时评估：现金流、决策权、反馈闭环、能力复利、生活能量和退出成本。\n- 优先使用低成本、可逆的小实验，以证据替代一次性身份选择。\n\n## AI 咨询与内容资产方向\n\n### 原始动机\n\n- 希望把现有的经营咨询、数据分析、项目管理和 AI 工具应用经验连接起来，形成不完全依赖单一雇主的个人能力资产。\n- 对 AI consulting 有兴趣，但并不想从零包装成通用 AI 专家，也不准备直接与大型咨询公司或工程实施团队竞争。\n- 研究过小红书 AI consulting 博主“烦死了这破 deck”：其有效内容并非工具清单，而是依靠真实项目细节解释 AI 落地为什么失败、什么场景值得做，并给出可执行判断标准。\n\n### 当前定位假设\n\n> 为餐饮、烘焙和小消费品牌，把分散经营数据与重复项目动作，改造成可复核、有人审、能持续运行的 AI 辅助工作流。\n\n- 职业身份仍以“经营策略 / AI 业务运营 / 垂类 AI 咨询”为主，不定位成 AI 工程师。\n- “AI 博主”现阶段不是需要辞职切换的职业身份，而是公开验证专业判断、沉淀案例和建立潜在客户连接的内容副线。\n- AI 不是唯一职业方向，而是对现有经营分析、策略拆解和流程产品化能力的放大器。\n\n### 目标受众与内容方向\n\n- 主要受众：餐饮、烘焙、小消费品牌的老板、经营负责人、运营人员，以及希望把 AI 用进真实业务流程的咨询或运营从业者。\n- 内容重点不是每日工具资讯，而是具体业务问题：经营周报、异常识别、会议与项目资料归档、知识查询、活动方案初稿、任务分配与复盘。\n- 建议采用“反常识判断 + 真实场景/事故 + 人机边界 + 可执行标准”的表达结构，用案例解释什么值得自动化、什么不值得自动化。\n- 内容语气应延续个人写作优势：有人话感、能表达真实怀疑与取舍，不复制对标博主的攻击性语气、MBB 身份叙事或北美企业项目包装。\n\n### 差异化基础\n\n- 有真实餐饮、烘焙和消费品牌经营项目场景，不是脱离业务讲 AI。\n- 能将模糊需求拆成输入字段、确定性规则、AI 处理、人工复核、异常处理、输出格式和验收指标。\n- 同时理解经营数据、一线执行、客户沟通和项目交付，能够判断“技术上能做”和“业务上值得做”的差别。\n- 过往美团、G-STEPS 与当前咨询经历可共同支撑内容：策略如何拆解、假设如何验证、机制为什么失效、数据为何不能单独产生影响。\n\n### 首个验证项目\n\n- 优先候选：“多平台经营周报与异常处理工作流”。\n- 输入：POS、线上商城、美团、抖音、会员及活动数据。\n- 处理：规则计算和口径核对负责确定性任务；AI 负责变化总结、原因归类和行动初稿；项目经理负责高风险判断与最终建议。\n- 输出：经营周报、异常清单、责任人和待办。\n- 验收：处理耗时、数据错误率、人工修改率、真实使用频次和后续维护成本。\n\n### 三个月验证线\n\n- 第 1 个月：盘点至少 20 个重复工作流，访谈约 8 位真实使用者，按频率、痛苦程度、数据可得性、错误风险和付费价值选择一个场景，并记录旧流程基线。\n- 第 2 个月：只用一套自动化工具完成闭环，加入规则计算、AI 生成、人工审核、异常队列和运行记录；完成至少 30 次真实运行，而非只做演示。\n- 第 3 个月：在获得公司及客户授权的前提下连续试用至少 4 周，争取一个付费试点、正式立项或明确续用意向，并形成一份包含失败与迭代的脱敏案例。\n- 达标线：1 个持续运行的工作流、1 个真实内部或外部客户、1 份有数据的案例。\n\n### 商业化假设与风险\n\n- 初步服务形态：“流程诊断 + 单场景试点 + 维护迭代”，不售卖泛化的“企业 AI 转型”。\n- 内容的近期价值优先是获得真实反馈、案例和职业机会，不预设短期广告或流量收入。\n- 当前主要缺口：自动化与系统集成、异常处理、权限和版本治理、运行监控，以及真实的节省时间、修正率、续用或付费证据。\n- 判断项目是否值得做的底线：维护、纠错与审核消耗的时间必须少于系统节省的时间。\n- 未完成真实试点前，不把目标项目写成既有业绩，不因“想做 AI 博主”而裸辞，也不以持续学习工具替代真实运行和用户验证。\n\n\n---\n\n## 篇目：选题台账.md\n\n# 选题台账｜个人专栏\n\n> 建立：2026-09-18\n> 规则：**这是唯一清单。** 每次延续对话先读本文件，不许重新推导。任何新增、删除、降级、改标题，都要在回复里明说改了什么、为什么，等 Mirror 点头后才动。\n> 状态取值：`已确认`（他拍板）｜`待定`（摆在桌上，未拍板）｜`已起草`｜`已发布`｜`已否决`（他明确否掉）\n\n---\n\n## 一、连锁品牌 B YU2CAKE\n\n| # | 标题 | 状态 | 素材要点 | 还缺什么 |\n|---|---|---|---|---|\n| U1 | 口碑长在同行那里，生意长在顾客那里 | **已起草** | 老板行业影响力强、品牌有调性、产品立得住；B 端口碑高、C 端不叫座；渠道顺序 小红书→私域微信→点评；同月周年庆激活老客（储值会员 +210%、储值额 +84%）＋权益卡拉新 623 张；日均销量同比 +94%、下单人数 +118% | 无。初稿约 460 字，待他改 |\n| U2 | 先有势，才能顺势而为 | **已发布** | 底子＝审美/调性/行业口碑（老板已攒下）；动作＝升级产品呈现/包材/海报/陈列/物料 ＋ 多渠道送到顾客看得见的地方 | 2026-09-18 发布：即刻（他手动）、X thread（5 条，主帖 https://x.com/Jingling_Mirror/status/2100937640682082336 ）。**已知问题：X 第 1 条换行被吞**（用 composer 打字发的；2–5 条用 intent 预填，换行保留）。Mirror 2026-09-20 反馈小红书这条数据不错 |\n\n### 连锁品牌 B · 已否决 / 未采纳\n\n- 老板要降低定制蛋糕、团队备注却建议再上两款定制 —— **已否决**（他判定为小问题，不影响经营）\n- 「100% 中奖」用户抽到谢谢参与 / 秒杀份数设置失误 —— **已否决**（同上）\n- 券核销率 3.7% —— **未采纳为选题**，仅可作 U1 的支撑数据\n- 外卖渠道计划与实际差三个月、点评热门榜 5→11→19 —— **未采纳为选题**\n\n---\n\n## 二、区域品牌 D\n\n| # | 标题 | 状态 | 素材要点 | 还缺什么 |\n|---|---|---|---|---|\n| S1 | 小店的结构性亏损，靠点状运营动作救不回来 | **已确认，待起草** | 判断型：真正动账的只有三刀——砍品类、砍门店、换产品结构；这三刀都要老板点头、都要有人先难受。支撑证据：券核销 0%／0.1%、甜水卡、体验官、拼团等点状动作均未扭转账面 | **2026-09-20 初稿约 520 字，Mirror 未采用**，原话：「太粗了，打眼看完都是正确废话，力量没有上一篇顺势而为强」。退回待起草，重写时要补具体人物动作和反差，不能只讲道理 |\n| S2 | 我算过的那张表，两年后变成了现实 | **已确认** | FLR（房租+人力+食材）：一店 76%、二店 90%、三店 105%、四店 106%，结论「除一店外均无利润空间」；最后关掉的正是 105% 和 106% 那两家。**补充（2026-09-20）：十年品牌、地方小连锁、只有最大的老店稳定盈利，其余新店一直被输血；方案是「店要缩、店型要改」**
