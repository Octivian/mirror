  "s30": "# 客户档案 · 更新流程说明\n\n> 建档：2026-10-16｜对应工作流：Mirror 不定期发起「更新 XX 的客户档案」\n\n---\n\n## 一、档案清单与位置\n\n| 客户 | 云盘（资料库） | 本地权威源文件 |\n|---|---|---|\n| 消费品牌 C | `客户档案 / 消费品牌 C-客户档案` | `D:\\工作\\消费品牌 C\\客户档案\\消费品牌 C-客户档案.md` |\n| 连锁品牌 B | `客户档案 / 连锁品牌 B-客户档案` | `D:\\工作\\连锁品牌 B\\客户档案\\连锁品牌 B-客户档案.md` |\n| 零售品牌 A | `客户档案 / 零售品牌 A-客户档案` | `D:\\工作\\零售品牌 A\\客户档案\\零售品牌 A-客户档案.md` |\n\n> **本地 md 是权威源**，云盘是分发副本。每次更新先改本地，再覆盖云盘对应文档。\n\n---\n\n## 二、更新流程（6 步）\n\n1. **触发**：Mirror 口头发起「更新 XX 的客户档案」。\n2. **扫描**：检查桌面 `C:\\Users\\admin\\Desktop\\<客户名>\\` 中较上次更新后**新增或修改过**的文件（按修改时间比对）。\n3. **判断**：识别哪些内容对档案有价值，重点采纳维度：\n   - 经营数据（营收 / 渠道 / 成本 / 会员 / 储值）\n   - 合作进展（阶段变化、交付物、双方分工、组织决策人）\n   - 产品与商品结构（品类、SKU、规格、定价、上新）\n   - 用户洞察（画像、需求缺口、口碑）\n   - 竞品与市场格局\n4. **确认**：先列「拟采纳要点」+「存疑/暂不采纳」清单，与 Mirror 确认后再写入。**不得自行拍板落盘。**\n5. **更新**：改本地 md（每条数据标注来源 + 页码；章节末标注更新日期）→ 覆盖云盘对应文档。\n6. **归档**：把本次引用的源文件复制到 `D:\\工作\\<客户>\\客户档案\\源数据\\`，保持原始文件名。\n\n---\n\n## 三、写作约定\n\n- 每个数字都要能回答「来自哪份文件 / 哪一页 / 哪个口径」。\n- 数据对不上时写入「待确认与存疑项」章节，**不在正文里抹平**。\n- 存疑项闭环后标注 ✅ 并保留记录，不删除历史。\n- 口径冲突（同一指标两处数值不同）→ 两个都列，并标注冲突，不擅自取一个。\n- **信源辨别（同类信息取最新）**：客户文件夹里常有多份内容相似度高的材料（如消费品牌 C的 `问题诊断_20260928_v2` 与 `解决方案沟通会-1011`）。同一类信息**一律以最新时点为准**；两份口径冲突且分不清先后时，**先与 Mirror 确认，不自行取舍**。\n- **区分「提案建议」与「已确认事实」**：方案材料中由**我方提出**的机制、分工、考核指标，必须标注为\"提案建议（待客户确认）\"，不得写成客户已确认的事实。\n- **问题定位以可验证的经营事实为准**：诊断优先锚定硬事实链（如\"门店面积缩减 → 渠道结构变化\"），内部管理层面的归因不写入根因章节。\n- **只写事实，不写推断的因果**：凡是档案里出现的结论，都要能指回源文件原句；推断一律显式标注为\"推断\"或放入存疑项。\n\n---\n\n## 四、待办\n\n- [ ] 连锁品牌 B：拆解 `【连锁品牌 B】复盘数据.xlsx`、`连锁品牌 B成本卡-2609.xlsx`、`连锁品牌 B用户调研问卷（原表）.csv`\n- [ ] 连锁品牌 B：解压 `连锁品牌 B-提案前资料.zip` 并归档\n- [ ] 连锁品牌 B：补全门店开关店明细（哪家何时开/关）\n- [ ] 零售品牌 A：拆解 `零售品牌 A复盘数据.xlsx`（12.9MB）\n- [ ] 零售品牌 A：补 9 月财务数据（利润表目前仅到 8 月）\n",
  "s31": "# 消费品牌 C · 客户档案\n\n> 维护人：Mirror（Mirror）｜建档：2026-09-22｜最近更新：2026-11-13\n> 归档目录：`D:\\工作\\消费品牌 C\\`\n> 本次建档依据：《消费品牌 C会员运营解决方案沟通会-确定版-1011.pptx》（42 页，2026-10-12 沟通会）\n> 2026-11-13 更新依据：`消费品牌 C会员11 月运营月会.docx`（会议 2026-11-03，报告周期 2026-10-01–10-31）；本次新增第五章 5.8–5.10、第八章 #14–#15，并更新第一章「项目阶段」，其余章节未改。\n> 本档案随项目推进持续补充。**每条数据标注来源，改动前先确认。**\n\n---\n\n## 一、客户基本盘\n\n| 项目 | 内容 | 来源 |\n|---|---|---|\n| 品牌全称 | 某复合烘焙品牌C | 老板线上问卷-0922 Q1 |\n| 平台名称变体 | 某复合烘焙品牌C（第三方平台收录名） | 携程/Trip.com 某城咖啡店榜 |\n| 所在城市 | 北方某城市核心商圈 | 用户口述 2026-09-22 |\n| 门店数量 | **1 家** | 问卷 Q2 |\n| 经营品类 | 西式融合料理 & 咖啡 & 甜品 & 生日蛋糕 | 问卷 Q3 |\n| 门店面积 | 450 ㎡（后厨约 150 ㎡，预估含仓库） | 准确版·门店信息 |\n| 餐位／桌数 | 26 个餐位，含 2 个包间（8–10 人包间 1 个、10–12 人包间 1 个） | 准确版·门店信息 |\n| 月租金 | 8,400 元／月 | 准确版·门店信息 |\n| 营业时长 | 08:30–22:00（第三方收录） | Trip.com |\n| **合作关系** | **会员运营**（运营中台 × 消费品牌 C） | 用户口述 2026-09-22 |\n| 项目阶段 | **提案已交付并完成客户沟通**（2026-10-12）；**2026-10 起进入会员运营方案实际执行期**（新人礼 A/B 定版、分层触达常态画布定调、企微加人、拼团、品鉴会、每周二福利日均已落地，详见 5.10） | 沟通会-1011 P1；`消费品牌 C会员11 月运营月会.docx`（2026-11-03）「01 上月工作及完成情况」「04 月任务数据小结」｜2026-11-13 更新 |\n\n**团队结构（问卷 Q15）**：出品部门 3 位主管（西点／咖啡／西餐）+ 1 位前厅经理，均可配合；合作前期老板本人参与。\n**在册人员（8 月工资表）**：四个板块共 20 人（西点部 2、咖啡部 3、西餐部 7、前厅 6）+ 洗碗工 2 人。\n\n---\n\n## 二、已开通的线上渠道\n\n| 渠道 | 状态 | 账号 | 备注 |\n|---|---|---|---|\n| 小程序商城后台 | 已开通，**账号未提供** | — | 门店在用的会员主阵地，账号待客户补 |\n| 美团开店宝 | 已开通 | a17390736789 | |\n| 抖音来客 | 已开通 | 13314730277 | |\n| 美团外卖 | 开通但**基本无单** | — | 7 月实收仅 2,619 元 |\n| 淘宝闪购（原饿了么） | **未上线** | — | |\n| 大众点评 | 已收录，未见团购套餐运营 | — | 财报「大众点评」科目长期为 0 |\n\n> 账号密码见原始文件 `源数据\\准确版【提案前收集】信息反馈-消费品牌 C.xlsx` → 「信息收集汇总」表。**不在档案中重复留存密码。**\n\n---\n\n## 三、私域资产（问卷 + 信息收集表）\n\n| 指标 | 现状 | 判断 |\n|---|---|---|\n| 个人微信 | 1 个账号，已加好友 **3,923 人**，日均新增 3–5 人 | 池子有量，但**未被使用** |\n| 企业微信 | **已启动，好友约 200+，且当前正在每日持续新增**（2026-09-22 问卷时点仍为「无」；1011 沟通会口径为「近期刚启动」，此后持续拉新） | 已补建并进入正增长；相对近 4,000 个微，渗透率仍低 |\n| 社群 | **无** | 无高频触达载体 |\n| 会员触达方式 | **仅「小程序订阅消息／公众号」**（问卷时点）→ 复核：**订阅消息仅 219 人订阅，短信渠道未启用**（10-11 沟通会） | 🔴 最大断层：近 4,000 微信好友与会员体系之间没有稳定通道 |\n| 老板查看会员数据 | 偶尔看，主要看**新增会员数** | |\n| 老板唯一关注的会员指标 | **会员储值总数及储值余额** | 储值思维，非复购思维 |\n\n---\n\n## 四、会员体系现状（老板问卷）\n\n**基础状态**：已有会员体系并在运行；入会方式 = **注册即会员**（留手机号／微信）。\n\n| 会员功能 | 已用 | 未用 |\n|---|---|---|\n| 会员等级 | ✅ | |\n| 储值 | ✅ | |\n| 优惠券 | ✅ | |\n| 新人礼 | ✅ | |\n| 会员日／会员价 | ✅ | |\n| 积分（获取／消耗） | | ⬜ 未启用 |\n| 沉睡唤醒／召回 | | ⬜ 未启用 |\n\n**已了解／尝试过的玩法**：会员日（如周二 88 折）、会员价（指定商品会员专享价）、储值赠额。\n**完全没碰过的玩法**：积分抽奖、积分抵现、付费会员卡。\n\n**老板自述**：\n- 对会员运营的理解 → 「提高会员复购率，倾听到会员真实的意见和想法，以及更好的照顾到老会员」\n- 最大困难 → **「不知道怎么做，没思路」**（单选，未选\"没有专人负责\"\"系统工具不会用\"）\n- 目标（全选）→ 提升复购率／提高客单价／唤醒沉睡顾客／提升品牌忠诚度\n- 目标补充原话 → **「不因为老板的不在店，而忽略到老顾客的照顾和体验」**\n- 预算 → **「还没想好」**（非\"暂无预算\"）\n- 同行标杆 → **「无」**（Q16／Q17 均答无，说明本地尚无对标意识）\n\n**已落地运行的参数（10-11 沟通会复核）**：\n- 会员价**限制条件**：需**储值余额** + 仅 **V2／V3** 等级可用 → 非储值会员完全享受不到，与\"会员价\"名字相悖\n- 等级门槛：新手玩家 0 / 进阶玩家 **588** / 资深玩家 **1,000,000**（第三档门槛数值异常，见第八章）\n- 会员日：每周二，甜品 & 面包 9 折（**面包已下架**）\n- 新人礼：50-2 元券\n\n> **给提案的直接启示**：客户不缺工具、不缺功能开关，缺的是**思路 + 排期 + 有人执行**。提案重点应是\"给一套能落地的会员运营动作清单和节奏\"，而不是推荐 SaaS 系统。预算未定 = 需要用**低投入高确定性**的首月方案建立信任。\n\n---\n\n## 五、关键经营数据\n\n### 5.1 渠道实收（客户自制表 · 2026 年 5–7 月）\n\n| 月份 | 堂食 | 外带 | 自营外卖 | 门店合计 | 美团外卖 | 抖音团购核销 |\n|---|---:|---:|---:|---:|---:|---:|\n| 2026-05 | 348,456 | 18,023 | 16,661 | **383,140** | 1,411 | 23,748 |\n| 2026-06 | 366,955 | 19,277 | 20,277 | **406,509** | 1,322 | 35,570 |\n| 2026-07 | 393,956 | 19,898 | 20,880 | **434,734** | 2,619 | 27,455 |\n\n来源：`准确版【提案前收集】信息反馈-消费品牌 C.xlsx` →「信息收集汇总」渠道区（原始日期序列号 46174/46204/46235 = 2026-05-31/06-30/07-31）。\n淘宝闪购、美团团购核销：**无**。\n\n**结构判读**（2026-09-24 修正分母）：以 7 月总流水 **437,353 元**（＝门店三渠道 434,734 ＋ 美团外卖 2,619）为分母 —— 堂食 **90.1%**、外带 4.5%、自营外卖 4.8%、美团外卖 **0.6%**，合计 100%。\n> ⚠️ 此前写法用 434,734（不含美团）作分母，四项相加会超 100%（堂食误记 90.7%）。**引用请用修订后口径。**\n**这是一家几乎纯堂食的店**，线上只做了抖音团购一档。\n\n### 5.2 财务报表（客户口径 · 7 月 / 8 月）\n\n| 科目 | 2026-07 | 2026-08 | 8月占比 | 8月环比 |\n|---|---:|---:|---:|---:|\n| 主营业务收入（实收） | 431,142 | **467,378** | 100% | +8.40% |\n| 　├ 堂食 | 390,265 | 425,010 | 90.93% | +8.90% |\n| 　├ 外带 | 40,877 | 19,898 | 4.26% | −51.32% |\n| 　└ 美团 | 0 | 22,470 | 4.81% | 新增 |\n| 净收入总额 | 431,142 | 467,378 | 100% | +9.29% |\n| 主营业务成本合计 | 122,231.66 | **145,180** | 31.06% | +18.77% |\n| 营业毛利 | 308,910.34 | **322,198** | 68.94% | +5.50% |\n| 人工费小计 | 120,962.50 | 126,378 | 27.04% | +4.48% |\n| 能源费小计 | 12,802 | 10,983 | 2.35% | −14.21% |\n| 销售费用合计 | 143,566.50 | 148,980 | 31.88% | +3.77% |\n| 不可控费用（房租物业+折旧摊销） | 15,272.65 | 12,544.65 | 2.68% | −17.86% |\n| 营业外支出 | 6,300 | 6,378 | 1.36% | +1.24% |\n| **税后净利润（报表值）** | 156,371.19 | **167,051.35** | **35.74%** | +9.28% |\n\n来源：`7月财务报表.xlsx` / `8月财务报表.xlsx`（均为「本期金额」列）。\n8 月成本明细：蔬菜类 131,824（占收入 28.21%）、包材 6,510、肉类 2,163。\n8 月人工明细：职工薪酬 107,711、社保 11,299、员工餐费 6,100、宿舍租金水电 1,268。\n\n### 5.3 人力（8 月工资表）\n\n| 板块 | 人数 | 岗位 |\n|---|---|---|\n| 西点部 | 2 | 西点裱花部主管、裱花师 |\n| 咖啡部 | 3 | 吧台长、咖啡师 ×2 |\n| 西餐部 | 7 | 西餐部主管、西餐副厨 ×2、披萨厨师、炸炉帮厨、西厨切配、沙拉厨师 |\n| 前厅 | 6 | 前厅经理、前厅服务员 ×5 |\n| 洗碗 | 2 | 洗碗工 ×2 |\n| **合计** | **20** | |\n\n- 表内标注「工资共计」**102,300 元**；按明细逐行加总实发为 **101,213.50 元**（差 −1,086.50，见第八章待确认项）。\n- 表下另附备注两笔：少雄工资 1,511；吉祥 9 月 2 天 2 小时 302。\n- 注：表标题写「7月工资表」，但文件名为 `8月工资表.xls`、且含 9 月补班记录 → **月份口径需与客户确认**。\n\n### 5.4 历史大活动（近一年，客户自填）\n\n| # | 时间 | 活动 | 渠道 | 内容 | 结果 |\n|---|---|---|---|---|---|\n| 1 | 2026-06-18 | 年中直播 | 微信朋友圈／抖音 | 代金券（**以储值方式核销**）、2–3人套餐、3–4人套餐、菜品单品券 | 3 小时成交 **103,864 元** |\n| 2 | 2025-11-28 | 店庆直播 | 微信朋友圈／抖音 | 同上券包结构 | 3 小时成交 **74,741 元** |\n| 3 | 2025-11-29 | 四周年店庆 | 微信私信老顾客／朋友圈 | 拍立得打卡、大蛋糕分享、定制冰箱贴伴手礼；同步开启店庆专属储值至 12/5 | — |\n\n**关键读数**：6 月年中直播 3 小时成交 103,864 元 ≈ 当月门店实收（406,509）的 **25.6%**。单场活动拉动四分之一月流水，同时验证了「直播 + 储值核销」是这家店已跑通的唯一线上打法。\n⚠️ 该表「活动名称」列存在错位：`活动简述` 列填的是日期，活动名称实际写在了下一列。\n\n### 5.5 会员运营基线（2026-09-22 盘点 · CRM 系统系统）\n\n> 来源：会员运营解决方案沟通会-确定版-1011 P15–P23。**这是本档案此前最缺的一块数据，现已闭环。**\n\n**存量盘子**\n\n| 指标 | 数值 | 来源 |\n|---|---:|---|\n| 累计用户 | 19,982 | P15 |\n| 注册会员 | **16,518** | P15 |\n| 会员占比 | 82.66% | P15 |\n| 会员年度消费贡献 | **83.86%** | P15 |\n| 近 1 年已购会员 | 10,366 | P15 |\n| 近 30 天已购会员（8.22–9.22） | 1,372 | P15 |\n\n**会员流失分层（🔴 核心问题）**\n\n| 分层 | 占比 |\n|---|---:|\n| 即将沉睡 | 10.67% |\n| 沉睡 | 14.36% |\n| 即将流失 | 31.38% |\n| 流失 | 43.59% |\n| **即将流失 + 流失** | **74.97%** |\n\n**复购转化（近 30 天）**\n\n| 环节 | 数值 | 转化率 |\n|---|---:|---:|\n| 新增用户 | 2,798 | — |\n| → 新增会员 | 713 | 占新增用户 25.48% |\n| → 新增会员消费 | 516 | — |\n| → 新会员复购 | 40 | **1.4%** |\n\n> 累计用户中**只消费 1 次的占 56%**。新人礼（50-2 元券）：发放 719 / 核销 337 / 核销率 **46.87%** / ROI **105.36**。\n\n**储值**\n\n| 指标 | 数值 | 说明 |\n|---|---:|---|\n| 储值转化率 | **7.37%** | 100 个消费订单中仅 7.4 个是储值订单 |\n| 只充过 1 次的储值会员占比 | **88.5%** | 仅 11% 会在储值用完后复充 |\n| 储值贡献营收 | 19.1% | |\n| 累计储值充值 | ￥73,758.62 | 累计口径 |\n\n**会员等级消费贡献（2025-07-01 – 2026-06-30）**\n\n| 等级 | 人数 | 消费金额 | 客单价 | 购买频次 |\n|---|---:|---:|---:|---:|\n| 新手玩家 | 9,653 | 2,482,973.09 | 257.22 | 1.95 |\n| 进阶玩家 | 1,151 | 827,914.09 | 719.30 | 6.57 |\n| 资深玩家 | **62** | 115,529.08 | **1,863.37** | **25.05** |\n\n> 资深玩家仅 62 人却贡献客单 1,863 元、频次 25 次——**超级 VIP 极稀缺，且未被针对性运营**（P18）。\n\n**会员日 / 会员价效果（2026-08-12 – 09-22）**\n\n| 项目 | 拉动订单收入 | 优惠金额 | ROI | 拉动订单数 | 笔单价 |\n|---|---:|---:|---:|---:|---:|\n| 会员日 · 每周二甜品&面包 9 折 | ￥18,475.34 | ￥379.20 | **48.72** | 118 | ￥156.57 |\n| 会员价 · V3（6 分类 85 折） | ￥6,137 | ￥434.85 | 14.11 | 70 | ￥87.68 |\n| 会员价 · V2（6 分类 88 折） | ￥33,701 | ￥1,079.28 | 31.23 | 204 | ￥165.21 |\n\n> 会员日 ROI 最高（48.72）但**品类窄**（甜品+面包，面包已下架）；会员价**仅限储值余额用户**，非储值会员无法参与（P19）。\n\n### 5.6 十一券测试（2026-10-01 – 10-07）\n\n| 券名称 | 触达 | 领取 | 领取率 | 核销 | 核销率 | 抵扣金额 | 带动消费 | ROI |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n| 店国庆 7.7 代金券 | 2,000 | 139 | 6.95% | 17 | 12.23% | 130.9 | 2,167 | 16.6 |\n| 店国庆 10.1 代金券 | 2,000 | 185 | 9.25% | 22 | 11.89% | 222.2 | 3,368 | 15.2 |\n| **合计** | **4,000** | **324** | **8.10%** | **39** | **12.04%** | **353.1** | **5,535** | **15.7** |\n\n来源：会员运营解决方案沟通会 P20\n- 对微信接近 4,000 好友 **100% 触达**后，领取率仅 8.1%、核销率 12.04%；券带动消费占 10.1–10.7 店内订单金额 **4.48%**\n- **触达过程中已受到微信风控**（P20 原文）\n- 判读：个微群发的边际效果已很低，且存在风控风险 → **转向企业微信 + 分层触达**是本方案的前置条件\n\n### 5.7 自媒体与触达工具现状（2026-10 复核）\n\n| 渠道 | 现状 | 机会 | 来源 |\n|---|---|---|---|\n| 个人微信 | 约 4,000 好友 | 1v1、朋友圈（多） | P25 |\n| 企业微信 | 已启动，约 200+ 好友，**正在每日持续新增 偏「活动驱动」，活动一停会掉回日均 30；要变成日常动作需靠门店开口激励。\n\n> ⚠️ 本节「会员消费占实收比 83.86%」与 5.5「会员年度消费贡献 83.86%」同值不同义，见第八章 #14。\n\n### 5.10 2026-10 已落地的会员运营动作（2026-11-13 新增）\n\n来源：同上「01 上月工作及完成情况」「04 月任务数据小结 > 2 新人礼券包 / 3 分层触达」。\n\n| 动作 | 状态 | 已验证结果 / 结论 |\n|---|---|---|\n| 新人礼 A/B 测试 | 已完成，**A 组定版** | 10.17 起 A 组、10.22 下午切 B 组、10.27 收官；A 组（满 50-10）明显优于 B 组。累计领券 252 人 / 用券 61 人 / 核销概率 24.2% / 带动消费 9,978.7 元 / 综合 ROI 9.68 |\n| 分层触达测试 | 已完成，规则定调 | 10.22 老客 4 组 + 10.29 预流失／沉睡 6 组，共 10 组；两轮累计覆盖 **6,492 人**（W42 1,597 ＋ W43 4,895）、召回率 **1.20%**（核销 78 单 ÷ 触达人数）、带动消费 **12,290 元**、总投入 1,461.43 元、综合 ROI **8.4** |\n| 常态画布 6 类券型 | 最终方案已列出 | 储值不活跃＝饮品 5 元券（每月 1–2 次）；1转2 新客＝85 折券；沉默 61–90 天＝全场 88 折；沉睡 91–180 天＝满 50-8 券；预流失 181–360 天＝全场 8 折；已流失 >360 天＝仅大促触达。⚠️ 月会原文为「后续按照此逻辑配置常态画布」，**是否已配置上线未见记录** |\n| 29.9 元 2 人团拼团 | 进行中 | 新客＋次新客占 **77%**，原文判断「拉新有效但基数低」 |\n| 线下品鉴会 | 已完成 | 用户招募、物料准备、个微转企微推广，参与者转化为企微好友 |\n| 朋友圈福利日 | 进行中 | 每周二福利日启动，建立固定触达节奏 |\n\n> 项目阶段据此由「方案落地期」更新为「会员运营方案实际执行期（2026-10 起）」，见第一章。以上均为月会记录的**已执行结果**，非提案建议。\n\n> 更新：2026-11-13｜来源：`消费品牌 C会员11 月运营月会.docx`（2026-11-03）。\n\n---\n\n## 六、品牌外部口碑（现有素材）\n\n**小红书／头条爆帖（自述式探店内容）**：\n> 「某城我为数不多会二刷三刷的漂亮店！咖啡☕️甜品🍮面包🥯西餐🍴生日蛋糕🎂全都有！不得不说消费品牌 C家还是太全面了」\n> 提及菜品：安格斯低温慢煮牛肉饭、泰式火山排骨、香茅柠檬大虾、凯里酸汤笔管、六寸小披萨（最爱蒲烧鳗鱼）\n> 话题：#某城美食 #某城探店 #某城吃喝玩乐攻略 #某城蛋糕面包店 #某城消费品牌 C咖啡 #某城咖啡店 #某城下午茶\n\n**判读**：品牌在本地小红书/头条已有真实自来水内容，「漂亮店 + 全品类」是被用户自发打出的记忆点。**这是可放大的资产**——现有内容集中在\"环境好看、品类全\"，但几乎没有内容在讲会员权益和复购理由。\n\n---\n\n## 七、阶段判断（2026-10-16 更新）\n\n> 以下为现场调研（9.29）与提案沟通（10.12）后的**定稿判断**，替代此前\"提案前\"的初步版本。\n\n1. **单店高利润、低杠杆**。8 月净利率 35.74%（报表口径，⚠️ 见第八章自洽性存疑），收入几乎全部来自单店堂食。任何堂食波动都直接打到利润。\n2. **会员盘子大、活性极低**。注册会员 16,518 人、会员贡献 83.86% 年度消费，但 **74.97% 处于即将流失+流失状态**；30 天新增会员复购率仅 **1.4%**，累计用户中 **56% 只消费过 1 次**。→ 会员运营的第一命题是**召回与复购，不是拉新**。\n3. **储值既是资产也是负债**。储值贡献 19.1% 营收、老板唯一盯的指标就是储值余额；但 **88.5% 的储值会员只充过 1 次**、储值转化率仅 7.37%。→ 储值复充机制是现金流抓手。\n4. **触达通道已近失效**。个微群发被微信风控、领取率 8.1%；订阅消息仅 219 人订阅；公众号停更 3 年、小红书停更 3 个月、抖音近 1 月未更新。→ **企微 + 分层触达**是方案前置条件。\n5. **本地竞品会员运营普遍空白，消费品牌 C有先手**。8 个品牌实地调研，多数\"单点动作、缺体系、店员不主动\"。消费品牌 C有产品优势 + 会员基础 + 线上热度，**机会点在体系化运营**（P13 结论）。\n6. **老板缺思路，不缺预算意愿**。「还没想好」而非「暂无预算」→ 提案采用**四阶段（基建→储能→引燃→收尾）+ 首月可验证动作**的结构。\n7. **决策链（提案建议口径）**：方案中按 **刘总、赵总** 为决策人、门店一线负责 SOP 落地来设计配合要求（P41）。⚠️ 属**我方在方案中提出**的分工建议，**客户是否确认待定**（见第八章 #13）。\n\n---\n\n## 八、待确认与存疑项（提案前必须闭环）\n\n> **2026-10-16 状态更新**：第 6、10 项已闭环（CRM 系统数据已取得）；第 1–3 项**仍未闭环**，且已进入对外提案，建议尽快与客户核清。\n\n| # | 问题 | 影响 | 优先级 | 10-16 状态 |\n|---|---|---|---|---|\n| 1 | 8 月财报「外带」19,898 与 7 月信息表「外带」19,898 **完全相同**，8 月「美团」22,470 与 7 月美团外卖 2,619 差距 8.5 倍 → 是否科目串行／误填？ | 渠道结构判读全错 | 🔴 高 | ❌ 未闭环 |\n| 2 | 财报与信息表 7 月对不上：堂食差 3,691、外带差 99（财报外带 ≈ 信息表外带+自营外卖） | 两套口径不可混用 | 🔴 高 | ❌ 未闭环 |\n| 3 | 财报利润表不自洽：8 月「毛利−销售费用−不可控−营业外 = 154,295.35」vs 报表税后净利润 167,051.35，**差 12,756**；7 月同类差异 12,600 | 利润率 35.74% 可能虚高 | 🔴 高 | ❌ 未闭环 |\n| 4 | 8 月工资表明细加总 101,213.50 vs 表内标注 102,300，差 1,086.50 | 人工成本口径 | 🟡 中 | ❌ 未闭环 |\n| 5 | 工资表标题写「7月工资表」但文件名是 8 月，且含 9 月补班 → 实际归属月份？ | 人力成本月度归属 | 🟡 中 | ❌ 未闭环 |\n| 6 | 小程序商城后台账号未提供 | 无法导出会员/交易数据 | 🔴 高 | ✅ 已闭环（CRM 系统/系统数据已取得） |\n| 7 | 门店监控账号未同步 | 现场核验客流受限 | 🟡 中 | ⚠️ 现场调研已完成，影响消除 |\n| 8 | 储值余额总额、储值消耗周期、未核销券数量 | 决定会员方案的风险边界 | 🔴 高 | 🔶 部分闭环（累计储值充值 ￥73,758.62 已取得；**余额与消耗周期仍缺**） |\n| 9 | 薪资结构表（准确版第 16 行起）客户未填写 | 人力模型算不出 | 🟢 低 | ❌ 未闭环 |\n| 10 | 会员总量、活跃会员数、30/60/90 天复购率 | 会员运营的基线 | 🔴 高 | ✅ 已闭环（16,518 / 1,372 / 见 5.5） |\n| 11 | **新增**：会员等级「资深玩家」成长值门槛标注为 **1,000,000**，与其消费贡献（62 人、客单 1,863 元、频次 25 次）明显不匹配 | 等级规则有效性 | 🟡 中 | ❓ 待核实（疑为系统笔误或累计值口径） |\n| 12 | **新增**：等级「升级赠送积分」全部为 0，但老板问卷称积分功能未启用 | 积分体系是否真的未启用 | 🟡 中 | ❓ 待核实 |\n| 13 | **新增**：1011 沟通会 P40–P41 的协同机制与数据指标（北极星＝60 日复购率；储值转化率／加微率／活动 ROI）及决策人（刘总、赵总）系**我方提案建议**，客户是否确认待定 | 机制与考核基线 | 🟡 中 | ❓ 待确认 |\n| 14 | **新增（2026-11-13）**：「83.86%」同值不同义 —— 5.5「会员**年度**消费贡献 83.86%」（沟通会-1011 P15，9-22 盘点口径）vs 5.9「会员消费**占实收比** 83.86%」（10 月月会「03 会员数据」）；数值相同、口径表述不同，是否同一指标需核 | 会员贡献率引用 | 🟡 中 | ❓ 待核实（两处原值均保留，不改写） |\n| 15 | **新增（2026-11-13）**：实收口径未核清 —— 10 月月会「02 整体经营数据」10 月实收 349,048.73 vs 5.2 财报 8 月「主营业务收入（实收）」467,378；月份不同，且月会未说明与财报科目是否同源 | 月度序列可比性 | 🟡 中 | ❓ 待核实（不擅自对齐） |\n\n---\n\n## 九、现场调研结论（2026-09-29 · 某城，8 个品牌）\n\n来源：会员运营解决方案沟通会-确定版-1011 P5–P13\n\n### 9.1 内部调研（消费品牌 C自身）\n\n| 模块 | 调研结论 | 来源 |\n|---|---|---|\n| 门店环境与客流场景 | 身居**某城西餐热门榜 top1**，环境温馨、场景复合，人群侧重年轻群体聚会 | P6 |\n| 线上线下物料 | 小程序设计感较强，但**活动入口和信息均不清**；线下物料多处有展示，但**全程无主动推荐动作** | P7 |\n| 产品体验 | 呈现到口味均较好，但菜单存在 **SKU 冗余、分类不清**，**缺乏主推招牌** | P8 |\n| 收银台 | 先用餐后结账；**收银台入会仅 0.56%** | P27 |\n| 桌面物料 | 有储值/会员日台卡，但不显眼、信息老旧 | P27 |\n| 体验承接 | 空间体验好，但到店后**没有自然沉淀路径** | P27 |\n| 外部平台 | 大众点评**西餐热门榜第 1，评分 4.7、约 400 条评价，但仅 2 款蛋糕在售** | P29 |\n| 抖音 | 团购产品 9 个；**单场直播最高 10.4 万元** | P29 |\n| 生日蛋糕 | 低频高客单，**营业额贡献 5%**；对外展示少，与堂食联动弱 | P28 |\n\n### 9.2 外部调研（本地同行 8 品牌对照）\n\n| 品牌 | 会员注册 | 储值 | 等级 | 积分 | 会员日 | 会员价 | 企微/私域 | 店员推荐 | 产品力 |\n|---|---|---|---|---|---|---|---|---|---|\n| **消费品牌 C** | ✓ 50-2 新人礼 | ✓ 588 起送 38+券 | ✓ 成长值，升级无礼 | × | ✓ 周二甜品 9 折 | ✓ 储值 V2/V3，85/88 折 | ⚠️ 9-29 时无企微；**10 月已启动并每日新增** | 一般，结账时推荐 | 较好 |\n| 可以烘焙 | × | ✓ 200送40/300送80/500送180 | × | × | × | × | × | 懒散，不推荐 | 较弱 |\n| 迷月甜品 | × 小程序未注册 | ✓ 线下 500 起送产品/蛋糕 | × | × | ✓ 周二甜品咖啡 88 折 | × | ✓ 企微加人快 | 问了才推 | 一般 |\n| 糖奢烘焙 | ✓ 35-5 券等 | ✓ 300 起送 28/68/188/428 | ✓ 消费升级，9.8–9.4 折 | ✓ 积分兑换 | ✓ 周二全场西点面包 88 折 | × | × 小程序无展示，有订阅 | 问了才推 | 较好，有文创 |\n| 椿暄咖啡 | × | × 有展示无入口 | × | × | × | × | × | 玩手机，不互动 | 无 |\n| 心岸 | ✓ 5 元无门槛券 | ✓ 100/200/300/500 送 10/25/40/80 | × | ✓ 积分兑换 | ✓ 周三会员日送 40-10 券 | ✓ | ✓ 企微/订阅 | 无人推荐 | 一般 |\n| 小六 | × | 储值享受会员价，储 500 送 50 | × | × | × | × | × | × | / |\n| MY BREAD | × | × | × | × | × | × | × | × | / |\n\n> ⚠️ 调研表中消费品牌 C「无企微」为 9-29 现场时点口径；10 月沟通会更新为「约 200+ 好友，近期刚启动」，此后**一直在每日持续新增**（2026-10-16 口径）。\n> **调研结论（P13 原文）**：本地竞品会员运营普遍停留在单点，多数缺体系；消费品牌 C有产品优势、会员基础，线上热度较高，**机会点在会员体系化运营**。\n\n### 9.3 竞争对手图谱补充（提案期口径）\n\n糖奢烘焙、椿暄咖啡、心岸、小六、可以烘焙、迷月甜品、MY BREAD（共 8 品牌，含消费品牌 C）。\n另：A 级直接竞品壹舍西厨·西式 bistro、waiting·西餐厅·法餐厅、阅遇书吧·星空餐厅、小桃梨、66 号公路美式餐厅（详细竞品调研见 `提案前调研\\竞品调研-某城西式餐饮.md`，本地留存）。\n\n---\n\n## 十、提案方案框架（2026-10-12 沟通会）\n\n来源：会员运营解决方案沟通会-确定版-1011 P30–P38\n\n### 10.1 底层公式\n\n> **营业额 = 消费会员数 × 消费频次 × 客单价**\n\n- **新客增量**：看见 → 到店 → 沉淀（内容平台 / 团购 / 门店场景 / 新人礼）\n- **老客复购增量**：再来 → 多来 → 多买（分层触达 / 会员日 / 积分 / 储值 / 产品组合）\n- **总增长 = 新客增量 + 老客复购增量** → 前端补增量入口，后端补复购机制（P32）\n\n### 10.2 四阶段路径\n\n| 阶段 | 核心目标 |\n|---|---|\n| **第一阶段：基建** | 完成私域基础建设；开发会员增长入水口；打通平台-到店-私域-会员体系通路；优化新客首购与复购转化路径；完成积分体系初步梳理与启动 |\n| **第二阶段：储能** | 形成不同生命周期人群的触达节点画布；完成储值方案优化；启动积分兑换初步方案；完成会员日与会员等级优化、筛出品牌超级 VIP；完成顾客画像调研及需求洞察报告 |\n| **第三阶段：引燃** | 形成首场以会员运营为核心的周年庆大活动体系；借助大活动优化内部流程并形成可复用 SOP；完善品牌产品、定价及渠道结构 |\n| **第四阶段：收尾** | 完成整体会员运营架构设计；培训品牌内部会员运营工作流程 SOP 并完成移交；完成大活动复盘报告与会员运营复盘报告 |\n\n### 10.3 10 月营运动作拆解\n\n| 板块 | 动作 |\n|---|---|\n| 产品准备 & 物料准备 | 万圣节新品、拼团产品、福利赠品、活动海报、产品海报、新人礼海报 |\n| 活动测试 | 新人礼券包 AB 测试、人群分层触达测试 |\n| 私域建设 | 个微转企微、私域培训、朋友圈运营优化、动作检查、数据追踪 |\n| 内部调整 | 储值推荐流程建立、门店服务人员拉新流程建立、门店物料更新、执行记录 |\n| 拉新促活活动 | 万圣节主题上新、拼团活动、体验官活动、私域上新互动+到店加微、免费试+到店加微 |\n\n---\n\n## 十一、协同机制与配合事项（**我方提案建议 · 待客户确认**）\n\n> ⚠️ **性质说明**：本章出自《消费品牌 C会员运营解决方案沟通会-确定版-1011.pptx》**P40–P41**，是**我方在方案中提出的**协同机制与配合要求，属\"提案建议\"，**尚未见客户书面确认**。仅作方案口径备查，**不作为已定机制**。\n> 来源：会员运营解决方案沟通会 P40–P41（2026-10-11）\n\n### 11.1 沟通与复盘机制\n\n| 机制 | 频次 | 内容 |\n|---|---|---|\n| 周会 Weekly | 每周 | 沟通进度 · 数据同步 · 及时调整 |\n| 月会 Monthly | 每月 | 月初对齐目标 · 月度数据复盘 |\n\n**数据复盘指标体系**\n\n| 指标 | 定位 |\n|---|---|\n| **60 日复购率** | **核心北极星** |\n| 储值转化率 | 现金流指标 |\n| 加微率 | 私域入口 |\n| 活动 ROI | 效率指标 |\n\n### 11.2 需客户配合事项\n\n| 类别 | 责任方 | 具体内容 |\n|---|---|---|\n| 决策 & 监督 | **刘总、赵总** | 活动调整、权益变更、系统规则 |\n| 门店执行 | 一线团队 | 收银台引导入会、主动加微/加企微、物料摆放（台卡/海报），**核心动作不打折** |\n| 产品 & 内容 | 研发/品牌 | 拼团裂变产品、节点属性产品、宣发图文与视频、大活动大蛋糕 |\n| 物料配合 | 门店/市场 | 海报（会员日/储值）、台卡（收银/餐桌）、门店陈列、线下布景 |\n\n---\n\n## 十二、档案维护约定\n\n- **数据源一律归档到** `客户档案\\源数据\\`，文件名保持客户原始命名，不改名。\n- 本档案中每个数字都要能回答\"来自哪张表／哪张 sheet／哪个字段\"。\n- 客户新给的文件先归档，再更新对应章节，并在章节末标注日期。\n- 与源文件对不上时，写入第八章，不在正文里\"抹平\"。\n- **信源辨别（重要）**：本客户存在两份内容相似度高的 PPT —— `消费品牌 C_问题诊断_20260928_v2.pptx`（9-28）与 `消费品牌 C会员运营解决方案沟通会-确定版-1011.pptx`（10-11）。**同类信息一律以最新时点为准**；两份口径不一致且无法判断哪个更新时，**先与 Mirror 确认，不自行取舍**。\n- **区分「提案建议」与「已确认事实」**：方案 PPT 中由**我方提出**的机制、分工、考核指标（如 P40–P41 的协同机制与北极星）必须标注为\"提案建议\"，不得写成客户已确认的事实。\n\n### 交付物与外部链接\n\n| 类型 | 名称 | 位置 / 链接 | 状态 |\n|---|---|---|---|\n| 本地档案 | 消费品牌 C-客户档案.md（本   "s32": "# 零售品牌 A · 客户档案\n\n> 维护人：Mirror（Mirror）｜建档：2026-10-16｜最近更新：2026-11-13\n> 归档目录：`D:\\工作\\零售品牌 A\\`\n> 本次建档依据：桌面 `客户文件夹\\零售品牌 A\\` 下的提案 / 月度经营 / Q3 复盘文档（详见第十一章「已归档源数据」）。\n> 2026-11-13 更新依据：`零售品牌 A11月月会_2026.11.docx`（2026-11-04）；本次新增第三章 3.1、第五章 5.5、第九章 #13，其余章节未改。\n> 本档案随项目推进持续补充。**每条数据标注来源，改动前先确认。**\n\n---\n\n## 一、客户基本盘\n\n| 项目 | 内容 | 来源 |\n|---|---|---|\n| 品牌名 | 零售品牌 A（门店：零售品牌 A · 核心门店） | 外卖导出文件名；外卖诊断报告 |\n| 所在城市 | 某二线城市 | 用户口述（历史项目背景） |\n| 品类 | 蛋糕（生日/节日/四季/造型）、下午茶甜品、面包 | 提案确定版；Q3复盘 |\n| 门店数量 | **1 家**（核心主力店） | 外卖导出文件名 |\n| 门店面积 | **2026 年 5 月缩减一半**、装修简化 | Q3复盘 P38 |\n| 品牌定位（最新） | 从「网红下午茶心智」→ **「蛋糕首选心智」**；已从下午茶主导转换到**口味蛋糕主导** | Q3复盘 P13、P35 |\n| 合作关系 | 运营中台 × 零售品牌 A = **品牌增长咨询** | Q3复盘 P1 |\n| 老板 IP | 小红书约 2 万粉、微信好友约 4 万，愿出镜、有 IP 基础 | 用户口述（历史项目背景） |\n| 项目阶段 | Q3 复盘已交付（2026-10-14）；下一阶段 10–12 月动作已规划 | Q3复盘 P1、P41–P42 |\n\n**发展历程（用户口述，历史项目背景）**\n2019 双人私房起步 → 2021–2024 小型线下店 → 2024 迁现址、加强下午茶打卡 → 2024 末重点做抖音直播 + 低价小四寸冲量 → 2025 下半年发现低价低利润问题、减少直播 → 2026-04 暂停周年庆，2026-05 重装堂食店（**面积减半**）。\n\n---\n\n## 二、合作关系与服务范围\n\n| 项目 | 内容 | 来源 |\n|---|---|---|\n| 服务方 | 运营中台 | Q3复盘 P1 |\n| 服务内容 | 经营复盘、提案诊断（产品/渠道/流程三卡点）、用户需求洞察、产品矩阵与成本验证、下阶段动作规划 | Q3复盘 P27、P31、P36、P39–P42 |\n| 周期 | 本期 2026 Q3（7–9 月）；下阶段 2026 10–12 月 | Q3复盘 P1、P41 |\n| 双方分工 | 咨询方：出诊断、方案与动作清单；客户方：老板发起需求 → 主管执行 → 内部培训与跨部门协同 | Q3复盘 P30、P39–P42 |\n| 计划表机制 | 7 月 36 项 / 8 月 36 项 / 9 月 48 项，共 **120 项**；完成 106 项、延期 14 项，完成率 **88%** | Q3复盘 P7 |\n\n---\n\n## 三、渠道结构\n\n**2026 Q3 全渠道实收（元）**\n\n| 渠道 | 2026 Q3 | 2025 Q3 | 同比 | 差值 |\n|---|---:|---:|---:|---:|\n| 网店（小程序/线上商城） | 381,918 | 241,387 | **+58.2%** | +140,531 |\n| 门店（堂食） | 194,958 | 317,082 | **−38.5%** | −122,124 |\n| 抖音核销 | 251,838 | 383,972 | **−34.4%** | −132,134 |\n| 美团外卖 | 86,148 | 0 | **新增** | +86,148 |\n| 美团团购 | 32,314 | 66,506 | −51.4% | −34,192 |\n| **全渠道合计** | **947,176** | 1,008,947 | **−6.10%** | −61,771 |\n\n来源：Q3复盘 P11\n\n**线上商城内部渠道结构**：网店占比 24% → **40%**；门店占比 31% → **21%**（−11pp）｜P11\n> ⚠️ 原文括注「线上商城自营合计仍 +3.3%（576,876 → 558,469）」，但两数实为下降，口径存疑（见第九章）。\n\n| 渠道 | 状态与动作 | 来源 |\n|---|---|---|\n| 抖音 | 团购 + 直播；Q3 核销同比 −34.4%（去年 7 月大促基数高）。8 月平播未落地，9 月起稳定平播（依赖外部主播，ROI 待观察） | P7、P11、P29 |\n| 美团外卖 | 2026 Q3 新增渠道（10 月启动）。**取消率长期高位（7 月单月 62%）**，配送调整延期；8–10 月外卖诊断报告为附件 | P7、P11、P29、P43 |\n| 线上商城小程序 | 第一大渠道、增长最快（+58.2%）；会员主阵地 | P11 |\n| 美团团购 | 同比 −51.4% | P11 |\n| 小红书 | 中秋礼盒抽奖、新品体验官 10 人（投聚光）、内容占位「徐州蛋糕」关键词 | P7、P40 |\n| 视频号 / 贴图号 | 列入内容占位矩阵，暂无数据 | P40 |\n| 大众点评 | 未见相关数据 | — |\n| 淘宝闪购（原饿了么） | **未提及** | — |\n\n### 3.1 2026-10 渠道结构与流量（2026-11-13 新增）\n\n**线上商城商城内部分渠道**（来源：`零售品牌 A11月月会_2026.11.docx`「02 本月数据 > 线上商城商城」）\n\n| 指标 | 10月 | 9月 | 日均环比 | 去年10月 | 日均同比 |\n|---|---:|---:|---:|---:|---:|\n| 小程序（网店）· 实收 | 108,657 | 175,778 | −40.2% | 133,283 | −18.5% |\n| 小程序（网店）· 单均 | 137.2 | 158.6 | −13.5% | 117.2 | +17.0% |\n| 门店 · 实收 | 44,101 | 45,436 | −6.1% | 68,055 | −35.2% |\n| 门店 · 单均 | 60.8 | 64.5 | −5.7% | 59.4 | +2.2% |\n| **门店 · 占商城比** | **28.9%** | **20.5%** | 原文标 +8.3% | 33.8% | 原文标 −4.9% |\n\n> 原文结构判断（照录）：门店占商城比重从 9 月 20.5% 升到 10 月 28.9%，线下占比回升，是国庆假期与万圣节两个强线下属性节点的小爆发；网店下滑系中秋月饼高峰回落，在无口味大上新前提下与 8 月（11.3w）基本持平。\n\n**线上商城流量核心指标**（来源：同上「02 本月数据 > 流量数据分析」）\n\n| 流量指标 | 今年10月 | 今年9月 | 月环比 | 去年10月 | 年同比 |\n|---|---:|---:|---:|---:|---:|\n| 访客数 | 7,410 | 9,826 | −24.6% | 7,854 | −5.7% |\n| 浏览量 | 163,966 | 252,333 | −35.0% | 198,270 | −17.3% |\n| 新访客数 | 5,268 | 6,819 | −22.8% | 5,654 | −6.8% |\n| 下单人数 | 2,248 | 2,730 | −17.7% | 3,785 | −40.6% |\n| 支付人数 | 2,206 | 2,697 | −18.2% | 3,734 | −40.9% |\n| **访问-下单转化率** | **30.34%** | 27.78% | +9.2% | 48.19% | **−17.85pp** |\n\n> 原文判读（照录）：拉长到同比看问题不在流量，下单转化率从 48.19% 掉到 30.34%（−17.85pp），跳失率 27.59% → 32.77%（+5.18pp）；其中约一半来自渠道结构——去年线上商城承接 1,948 笔抖音券订单在小程序内支付（占线上商城订单 46%），今年只剩 837 笔（29%）。\n\n**产品 TOP10 集中度**（来源：同上「02 本月数据 > 产品数据分析」；口径：小程序商城，剔除来图定制/临时商品）\n\n| 月份 | TOP10 销售额（元） | 全月总销售额（元） | TOP10 占比 |\n|---|---:|---:|---:|\n| 去年10月 | 52,765 | 177,535 | 29.7% |\n| 今年9月 | 76,725 | 188,419 | 40.7% |\n| 今年10月 | **55,631** | **122,629** | **45.4%** |\n\n> 原文判读（照录）：TOP10 结构变化大，9 月为中秋礼盒/蛋黄酥占位，10 月由布朗尼、栗子可可、焦糖巧克力香蕉、焦糖杏仁 构已转化、价格带基本跑出、上新规则渐成 | P28 |\n| **渠道**：能不能接得住 | 已解决公私域价格倒挂，但公域未保留充分引流价格带产品，促复购未形成重点节奏 | P28 |\n| **流程**：能不能供得稳 | 月表习惯已成，但**研发仍多延期**、报单出单未优化、中秋内部培训与跨部门协同未完整落地 | P28 |\n\n### 8.2 根因判断（🔴 核心）：门店空间缩减 → 到店承接力下降 → 销售结构迁移\n\n**事实链**（Q3 复盘 P11 / P24 / P38）\n\n| 环节 | 事实 | 来源 |\n|---|---|---|\n| ① 物理空间 | **门店面积 5 月缩减一半、装修简化** | P38 |\n| ② 到店渠道下滑 | 门店（到店）渠道实收同比 **−38.5%**；门店实收同比 **−53.0%**、门店占比 **45.7% → 22.5%** | P24、P38 |\n| ③ 结构迁移 | 渠道盘：网店 **+58.2%**、门店 **−38.5%**、抖音 **−34.4%**、团购 **−51.4%**；线上商城内部：网店占比 24%→40%、门店占比 31%→21%（−11pp） | P11、P24 |\n| ④ 需求仍在 | 评价中「场景」提及率仍有 **50.5%** —— 用户打卡期待没有消失，是物理空间撑不起价格 | P38 |\n\n> **定稿判断**：本季的核心变化不是\"某个动作做错了\"，而是**门店物理空间缩减直接改变了销售结构**——到店下午茶的承接能力下降，消费迁移至线上小程序与口味蛋糕。门店既是营收渠道、也是**私域入水口**，其收缩同时削弱了「到店打卡」心智与「到店加微」拉新（P24 原文：「门店代表的可转化到私域的入水口大幅收窄」）。\n\n**推论（供讨论）**：既然后续增长要靠私域与线上蛋糕线，而门店入水口已收窄，则**拉新入口需要从\"到店\"向\"线上/投放/大客户\"转移**——这构成 Q4 动作的前提。\n\n> ⚠️ 原 Q3 复盘 P30「现象指向机制，不指向人」（老板临到关头改需求 → 中秋 6 项延期）属**内部管理讨论**，按 Mirror 口径**不作为根因结论**，已移出本章（见第八章待确认项 #12）。\n\n### 8.3 Q3 数据小结（三条结构性迁移）\n\n1. 销售结构从**下午茶主导 → 口味蛋糕主导**\n2. 复购率提升初步验证，客群从网红打卡尝鲜 → **生日庆祝 / 小份解馋**\n3. 核心渠道从**抖音引流 → 小程序私域**，但**门店入水口大幅收窄**（门店实收 −38.5%）\n\n来源：Q3复盘 P24\n\n### 8.4 场景抉择（尚未定案）\n\n下午茶场景**重建**（路线 A）还是**迁移心智**（路线 B）—— 讨论中。\n错配风险：用户心智有打卡期待，**物理空间（面积减半后）可能撑不起价格**｜P38\n\n### 8.5 下阶段动作（10–12 月）\n\n**六组动作**｜P39、P40\n\n| # | 动作 |\n|---|---|\n| 1 | 外卖优化（取消单 + 货架） |\n| 2 | 私域常态化会员分层 + 场景触达（四类固定触达 + 三处注册入口） |\n| 3 | 上新（大小份并行 + 自媒体提前排期 + 全渠道宣发） |\n| 4 | 抖音/美团货架引流品常设 + 固定档期平播 |\n| 5 | 小红书/抖音/视频号/贴图号内容占位 |\n| 6 | 门店到店加企微 + 蛋糕展示 |\n\n**分月安排**｜P42\n\n| 月份 | 工作 |\n|---|---|\n| 10 月 | 秋季产品上新 2.0、外卖专项调整、私域会员触达测试 2.0、会员积分盘点&方案初判、会员活动物料准备、公域推广测试（置换） |\n| 11 月 | 草莓季上新与推广、引流产品更替+促销、大活动物料准备、大活动产品研发、门店布景装置对接 |\n| 12 月 | 品牌大活动、车厘子上新、门店布景装置、全年数据盘点、年度复盘&年度规划（线下） |\n\n---\n\n## 九、待确认与存疑项\n\n| # | 问题 | 影响 | 优先级 |\n|---|---|---|---|\n| 1 | **月饼上架时点**：P7 写「晚约 11 天」、P29 写「晚约 10 天」 | 中秋复盘归因 | 🟡 中 |\n| 2 | **小四寸 2025 基数**：P13 金额 51,872 / 销量 787 vs P17 金额 45,402 / 销量 693 | 小四寸衰退幅度 | 🟡 中 |\n| 3 | **储值顾客数同比**：正文 +100.35% vs 表内 +30.2%（P18/P19） | 储值增长结论 | 🔴 高 |\n| 4 | **储值指标「同比/环比」列口径混乱**：同一数值 +120.3% 同时出现在叙述与环比列 | 储值增速 | 🟡 中 |\n| 5 | **调研样本收集期**：P31「6–9 月」vs P32「2026 年 5–8 月」 | 洞察时效 | 🟡 中 |\n| 6 | **门店占比下滑幅度**：P38 写 45.7% → 22.5%（同比 −53.0%）vs P11 线上商城内部门店 31% → 21% | 门店入水口收窄幅度 | 🔴 高 |\n| 7 | P11 括注「线上商城自营合计仍 +3.3%（576,876 → 558,469）」，但两数实为下降 | 线上商城整体走势 | 🟡 中 |\n| 8 | **9 月财务数据缺失**（利润表仅到 8 月） | Q3 盈利结论不完整 | 🔴 高 |\n| 9 | 调研问卷份数：Q3 复盘正文「317 份」，但历史问卷分析成品基于 228 份 / 86 份（见工作流文档） | 样本量口径 | 🟡 中 |\n| 10 | 抖音好评率 93.6% 存在**引导好评**可能，不能等同于真实口碑 | 口碑健康度判断 | 🟡 中 |\n| 11 | 淘宝闪购、大众点评两渠道无数据 | 渠道矩阵不完整 | 🟢 低 |\n| 12 | Q3 复盘 P30「现象指向机制，不指向人」（老板临到关头改需求 → 中秋 6 项延期）按 Mirror 口径**不纳入根因**；是否另作\"内部管理建议\"保留，待定 | 管理建议取舍 | 🟢 低 |\n| 13 | **9 月全渠道实收口径冲突（2026-11-13 新增）**：`零售品牌 A11月月会_2026.11.docx`「02 全渠道经营总览」四渠道合计 **371,481 元** vs 本档案 5.1「分月实收」（Q3复盘 P10）**370,276 元**，差 1,205 元；口径未核清 | 10 月环比基数、Q3 分月序列 | 🟡 中（两值并列保留，不换算） |\n\n---\n\n## 十、档案维护约定\n\n- **数据源一律归档到** `客户档案\\源数据\\`，文件名保持原始命名，不改名。\n- 本档案中每个数字都要能回答「来自哪份文档 / 哪一页 / 哪个口径」。\n- 客户新给的文件先归档，再更新对应章节，并标注来源。\n- 与源文件对不上时，写入第九章，不在正文里「抹平」。\n- **口径提醒**：零售品牌 A的「门店」是**渠道概念**（堂食），不是门店数量；「门店实收」与「网店实收」均在**线上商城口径**内，与「全渠道实收」不可直接相加比较。\n- **信源辨别**：同类信息以**最新时点**为准（Q3 复盘 1014 ＞ 更早的经营/洞察材料）；两份口径冲突且分不清先后时，**先与 Mirror 确认**，不自行取舍。\n- **问题定位口径**：本档案的问题诊断**以可验证的经营事实为准**（如门店空间缩减 → 渠道结构变化），内部管理层面的归因不写入根因。\n\n---\n\n## 十一、已归档源数据清单\n\n| 文件 | 内容 | 归档日期 |\n|---|---|---|\n| `零售品牌 A_Q3经营复盘-1014.pptx`（44 页） | **2026 Q3 经营复盘**（本档案主要来源） | 2026-10-16 |\n| `零售品牌 A复盘数据.xlsx` | 复盘原始数据 | 待拆解 |\n| `零售品牌 A提案确定版.pptx` | 合作初期提案 | 待拆解 |\n| `零售品牌 A 开业复盘&工作沟通会-0710.pptx` | 开业复盘 | 待拆解 |\n| `零售品牌 A 老板问卷.pdf` | 老板问卷 | 待拆解 |\n| `【零售品牌 A】提案前数据分析.xlsx` | 提案前数据分析 | 待拆解 |\n| `零售品牌 A9月月会.docx` | 2026-09 月会 | 待拆解 |\n| `零售品牌 A8月月会.pptx` / `零售品牌 A10月月会_2026.10.docx` | 月度经营 | 待拆解（在 `D:\\工作\\零售品牌 A月会\\`） |\n| `零售品牌 A经营周会_2026-W32~W38.docx`（7 份） | 周报 | 待拆解 |\n| `零售品牌 A外卖诊断报告_8-10月_确定版.docx` | 外卖专项诊断 | 待拆解 |\n| `零售品牌 A用户反馈-202608.xlsx` | 抖音/美团/调研问卷三 sheet | 待拆解 |\n| `零售品牌 A复盘数据.xlsx` 12.9MB | 复盘数据总表 | 待拆解 |\n| `零售品牌 A11月月会_2026.11.docx` |   "s33": "# 问题识别与优化建议\n\n> 来源：2026-09-17 通读 8 份材料（两份个人复盘、零售品牌 A提案与开业复盘、连锁品牌 B年度沟通会、两份项目上下文、烘焙思考）后识别。\n> 用法：每条含「现象 / 证据 / 建议」。P0 是会直接影响交付质量或客户信任的，建议优先处理。\n\n---\n\n## P0｜会直接影响交付质量\n\n### P0-1 数据表里的汇总口径自相矛盾（已对原始页复核，诊断更新）\n\n**现象**：零售品牌 A 6 月营业数据表中，\"订单\"列的分渠道值为商城 3277、美团 89、抖音 657、外卖 262，但汇总行写 3277。加总应是 4285，表内不一致。\n\n**已核对原始页（2026-09-17）**：`零售品牌 A 开业复盘&工作沟通会-0710` 第 16 页，实际三行是——\n\n| 时间 | 商城 | 美团 | 抖音 | 外卖 | 汇总 | 订单加总 | 差 |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| 5 月 | 1,741 | 78 | 988 | 237 | **1,741** | 3,044 | -1,303 |\n| 6 月 | 3,277 | 89 | 657 | 262 | **3,277** | 4,285 | -1,008 |\n| 2025 年 6 月 | 2,060 | 355 | 1,536 | / | **3,951** | 3,951 | 0 ✔ |\n\n**结论：不是口径问题，是汇总订单列的公式引用范围错。** 2026 年两行的汇总订单都恰好等于\"商城订单\"，漏加了美团／抖音／外卖三个外部渠道；2025 年 6 月那行因为外卖为\"/\"，公式覆盖到了前三个渠道，是加对的。**金额列的汇总是对的**（6 月 171,651+7,775+66,307+24,493 = 270,226 ✔），说明问题只在订单这一列。\n\n**建议**：\n- 修公式：汇总订单 = 商城 + 美团 + 抖音 + 外卖（外卖为\"/\"时视为 0），不要引用单一渠道单元格。\n- 这份表以后每期交付前**先做一次\"分渠道加总 = 汇总\"的自检**，两列（订单、金额）都要跑。\n- 汇总行加一列\"口径\"，说明哪几列可加总。\n\n客户当场发现表内算不平，会直接损伤专业信任。\n\n### P0-2 投放效果没有归因设计，复盘只能停在 CPE\n\n**现象**：小红书投放的数据是篇数、阅读、互动、单篇均值、CPE，能证明\"注意力买得便宜\"，但无法回答\"带来了多少到店成交\"。项目上下文里自己也写了\"尚不能直接证明到店成交和长期复购，需要后续建立渠道归因\"。\n\n**证据**：零售品牌 A开业复盘投放数据页；`零售品牌 A_项目上下文.md` 小红书投放数据段。\n\n**建议**：归因要在投放**前**埋，不是复盘时补。\n- 博主内容带专属券码 / 专属小程序链接 / 私信关键词\n- 核销或客服接待时增加一句来源询问，落表登记\n- 同城投放按\"篇均进店成本\"（总花费 ÷ 归因到的到店单数）而不是 CPE 做验收\n\n否则每一次投放复盘都会重复同一句话：\"效率好，但不知道效果。\"\n\n### P0-3 研发节奏被压缩是重复问题，不是偶发\n\n**现象**：从 2026 年上半年往前看，至少四次：\n- 母亲节、520 定版晚，打样匆忙，产品吸引力不足，宣发节奏失配\n- 开业大活动：父亲节蛋糕、甜品研发、线下物料准备延期\n- 开业复盘问题 3 明确写\"砍价产品交付和现场抽奖的卡点，本质是测试环节还不足\"\n- 2026 年中复盘再次写\"产品研发节奏偏慢，父亲节和甜品研发周期被压缩\"\n\n**证据**：`零售品牌 A_项目上下文.md` 研发与运营段、开业复盘问题页、`2026年中复盘`。\n\n**建议**：同一个问题连续四个节点出现，说明缺的是机制不是意识。建**研发倒排表**作为每个节日/上新项目的必备附件：\n\n```\n上线日\n ← 宣发启动（提前 N 天）\n ← 物料到位（提前 N 天）\n ← 定版（提前 N 天）\n ← 二次调整 / 体验官内测\n ← 打样 + 算成本\n ← 概念立项（起点）\n```\n\n把每一环的\"提前天数\"按客户实际产能定死，写进上新 SOP。**复盘时先看倒排表有没有按时开、每环有没有按时交，再谈活动效果。**现在的问题是每次都在结果端复盘，从来没在节点端追责。\n\n---\n\n### P0-4 同一份交付物里，表格与正文用了两套口径\n\n**现象**：零售品牌 A 9 月月会第 4 页表格写\"美团外卖日均环比 **+83.4%**\"（日均口径），第 7 页正文写外卖\"环比 **+77.5%**\"（总额口径）。同一指标在同一份交付物里出现两个数，两个都没标口径。\n\n**证据**：`零售品牌 A9月月会.pdf` 第 4 页与第 7 页。\n\n**建议**：\n- **一份交付物内，同一指标只保留一种口径**；换了口径就在表下注明。\n- **口径注要写在核心数据页上**，不能只放在某一页的图例里。这份月会最关键的\"8 月＝30 天\"只写在第 13 页储值图的图例中（「8 月（30 天）」），第 4 页那张最核心的全渠道表完全没有说明——任何人按列值复算都会判成\"算错了\"。\n- 月会/周会**交付日期早于月底**时，在封面或首张数据页统一注明数据截止日（如\"本期数据截至 8/30\"），并说明月末最后一天的归属（归本期还是归下周）。\n\n## P1｜重复出现、影响效率\n\n### P1-1 渠道角色没有固化，导致一收就崩、一放就亏\n\n**现象**：零售品牌 A抖音从\"重点经营、低价小四寸拉量\"→\"发现核销和利润问题、减少直播\"→2026 年 1-5 月成交从 23.1 万降到 8.4 万、购买人数从 2471 降到 938。项目上下文里也承认\"购买人数下降，而不是客单价崩塌\"。\n\n**证据**：`零售品牌 A_项目上下文.md` 抖音近 12 个月分析、渠道与价格段。\n\n**建议**：问题不在\"要不要投抖音\"，在于**没有先定义角色再决定投入**。为每个渠道建一张角色卡并写进项目上下文：\n\n| 字段 | 说明 |\n|---|---|\n| 角色 | 拉新 / 尝鲜 / 承接 / 利润 / 复购 |\n| 承接产品 | 哪些 SKU，**明确禁止跨渠道同款同规格低价** |\n| 价格带 | 上下限 |\n| 毛利要求 | 下限 |\n| 验收指标 | 看什么数 |\n| 禁用动作 | 如\"不做无利润的低价小四寸\" |\n\n季度复盘只审视\"角色是否成立\"，不因单月数据反复改定位。现在的问题是每次数据波动就改一次战略。\n\n### P1-2 计划完成率用项数口径，容易被拆项抬高\n\n**现象**：连锁品牌 B\"13 个计划表、380 项工作、完成率 96.6%\"。项数粒度由自己定义，拆得越细完成率越好看。\n\n**证据**：`连锁品牌 B20260805合作年度沟通会` 计划执行总结页。\n\n**建议**：完成率旁边并列两个指标：\n- **关键节点达成率**：有硬 DDL 的项目（节日上新日、大活动日、财报交付日）是否按时\n- **延后 / 取消项数**：像零售品牌 A开业复盘那样明确标出（\"抖音平播（取消）\"\"父亲节蛋糕（延后）\"）——这是最有信息量的部分\n\n380 项 96.6% 完成，如果同时有 6 项延期且都在关键节点上，后者才是真相。\n\n### P1-3 过程数据与结果数据之间缺因果链页\n\n**现象**：2026 年中复盘给自己定的标准是\"过程数据能和结果数据增长有明确的逻辑关联\"，但实际交付物里，过程数据（访客、新增客户、复购率）和结果数据（实收）是并列两块，中间的因果关系靠听众自己脑补。\n\n**证据**：`2026年中复盘` 关键结果部分；零售品牌 A开业复盘数据回顾的模块划分。\n\n**建议**：数据回顾开头加一页**因果链页**，把当期的核心动作串成一条可见的链：\n\n```\n投了什么动作 → 过程指标变化 → 结果指标变化\n（如：权益卡全渠道开售 → 企微+1102 / 新增客户4461 → 6月实收270,226，环比+28%）\n```\n\n这一页是\"我们做的事有用\"的最直接证据，也是客户续约时最认的一页。\n\n### P1-4 活动花费没有单位获客成本\n\n**现象**：开业活动花费 14,586 元，只给了总花费和明细，没有折算成获客效率。\n\n**证据**：开业复盘活动花费估算页；同份复盘问题 2 已经提出\"赠送类活动应看作购买注意力\"的视角。\n\n**建议**：费用表增加一列并给出当期值：\n\n> 单位获客成本 = 活动总花费 ÷ 新增有效客户数\n> 例：14,586 元 ÷ （企微新增 1102 人）≈ 13.2 元/人\n\n再在下次活动做纵向对比。有了这个数，\"这次活动贵不贵\"才有客观答案。\n\n### P1-5 提案的\"老板问卷\"环节结果没有回流\n\n**现象**：零售品牌 A提案里有独立的\"老板问卷\"环节，但问卷结果如何影响后续诊断、老板说的卡点和数据看到的卡点是否一致，在提案里看不到。\n\n**证据**：`零售品牌 A提案确定版` 第 4 页。\n\n**建议**：问卷结果单独做一页**认知差页**——左边\"老板认为的问题是\"，右边\"数据/现场看到的问题\"，中间标出重合与分歧。分歧点就是提案最有杀伤力的抓手，也是后面说服老板改动作的支点。现在这页素材被浪费了。\n\n---\n\n## P2｜长期优化\n\n### P2-1 文件版本与归档混乱\n\n**现象**：\n- 零售品牌 A同一份开业复盘同时存在 `.pptx`（23MB）和 `.pdf`（24MB），内容重复\n- `~/Desktop/个人/` 下混放六份不同时期的复盘（2024年终、2024分享、2024年10月、2025半年、2025年终、2026年中），其中还有一份个人简历\n- 连锁品牌 B目录下多个周会 PDF、多个 Excel 数据源与交付物混放\n\n**建议**：按 `_工作区总纲.md` 第六节的归档规范执行——一个客户一个目录，按交付物类型分文件夹，文件名带日期，同内容只留一份唯一基准。\n\n### P2-2 客户档案与工作区分家\n\n**现象**：客户上下文维护在 `~/Desktop/各客户/`，工作区是空的。每次讨论都要跨目录读。\n\n**建议**：把客户档案迁入 `WorkBuddy/工作/客户档案/`，桌面只保留原始资料（PPT、Excel、PDF）。档案是\"结论\"，原始资料是\"证据\"，两者分离更清晰。`客户档案/_索引.md` 已建好位置。\n\n### P2-3 月度数据采集是手工重复劳动\n\n**现象**：每月需要从线上商城、抖音、美团、外卖后台分别导出，再手工汇总成表。多个客户重复同一动作，且每次表格结构可能不同。\n\n**建议**：固定一份**月度数据采集模板**（字段、口径、表下注全部预置），每月只填数不重搭表。跑顺 2-3 个月后，若字段稳定再考虑脚本化采集与汇总。\n\n### P2-4 任务不写责任人，但需要内部承接力检查\n\n**现象**：现有规范里月度计划任务不输出责任人（避免替客户内部分工，这个边界是对的）。但 2026 年中复盘自己总结的教训是\"研发能否按时、部门是否协同、负责人是否明确……决定策略停留在 PPT 还是进入真实经营\"。\n\n这两件事有张力：**对外不写责任人，对内就不能不判断谁能接住。**\n\n**建议**：对外交付保持不写责任人，**内部另存一份承接力检查表**：\n\n| 动作 | 客户是否有明确承接人 | 是否需要项目经理代推动 | 风险等级 |\n|---|---|---|---|\n\n复盘时用这张表解释\"为什么没落地\"——比如开业活动的研发延期，本质是\"产品研发在客户内部没有明确承接人\"。有了这张表，复盘的问题归因会从\"研发节奏慢\"落到\"研发没有责任人\"。\n\n### P2-5 客户阶段跃迁的判断可以做成清单\n\n**现象**：2026 年中复盘里有一个很准的观察——\"客户'能自主完成日常工作'和'能主动完成阶段跃迁'是两种不同的能力。前者依赖熟练度，后者意味着打破惯性、重新分配资源\"。这个判断目前只存在于个人复盘里，没有被产品化。\n\n**证据**：`2026年中复盘` 连锁品牌 B部分；`烘焙思考.md` 客户发展阶段（0-1 / 1-10 / 10-100）。\n\n**建议**：把\"客户能不能从 1-10 走到 10-100\"做成一页判断清单（依据：日常上新是否自主、大活动是否需要外部推动、是否有跨部门资源调配能力、是否有稳定招牌、会员资产是否在积累），作为周期复盘的标准模块。\n\n好处有两个：一是复盘多一个战略视角，不只看数据；二是这套判断本身就是咨询服务的差异化能力——**大多数同行只能报数据，能判断\"客户处在哪个能力台阶\"的很少。**\n\n---\n\n## 附：素材里值得保留的既有做法\n\n识别问题的同时，这几件事做得是对的，标准化时不要丢掉：\n\n- **项目上下文的信息分级**（已确认事实 / 数据结论 / 阶段性判断 / 待验证假设）——这是所有客户档案的骨架，很干净。\n- **更新日志机制**——新资料进来追加一条，旧结论移入日志不删除，避免重复使用失效结论。\n- **剔除峰值再判趋势**（连锁品牌 B：剔掉 4 个高峰日后 6→7 月日均只降 1.4%）——这个动作很专业。\n- **劣势标注解决状态**（已解决 / 基本解决 / 正在解决 / 初步解决）——避免客户觉得半年白干。\n- **活动拆解标注\"取消 / 延后 / 减少\"**——把没做的部分显式写出，比只报成绩更有信息量。\n- **提案里不替老板拍板目标与奖金**——只给方法、系数和演算，边界感很稳。\n",
  "s34": "# 工作区总纲\n\n> 用途：烘焙咨询项目经理工作台的总入口。讨论任何客户事项前，先读本文件 + 对应客户档案。\n> 建立：2026-09-17\n> 维护规则：客户状态、交付物、技能索引发生变化时更新；客户具体经营结论写在各自档案里，不写在这里。\n\n---\n\n## 一、这个工作区是什么\n\n这里是Mirror（Mirror）在运营中台做烘焙/餐饮咨询项目经理的工作台。\n\n**用法**：Mirror 丢来一个任务（写提案、排月计划、做复盘、查数据），先按本文件找到对应交付物类型 → 调用对应技能 → 读取客户档案取背景 → 产出交付物。\n\n**我（阿墨）的边界**：\n- 内部动作（读文件、整理、分析、起草、算数）可以直接做。\n- 对外动作（发给客户、发布、提交）必须等 Mirror 明确说发。\n- 不臆造数据、不编亲历案例；数据缺失就标缺失，推断标推理边界。\n\n## 一之一、工作区文件清单\n\n| 文件 | 作用 | 什么时候读 |\n|---|---|---|\n| `_工作区总纲.md` | 本文件。客户清单、交付物地图、默认前提 | 每次开工前 |\n| `_数据口径与交付规范.md` | 三类交付物的完整骨架 + 数据口径规则 + 检查清单（人读版） | 写任何交付物前 |\n| `_优化建议.md` | 从历史材料识别出的问题与改进建议，按 P0/P1/P2 分级 | 想复盘工作方式时 |\n| `客户档案/_索引.md` | 定位每个客户的上下文唯一基准 | 讨论具体客户前 |\n| `客户档案/_建档模板.md` | 新客户建档用的通用模板 | 接新客户时 |\n\n> 方法论有两个版本：`_数据口径与交付规范.md` 是给人看的速查手册；技能 `cake-client-review` 是给 AI 调用的执行规范，内容同源。**改了一边记得同步另一边。**\n\n---\n\n## 二、当前客户清单\n\n| 客户 | 城市 | 业态 | 阶段 | 我的角色 | 状态 | 档案 |\n|---|---|---|---|---|---|---|\n| 零售品牌 A | 徐州 | 蛋糕/甜品/下午茶 | 1-10 成长 | 主责 | 合作中（2026.5 起） | `Desktop/零售品牌 A/零售品牌 A_项目上下文.md` |\n| 连锁品牌 B | 华南某城 | 蛋糕/甜品/下午茶（9 店） | 1-10 → 10-100 过渡 | 辅助（主责郭师傅） | 合作中（2025.8 起） | `Desktop/连锁品牌 B/连锁品牌 B_项目上下文.md` |\n| 消费品牌 C | 某城（内蒙古） | 融合料理+咖啡+甜品（单店） | 0-1 单店高利润 | 主责 | **提案前**（2026.9 起，合作内容＝会员运营） | `Desktop/消费品牌 C/消费品牌 C_项目上下文.md` |\n| 烘焙项目G1 | — | 西餐连锁 | 100-1000 | 辅助 | 参与度已降低 | 待建档 |\n| 跨界项目F | 西安 | 健身房（非餐） | 0-1 | 主责 | 已停止（2026.4） | 案例素材，见个人复盘 |\n| 泰熙家 | — | 韩餐连锁 | — | 辅助 | 已结束（2025.9） | 案例素材 |\n\n历史客户（沉淀为案例）：区域品牌 D（2024.10-2025.10，亏损收窄 75%）、新锐品牌 E（2025.3-2025.11，实收 +76%）。\n\n> **档案唯一基准说明**：客户档案目前维护在桌面各客户目录下的 `*_项目上下文.md`，采用\"已确认事实 / 数据结论 / 阶段性判断 / 待验证假设 + 更新日志\"结构。工作区不复制副本，避免双份不同步。\n> 建议：后续把客户档案迁入本工作区 `客户档案/` 统一管理（见 `_优化建议.md`）。\n\n---\n\n## 三、交付物地图\n\nMirror 对客户的主要交付物有 5 类，每类都有固定骨架，不要每次重新发明。\n\n| # | 交付物 | 触发场景 | 调用技能 | 标准骨架 |\n|---|---|---|---|---|\n| 1 | **合作初期提案** | 新客户签约后 1-2 周内，1-2 小时提案会 | `customer-full-case-marketing-proposal` | 做诊断 → 看卡点 → 给解法 → 跑样板 |\n| 2 | **大活动复盘 & 工作沟通会** | 开业/周年庆/年中/年末大活动结束后 | `cake-client-review`（活动复盘路径） | 工作复盘 → 数据回顾 → 问题与建议 → 下阶段安排 |\n| 3 | **周期经营复盘** | 月度 / 季度 / 半年 / 年度 | `cake-client-review`（周期复盘路径） | 工作回顾 → 数据回顾 → 原因分析 → 下一年安排 |\n| 4 | **月度经营计划** | 每月底排次月 | `cake-business-planning` 系列 | 诊断 → 策略 → 日历项目 → 渠道动作 → 30-50 项任务 |\n| 5 | **年度/四季路线图** | 年中、年底做全年规划 | `cake-seasonal-roadmap` | 五条线 × 四季节奏 |\n\n支撑技能：`cake-brand-diagnosis`（诊断）、`cake-strategy-engine-mapping`（九宫格+六引擎）、`cake-calendar-project-planning`（项目取舍）、`cake-channel-growth-planning`（渠道动作）、`cake-big-campaign-marketing-planning`（大活动策划）、`cake-plan-rendering`（H5/Excel 呈现）。\n\n**呈现层**：内容先定稿，再按目标载体转换——PPT 用 `cake-ppt-layout`（版式规范，**主轴＝复盘版**，源自开业复盘）→ 由 `tencent-pptx` 或 python-pptx 出文件；Word/文档用 `tencent-docx`；H5/甘特图用 `cake-plan-rendering`。不要把内容创作和排版混在一起做。\n\n> **客户交付 PPT 的版式唯一唯一基准**是 `cake-ppt-layout`。客户既有交付物（提案、月会、开业复盘）都出自同一套设计语言，新交付物必须沿用，不允许自选模板。提案类交付物用它第八章的差异表替换对应数值。\n\n---\n\n## 四、讨论客户事项时的默认前提\n\n这几点在零售品牌 A、连锁品牌 B两个项目里已经反复确认，是所有分析的底层约定：\n\n1. **数据口径先行**。任何数据到手，先问：时间范围？渠道范围？成交/实收/应收/核销哪个口径？是否剔除内部订单？口径不一致就不做加减。\n2. **不把单渠道数据说成全渠道**。线上商城/小程序、抖音、美团、外卖各自只能代表自己。\n3. **先回答\"是不是真的变差\"**，再谈问题。区分长期同比、短期环比、节日季节性；节假日峰值要先剔除再比日常。\n4. **结论要落到平台、门店、指标、负责人、验证周期**。只写\"要加强私域运营\"这种话等于没写。\n5. **老板讲经营语言，内部留方法论**。不在主讲页堆 SWOT、4P、AARRR。\n6. **不替老板拍板**。目标、奖金、定价给方法、参考系数和演算，不给结论数字。\n7. **不采用高风险方法**：补单、霸王餐、诱导删评、私下退款规避平台，一律不写进方案。\n\n---\n\n## 五、数据源位置\n\n| 来源 | 位置 | 说明 |\n|---|---|---|\n| 零售品牌 A全部素材 | `~/Desktop/零售品牌 A/` | 提案、开业复盘、周会 PDF（W32-W37）、工作计划 Excel、财报、会员诊断、用户反馈 |\n| 连锁品牌 B全部素材 | `~/Desktop/连锁品牌 B/` | 年度沟通会、经营月会、周会 PDF、复盘数据 Excel、美团/闪购外卖 Excel、优惠券 Excel |\n| 消费品牌 C全部素材 | `~/Desktop/消费品牌 C/` | 老板问卷（0922）、提案前信息收集表、7–8 月财报、8 月工资表、问卷可视化 PDF |\n| 行业与长期判断 | `~/Desktop/零售品牌 A/烘焙思考.md` | 闭店潮因果链、客户发展阶段、差异化树、壁垒树、壁垒评估指标 |\n| 个人复盘 | `~/Desktop/个人/` | 年度/半年个人复盘，含能力模型与方法沉淀 |\n\n---\n\n## 六、归档规范（建议执行）\n\n- **一个客户一个目录**，目录内按 `01-提案 / 02-月计划 / 03-活动 / 04-复盘 / 05-数据源 / 06-周会月会` 分。\n- **文件名带日期**：`客户名_交付物类型_YYYYMMDD_v1.pptx`，交付后不再覆盖，改版另存。\n- **同内容不同格式只留一份唯一基准**：PPTX 定稿后若导出 PDF，PDF 加后缀 `_导出`，避免两份不同步。\n- **历史版本进 `_archive/`**，不删除、不混在当期目录。\n",
  "s35": "# 数据口径与交付规范\n\n> 用途：跨客户通用的\"怎么算数、怎么摆数、怎么交付\"约定。写任何交付物前过一遍。\n> 建立：2026-09-17（提炼自零售品牌 A提案/开业复盘、连锁品牌 B年度沟通会、两份个人复盘、烘焙思考）\n> 维护规则：出现新的口径冲突或返工点，补进来。\n\n---\n\n# 第一部分：数据口径规范\n\n## 1.1 三组最容易混的数字\n\n| 组 | 不能混用 | 说明 |\n|---|---|---|\n| 金额 | **应收 / 实收 / GMV** | 应收=折前，实收=折后到手，GMV=平台口径流水。三者差着折扣和平台费 |\n| 行为 | **成交 / 核销 / 支付** | 团购券\"卖出去\"不等于\"核销了\"，核销率是活动质量的真指标 |\n| 规模 | **订单数 / 人数 / 占比** | 一单可能一人，一人可能多单；写\"增长\"必须说清是哪个口径 |\n\n外卖平台另有三分法：**平台 GMV / 顾客实付 / 商家收入**，必须分开写，不能统一称\"营业额\"。\n\n## 1.2 渠道口径\n\n- **商城（线上商城）**：按支付渠道统计（企微 + 支付宝 + 储值）。需注明是否剔除内部订单（如\"剔除周总为订货人的订单\"）。\n- **外部渠道（美团/抖音/外卖）**：按后台核销金额统计。默认未剔除内部订单，若与商城口径不一致，表下必须写明。\n- **铁律**：单渠道数据不外推全渠道。线上商城只代表线上商城，抖音只代表抖音。\n\n## 1.3 时间口径\n\n- **同比** = 对去年同月；**环比** = 对上月；**周维度** = 看活动节奏（蓄力→爆发→长尾）。\n- **节日/大促峰值必须单列**。判断日常趋势时先剔除峰值日再比。连锁品牌 B案例：剔掉 4 个高峰日后，6→7 月日均只降 1.4%，而总额环比看着像崩盘。\n- 长期同比、短期环比、节日季节性三者分开讲，不要用一个数字下结论。\n- **月会/周会口径的\"月度\"不一定等于自然月**。月会常在月初交付，数据只取到上月底（如 9/1 交付的月会只到 8/30，即 30 天）。看到\"日均\"先确认天数；跨月汇总前必须定该月最后一天的归属，否则会漏算或重复。\n\n## 1.4 复购口径\n\n- 线上商城复购率 = 复购会员数 ÷ 消费会员数（按有手机号的订单）。\n- 不同平台复购定义不同，**只做平台内趋势，不横向比**。\n- **cohort 留存表（客户后台的「第 N 月留存」）**：行＝获客月份，列＝获客后第 N 个月**当月再次成交**的人数与占比。四条铁律：\n  1. **列是单月活跃，不是累计、也不是去重合并** —— 同一顾客可能落在第 1、2、3 月，**三列不能相加**（\"3 个月内至少复购一次\"需顾客明细才能算）。\n  2. **第 1 月＝次月**。跟老板讲\"次月复购率／第三个月复购率\"，不要讲\"第 3 月留存\"。\n  3. **同龄比较（推荐）**：同一个\"第 N 月\"跨 cohort 比，再按季度取均值（同时控制了顾客年龄）。**同月比较慎用** —— 越新的 cohort 在任何月份都天然更活跃，拿它比老 cohort 是拿新鲜度当成绩。\n  4. **旺季月要标注**（落在中秋／春节的那个\"第 N 月\"会虚高）；**表最早一行之前没有同口径 cohort，就不要硬造\"同比\"**。\n\n## 1.5 表下必写口径注\n\n每个数据表下方固定一行注，格式：\n\n> 注：统计范围为【××】；按照【成交/实收/核销】口径计算；已/未剔除【××】。\n\n没有这行注的表，不算合格的数据页。\n\n## 1.5.1 复核既有数据页：先找口径，再判对错\n\n拿到上一期交付物里的数据表，按列值重算发现对不上，**不要直接下\"表算错了\"的结论**。按这个顺序查：\n\n1. **先读表下注和同页正文**。同页正文常写着另一套口径，且往往比表格更诚实。例：表格标\"日均环比 +83.4%\"，同页正文写\"日均 1,469 元，环比 +83%\"——\"日均\"就是答案。\n2. **看图例和图表标签**。图例里常直接写着天数和口径范围（例：「7 月（31 天）」「8 月（30 天）」）。\n3. **反推分母，逐行验证**。用表内数字倒推它用的分母（`日均 = 金额 ÷ 天数`），要能**逐行精确复现**才成立。能复现 → 不是算错，是口径不同。\n4. **再判是否合规**。口径不同不等于没问题，常见毛病是把口径藏起来：同文档表格用一套、正文用另一套，且都不标注。\n\n> 反面案例（2026-09 零售品牌 A Q3 复盘）：8 月月会表标\"日均环比 +7.3%\"，按列值复算是 +3.9%，一度被判为\"表内算不平\"。翻原始页后发现 8 月只有 8/1—8/30 共 30 天，月会按日均比较**做法是对的**；真正的问题是核心表没有口径注、同文档正文用了总额口径（+77.5%）、8/31 归属不明。\n> **教训：判\"算错\"之前必须先穷尽口径解释；要到原始页核对，不能只按列值重算。**\n\n## 1.5.2 资料读取（实操）\n\n- **图片型 PDF（周会／月会常见）没有文本层，要渲染成图再读**，不要因文本提取为空就判定\"无法读取\"。零售品牌 A W32／W34／W36／W37 与 9 月月会都属此类，实际均可渲染读取。\n- **先渲染全部页，再按页读**；表头、图例、表下注这些口径线索渲染后才看得到。\n- **先读目录页/板块页定位，再跳读数据页**，不要从第一页顺序读。月会结构通常是：上月工作与完成情况 → 本月数据（渠道／产品／流量／会员）→ 本月计划。\n- 同一指标在不同交付物里对不上时，按\"日期更新 → 口径更完整 → 可追溯\"的顺序取唯一基准，并保留旧值及差异说明。\n\n## 1.5.3 用户侧证据（问卷 / 评价 / 触达）\n\n三份材料样本性质不同，**只能互相印证，不能互相替代**：问卷说\"偏好\"，评价说\"感知\"，触达说\"行为\"。\n\n**调研问卷**\n- 先看性别／年龄／购买频次三项定样本性质。若\"近一年未购买过\"占比高，样本即**新客／非核心客**——只能解释感知与偏好，**不能代表老客复购**。\n- 多选题是\"一选项一列\"，单元格存**固定字母标签**（A/B/C…），非空＝选中。**\"排第一\"不能用 `startswith('A')` 判断**，只表示该选项编号。\n- 同一列可能混了两道题（平台改题后合并导出）。按**值前缀体系**拆分后再统计，否则两题数字互相污染。\n- 开放题先词频、再逐条读原文。**具体名词比形容词有行动价值**（\"动物奶油\"12 次 > \"好吃\"33 次）。\n\n**平台评价**\n- 高分率极高时（如 5 星 93%+）**必须注明\"存在引导好评可能\"**，说明它影响代表性、不影响提取诉求词。\n- 主要用途是**提取用户原话词汇**，不是算满意度。分「好吃／场景／颜值／服务／价格／包装」几组做覆盖率。\n- **用数据里真实出现的词，不要用行业词**。例：客户以为用户说的是\"下午茶\"，1,530 条里该词只出现 46 次（3.0%），用户说的是\"好看／能拍／能出片／能打卡\"。品牌语言照抄行业词，用户接不住。\n- **差评要逐条读完**（通常几十条）。用户会把\"为什么觉得不值\"直接讲出来，这是好评里永远看不到的。\n\n**触达 / 投放测试**\n- **先找空白对照组**。有对照组且其自然回流为 0 时，才敢说触达带来的是增量；无对照组只能描述\"触达组表现\"。\n- **ROI 必须写清分母**。常见口径 `ROI = 支付金额 ÷ 短信费`，分母仅几百元，数值会很高——这是**\"仅渠道端 ROI\"**，不能当整体投放 ROI 用。\n- **分层 ROI 的排序即人群精度排序**（越精准越高）→ 支持\"分层触达\"而非\"全量群发\"。\n- 报表**合计行可能与分层行相加不一致**（漏行／合并单元格）。用合计行，**不要自己重算分层**。\n\n**价格敏感度的判断**\n- 看**差评里的具体句子**，不要看价格区间众数。常见情形：价格带没问题（众数在中位），但**\"感知价值\"被场景或份量击穿**（\"以前卖的是环境，现在你凭啥\"）——这不是价格问题，是价值支点问题。\n\n**两条使用边界（2026-09-24 补）**\n- ⚠️ **差评是\"排除性证据\"，不是\"指令性证据\"。** 只能支撑\"某个具体问题存在\"（可验证的事实），**不能支撑\"品牌整体该做什么\"**——几十条差评往往只占全量 3%—6%，且非随机、非全员。用法限定两条：① 定位可验证的问题；② 提出**待验证假设**。要升级成品牌层面动作，必须先有全量数据验证。\n- ⚠️ **\"用户在意\"≠\"能构成差异\"。** 定品牌语言／卖点排序前先问：**同行是不是也做到了？** 同行都做到的＝**及格线**（讲了没溢价，但页面仍要如实标注，属**信任项**不是卖点）；只有你做到或同行没说的＝**差异点**，才配当主角。（例：动物奶油在烘焙行业已通用，用户在意但同行都有 → 标注即可。）\n\n## 1.5.4 商品／单品结构的分析口径（2026-10-02 补）\n\n**① 不要用商品总额做同比。** 商品明细表的总额同比与营业额同比是同一件事，放同一份复盘里属重复。商品表的价值只在**结构**：谁在长、谁在掉、掉多少、补回来多少。\n\n**② 客户的商品分类字段常年被重构，不能直接用来做跨年同比。**（例：零售品牌 A 2025 年有「口味生日蛋糕／常温点心／下午茶甜品系列（需预定）」，2026 年换成「小四寸口味蛋糕／新品上新／季节限定」——分类改名比产品变化大得多。）\n\n可靠做法：**逐行按「商品名 + 规格字段里的尺寸标记」重新归类**，再把每个桶的 TOP 商品打出来人工核对，确认桶内成分干净再信数字。判类依据按可靠性排序：**规格字段的结构化尺寸（`尺寸:6寸`）> 规格转译 > 商品名关键词**。\n\n三个必踩的坑：\n- **同一商品名横跨多个尺寸桶**——必须**按行（规格）判类**，不能按商品名整条归堆。\n- **关键词误伤**：`茶` 会命中「红茶无花果**蛋糕**」「冷萃茶上新·蜜桃乌龙**蛋糕**」，判饮品前先排除蛋糕类词（蛋糕／巴斯克／布丁／慕斯）。\n- **单个特殊单品能带偏一整档均价**（例：去年 6 寸里一个 64 元/件的低价卡通蛋糕，把 6 寸均价从 177 拉到 103）。**某档均价跳变时，先找是不是单个单品造成的，剔掉后再算。**\n\n**③ 结构类论证的推荐出法：份额交叉 ＋ 单品书证 ＋ 量价拆解。**\n- 切成 3—4 条业务线（下午茶线／整只蛋糕／节点礼盒／非标定制），给两年金额 + 份额 pp 变化——**份额交叉比金额涨跌更能说明「换轨」**。\n- **单品书证**：去年撑起旧场景的系列是否归零 ＋ 今年替代系列补位了多少百分比。**「补位不足」比「下滑」更有行动指向。**\n- **量价拆解**：增长档拆成 金额／件数／均价。**件数涨而均价不动 ＝ 需求真实增长，不是促销拉动**——这是支撑「不降价」判断最硬的证据。\n  - ⚠️ **先剔除非标品**（来图定制／临时商品）：其「数量」字段常不是件数（零售品牌 A 2026Q3：76,141 元／65,431「件」＝1.2 元/件），留着会把整体件均价从 61 元拉到 10 元，**结论直接反过来**。\n  - 自洽校验：**（1+件数）×（1+均价）−1 必须等于金额同比**，不等就是分类或口径错了。\n- **不出帕累托和 TOP10 集中度**：若集中度同比 pp 差在 3pp 以内 (无显著变化)，出了反而削弱论证。\n\n**④ 系列按关键词归集时，必须把命中的货名逐条列出来再求和**（2026-10-05 补）。同一商品跨月会有多个货名字符串（空格／后缀差异）被当成不同货名。零售品牌 A【KT 限定】先报成 93,036，逐条列出后真值 **132,334.33**（39 个货名），补位比例从 39% 变成 **27.5%**——**方向没变但幅度差 40%**。\n另：补位比例可以用「新系列÷去年同系列」也可以用「新系列÷该线自身缺口」，**页面上只能用一个**，另一个放注里。\n\n## 1.5.5 客户月会有、而平台后台没有的指标（2026-10-03 补）\n\n有些指标**只在客户自己的月报里有**，平台后台拿不到。典型两类：\n- **订单量**（客户月报按月公布；平台后台没有跨渠道的统一订单口径）\n- **渠道内部拆分**（例：线上商城拆「网店／门店」）\n\n**处理规则**（2026-10-03 按 Mirror 裁定修订）：\n1. **交付物里只放一套口径——复盘口径。** 「两套口径并列」已被否决：同一页出现两个\"实收\"，客户第一反应是\"哪个才是真的\"。某一项指标若只有另一套口径有，**先与负责人对齐，不要自动并列**。\n2. **渠道拆分必须索取原始月表，不要用占比折算。** ⚠️ 2026-10-03 教训：拿「月会给的网店/门店占比」×「线上商城自营」折出来的网店 412,394／门店 118,748，与拿到后台原始「销售渠道构成」后重算的 **335,612／194,958 差 7.7 万**——因为 7、8 月的占比来自月会、9 月来自后台，**不同源**。做法：**索取每个月的原始渠道构成截图，三个月同源后再做季度**，页脚写明取数位置。\n3. **线上商城后台有两套互不替代的切法**：「**销售渠道构成**」＝按渠道（网店渠道／门店渠道／美团外卖渠道／未知）；「**支付方式明细**」＝按支付方式（抖音券支付／美团点评券支付／美团／…）。交叉后的恒等式（9 月验证到分）：**线上商城自营 = 网店渠道 + 门店渠道 + 未知 − 抖音券支付 − 美团点评券支付**；「美团外卖渠道」这一桶正是被平台后台替换掉的那一项。**券从网店侧扣**（门店金额常小于券总额，装不下）。\n   - **线上商城「总览」一次能取全的字段**：营业收入 / **营业额（＝应收，含优惠金额）** / 优惠金额与优惠占比 / 营业收入不含储值赠送金 / **支付订单数** / 营业目标与完成进度 / 新增充值金额（本金）/ 储值卡销售金额 / 使用储值本金 / 使用储值赠送金。\n   - **「支付订单数」＝小程序商城＋门店的线上商城侧订单**（含经小程序核销的外部平台券），**不是全渠道订单数**，不能拿来除全渠道实收算客单价。\n   - ⚠️ **拿到原始月表后必须回查此前结论，方向都可能被算反**：零售品牌 A 2025 年 8／9 月的网店门店，月会值（85,743/72,023、180,891/90,535）与后台原值（85,638.66/114,090.00、224,761.80/164,402.35）差一倍以上，一度把「门店 −38.5%」误算成「−3.1%」。\n4. **折扣率 = 实收 ÷ 应收 = 营业收入 ÷ 营业额**（线上商城总览同页给这两个数，差额＝优惠金额）。⚠️ 引用前先确认应收是否完整（若含未支付／失败单，折扣率会被夸大）。\n5. **客单价必须与实收同源，且区间必须一致。** 复盘口径实收 ÷ 月会口径订单量，会得到客户从未见过的数；天数不一致时误差可达 11%（9 月 30 天的金额 ÷ 27 天的订单 = 131 元，偏高）。→ **正确做法是先跟负责人对齐**：① 请客户补整月订单量；② 保留月报客单价并注明来源。**不要用\"金额÷券均价\"反推订单量。**\n6. **各月天数不同时必须标天数**（客户月报常是 27／30／31 天混用）；同比统一按日均，或声明用总额。\n7. 两个口径可能给出方向相反的结论（零售品牌 A Q3：月会口径 −4.0%／日均 +0.3%，复盘口径 −7.1%）——**仍是值钱的信息，但位置在\"口径说明\"，不占正文数据页。**\n\n**从月报补数据的两个技巧**：\n- **缺失的绝对值可以从月报公布的「日均同比」反推**，再交叉验证（零售品牌 A 8 月订单 4,214 由 88.0 ÷ (1−35.2%) × 31 得出，与月报 -35.2% 精确吻合）。\n- **订单量可由分渠道拼装**：网店订单 + 门店订单 + 抖音核销券数 + 美团消费笔数。\n  ⚠️ 同一平台的「笔数」在不同来源可能不同（2025 年 9 月抖音：月会 1,624 单／明细表 2,821 券）——**金额取哪个来源，笔数就用同一个来源**。\n\n## 1.6 成本、定价与预算的参考系数\n\n| 项 | 参考值 | 备注 |\n|---|---|---|\n| 主推 4 寸蛋糕 | 定价 118-128 元 | 含包装毛利 65%-70%，可通过增加合理成本提升价值感 |\n| 其他产品毛利 | 60%-75% 之间浮动 | 按产品角色差异化，不搞一刀切 |\n| 年度营销预算 | 营业额 3%-5% | 超出需说明理由 |\n| 大活动预算 | 年度营销预算的 30% 左右 | 单场大活动不挤占日常 |\n| 成本卡更新 | 常规非季节产品每半年一次 | 成本卡必须标准化，用成本反推定价 |\n\n## 1.7 产品角色口径（1261 结构）\n\n| 角色 | 占比 | 对应场景 | 承担任务 |\n|---|---|---|---|\n| 基石产品 | 60% | 生日 + 节日 + 高仪式感社交 | 利润与体验，礼物/道具属性 |\n| 流量产品 | 20% | 日常解馋（促销）+ 社交（打卡） | 传播与竞争 |\n| 招牌产品 | 10% | 日常解馋 + 轻社交 | 认知，前提是消费频次足够高 |\n| 新产品 | 10% | — | 其他三类的来源，靠上新 SOP 迭代 |\n\n判断新品的正确顺序：概念落地 → 打样算成本 → 检查工艺 → 体验官体验 → 二次调整 → 定版 → 物料准备 → 门店上新 → 数据跟踪。**跳过打样和体验官直接上新，是这半年反复出问题的地方。**\n\n---\n\n# 第二部分：三类交付物的标准骨架\n\n## 2.1 合作初期提案\n\n调用 `customer-full-case-marketing-proposal`。骨架为四段：\n\n**做诊断 → 看卡点 → 给解法 → 跑样板**\n\n- 做诊断：品牌历程时间轴 → 内部（品牌现状资产、经营数据、渠道结构、产品结构、SKU 结构）→ 外部（市场量化、竞对走访、产品测试）\n- 看卡点：卡点用**老板能听懂的提问**命名——\"用户想买蛋糕时，为什么会想到零售品牌 A？\"\"用户选择时会优先去哪里买？\"\"如果订单增长，哪些部门会有压力？\"\n- 给解法：把卡点收束成 3 项经营能力，每项配一个可复用的模型工具\n- 跑样板：活动目标（拉新/锁客/流程/培训四类）→ 活动计划表 → 五期拆解（准备/蓄水/传播/高潮/长尾）\n\n每一页照片/数据都必须回答\"这张图证明什么\"，不做素材堆砌。\n\n## 2.2 大活动复盘 & 工作沟通会\n\n用于开业、周年庆、年中/年末、品牌大播等单次大活动结束后的复盘会。四段结构：\n\n### 01 工作复盘\n1. **活动目标**：四类目标（拉新 / 锁客 / 流程 / 培训），逐条打完成状态标记（✅ 达成 / ⭕ 部分 / ✗ 未达）\n2. **活动计划表**：说明这次要跑通的样板是什么（节点项目表、产品分线、价格修正、客服话术）\n3. **活动拆解**：按五期（准备 / 蓄水 / 传播 / 高潮 / 长尾）逐项列出实际执行状态——**延期、取消、缩减、变更都要标出来**，不要只写做了什么\n4. **活动花费测算表**：项目 / 产品 / 数量 / 单位成本 / 总成本 / 合计，附估算说明\n5. **活动模型**：说明本次活动调用的是哪套模型（如三级火箭、增长飞轮）\n6. **任务背景**：回溯提案里定下的能力建设目标，说明活动是在为什么服务\n\n### 02 数据回顾\n按 6 组依次展开，每组自带口径注：\n\n| 组 | 内容 | 必带对比维度 |\n|---|---|---|\n| 营业额 | 分渠道（商城/美团/抖音/外卖）+ 汇总，字段：订单、金额、单均 | 年同比、月环比 |\n| 周维度趋势 | 蓄力-爆发节奏、单日峰值、综合折扣率 | 与活动节点对齐 |\n| 渠道占比 | 合作前后对比 | 变化百分点 |\n| 流量 | 私域 / 抖音 / 美团点评 / 小红书，字段：访客、转化率、新客占比、核销占比 | 去年同期 |\n| 活动 | 每个活动分开列：新老客结构、用户数、金额、核销率、转化率 | 目标完成率 |\n| 拉新与投放 | 新增客户、新增会员、注册转化率、企微加人；投放篇数、阅读、互动、CPE | 去年同期 / 目标 |\n\n> 关键页写法：**\"看热闹\"和\"能转化\"必须分开讲**——访客涨了但转化率跌了，要放在同一页对照，不能只报涨的那一半。\n\n### 03 问题与建议\n每个问题固定五段（见下文 2.4 问题闭环规范）。数量控制在 3-4 个，宁少勿杂。\n\n### 04 下阶段工作安排\n- **上新规划建议**：研发季度表（研发时间 / 上线时间 / 分类 / 节日时令口味建议）\n- **营运动作拆解**：按月列 5-8 项，不堆砌\n- **月工作计划**：表格\n- **附：产品建议**：图片参考\n\n## 2.3 周期经营复盘（月 / 季度 / 半年 / 年度）\n\n用于向客户汇报一段周期的整体经营结果。四段结构：\n\n### 01 工作回顾\n1. **逐月工作主题**：每月给一个标签，让人一眼看到这条线——如\"8月-调研提案定方向\"\"9月-上新驱动补短板\"\"10月-大活动加速磨合\"\"12月-跨越双旦，历史新高\"\n2. **计划执行总结**：计划表数量、任务总数、已完成/进行中/待开始、整体完成率\n3. **优势 / 劣势 / 机会 / 威胁**：劣势和威胁**必须标注解决状态**（已解决 / 基本解决 / 正在解决 / 初步解决），不能只列问题不看进展\n\n### 02 数据回顾\n营业数据（全渠道 → 分渠道 → 渠道占比）→ 流量 → 会员 → 产品 → 活动核销 → 营销花费。\n\n**每个渠道固定用同一个句式表达**，便于横向比较：\n\n> ××渠道合作前月均订单 ×× 个、月均实收 ×× 元、单均 ×× 元；合作后月均订单 ×× 个、月均实收 ×× 元、单均 ×× 元。订单年同比 ××%，实收年同比 ××%。\n\n产品数据用期初 vs 期末对比（SKU 数、TOP10/TOP20 集中度、80% 营业额所需 SKU 数），这是\"结构优化\"最有力的证据。\n\n### 03 原因分析\n回答\"为什么是这个结果\"，而非复述数据：\n\n- **营销基础框架**：增长飞轮（用户思维为中心 + 流量思维探路 + 数据思维优化 + 最小单元试错）\n- **活动体系**：三级火箭（Ⅰ级高频触达 / Ⅱ级上新 / Ⅲ级特殊节点 / 卫星品牌活动）\n- **节日爆发数据**：按节日对比去年同期，证明节点投入的杠杆\n- **日常上新流程**：SOP 是否跑顺\n- **执行推进**：利用活动节奏让渠道运营逐步成熟\n\n### 04 下一年 / 下阶段安排\n- 已完成体系盘点（基础运营流程 / 体系搭建 / 单店模型打磨，各用几个月）\n- 产品体系重塑（价格体系、产品结构）\n- 营销体系搭建（公私域循环、会员体系）\n- 季度工作拆解\n- 专项工作（如外卖专项、财报整理）\n\n## 2.4 问题闭环规范（三类交付物通用）\n\n每个问题写全五段，缺一段就算没写完：\n\n1. **现象** —— 一句话，用经营语言，不用术语\n2. **证据** —— 至少 2 类（数据 / 现场 / 访谈 / 截图），标明来源\n3. **根源** —— 不能复述现象。如\"研发节奏慢\"的根源是\"缺少倒排机制\"，不是\"研发不上心\"\n4. **建议** —— 用\"建议——\"引导，给参考系数或演算示例，不给空泛方向\n5. **验证** —— 责任人 / 验证指标 / 验证周期。没有这一段，问题会连续几个季度重复出现\n\n## 2.5 呈现层规则\n\n- 内容先定稿，再转格式。**不要一边想逻辑一边排版**。\n- PPT → `cake-ppt-layout`（版式规范，客户交付 PPT 的唯一唯一基准；**主轴＝复盘版**，源自开业复盘），再交 `tencent-pptx` 或 python-pptx 出文件；Word/文档 → `tencent-docx`；H5 / 甘特图 Excel → `cake-plan-rendering`。\n- **客户交付 PPT 不允许自选模板**。既有交付物（提案、月会、开业复盘）出自同一套设计语言，新交付物沿用同一套；提案类交付物用该规范第八章的差异表替换对应数值。\n- 老板主讲页不出现 SWOT、4P、AARRR 字眼，翻译成\"有势能/不成系统/有窗口/会被训练\"这类说法。\n- 主讲页 + 证据页 + 备查页三层结构：1 小时提案主讲 25-30 页，2 小时 35-45 页。\n\n---\n\n# 第三部分：交付前检查清单\n\n**数据**\n- [ ] 每个数字都有来源和口径注\n- [ ] **本页数据已写血缘声明**：来自 L0（原始凭证）还是 L1（我方加工表），具体到 表名/sheet/列\n- [ ] **口径是业务口径，不是「我参考的那张表的口径」**：能报出这个口径的**名字**和**算式**\n- [ ] **已过自证断言**：单渠道 ≤ 全渠道；分项和 = 合计；比率落在合理区间（无外部信息即可判荒谬）\n- [ ] 应收/实收/GMV、成交/核销/支付没有混用\n- [ ] 单渠道数据没有被说成全渠道\n- [ ] 同比、环比、节日季节性分开表述\n- [ ] 峰值日是否已剔除后再下\"趋势变差\"的结论\n- [ ] 月度口径是否覆盖完整自然月；若只取到上月底（如 30 天），口径注已写明，且该月最后一天的归属已定\n- [ ] 同一份交付物里表格与正文用的是同一口径（尤其\"日均\"与\"总额\"）\n- [ ] 引用客户既有数据页时口径已复核，未把\"口径不同\"误判成\"算错了\"\n- [ ] 交付物内每个指标只有**一套口径**；某指标若只有另一套口径有，已与负责人对齐，未自动并列\n- [ ] 渠道拆分若跨口径，已按占比折算到统一口径，且页脚披露了折算方法\n\n**逻辑**\n- [ ] 先讲\"现状是否真的变差\"，再讲问题\n- [ ] 每个卡点/问题都有至少 2 类证据\n- [ ] 根源不等于现象复述\n- [ ] 每条建议带参考系数或演算\n- [ ] 每条建议有责任人、验证指标、验证周期\n- [ ] 没有替老板拍板目标数字、奖金金额\n\n**表达**\n- [ ] 主讲页没有未解释的框架缩写\n- [ ] 每页只有一个结论\n- [ ] 结论落到平台 / 门店 / 指标 / 负责人\n- [ ] 有一句老板能记住的收束语\n- [ ] 没有使用补单、霸王餐、诱导删评等高风险方法\n\n**交付**\n- [ ] 文件名带客户名 + 交付物类型 + 日期\n- [ ] 图表数据与正文数字一致\n- [ ] 附件、链接、口径注齐全\n- [ ] 对外发送前已获得明确授权\n\n---\n\n# 第四部分：数据作业防错机制（2026-10-11 立）\n\n> 起因：零售品牌 A Q3 复盘 08／09 两页把「线上商城营业收入」当全渠道实收，7 月同比写成 **+135.4%**（全渠道实为 +50.8%），8 月方向写反（+19.6% vs 实际 −15.7%）。被质疑三轮，前两轮我回答的都是「数据是准的」。\n> 根因**不是不知道口径**（口径就写在台账 3.2 与本规范 1.2），是四个流程缺环。本章把它固化成闸门，任何数据页落稿前必须逐道通过。\n\n## 4.1 数据血缘分级 —— 谁可以当基准\n\n| 级 | 是什么 | 例 | 能当基准吗 |\n|---|---|---|---|\n| **L0 原始凭证** | 平台后台界面／截图、客户原始导出表的原始列 | 线上商城后台「支付方式明细」、抖音后台核销、美团后台消费金额 | ✅ **唯一基准** |\n| **L1 我方加工表** | 由 L0 推导的中间表，带我的口径理解 | `零售品牌 A_4-9月经营数据统计_v2.xlsx` | ❌ 加工品，会**封装**错误 |\n| **L2 交付物** | PPT／Word 里的表 | 复盘 PPT 数据页 | ❌ 被核对象 |\n\n**三条禁令（这三条就是本次三个坑的解药）**\n\n1. **方向只能 L0 → L1 → L2，不能反向。** 禁止拿 L2 或 L1 去核 L0，禁止拿交付物去核对原始数据。\n2. **禁止同级互核。** L1 核 L1、L2 核 L2，一致只能证明**转录没错**，不能证明**口径对**。\n3. **禁止用自己做的表验证自己做的另一份表。** 同源 ≠ 正确。L1 的错误一旦封装进去，之后所有引用它的地方都会**一致地错**——错误被一致性掩盖，越核越\"准\"。\n\n**每次作业开头写一行血缘声明**：\n\n> 本页数据：L0 ／ L1（表名·sheet·列）｜口径：___｜取数日期：___\n\n拿不到 L0 时，**必须显式写「本项无 L0，仅 L1 内部一致」**，不能沉默。\n\n## 4.2 口径卡片前置 —— 先写算式，再动表\n\n做任何数据页之前，先把口径写成一个**带输入的算式**，算式写不出来就说明口径没定，不许开表。\n\n例（零售品牌 A全渠道）：\n\n```\n全渠道实收 = 线上商城白名单支付方式之和\n           + 抖音团购核销 + 美团团购消费金额 + 美团外卖营业收入\n输入：① 线上商城后台支付方式明细（白名单：微信／支付宝／储值余额／储值赠送金／小红书担保／线上商城零钱）\n      ② 抖音后台核销  ③ 美团后台消费金额  ④ 外卖后台营业收入\n```\n\n**输入的缺失要在这里暴露**，不要等到落稿。例：8／9 月线上商城支付方式明细我手上没有（Excel 对账报告只到 2026-07，且是「收款金额」≠「营业收入」）→ 这一条在**开表之前**就该报出来要数，而不是先算完再被质疑。\n\n## 4.3 落稿三断言 —— 每个数据格都要过\n\n| 断言 | 问什么 | 反例（本次实际发生） |\n|---|---|---|\n| **① 口径断言** | 这一格的口径**名字**是什么？报不出名字＝没定口径 | 「实收 238,887」报不出名字，它其实是「线上商城营业收入」 |\n| **② 自证断言** | **不用外部信息**能否判出荒谬？单渠道 ≤ 全渠道？分项和 = 合计？比率在 0–100%？ | 26·7 线上商城营业额 **329,985 > 当月全渠道 259,301**——单渠道大于全渠道，当天就该被抓 |\n| **③ 方向断言** | 换一个正确口径，同比／环比的**方向**会不会反过来？ | 8 月：线上商城口径 +19.6% ／ 全渠道 −15.7%，**方向相反** |\n\n②是最便宜也最可靠的一道——它不需要拿到任何外部数据，纯粹内部矛盾自证。**每页至少跑一次②。**\n\n## 4.4 不确定必须显式申报\n\n**核不了的项必须主动说「这一项我核不了，原因是___」，沉默跳过＝默认没问题——这是最危险的失败模式。**\n\n回答边界要区分三层，不要用一个「准」字盖掉：\n\n| 层 | 问题 | 我能不能自证 |\n|---|---|---|\n| 转录 | 数字从表抄到 PPT 抄对了吗 | ✅ 能 |\n| 口径 | 那张表的这一列，是业务上要的那个口径吗 | ❌ 需回到 L0 |\n| 覆盖 | 口径覆盖范围对吗（含不含门店／外部渠道／未支付单） | ❌ 需回到 L0 |\n\n**被问「数据准不准」时的正确动作**：先反问一句「你要核的是**数字对不对**，还是**口径对不对**？」——本次三轮都栽在没问这句。\n\n## 4.5 正确回答「准不准」的标准句式\n\n> ① 转录：PPT 与 XX 表逐格一致（xxx 格全对）。\n> ② 口径：**这一列的口径是 ___，不是 ___；口径正确性我还没核**（或：已回 L0 核过）。\n> ③ 覆盖：计算范围为 ___，未含 ___。\n> ④ 我没核的部分：___（列出来）。\n\n**禁止只答①就说「准」。**\n\n## 4.6 接手「上一版／别人做的／客户改过的」数据时\n\n1. 先找这张数的 **L0**，找不到就明确说找不到；\n2. 用 L0 重算，**不要**先读对方表再逐格比（那会锚定在对方的数上）；\n3. 对不上的项，按 1.5.1 的顺序查口径（表下注 → 图例 → 反推分母），再判是否算错；\n4. 双方口径不同且都成立的，**并列说明差异与出处**，不擅自判定谁错。\n",
  "s36": "# 工作区长期约定\n\n> 本工作区 = Mirror 在运营中台做烘焙/餐饮咨询项目经理的工作台。\n> 讨论任何客户事项前，先读 `_工作区总纲.md` + 对应客户档案。细节过程见 `memory/YYYY-MM-DD.md` 日志，本文件只留**跨会话仍生效**的约定。\n\n## 一、产出形态的界限（Mirror 2026-09-17 明确）\n\n**不要每轮对话都建文件。** 三问判断法：\n1. 这东西要离开这个会话吗？（对外发送／后续要填内容）→ **交付**，建文件到客户目录\n2. 下次会话不记得会出事吗？→ **记录**，写 memory / 技能 / 既有档案（不建独立文件）\n3. 都不是 → **讨论 / 询问**，正文直接说、直接问\n\n**默认值**：不确定时先按讨论处理，先说话；等待说\"存一下\"\"给我一份\"再落文件。**宁可少一个文件。**\n\n已发生的判断示例：Q3 思路稿→交付 ✓；版式对照图→交付 ✓；空白模板/logo→交付 ✓；「模板 v1 冻结与待办说明」→属记录，不该建文件（已归 `05-版式/_archive/`，待调项并入技能 `cake-ppt-layout` 第十章）。\n\n## 二、客户档案唯一基准\n\n客户档案（`*_项目上下文.md`）**维护在桌面，工作区不复制副本**（避免双份不同步）。工作区 `客户档案/` 只有 `_建档模板.md` 与 `_索引.md`。\n\n- 零售品牌 A：`~/Desktop/零售品牌 A/零售品牌 A_项目上下文.md`\n- 连锁品牌 B：`~/Desktop/连锁品牌 B/连锁品牌 B_项目上下文.md`\n- 消费品牌 C：`~/Desktop/消费品牌 C/消费品牌 C_项目上下文.md`（2026-09-24 建档，会员运营项目）\n- 跨客户行业判断：`~/Desktop/零售品牌 A/烘焙思考.md`\n\n结构固定：信息管理规则 / 已确认事实 / 数据结论 / 阶段性战略判断 / 外部市场判断 / 执行优先级 / 提案与讨论偏好 / 待持续补充 / 待验证假设 / 更新日志。（是否迁入工作区 `客户档案/` 待 Mirror 定。）\n\n## 三、交付物 → 技能对照\n\n| 交付物 | 技能 |\n|---|---|\n| 合作初期提案 | `customer-full-case-marketing-proposal` |\n| 大活动复盘 & 工作沟通会 | `cake-client-review`（路径 A） |\n| 周期经营复盘（月/季/半年/年度） | `cake-client-review`（路径 B） |\n| 月度经营计划 | `cake-business-planning` 系列 |\n| 年度/四季路线图 | `cake-seasonal-roadmap` |\n| 大活动策划 | `cake-big-campaign-marketing-planning` |\n| 调研前问题诊断（新合作摸底、给老板看的简版） | 无专属技能；内容＝「一页一问题（现象→证据）」，版式走 `cake-ppt-layout`；骨架照 `~/Desktop/消费品牌 C/01-诊断/消费品牌 C_问题诊断_20260928_v1` |\n| H5 / 甘特图 Excel 呈现 | `cake-plan-rendering` |\n| 客户交付 PPT 版式 | `cake-ppt-layout`（版式唯一唯一基准） |\n\n**流程**：内容先定稿 → 过 `cake-ppt-layout` 定版式 → PPT 交 `tencent-pptx` 或 python-pptx 出文件；Word 用 `tencent-docx`。**客户交付 PPT 不允许自选模板。**\n**版式主轴＝复盘版**（2026-09-17 裁定）：主色 `#EA4809`（辅 `#EC7C30`、灰 `#B4B2A9`）、页标题 24pt 纯黑（问题页 20pt）、logo 11.22/0.24、全宽横线 y=0.86、导语 18pt 居中、数据表同比/环比行整行 `#F4B083`。\n\n## 四、同业复盘样本库（定内容颗粒度下限）\n\n| 样本 | 路径 | 用途 |\n|---|---|---|\n| 区域品牌 D半年复盘会 | `~/Desktop/工作/区域品牌 D/`（53 页 pptx+pdf） | **颗粒度标尺**：门店财务拆解（FLR／坪效／人效）、报损、用户体验地图、逐 SKU 定价 |\n| 区域品牌 D 2 月季度会 | 同目录（50 页） | 季度骨架：亮点与暗点独立成段、提案→执行→小结→新版闭环 |\n| 区域品牌 D Q2 复盘脑图思路 | 同目录 docx | 用户侧**视角框架**：拉新／复购／生命周期，每视角四栏「关键动作→效果→问题拆解→后续建议」 |\n| 零售品牌 A开业复盘 | `~/Desktop/零售品牌 A/零售品牌 A 开业复盘&工作沟通会-0710.pptx`（65 页） | 大活动复盘骨架；也是版式主轴来源 |\n\n区域品牌 D三份骨架**互不相同**，按复盘性质选，不要当一套照抄。区域品牌 D是同业客户，**新交付物深度不应低于它**。\n\n## 五、客户目录归档约定\n\n```\n零售品牌 A/ 02-月计划  04-复盘  05-版式  06-周会月会\n消费品牌 C/   01-诊断\n```\n命名 `客户名_交付物类型_YYYYMMDD_v版本`；历史版本进该目录 `_archive/`，**不删**。\n客户交付物固定**四件套**：PPTX + `_导出.pdf` + `_预览.png`（网格总览）+ `_build_*.py`（可重跑脚本）。\n\n## 六、交付唯一基准：资料库云端（2026-10-08 定）\n\n**「之后的改动直接在这个资料库云端版本上更新」**——最终唯一基准是云端那份，本地 `_build_*.py` 只是生成工具。\n\n| 交付物 | 云端节点 |\n|---|---|\n| 零售品牌 A Q3 经营复盘 | `0F9FcqwtGrDl2x1K8pAFFf` → https://www.workbuddy.cn/space/d/0F9FcqwtGrDl2x1K8pAFFf |\n\n更新（**同一 node-id 替换＝原子更新**，不产生重复节点、链接不变）：\n```bash\npython3 \"<library技能>/drive/upload_drive_file.py\" <本地新pptx> \\\n  --node-id 0F9FcqwtGrDl2x1K8pAFFf --file-name \"<原文件名>\"\n```\n替换前先 `node-info` 确认版本、可下载云端当前版做基线比对。传 `--file-name` **不改**节点显示名；本地版本号继续递增，云端保持一份。\n\n## 七、零售品牌 A全渠道实收口径（2026-10-11 重写；Mirror 二次强调，最高优先级）\n\n**外部渠道恒指三个：抖音团购、美团团购、美团外卖**（2026-10-11 Mirror：「外部渠道以后我就不解释了」）。\n\n### ★★ 铁律（2026-10 踩过最大的一次坑）\n\n**线上商城后台的「营业收入」既不是全渠道，也不是线上商城自营——它里面本来就装着外部渠道。**\n\n外部三渠道在线上商城后台共出现两处：\n\n| 出现在哪 | 名称 |\n|---|---|\n| 支付方式明细 | 「抖音支付」（导出名：**抖音券支付**）｜「**美团点评券支付**」（美团团购）｜「**美团**」（美团外卖） |\n| 销售渠道构成 | 「**美团外卖渠道**」 |\n\n**正确全渠道 ＝（先在线上商城里剔除外部渠道 → 得「线上商城自营」）＋（再加三个外部渠道自己后台的数）。**\n\n- **剔除＝白名单**（Mirror 原话）：只算线上商城平台自身的支付方式——**微信支付／支付宝／储值余额本金／储值余额赠送金／小红书担保支付／线上商城零钱／现金** 等。\n- 等价黑名单写法：`线上商城营业收入 − 抖音支付 − 美团点评券支付 − 美团`。\n- 外部渠道**必须用平台后台数**：不经线上商城核销的那部分不在线上商城里，线上商城侧恒略低。\n- **线上商城「营业收入」当全渠道用 = 把外部渠道算两遍 + 虚增同比**（26·7 线上商城营业收入同比 +135.4%，全渠道只有 +50.8%）。\n\n黑名单公式（台账 3.2 原文，2026-10-02 定）：\n```\n月实收 = 线上商城·营业收入合计 − 抖音券支付 − 美团点评券支付 − 美团\n       + 抖音核销金额 + 美团消费金额 + 外卖营业收入\n```\n| 平台 | sheet | 取哪一列 |\n|---|---|---|\n| 抖音 | `抖音`（按 [1]「月」，`2026/07`） | [9] **核销金额** |\n| 美团 | `美团`（按 [1]「日期」，`202607`） | [32] **消费金额**（≠成交金额、≠用户实付） |\n| 外卖 | `外卖`（按 [1]「月份提取」） | [8] **营业收入** |\n\n线上商城取「支付方式明细」的「**营业收入(元)**」合计行（**不用「收款合计」**，含储值充值属预收）。\n已交叉验证：4、5 月合计与 Excel「汇总」精确一致；7 月与月会逐项吻合。已知坑：**6 月抖音券支付 = 50,213.30**（非 5,021.30）。\n\n**月会「线上商城／商城」列口径** ＝ 线上商城「营业收入」−「抖音券支付」（25/07：101,462.74−11,144.78＝90,318 ✓）。25/07 **没有**「美团点评券支付」「美团」两行。\n\n**线上商城「网店／门店」拆分**在「销售渠道构成」里（不在支付方式明细里）。**唯一基准＝`04-复盘/零售品牌 A_4-9月经营数据统计_20261002_v2.xlsx` 的「渠道构成」sheet**。旧记的「网店 329,508→394,074／门店 201,147→113,811」是月会口径、**已废，勿再引用**。现行数：\n\n| | 25Q3 | 26Q3 | 同比 |\n|---|---:|---:|---:|\n| 网店净额（＝网店渠道−平台券） | 200,853.24 | 335,601.87 | +67.1% |\n| 门店 | 317,081.53 | 194,957.92 | −38.5% |\n| 线上商城自营合计 | 517,934.77 | 531,132.79 | +2.6% |\n\n### 线上商城的「三个层次」（26Q3，**极易混，引用前先看这里**）\n\n- **线上商城营业收入 821,258.10** ＝ 网店渠道 549,620.54 ＋ 门店 194,957.92 ＋ 美团外卖渠道(线上商城内) 76,106.64 ＋ 未知(小红书担保支付) 573.00\n- **线上商城自营 531,132.79** ＝ 营业收入 − 平台券 214,018.67 − 美团外卖渠道 76,106.64 ＝ 网店净额 335,601.87 ＋ 门店 194,957.92 ＋ 未知 573.00\n- **渠道页表上「网店＋门店」530,559.79** ＝ 自营 − 未知 573\n- 08 页（821,258）与 09 页（530,560）差额 **290,698.31** ＝ 券 214,018.67 ＋ 美团外卖渠道 76,106.64 ＋ 未知 573 —— 前两项在渠道页被**平台后台数替换**（抖音核销／美团团购／外卖营业收入），第三项被漏。\n- ⚠️ **渠道页已知 bug**：五渠道列相加 899,152.13 ≠ 表上合计 899,725.13，差 **573**（未知项没进表）。25Q3 正好平（无未知、未开外卖）。\n- 线上商城内「美团外卖渠道」≠ 复盘口径「美团外卖」：前者 76,106.64（线上商城记录的、美团配送的单），后者 86,147.74（美团后台营业收入）。复盘口径用后者替换前者。\n- 口径混用的后果：线上商城口径 Q3 同比 **+19.0%**，全渠道复盘口径 **−7.1%**（方向相反）。\n\n### 两套口径并存（2026-10-03 定）\n\n- **订单量／客单价／线上商城网店-门店拆分只有月会口径有**；**平台后台替换口径只有实收**。\n- 逐月表两列并列：「实收·月会口径」＋「实收·复盘口径」；**订单量与客单价只跟月会口径走**（必须同源，否则客户一核对就穿）。\n- 渠道页主表用复盘口径（结论口径），副表给线上商城网店/门店（标\"可与月报逐项核对\"）。\n- **两口径会给出方向相反的季度结论**（零售品牌 A Q3 月会 −4.0%／复盘 −7.1%）——**不藏，并列展示**。\n- **各月天数不同必须标天数**（客户月会 27／30／31 天混用）。\n- 补数技巧：绝对值可由月报「日均同比」反推；**金额取哪个来源，笔数就用同一个来源**。\n\n## 八、读客户资料的已知坑\n\n- **客户表 `零售品牌 A复盘数据.xlsx`「汇总」sheet 一页装了两张表，读的时候别只读一半**：**左半（第 1—24 列）＝「月度全渠道表」**，结构 `时间|商城|美团|抖音|外卖|汇总`，每个渠道一对「订单／金额」列；**「商城」＝线上商城自营（含门店）**；7 月完整，8／9 月缺商城金额与抖音（合计残缺）。第 41—56 行另有「美团外卖取消率」、第 58—80 行另有「美团团购消费金额／笔数」逐月。**右半（第 27—41 列）＝「年度全渠道表」**（`月维度|年份|项目|1月…12月`）—— 这是**客户口径的全渠道月度唯一基准**（抖音/美团/外卖/线上商城实收 + 合计，2025 与 2026 两张）。2025 年三个月（7·171,918.52／8·318,591.39／9·477,902.65）与统计表 v2 **分毫不差**；2026 年 8 月 = 272,783（抖音 74,256＋美团 9,659＋外卖 33,989＋线上商城 154,879），9 月缺抖音/线上商城故合计残缺（46,829）。**读这张表别只读左半边。** 其余 sheet（对账报告／抖音／美团／外卖／商品-线上商城）全部只到 2026-07。\n- **客户表「线上商城实收」≈ 我们的「线上商城自营」**（线上商城营业收入 − 券 − 美团外卖渠道），2026 年 4—6 月 329,316.99 vs 329,314.19（差 2.80）。\n- **月会文件名是 M+1**：`X 月月会.pdf` 装的是「X−1 月数据复盘 + X 月规划」。做 7—9 月季度复盘要 **8／9／10 月三份**月会。\n- **零售品牌 A周会/月会 PDF 多为图片型（无文本层）**，渲染成图再读，别因 `get_text()` 空就判\"读不了\"。\n- **月会交付早于月底**（9 月月会 9/1 交，数据只到 8/30）→「本月」常是 30 天；看到\"日均\"先确认天数。\n- **同一指标对不上时：先查口径，再查时点，最后才怀疑算错**（零售品牌 A 7 月全渠道 259,301／263,362；8 月环比差 3.2% 因 30/31 天混用）。\n- **`零售品牌 A-工作计划.xlsx` openpyxl 打不开**（非法 fill）→ 直读 zip 里 `xl/sharedStrings.xml` + `xl/worksheets/sheetN.xml`；日期是 Excel 序列号，纪元 `1899-12-30`。新建工作簿用 openpyxl 没问题。\n- **工作计划表式固定**：`任务／状态／开始时间／结束时间／历时·天／备注`，G 列起按天甘特（第 3 行日期、第 4 行星期）。\n- **`.xls` 与 `.xlsx` 走同一套 sheet 工具**；`.pdf` 不在 editor_sdk 范围（图片型 PDF 用 `sips -s format png` 整页渲染后 Read）。\n- **零售品牌 A成本卡 PDF（`~/Desktop/零售品牌 A/零售品牌 A成本卡.pdf`）一个产品跨两页**：前页放配方明细，后页放配送费/成本合计/毛利/定价，**标签与其数值常不在同一页** → 用 `pdftotext -layout` 或按页解析都会错位，必须**按「产品名称」全局分段**（脚本 `04-复盘/_parse_costcard.py`）。字段值都在标签右侧约 200pt 处；**配送费字段恒为 0**，成本卡不含外卖配送成本。\n- **editor_sdk 读表两个坑**：① 表格 cells 的 `text_preview` 恒被截断，要用表节点 `start_index` 调 `doc_get_table_info` 取全文字；② 参数统一用 `--json '{\"sheet_id\":\"000001\"}'`（key=value 会把 `000001` 当数字 1）；③ `open_file` 后隔 1–2 秒再读。\n- **消费品牌 C月份标签未核清**（2026-09-24 标出）：客户信息表自标 6/7/8 月，客户资料 docx 把同组数标成 05/06/07；`8月工资表.xls` 文件名 8 月、表内标题「7 月工资表」。**核清前引用消费品牌 C月份数据必须标注用了哪套标签，不做跨月加减。**\n- **消费品牌 C必须先分「储值充值」与「实收」**：储值是预收（负债）。财报「堂食代金券/免单」两月均 0，与\"代金券以储值核销\"说法需对齐。**净利率对不上先查科目符号**（8 月差 12,756＝2×营业外支出 6,378）。**会员诊断 docx 内部两处口径打架**（消费会员 1,667 vs 1,372；近 1 年已购 10,366 vs 1,667），引用会员数前先确认口径。\n\n### ⛔ 数据作业三禁令（2026-10-11 立，最高优先级；详见 `_数据口径与交付规范.md` 第四部分）\n\n起因：零售品牌 A Q3 复盘 08／09 两页把「线上商城营业收入」当全渠道实收（7 月同比写成 +135.4%，实为 +50.8%；8 月方向写反），被质疑三轮、前两轮都答「数据是准的」。\n\n1. **只认 L0 原始凭证当基准**（后台截图／客户原始导出列）。我方做的中间表（如 `零售品牌 A_4-9月经营数据统计_v2.xlsx`）是加工品，**会封装错误**，不能当基准。\n2. **禁止同级互核、禁止自我循环验证**。PPT ↔ 我做的表 逐格一致，只能证明**转录对**，不能证明**口径对**；同源 ≠ 正确。\n3. **落稿前必跑三断言**：① 这格的口径**名字**是什么 ② **自证断言**（单渠道 ≤ 全渠道？分项和 = 合计？）③ **方向断言**（换正确口径，同比方向会不会反过来）。\n4. 被问\"准不准\"时**先反问**：核数字还是核口径？回答必须分「转录／口径／覆盖」三层，**禁止只答转录一致就说\"准\"**。\n5. **核不了的项必须显式申报**，沉默跳过＝默认没问题，是最危险的失败模式。\n\n## 九、复盘口径偏好（Mirror 明确过）\n\n- 数据页**优先用同比**（去年同月、同口径），不用\"提案前\"这类模糊基线。\n- **门店类同比使用前先确认期内形态/面积是否变过**；变过则单列，不混进\"经营变差\"叙事。\n- **日历错位节点**（中秋/春节）按\"节点前 N 天＋当天\"对齐，并单独考虑两年的**上架日差异**。\n- 命题式收束语必须配得上落地措施；**没有落地措施的\"下一季要怎样\"等于没写**。\n- 客户内部管理类问题（如研发责任归属）：**只讲现象和影响，不给落地机制**。\n\n## 十、私域／会员测试读数规则（2026-10-06）\n\n- **分母先换掉**：个微/社群/朋友圈无广播能力，\"触达 N 人\"≠N 人看到 → 分母必须是实际曝光人数。\n- **必须有对照组**（同分层留 10–20% 不发）；没对照只能读\"量\"，读不出\"增量\"。\n- **券面与门店价格体系对表**：先查该客户各渠道实际折扣，别让券比客人已买到的最低价还贵。\n- **钩子选客人本来就会点的品类**（先看品类占比再定钩子）。\n- **时点避开大假**，在周一到周四淡日跑。\n- **人群优先存量**（有消费记录、未彻底走的人），先分层再触达。\n- **储值余额是最短激活路径**，永远排在拉新之前。\n\n## 十一、月度计划编排偏好（2026-09-21 Mirror 微调版教我的）\n\n1. **收口往前压**：节点结束后的事压进\"节点后第一个完整周\"内收完，不占新月资源。\n2. **上架日从节点日倒推**，不是从准备完成日往后排（万圣 10/31 → 10/24 上架，留 7 天窗口）。\n3. **月度表只装\"本月能做完、能看见结果\"的事**；方法论/基建型任务（归因埋点、搜索占位、验收口径、注册入口）放复盘/年度规划。\n4. **动作写到\"发什么、送几个、什么价\"**，一线拿着能直接排队。\n5. **人群口径要收紧**（\"礼盒购买用户\" → \"大客户（5 盒以上）\"）。\n6. **\"重复打扰\"按人群是否重叠判断**，不按当月批次数。\n7. **板块按\"谁执行\"分**，不按方法论分组（板块名匹配客户组织分工）。\n8. **先诊断、先培训，再调配置、再投钱**。\n9. **每行备注带可数验收**（3 天清完、送 3 个、报价 100 以下），避免\"恶化即调整\"。\n\n## 十二、硬约束（客户交付物里不出现）\n\n- 不替老板拍板目标数字、奖金金额、定价结论——**只给方法、参考系数、演算示例**。\n- 不用补单、霸王餐、诱导删评、私下退款规避平台等高风险方法。\n- 单渠道数据不外推全渠道；应收/实收/GMV 不混用。\n- 每条建议必须带**责任人 / 验证指标 / 验证周期**，缺验证视为未完成。\n- 对外发送前必须获得 Mirror 明确授权。\n\n## 十三、已识别的主要问题（详见 `_优化建议.md`）\n\nP0：数据表汇总口径自相矛盾、投放无归因、研发延期是重复问题。\nP1：渠道角色未固化、完成率用项数口径、缺过程-结果因果链页、活动费用无单位获客成本、老板问卷结果未回流。\nP2：文件归档混乱、档案与工作区分家、数据采集手工重复、缺内部承接力检查表。\n\n## 十四、活动连带消费诊断口径（2026-11-10 立，最高优先级）\n\n**★ ROI 闸门**：算净额／每卡净赚／ROI **之前**，必须逐卡跟 Mirror 对清楚权益内容——附赠产品名称、规格尺寸、每卡份数、单份成本（或售价）、是否可折现、有效期。不同卡项附赠不同，**严禁用统一「每份 29 元」估算**（2026-11 零售品牌 A复盘据此写出的「每张净赚 24／112 元、净亏 35 元」已全部作废）。未确认前：净额、每卡净赚、ROI、成本上限、「该不该继续做」定论一律挂起，页面写「待确认」；可先给不依赖成本的确定数。公式：`净额 = 卡收入 +（卡后实收−卡前实收）×毛利率 − 兑换笔数×该卡单份成本`。**毛利率 ≠ 权益成本**。\n\n**卡池与时间**：卡池只认发卡表（L0），不从订单金额倒推（倒推 1,023 vs 发卡 1,000，多出的是付了钱没发卡）；T0＝每人自己的领卡日，前后等长 90 天；剔卡本单；`实收=0 且 订单金额=0` 才算兑换；剔单笔 ≥2,000 元团购单；申报手机号缺失（约 50%，卡后消费只会低估）；每个百分比带分母，不用含义不明的箭头；结论必须配对照组或同期大盘，否则只读「量」读不出「增量」。\n\n**呈现偏好**：① 复盘页收尾默认给**总结性判断**，不写具体动作；动作／责任人／验证指标／验证周期只在 Mirror 明确要求时另起一节。② H5 用**宽屏多栏（约 1200px）**，不做 480px 手机长图（1:10.7 太竖长）；宽屏版约 1:3.2。\n\n**可复用产物**：专家包【活动连带消费诊断专家】已注册在 `~/.workbuddy/plugins/marketplaces/my-experts/plugins/campaign-linked-spend-diagnosis/`，技能入口软链 `~/.workbuddy/skills/campaign-linked-spend-diagnosis`（单一唯一基准）；zip 已上传资料库 https://www.workbuddy.cn/space/d/tAAr6f9Gk6zVFzYrj7cGNW （节点默认私有，别人需下载后各自安装，资料库不提供一键安装）。\n",
  "s37": "# 运营中台运营中台｜知识库 × 数据库 × AI 中心蓝图\n\n> 源自：`运营中台运营中台.png`（个人记录迁移）及 2025 年终 / 2026 年中复盘「共建公司运营大脑」主线。\n> 关联房间：工作（客户档案与口径规范） · 工具（运营中台工具台 `u3` / 营销情报库 `u8` / 专项诊断技能） · 我自己（把方法工程化成 Agent 能力 `k4`）\n\n---\n\n## 一、 核心定位：为什么要建「运营中台」\n\n在 2025 年终与 2026 年中复盘中明确提出：咨询顾问的个人经验如果只停留在脑子里或散落的 PPT 里，每次换客户、换行业或带新人就要重造轮子。打造公司级「运营大脑（运营中台）」的目标，是将**非标咨询经验结构化为可复用的知识资产、可对比的行业基准数、以及可自动执行的 AI Bot 矩阵**。\n\n---\n\n## 二、 三大核心模块拆解（对应导图原件）\n\n### 模块一：知识库（沉淀「怎么判、怎么做」）\n1. **客户档案**\n   - **内容**：全量在服与历史客户的完整档案（基本面、阶段动作与量化结果、核心问题事实链、待核实口径与待办）。\n   - **宫殿落地**：已升级为《客户档案·更新流程说明》（6 步更新法 + 4 条写作铁律）及零售品牌 A、消费品牌 C、连锁品牌 B标准客户档案（`w1`–`w4`、`w11`）。\n2. **案例档案**\n   - **内容**：跨品牌、跨周期的成功与失败操盘样本（如区域品牌 D老化品牌收缩止损、连锁品牌 B首期 12 个月 1025 万复盘、新锐品牌 E线上起盘、跨界项目F 跨行业餐+练开业）。\n   - **宫殿落地**：对应 `w10`（区域品牌 D判断句与数据锚点）与 `w13`（历史主责项目方法论沉淀）。\n3. **产品库**\n   - **内容**：烘焙/甜品/餐饮行业爆品档案、1261 产品结构矩阵、四寸/六寸规格趋势、现烤 vs 甜水毛利与报损特征。\n4. **方法与工具库**\n   - **内容**：九宫格经营诊断体系、六大战略引擎、月度规划、大活动连带消费诊断、价格带×毛利测算等标准化 SOP。\n   - **宫殿落地**：已工程化为 22 个本地 Skill 技能包（`sk01`–`sk23`、`u10`、`u14`–`u16`）。\n\n---\n\n### 模块二：数据库（沉淀「行业水位与财务底盘」）\n1. **基准数据指标体系**\n   - **内容**：烘焙与餐饮各渠道关键基准值（如小程序访问-支付转化率基准、美团外卖/开店宝转化率水位、新客 30 天复购率基准、储值首充与二充比例、抖音核销率水位）。\n   - **作用**：避免只看单一客户环比，提供「同业横向坐标系」。\n2. **财务报表库**\n   - **内容**：客户月度损益表清洗入库，核心追踪 **FLR（房租 + 人力 + 食材成本占实收比）**、各渠道扣点后净贡献、报损率（如区域品牌 D一店 76% vs 四店 106% 的关店生死线判断）。\n   - **宫殿落地**：对应 `_数据口径与交付规范.md`（应收/实收/GMV/成交金额五词锁死、财务自洽闭环检查）。\n\n---\n\n### 模块三：AI 中心（五大 Bot 矩阵，把方法变成自动化生产力）\n1. **知识库 Bot**\n   - 自动检索历史客户档案、同业案例与方法论，辅助新项目冷启动与提案框架生成。\n2. **数据 Bot**\n   - 自动清洗线上商城、美团、抖音、CRM 系统导出表，校验表间口径冲突，生成标准化周/月报图表（对应商品诊断 `sk01`、单店模型与会员诊断 Coze 模块 `u3`）。\n3. **任务 Bot**\n   - 对齐周/月度工作计划、研发上新倒排表（`T-30 / T-14 / T-7`）与责任人追踪，防止动作断档（对应周报回溯 `k5`/`k6` 与 `_优化建议.md`）。\n4. **质检 Bot**\n   - 交付物出街前自动过筛：检查数据口径混用、缺少「过程→结果因果链」、缺少「认知差对比页」、PPT 版式违规（对应 `w6`、`w7`、`sk14`）。\n5. **行业情报 Bot**\n   - 持续抓取竞品上新、价格带变动、大促动作与社媒爆款（对应营销情报库 `u8`、餐饮品牌动作雷达 `u8`、小红书/抖音筛号 `sk03`/`u19`）。\n",
