<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的思维宫殿 · 回来先走一遍</title>
<style>
:root{
  --paper:#F7F4ED; --card:#FFFDF8; --ink:#2B2A26; --muted:#6E6A60;
  --line:#DED7C8; --line-soft:#EAE4D8; --accent:#A6632A; --accent-soft:#F1E5D4;
  --gold:#B98A46; --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--accent);text-decoration:none}
.serif{font-family:var(--serif)}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}

header{position:sticky;top:0;z-index:20;background:rgba(247,244,237,.94);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:.06em;margin:0;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
.head-tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.mode button{padding:5px 14px;border-radius:999px;font-size:12px;color:var(--muted);transition:.2s}
.mode button.on{background:var(--ink);color:#FDFBF5}
.tool-btn{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12px;background:var(--card);transition:.2s}
.tool-btn:hover{border-color:var(--accent);color:var(--accent)}

main{padding-bottom:100px}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* foyer */
.foyer{padding:76px 0 44px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);margin-bottom:22px}
.foyer h2{font-family:var(--serif);font-size:clamp(34px,5vw,54px);font-weight:500;letter-spacing:.05em;margin:0 0 18px}
.foyer p.intro{font-size:14px;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.9}
.steps{display:flex;justify-content:center;gap:0;margin:48px auto 0;max-width:820px;flex-wrap:wrap}
.step{flex:1;min-width:190px;background:var(--card);border:1px solid var(--line);padding:20px 22px;text-align:left;position:relative;transition:.25s}
.step:first-child{border-radius:10px 0 0 10px}
.step:last-child{border-radius:0 10px 10px 0}
.step+.step{border-left:0}
.step:hover{background:#FBF5EA;border-color:var(--gold)}
.step .no{font-family:var(--serif);font-size:22px;color:var(--gold);display:block;margin-bottom:6px}
.step strong{font-size:14px;font-weight:500;display:block}
.step small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.wander-note{font-size:13px;color:var(--muted);margin:44px auto 0;max-width:520px;line-height:1.9}

.floor-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:64px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.floor-head h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0}
.floor-head span{font-size:12px;color:var(--muted)}
.floor{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.door{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 20px 20px;text-align:left;min-height:186px;display:flex;flex-direction:column;position:relative;transition:.25s;overflow:hidden}
.door::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:0;transition:.25s}
.door:hover{transform:translateY(-3px);border-color:var(--gold)}
.door:hover::before{opacity:1}
.door .symbol{font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1;margin-bottom:16px}
.door h4{font-family:var(--serif);font-size:18px;font-weight:500;margin:0 0 8px}
.door p{font-size:12px;color:var(--muted);margin:0;line-height:1.75;flex:1}
.door .count{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-top:14px}
.door .enter{font-size:11px;color:var(--muted);margin-top:4px}

/* room */
.crumb{font-size:12px;color:var(--muted);padding:30px 0 0}
.crumb button{color:var(--accent);font-size:12px;padding:0}
.room-head{padding:26px 0 34px;border-bottom:1px solid var(--line)}
.room-head .no{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:.14em}
.room-head h2{font-family:var(--serif);font-size:clamp(30px,4vw,42px);font-weight:500;margin:10px 0 12px;letter-spacing:.04em}
.room-head p{font-size:14px;color:var(--muted);margin:0;max-width:700px;line-height:1.9}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.obj{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 20px 18px;text-align:left;min-height:158px;display:flex;flex-direction:column;transition:.25s;position:relative}
.obj:hover{transform:translateY(-3px);border-color:var(--gold)}
.obj .kind{font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:12px}
.obj h4{font-family:var(--serif);font-size:16px;font-weight:500;margin:0 0 8px;line-height:1.5}
.obj p{font-size:12px;color:var(--muted);margin:0;line-height:1.75;flex:1}
.obj .foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#9A9487;margin-top:14px;border-top:1px solid var(--line-soft);padding-top:10px}
.obj.note{background:#FBF4E7;border-color:#E6D7BC}
.obj.drawer{background:#F3F1EA;border-style:dashed}
.obj.card{background:#FFFDF8}
.obj.highlight{box-shadow:inset 0 0 0 1px var(--gold);border-color:var(--gold)}
.empty-note{font-size:13px;color:var(--muted);padding:40px 0}

/* detail drawer */
.mask{position:fixed;inset:0;background:rgba(43,42,38,.22);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.detail{position:fixed;right:0;top:0;bottom:0;width:min(480px,92vw);background:var(--card);border-left:1px solid var(--line);z-index:50;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:36px 34px 60px}
.detail.on{transform:none}
.detail .close{position:absolute;right:24px;top:22px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.detail .close:hover{color:var(--accent);border-color:var(--accent)}
.detail .kind{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:14px}
.detail h2{font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.45;margin:0 0 20px}
.detail .line{font-family:var(--serif);font-size:17px;line-height:1.9;padding:18px 20px;background:var(--accent-soft);border-left:2px solid var(--gold);margin:0 0 24px}
.detail h5{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:26px 0 10px;font-weight:500}
.detail p.body{font-size:13px;line-height:1.9;margin:0}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.detail .path{font-size:11px;color:var(--accent);word-break:break-all;line-height:1.7;display:block;text-align:left;padding:12px 14px;background:#F7F4ED;border-radius:8px;border:1px solid var(--line-soft)}
.detail .path:hover{border-color:var(--accent)}
.detail .path{display:block;text-decoration:none}
.detail .path-box{display:flex;flex-direction:column;gap:8px}
.detail .copy-path{align-self:flex-start;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.detail .copy-path:hover{color:var(--accent);border-color:var(--accent)}
.detail .hint{font-size:11px;color:var(--muted);line-height:1.8;margin-top:9px}
.detail .src-desc{color:var(--ink)}
.detail .excerpt{font-size:12px;line-height:1.9;background:#F7F4ED;border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;max-height:300px;overflow-y:auto}
.mode-note{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 22px;padding-left:12px;border-left:2px solid var(--gold)}
.catalog td.path a{color:var(--accent);text-decoration:none}
.catalog td.path a:hover{text-decoration:underline}
.catalog .srcdesc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
/* 卡片全景（散步模式） */
.pano-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:52px 0 8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pano-top h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0}
.pano-top span{font-size:12px;color:var(--muted)}
.pano{margin:42px 0 0;scroll-margin-top:80px}
.pano-head{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.pano-no{font-size:22px;color:var(--gold);line-height:1}
.pano-head h3{font-family:var(--serif);font-size:19px;font-weight:500;margin:0}
.pano-head p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.7}
.pano-count{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pano-shelf{grid-template-columns:repeat(3,1fr)}
.pano-foot{font-size:11px;color:var(--muted);margin:30px 0 0;line-height:1.8}
/* 全文入口 */
.src-full{display:block;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line-soft);border-radius:8px;padding:11px 14px;text-decoration:none}
.src-full:hover{border-color:var(--accent)}
.fulltext{margin:2px 0 0}
.fulltext summary{font-size:12px;color:var(--muted);cursor:pointer;padding:8px 2px;list-style:none}
.fulltext summary::-webkit-details-marker{display:none}
.fulltext summary::before{content:"▸ ";color:var(--gold)}
.fulltext[open] summary::before{content:"▾ "}
.fulltext pre{font:11px/1.85 ui-monospace,Menlo,"PingFang SC",monospace;white-space:pre-wrap;word-break:break-word;background:#F7F4ED;border:1px solid var(--line-soft);border-radius:8px;padding:16px;max-height:420px;overflow:auto;margin:8px 0 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
.mtime{font-size:11px;color:var(--muted);line-height:1.8;margin:6px 0 0}
.catalog .src-link{color:var(--accent)}
/* 更新机制 */
.updater{margin:64px 0 20px;border-top:1px solid var(--line);padding-top:22px}
.updater summary{cursor:pointer;font-size:13px;color:var(--ink);list-style:none;display:flex;align-items:baseline;gap:10px}
.updater summary::-webkit-details-marker{display:none}
.updater summary::before{content:"✦";color:var(--gold)}
.updater summary span{font-size:11px;color:var(--muted)}
.updater-body{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 26px;margin-top:16px;font-size:12px;line-height:1.9;color:var(--ink)}
.updater-body h4{font-size:12px;letter-spacing:.08em;color:var(--gold);margin:20px 0 8px;font-weight:500}
.updater-body h4:first-of-type{margin-top:0}
.updater-body ol,.updater-body ul{margin:0;padding-left:20px}
.updater-body li{margin:4px 0}
.updater-body .build-line{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line-soft);padding-bottom:14px;margin:0 0 18px}
.updater-body code{font:11px ui-monospace,Menlo,monospace;background:#F7F4ED;padding:2px 6px;border-radius:4px}
@media(max-width:980px){.pano-shelf{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.pano-shelf{grid-template-columns:1fr}}
.also{font-size:12px;color:var(--muted);margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}
.also button{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* catalog */
.catalog{position:fixed;inset:0;background:rgba(247,244,237,.97);z-index:60;display:none;overflow-y:auto;padding:44px 32px 80px}
.catalog.on{display:block}
.catalog-inner{max-width:1080px;margin:0 auto}
.catalog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}
.catalog-head h2{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 8px}
.catalog-head p{font-size:12px;color:var(--muted);margin:0;max-width:620px;line-height:1.8}
.catalog-tools{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.catalog-tools input{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink);outline:none}
.catalog-tools input:focus{border-color:var(--gold)}
.catalog-tools button{border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:12px;background:var(--card)}
.catalog-tools button:hover{border-color:var(--accent);color:var(--accent)}
.catalog table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.catalog th{text-align:left;font-weight:500;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.catalog td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.65}
.catalog td.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--accent);word-break:break-all;max-width:300px}
.catalog tr:hover td{background:#FBF7EE}
.catalog .stat{font-size:12px;color:var(--muted);margin-top:16px}

footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:11px;color:var(--muted);line-height:1.9}

@media(max-width:980px){.floor{grid-template-columns:repeat(2,1fr)}.shelf{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.wrap{padding:0 18px}.head{height:auto;padding:12px 0;flex-wrap:wrap}.brand span{display:none}.floor,.shelf{grid-template-columns:1fr}.step{min-width:100%;border-radius:10px!important;border-left:1px solid var(--line)!important}.step+.step{border-top:0}.foyer{padding:46px 0 24px}.catalog{padding:28px 16px 60px}.catalog td.path{display:none}}
.cat-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 2px;padding-top:20px;border-top:1px dashed var(--line)}
.cat-head h3{margin:0;font:500 17px/1.4 Georgia,"Songti SC",serif;color:var(--ink)}
.cat-head span{font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pipe-badge{display:inline-block;font-size:10px;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);border:1px solid #E4D2B8;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.next-badge{display:inline-block;font-size:10px;letter-spacing:.06em;color:#8C3D2B;background:#FBE9E4;border:1px solid #E8C5BC;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.chip{cursor:pointer;transition:.2s}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.filter-bar{display:flex;align-items:center;gap:10px;margin:18px 0 0;justify-content:center;flex-wrap:wrap}
.filter-bar input{width:min(360px,82vw);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12px;color:var(--ink);outline:none;transition:.2s}
.filter-bar input:focus{border-color:var(--gold)}
.filter-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:4px 12px}
.cat-title-btn{text-align:left;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;transition:.2s}
.cat-title-btn:hover{color:var(--accent);text-decoration-color:var(--accent)}

/* ===== 宫殿 2.0 ===== */
.floorplan{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);overflow-x:auto;max-width:100%}
.floorplan button{padding:5px 11px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;transition:.2s}
.floorplan button:hover{color:var(--accent)}
.floorplan button.on{background:var(--accent-soft);color:var(--accent)}
@media(max-width:1240px){.brand span{display:none}}
@media(max-width:1020px){.head{flex-wrap:wrap;height:auto;padding:10px 0}.floorplan{order:3;width:100%}}
/* 四种物件 */
.obj.highlight{box-shadow:none;outline:1px solid var(--gold);outline-offset:-1px}
.obj.book{padding-left:28px}
.obj.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:10px 0 0 10px;background:linear-gradient(90deg,#E9DCC2 0 3px,transparent 3px 5px,#E9DCC2 5px 6px,transparent 6px);border-right:1px solid var(--line-soft)}
.obj.card::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:2px;background:var(--ink);opacity:.72}
.obj.card h4{font-size:17px}
.obj.note{background:#FBF4E7;border-color:#E6D7BC}
.obj.note::after{content:"";position:absolute;top:-1px;right:-1px;width:24px;height:24px;background:linear-gradient(225deg,var(--paper) 50%,#E9D8B8 50%);border-bottom-left-radius:5px}
.obj.drawer,.obj.drawer.highlight{border-style:solid;background:#F3F0E7;box-shadow:0 4px 0 -1px #EEEAE0,0 4px 0 0 var(--line),0 8px 0 -1px #E9E4D8,0 8px 0 0 var(--line-soft);margin-bottom:8px}
.obj.drawer::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.obj.drawer .kind{margin-top:6px}
.obj .todo{display:block;margin:12px 0 0;padding:8px 10px;background:rgba(255,255,255,.6);border:1px dashed #E2CFAE;border-radius:6px;font-size:11px;color:#7A5A2E;line-height:1.6}
.obj .todo span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
/* 关联共振 */
.obj.rel-source{border-color:var(--gold);transform:translateY(-3px)}
.obj.resonate{outline:2px solid var(--gold);outline-offset:-2px;background:#FBF3E2}
.resonating .obj:not(.resonate):not(.rel-source){opacity:.45}
/* 分组头 */
.cat-head em{font-style:normal;font-size:11px;color:var(--muted);margin-left:auto}
/* 流水线轨道 */
.track{display:flex;align-items:stretch;overflow-x:auto;padding:30px 2px 16px;scroll-snap-type:x proximity}
.track .obj{flex:0 0 252px;scroll-snap-align:start}
.track .arrow{flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-size:18px}
.track-side{margin-top:6px;padding-top:10px;border-top:1px dotted var(--line)}
.track-side .side-label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.track-side .shelf{margin-top:14px}
/* 抽屉：极简两段式（1. 主要内容≤500字  2. 跳转链接与文件路径） */
.detail{width:min(580px,94vw)}
.detail-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}
.detail-sec-title{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.detail-sec-title span{font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.summary-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.summary-lead{font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.75;margin:0 0 12px;padding-bottom:10px;border-bottom:1px dashed var(--line-soft)}
.summary-points{margin:0;padding-left:18px;font-size:13.5px;line-height:1.85;color:var(--ink)}
.summary-points li{margin:6px 0}
.summary-p{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.todo-box{background:#FBF1E6;border-left:3px solid #C0703A;border-radius:0 8px 8px 0;padding:12px 16px;font-size:13px;line-height:1.85;margin-top:12px}
.todo-box strong{display:block;font-size:12px;color:#9A5220;margin-bottom:4px}
.links-box{background:#F4F0E6;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}

  { id:'w14', cat:'client', room:'work', kind:'book', title:'历任主责项目方法论沉淀｜品牌D · 品牌E · 跨界项目F · 连锁项目G',
    line:'两年半四类操盘范式：老化品牌外科手术止损（区域品牌 D）、新锐线上起盘（新锐品牌 E）、跨行业餐+练破界（跨界项目F）、多店连开检核（连锁品牌 G）。',
    body:'汇编自 2024–2026 共 7 份个人复盘与工作记录：① 区域品牌 D：测算四店 FLR（76%–106%），砍高亏店与高损现烤线、推 9.9 元甜水卡（75% 复购）与大蛋糕（+10%），合作期末亏损收窄 75%；② 新锐品牌 E：公域种草→美团点评评价维护→私域承接闭环；③ 某跨界餐练项目F：两店开业实现 63% 消餐转化，沉淀「底层方法可迁移，但行业地形（预售与狼性销售管理）不可跳过」；④ 某多店烘焙G三店连开：沉淀《新店开业前置检核表》与「方案成功 = 能力 × 态度 × 执行」。',
    path:'~/MindPalace/vault/个人复盘与成长记录/运营中台两年半成长脉络与历任主责项目复盘汇编.md', updated:'2024.06 → 2026.10', tags:['案例资产','历史项目','方法论'], also:['w10','s8'], nature:'存续性工作' },
  { id:'w5', cat:'standard', room:'work', kind:'card', title:'数据防错三禁令｜同源 ≠ 正确',
    line:'只认 L0 原始凭证当基准；禁止同级互核、禁止自我循环验证；落稿前跑口径名 / 自证 / 方向三断言。',
    body:'起因是 Q3 复盘把「线上商城营业收入」当全渠道，7 月同比写成 +135.4%（实为 +50.8%），被质疑三轮、前两轮都答「数据是准的」。此后被问「准不准」先反问核数字还是核口径，回答分转录 / 口径 / 覆盖三层；核不了的项必须显式申报。完整字段级字典见《_数据口径与交付规范.md》。',
    path:'~/MindPalace/vault/工作规范与中台/_数据口径与交付规范.md', updated:'2026-10-11 · 最高优先级', tags:['判断标准','事故促成','口径'], also:['w6','k6'], nature:'存续性工作' },
  { id:'w6', cat:'standard', room:'work', kind:'card', title:'全渠道口径｜口径混用会让同比方向反过来',
    line:'线上商城后台的「营业收入」里本来就装着外部渠道，当全渠道用＝把外部渠道算两遍＋虚增同比；五词（应收/实收/GMV/成交/核销）严禁混用。',
    body:'正确全渠道 ＝（线上商城网店+门店+未知 − 抖音券支付 − 美团点评券支付）＋ 三个外部渠道后台实收。同一指标对不上时：先查口径，再查时点（如 30 天 vs 31 天日均），最后才怀疑算错。取数列、白名单公式、sheet 名这些细则完整收录于《_数据口径与交付规范.md》。',
    path:'~/MindPalace/vault/工作规范与中台/_数据口径与交付规范.md', updated:'2026-10-11', tags:['判断标准','口径'], also:['w5'], nature:'存续性工作' },
  { id:'w7', cat:'standard', room:'work', kind:'card', title:'复盘与月计划的编排偏好',
    line:'数据页优先同比、不用模糊基线；命题式收束必须配得上落地措施，没有落地措施的「下一季要怎样」等于没写。',
    body:'月度表只装本月能做完能看见结果的事；上架日从节点日倒推；板块按谁执行分，不按方法论分组；动作写到「发什么、送几个、什么价」，每行备注带可数验收。客户内部管理问题只讲现象和影响，不给落地机制。',
    path:'~/MindPalace/vault/工作规范与中台/_工作区总纲.md', updated:'持续', tags:['方法口径','编排'], also:['w13'], nature:'存续性工作' },
  { id:'w8', cat:'standard', room:'work', kind:'card', title:'活动连带消费诊断｜ROI 闸门',
    line:'算净额 / 每卡净赚 / ROI 之前，必须逐卡对清附赠产品、规格、份数、单份成本；严禁用统一单价估算。',
    body:'2026-11 零售品牌 A复盘据此写出的「每张净赚 24／112 元、净亏 35 元」整版作废。未确认前净额、ROI、「该不该继续做」一律挂起，页面写「待确认」；结论必须配对照组或同期大盘，否则只读「量」读不出「增量」。已固化成专家包（u10）。',
    path:'~/MindPalace/vault/工作规范与中台/工作区_MEMORY.md', updated:'2026-11-10 · 最高优先级', tags:['判断标准','ROI'], also:['u10'], nature:'存续性工作' },
  { id:'w10', cat:'standard', room:'work', kind:'drawer', title:'同业复盘样本库｜标杆案例判断句与盈利生死线',
    line:'新交付物深度不应低于区域品牌 D复盘；小店结构性亏损靠点状动作救不回来，真正动账只有三刀：砍品类、砍 FLR>100% 门店、换产品结构。',
    body:'标尺是门店财务拆解（一店 FLR 76%、二店 90%、三店 105%、四店 106% → 算出来 105%/106% 的两家店半年后真被客户关了）、现烤面包销量腰斩（−46%）证伪、报损率（占实收 12%）与用户体验地图。本卡直接挂载 2026-09-18 核定的《区域品牌 D判断句与数据锚点》。',
    path:'~/MindPalace/vault/职业规划推演/2026-09-18_区域品牌 D_判断句与数据锚点.md', updated:'2026-09-18 核定', tags:['颗粒度','样本','样本标尺'], also:['w14','w9'], nature:'存续性工作' },
  { id:'w12', cat:'standard', room:'work', kind:'book', title:'客户档案更新流程与四条写作铁律',
    line:'6 步标准更新法 + 4 条铁律：严格区分「提案建议」与「已确认事实」、同类信源取最新、问题锚定硬事实链、内部管理归因不入核心根因。',
    body:'2026-10-16 建档、11-13 迭代的跨客户档案准则：① 提案/规划类文档只作背景，一律加「提案建议：」前缀，绝不写进已执行动作；② 周会 < 月会 < 专项复盘，同类取最新，口径冲突显式列入第四章存疑表；③ 核心问题必须锚定「门店面积缩减 → 承接力下降 → 品类迁移」这类可验证硬事实链，不把店员积极性或老板精力写进根因。',
    path:'~/MindPalace/vault/客户档案/客户档案·更新流程说明.md', updated:'2026-11-13', tags:['判断标准','客户档案','写作铁律'], also:['w1','w2','w3','w4'], nature:'存续性工作' },
  { id:'w13', cat:'standard', room:'work', kind:'book', title:'复盘与交付进化 14 条建议｜研发倒排 · 渠道角色 · 因果链 · 认知差',
    line:'从 A、B、C 三个代表性客户案交叉提炼的 P0–P2 进化清单：解决新品延误断货、团购吸走外卖存量、过程与结果脱节、客户承接力不足四大高频痛点。',
    body:'核心硬机制：① 研发上新倒排表（按 T-30 立项定品 / T-14 包材成本卡 / T-7 门店培训卡死，防连锁品牌 B黑森林、零售品牌 A七夕新品断货重演）；② 渠道角色定位卡（美团外卖 vs 团购 vs 抖音，核清是纯增量还是存量转移）；③ 复盘必配「过程指标→结果指标因果链页」与「客户主观感受 vs 数据事实认知差页」；④ 方案落地前必过「内部承接力检查表」与「1-10 → 10-100 跃迁判断清单」。',
    path:'~/MindPalace/vault/工作规范与中台/_优化建议.md', updated:'2026-11', tags:['判断标准','机制进化','14条建议'], also:['w7','sk15'], nature:'存续性工作' },
  { id:'w16', cat:'mech', room:'work', kind:'book', title:'品牌全周期交付流水线｜诊断 → 规划 → 交付 → 复盘',
    line:'工作房只留这一张总控卡：什么阶段调哪个技能。10 步主线与 2 条支线的技能实体统一住在工具房「商业交付流水线」。',
    body:'主线：01 品牌诊断（sk06）→ 02 九宫格→六引擎（u14）→ 03 规划总闸门（sk07）→ 04 四季约束（sk09）→ 05 当月节点倒推（sk10）→ 06 30–50 项月计划（sk11）→ 07 五渠道动作配验收（sk12）→ 08 H5 / 甘特图渲染（sk13）→ 09 交付 PPT 版式（sk14）→ 10 周期 / 活动复盘（sk15）。支线：合作起点的全案提案（sk16）、大促五阶段排期（u15）。只用于蛋糕 / 甜品品牌；版式归版式、口径归口径（见 w9、w6）。',
    path:'~/MindPalace/skills/技能路由表.md', updated:'2026-11-14 · 结构调整', tags:['机制','流水线','交付流水线'], also:['sk06','u14','sk07','sk09','sk10','sk11','sk12','sk13','sk14','sk15','sk16','u15','w9'], nature:'存续性工作' },
  { id:'w9', cat:'mech', room:'work', kind:'book', title:'知识沉淀机制｜交付物 → 技能包 → 索引库',
    line:'内容先定稿 → cake-ppt-layout 定版式 → 出文件；客户交付 PPT 不允许自选模板；最终唯一基准在云端，同一 node-id 原子替换、链接不变。',
    body:'客户交付固定四件套（PPTX + 导出 PDF + 预览 PNG + 可重跑脚本），历史版本进 _archive 不删。本地 _build_*.py 只是生成工具。这条是「方法工程化」在交付侧的落点。',

  { id:'w11', cat:'mech', room:'work', kind:'drawer', title:'周报 / 月报固定机制｜口径细则沉在这一层',
    line:'周期、渠道、分门店、TOP10 商品、必截图、增长标记，规则经一期验证后写死，不每轮重新推导。',
    body:'长期在跑的是机制，不是某一份报表。平台改称、增长标记写法、分渠道字段取舍这类细则属于这一格的附属约定，写进《_数据口径与交付规范.md》即可——它们不是判断，也不单独占一张卡片。',

  { id:'w15', cat:'mech', room:'work', kind:'book', title:'运营中台蓝图｜知识库 × 数据库 × 五大 AI Bot',
    line:'将个人咨询经验结构化为公司级「运营大脑」：四库知识库（客户/案例/产品/方法）+ 双底层数据库（行业基准/财报 FLR）+ 五大 AI Bot。',
    body:'源自《运营中台运营中台.png》与 2025/2026 复盘「共建」主线：知识库 Bot（检索档案与案例）、数据 Bot（自动清洗线上商城/美团/抖音/CRM 系统并做口径断言）、任务 Bot（盯周报与研发倒排）、质检 Bot（出街前查因果链与版式）、行业情报 Bot（对应营销情报库 u8 与达人筛号 sk03/u19）。',

  { id:'k1', cat:'career', room:'self', kind:'card', title:'职业方向｜厌倦的是失控感，不是出卖时间',
    line:'9/15 拆解咨询能力四种资产形态，9/17 倾诉迷茫，9/18 追问修正：真变量是「雇佣 vs 拥有」的结构，不是兴趣领域；判断标准换成有没有股权、署名、能拍板的项目。',
    body:'已并入 2026-09-15 五篇深度推演原稿（《个人职业画像与决策约束》《第二职业曲线设计》《赛道与交叉点》《副业冷启动建议》《破局：渠道与内容定位》）：前序项目 是「换到热爱行业就好了」的亲身反例，不建议在未验证副线收入前动现金流底盘，先做低成本可逆实验。',
    path:'~/MindPalace/vault/职业规划推演/00_第二职业曲线与个人定位深度推演汇编.md', updated:'2026-09-18 · 演进中', tags:['职业方向','未定型'], also:['k2','s4','s7'], nature:'只有本人知道' },
  { id:'k2', cat:'career', room:'self', kind:'card', title:'能力向 vs 动力向｜长期方向验证实验',
    line:'区分「擅长但消耗」的能力向与「好奇且自驱」的动力向：用小样本写作实验测出真正能长期持续的交叉点。',
    body:'投资已 pass。要测的不是哪个方向好，而是能力和动力是不是同一个方向。9/18 已出 4 道题与判读规则（写时阻力 × 写完想不想继续），但一条都没交稿。',

  { id:'k3', cat:'career', room:'self', kind:'card', title:'经验产品化｜从方法到可重复交付资产',
    line:'九宫格经营诊断要不要产品化，从 9/15 讨论到现在反复冒出又收回；她说过「可以是我的武器，但不一定交付这个，不一定以这个为中心」。',
    body:'九宫格经营诊断的产品化形态反复冒出又收回：做成工具、做成技能、做成可重复交付，还是只当自己的判断框架，没有定案。典型的「还在想」，不能写成结论。',

  { id:'k5', cat:'career', room:'self', kind:'note', title:'周度复盘「回溯」｜从 9 月跑到 11 月的持续动作',
    line:'每周一 09:00 自动跑：扫前 8 天周日到前 3 天周五，落盘五段结构（核心命题/关键产出/结论变化/待续/月度索引），结果推微信小程序。',
    body:'2026-09-13 首期，到 11-06 共 6 份（9/27–10/02、10/11–10/16 两期断档）。产出是判断与遗留，不是交付物；已开启推送到微信小程序。取数方法本身也在自迭代：sqlite 取会话标题、以各空间 memory 为摘要、剥掉 system-reminder 才是真实提问。',

    line:'6 份周报里反复成立的判断：下滑先找到位置再找原因、活动驱动不是常态能力、平台化先拆数据层、触达买的是长尾不是利润。',
    body:'6 份周报逐周累加：证据纪律（先定口径、再认凭证、后下结论）、做活动→定规则、结构换轨非流失（「用户没变，是容器变了」）、记忆要入口层。命题由自动化归纳、由她裁定；164 条任务责任人空着连续三周被列为同一遗留。',

  { id:'k7', cat:'style', room:'self', kind:'card', title:'视觉表达原则｜分组不等于关系',
    line:'「这张图我看不到关系，只看到概念分了两组，依旧是罗列」——一张图至少要表达包含、依赖、角色差异之一，否则就是失败的列表。',
    body:'一张概念图至少要表达包含 / 依赖 / 角色差异之一；按「回答哪个问题」分层，层标题写明该层扮演什么角色，层间用箭头接因果。她给的清单是素材不是规格——重叠项合并、跨抽象层级的项拆开另立一层。这条判断也解释了她为什么嫌按目录分组的资料库板正。',

  { id:'s1', cat:'style', room:'self', kind:'card', title:'底层操作系统｜定点共情 × 风险预算 × 资源排序 × 行动边界',
    line:'「我先看见情绪，再启动风控」「感受是真的，闸门也是真的」——四个词是她从喂流浪猫流浪猫的选择里自己回看出来的运行方式。',
    body:'个人概括的四个词，出自《从底层操作系统到成长路径》（原先同源拆成的三张卡已合为这一张）。两条落到工作的推论：① 边界——「不为了证明自己是个好人，就接下超出交付能力的项目」：共情有边界，交付也要有边界；优先帮问题具体、愿意行动的人，把资源放在最能改变结果的地方。② 择路——「只靠共情不够，只靠计算也不是我」：「前者让我枯萎，后者把我掏空」，所以咨询、经营规划、项目评估这类既要理解人、又有交付边界的工作合适。',
    path:'~/MindPalace/vault/归档快照/个人专栏归档/完整文档_从底层操作系统到成长路径.md', updated:'成稿 · 2026-11-14 三卡合一', tags:['自我观察','判断标准','择路标准'], also:['a7','k1','s4'], nature:'只有本人知道' },

  { id:'s5', cat:'style', room:'self', kind:'card', title:'协作口径｜先说状态，再说结论',
    line:'事实先核实、推断标边界、不臆造；对外动作等明确授权；给的清单是素材不是规格。自述 INTJ：论据必须和结论对齐，含糊的「看情况」不要。',
    body:'产出形态三问：要离开这个会话吗（交付）／下次不记得会出事吗（记录写 memory）／都不是（正文直接说）。默认按讨论处理，宁可少一个文件。自述 INTJ：论据必须和结论对齐，不用修辞硬凑，含糊的「看情况」不要，要明确判断 + 可验证下一步。',

  "s01": "---\nsummary: \"User profile record\"\nread_when:\n  - 每次会话开始\n  - 需要判断个人偏好、约束或背景时\n---\n\n# USER.md - About Your Human\n\n> **性别：女性。书面一律用「她」，不要写「他」。**（2026-09-24 由 Mirror 本人纠正）\n\n- **Name:** Mirror（公开账号名「个人专栏」，X / 即刻同名）\n- **What to call them:** Mirror\n- **Pronouns:** 她／her\n- **City:** 西安（2024 年 5 月从北京迁回）\n- **Notes:** 一线策略与运营从业者。详细档案见 `~/Documents/Codex/2026-09-15/referenced-chatgpt-conversation-this-is-an/outputs/个人职业画像与决策约束_恢复版_2026-09-15.md`，本文件为摘要。\n\n## Context\n\n### 工作和能力\n\n- 现任餐饮营销咨询公司（运营中台）项目经理（约 1 万元/月），服务烘焙、餐饮和少量跨行业客户：项目管理、经营诊断、增长策略、客户沟通。当前客户见 `WorkBuddy/工作/_工作区总纲.md`。\n- 职业时间线：2017 年起在北京做融资服务 FA（撞上一级市场泡沫破裂 + 疫情）→ 2021 年底进 互联网平台（外包管理与文书类工作，自评内容乏味、个人判断不足）→ 2022 年夏进头部平台做销售运营（用数据分析拆解集团策略，再靠数据播报与激励推动销售落地，技能提升最大）→ 2023 年 5 月进舞蹈品牌 前序项目 总部（北京 20+ 店的头部品牌，自学 SQL 钻研学员消课与续费）→ 2024 年 5 月与伴侣回西安，入职现公司。\n- 回西安后薪资 16k → 10k，伴侣 周期波动。\n- 做过 AI SaaS 需求分析、系统测试、客户 BI 迁移、知识库搭建、数据基建、内部培训。\n- 硬能力：把复杂、分散、定义不清的信息结构化；用数据理解业务但不把数据当结果；把策略翻译成一线可执行动作；风险识别、范围界定、交付验收、流程设计。\n- 同时有理性分析、写作表达、内容审美和对人的感受力。\n\n### 核心张力（2026-09-17 自述，谈职业和方向时必读）\n\n- 对「上班—拿工资」的时间出卖模式已明显厌倦。1 万月薪在西安够用不算低，工作内容也不算乏善可陈，但她认为底层的逻辑仍是出卖时间。\n- 31 岁开始追问人生价值，想找到一件「像跳舞那样能燃起内心火焰」且可长期投入的事；同时明确需要现金流（不低于 8k），所以改头换面的代价很大。\n- 反复出现的真实痛点是**失控感与无所有权**：美团时期受不了被当机器、述职环评；在 前序项目 推动消课的真实力量来自老板策略与现金激励，而非自己的数据洞察，由此留下挫败——「仅靠数据分析似乎从来都不能产生真正的影响」。\n- 重要反例：前序项目 是她几乎一切喜欢的地方（除单休），但仍自述「百无聊赖的时刻占比很大」。这是她判断「换到热爱行业能否解决问题」的亲身证据。\n- 自我评估：思考大于行动、风险厌恶、容易自我怀疑、自认不擅长当老板（故现阶段主动排除开舞蹈室）。\n- 已排除或放弃的路径：动物救助组织（组织自身发薪能力弱，撑不起现金流目标）；朋友尝试的 AI 工具创业（她判断国内环境难）。\n\n### 兴趣\n\n- 猫和宠物（长期投入意愿，已有两只猫相关内容与账号工作流探索）\n- 投资（国内基金到美股，10 年以上——四件热情里唯一连续跨周期、真金白银的一件）\n- 写作与阅读（关注 AI 时代的在场感、道德困境和人的选择）\n- 健身、滑雪、跳舞\n\n### 决策约束（谈职业和商业时必须遵守）\n\n- 现金流底线：保持稳定现金流安全边际，优先做低成本可逆实验。遵循个人现金流与风险预算约束。\n- 不主张在没有验证收入或充足跑道时裸辞。\n- 不把「热爱」自动等同于适合开店、创业或全职从事。\n- 排斥纯文书/纯协调、只做数据播报无决策空间、过度内卷、述职环评式管理、仅靠老板拍板才能推动的伪闭环。\n- 偏好低成本、可逆的小实验，用证据替代一次性身份选择。\n- 决策特征：风险厌恶、容易自我怀疑，面对不可逆选择思考时间长；但目标、边界、反馈明确时能持续推进并交出成品。\n- **常见卡点（可直接点出）**：把可逆选择（发一条内容、试一个小方向）按不可逆标准反复权衡，导致长期静止。个人谨慎该用在辞职、换赛道这类真不可逆的事上。\n\n### 内容项目\n\n- 账号「个人专栏」（X @Jingling_Mirror + 即刻），方向于 2026-09-09 确认：长期建立有商业 sense、懂经营分析、有个人判断和活人感的专家形象，不以快速变现、咨询获客或验证九宫格经营诊断 PMF 为目标。\n- 每日 3–5 个候选选题，五类视角轮换；选定后再写 1–3 分钟正文。\n- **发布与数据台账（唯一台账）**：`~/MindPalace/outputs/outputs/content-ledger/个人专栏_发布与数据台账.md`。飞书多维表格已于 2026-09-18 停用，不再读写。\n- 写作规范见 `~/MindPalace/skills/writing-profile/`（画像 + 短内容表达偏好）。\n- **待讨论的隐患（阿墨标注，非 Mirror 原话）**：账号现方向是职业身份的延伸，与她自述的四件持续热情（猫、投资、写作、运动）暂无交集，可能是内容做起来费力、缺乏火焰的原因之一。\n\n### 协作提醒\n\n- 她要判断和现场，不要说教、不要咨询腔。\n- 事实先核实，推断标边界，不编亲历和案例。\n- 对外发布必须等待明确说发。\n- 数据渠道受阻要说清楚，不能伪造。\n- 个人已有一份很清醒的职业档案（见上），别把已知的事重新问一遍。\n- 自述 **INTJ**：逻辑强、在意细节，会逐条追问结论的逻辑自洽性。论据必须和结论对齐，不能用修辞硬凑；前后矛盾她一定会抓出来。含糊的「看情况」她不要，要明确判断 + 可验证的下一步。\n- **写完一段以她为主语的文字后，回头扫一遍有没有写成「他」。**\n",

  "s03": "---\nname: cake-client-review\ndescription: 为客户出具经营复盘类交付物。用于大活动复盘&工作沟通会、月度/季度/半年/年度经营复盘的目标回顾、数据回顾、原因分析、问题与建议及下阶段安排；也用于从历史资料中提炼某个周期的复盘结论。不用于合作初期提案（用 customer-full-case-marketing-proposal），不用于月度计划（用 cake-business-planning）。\n---\n\n# 客户经营复盘\n\n你负责把一段经营事实，变成客户能看懂、能认账、知道下一步做什么的复盘交付物。\n\n复盘不是数据播报，也不是自我表扬。它要回答三个问题：\n\n1. 我们定的目标，达成了多少？没达成的卡在哪？\n2. 数据到底变好还是变差？是不是真的变差？\n3. 下一阶段先动哪几件事，谁负责，什么时候验收？\n\n## 边界\n\n- 不生成提案（用 `customer-full-case-marketing-proposal`），不排月度任务（用 `cake-business-planning`）。\n- 不改写上游已确认的策略结论，除非新数据推翻了它——推翻要在复盘里显式说明\"原判断需要修正\"。\n- 不替老板拍板目标、奖金、定价数字。给方法、参考系数和演算，不给结论值。\n- 不写补单、霸王餐、诱导删评、私下退款规避平台等高风险方法。\n\n## 第一步：分流\n\n先判断做哪一类，两类结构不同，不要混用。\n\n| 类型 | 触发 | 主体 | 时间跨度 |\n|---|---|---|---|\n| **活动复盘 & 工作沟通会** | 开业、周年庆、年中/年末、品牌大播等单次大活动结束后 | 一场活动 | 活动周期 + 前后对比 |\n| **周期经营复盘** | 月度 / 季度 / 半年 / 年度汇报 | 一段连续经营 | 月 / 季 / 半年 / 年 |\n\n判断依据：有没有一个\"单一活动\"作为复盘主体。有 → 活动复盘；没有 → 周期复盘。\n\n用户没说明时，从素材判断（存在\"活动目标/活动拆解/花费测算\"→ 活动复盘；存在\"逐月工作/年度对比/下一年安排\"→ 周期复盘）。\n\n---\n\n# 路径 A：活动复盘 & 工作沟通会\n\n固定四段：**工作复盘 → 数据回顾 → 问题与建议 → 下阶段安排**。\n\n## A1 工作复盘\n\n1. **活动目标**：拉新 / 锁客 / 流程 / 培训四类，逐条打状态（✅ 达成 / ⭕ 部分 / ✗ 未达）。\n2. **活动计划表**：说明这次要跑通的样板（节点项目表、产品分线、价格修正、客服话术）。\n3. **活动拆解**：按五期展开——准备期 / 蓄水期 / 传播期 / 高潮期 / 长尾期。\n   - **必须标出延期、取消、缩减、变更**，不要只写做了哪些。这些\"没做的部分\"常常就是问题根源。\n   - 写法示例：`小红书体验官（减少）`、`抖音平播（取消）`、`日常9.9权益卡销售（延后）`。\n4. **活动花费测算表**：项目 / 产品 / 数量 / 单位成本 / 总成本 / 合计。附估算说明（哪些取高、哪些是估算）。\n5. **活动模型说明**：本次活动调用的是哪套模型（三级火箭 / 增长飞轮 / 其他），以及为什么。\n6. **任务背景回溯**：本次活动在为什么能力建设服务（对应提案里定下的 2-4 项经营能力）。\n\n## A2 数据回顾\n\n按下列顺序，每组表下必带口径注：\n\n| 顺序 | 模块 | 字段 | 对比维度 |\n|---|---|---|---|\n| 1 | 营业额（分渠道 + 汇总） | 订单、金额、单均 | 年同比、月环比 |\n| 2 | 周维度趋势 | 实收、单日峰值、综合折扣率 | 与活动节点对齐 |\n| 3 | 渠道占比 | 各渠道实收占比 | 合作前 / 合作后 |\n| 4 | 流量 | 访客、转化率、新客占比、核销占比 | 去年同期 |\n| 5 | 活动 | 每个活动分开：新老客结构、用户数、金额、核销率、转化率 | 目标完成率 |\n| 6 | 拉新 | 新增客户、新增会员、注册转化率、企微加人 | 去年同期 / 目标 |\n| 7 | 投放 | 篇数、阅读、互动、单篇均值、CPE、花费 | 上期 |\n\n**核心写法**：把\"看热闹\"和\"能转化\"放同一页对照。访客涨了但转化率跌了，两个数字必须同时出现，不能只报涨的那一半。\n\n## A3 问题与建议\n\n3-4 个问题，宁少勿杂。每个问题写全五段（见\"问题闭环\"）。\n\n## A4 下阶段安排\n\n- **上新规划建议**：研发季度表——研发时间 / 上线时间 / 分类 / 节日时令口味建议\n- **营运动作拆解**：按月 5-8 项\n- **月工作计划**：表格\n- **附：产品建议**：图片参考\n\n---\n\n# 路径 B：周期经营复盘\n\n固定四段：**工作回顾 → 数据回顾 → 原因分析 → 下阶段安排**。\n\n## B1 工作回顾\n\n1. **逐月工作主题**：每月一个标签，让人一眼看到这条线。\n   示例：`8月-调研提案定方向`、`9月-上新驱动补短板`、`10月-大活动加速磨合`、`12月-跨越双旦，历史新高`。\n2. **计划执行总结**：计划表数量、任务总数、已完成 / 进行中 / 待开始、整体完成率。\n3. **优势 / 劣势 / 机会 / 威胁**：\n   - 劣势和威胁**必须标注解决状态**（已解决 / 基本解决 / 正在解决 / 初步解决）。\n   - 只列问题不看进展，会让客户觉得\"做了半年没用\"。\n\n## B2 数据回顾\n\n营业数据（全渠道 → 分渠道 → 渠道占比）→ 流量 → 会员 → 产品 → 活动核销 → 营销花费。\n\n**每个渠道固定用同一句式**，便于横向比较：\n\n> ××渠道合作前月均订单 ×× 个、月均实收 ×× 元、单均 ×× 元；合作后月均订单 ×× 个、月均实收 ×× 元、单均 ×× 元。订单年同比 ××%，实收年同比 ××%。\n\n**产品结构用期初 vs 期末对比**（SKU 数、TOP10/TOP20 集中度、80% 营业额所需 SKU 数）。这是\"结构优化\"最有力的证据，比任何形容词都管用。\n\n例：2025年7月在售 SKU 106 个，TOP20 贡献 56%，80% 营业额需 42 个 SKU；2026年7月在售 SKU 53 个，TOP20 贡献 72%，80% 营业额仅需 25 个 SKU。\n\n## B3 原因分析\n\n回答\"为什么是这个结果\"，不是复述数据。按需取用：\n\n- **营销基础框架**：增长飞轮（用户思维为中心 + 流量思维探路 + 数据思维优化 + 最小单元试错）\n- **活动体系**：三级火箭（Ⅰ级高频触达 / Ⅱ级上新 / Ⅲ级特殊节点 / 卫星品牌活动）\n- **节日爆发数据**：按节日对比去年同期，证明节点投入的杠杆\n- **日常上新流程**：SOP 是否跑顺\n- **执行推进**：渠道运营是否随活动节奏逐步成熟\n\n## B4 下阶段安排\n\n- 已完成体系盘点（基础运营流程 / 体系搭建 / 单店模型打磨，各用几个月）\n- 产品体系重塑（价格体系、产品结构）\n- 营销体系搭建（公私域循环、会员体系）\n- 季度工作拆解\n- 专项工作（外卖专项、财报整理等）\n\n会员体系类安排用四列表：**月份 / 事项 / 具体内容 / 目的**。\n\n---\n\n# 通用规则\n\n## 数据口径（每一步都要守）\n\n**三组不能混的数字**\n\n| 组 | 不能混用 |\n|---|---|\n| 金额 | 应收 / 实收 / GMV（外卖另有：平台 GMV / 顾客实付 / 商家收入） |\n| 行为 | 成交 / 核销 / 支付 |\n| 规模 | 订单数 / 人数 / 占比 |\n\n**渠道口径**\n\n- 商城（线上商城）：按支付渠道统计（企微 + 支付宝 + 储值），注明是否剔除内部订单。\n- 外部渠道（美团 / 抖音 / 外卖）：按后台核销金额统计，默认未剔除内部订单。\n- 单渠道数据不外推全渠道。\n\n**时间口径**\n\n- 同比 = 去年同月；环比 = 上月；周维度 = 看活动节奏。\n- **节日/大促峰值必须单列**。判断日常趋势前先剔除峰值日。\n  示例：剔除 4 个高峰日后，6→7 月日均仅降 1.4%；但总额环比看着像崩盘。不剔除就会误判。\n\n**复购口径**：线上商城复购率 = 复购会员数 ÷ 消费会员数（按有手机号的订单）。不同平台定义不同，只做平台内趋势，不横向比。\n\n**表下必写口径注**：\n\n> 注：统计范围为【××】；按照【成交/实收/核销】口径计算；已/未剔除【××】。\n\n没有这行注的表，不算合格的数据页。\n\n**复核客户既有数据页时，不要凭列值复算就判定\"算错了\"。**\n\n拿到上一期交付物里的数据表，按列值重算发现对不上，第一反应容易是\"表算错了\"。**先找口径再下结论**，顺序如下：\n\n1. **先读表下注和同页正文**。同一页正文常写着另一套口径，且往往比表格更诚实（例：表格标\"日均环比 +83.4%\"，同页正文写\"日均 1,469 元，环比 +83%\"——\"日均\"三个字就是答案）。\n2. **看图例和图表标签**。图例里常直接写着天数、口径范围（例：「7 月（31 天）」「8 月（30 天）」）。\n3. **反推分母**。用表内数字倒推它用的分母：`日均 = 金额 ÷ 天数`，先验证天数假设能不能**逐行精确复现**。能复现，说明不是算错，是口径不同。\n4. **再判它是否合规**。口径不同不等于没问题——常见的问题是把口径**藏起来**：同一份文档表格用一套、正文用另一套，且都不标注。\n\n**高频陷阱：月度口径的天数与自然月不一致。** 月会常在月初交付，数据只取到上月底，实际是 **30 天**；若表格仍按自然月读作 31 天，环比就会差约 3.2%（= 31/30 − 1）。判定方法：查该月是否少了月末最后一天，并确认这一天归入了下一周的周报还是被漏掉。**跨月汇总前必须定这一天的归属，否则会漏算或重复。**\n\n> 反面案例（2026-09 零售品牌 A Q3 复盘）：上一期 8 月月会表标\"日均环比 +7.3%\"，按列值复算是 +3.9%，一度被判定为\"表内算不平\"。翻原始页后发现 8 月只有 8/1—8/30 共 30 天数据，月会按日均比较**做法是对的**，真正的问题是整份月会只有一页图例写了天数、核心表没有口径注，且同文档正文用了总额口径（+77.5%）。**教训：先翻原始页，再下判断；判\"算错\"之前必须先穷尽口径解释。**\n\n## 问题闭环（五段，缺一段就是没写完）\n\n1. **现象** —— 一句话，经营语言，不用术语\n2. **证据** —— 至少 2 类（数据 / 现场 / 访谈 / 截图），标明来源\n3. **根源** —— 不能复述现象。\"研发节奏慢\"的根源是\"缺少倒排机制\"，不是\"研发不上心\"\n4. **建议** —— 用\"建议——\"引导，给参考系数或演算示例\n5. **验证** —— 责任人 / 验证指标 / 验证周期\n\n第五段最容易被省掉，也最容易导致同一个问题连续几个季度重复出现。**没写验证的建议，视为未完成。**\n\n## 参考系数（涉及成本定价时用）\n\n| 项 | 参考值 |\n|---|---|\n| 主推 4 寸蛋糕 | 定价 118-128 元，含包装毛利 65%-70% |\n| 其他产品毛利 | 60%-75%，按产品角色差异化 |\n| 年度营销预算 | 营业额 3%-5% |\n| 大活动预算 | 年度营销预算的 30% 左右 |\n| 成本卡更新 | 常规非季节产品每半年一次 |\n\n## 表达规则\n\n- 老板主讲页不出现 SWOT、4P、AARRR 字眼。\n- 每页一个结论；标题写结论，不写空泛名词。\n- 结论落到平台 / 门店 / 指标 / 负责人。\n- 收束语示例：`产品看得到，渠道接得住，流程供得稳，品牌力才能真正长久。`\n\n## 呈现顺序\n\n内容先定稿，再转格式。不要一边想逻辑一边排版。\n\nPPT → `tencent-pptx`；Word → `tencent-docx`；H5 / 甘特图 Excel → `cake-plan-rendering`。\n\n---\n\n# 读客户资料的方法（实战）\n\n- **图片型 PDF（周会／月会常见）没有文本层，要用渲染方式读**，不要因为 `get_text()` 为空就判定\"无法读取\"。\n  ```python\n  import pymupdf\n  d = pymupdf.open(path)\n  for i, pg in enumerate(d):\n      pg.get_pixmap(dpi=110).save(f\"/tmp/pg{i+1:02d}.png\")   # 再用 Read 逐页看\n  ```\n  先渲染全部页，再按页读；表头、图例、表下注都是渲染后才能看到的口径线索。\n- **先读目录页／板块页定位，再逐页读数据页**，不要从第一页顺序读。月会结构通常是：上月工作与完成情况 → 本月数据（渠道／产品／流量／会员）→ 本月计划。\n- **月会交付日期通常早于月底**，所以\"本月数据\"往往只到上月底。取数先确认截止日。\n- 同一指标在不同交付物里对不上时，先看哪一份**日期更新、口径更完整、可追溯**，以它为准，并保留旧值及差异说明。\n\n---\n\n# 用户侧证据的用法（问卷 / 评价 / 触达）\n\n复盘要回答\"用户怎么看、为什么买单\"，靠三份材料。**三份的样本性质不同，混用会得出错结论。**\n\n## 1. 调研问卷（CSV／Excel）\n\n- **先定样本性质再谈结论**：看性别、年龄、购买频次三项。若\"近一年未购买过\"占比高，样本就是**新客／非核心客**，只能解释\"感知与偏好\"，**不能代表老客复购**。\n- **多选题的存储形式**：一个选项一列，列名形如 `7.您购买蛋糕时首先会考虑:口味（…）`，单元格存**固定字母标签**（A/B/C…），非空＝被选中。所以：\n  - 选中率 = 该列非空 / 样本数\n  - **\"排第一\"不能用 `startswith('A')` 判断**——标签是选项的固定编号，不是排序位。题目写\"首先会考虑\"但实际是多选时，只有编号最小的那个选项会全是 A，其余选项永远不出现 A。\n- **同一列可能混了两道题**（问卷平台改题后合并导出）。识别方法：值的**前缀体系不同**。例：价格区间是 `A.100以下/B.100-150…`，场景题是 `A.订购蛋糕主要是生日聚会…`。**必须按值前缀拆分后再统计**，否则两道题的数字会互相污染。\n- **\"清洗数据结果\"列默认可能是\"未清洗\"**，不要以为系统已剔除无效样本；\"智能清洗数据无效概率\"同理，要单独看。\n- 开放题（建议／不满意）先做词频、再**抽原文逐条读**。词频给方向，原文给结论——尤其**具体名词**，如\"动物奶油\"出现 12 次比\"好吃\"出现 33 次更有行动价值。\n\n## 2. 平台评价（抖音／美团导出表）\n\n- 列位置因表而异，**先读表头再取数**。常见：抖音 `文本内容` 列 + `推荐等级` 列；美团 `评价` 列 + `评分` 列。\n- **高分率极高时（如 5 星 93%+）必须注明\"存在引导好评可能\"**，并说明这影响的是代表性、不影响提取诉求词。\n- 评价数据的最有价值用法不是算满意度，是**提取用户的原话词汇**：\n  - 分成「好吃／口感」「场景／环境／拍照」「颜值／造型」「服务」「价格」「包装」几组做覆盖率，比逐条读快得多。\n  - **用数据里真实出现的词，不要用行业词**。例：客户以为用户说的是\"下午茶\"，实际 1,530 条里\"下午茶\"只出现 46 次（3.0%），用户说的是\"好看／能拍／能出片／能打卡\"。**品牌语言照抄行业词，用户接不住。**\n- **差评要逐条读完**（通常只有几十条）。价值最高：用户会把\"为什么觉得不值\"直接讲出来，而这是好评里永远看不到的。\n- ⚠️ **差评是\"排除性证据\"，不是\"指令性证据\"**（最易犯的错）。它只能支撑\"**某个具体问题存在**\"（如团购券到店无法核销——可验证的事实），**不能支撑\"品牌整体该做什么\"**：几十条差评往往只占全量 3%—6%，是自发表达、非随机抽样、非全员。**用法限定两条：① 定位可验证的问题；② 提出待验证假设。** 要升级成品牌层面的动作，必须先有全量数据验证（如\"4 寸显小\"→ 先查 4 寸与 6 寸的差评率对比，而不是直接下\"要上小规格\"）。\n\n## 3. 触达 / 投放测试表\n\n- **先找空白对照组**。有\"不触达组\"且其自然回流为 0 时，才敢说触达带来的量是增量；没有对照组，只能描述\"触达组表现\"。\n- **ROI 必须写清分母**。常见口径 `ROI = 支付金额 ÷ 短信费`，分母只有几百元，数值会非常高（如 118）——**这是\"仅渠道端 ROI\"，不能当整体投放 ROI 用**，必须在页面上注明。\n- **分层 ROI 的排序就是人群精度排序**（越精准越高）。据此刻画结论：\"精准人群优先，泛人群最差\"，直接支持分层触达而非全量群发。\n- 报表里的**合计行可能与分层行相加不一致**（漏行／合并单元格）。**用合计行、别自己重算分层**；要引用分层数字，先与合计对平。\n\n## 4. 三源合看时的边界\n\n- 问卷说\"偏好\"、评价说\"感知\"、触达说\"行为\"——**三者只能互相印证，不能互相替代**。用户的\"偏好排序\"（如口味 96.5%）不等于实际复购行为。\n- 用户的\"价格敏感度\"要看**差评里的具体句子**，不要看价格区间的众数。常见情形：价格带没问题（众数落在中位），但**\"感知价值\"被场景或份量击穿**（\"以前卖的是环境，现在你凭啥\"）——这不是价格问题，是价值支点问题。\n- ⚠️ **\"用户在意\"≠\"能构成差异\"。** 给品牌语言／卖点排序前先问一句：**这一点同行是不是也做到了？**\n  - **同行都做到的 = 及格线**：讲了没有溢价。但**页面仍要如实标注**（用户在意，属**信任项**，不是卖点）。\n  - **只有你做到、或同行没说的 = 差异点**：才配当品牌语言的主角。\n  - 例：动物奶油（安佳）在烘焙行业已通用——用户在意，但同行都有 → 标注即可，不做主角。把在意度排序（\"造型 73.2% 高于食材 71.0%\"）直接推成\"品牌语言要讲造型\"，就是漏了这一步。\n\n## 5. cohort 留存表 → 复购率（客户后台的\"第 N 月留存\"）\n\n客户后台（企迈等）给的是 **cohort × 第 N 月** 矩阵：行＝获客月份，列＝获客后第 N 个月**当月再次成交**的人数与占比。用它说话要先守住四条：\n\n1. **列是单月活跃，不是累计、也不是去重合并。** 同一顾客可能同时落在第 1、2、3 月 —— **三列不能相加**；\"3 个月内至少复购一次\"必须有顾客明细才能算（只能说\"至少 21.61%、至多 47.44%\"这种区间，不如不说）。\n2. **命名跟老板对齐**：第 1 月＝**次月**。讲\"次月复购率 / 第三个月复购率\"，比\"第 3 月留存\"好懂。汇报口径写\"新客在获客后第 N 个月当月再次购买的比例\"。\n3. **两种比较必须分开，不能混**：\n   - ✅ **同龄比较（推荐）**：同一个\"第 N 月\"跨 cohort 比，再按季度取均值 —— 例：第 3 月复购率 2025Q4 **3.51%** → 2026Q1 **4.09%** → 2026Q2 **11.52%**。**只要每个 cohort 的第 N 月都已到期，这个比较就是干净的**（同时控制了\"顾客年龄\"）。\n   - ⚠️ **同月比较（慎用）**：越新的 cohort 在任何月份都天然更活跃（人还热着）。拿\"6 月 cohort 在 9 月活跃 21.61%\"去比\"3 月 cohort 在 9 月活跃 4.88%\"，是拿新鲜度当成绩。\n4. **旺季月单独标注**：cohort 的某个\"第 N 月\"落在中秋／春节会天然虚高（2026-06 cohort 的第 3 月＝9 月＝中秋＋教师节月）。**表最早一行之前没有同口径 cohort，就不要硬造\"同比\"** —— 一句\"无去年同期可比\"比编一个同比诚实。\n\n> 零售品牌 A案例（2026-10-06）：9 个 cohort 的**首月复购率**季均 5.87% → 4.72% → **9.67%**；**第 3 月**季均 3.51% → 4.09% → **11.52%**；6 月 cohort 1,208 人，7/8/9 月分别回来 182/130/261 人（15.07%／10.76%／21.61%）——**第三个月比第一个月还多**。\n\n---\n\n# 商品／单品结构的分析口径（做\"结构换轨\"类论证时用）\n\n## 1. 不要用商品总额做同比\n\n商品明细表的**总额同比与营业额同比是同一件事**，放在同一份复盘里属重复劳动。商品表的价值只在**结构**：谁在长、谁在掉、掉多少、补回来多少。\n\n## 2. 分类字段通常不能用，要自己重新归类\n\n客户的商品分类体系**常年被重构**（例：零售品牌 A 2025 年有「口味生日蛋糕／常温点心／下午茶甜品系列（需预定）」，2026 年换成「小四寸口味蛋糕／新品上新／季节限定／零售品牌 A必买」）。**按分类做跨年同比会得出假结论——分类改名比产品变化大得多。**\n\n可靠做法：**逐行按「商品名 + 规格字段里的尺寸标记」重新归类**，然后**把每个桶的 TOP 商品打出来人工核对**，确认桶内成分干净再信数字。\n\n| 可用的判类依据（按可靠性排序） | 说明 |\n|---|---|\n| 规格字段的结构化尺寸（如 `尺寸:6寸`／`尺寸:四寸`） | 最可靠，能区分同一商品的不同规格行 |\n| 规格转译字段 | 次可靠，有时为空或是商品编码 |\n| 商品名关键词 | 兜底（如 `三角`／`切块`／`两寸`／`四寸`／`小四寸`） |\n\n**常见坑**：\n- **同一商品名会横跨多个尺寸桶**——必须**按行（规格）判类，不能按商品名整条归堆**。\n- 关键词会误伤：`茶` 会命中「红茶无花果**蛋糕**」「冷萃茶上新·蜜桃乌龙**蛋糕**」，判饮品前必须先排除蛋糕类词（蛋糕／巴斯克／布丁／慕斯）。\n- 一个特殊单品能带偏一整档的均价（例：去年 6 寸里有一个 64 元/件的低价卡通蛋糕，把 6 寸均价从 177 拉到 103）。**发现某档均价跳变时，先找是不是单个特殊单品造成的，剔掉后再算。**\n\n## 3. 结构类论证的推荐出法（两条线 + 单品书证）\n\n1. **份额交叉图**：把商品切成 3—4 条\"业务线\"（如 下午茶线／整只蛋糕／节点礼盒／非标定制），给两年金额 + 份额 pp 变化。**份额交叉比金额涨跌更能说明\"换轨\"。**\n2. **单品书证**：找到**去年撑起旧场景的那个系列**（按系列名归集，看它是否归零）＋**今年替代它的新系列**（看补位百分比）。**\"补位不足\"比\"下滑\"更有行动指向。**\n3. **量价拆解**：把增长档拆成 金额 / 件数 / 均价 三项。**件数涨而均价不动 = 需求真实增长，不是促销拉动**——这是支撑\"不降价\"判断最硬的证据。\n   - ⚠️ **先剔除非标品**（来图定制／临时商品）：它的「数量」字段往往不是件数（零售品牌 A 2026Q3：76,141 元／65,431 \"件\" = 1.2 元/件），留着会把整体件均价从 61 元拉到 10 元，**结论直接反过来**。\n   - 拆解要能自洽：**（1+件数）×（1+均价）−1 必须等于金额同比**，不等就是分类或口径错了。\n\n**两个必踩的坑（2026-10-05 零售品牌 A实测）**：\n\n- **系列按关键词归集时，必须把命中的货名逐条列出来再求和。** 同一商品跨月会有多个货名字符串（例：「（新品全身杯 大头杯随机）」里空格不同 → 被当成两个货名）。只报一个汇总数会出错：零售品牌 A【KT 限定】先报成 93,036，逐条列出后真值是 **132,334.33**（39 个货名），补位比例从 39% 变成 **27.5%**——**方向没变但幅度差 40%**。\n- **同一段论证里，分子分母要同口径**：补位比例可以用「新系列 ÷ 去年同系列」（27.5%），也可以用「新系列 ÷ 该线自身缺口」（47%），但**页面上只能用一个**，另一个放注里，否则会被追问\"到底补回多少\"。\n\n---\n\n**不用出的**：帕累托、TOP10 集中度——如果集中度本身没有显著变化（同比 pp 差在 3pp 以内），出了反而削弱论证。\n\n## 4. 客户月会有、而平台后台没有的指标（处理规则）\n\n有些指标**只在客户自己的月报里有**，平台后台拿不到。典型两类：\n- **订单量**（客户月报按月公布；平台后台没有跨渠道的统一订单口径）\n- **渠道内部拆分**（例：线上商城拆「网店／门店」）\n\n处理规则（2026-10-03 零售品牌 A案例，已按 Mirror 裁定修订）：\n\n1. **交付物里只放一套口径——复盘口径。** 「两套口径并列」是被否决的做法：同一页出现两个\"实收\"，客户第一反应是\"哪个才是真的\"。**某一项指标若只有另一套口径有，先与负责人对齐，不要自动并列。**\n2. **渠道拆分必须索取原始月表，不要用占比折算。** ⚠️ 2026-10-03 的教训：拿「月会给的网店/门店占比」× 「线上商城自营」折出来的网店 412,394／门店 118,748，与拿到后台原始「销售渠道构成」后重算的 **335,612／194,958 差 7.7 万**——因为 7、8 月的占比来自月会、9 月来自后台，**不同源**。做法：**向客户索取每个月的原始渠道构成截图，三个月同源后再做季度**，并在页脚写明取数位置。\n3. **线上商城后台有两套互不替代的切法，别混**：\n   - 「**销售渠道构成**」＝按渠道：网店渠道／门店渠道／美团外卖渠道／未知。\n   - 「**支付方式明细**」＝按支付方式：抖音券支付／美团点评券支付／美团／…\n   - 交叉后的恒等式（已用 9 月验证到分）：**线上商城自营 = 网店渠道 + 门店渠道 + 未知 − 抖音券支付 − 美团点评券支付**；「**美团外卖渠道**」这一桶正是被平台后台替换掉的那一项（= 支付方式里的「美团」）。\n   - **券从网店侧扣**（门店金额常小于券总额，装不下）。\n   - **线上商城「总览」页一次能取全的字段**（做\"逐月＋同比\"页时一次问齐，省往返）：营业收入 / **营业额（＝应收，含优惠金额）** / 优惠金额与优惠占比 / 营业收入不含储值赠送金 / **支付订单数** / 营业目标与完成进度 / 新增充值金额（本金）/ 储值卡销售金额 / 使用储值本金 / 使用储值赠送金。\n     - **「支付订单数」＝小程序商城＋门店的线上商城侧订单**（含经小程序核销的外部平台券），**不是全渠道订单数**，不能拿来除全渠道实收算客单价。\n     - **折扣率 = 营业收入 ÷ 营业额**，实收与应收在同一张卡片上，同源可直接出。\n   - ⚠️ **拿到原始月表后必须回查此前结论，方向都可能被算反**：零售品牌 A 2025 年 8／9 月的网店门店，月会给的（85,743/72,023、180,891/90,535）与后台原值（85,638.66/114,090.00、224,761.80/164,402.35）差一倍以上，一度把「门店 −38.5%」误算成「−3.1%」。\n4. **折扣率 = 实收 ÷ 应收 = 营业收入 ÷ 营业额**（线上商城总览同页给这两个数，差额＝优惠金额）。⚠️ 引用前先确认应收是否完整（若含未支付／失败单，折扣率会被夸大）。\n5. **客单价必须与实收同源，且区间必须一致。** 用复盘口径实收 ÷ 月会口径订单量，会得到客户从未见过的数；若天数也不一致，误差可达 11%（例：9 月 30 天的金额 ÷ 27 天的订单 = 131 元，明显偏高——分子多 3 天的钱，分母少 3 天的单）。\n   → **正确做法是先跟负责人对齐，而不是自己选一个**：① 请客户补整月订单量（最干净）；② 保留月报客单价并注明来源（区间不一致要标）。**不要用\"金额÷券均价\"之类反推订单量**——那是推算不是客户给的数，会上被问\"哪来的\"就站不住。\n6. **各月天数不同时必须标天数**（客户月报常是 27／30／31 天混用）；同比统一按日均，或在页脚声明用总额。\n7. 两个口径可能给出方向相反的结论（例：月会口径 Q3 同比 −4.0%／日均 +0.3%，复盘口径 −7.1%）——**这仍是值钱的信息，但它的位置在\"口径说明\"，不占正文数据页。**\n\n**从月报补数据时的两个技巧**：\n- **缺失的绝对值可以从月报公布的「日均同比」反推**，再用另一个交叉验证。例：8 月订单 4,214 由 2026 年日均 88.0 ÷ (1−35.2%) × 31 天得出，与月报公布的 -35.2% 精确吻合。\n- **订单量可以由分渠道拼装**：网店订单 + 门店订单（月报给）+ 抖音核销券数 + 美团消费笔数（客户导出的明细表给）。\n  ⚠️ **同一平台在不同来源的「笔数」可能不同**（例：2025 年 9 月抖音，月会给 1,624 单／明细表算 2,821 券）。**必须跟着金额口径走**——金额取哪个来源，笔数就用同一个来源。\n\n---\n\n# 交付前检查清单\n\n**数据**\n- [ ] 每个数字有来源和口径注\n- [ ] 应收/实收/GMV、成交/核销/支付没有混用\n- [ ] 单渠道数据没说成全渠道\n- [ ] 同比、环比、节日季节性分开表述\n- [ ] 峰值日已剔除后才下\"变差\"的结论\n- [ ] 月度口径是否覆盖完整自然月；若只取到上月底（如 30 天），口径注里已写明，且跨月汇总时该月最后一天的归属已定\n- [ ] 同一份交付物里表格与正文用的是同一口径（尤其\"日均\"与\"总额\"）\n- [ ] 引用客户既有数据页时，口径已复核，未把\"口径不同\"误判成\"算错了\"\n- [ ] 交付物内每个指标只有**一套口径**；某指标若只有另一套口径有，已与负责人对齐，未自动并列\n- [ ] 渠道拆分若跨口径，已按占比折算到统一口径，且页脚披露了折算方法\n\n**逻辑**\n- [ ] 先讲\"现状是否真的变差\"，再讲问题\n- [ ] 每个问题至少 2 类证据\n- [ ] 根源不是现象复述\n- [ ] 每条建议带参考系数或演算\n- [ ] 每条建议有责任人、验证指标、验证周期\n- [ ] 没有替老板拍板目标数字、奖金金额\n- [ ] 没做的动作（延期/取消/缩减）已显式标出\n\n**表达**\n- [ ] 主讲页无未解释的框架缩写\n- [ ] 每页只有一个结论\n- [ ] 有一句能记住的收束语\n- [ ] 未使用高风险方法\n\n**交付**\n- [ ] 文件名含客户名 + 交付物类型 + 日期\n- [ ] 图表数字与正文一致\n- [ ] 附件、链接、口径注齐全\n- [ ] 对外发送前已获明确授权\n",
  "s04": "---\nname: cake-ppt-layout\ndescription: 运营中台客户交付 PPT 的版式规范（空模板）。当要把已定稿的提案、经营复盘、月会、活动策划等内容做成 PPT，且要求版式与既有交付物一致时使用。只管版式，不管内容——内容必须先由上游技能定稿。生成方式为 python-pptx 按本规范拼装，或把本规范作为 tencent-pptx 的版式输入。\nagent_created: true\n---\n\n# 客户交付 PPT 版式规范（空模板）\n\n你只负责**排版**。不写内容、不改结论、不调整数据。内容没定稿就不要进这个技能。\n\n**规范主轴＝复盘版**（Mirror 2026-09-17 裁定\"按复盘\"）。主轴数值取自 `~/Desktop/零售品牌 A/零售品牌 A 开业复盘&工作沟通会-0710.pdf`（65 页，实测）。\n提案版差异见**第八章**——做提案类交付物时按那一章替换对应数值，其余规则不变。\n\n**一条铁律：一页一个结论。标题写结论，不写空泛名词。** 版式做的是\"让结论一眼被看到\"，不是\"让页面好看\"。\n\n---\n\n## 一、画布与网格\n\n| 项 | 值 |\n|---|---|\n| 画布 | 13.333 × 7.5 英寸（16:9） |\n| 左边距 | 0.75 in |\n| 右边界 | 12.64 in |\n| 上边距 | 0.25 in |\n| 内容区 | y = 1.4 → 6.9 in |\n| 脚注行 | y = 7.12 in |\n\n所有坐标单位＝英寸。\n\n### 页眉四件套（每个内容页固定）\n\n| 元素 | x | y | w | h | 样式 |\n|---|---:|---:|---:|---:|---|\n| 左上色块 | 0.09 | 0.27 | 0.44 | 0.44 | 实心 `#EA4809`，无文字 |\n| 页标题 | 0.75 | 0.25 | — | 0.42 | **24pt `#000000`**，左对齐 |\n| 右上 logo | 11.22 | 0.24 | 1.69 | 0.51 | 品牌 logo 图 |\n| 全宽横线 | 0.01 | 0.86 | 13.32 | 0.06 | 实心 `#EA4809` |\n\n**页标题分三档，按页的性质选：**\n\n| 档 | 字号 | 色 | 用在哪 |\n|---|---:|---|---|\n| 一级内容页 | **24pt** | `#000000` | 数据页、复盘内容页、小结、月计划（默认用这档） |\n| 问题页 | **20pt** | `#000000` | \"问题N：××\"（页内还会有 24pt 的结论行，标题要压一级） |\n| 二级小节页 | 21pt | `#231D19` | 段内分节，**且无 logo**（见 P12） |\n\n> 页标题是**结论句**，不是栏目名。写「SKU数量下降、头部集中增强，但SKU仍过多」，不写「产品结构」。\n\n---\n\n## 二、设计令牌\n\n### 2.1 色板\n\n| 用途 | 值 | 用在哪 |\n|---|---|---|\n| **结构主色** | `#EA4809` | 色块、全宽横线、章节线、数字、强调 |\n| **辅橙** | `#EC7C30` | 小结橙框、图表主色、块状强调 |\n| 主文字 | `#000000` | 页标题、正文（绝对主力） |\n| 数据强调 | `#FF0000` | 要盯住的那个数字/那句话 |\n| 次级灰 | `#595959` | 说明、次要文字 |\n| 浅橙·表头 | `#FAE4D5` | 表格分组表头 |\n| 浅橙·表头浅阶 | `#FBE3D5` | 表格次级表头 |\n| 深橙·强调行 | `#F4B083` | **同比行 / 环比行整行** |\n| 深橙·表头 | `#F4B382` | 汇总列表头 |\n| 浅灰·底 | `#F1F1F1` | 标题条、浅底块 |\n| 浅灰·线 | `#D9D9D9` | 分隔 |\n| 章节数字 | `#D8D8D8` | 225pt 背景数字 |\n\n**颜色纪律**\n- 结构色只有一种橙 `#EA4809`；`#EC7C30` 是它的辅阶，只用于**橙框和图表**。\n- **红 `#FF0000` 是数据强调，一页最多用一次**（可以给同一个句子里的两个数字，但不要满页红）。\n- **不要出现 Office 默认蓝 `#5B9BD4` / `#DDEBF7`**——那是没改过的 Excel 图表色，属历史遗留，不要继承。\n- 另有两个从提案遗留的棕系（`#643E2F` / `#746256`）在复盘里出现极少，**新做时不要用**。\n\n### 2.2 字体\n\n| 内容 | 字体 |\n|---|---|\n| 中文（标题、正文） | 微软雅黑 |\n| 数字、英文 | Arial |\n\n> 原文件里出现过 HYQiHei（导出替代）与华文新魏，属工具链产物，**规范统一用微软雅黑 + Arial**。\n\n### 2.3 字号阶梯（pt）\n\n| 层级 | 字号 | 用途 |\n|---|---:|---|\n| 章节超大数字 | 225 | 章节页背景数字 |\n| 章节名 | 54 | 章节页右下 |\n| 封面标题 | 40 | 封面主标题 |\n| 大字观点 | 29 / 28 / 27 | 引语页、金句页 |\n| **页标题（一级）** | **24** | 页眉 |\n| 页标题（问题页） | 20 | 页眉 |\n| 小节页标题 | 21 | 页眉 |\n| 导语句 | 18 | 页标题下第一句结论（居中） |\n| 小结正文 | 18 | 小结页整段 |\n| 卡片/分区标题 | 20 / 19 | 页内分区 |\n| 正文 | 16 | 大段说明 |\n| 常规正文 | 15 / 14 | 条目、说明 |\n| 图片页标题条 | 17 / 20 | 顶部灰条内 |\n| 表格正文 | 12 | 表格内文字（用得最多的一档） |\n| 表格数字 | 11 | 表格内数字 |\n| 卡片一句话 | 10.8 | 卡片正文 |\n| 小注 | 9 | 卡片底部、图注 |\n| 图片标签 | 8 | 黑底白字标签 |\n| 脚注/口径注 | 8 | 来源行、表下注 |\n\n> **不继承原文件的畸变尺寸**（20.1 / 23.1 / 15.9 / 11.1 / 8.1 这类），那是 PDF 导出的产物。统一用整数刻度。\n\n---\n\n## 三、页型库\n\n14 种页型，覆盖全部内容。**先在内容稿上标注每页用哪个页型，再动手做。**\n\n| 代号 | 页型 | 用途 | 页眉 |\n|---|---|---|---|\n| P0 | 封面 | 全套第一页 | 无 |\n| P1 | 目录 | 四段导航 | 无 |\n| P2 | 章节分隔 | 每段开头 | 有·带顶线与 logo |\n| P3 | 引语/观点 | 金句、过渡、转折 | 无 |\n| P4 | 标准内容页 | 通用图文、数据表 | 有 |\n| P5 | 三卡阵列 | 三块并列（能力/成绩/问题） | 有 |\n| P6 | 数据条对比 | 期初 vs 期末结构变化 | 有 |\n| P7 | 双栏对比卡 | 前后/竞品/两组对比 | 有 |\n| P8 | 图片网格 | 产品、场景、证物 | 有 |\n| P9 | 整页图 | 一张图讲一件事 | 有 |\n| P10 | 小结页 | 亮点/暗点收束 | 有 |\n| P11 | 结尾页 | 感谢观看 | 有·无标题 |\n| P12 | 二级小节页 | 段内分节导航 | 有·无 logo |\n| P13 | 建议页 | 问题页里的\"建议——\" | 有 |\n\n---\n\n### P0 封面\n\n**空模板**（复盘版，白底简版）\n\n```\n[白底]                    x=0    y=0    w=13.33 h=7.5    #FFFFFF\n[联合 logo 图]            x=0.75 y=0.96 w=2.58  h=0.78\n[【主标题】40pt #000000]  居中，y=2.96\n[【出品方】28pt #000000]  x=8.96 y=5.79 w=2.33  h=0.49  「运营中台出品」\n[橙色短横线]              x=7.38 y=6.05 w=1.35  h=0.04  #EA4809\n```\n\n填充规则：主标题＝`客户名 + 交付物类型`（如「零售品牌 A 开业复盘&工作沟通会」，`&` 用 Arial）。右侧橙线＋出品方为一组，是收尾标记。\n\n**变体**：提案版是**满版设计图**（1840×1080 等比铺满，文字做进图里）。\n> ⚠️ 不要去抄提案 slide1 里那组封面文字坐标——它们被满版图盖住，是无效图层。\n\n---\n\n### P1 目录\n\n**空模板**（无页眉，白底）\n\n```\n[【目录】40pt #000000]  左对齐    x=1.92 y=3.53\n四条条目（行距 1.18，首行 y=1.82）：\n  [【0i. 段名】28pt #EA4809]  左对齐   x=4.53\n```\n\n填充规则：段名 2—5 字（动词短语，如「开业工作复盘」「数据回顾」「问题与建议」「季度工作安排」）。**就用四段固定结构，不要另起名目。**\n\n---\n\n### P2 章节分隔\n\n**空模板**（复盘版：带顶部全宽横线与 logo）\n\n```\n[左上 logo]                    x=11.22 y=0.24 w=1.69 h=0.51\n[顶部全宽横线]                  x=0.01 y=0.86 w=13.32 h=0.06  #EA4809\n[超大数字 0i+1]  225pt #D8D8D8 居中   x=0.29 y=3.45 w=3.90 h=3.96\n[【章节名】]     54pt #000000 左对齐  x=6.52 y=4.89 w=4.50 h=0.95\n[章节名下方橙线]  直线（cxnSp）        x=4.74 y=6.13 w=7.67 h=0.04  #EA4809\n```\n\n> 三件事必须做到：\n> 1. **数字压在左下角出血**（下沿超出页面）——这是版式最强的识别点，不要挪位、不要缩小。\n> 2. **章节名下方那条橙线必须画**。它是直线连接符（`cxnSp`），不是矩形。\n> 3. 章节名下的橙线**从 x=4.74 起、一直拉到 12.41**，比章节名本身长得多——这是刻意的。\n\n---\n\n### P3 引语/观点\n\n**空模板**（无页眉，白底）\n\n```\n[【引语】]    40—48pt #000000 居中   y=2.2 → 3.2\n[【展开句】]  20—22pt 左对齐         y=3.9 → 5.6\n```\n\n变体（金句页）：单行大字 27—29pt，居中，配下方橙线（`#EA4809`）。\n\n填充规则：一页只放一个判断。引语 ≤30 字；展开句 ≤80 字，分 2 个短段。\n\n---\n\n### P4 标准内容页\n\n**空模板**\n\n```\n[页眉四件套]  （页标题 24pt #000000）\n[【导语句】]  18pt，**居中对齐**，y=1.33 → 1.61\n             句中要强调的数字改 #FF0000\n[主体区]      y=1.9 → 6.5\n[【口径注】]  8pt #595959，**右下角、右对齐**，可两行，y≈6.5 → 6.9\n```\n\n**导语句是最容易被跳过、但最重要的一行**：它是这一页的结论。**复盘版的导语是居中**，不是左对齐。全页只强调一处（一处可以含两个数字）。\n\n主体区按内容选下面任一种（同一页只用一种）：\n\n| 主体形态 | 说明 |\n|---|---|\n| **数据表格** | 见下方「数据表格样式」，复盘类交付物最常用 |\n| 文字块 | 2—4 个短段，段间空 0.2，每段 ≤60 字；用 `•` 引导段，`▪` 引导条目 |\n| 左文右图 | 文 x=0.75 w=5.5；图 x=6.8 w=5.5 |\n| 上图下文 | 图 y=1.7 h=3.4；文 y=5.3 |\n\n#### 数据表格样式（复盘版，必守）\n\n| 部位 | 底 | 字号 |\n|---|---|---|\n| 分组表头（商城/美团/抖音/外卖…） | `#FAE4D5` | 12pt |\n| 次级表头 / 分组内小表头 | `#FBE3D5` | 12pt |\n| 汇总列、需要盯住的表头 | `#F4B382` | 12pt |\n| **同比行、环比行** | **整行 `#F4B083`** | 11pt |\n| 数据行 | 白底 | 11pt |\n| 左侧「时间」列表头 | `#FAE4D5` | 14pt |\n\n- 表格**不画竖线**，靠底色分块。\n- 列位置参考（英寸）：时间 0.74 ｜ 第 1 组 1.91 / 2.91 ｜ 第 2 组 3.90 / 4.73 ｜ 第 3 组 5.58 / 6.46 ｜ 第 4 组 7.38 / 8.32 ｜ 汇总 9.38 / 10.43 / 11.48。\n- **口径注放右下角右对齐**，不要放左下。\n\n> **\"同比行整行橙底\"是这套版式最强的识别点之一**，做数据页时优先保留。\n\n---\n\n### P5 三卡阵列\n\n**空模板**（三张卡横排）\n\n```\n卡片 i（i=0..2，x = 1.00 / 4.82 / 8.64，w=3.00 h=2.72）：\n  [卡底]  fill #FFFAF2 描边 #DECDBC        y=2.26\n  [编号]  13pt 左对齐                       x=+0.25 y=+0.32 w=0.55 h=0.22\n          i=0 → #EA4809；i=1 → #456758；i=2 → #4C6079\n  [短横线] fill 同编号色                    x=+0.90 y=+0.47 w=1.60 h=0.01\n  [【卡标题】]  16pt #643E2F 居中           x=+0.32 y=+0.86 w=2.36 h=0.29\n  [【卡正文】]  10.8pt #231D19 居中         x=+0.36 y=+1.50 w=2.28 h=0.42\n  [【关联注】]  8.5pt #746256 居中          x=+0.35 y=+2.29 w=2.30 h=0.26\n[【收束语】]  15.5pt #643E2F 居中           x=1.25 y=5.90 w=10.10 h=0.28\n```\n\n填充规则：卡标题 ≤8 字；卡正文 ≤30 字（写\"从什么走向什么\"）；关联注写\"对应前面：XX、XX\"（回指证据页）；收束语 ≤40 字。\n> 卡片配色是提案版遗留的棕系。**新做时把 `#FFFAF2`/`#DECDBC`/`#643E2F` 换成 `#F1F1F1`/`#D9D9D9`/`#000000`，编号色改用 `#EA4809` + `#EC7C30` + `#595959`**，与主轴一致。\n\n---\n\n### P6 数据条对比\n\n**空模板**（按期次逐行，行距 1.18，首行 y=2.68）\n\n```\n每行 i（y = 2.68 + 1.18i）：\n  [期次标签]   12.5pt #000000 左对齐   x=0.95 w=1.00 h=0.22\n  [条形底]     fill #FFFFFF 描边 #D9D9D9     x=2.05 w=3.30 h=0.28\n  [条形填充]   基色 #EC7C30，强调行用 #EA4809 x=2.05 w=(比例×3.04) h=0.28\n  [数值]       10pt 同条形色            x=5.50 w=0.70 h=0.20\n  [【指标说明】] 9.5pt #595959          x=2.05 y=+0.44 w=3.30 h=0.20\n  ── 右侧第二组（同一行第二个指标）──\n  [条形底/填充/数值/说明] x=6.15 / 6.15 / 9.60 / 6.15\n  [【代表品名】] 9.5pt #000000          x=10.15 y=+0.03 w=1.80 h=0.24\n[对比红线] fill #FF0000（纵向细长矩形，标出要盯住的区间，一页最多两条）\n[【来源】]  12pt 右对齐                x=2.67 y=6.56 w=10.30 h=0.22\n```\n\n填充规则：**只在期初期末都用同一口径时才能画在同一页**。条形长度＝数值 ÷ 该组最大值 × 3.04。\n\n---\n\n### P7 双栏对比卡\n\n**空模板**（左卡 x=0.84 w=5.05；右卡 x=6.56 w=5.05；y=1.52 h=4.92）\n\n```\n[卡底]  左 fill #ECDCD3 / 右 fill #FFFFFF 描边 #D9D9D9\n[【对象名】] 14.5pt #000000 左对齐   x=+0.20 y=+0.26 w=1.70 h=0.26\n[短横线]   左 #EA4809 / 右 #595959         x=+2.08 y=+0.41 w=2.35 h=0.01\n[主图]                                    x=+0.20 y=+0.73 w=2.02 h=3.58\n[副图 ×2]                                 x=+2.44 y=+0.73 / +2.59  w=1.42 h=1.72\n[黑底标签条] fill #000000，文字 7.5pt #FFFFFF 居中\n[【资料来源】] 8pt #595959  右下角\n```\n\n填充规则：两侧对象必须**同类可比**（同规格、同场景、同时点）。每张图都要有标签，标签写图在证什么（「正面观察」「侧拍」「细节补充」），不写图名。\n\n---\n\n### P8 图片网格\n\n**空模板**（3 列为主）\n\n```\n[左上色块]    x=0.10 y=0.31 w=0.44 h=0.44  #EA4809\n[【标签字】]  32pt #EA4809 左对齐  x=0.09 y=0.18\n[【页标题】]  20—24pt #000000      左对齐 x=0.78\n[顶部全宽横线] x=0.01 y=0.86 w=13.32 h=0.06  #EA4809\n[右上 logo]   x=11.22 y=0.24 w=1.69 h=0.51\n[顶部灰条]    x=0.76 y=1.36 w=12.02 h=0.77  #F1F1F1\n  [【行标题】] 17—20pt\n[图片 ×3]     y≈2.51  h≈4.35\n  x = 0.76 w=2.85 ｜ 5.25 w=3.05 ｜ 9.58 w=3.19\n[【脚注】]    8pt #595959 右下\n```\n\n填充规则：图片等比裁切到统一高度。顶部灰条写这一组的共性（「切块甜品（薄巧、桃子、蜜瓜、葡萄）」），不写「图片展示」。\n\n---\n\n### P9 整页图\n\n**空模板**\n\n```\n[页眉四件套]\n[整页图]  x=0.91 y=2.22 w=11.28 h=2.69\n```\n\n**变体**：大字标题 29pt #000000 左对齐（y=1.76）＋ 橙线（x=1.08 y=3.18 w=2.80 h=0.02）＋ 一句话 13.2pt（y=3.68）＋ 整页图压底（x=0.45 y=1.04 w=12.54 h=6.39）。\n\n---\n\n### P10 小结页\n\n**空模板**（一位主管讲完整段的那种页，用橙框包住）\n\n```\n[页眉四件套]  （页标题 24pt #000000）\n[橙框]        x=0.88 y=1.31 w=11.78 h=5.72\n              圆角矩形，描边 #EC7C30，填充白（或极浅橙）\n框内（左边距 +1.2）：\n  [【导语段】]  18pt #000000，`•` 引导        y≈2.03\n  [【小标题】]  18pt #000000（「亮点」「暗点」）y≈2.93 / 5.23\n  [【条目】]    16pt #000000，`▪` 引导       行距 0.43\n               条目里的关键数字改 #FF0000\n```\n\n填充规则：**固定两段——亮点 / 暗点**。亮点先、暗点后。每条 ≤35 字。**暗点必须写出来**，只写亮点的小结页没有信息量。\n\n---\n\n### P11 结尾页\n\n**空模板**\n\n```\n[顶部全宽横线] x=0.01 y=0.86 w=13.32 h=0.06  #EA4809\n[右上 logo]   x=11.22 y=0.24 w=1.69 h=0.51\n[感谢观看]    40pt #000000，**四字分开排**，间距 1.02 in\n              「感」x=3.60 「谢」x=4.62 「观」x=5.64 「看」x=6.66，y=3.54\n[下方橙线]    x=3.50 y=4.63 w=7.98 h=0.05  #EA4809\n```\n\n---\n\n### P12 二级小节页\n\n段内再分节时用（如\"数据回顾 → 1. 营业额数据\"）。**没有 logo，只有 21pt 标题。**\n\n```\n[左上色块]  x=0.09 y=0.27 w=0.44 h=0.44  #EA4809\n[全宽横线]  x=0.01 y=0.86 w=13.32 h=0.06 #EA4809\n[【小节标题】] 21pt #231D19 左对齐   x=0.75 y=0.25\n（无 logo；下方留白，不放内容）\n```\n\n填充规则：写法＝`段名 + 序号. 主题`，例「数据回顾 1. 营业额数据」「问题与建议 3. 测试」。\n\n---\n\n### P13 建议页\n\n问题页系列的最后一页，专门放\"建议——\"。**全页居中排版。**\n\n```\n[页眉四件套]  （页标题 20pt #000000）\n[引导词]   「建议——」20pt #FF0000 居中    y≈2.2\n[【结论句】] 24pt #000000 居中             y≈2.9\n[【说明行 ×2】] 16pt #000000 居中          y≈3.3 / 3.7\n```\n\n填充规则：结论句＝一句可执行的主张，句中要强调的词改 `#FF0000`；说明行做「内部视角」「用户视角」这类对照，每行 ≤45 字。\n\n### 问题页三页式（复盘类交付物通用）\n\n一个问题占 **3 页**：\n\n| 顺序 | 页 | 内容 |\n|---|---|---|\n| 1 | 现象页 | 一句话把问题说清（页标题 20pt，如「问题1：研发\"纠结\"」） |\n| 2 | 证据页 | 数据 / 现场 / 访谈，至少 2 类 |\n| 3 | **P13 建议页** | 「建议——」+ 结论 + 说明行 |\n\n一个问题占 3 页，所以**问题数控制在 3—4 个**，宁少勿杂。\n\n---\n\n## 四、生成流程\n\n### 4.0 直接用空白模板（推荐）\n\n已生成好一份 15 页的骨架模板，**直接在里面填内容，不要从零搭**：\n\n| 文件 | 位置 |\n|---|---|\n| 空白模板 pptx | `~/WorkBuddy/工作/零售品牌 A/05-版式/运营中台_客户交付PPT_空白模板_20260917_v1.pptx` |\n| 模板预览图 | 同目录 `运营中台_空白模板_预览_20260917.png` |\n| logo 资产（透明底 1290×391） | 同目录 `运营中台_logo_透明底.png` |\n| 生成脚本（可改参数重跑） | 本技能 `references/build_template.py` |\n| **v1 冻结副本** | 本技能 `references/template_v1_20260917.pptx`（防工作副本被误改） |\n\n> **v1 已冻结**（2026-09-17）。Mirror 的流程裁定：**等数据到齐 → 先做内容 → 内容定稿后最后才调格式**。所以现在不要改模板；待调项见**第十章**，调格式那轮一起处理。\n> **硬约束：内容没定稿不进模板。** 一边想逻辑一边排版必返工。\n\n模板页序：01 封面 ｜ 02 目录 ｜ 03 章节分隔 ｜ 04 引语/观点 ｜ 05 内容页·文字 ｜ 06 内容页·表格 ｜ 07 三卡阵列 ｜ 08 数据条对比 ｜ 09 双栏对比卡 ｜ 10 图片网格 ｜ 11 整页图 ｜ 12 小结页 ｜ 13 结尾页 ｜ 14 小节页 ｜ 15 建议页。\n\n> **logo 出现在 12 页上**（封面用左上大 logo）。目录页、引语页、二级小节页按原文件**不放** logo。\n> 生成脚本依赖 `python-pptx`；logo 路径写在脚本顶部的 `LOGO` 常量，换客户时替换成对应客户 logo。\n\n### 4.1 复用 helper 出实稿（实战：零售品牌 A Q3 初版）\n\n**做法**：把 `references/build_template.py` 里的 helper 整段复制到新脚本，只改 `LOGO` 路径，然后逐页写内容。不要重写 helper。\n\n可复用的 helper：`S()` 新建页 / `rect()` / `tb()` 文本框 / `logo()` / `header()` 页眉 / `lead()` 导语 / `note()` 脚注 / `ph()` 占位框 / `section()` 章节页 / `table()` 数据表。\n\n**`table()` 的两处关键实现**（实稿必用）：\n\n```python\n# ① 去边框：python-pptx 没有边框 API，往单元格 XML 插空线\ntcPr = cell._tc.get_or_add_tcPr()\nfor tag in ('a:lnL','a:lnR','a:lnT','a:lnB'):\n    for old in tcPr.findall(qn(tag)): tcPr.remove(old)\nfor tag in ('a:lnL','a:lnR','a:lnT','a:lnB'):\n    ln = tcPr.makeelement(qn(tag), {'w':'0','cap':'flat'})\n    ln.append(ln.makeelement(qn('a:noFill'), {}))\n    tcPr.append(ln)\n\n# ② 用 '!' 前缀标记红色强调单元格，省掉逐格传参\nif txt.startswith('!'): txt = txt[1:]; col = C_RED; bd = True\n```\n\n**防重叠算法（必做，否则一定压边）**\n- 表格渲染高度 ≈ `rowh × 行数`（内容多时会被撑高，要留余量）\n- **后续元素起点 ≥ 表格起点 + rowh × 行数 + 0.1 in**\n- 每页做完按这个式子自查一遍；一页最多约 10 行表格 + 2—3 行说明\n\n**预览校验（每次生成后必跑）**\n\n```bash\nsoffice --headless --convert-to pdf --outdir /tmp/out <pptx>\n```\n```python\nimport pymupdf\nd = pymupdf.open('/tmp/out/xxx.pdf')\nfor i in range(d.page_count):\n    d[i].get_pixmap(dpi=140).save(f'/tmp/out/d{i+1:02d}.png')\n```\n拼一张 3 列网格总览图（扫结构与一致性）＋ 2—3 张关键页细节图（看表格是否溢出），两者一起看。\n\n**「结构验证稿」这个例外**：内容未定稿时，若使用方明确要求\"先给一版看结构\"，可以出稿，但必须满足两条——① 缺数据的页用**红色占位框**明确标出（不留白、不编数）；② 文件与预览图命名带 `初版`，交付时说明哪些是真数、哪些是占位。\n\n实战产出：`零售品牌 A/04-复盘/零售品牌 A_Q3经营复盘_20260924_v0.1.pptx`（27 页）＋ 脚本 `_build_q3_v0.1.py` ＋ 预览图。\n\n### 4.2 从零生成\n\n1. **内容定稿**。上游技能（如 `cake-client-review`、`customer-full-case-marketing-proposal`）先出结构化内容稿，逐页标好：页型代号 + 页标题（结论句）+ 导语句 + 主体内容。\n2. **版式映射**。按第三章把每页装进对应页型。装不下的内容，**拆页，不要缩字号**。\n3. **生成**。\n   - 走 `tencent-pptx`：把本规范作为版式要求一并传入。\n   - 走 python-pptx：按第二章令牌 + `references/geometry.md` 的坐标表逐元素落位。\n4. **自检**（见第六章）。\n5. **交付**。文件名带客户名 + 交付物类型 + 日期 + 版本。\n\n### 页码\n\n原文件**不加页码**，靠左上色块 + 右上 logo + 全宽横线形成页眉识别。不要自行加页码。\n\n### 图片处理\n\n- 产品/场景图统一裁切到同一高度，裁切后不得变形。\n- 禁止渐变、发光、投影、3D 效果。\n\n---\n\n## 五、复盘类交付物的推荐骨架\n\n| 章节 | 内容 | 页型 |\n|---|---|---|\n| 封面 | — | P0 |\n| 目录 | 四段 | P1 |\n| 01 工作复盘 | 活动目标 / 计划表 / 分期拆解 / 花费 | P2 ＋ P4（＋P7 图片对比） |\n| 02 数据回顾 | 营业额 / 周维度 / 渠道占比 / 流量 / 活动 / 拉新 / 投放 | P2 ＋ **P12 小节页** ＋ P4 数据表页 |\n| 03 问题与建议 | 3—4 个问题，每个 3 页 | P2 ＋ P12 ＋ 现象页 ＋ 证据页 ＋ P13 |\n| 04 下阶段安排 | 上新规划 / 营运动作 / 月计划 / 附产品建议 | P2 ＋ P4 ＋ P10 ＋ P8 |\n| 结尾 | 感谢观看 | P11 |\n\n一级章节 **4 个**，每个章节内用 P12 二级小节页切分。这是既有复盘的标准骨架，不要改结构。\n\n---\n\n## 六、自检清单\n\n**版式**\n- [ ] 每个内容页都有页眉四件套（色块 0.09/0.27 ｜ 标题 24pt ｜ logo 11.22/0.24 ｜ 全宽横线 y=0.86）\n- [ ] 页标题用了正确档位（一级 24pt / 问题页 20pt / 小节页 21pt 且无 logo）\n- [ ] 结构色只有 `#EA4809`；`#EC7C30` 只用在橙框和图表\n- [ ] `#FF0000` 一页最多一处\n- [ ] 没有出现 Office 默认蓝（`#5B9BD4`/`#DDEBF7`）\n- [ ] 没有页码、渐变、阴影、发光、3D\n- [ ] 图片等比、高度统一\n\n**信息**\n- [ ] 每页只有一个结论；页标题写结论，不写栏目名\n- [ ] 每页都有导语句（18pt，**居中**），且只强调一处\n- [ ] 数据表的**同比行/环比行整行橙底 `#F4B083`**\n- [ ] 口径注在**右下角右对齐**\n- [ ] 小结页有\"亮点\"和\"暗点\"两段\n- [ ] 结尾页「感谢观看」四字分开排\n\n**纪律**\n- [ ] 数据表下方有口径注\n- [ ] 应收/实收/GMV、成交/核销/支付没有混用\n- [ ] 单渠道数据没有被说成全渠道\n- [ ] 没有替老板拍板目标、奖金、定价数字\n- [ ] 未使用补单、霸王餐、诱导删评等高风险方法\n\n**容量**（超出就拆页，不缩字号）\n- [ ] 页标题 ≤20 字\n- [ ] 导语句 ≤40 字\n- [ ] 小结条目 ≤35 字\n- [ ] 单页正文块 ≤4 个\n- [ ] 引语页 ≤1 个判断\n\n---\n\n## 七、边界\n\n- 不改内容、不改数据、不改结论。发现内容有问题，退回上游，不在排版层修。\n- 不新增原版式里没有的页型。确实需要新页型，先在 `references/geometry.md` 里补出坐标规范，再使用。\n- 不套用外部模板。这套版式的识别点是：左上橙红方块 + 全宽橙红横线 + 右上门牌 logo + 数据表同比行整行橙底 + 一处红色强调。\n\n---\n\n## 八、提案版差异（做提案类交付物时用）\n\n提案（`零售品牌 A提案确定版.pptx`）与复盘**是同一套设计语言，但数值不同**。做提案时，把主轴里这几项替换掉，其余不变：\n\n| 项 | 主轴（复盘·开业复盘实测） | 提案版 |\n|---|---|---|\n| 结构主色 | `#EA4809` | `#E84B12` |\n| 左上色块 | 0.09 / 0.27 / 0.44×0.44 | 0.08 / 0.22 / 0.43×0.43 |\n| 全宽横线 | y=0.86 h=0.06 | y=0.88 h=0.03 |\n| 页标题 | **24pt `#000000`**（问题页 20pt） | **21pt `#231D19`**，全篇统一 |\n| 右上 logo | 11.22 / 0.24 / 1.69×0.51 | 11.15 / 0.20 / 1.82×0.55 |\n| 导语句 | 18pt，**居中**，黑+红 | 16pt `#663A2B`，**左对齐** |\n| 封面 | 白底简版 | 满版设计图 |\n| 目录 | 「目录」40pt ＋ 四行 28pt `#EA4809` | 四行：编号＋段名＋短线＋说明 |\n| 章节页 | 带顶线＋logo，章节名左对齐 x=6.52 | **无 logo、无顶线**，章节名右对齐 x=8.63 |\n| 结尾页 | 「感谢观看」四字分开 40pt ＋下方橙线 | 15pt `#E84B12` ＋ 「THANK YOU」12pt |\n| 卡片系 | `#F1F1F1`/`#D9D9D9`/`#000000` | `#FFFAF2`/`#DECDBC`/`#643E2F` |\n\n> 两版都**不该继承**的东西：提案自己用了三个几乎一样的橙（`#E84B12`/`#EA490A`/`#EA5C24`）；开业复盘的页标题字号有四种、章节名对齐方式不统一。**规范里给的是归一化后的整数刻度，照规范做，不要照原文件做。**\n\n---\n\n## 九、版式来源\n\n| 样本 | 文件 | 页数 | 用途 |\n|---|---|---:|---|\n| 复盘版（主轴） | `~/Desktop/零售品牌 A/零售品牌 A 开业复盘&工作沟通会-0710.pdf` | 65 | 主轴数值全部实测自该文件 |\n| 提案版 | `~/Desktop/零售品牌 A/零售品牌 A提案确定版.pptx` | 85（实际 84，page 46 缺号） | 第八章差异对照；P5/P6/P7/P9 的坐标来源 |\n\n逐页型的完整坐标表、两份样本的实测数据、提取陷阱与可复现脚本，见 `references/geometry.md`。\n\n> ⚠️ 提案 PPTX 的 `theme1.xml` 是 **Office 2007 默认主题**（Calibri + 4F81BD 蓝），**配色与字体全部写在页面内联属性上，不在主题里**。分析版式必须逐页读 slide XML；读主题会得出完全错误的结论。\n\n---\n\n## 十、本版待调项（v1，留到内容定稿后处理）\n\n模板 v1 已冻结。以下是已知需要调整或需要客户方确认的点，**调格式那轮一起处理，现在不动**：\n\n| # | 待调项 | 现状 | 谁定 |\n|---|---|---|---|\n| 1 | 目录页、引语/观点页要不要加 logo | 按原文件**没放**（原版这两页是光的） | Mirror |\n| 2 | 要不要加「运营中台」水印底 | 开业复盘 PDF 有一层浅灰重复水印，提案 PPTX 没有 → 判为 PDF 导出保护水印，模板**没加** | Mirror 确认 |\n| 3 | 页标题两档制（一级 24 / 问题页 20pt） | 从开业复盘读出的层级；原文件另有 21、23pt 未统一 | Mirror 认可后写死 |\n| 4 | 三卡阵列卡片配色 | 已从提案棕系归一为 `#F1F1F1`/`#D9D9D9`/编号橙灰 | 看效果再调 |\n| 5 | P6 数据条对比页留不留 | 该页型只有提案有，开业复盘未出现 | 内容定稿后决定 |\n| 6 | P7 双栏对比卡图片比例 | 主图 2.02×3.58、副图 1.42×1.72（提案实测） | 看实际图源比例 |\n| 7 | 内容页正文字号 14 还是 16pt | 原文件两档都在用 | 内容量上来后定 |\n\n（等 1、2、3 项确认后，改 `references/build_template.py` 顶部常量重跑即可出 v2。）\n",
  "s05": "---\nname: user-insight-report\ndescription: 用户需求洞察报告技能。把区域性餐饮/烘焙品牌的主动问卷 CSV 与被动评价（美团点评/抖音/大众点评）转成可执行的经营结论与报告（HTML 问卷画像报告 / Word 策略型诊断 / Word 诊断型报告）。当客户要做用户画像、选购偏好、决策因素排序、竞品心智、口碑短板、需求缺口、差异化定位，或要把「问卷＋评价」两路合并成洞察章节时使用。不用于把已定稿结论排成 PPT（→ cake-ppt-layout），不用于把用户证据写进经营复盘（→ cake-client-review），不用于周报/月报。\nagent_created: true\n---\n\n# 用户需求洞察报告技能\n\n把两类非结构化用户声音——主动问卷、被动评价——转成客户能认账的经营结论和报告。\n\n权威底稿：`references/workflow.md`，为资料库文档《用户需求洞察报告·可复用工作流》全文（Miro 基于 2026-08「零售品牌 A」首轮实操逆向整理，2026-10-16 建档），仅做组件标签 → Markdown 的版式转换，**结论、数字、口径、章节顺序未改动**。本文件只给流程、纪律与索引；两者冲突时以底稿为准，不得用本文件覆盖底稿里的结论。\n\n## 一、三条铁律（每次执行都守）\n\n1. **不臆造。** 每个数字必须能追到源文件与口径；没拿到的数据留空或标「待补」，不编、不推算、不拿上一期数字顶替。底稿第九章列了四条**已知口径问题（待复核）**——「317 份问卷」（历史成品实为 228 份 / 去重后 86 份）、「1,500 条评价」（脚本统计 1,560 条）、样本收集期「6–9 月」与「5–8 月」冲突、连锁品牌 B与零售品牌 A评价数据混放——引用前必须核对，**不得当已核实事实使用**；发现结果与源文件不一致时立即同步，不自行抹平。\n2. **先列资料清单、确认客户，再动手。** 按底稿第二章列出所需输入，确认客户身份与对应成品形态；**源文件字段与列名先核对再统计**，禁止凭经验套列名（评价表列位置因表而异，问卷多选是「一个选项一列」）。缺文件就明说缺什么，不用相似文件凑数；任何数据改动先确认再执行。\n3. **人工环节不得伪装成算法输出。** 差评 7 类归因、竞品清单与「用户心智」词、报告核心结论 3–5 条，必须逐条读原文人工判断；**换客户/换周期一律重做**。报告里写明哪些是脚本算的、哪些是人工标的。\n\n## 二、何时用 / 何时不用\n\n| 场景 | 走哪 |\n|---|---|\n| 客户要独立的用户画像、选购偏好、竞品感知、口碑诊断、需求缺口报告 | **本技能** |\n| 复盘 PPT 里要几页「用户需求洞察」 | 本技能产出结论 → 交 `cake-client-review` / `cake-ppt-layout` |\n| 只是复盘里引用问卷/评价证据，不出独立报告 | `cake-client-review`（其「用户侧证据的用法」章） |\n| 周报 / 月报 / 经营数据播报、已定稿内容只做排版 | 对应周月报流程 / `cake-ppt-layout`，不用本技能 |\n\n## 三、开工动作（顺序不跳）\n\n1. **定客户 + 定形态**：按底稿第一章三选一——问卷单体报告（HTML，8 章 + 12 图）/ 策略型诊断（Word，4 节 ≤8 页）/ 诊断型报告（Word，6 页）——确认页数或章节目标。\n2. **列清单**：照底稿第二章逐项确认输入到位；评价侧先探查 sheet 名 / shape / 列名 / 前 3 行，问卷侧先读表头与字段构成。\n3. **定时间窗口并写进封面 meta**。零售品牌 A取 2025-01-01 起（长期品牌叙事）、连锁品牌 B取近 3 个月——换客户重新定，不沿用。\n4. **声明样本性质**：问卷随什么活动发放、是否偏新客/达人/打卡人群；评价高分率是否异常（存在引导好评可能）。写进口径卡，不藏在附录。\n5. **两路并行跑**（底稿第三、四章），**合并**按第五章 12 个维度表求交集，落成「机会点 / 差异化落点 / P0–P2 行动表」。\n6. **出稿**按第六章骨架；**交付前逐条过第七章 18 个坑 + 第八章换客户必改项**。\n\n## 四、两路执行流程（速查）\n\n**问卷路（5 步）**：清洗探针（只打印不落盘）→ 去重裁定（先逐字段比对差异，再按 `开始答题时间` 升序保留最早一条，避免误杀共用手机号的家人）→ 统计（单选归一 / 多选计数 / 7 组交叉 → `stats.json`）→ 开放题关键词词典打标（→ `text_analysis.json`）→ 12 张图 → 单文件 HTML（base64 内嵌图表）。\n\n**评价路**：探查 → 字段归一（抖音「推荐等级」是「5星」文本，需正则取值）→ 导出全量 CSV → 按时间导出全部原文 → **人工逐条归因（7 类框架）** → 指标与 4 图 → 品牌侧图 → Word 报告 → 页数校准。\n\n**合并**：口碑健康度 + 短板聚类（评价路）× 画像 + 决策因素 + 竞品 + 需求缺口（问卷路）→ 差异化落点与行动表。\n\n> **脚本说明**：底稿中的 `step1_clean.py` … `build_*_report.py`、`_helpers.py` 是 Windows 实操记录（`D:\\工作\\...`），**未随本技能附带，当前环境也不存在**。复用时按上述流程重建脚本，不要假装可以直接调用。所有硬编码 N、分组样本量、题号列名、选项字典、Q10/Q12 关键词词典、时间窗口、品牌色必须按新客户重填——底稿第八章 B 节逐文件列了要改的项。\n\n## 五、口径纪律（最容易翻车的）\n\n- **负面率 ≠ 问题率**：前者 = 星级 ≤3 条数 / 当期评价总数；后者 = 正文提及具体不足的条数 / 当月两平台评价合计（含好评中的瑕疵）。不可混用，不可并列成同一个数。\n- **多选占比分母 = 总样本 N**（不是选择人数，占比之和可 >100%）；空值判定只能用 `pd.isna()`，不能用 `str().strip() != \"\"`。\n- **交叉分析用组内分母**，避免总体掩盖差异。\n- **平台档位不同**：美团中评 3.5 星、抖音中评 4 星，抖音无 4.5 星档；评分分布对比必须标注。\n- **小样本只作方向性提示**（如单月 16 条评价），不下「新趋势」判断。\n- **口径冲突必须双计并注明**（零售品牌 A价格意愿一列混了 103 人答价格档位、123 人答消费心态）。\n- **「用户在意」≠「能构成差异」**：同行都做到的属及格线（信任项，如实标注但不做主角）；只有自己做到或同行没说的才配当品牌语言主角。\n- **差评是排除性证据，不是指令性证据**：只能定位可验证的具体问题或提出待验证假设，不能直接外推成品牌整体策略；要升级必须先有全量数据验证。\n- **同一份报告不混用两套开放题归类结果**（关键词词典 / 人工逐条归类，二选一）。\n- 每个数据表、图下方写口径注：统计范围、金额或行为口径、是否剔除、样本量、时间窗口。\n\n## 六、表达与交付\n\n- 结论写经营语言，不写框架缩写；核心结论 3–5 条由人工把指标「翻译」成经营判断。\n- 引用用户原话用数据里真实出现的词，不套行业词；典型原声需可追溯。\n- Word 版式可复用 `_helpers.py` 的样式规范（红/绿高亮 `⟪…⟫` / `⟦…⟧` 由 `rich_para` 解析），换客户一般只改品牌色常量与页眉页脚品牌名。\n- 对外发送前必须获得明确授权；文件名含客户名 + 报告类型 + 日期。\n\n**交付前检查**\n\n- [ ] 每个数字有来源与口径注；第九章四条待复核数字未被当成事实\n- [ ] 负面率 / 问题率、应收 / 实收、订单 / 人数未混用\n- [ ] 样本性质、时间窗口、评价高分率异常已写进口径卡\n- [ ] 差评分类、竞品心智词、核心结论为人工产出且可追溯\n- [ ] 底稿第八章「必须修改的参数」逐项过完，无遗留硬编码 N 与旧客户文案\n- [ ] 结论未越界：差评未外推成品牌策略，同行通用项未被当成差异点\n- [ ] 成品形态与客户诉求一致，页数 / 章节达标\n\n## 七、底稿索引（按需读 `references/workflow.md`）\n\n| 要做的事 | 章节 |\n|---|---|\n| 选成品形态、定输出维度 | 一 |\n| 列输入清单、核对字段列名 | 二 |\n| 问卷清洗 / 统计 / 打标 / 出图 / HTML | 三 |\n| 评价字段归一、指标口径、差评 7 类 | 四 |\n| 两路合并的 12 个分析维度 | 五 |\n| HTML 8 章 / Word 4 节标准骨架 | 六 |\n| 18 条实操坑 | 七 |\n| 换客户必改项、执行顺序、必须人工补的部分 | 八 |\n| 四条待复核口径问题 | 九 |\n| 环境与依赖（Windows Python venv、库版本、中文字体、样式库） | 十 |\n\n检索提示：`grep -n \"负面率\\|pd.isna\\|硬编码\\|人工标注\" references/workflow.md`。\n",
  "s06": "---\nname: xhs-influencer-screening\ndisplay_name: 小红书投放筛号专家\ndescription: 小红书达人投放筛号与综合评分。输入一批小红书博主链接（常为 xhslink.cn 短链，常混带粉丝数标注），解析主页 → 批量采集笔记列表与详情 → 按「近7/15天点赞、赞藏评比例、30天目标品类占比、主页美食垂直度、爆文率、越近的笔记越重要」六条规则算综合分，产出一份 4 分页 HTML 结论页（整合结论 / 总览带博主链接 / 点赞明细带笔记链接与百赞标签 / 品类明细带笔记链接）+ 3 个 CSV。当用户提到「小红书筛号」「达人筛选」「投放选号」「博主排名」「达人数据整理」「帮我看这批博主」「7天15天点赞」「赞藏评比例」「爆文率」「茶饮烘焙类笔记」或一次性给出多个博主链接要求做表格/结论时使用。不适用于单篇笔记采集（走 xhs-note-scraper）或单个账号的每日增量同步（走 xhs-notes-workflow）。\nagent_created: true\nversion: 1.0.0\ntags: 小红书,达人筛选,投放,评分,数据采集,茶饮烘焙\n---\n\n# 小红书投放筛号专家\n\n把「一堆博主链接 + 几条口头评分规则」变成一份可复核、可直接拿去定投放名单的结论页。核心不是抓数据，是**让每个分数都能追到原始数字，且不编造任何缺失值**。\n\n## 何时用\n\n命中任一即用：\n\n- 一次性给出多个小红书链接（短链为主），要求「整理成表格」「排个名」「给个结论」\n- 明确要看 7 天 / 15 天点赞、赞藏评比例、近 30 天某品类笔记数量与占比\n- 要求评估达人「垂直度」「爆文率」「近期流量」，或问「该投谁」\n- 复用本技能的评分规则，换一批博主、换一个品类重跑\n\n不适用：\n\n- 只采一两篇笔记的详情 → `xhs-note-scraper`\n- 单个自有账号的每日增量采集 + 企微表格同步 → `xhs-notes-workflow`\n- 只要一份原始数据、不需要评分结论 → 只跑第 0–3 步，跳过 04/05\n\n## 前置条件\n\n1. **专用调试 Chrome**：用固定 `--user-data-dir` 启动并保持窗口开启，端口 9222：\n   ```\n   \"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\" --remote-debugging-port=9222 --user-data-dir=\"<固定 profile 目录>\" --no-first-run --no-default-browser-check https://www.xiaohongshu.com\n   ```\n   macOS 上（本机安装时补充，2026-11-10）：\n   ```\n   \"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\" --remote-debugging-port=9222 --user-data-dir=\"$HOME/.xhs-chrome-profile\" --no-first-run --no-default-browser-check https://www.xiaohongshu.com\n   ```\n   首次在该窗口手动登录小红书；登录态留在 profile 长期复用。用 `curl -s http://127.0.0.1:9222/json/version` 确认端口就绪。\n2. **Node.js >= 22**：`01/03` 步使用全局 `WebSocket`（Node 22 起内置），Node 18 会报 `WebSocket is not defined`。`00/04/05` 步使用内置 `fetch`。\n3. **登录态验证**：开一个主页确认显示昵称/粉丝数；cookie `web_session` 存在即可。\n4. 在一个空工作目录执行全部命令。脚本按**当前工作目录**读写相对路径文件，输出也落在该目录。\n\n## 输入\n\n| 文件 | 来源 | 说明 |\n|---|---|---|\n| `links_raw.txt` | 用户给的链接 | 每行 `<短链或长链> [备注]`，见 `assets/links_raw.example.txt` |\n| `keywords.json` | 复制 `assets/keywords.example.json` | `tea` / `bake` 两组标题关键词，按目标品类改 |\n| `config.json` | 可选，复制 `assets/config.example.json` | 权重、窗口、阈值、活动稿正则、等级线 |\n| `manual.json` | 可选，格式见 `assets/manual.example.json` | 人工看主页后的垂直度评分/判词、逐人论据与风险点评 |\n\n**执行前必做**：把用户给的原始标注（昵称、粉丝数）与链接清单列出来确认；用户标注的粉丝数常与实测有时点差异，或把「获赞收藏数」误当粉丝数，**差异一律保留并在报告里写明，不抹平**。\n\n## 执行流程\n\n按顺序在**同一个工作目录**运行 `scripts/` 下的脚本：\n\n```bash\nSK=<本技能目录>/scripts\nnode $SK/00_resolve_links.mjs links_raw.txt      # -> links.json（含类型判断）\nnode $SK/01_batch_profiles.mjs                   # -> profiles_all.json（主页元信息 + 全部笔记列表）\nnode $SK/02_prepare.mjs                          # -> all_rows.json / detail_targets.json（时间窗口 + 品类分类 + 补采优先级）\nMIN_GAP_MS=1200 MAX_GAP_MS=2000 node $SK/03_note_detail.mjs   # -> details/details_all.json（收藏/评论/分享）\nnode $SK/04_score.mjs                            # -> score_data.json\nnode $SK/05_render.mjs                           # -> 小红书投放筛号_综合结论.html + final_csv/*.csv\n```\n\n### 第 0 步｜短链解析与类型确认（不可跳过）\n\n- 用 `GET` + 浏览器 UA 解 302 链，最多 5 跳，识别 `user/profile/{userId}` 还是 `explore/{noteId}`。\n- **`xhslink.cn/o/...` 分享短链经常解出的是博主主页而不是笔记**。若用户以为给的是笔记链接、或反之，**先明确告知再继续**，否则会把 24 位 userId 误当 noteId 导致全盘失败。\n- 解出笔记链接的条目写入 `notes_only.json` 单列，不进主页流程。\n- 输出 `links.json` 必须含 `idx / label / userId / token / url / type`。\n\n### 第 1 步｜主页列表采集\n\n- 读 `links.json`，逐个导航到 `user/profile/...`，从 SSR 的 `window.__INITIAL_STATE__` 取 `user.notes`（Vue ref 需 unwrap `_value`）。\n- 每项 `noteCard` 取 `noteId / displayTitle / time(ms) / interactInfo.likedCount / xsecToken / type / sticky`。\n- 主页元信息（昵称/粉丝/小红书号/IP/获赞收藏/笔记数）从 `document.body.innerText` 按标签前一行取，比 HTML 正则稳。\n- 支持 `01_batch_profiles.mjs 1,2,3` 只跑指定 idx 做试跑；试跑通过再全量。失败写 `profiles/failed.json`，可单独重跑。\n\n### 第 2 步｜时间窗口 + 品类判定\n\n- 窗口按**北京时间自然日、含今天**：近 7 天 = 今天往前 6 天，15 天 = 往前 14 天，30 天 = 往前 29 天。\n- 分类按标题关键词命中：`tea` + `bake` 都命中 → 「茶饮+烘焙」，只命中一类 → 对应类，否则「其他」。命中词逐条保留供复核。\n- 输出 `detail_targets.json` 的补采优先级：目标品类（近30天）→ 近7天全品类 → 近15天 → 其余。\n- **必须复核分类结果**：打印近30天命中清单，补漏关键词；仅靠 emoji 或「甜品/饮品」等泛词命中的标「弱·建议复核」，**不擅自剔除**。\n\n### 第 3 步｜详情补采\n\n- 收藏/评论/分享只有详情页有，主页列表没有。按优先级补采，用 `LIMIT=N` 控制每轮篇数，`MIN_GAP_MS/MAX_GAP_MS` 控制间隔。\n- 已采结果累积在 `details/details_all.json`，重跑自动跳过已完成项，可断点续跑。\n- **不要等 `Page.loadEventFired`**（SSR 直出，白等约 12 秒）；导航后约 1.2 秒轮询读 `noteDetailMap` 即可，约 3 秒/篇。\n- **0 值陷阱**：平台对 0 赞/0 藏/0 分享/0 评论返回空字符串 `\"\"`，不是缺字段。按 0 处理（抽样验证过），绝不当缺失；「1.2万」等缩写换算成数字。\n- 报告里必须写明覆盖率（已采详情 / 近30天笔记数），未采到的收藏/评论显示「—」，**不编造**。\n\n### 第 4 步｜综合评分\n\n六条规则与默认权重（完整推导见 `references/scoring.md`）：\n\n| 维度 | 权重 | 构成 |\n|---|---|---|\n| A 近期流量势能 | 35 | 时间加权点赞 WAL 22 + 近7天篇均赞 13 |\n| B 内容垂直度 | 25 | 30天品类占比 15 + 主页美食风格 10 |\n| C 爆文能力 | 20 | 近15天相对爆文率 10 + 近30天 6 + 最高单篇赞 4 |\n| D 互动健康度 | 20 | 赞:藏:评 逼近 1:1:1 的程度 × 样本可信度 |\n\n- 时间衰减阶梯：近7天 ×1.0 / 8–15天 ×0.5 / 16–30天 ×0.2，体现「越近的流量越重要」。\n- 全部归一用 **log1p 对数 min-max**：一条千赞爆文用线性归一会把其余人全压成 0。\n- **相对爆文阈值必须按本批数据分位数复核**：先看近30天 p50/p90 与破百赞篇数。若 100 赞只有寥寥几篇，改用 p75 附近（如 30 赞）作「相对爆文」，并把 100 赞保留为明细表的绝对标签；在结论页写清为什么下调。\n- 小样本折扣：近30天不足 10 篇 → 品类占比按 `篇数/10` 折算；详情不足 10 篇 → 互动分按 `已采篇数/10` 折算。\n- **集中活动稿要单列**：用 `marketPattern` 识别同一场市集/面包节/咖啡节的集中投放稿，除「原始品类占比」外再给「剔除活动稿后占比」。某号占比 37.5% 但全是活动稿时，剔后为 0，不能按常态产能采信。\n- 风格垂直度优先用 `manual.json` 的人工评分；缺失时按标题美食词占比粗估，并明确标注「机器估计·建议人工复核」，**不得冒充人工看页结论**。\n- 逐人论据/风险优先用 `manual.json`；缺失时按数字自动生成模板句，不编造定性判断。\n\n### 第 5 步｜出结论页\n\n固定 4 个分页，不多不少：\n\n1. **整合结论**：一句话主推 + 综合排名（含逐人数据论据与风险列）+ 分用途选人（要流量 / 要品类种草，通常结论不同）+ Top3 评分卡 + 垂直度分榜 + 六条关键数据发现 + 时间衰减对照 + 权重表 + 口径与限制\n2. **总览**：全部博主原始指标，**带可点击主页链接**\n3. **点赞明细**：近30天全部笔记，**带可点击原文链接 + 百赞/大爆款/准爆标签**，带搜索与筛选\n4. **品类明细**：近30天目标品类笔记，**带可点击原文链接 + 命中关键词 + 弱命中/活动稿标记**\n\n同时输出 3 个带 BOM 的 CSV（总览 / 点赞明细 / 品类明细）。\n\n**结论页必须给出「原因 + 数据论据」**：每个排名都要有一句能追到具体篇数、赞数、占比、比率的论据；主推结论要说明硬伤；流量榜与垂直榜不一致时要给「分用途选人」，不能只丢一张总分表。\n\n## 铁律\n\n1. **不编造数据**：未采详情的收藏/评论留空，0 值与缺失严格区分；任何数字要能追到源字段。\n2. **不抹平差异**：用户标注与实测不符、口径冲突、样本异常，一律原样列出并标注，不在正文里悄悄修正。\n3. **风控优先**：一旦出现安全限制页、接口 461/429/403、`error_code=300012`（IP 级风控）或连续详情页异常，立即暂停并报告，不短时重试；宁可漏一批，不可搞进风控。用户明确要求「本次放宽重试」时，仅对**本次任务**临时放宽，不改长期规则。IP 级风控（`300012`）换网络出口才有效，等待无效。\n4. **技术细节见** `references/field-notes.md`（SSR 结构、noteId 时间戳、CDP 轮询、短链/接口坑位）；评分推导与调参见 `references/scoring.md`。\n5. **合规**：采集第三方平台数据前确认符合平台协议与当地法规；本技能只提供技术实现，不构成合规保证。\n\n## 交付前自检\n\n- [ ] 短链类型已确认并告知用户（主页 vs 笔记）\n- [ ] 全部博主均采到，失败清单为空\n- [ ] 分类命中清单已复核，泛词/emoji 弱命中已标注\n- [ ] 0 值未被当成缺失；收藏/评论覆盖率已写进报告\n- [ ] HTML 4 个分页、链接可点、百赞标签正确、无 `undefined`/`NaN`\n- [ ] 结论页有权重表、口径说明、风险提示、双用途选人\n- [ ] CSV 行数与明细表一致\n\n## 版本\n\nv1.0.0（2026-11-10）：从一次 19 位徐州本地探店号筛号任务沉淀；已用同一批数据回归验证，排名与分数完全一致。\n",
  "h5/voice-clone-h5/index": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1\" />\n<title>MiniMax 音色克隆<\/title>\n<style>\n  :root {\n    --bg: #0f0d1a;\n    --bg-soft: #1a1730;\n    --card: rgba(255, 255, 255, 0.04);\n    --card-border: rgba(255, 255, 255, 0.08);\n    --text: #f5f3ff;\n    --text-dim: #a8a4c4;\n    --text-faint: #6e6a8a;\n    --accent: #a78bfa;\n    --accent-2: #f472b6;\n    --accent-3: #60a5fa;\n    --success: #4ade80;\n    --error: #fb7185;\n    --warning: #fbbf24;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    font-family: -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", sans-serif;\n    background: var(--bg);\n    color: var(--text);\n    min-height: 100vh;\n    overflow-x: hidden;\n    line-height: 1.6;\n  }\n\n  /* 背景渐变球 */\n  body::before, body::after {\n    content: \"\";\n    position: fixed;\n    border-radius: 50%;\n    filter: blur(120px);\n    opacity: 0.3;\n    pointer-events: none;\n    z-index: 0;\n  }\n  body::before {\n    width: 500px; height: 500px;\n    background: var(--accent);\n    top: -150px; right: -100px;\n  }\n  body::after {\n    width: 400px; height: 400px;\n    background: var(--accent-2);\n    bottom: -100px; left: -100px;\n  }\n\n  .container {\n    position: relative;\n    z-index: 1;\n    max-width: 640px;\n    margin: 0 auto;\n    padding: 32px 20px 80px;\n  }\n\n  header {\n    text-align: center;\n    margin-bottom: 36px;\n  }\n  header h1 {\n    font-size: 32px;\n    font-weight: 700;\n    letter-spacing: -0.5px;\n    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    -webkit-text-fill-color: transparent;\n    margin-bottom: 8px;\n  }\n  header p {\n    color: var(--text-dim);\n    font-size: 14px;\n  }\n\n  .card {\n    background: var(--card);\n    border: 1px solid var(--card-border);\n    border-radius: 20px;\n    padding: 24px;\n    margin-bottom: 20px;\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n  }\n\n  .step {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    margin-bottom: 16px;\n  }\n  .step-num {\n    width: 28px; height: 28px;\n    border-radius: 50%;\n    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);\n    color: white;\n    font-size: 13px;\n    font-weight: 600;\n    display: flex; align-items: center; justify-content: center;\n    flex-shrink: 0;\n  }\n  .step-num.done {\n    background: var(--success);\n  }\n  .step-num.pending {\n    background: var(--bg-soft);\n    color: var(--text-faint);\n  }\n  .step-title {\n    font-size: 17px;\n    font-weight: 600;\n  }\n  .step-desc {\n    color: var(--text-dim);\n    font-size: 13px;\n    margin-top: 2px;\n  }\n\n  label {\n    display: block;\n    color: var(--text-dim);\n    font-size: 13px;\n    margin-bottom: 8px;\n  }\n\n  input[type=\"text\"], input[type=\"password\"], textarea {\n    width: 100%;\n    background: var(--bg-soft);\n    border: 1px solid var(--card-border);\n    border-radius: 12px;\n    padding: 12px 14px;\n    color: var(--text);\n    font-size: 14px;\n    font-family: inherit;\n    transition: border-color 0.2s, background 0.2s;\n  }\n  input:focus, textarea:focus {\n    outline: none;\n    border-color: var(--accent);\n    background: rgba(167, 139, 250, 0.05);\n  }\n  textarea {\n    min-height: 140px;\n    resize: vertical;\n    line-height: 1.7;\n  }\n\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    padding: 12px 20px;\n    border-radius: 12px;\n    border: none;\n    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);\n    color: white;\n    font-size: 15px;\n    font-weight: 600;\n    cursor: pointer;\n    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;\n    font-family: inherit;\n  }\n  .btn:hover:not(:disabled) {\n    transform: translateY(-1px);\n    box-shadow: 0 8px 20px rgba(167, 139, 250, 0.3);\n  }\n  .btn:active:not(:disabled) { transform: translateY(0); }\n  .btn:disabled {\n    opacity: 0.4;\n    cursor: not-allowed;\n  }\n  .btn-block { display: flex; width: 100%; }\n  .btn-ghost {\n    background: transparent;\n    border: 1px solid var(--card-border);\n    color: var(--text-dim);\n  }\n  .btn-ghost:hover:not(:disabled) {\n    background: var(--card);\n    color: var(--text);\n    box-shadow: none;\n  }\n\n  .upload-zone {\n    border: 2px dashed var(--card-border);\n    border-radius: 16px;\n    padding: 36px 20px;\n    text-align: center;\n    cursor: pointer;\n    transition: border-color 0.2s, background 0.2s;\n  }\n  .upload-zone:hover, .upload-zone.dragging {\n    border-color: var(--accent);\n    background: rgba(167, 139, 250, 0.05);\n  }\n  .upload-zone .icon {\n    font-size: 36px;\n    margin-bottom: 8px;\n  }\n  .upload-zone .text {\n    color: var(--text-dim);\n    font-size: 14px;\n  }\n  .upload-zone .hint {\n    color: var(--text-faint);\n    font-size: 12px;\n    margin-top: 4px;\n  }\n  .upload-zone.has-file {\n    border-style: solid;\n    border-color: var(--success);\n    background: rgba(74, 222, 128, 0.05);\n  }\n\n  .badge {\n    display: inline-block;\n    padding: 3px 10px;\n    border-radius: 999px;\n    font-size: 11px;\n    font-weight: 500;\n    background: var(--bg-soft);\n    color: var(--text-dim);\n  }\n  .badge.success {\n    background: rgba(74, 222, 128, 0.15);\n    color: var(--success);\n  }\n  .badge.warning {\n    background: rgba(251, 191, 36, 0.15);\n    color: var(--warning);\n  }\n\n  .toast {\n    position: fixed;\n    top: 20px; left: 50%;\n    transform: translateX(-50%) translateY(-20px);\n    padding: 12px 20px;\n    background: var(--bg-soft);\n    border: 1px solid var(--card-border);\n    border-radius: 12px;\n    color: var(--text);\n    font-size: 14px;\n    z-index: 100;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 0.3s, transform 0.3s;\n    max-width: 90%;\n  }\n  .toast.show {\n    opacity: 1;\n    transform: translateX(-50%) translateY(0);\n  }\n  .toast.error { border-color: var(--error); color: var(--error); }\n  .toast.success { border-color: var(--success); color: var(--success); }\n\n  .result-item {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    padding: 12px;\n    background: var(--bg-soft);\n    border-radius: 12px;\n    margin-bottom: 8px;\n  }\n  .result-item .num {\n    width: 24px; height: 24px;\n    border-radius: 50%;\n    background: var(--card-border);\n    color: var(--text-dim);\n    font-size: 12px;\n    display: flex; align-items: center; justify-content: center;\n    flex-shrink: 0;\n  }\n  .result-item .info {\n    flex: 1;\n    min-width: 0;\n  }\n  .result-item .info .text {\n    font-size: 13px;\n    color: var(--text);\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n  .result-item .info .meta {\n    font-size: 11px;\n    color: var(--text-faint);\n    margin-top: 2px;\n  }\n  .result-item .download {\n    padding: 6px 12px;\n    border-radius: 8px;\n    background: var(--accent);\n    color: white;\n    text-decoration: none;\n    font-size: 12px;\n    font-weight: 500;\n    cursor: pointer;\n    border: none;\n  }\n\n  audio { width: 100%; margin-top: 8px; }\n\n  .demo-audio {\n    margin-top: 12px;\n    padding: 12px;\n    background: rgba(74, 222, 128, 0.05);\n    border: 1px solid rgba(74, 222, 128, 0.2);\n    border-radius: 12px;\n  }\n  .demo-audio .label {\n    color: var(--success);\n    font-size: 12px;\n    margin-bottom: 6px;\n  }\n\n  .stats {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px;\n    margin: 16px 0;\n  }\n  .stat {\n    background: var(--bg-soft);\n    border-radius: 12px;\n    padding: 12px;\n    text-align: center
